  note: "The page shows no machine date; its text says 'Op het moment van publicatie (oktober 2025)'. Situation 6, 'Patiënt verkrijgt medicatie via andere route': a patient can obtain medication through other (commercial) routes, for example the internet; follow-up and checks belong with the prescriber. 'De huisarts draagt geen verantwoordelijkheid voor periodieke controles bij elders verkregen medicatie. De huisarts heeft wel een rol in het signaleren van bijwerkingen en complicaties van dergelijke middelen.' 'De patiënt is verantwoordelijk behandelaren te informeren over het medicatiegebruik.' Guidance for GPs about weight-loss medicines; not a rule about peptides."

