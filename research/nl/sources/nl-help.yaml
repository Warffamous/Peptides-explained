  container: "Trimbos-instituut, Utrecht (TRI-41-037)"
  year: 2026
  url: https://www.trimbos.nl/kennisbank/tri-41-037-harm-reduction-in-nederland/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Report page dated 23 June 2026 (38 pages; PDF at https://www.trimbos.nl/wp-content/uploads/2026/06/TRI-41-037_Harm-reduction-in-Nederland.pdf, downloaded and read; its colophon prints article number TRI-41-036, the report page TRI-41-037). Funded by the Ministry of VWS. Section 4.1: 'In totaal telden we 23 gebruiksruimten (14 steden), 17 MHU's (16 steden) en 29 spuitomruil locaties (19 steden)'; 'Net als in de vorige inventarisatie (2022) konden we 29 locaties in 19 steden identificeren, maar dit betreft vrijwel zeker een onderschatting'; 'naast verslavingszorginstellingen ook apotheken of GGD-locaties waar je spuiten kunt omruilen'. Section 4.4 (fact-check): spuitomruil is often done alongside other work, 'bij gebruiksruimten, apotheken, GGD'en, huisartsen, maatschappelijke opvang en andere laagdrempelige voorzieningen (zoals hostels)'. Section 4.4: at one location visitors 'leveren gebruikte spuiten in en ontvangen kosteloos nieuwe exemplaren', at others after a short intake; used material is collected in closed containers and disposed of through a channel for medical waste. The report is about people who use drugs (mainly opiates and basecoke); it does not mention people who inject performance or image enhancing drugs or peptides."

