  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Modified 8 April 2024; the url is served at /themas/familie-zorg-en-gezondheid/drugs/drugsgebruik-en-verslavingszorg. 'Mensen met een drugsprobleem gaan eerst naar de huisarts. Als de problemen ernstig zijn verwijst de huisarts ze door naar de Basis-GGZ of naar de specialistische verslavingszorg.' Harm-reduction provisions for people who cannot stop include 'Gratis omwisselen van gebruikte spuiten voor nieuwe steriele spuiten. Dit verkleint de kans op besmetting met hiv of hepatitis B of C.'"

jellinek-anabole-steroiden:
  type: web
  authors: "Jellinek"
  title: "Wat zijn anabole steroïden?"
  year: 2026
