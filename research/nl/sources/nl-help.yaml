  authors: "Trimbos-instituut (DRUGSinfo)"
  title: "Zoek hulp in de buurt"
  year: 2026
  url: https://www.drugsinfo.nl/hulpkaart/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Published and modified 3 August 2026. A map of addiction-care institutions in the Netherlands. 'Wil je een behandeling? Ga dan eerst naar je huisarts. Je hebt een verwijzing van de huisarts nodig om hulp te krijgen bij een instelling voor verslavingszorg.' 'DRUGSinfo geeft geen informatie over de kwaliteit van de behandeling.'"

rijksoverheid-verslavingszorg-drugs:
  type: regulator
  authors: "Rijksoverheid (Government of the Netherlands)"
  title: "Verslavingszorg bij drugsgebruik"
