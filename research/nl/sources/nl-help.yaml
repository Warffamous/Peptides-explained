nl-zvw-art-19-eigen-risico:
  type: law
  authors: "Staten-Generaal (Zorgverzekeringswet); amount for 2027 set by the Minister van Volksgezondheid, Welzijn en Sport"
  title: "Zorgverzekeringswet, artikel 19 (verplicht eigen risico)"
  container: "wetten.overheid.nl, BWBR0018450 (text from 1 January 2027)"
  year: 2026
  url: https://wetten.overheid.nl/BWBR0018450/2027-01-01#Hoofdstuk3_Paragraaf3.4_Artikel19
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Added by the fact-check, 27 October 2026. The version in force today ('Geldend van 01-01-2026 t/m heden', https://wetten.overheid.nl/BWBR0018450/) reads art. 19(1): 'Iedere verzekerde van achttien jaar of ouder heeft een verplicht eigen risico van € 385 per kalenderjaar'; art. 19(7): indexation 'blijven buiten toepassing voor de jaren 2019 tot en met 2026'. The version from 1 January 2027 (this url, marked '[Wijziging per 01-01-2027.]') reads '€ 400 per kalenderjaar'. Its source is the Regeling van de Minister van Volksgezondheid, Welzijn en Sport van 25 september 2026, kenmerk 4527716-1104927-WJZ, houdende vaststelling van het verplicht eigen risico Zvw 2027 (Staatscourant 2026, 34372, published 30 September 2026; read at zoek.officielebekendmakingen.nl/stcrt-2026-34372.html, host not allowlisted, so written without the scheme): 'Artikel 1 Het bedrag, bedoeld in artikel 19, eerste lid, van de Zorgverzekeringswet, wordt vastgesteld op € 400. Artikel 2 Deze regeling treedt in werking met ingang van 1 januari 2027.' Its explanation repeats that GP care is exempt. Cite for: € 385 in 2026, € 400 from 1 January 2027."

nhg-2025-gewichtsreducerende-medicatie:
