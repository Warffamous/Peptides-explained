# ---------------------------------------------------------------- needle-stick injury

lci-2019-prikaccidenten:
  type: guideline
  authors: "Rijksinstituut voor Volksgezondheid en Milieu (RIVM), Landelijke Coördinatie Infectieziektebestrijding (LCI)"
  title: "Prikaccidenten. Landelijke richtlijn"
  container: "LCI-richtlijnen (RIVM)"
  year: 2019
  url: https://lci.rivm.nl/richtlijnen/prikaccidenten
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Version 2019, adopted by the LOI on 5 April 2019, interim changes up to February 2020; page modified 27 January 2026 (dateModified). Stap 0: 'Laat na het accident de prik-, snij- of bijtwond goed doorbloeden (niet stelpen) en laat de blootgestelde de wond met lauwwarm water uitspoelen, bij voorkeur onder een stromende kraan. Vervolgens moet de wond zo spoedig mogelijk gedesinfecteerd worden met een huiddesinfectans: 70% alcohol of 70% isopropanol of een (povidon)jodiumoplossing.' Scope includes citizens ('personen die zich aan zwerfnaalden verwonden'); 'Afhankelijk van de omstandigheden wendt de blootgestelde zich tot de bedrijfsarts, een speciaal meldpunt, de spoedeisende hulp, de huisarts of de GGD'. 'PEP dient bij voorkeur binnen 2 uur te worden gestart tot maximaal 72 uur na het accident'. Loose needles of unknown source: testing the needle is not useful; no HIV PEP 'behalve als er sprake is van een recent (uiterlijk 24 uur tevoren) gebruikte naald van een persoon behorende tot een groep met een verhoogd risico'. A guideline for professionals; host lci.rivm.nl is not on the allowlist (proposed)."

