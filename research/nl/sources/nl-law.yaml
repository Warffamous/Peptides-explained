# ---------------------------------------------------------------- Court decisions (anonymised)

nl-rbdha-2019-4817-postzending-eigen-gebruik:
  type: law
  authors: "Rechtbank Den Haag"
  title: "Uitspraak van 23 april 2019 op een beklag tegen het beslag op een postzending met geneesmiddelen (zaaknummer 19/619), ECLI:NL:RBDHA:2019:4817"
  container: "uitspraken.rechtspraak.nl"
  year: 2019
  url: https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBDHA:2019:4817
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read through data.rechtspraak.nl (open data) and in a browser (the site refuses scripts). Customs seized a parcel of cough lozenges ordered online from India. The court: 'Op grond van artikel 18 van de Geneesmiddelenwet is het verboden om zonder vergunning geneesmiddelen in te voeren. ... Een uitzondering geldt voor het invoeren van geneesmiddelen die kennelijk bestemd zijn voor eigen gebruik door de persoon die de desbetreffende geneesmiddelen vervoert. Daarvan is in dit geval geen sprake, nu klaagster de hoestpastilles online heeft besteld en deze dus door een ander liet vervoeren. De zending was afkomstig uit India, zodat ook van invoer sprake is.' 'De omstandigheid dat de pillen in het buitenland vrij verkrijgbaar zijn op het internet, maakt dit niet anders.' The prosecutor: 'Er zal in ieder geval geen strafrechtelijke vervolging plaatsvinden'; destruction on the basis of withdrawal from circulation. Beklag ongegrond. Published 13 May 2019."

nl-ghams-2020-536-eigen-gebruik-reiziger:
  type: law
  authors: "Gerechtshof Amsterdam"
  title: "Arrest van 21 februari 2020 over de invoer van geneesmiddelen door een reiziger (zaaknummer 23-001247-19), ECLI:NL:GHAMS:2020:536"
  container: "uitspraken.rechtspraak.nl"
  year: 2020
  url: https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:GHAMS:2020:536
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read through data.rechtspraak.nl (open data) and in a browser. 'Invoer grote hoeveelheid medicijnen; niet voor eigen gebruik.' 'Degene die de medicijnen invoert moet zelf kunnen aantonen dat deze voor eigen gebruik zijn, bijvoorbeeld middels een medische verklaring.' No set quantity does not breach the lex certa principle. The court found own use not plausible given 'de zeer aanzienlijke hoeveelheid' of pills brought from China, and imposed a fine of € 2.500, of which € 2.000 suspended (WED arts. 1, 2, 6 and Gnw art. 18). Published 25 February 2020."

# ---------------------------------------------------------------- Douane (Dutch Customs)

douane-medicijnen-reizen-2026:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Medicijnen (meenemen op reis)"
  year: 2026
  url: https://www.douane.nl/onderwerpen/reizen-en-vakantie/dit-mag-u-niet-zomaar-meenemen/medicijnen/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Publicatiedatum 26-06-2025 | Laatste update 26-10-2026'. 'Reist u naar Nederland? Dan mag u de meeste medicijnen gewoon meenemen als die voor eigen gebruik bestemd zijn. Neem de medicijnen mee in de originele verpakking.' Opiumwet medicines need a medical declaration. 'Voor bepaalde medicijnen heeft u documenten nodig. Heeft u niet de juiste documenten? Dan pleegt u een strafbaar feit en neemt de Douane de medicijnen in beslag. Daarnaast kunnen we de Inspectie Gezondheidszorg en Jeugd inschakelen voor verdere afhandeling.' Carry medicines in hand luggage."

douane-invoer-geneesmiddelen-2026:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Invoer geneesmiddelen"
  year: 2026
  url: https://www.douane.nl/onderwerpen/vgem/veiligheid/geneesmiddelen/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Publicatiedatum 26-08-2025 | Laatste update 03-09-2026'. 'U mag alleen geneesmiddelen invoeren met een vergunning. Werkzame stoffen mag u alleen invoeren met een registratie.' 'U mag in Nederland: geen geneesmiddelen zonder vergunning binnenbrengen; geen werkzame stoffen voor het maken van geneesmiddelen zonder registratie binnenbrengen'. Farmatec grants the licences for the Minister. Customs checks 'in post-, pakket- en koerierszendingen'."

douane-hvgem-geneesmiddelen-h5-fabrikantenvergunning:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Handboek VGEM, Voorschrift Geneesmiddelen, hoofdstuk 5: Fabrikantenvergunning geneesmiddelen"
  container: "Kennisbank Douane"
  year: 2026
  url: https://kennisbank.douane.nl/handboeken/hvgem/geneesmiddelen/geneesmiddelen-fabrikantenvergunning_geneesmiddelen/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Page modified 21 April 2026. §5.1: 'Op grond van de Gnw is het verboden om zonder fabrikantenvergunning geneesmiddelen in te voeren vanuit derde-landen'; EEA states count as member states; breach is an economic offence (WED art. 1 under 1°). §5.5, 'Invoer reiziger voor eigen gebruik': 'Een reiziger die geneesmiddelen invoert voor eigen gebruik is vrijgesteld van het overleggen van een fabrikantenvergunning. (Gnw, artikel 18, lid 6 sub a). Deze vrijstelling ziet dus niet op handelszendingen, of post-, pakket-, en koerier zendingen; dan moet er een fabrikantenvergunning zijn.' 'Een indicatie voor eigen gebruik is maximaal 3 x de hoeveelheid die is voorgeschreven.' The named-patient route (art. 40(3)(c) Gnw, Regeling art. 3.17) is described as the exception when treatment is not possible with medicines authorised in the Netherlands."

douane-hvgem-geneesmiddelen-h7-vaststelling-geneesmiddel:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Handboek VGEM, Voorschrift Geneesmiddelen, hoofdstuk 7: Procedure vaststelling geneesmiddel"
  container: "Kennisbank Douane"
  year: 2026
  url: https://kennisbank.douane.nl/handboeken/hvgem/geneesmiddelen/geneesmiddelen-procedure_vaststelling_geneesmiddel/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Page modified 21 April 2026. Three questions: is it a medicine, does the importer have a licence, is there an exemption. 'Een product is een geneesmiddel als het een farmaceutische vorm heeft en voldoet aan het aandieningscriterium en/of het toedieningscriterium.' 'Een bulkverpakking met een poeder, zonder informatie over de wijze van toediening, is dus geen farmaceutische vorm. Controleer of het poeder/vloeistof wel een werkzame stof voor geneesmiddelen kan zijn.' Presentation is judged mainly from labels and leaflets; a website counts 'Als op of bij het product een verwijzing aanwezig is naar een specifieke website; of Als het specifieke product wordt aangeboden op de website van de betreffende producent.' Function: 'of het product een werkzame stof bevat, in een werkzame hoeveelheid'. The Gnw can apply to products not recognisable as medicines at first sight, 'zoals cosmetica, voedingssupplementen of voedingsmiddelen'. In doubt, the Customs laboratory asks the IGJ for a 'statusbepaling'."

douane-hvgem-geneesmiddelen-h8-werkzame-stoffen:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Handboek VGEM, Voorschrift Geneesmiddelen, hoofdstuk 8: Procedure vaststelling werkzame stoffen"
  container: "Kennisbank Douane"
  year: 2026
  url: https://kennisbank.douane.nl/handboeken/hvgem/geneesmiddelen/geneesmiddelen-procedure_vaststelling_werkzame_stoffen/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Page modified 21 April 2026. 'De werkzame stoffen hebben per definitie geen farmaceutische vorm.' Customs checks reference works (Geneesmiddeleninformatiebank, Farmacotherapeutisch Kompas, WHO ATC/DDD, Martindale) and an internal 'IGJ-lijst' to tell active substances from dual-use substances; 'Voor het binnenbrengen (alleen bij post & koerierszendingen) en het invoeren van werkzame stoffen moet de importeur geregistreerd zijn.'"

douane-hvgem-geneesmiddelen-h12-fysiek-toezicht:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Handboek VGEM, Voorschrift Geneesmiddelen, hoofdstuk 12: Proces fysiek toezicht geneesmiddelen (reizigers en post-, pakket- en koerierszendingen)"
  container: "Kennisbank Douane"
  year: 2026
  url: https://kennisbank.douane.nl/handboeken/hvgem/geneesmiddelen/geneesmiddelen-proces_fysiek_toezicht_geneesmiddelen/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Page modified 11 June 2026. §12.3: the own-use exemption (Gnw art. 18(6)(a)) 'is niet van toepassing bij vooruit- of nagezonden reizigersbagage. De reiziger moet de goederen altijd bij zich dragen.' 'Een indicatie voor eigen gebruik is maximaal 3 x de voorgeschreven hoeveelheid.' §12.4.4 'Vrijstelling eigen gebruik niet van toepassing': 'de Douane houdt de goederen tegen en meldt de casus aan IGJ wanneer deze aan de voorwaarden voldoet. Bevindingen die niet voldoen aan de voorwaarden, worden door de Douane zelfstandig strafrechtelijk afgehandeld. geneesmiddelen: wanneer sprake is van een handelskarakter. Werkzame stoffen: altijd ongeacht aard en omvang zending.' §12.4.6: parcels for a private person in another member state are treated the same. §12.4.8: 'De Douane neemt de goederen in beslag en maakt een (vereenvoudigd) proces-verbaal op.' 'Er zijn lokaal afspraken gemaakt door de BFC met het OM om op te treden tegen zendingen geneesmiddelen voor eigen gebruik.' The 'IGJ-lijst' (ch. 22) is internal ('alleen intern te raadplegen')."

