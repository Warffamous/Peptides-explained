  lang: nl
  verified: url
  note: "Read through data.rechtspraak.nl ('Uitspraakdatum 2026-04-10', first published 27 May 2026; annotated in JGR 2026/33). A magazine article (three women's weight-loss stories) and a regional newspaper article (one man's story) about semaglutide products used for weight loss: two fines, EUR 28,500 and EUR 19,950 (EUR 48,450 in total, after an 80% reduction for press freedom), for art. 85 under a (public advertising for a prescription medicine) and art. 84(2) (not in line with the SmPC). Para. 7.6: 'Ook de omstandigheid dat eiseres, zoals zij heeft gesteld, geen commercieel doel of belang bij de verkoop en het gebruik van [het middel] zou hebben, maakt niet dat geen sprake is van (publieks)reclame.' Para. 7.7: an article only about off-label use that does not show all side effects and contraindications of the SmPC is not in line with the SmPC. Para. 10.1: 'Indien eiseres een zuiver informatief artikel publiceert over geneesmiddelen, dat in overeenstemming is met de samenvatting van de productkenmerken en niet kan worden aangemerkt als publieksreclame, dan zal boete-oplegging niet aan de orde zijn.' Beroep ongegrond. Title and URL name no company, but the text names the claimant (a publisher) and the brand names: never quote those. An appeal is reported by media only (status unresolved)."

nl-rbnne-2026-1471-publieksreclame-natuurlijk-persoon:
