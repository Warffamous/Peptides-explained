nl-rvs-2026-1072-publieksreclame-website:
  type: law
  authors: "Afdeling bestuursrechtspraak van de Raad van State"
  title: "Uitspraak van 25 februari 2026 over bestuurlijke boetes voor publieksreclame voor receptgeneesmiddelen op een informatiewebsite (zaaknummer 202405818/1/A2), ECLI:NL:RVS:2026:1072"
  container: "uitspraken.rechtspraak.nl"
  year: 2026
  url: https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RVS:2026:1072
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read through data.rechtspraak.nl (open data: 'Uitspraakdatum 2026-02-25', 'Publicatiedatum 2026-02-25'); the reader page answers HTTP 200. The owner of a website (an organisation, pseudonymised) had posted articles, a sample letter to hand to one's GP and a video about two prescription medicines for COVID-19; the minister fined it EUR 3,750 (art. 85 under a) and EUR 2,625 (art. 84(2), not in line with the SmPC). Para. 6.3: 'De Afdeling stelt vast dat deze uitingen niet alleen informatief van aard zijn.' The website's statement that it meant to inform and start a public debate, did not sell the medicines and 'ook anderszins geen commercieel doel of belang had bij de verkoop en het gebruik van deze middelen, doet daaraan niet af. De nadruk in de uitingen ligt in het in wervende bewoordingen benadrukken van gestelde positieve eigenschappen van de geneesmiddelen.' Para. 6.2 follows CJEU C-316/09 (MDS/Merckle): 'reclame voor geneesmiddelen' is read very broadly, the purpose of the message decides, and even objective information can be advertising. Para. 7.2: the restriction of free speech is justified (one-sided information, against the medical standard, potentially wide reach of a website). Para. 8.2: the fines (norm amount EUR 150,000, reduced by the maximum 97.5% for the size of the organisation) stand; the lower court's annulment is reversed. The text names the website's domain: never quote it."

nl-rbams-2026-5160-publieksreclame-journalistiek:
