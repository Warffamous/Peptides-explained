  note: "Issued 3 June 2020, modified 21 May 2021. Cited only as an example of how the IGJ applies the functional definition: 'Of melatonine een geneesmiddel is, hangt af van de kenmerken van het concrete product. Eén van de criteria daarbij is de hoeveelheid werkzame stof.' A product is a medicine when it has 'een noemenswaardig en gunstig effect ... op verschillende fysiologische functies van het lichaam door een farmacologisch effect te bewerkstelligen' and meets 'een aantal andere criteria, die door de rechter zijn vastgesteld'. A health claim allowed for foods does not stop a product from being a medicine. IGJ and NVWA both supervise the Gnw. The page names no company (a linked list of products does; not cited). Do not quote the melatonin dose threshold on peptide pages."

# ---------------------------------------------------------------- NVWA (Warenwet: supplements, cosmetics)

nvwa-verbod-medische-claims:
  type: regulator
  authors: "Nederlandse Voedsel- en Warenautoriteit (NVWA)"
  title: "Verbod op medische claims"
  year: 2025
  url: https://www.nvwa.nl/onderwerpen/voedselveiligheid/voedingsclaims-en-gezondheidsclaims/verbod-op-medische-claims
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued 28 September 2016, modified 12 December 2025. 'Levensmiddelen met een medische claim vallen onder de definitie van een geneesmiddel. Daarom moeten zij voldoen aan de Geneesmiddelenwet. U mag geneesmiddelen alleen op de markt brengen als u er een handelsvergunning voor heeft. Heeft u dat niet? Dan mag u er niet in handelen (artikel 40, lid 2 van de Geneesmiddelenwet). U mag ook er ook geen reclame voor maken (artikel 84 van de Geneesmiddelenwet).' 'Producten kunnen op grond van hun werking of hun presentatie als geneesmiddel worden beschouwd.' The NVWA first checks whether a product is a medicine (Gnw art. 1b), including its presentation on a website. 'NVWA en IGJ onderhouden contact over zaken die zich afspelen op het grensvlak tussen gezondheidsproducten en geneesmiddelen.' On Damgaard: 'Bepaalde uitingen van derden of journalisten over een medische werking van een ongeregistreerd geneesmiddel, kunnen namelijk als reclame gezien worden. Zelfs wanneer deze personen geen enkele band hebben met de verhandelaar van het product.'"

nvwa-toezicht-voedingssupplementen:
