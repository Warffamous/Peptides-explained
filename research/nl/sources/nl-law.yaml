# ---------------------------------------------------------------- Added by the independent fact-check, 27 October 2026

douane-hvgem-geneesmiddelen-h13-fysiek-toezicht-werkzame-stoffen:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Handboek VGEM, Voorschrift Geneesmiddelen, hoofdstuk 13: Proces fysiek toezicht werkzame stoffen"
  container: "Kennisbank Douane"
  year: 2026
  url: https://kennisbank.douane.nl/handboeken/hvgem/geneesmiddelen/geneesmiddelen-_proces_fysiek_toezicht_werkzame/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Page modified 21 April 2026. §13.3: 'In het reizigersverkeer is geen vrijstelling mogelijk bij de invoer voor eigen gebruik van werkzame stoffen.' §13.4: 'Er is voor werkzame stoffen geen vrijstelling / ontheffing van toepassing op post-, pakket-, en koerierzendingen. Werkzame stoffen kunnen niet op deze wijze door een particulier voor eigen gebruik worden ingevoerd.' For a 'niet-handelszending werkzame stoffen waarbij sprake is van particuliere ontvangers, neemt u de werkzame stoffen in beslag en handelt u de onregelmatigheid op gebruikelijke wijze af.' §13.4.1: parcels for a private person in another member state are treated the same way. §13.4.2: 'De opdrachtgever moet worden gezien als de normadressaat en wordt als verdachte beschouwd. Voor de afhandeling van de onregelmatigheden wordt ook de ontvanger als verdachte beschouwd.' Cited for: how Customs handles a parcel whose contents it classes as an active substance (Gnw art. 38) rather than as a medicine."

douane-2026-08-illegale-online-handel-medicijnen:
  type: regulator
  authors: "Douane (Belastingdienst)"
  title: "Douane strijdt tegen illegale online handel in medicijnen en designerdrugs"
  year: 2026
  url: https://www.douane.nl/douane-strijdt-tegen-illegale-online-handel-in-medicijnen-en-designerdrugs/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Background article: 'Publicatiedatum 06-08-2026, 15:25 | Laatste update 29-09-2026, 10:37'. 'De Douane controleert daarom intensief op illegale medicijnen en designerdrugs in post en pakketten. Het Douane Laboratorium onderzoekt de samenstelling van de stoffen en stelt vast onder welke wetgeving het valt.' Under 'Ook research chemicals zijn verboden': 'Als uit onderzoek blijkt dat het middel onder de Opiumwet of andere regelgeving valt, dan blijft het verboden. Onderzoeksdoeleinden spelen dan geen rol.' Under 'Afslankmiddelen en peptides steeds populairder': Customs sees more slimming products with the active substances of authorised GLP-1 medicines, sometimes experimental medicines; 'Het invoeren of uitvoeren van geneesmiddelen zonder vergunning is illegaal.' Laboratory tests sometimes find other substances than the pack says, or no active substance. 'Naast afslankmiddelen zijn ook andere peptides populair. Dit zijn experimentele middelen die op sociale media worden aangeraden.' Their effect is often unclear, claims sometimes rest only on animal studies, and the risks and long-term effects are unknown. Title and URL name no business; the body names one webshop (a criminal case) and two brand names: never quote them (CONTENT-GUIDE §1, §11)."

igj-2026-04-nps-websites-offline:
  type: regulator
