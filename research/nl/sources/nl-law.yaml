  lang: nl
  verified: url
  note: "News, 3 December 2025. The Dopingautoriteit and the NVWA's intelligence and investigation service renewed their protocol on data exchange; the Dopingautoriteit has no investigative powers of its own. 'De Dopingautoriteit heeft samenwerkingsprotocollen met zes opsporings- en handhavingsorganisaties. Naast NVWA-IOD zijn dat Inspectie Gezondheidszorg en Jeugd (IGJ), Politie, het Openbaar Ministerie, FIOD en Douane.' 'In een periodiek overleg wisselen de opsporingsdiensten en de Dopingautoriteit onderling gegevens uit met als doel dopingovertredingen op te sporen en af te handelen en om de illegale handel en productie in dopingmiddelen tegen te gaan.'"
