  url: https://www.nvwa.nl/onderwerpen/voedselveiligheid/voedingssupplementen/toezicht-op-voedingssupplementen
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued 21 November 2023, modified 19 February 2026. 'De NVWA houdt toezicht op voedingssupplementen en kruidensupplementen die u in Nederland importeert, produceert of verkoopt': no forbidden substances or excessive amounts; labels and claims on labels and websites must be correct; spot checks in shops and webshops; reports from Lareb are investigated. 'We grijpen in als een product niet aan de regels voldoet. Bijvoorbeeld door de verkoop van de supplementen te verbieden.'"

nvwa-cosmetica-toezicht:
  type: regulator
  authors: "Nederlandse Voedsel- en Warenautoriteit (NVWA)"
  title: "Cosmetica"
  year: 2026
  url: https://www.nvwa.nl/onderwerpen/productveiligheid/cosmetica
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Modified 11 September 2026. 'Voor cosmetica gelden strenge veiligheidseisen. De NVWA houdt toezicht op de naleving hiervan.' Cosmetics are personal-care products used 'direct op de huid of het haar'; the EU Cosmeticaverordening applies, also to imports; consumers can report unsafe cosmetics to the NVWA."

