# ---------------------------------------------------------------- IGJ: advertising and classification

igj-geneesmiddelenreclame-wat-is:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Wat zijn geneesmiddelenreclame en gunstbetoon?"
  year: 2025
  url: https://www.igj.nl/zorgsectoren/geneesmiddelen/geneesmiddelenreclame/wat-is-geneesmiddelenreclame
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued 30 June 2025, modified 4 November 2025 (page metadata). The Gnw definition 'is bewust streng opgesteld ... iemand volgens deze strenge definitie al snel reclame maakt voor een geneesmiddel.' 'Voorlichting of informatie valt niet onder reclame. Het verschil tussen reclame en voorlichting/informatie is soms moeilijk te maken en hangt af van de situatie. De kern bij voorlichting/informatie is dat deze nodig is voor een goede medische behandeling. Denk hierbij aan de bijsluiter. Een geneesmiddel of het gebruik ervan mag niet worden aangeprezen.' 'Of een bepaalde uiting moet worden gezien als reclame, is niet afhankelijk van de afzender. Iedereen kan reclame maken'. Form and context count. 'Wat offline niet mag, mag ook online niet.' Third parties: 'Dat een geneesmiddel door die onafhankelijke derde niet te koop wordt aangeboden maakt dat niet anders.' No advertising for medicines not registered by the EMA or the CBG, e.g. investigational medicines, 'gebruik van een geneesmiddel voor een ziekte waarvoor dat geneesmiddel niet is geregistreerd', 'illegale middelen', 'een product dat, middels het uiterlijk of het gebruik van claims, als geneesmiddel wordt gepresenteerd'. Public advertising for prescription medicines is forbidden; the Keuringsraad assesses OTC advertising under the Code voor de Publieksreclame voor Geneesmiddelen."

igj-2026-betrokken-instanties-reclametoezicht:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Betrokken instanties toezicht geneesmiddelenreclame en gunstbetoon"
  year: 2026
  url: https://www.igj.nl/zorgsectoren/geneesmiddelen/geneesmiddelenreclame/betrokken-instanties-toezicht-geneesmiddelenreclame-en-gunstbetoon
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued and modified 13 April 2026. The CGR (Stichting Code Geneesmiddelenreclame) supervises advertising aimed at professionals (Gedragscode Geneesmiddelenreclame); 'De stichting Keuringsraad Openlijke Aanprijzing Geneesmiddelen/Keuringsraad Aanprijzing Gezondheidsproducten (KOAG/KAG) is de zelfreguleringsinstantie die namens de branche toezicht houdt op publieksreclame' (Code voor de publieksreclame voor geneesmiddelen); 'De inspectie houdt toezicht op de CGR' and on the KOAG/KAG; the NVWA supervises advertising for health products such as supplements (Code voor de aanprijzing van gezondheidsproducten) and keeps contact with the IGJ on borderline products; working arrangements decide which reports the IGJ handles."

igj-2021-melatonine-geneesmiddel-of-niet:
