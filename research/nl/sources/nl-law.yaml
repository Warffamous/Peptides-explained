# ---------------------------------------------------------------- Geneesmiddelenwet (version in force from 9 September 2025)

nl-gnw-versie-informatie-2026-10-27:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet: informatie over de geldende versie en de wijzigingen (geraadpleegd 27 oktober 2026)"
  container: "wetten.overheid.nl (BWBR0021505), informatiepagina"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/0/informatie
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Geraadpleegd op 27-10-2026. Geldend van 09-09-2025 t/m heden.' No later version is listed. 'Aanhangig' (pending): dossier 35410 (art. 101; the initiative bill Wet transparantieregister zorg) and dossier 36716 (art. 62; digital information when selling UAD medicines), titles checked in the official publications repository. 'Wijziging(en) zonder datum inwerkingtreding aanwezig' (e.g. art. 62, Stb. 2023, 293). Cited for: the Geneesmiddelenwet in force on 27 October 2026 is the version of 9 September 2025."

nl-gnw-art-1-lidstaat-werkzame-stof:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 1, eerste lid, onder s, x.1, cc, dd, ii, ll en lll (begripsbepalingen)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#HoofdstukI_Artikel1
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "(s) 'UR-geneesmiddel: een geneesmiddel dat uitsluitend op recept ter hand mag worden gesteld'. (x.1) 'werkzame stof: een substantie die of een mengsel van substanties dat bestemd is om gebruikt te worden bij de vervaardiging van een geneesmiddel ...'. (cc) 'lidstaat: een staat die lid is van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte'. (dd) 'derde land: een land, niet zijnde een lidstaat'. (ii) 'afleveren: het anders dan door terhandstelling of uitvoer leveren van geneesmiddelen of werkzame stoffen'. (ll) 'ter hand stellen: het rechtstreeks verstrekken of doen bezorgen van een geneesmiddel aan de patiënt voor wie het geneesmiddel is bestemd' (or to named professionals). (lll) 'handelsvergunning: een vergunning voor het in het handelsverkeer brengen van een geneesmiddel'. Same URL as nl-gmw-art-1-geneesmiddel (guides.yaml, sub b) and nl-gnw-art-1-reclame (legal-a.yaml, sub hh, xx, ijij), which cite other parts of art. 1; this follows that precedent."

nl-gnw-art-38-werkzame-stoffen:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 38 (registratie voor werkzame stoffen)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk3a_Artikel38
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Lid 1: 'Het is verboden om zonder registratie werkzame stoffen te bereiden, in te voeren, in voorraad te hebben, te koop aan te bieden, af te leveren, uit te voeren of anderszins binnen of buiten Nederlands grondgebied te brengen, dan wel in werkzame stoffen een groothandel te drijven.' Lid 2: registration in a register kept by the Minister. Art. 38(1) is an economic offence (WED art. 1 under 1°) and can be fined administratively (Gnw art. 101(1))."

nl-gnw-art-62-uad-av:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 62 (UAD- en AV-geneesmiddelen)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk6_Artikel62
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Lid 1: it is forbidden for anyone to offer for sale, sell or hand over UAD medicines, except pharmacists, dispensing GPs, persons designated by ministerial rule and 'drogisten die in een drogisterij of in een ander verkooppunt van UAD-geneesmiddelen hun beroep uitoefenen'. Lid 2: the seller must offer 'verantwoorde zorg' (a drogist supervises and informs). Lid 3: AV medicines may also be sold by businesses registered in the trade register. Art. 62 carries an amendment without a date of entry into force (Stb. 2023, 293)."

nl-gnw-art-83-reclame-uitzonderingen:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 83 (wat niet onder de reclameregels valt)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk9_Paragraaf1_Artikel83
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Dit hoofdstuk is niet van toepassing op: a. geneesmiddelen voor onderzoek, niet zijnde geneesmiddelen waarvoor een handelvergunning is verleend en die worden gebruikt in een medisch-wetenschappelijk onderzoek met mensen; b. de bijsluiter bij en de etikettering van een geneesmiddel; c. een brief of een emailbericht, al dan niet vergezeld van documentatie waarmee geen reclamedoeleinden worden nagestreefd, ter inwilliging van een specifiek verzoek om informatie over een bepaald geneesmiddel; d. informatie betreffende gezondheid of ziekte bij de mens.' Directive 2001/83 art. 86(2) (eu-directive-2001-83) adds to the last item: 'provided that there is no reference, even indirect, to medicinal products'."

nl-gnw-art-116-opsporing-douane:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 116 (opsporing en inbeslagneming)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk11_Artikel116
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Lid 1: 'De ambtenaren van de Inspectie gezondheidszorg en jeugd of de Nederlandse Voedsel- en Warenautoriteit, de personen, aangewezen bij of krachtens artikel 141 van het Wetboek van Strafvordering en de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane zijn belast met de opsporing van de strafbare feiten, bedoeld in artikel 101.' Lid 2: they are 'te allen tijde bevoegd tot inbeslagneming' of goods that can serve to find the truth or whose forfeiture, withdrawal from circulation or destruction can be ordered."

# ---------------------------------------------------------------- Penalties: Wetboek van Strafrecht and the VWS fining policy

nl-sr-art-23-boetecategorieen-2026:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Wetboek van Strafrecht, artikel 23 (geldboete; zes categorieën, bedragen per 1 januari 2026)"
  container: "wetten.overheid.nl (BWBR0001854), version in force from 1 July 2026"
  year: 1881
  url: https://wetten.overheid.nl/BWBR0001854/2026-07-01/#BoekEerste_TiteldeelII_Artikel23
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Geldend van 01-07-2026 t/m heden.' Art. 23(4) 'Er zijn zes categorieën', each with an editorial note giving the amount in force: '[Red: Per 1 januari 2026: € 550.]' (1st), € 5.500 (2nd), € 11.000 (3rd), € 27.500 (4th), € 110.000 (5th), '[Red: Per 1 januari 2026: € 1.100.000.]' (6th). Art. 23(7): for a legal person a fine of the next category, or for the sixth up to 10% of annual turnover. Matches rijksoverheid-fine-categories-2026 (page modified 16 April 2026). No later indexation is shown."

nl-beleidsregels-boete-vws-2019:
  type: law
  authors: "Minister van Volksgezondheid, Welzijn en Sport"
  title: "Beleidsregels bestuurlijke boete Ministerie Volksgezondheid Welzijn en Sport 2019, met de bijlage Geneesmiddelenwet"
  container: "wetten.overheid.nl (BWBR0041790), version in force from 1 March 2025"
  year: 2018
  url: https://wetten.overheid.nl/BWBR0041790/2025-03-01
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Geldend van 01-03-2025 t/m heden.' Decision of 17 December 2018 (Stcrt. 2018, 72501). Art. 2: per article the annex says whether a breach is fined directly (DB) or first gets a written warning (SW); art. 2(3): after a new breach of the same rule within four years the minister 'kan ... het nominale boetebedrag ... verdubbelen' (the annex, step 7, says it 'wordt ... verdubbeld'). Art. 3: if a breach is also a criminal offence, it is put to the Openbaar Ministerie. Annex Geneesmiddelenwet, step 1: arts. 18(1), 40(1), 40(2) ('Geneesmiddelen waarvoor geen handelsvergunning is verleend in voorraad hebben, te koop aan te bieden, verkopen, afleveren, ter hand stellen, invoeren, uitvoeren of anderszins binnen of buiten het Nederlands grondgebied te brengen'), 61(1), 67, 68(1), 84(1) and 85 (sub a) are DB with a 'Boete normbedrag' of '€ 150.000,00', and all eight carry three stars (corrected by the fact-checker, 27 October 2026: 68(1) and 85 sub a are three-star too; 84(2)-(4) and 85 sub b carry two). Step 2: 'UR of niet geregistreerd geneesmiddel 100% normbedrag'. Step 4: for three-star breaches 80%, 90% or 100%. Step 6: 'Onderneming of natuurlijk persoon met 1 t/m 4 FTE 2,5% van het in schema D vastgestelde bedrag', rising to 100% for 151 FTE or more. These are policy starting points, not statutory maxima."

