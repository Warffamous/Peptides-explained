  authors: "Rechtbank Noord-Nederland"
  title: "Uitspraak van 21 april 2026 over een bestuurlijke boete aan een natuurlijk persoon voor publieksreclame voor een receptgeneesmiddel via een videokanaal (zaaknummer LEE 24/319), ECLI:NL:RBNNE:2026:1471"
  container: "uitspraken.rechtspraak.nl"
  year: 2026
  url: https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:RBNNE:2026:1471
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read through data.rechtspraak.nl ('Uitspraakdatum 2026-04-21'). After a report to the IGJ of 22 December 2021, the minister fined a person (pseudonymised; a church minister speaking on the congregation's video channel) EUR 3,750 'omdat het niet is toegestaan om publieksreclame te maken voor het geneesmiddel ivermectine, dat uitsluitend op recept ter hand wordt gesteld' (art. 85 under a). The court held the ban on public advertising for prescription medicines necessary in a democratic society (para. 15) and found the appeal well-founded 'uitsluitend omdat de redelijke termijn is overschreden', setting the fine at EUR 3,000 (EUR 3,750 x 0.8). Cited for: the VWS fining policy applied to a natural person, for advertising (not for importing)."

