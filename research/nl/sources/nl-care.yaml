# ---------------------------------------------------------------- Netherlands: professional bodies and patient information

knmg-wie-mogen-voorschrijven:
  type: guideline
  authors: "KNMG (Koninklijke Nederlandsche Maatschappij tot bevordering der Geneeskunst)"
  title: "Wie mogen geneesmiddelen voorschrijven?"
  year: 2020
  url: https://www.knmg.nl/ik-ben-arts/praktijkdilemmas-1/praktijkdilemma/wie-mogen-geneesmiddelen-voorschrijven
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Practice dilemma, published 16 December 2020 (page date 5 February 2026). Doctors, dentists and midwives may prescribe UR medicines within their field. 'Ook physician assistants en verpleegkundig specialisten mogen UR-geneesmiddelen voorschrijven binnen hun eigen deskundigheidsgebied. Dit mogen zij alleen doen voor zover het om minder complexe, routinematige recepten gaat'. Nurses specialised in diabetes, oncology or asthma/COPD may prescribe a limited list after a doctor's diagnosis (diabetes nurses: 'alleen bloedglucose regulerende geneesmiddelen'). 'Andere beroepsbeoefenaren, zoals doktersassistentes en praktijkondersteuners, mogen geen recepten schrijven. Ook niet in opdracht van een arts.'"

nhg-2018-standpunt-offlabel:
