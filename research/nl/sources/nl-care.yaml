# ---------------------------------------------------------------- Netherlands: statutes and policy rules

nl-gnw-art-1-recept:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 1, eerste lid, onder s en pp (UR-geneesmiddel; recept)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#HoofdstukI_Artikel1
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 ('Geldend van 09-09-2025 t/m heden'). (s) 'UR-geneesmiddel: een geneesmiddel dat uitsluitend op recept ter hand mag worden gesteld'. (pp) 'recept': a document drawn up by a professional 'met naam en werkadres aangeduide' as in art. 36(14) Wet BIG, 'dan wel een daartoe in een andere lidstaat bevoegde beroepsbeoefenaar', instructing a person or body under art. 61(1) (pharmacist, dispensing GP) to hand over a medicine named by substance or brand name, in the stated quantity, strength and way of use, 'aan een te identificeren patiënt', signed, or secured by a code that lets an authorised person check its authenticity."

nl-wet-big-art-36-voorschrijven:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Wet op de beroepen in de individuele gezondheidszorg (Wet BIG), artikel 36, veertiende lid (voorschrijven van UR-geneesmiddelen)"
  container: "wetten.overheid.nl (BWBR0006251), version in force from 5 July 2025"
  year: 1993
  url: https://wetten.overheid.nl/BWBR0006251/2025-07-05/#HoofdstukIV_Artikel36
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 (current version). Art. 36(14): 'Tot het voorschrijven van UR-geneesmiddelen ... zijn bevoegd': (a) de artsen; (b) de tandartsen; (c) de verloskundigen, within their field; (d) designated categories of nurses, only where a doctor, dentist or midwife has made the diagnosis, where 'medische protocollen en standaarden' are followed, within limits set by regulation, and with an annotation in the register; (e) designated categories of specialist nurses (verpleegkundig specialisten), within limits; (f) de physician assistants, within their field. Art. 36(5) on injections is cited from nl-wet-big-art-35-36 (guides.yaml)."

nl-wgbo-art-460-opzegging:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Burgerlijk Wetboek Boek 7, artikel 460 (WGBO: opzegging door de hulpverlener)"
  container: "wetten.overheid.nl (BWBR0005290), version in force from 8 October 2026"
  year: 1994
  url: https://wetten.overheid.nl/BWBR0005290/2026-10-08/#Boek7_Titeldeel7_Afdeling5_Artikel460
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 ('Geldend van 08-10-2026 t/m heden'). 'De hulpverlener kan, behoudens gewichtige redenen, de behandelingsovereenkomst niet opzeggen.' (The care provider cannot end the treatment agreement except for weighty reasons.)"

nl-wmo-art-2-6-7:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Wet medisch-wetenschappelijk onderzoek met mensen (WMO), artikelen 1, 2, 6 en 7"
  container: "wetten.overheid.nl (BWBR0009408), version in force from 1 January 2025"
  year: 1998
  url: https://wetten.overheid.nl/BWBR0009408/2025-01-01/#Paragraaf1_Artikel2
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 ('Geldend van 01-01-2025 t/m heden'). Art. 1(1)(o): 'wetenschappelijk onderzoek met geneesmiddelen: een klinische proef waarop Verordening (EU) 536/2014 van toepassing is'. Art. 2: research follows a protocol on which 'een positief oordeel' is needed from an authorised committee or, in listed cases, the central committee (CCMO). Art. 6: research is forbidden without written consent (16 and over: the person; 12 to 15: the person and the parents or guardian; with rules for people who cannot judge their interests). Art. 7(1): research may only start if insurance covers death or injury caused by it; the insurance 'behoeft niet te dekken de schade waarvan op grond van de aard van het onderzoek zeker of nagenoeg zeker was dat deze zich zou voordoen'."

nl-beleidsregel-voorschrijven-via-internet:
  type: regulator
  authors: "Minister van Volksgezondheid, Welzijn en Sport"
  title: "Beleidsregel voorschrijven via internet"
  container: "wetten.overheid.nl (BWBR0048048), version in force from 12 April 2023; published in Staatscourant 2023, 10521"
  year: 2023
  url: https://wetten.overheid.nl/BWBR0048048/2023-04-12/#Artikel2
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 ('Geldend van 12-04-2023 t/m heden'; decision of 27 March 2023, kenmerk 3453103-1038189-GMT, signed by Minister Kuipers; also read as published in the Staatscourant). Art. 2: when a medicine is prescribed via the internet to a person the prescriber has never met in person and does not know, 'treedt de minister niet handhavend op tegen overtreding van artikel 67 van de Geneesmiddelenwet indien: a. een fysiek consult of onderzoek om te bepalen of een geneesmiddel moet worden voorgeschreven en zo ja, welk geneesmiddel moet worden voorgeschreven, niet nodig is, en; b. de voorschrijver beschikt over de geactualiseerde medicatiehistorie van de patiënt en de medicatiehistorie voor zover nodig raadpleegt.' The IGJ gives 11 April 2023 as the start date; the rule enters into force the day after publication."

nl-regeling-zorgverzekering-bijlage-2-glp1:
  type: law
  authors: "Minister van Volksgezondheid, Welzijn en Sport"
  title: "Regeling zorgverzekering, bijlage 2, onderdelen 58 (exenatide), 141 (liraglutide), 146 (dulaglutide en semaglutide), 147 (bupropion met naltrexon) en 194 (tirzepatide)"
  container: "wetten.overheid.nl (BWBR0018715), version in force from 6 October 2026"
  year: 2026
  url: https://wetten.overheid.nl/BWBR0018715/2026-10-06/#Bijlage2
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 ('Geldend van 06-10-2026 t/m heden'). Item 146 (dulaglutide, semaglutide) and item 194 (tirzepatide, only insured persons 'van achttien jaar en ouder'): type 2 diabetes only: (a) BMI of 30 or more, not controlled on metformin plus a sulfonylurea at maximum tolerated doses, not using insulin; (b) added to metformin and basal insulin, BMI of 30 or more, after at least 3 months of optimised basal insulin; (c) very high cardiovascular risk (proven cardiovascular disease and/or chronic kidney damage), added to an SGLT2 inhibitor and metformin, or when an SGLT2 inhibitor is contraindicated. Item 141 (liraglutide): the type 2 diabetes routes, and (c) 'in combinatie met een door het RIVM erkende gecombineerde leefstijlinterventie (GLI), indien de GLI niet succesvol is na 1 jaar, voor de behandeling van volwassenen zonder diabetes mellitus type 2 met een extreem verhoogd gewichtsgerelateerd gezondheidsrisico en die (nog) niet in aanmerking komen voor metabole chirurgie': BMI of 35 or more with a comorbidity (cardiovascular disease, sleep apnoea and/or osteoarthritis), or BMI of 40 or more; stop if after 3 months on the maintenance dose weight has not fallen by at least 5%. Item 147 (bupropion with naltrexone): adults with a GLI not successful after 1 year, BMI of 30 or more, or 27 to 30 with a comorbidity; stop if less than 5% weight loss after four months. Item 58 (exenatide): type 2 diabetes routes. Bijlage 1 lists Saxenda, Victoza, Ozempic, Rybelsus, Trulicity and Mounjaro products; Wegovy and Zepbound do not appear. Doses printed in the regulation are not to be copied."

nl-mvt-2003-geneesmiddelenwet:
  type: report
  authors: "Minister van Volksgezondheid, Welzijn en Sport"
  title: "Vaststelling van een nieuwe Geneesmiddelenwet; Memorie van toelichting (Kamerstukken II 2003/04, 29 359, nr. 3)"
  container: "Tweede Kamer der Staten-Generaal, vergaderjaar 2003–2004 (via repository.overheid.nl)"
  year: 2003
  url: https://repository.overheid.nl/frbr/officielepublicaties/kst/29359/kst-29359-3/1/pdf/kst-29359-3.pdf
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Dated 10 December 2003 (official metadata DCTERMS.available 2003-12-10; imprint 'Sdu Uitgevers 's-Gravenhage 2003'; vergaderjaar 2003-2004). Fact-check 27 October 2026: id and year corrected from 2004 to 2003. PDF downloaded and read with pdftotext on 27 October 2026. Section 3: 'Het College ter beoordeling van geneesmiddelen (CBG) is ingesteld bij de WOG in 1963'; registration was entrusted to the 'College ter beoordeling van verpakte geneesmiddelen'; 'Het College bestaat als zelfstandig bestuursorgaan (ZBO) reeds sinds 1963.' Section 4.3: 'Sinds de inwerkingtreding van de WOG in 1963 is het verboden een geneesmiddel voor de eerste keer in het handelsverkeer te brengen zonder voorafgaande registratie (= handelsvergunning) van een bevoegde autoriteit. Enkele andere Europese landen waren Nederland daarin reeds voorgegaan.' Directive 65/65/EEC of 26 January 1965 is mentioned next. The memorandum gives the year 1963, not the day."

# ---------------------------------------------------------------- Netherlands: regulators (IGJ, CBG)

igj-medicijnen-voorschrijven-via-internet:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Medicijnen voorschrijven via internet"
  year: 2026
  url: https://www.igj.nl/onderwerpen/themas-in-het-toezicht/medicatieveiligheid/medicijnen-voorschrijven-via-internet
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued 28 April 2023, modified 14 July 2026 (metadata). 'Zorgverleners mogen medicijnen voorschrijven na contact met de patiënt via internet, maar hiervoor gelden strenge voorwaarden. Hiervoor geldt een beleidsregel.' 'Er mag geen fysiek onderzoek nodig zijn bij de patiënt en de voorschrijver moet beschikken over de actuele medicatiegegevens van de patiënt.' The rule took effect 11 April 2023; it covers video, audio or text; 'Als het voor goede zorg noodzakelijk is dat de voorschrijver de patiënt fysiek onderzoekt of ziet dan mag voor het voorschrijven van een geneesmiddel niet worden volstaan met een consult via internet'; the prescriber may rely on an examination by another care provider; the Wkkgz, Wet BIG and WGBO norms apply; the rule applies until art. 67 Gnw is amended; ordinary telephone calls without internet fall outside art. 67, but similar conditions apply."

igj-overzicht-vrijstellingsbesluiten:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Overzicht vrijstellingsbesluiten"
  year: 2026
  url: https://www.igj.nl/zorgsectoren/geneesmiddelen/beschikbaarheid-van-geneesmiddelen/overzicht-vrijstellingsbesluiten
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Modified 26 October 2026 (metadata). The IGJ's list of general exemptions under Regeling Gnw art. 3.17a for temporary shortages. Text-searched on 27 October 2026 for semaglutide, liraglutide, tirzepatide, dulaglutide, Ozempic, Victoza, Saxenda, Mounjaro, Trulicity and GLP: no GLP-1 medicine is listed."

cbg-cup-vragen-en-antwoorden:
  type: regulator
  authors: "College ter Beoordeling van Geneesmiddelen (CBG-MEB)"
  title: "Vragen en antwoorden over Compassionate Use Programma"
  year: 2025
  url: https://www.cbg-meb.nl/onderwerpen/handelsvergunning-voor-aanvraag-handelsvergunning/hv-compassionate-use-programma/vraag-en-antwoord/handelsvergunning-geneesmiddelen-voor-mensen/vragen-en-antwoorden-over-compassionate-use-programma
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued 1 December 2024, modified 14 January 2025 (metadata). A CUP is for a group (cohort) of patients; the artsenverklaring is for one patient at a doctor's initiative. 'Alleen de fabrikant van het geneesmiddel kan een aanvraag voor een CUP indienen.' No CUP for a new indication of an authorised medicine: 'Niet geregistreerde indicaties van een geregistreerd geneesmiddel vallen wettelijk gezien onder de regels voor off-label gebruik.' A Dutch CUP 'is uitsluitend voor Nederland'. The CBG decides within 6 weeks of starting its assessment. Approval is 'voor onbepaalde tijd', until marketing authorisation or a negative benefit-risk balance; 'Tot 2023 gold een goedkeuring voor de termijn van 1 jaar'. Patients keep access until a positive reimbursement decision and availability. The manufacturer collects all suspected side effects (EudraVigilance) and files a safety report after a year."

cbg-2024-cup-nieuw-beleid:
  type: regulator
  authors: "College ter Beoordeling van Geneesmiddelen (CBG-MEB)"
  title: "Nieuw beleid voor Compassionate Use Programma's"
  year: 2024
  url: https://www.cbg-meb.nl/actueel/nieuws/2024/12/19/nieuw-beleid-voor-compassionate-use-programmas
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "News item of 19 December 2024 (modified 14 February 2025). The CUP procedure is published in policy document MEB 49 (1 December 2024), with the three criteria (a group of patients with a chronic, seriously debilitating or life-threatening disease; insufficient treatment with an authorised medicine; a marketing application filed or trials ongoing). 'Geen tijdelijke goedkeuring meer': approval is now for an indefinite period, until marketing authorisation, or earlier if the benefit-risk balance turns negative. The policy applies at once."

# ---------------------------------------------------------------- Netherlands: insurance (Zorginstituut, Rijksoverheid, FK)

zin-geneesmiddelen-zvw:
  type: regulator
  authors: "Zorginstituut Nederland"
  title: "Geneesmiddelen (Zvw)"
  year: 2026
  url: https://www.zorginstituutnederland.nl/verzekerde-zorg/g/geneesmiddelen-zvw
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Modified 4 June 2026 (metadata). 'Alleen geregistreerde geneesmiddelen die zijn opgenomen in het Geneesmiddelenvergoedingssysteem (GVS) worden vergoed uit het basispakket'; bijlage 1A (clusters with a reimbursement limit), bijlage 1B (unique medicines) and bijlage 2 (extra conditions). 'Sinds 2019 is er een maximum bedrag vastgesteld voor de eigen bijdrage voor geneesmiddelen. Een verzekerde betaalt per jaar maximaal € 250 aan eigen bijdrage.' 'Voor geneesmiddelen geldt het eigen risico.' A registered medicine not in the GVS cannot be reimbursed from the basic package."

zin-gli-zvw:
  type: regulator
  authors: "Zorginstituut Nederland"
  title: "Gecombineerde Leefstijlinterventie (GLI) (Zvw)"
  year: 2026
  url: https://www.zorginstituutnederland.nl/verzekerde-zorg/g/gecombineerde-leefstijlinterventie-gli-zvw
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued 24 January 2019, modified 29 May 2026 (metadata). 'Een GLI is een programma van 2 jaar.' Eligible with a BMI between 25 and 35 with a large waist (women 88 cm or more, men 102 cm or more) or with one or more weight-related diseases, or a BMI of 35 or more. 'De huisarts stelt vast of u een GLI kan krijgen'; it can also be a digital programme; given by lifestyle coaches, dietitians, physio- or exercise therapists. Reimbursed if the programme is on the RIVM's Loket Gezond Leven. 'U betaalt geen eigen bijdrage voor een GLI.' 'De kosten voor een GLI vallen niet onder het verplicht eigen risico.' A BMI under 25: not reimbursed from the basic package."

rijksoverheid-2026-prinsjesdag-zorg:
  type: regulator
  authors: "Rijksoverheid (Government of the Netherlands)"
  title: "Prinsjesdag 2026: Zorg"
  year: 2026
  url: https://www.rijksoverheid.nl/themas/overheid-en-democratie/prinsjesdag/zorg
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Issued 15 September 2026 (metadata). Section 'Eigen risico, premie en zorgtoeslag': total care spending rises to € 118 billion in 2027; the premium rises by € 12,50 to an average of € 169 a month; the zorgtoeslag for single people rises to at most € 140 a month; 'Het verplicht eigen risico gaat in 2027 met de inflatie mee en stijgt van € 385 naar € 400.' The cabinet's budget announcement; the legal instrument that sets the amount is the ministerial regulation of 25 September 2026 (Stcrt. 2026, 34372), cited as nl-zvw-art-19-eigen-risico-2027. The same sentence is in the news item registered by topic nl-help (rijksoverheid-2026-09-vws-begroting)."

nl-zvw-art-19-eigen-risico-2027:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden; bedrag vastgesteld door de Minister van Volksgezondheid, Welzijn en Sport"
  title: "Zorgverzekeringswet, artikel 19, eerste lid (verplicht eigen risico), versie met ingang van 1 januari 2027"
  container: "wetten.overheid.nl (BWBR0018450), version in force from 1 January 2027; amount set by the Regeling van de Minister van VWS van 25 september 2026, kenmerk 4527716-1104927-WJZ, houdende vaststelling van het verplicht eigen risico Zvw 2027 (Staatscourant 2026, 34372)"
  year: 2026
  url: https://wetten.overheid.nl/BWBR0018450/2027-01-01/#Hoofdstuk3_Paragraaf3.4_Artikel19
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Found by the fact-check of 27 October 2026. The current Zvw (version 'Geldend van 01-01-2026 t/m heden') art. 19(1): '€ 385 per kalenderjaar', with '[Toekomstige wijziging(en) voorzien met ingang van: 01-01-2027.]'. The version from 1 January 2027, art. 19(1): 'Iedere verzekerde van achttien jaar of ouder heeft een verplicht eigen risico van € 400 per kalenderjaar.' Change history: 'Datum inwerkingtreding: 01-01-2027', 'Ontstaansbron: Stcrt. 2026, 34372', signed 25-09-2026. The regulation itself (Staatscourant 2026, 34372, published 30 September 2026, read on zoek.officielebekendmakingen.nl, host not allowlisted): 'Het bedrag, bedoeld in artikel 19, eerste lid, van de Zorgverzekeringswet, wordt vastgesteld op € 400'; 'Deze regeling treedt in werking met ingang van 1 januari 2027'; signed by Minister S.Th.M. Hermans; the explanatory note says the planned € 60 increase (bill 36 943) was postponed by a year, so 2027 is indexation only. So € 400 for 2027 is set in law (in force from 1 January 2027), not only a plan."

