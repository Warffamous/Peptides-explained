  note: "'Geautoriseerd in mei 2016'; replaces the April 2008 guideline. Recommendations for community pharmacists preparing medicines for their own patients. 'Ga bij een voorschrift voor een apotheekbereiding eerst na of in de zorgvraag kan worden voorzien met een geregistreerd handelspreparaat'; only when no registered product is available, or not in the right strength or form, or preparation has added value, does the pharmacist consider preparing it; standardised preparations are preferred."

knmp-faq-apotheekbereiding:
  type: guideline
  authors: "KNMP (Koninklijke Nederlandse Maatschappij ter bevordering der Pharmacie)"
  title: "Veelgestelde vragen over bereiding (dossier Apotheekbereiding)"
  year: 2024
  url: https://www.knmp.nl/dossiers/apotheekbereiding/veelgestelde-vragen-over-bereiding
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Items 'Laatst bijgewerkt op 05 maart 2024'. 'Apothekers mogen in de eigen apotheek op kleine schaal geneesmiddelen bereiden voor eigen patiënten'; community pharmacies follow the KNMP guideline 'Bereiden', hospital pharmacies the NVZA's GMP-Z guideline. Minister Bruins's letter of April 2019: 'verstrekking in het klein' means a few to about 50 unique patients a month for long-term use and about 150 for short-term use. Collegial supply between pharmacies without a marketing authorisation 'is strijdig met de Geneesmiddelenwet' but is tolerated by the IGJ under the policy rule 'Collegiaal doorleveren en ter hand stellen van apotheekbereidingen' (from 1 February 2025, with prior assessment and a 'gedoogverklaring'). Reimbursement requires rational pharmacotherapy (Besluit zorgverzekering art. 2.8(1)); not reimbursed are preparations containing a registered medicine not designated for reimbursement, and preparations 'met dezelfde werkzame stof, toedieningsweg en vergelijkbare toepassing als een geregistreerd geneesmiddel dat niet voor vergoeding is aangewezen'."

