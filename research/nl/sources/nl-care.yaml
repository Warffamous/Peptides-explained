nhg-standaard-obesitas-2025:
  type: guideline
  authors: "Nederlands Huisartsen Genootschap (NHG); werkgroep Eshuis MS, el Hajoui M, Huls MHJ, van Kemenade JE, Oud M, Poldervaart JM, Schalkwijk AAH, Stijntjes F, Wittenberg J"
  title: "NHG-Standaard Obesitas (M95)"
  year: 2025
  url: https://richtlijnen.nhg.org/standaarden/obesitas
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read in the built-in browser on 27 October 2026 (HTTP 401 to scripts; cookie banner left untouched). 'Gepubliceerd: oktober 2025 Laatste aanpassing: augustus 2026'. GLI: consider at BMI 25 or more with a large waist or weight-related comorbidity, or BMI 35 or more; 'Sinds 2019 vergoeden zorgverzekeraars de GLI'. Weight-reducing medication: consider at BMI 35–39.9 with weight-related comorbidity, or BMI 40 or more; only for patients who took part in a (combined) lifestyle intervention for at least a year with motivation and no more than 10% weight loss and keep it up; stop at less than 5% weight loss after 12 weeks at the maximum tolerated dose; none over 75 or in pregnancy or lactation; consider tapering to a trial stop after 2 years. 'Het voorschrijven van gewichtsreducerende medicatie is extra aanbod en daarom facultatief. Verwijs naar de tweede lijn (bij voorkeur naar een obesitascentrum in een ziekenhuis of een internist gespecialiseerd in obesitas) wanneer medicatie niet door huisarts zelf wordt voorgeschreven.' Recommended: subcutaneous liraglutide or semaglutide, or naltrexone/bupropion. 'Semaglutide oraal wordt niet aanbevolen vanwege beperkt bewijs. Tirzepatide (GIP/GLP1-agonist) wordt afgeraden omdat hier nog nauwelijks ervaring mee opgedaan is, er nog te veel onzekerheid is over de veiligheid en de kosten zeer hoog zijn.' Doses in the standard are not to be copied."

