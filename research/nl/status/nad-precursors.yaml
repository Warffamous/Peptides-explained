regulatory_notes:
  EU: "No NAD+ precursor is authorised as a medicine in the EU (EMA records, 27 October 2026). NMN has an EU orphan designation for sickle cell disease (20 June 2023), which is not an authorisation. [Novel-food clause only after a re-check of the food sources.]"
  NL: "No medicine with NR, NMN or NAD+ in the CBG register (27 October 2026). An injection is a medicine, not a food."
notes: |
  EMA medicines JSON: no product with nicotinamide riboside, nicotinamide mononucleotide, NMN, nadide or 'nicotinamide
  adenine dinucleotide' in the name, INN or substance. Orphan JSON: EU/3/23/2786 'nicotinamide mononucleotide',
  'Treatment of sickle cell disease', status Positive, designated 20/06/2023 (registered in stubs-b research via
  ema-orphan-designations-json). CTIS: 'nicotinamide riboside' finds only two Danish senolytics trials whose product is
  dasatinib (not NR trials as such); 'nicotinamide mononucleotide' 0. Geneesmiddeleninformatiebank: 'nicotinamide' finds
  only multivitamin infusions and fibrin sealants that contain nicotinamide (vitamin B3), no NR, NMN or NAD+ product;
  'nicotinamideribose' none. The NL note's second sentence ('an injection is a medicine, not a food') is the 23 October
  wording; it rests on the food-law sources and was not re-checked here.
