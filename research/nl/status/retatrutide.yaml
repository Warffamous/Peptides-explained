notes: |
  EMA medicines JSON: 0 for retatrutide and LY3437943; under-evaluation list of 5 October 2026: absent (orforglipron and
  three generic semaglutide applications present as controls). CBG compassionate-use list (re-fetched 27 October 2026,
  page sort date 10 July 2026): no retatrutide or LY3437943.
  CTIS (searches 'retatrutide', 'LY3437943', 'J1I', 'TRIUMPH'): nine trials. Ongoing in the EU: 2024-511450-49-00
  (TRIUMPH-5, retatrutide vs tirzepatide; Germany and Poland, 'Ongoing, recruitment ended'; end of trial estimated
  16 November 2026), 2025-522674-36-00 (SYNERGY-Outcomes master protocol with tirzepatide and retatrutide arms; 15
  countries, 14 EU member states and Norway; Netherlands 'Authorised, recruiting', decision 4 February 2026, start 22 September 2026) and
  2024-518470-13-00 (phase 1, Germany, 'Ongoing, recruitment ended'). Six others 'Ended' (Spain, Romania, Hungary,
  Poland, Slovakia, Italy, Austria). TRIUMPH-Outcomes (NCT06383390) lists EU CT number 2023-508630-34-00 on
  ClinicalTrials.gov, but CTIS showed no public information for that number on 27 October 2026 (record empty in the
  portal and the API).
  ClinicalTrials.gov (27 October 2026): NCT06383390 'Active, not recruiting', 28 Dutch site entries (Alkmaar to Zwolle),
  last update 8 October 2026; NCT07165028 'Recruiting', 6 Dutch sites (Utrecht recruiting; 's-Hertogenbosch, Amsterdam,
  Nijmegen, Rotterdam and Zwolle not yet recruiting).
