# The history timeline (rendered by <Timeline /> on /history/timeline). Locale-independent facts only:
# id, year, optional exact date, category, the compounds on this site it concerns, and the sources that support it.
# Titles and text are in src/i18n/<locale>/timeline.json. Every date was checked on 22 October 2026 against the
# source listed (Drugs@FDA ORIG-1 dates, EMA EPAR authorisation dates, the act itself for laws); see
# research/history.md. An event without `date` is known to the year only. Re-checked by the independent fact-checker
# on 22 October 2026 (openFDA ORIG-1 dates, the EMA medicines JSON, the acts); see research/history.md, "Fact-check log".
# `compounds` may only name compounds that have a data file in src/data/compounds/ (bpc-157, kpv, retatrutide,
# semaglutide, tb-500, tirzepatide on 22 October 2026). Bremelanotide (pt-141), tesamorelin and afamelanotide events
# can be tagged once those data files exist.

