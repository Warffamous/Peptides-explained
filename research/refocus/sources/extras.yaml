  note: "The live page answered with a 'System error' (scripts and browser) on 24 October 2026; read from the Internet Archive capture of 23 May 2024. Health Canada's witness: 'Thalidomide became available in sample tablet form on July 17, 1959, and was licensed for prescription use by the Department of National Health and Welfare, now Health Canada, on April 1, 1961. It remained legally available until March 2, 1962, when it was removed from the market.' These dates differ from the Federal Court of Appeal's background facts (approval 22 November 1960; permanent withdrawal ordered 6 April 1962; ca-fca-2013-43-celgene): see the .md, UNRESOLVED. HOST NOT ALLOWLISTED (www.ourcommons.ca). factcheck (24 October 2026): the live page and the evidence PDF answer HTTP 403 to scripts ('System error' page); the archive capture of 23 May 2024 (raw capture) was read again: meeting No. 053, Tuesday 9 May 2017; the quotation is confirmed word for word; the speaker is Ms. Cindy Moriarty (title as in the author line; the draft's description of the witness was replaced with her name and title as printed)."

webb-1963-canadian-thalidomide:
  type: article
  authors: "Webb JF"
  title: "Canadian thalidomide experience"
  container: "Canadian Medical Association Journal"
  year: 1963
  volume: "89"
  pages: "987-992"
  pmid: "14076167"
  pmcid: PMC1921912
  verified: pubmed
  note: "PubMed record read 24 October 2026 (no DOI). Abstract: data on 115 children, including three sets of twins, born in Canada in 1961 and 1962 with malformations associated with thalidomide taken by their mothers in early pregnancy; 74 were alive at the time of reporting (41 severely handicapped), 8 stillborn, 33 had died; of 112 mothers only 60 had had the drug prescribed by the physician providing maternity care; the author pleads for better ways to collect information on congenital malformations. Supports the scale of the Canadian tragedy."

