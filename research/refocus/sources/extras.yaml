mcbride-1961-thalidomide-letter:
  type: article
  authors: "McBride WG"
  title: "Thalidomide and congenital abnormalities (letter)"
  container: "The Lancet"
  year: 1961
  volume: "278"
  pages: "1358"
  doi: 10.1016/S0140-6736(61)90927-8
  verified: doi
  note: "Crossref record (read 24 October 2026): The Lancet, volume 278, issue 7216, page 1358, December 1961, author W.G. McBride. Not indexed in PubMed (citation lookup and author search, 24 October 2026). The TGA's history (au-tga-mcewen-2007-history, p. 45) quotes its first paragraph: congenital abnormalities in about 1.5% of babies, but 'almost 20%' among babies of women given thalidomide ('Distival') in pregnancy, and notes an editorial footnote on the withdrawal of the distributor's thalidomide preparations two weeks earlier. The exact issue day is not in the Crossref record (UNRESOLVED; print 'December 1961')."

au-tga-mcewen-2007-history:
  type: book
  authors: "McEwen J"
  title: "A History of Therapeutic Goods Regulation in Australia"
  container: "Therapeutic Goods Administration, Commonwealth of Australia (ISBN 978-0-9804229-0-0)"
  year: 2007
  url: https://www.tga.gov.au/sites/default/files/history-tg-regulation.pdf
  accessed: 2026-10-24
  verified: url
  note: "Official TGA publication, September 2007; the 900 KB PDF was downloaded from tga.gov.au with Node fetch on 24 October 2026 and read (pdftotext). Chapter 6 (pp. 45 to 47): McBride's Lancet letter of December 1961; in March 1963 the Minister for Health (Senator Wade) announced a drug-safety section and 'a committee of independent experts'; 'The expert committee, known as the Australian Drug Evaluation Committee, was appointed on 3 June 1963' (citing the Director-General of Health's Annual Report 1962-63); thalidomide imports had been controlled under the Customs (Prohibited Imports) Regulations. Chapter 15 (p. 129): ADEC set up the adverse drug reaction reporting scheme, which 'commenced' in August 1964; 760 reports by December 1966; Australia was one of ten countries in the WHO pilot drug-monitoring project from 1968; ADRAC first met on 26 May 1970. Chapter 7 (pp. 51 to 62): the Therapeutics Division of the Department of Health was 'restructured and designated as the Therapeutic Goods Administration' in August 1989 (p. 51); the Therapeutic Goods Act 1989 and Therapeutic Goods Regulations 1990 came 'into effect on 15 February 1991' (p. 62; p. 51 says 'February 1, 1991': the book is internally inconsistent; legislation.gov.au supports 15 February 1991, see au-tg-act-1989-asmade-details). factcheck (24 October 2026): PDF downloaded again (901,046 bytes) and read; every quotation, date and figure above confirmed (ADEC appointed 3 June 1963; McBride of Hurstville, 'almost 20%' and about 1.5%; ADR scheme August 1964; 760 reports; 'ten participating countries' in 1968; ADRAC 26 May 1970; TGA designation August 1989; 15 February 1991 and 'February 1, 1991'; thalidomide 'controlled under the Customs (Prohibited Imports) Regulations'). CORRECTED page numbers (printed page numbers, from the page footers): the ADR scheme is on p. 129 (draft: p. 128); the TGA designation and 'February 1, 1991' are on p. 51 (draft: p. 50); '15 February 1991' is on p. 62 (draft: p. 61). pp. 45 and 47 were right. The Minister's March 1963 statement is dated in the book only as after the AMA Federal Council meeting 'early in March' 1963."

