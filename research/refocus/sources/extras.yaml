  note: "GOV.UK content API, read 24 October 2026 (page and the HTML consultation document). Opened 21 October 2026, closes 13 January 2027 at 11:59pm; England only. Proposal: high-risk cosmetic and wellbeing procedures, 'including cosmetic surgery and certain injectable and laser treatments', only by doctors, dentists and independent-prescribing nurses, midwives or pharmacists; cosmetic surgery by doctors only; no procedures for under-18s except NHS care or treatment of a medical condition; providers to register with the Care Quality Commission, with a transition period before the restrictions come into force; breach a criminal offence. The listed non-surgical procedures include 'Intravenous procedures', defined as procedures 'where any substance is introduced intravenously for a cosmetic or wellbeing purpose' (the document mentions intravenous infusions of vitamins and minerals 'to improve energy or focus'). A draft statutory instrument is attached (The Health and Social Care Act 2008 (Regulated Activities) (Amendment) (No. 2) Regulations 2026). The consultation does not name peptides or NAD+; its relevance to this site is the IV 'wellbeing drip' setting (NAD+ infusions); subcutaneous peptide injections are not among the procedures found in the parts read."

