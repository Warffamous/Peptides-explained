  year: 2026
  url: https://recalls-rappels.canada.ca/en/feed/health-products-alerts-recalls
  accessed: 2026-10-23
  verified: url
  note: "Tested 23 October 2026 with curl (three times, with and without ?page= and ?items_per_page=) and WebFetch: HTTP 200, application/rss+xml, RSS 2.0, but ONLY 3 items, all medical-device recalls of 21 October 2026 (identical to the Medical devices feed apart from the channel description). The drug recall published the same day (NID 82831, Femyso) is missing from it, so the feed shows only the latest three health-product items, not a day's or a week's worth. pubDate is ISO 8601 without a time zone (2026-10-21T12:00:00), not RFC 822; JavaScript's Date parses it as local time. Not suitable as the only Canadian source for headlines: on a day with more than three health-product postings, items are lost even with a daily fetch. HOST NOT ALLOWLISTED."

ca-hc-recalls-open-data:
  type: dataset
  authors: "Health Canada"
  title: "Recalls and Safety Alerts (open data, JSON and CSV)"
  container: "Open Government Portal (open.canada.ca), dataset d38de914-c94c-429b-8ab1-8776c31643e3"
  year: 2026
  url: https://recalls-rappels.canada.ca/sites/default/files/opendata-donneesouvertes/HCRSAMOpenData.json
  accessed: 2026-10-23
  verified: url
  note: "Dataset record on open.canada.ca (CKAN API): title 'Recalls and Safety Alerts', publisher Health Canada, update frequency 'continual', resources in English and French, JSON and CSV. The English JSON (15.8 MB) was downloaded on 23 October 2026: 34,285 records with fields NID, Title, URL, Organization, Product, Issue, What you should do, Category, Recall class, Last updated, Archived; newest record dated 2026-10-22. It contains every peptide-related Health Canada advisory found by the canada-legal searches (for example NID 81874, 9 April 2026, 'Think twice before injecting peptides bought online'; NID 82047, 7 May 2026, GHK-Cu and BPC-157 powder). A complete, machine-readable alternative to the three-item RSS feed; it needs a JSON reader in scripts/fetch-news.ts (filter on Organization 'Drugs and health products' or 'Communications and Public Affairs Branch' and the site's keywords). HOST NOT ALLOWLISTED."

