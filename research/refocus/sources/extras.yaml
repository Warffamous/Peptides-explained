  accessed: 2026-10-23
  verified: url
  note: "Tested 23 October 2026 with curl and WebFetch: HTTP 200, application/atom+xml, well-formed Atom 1.0, 20 entries; newest entry 23 October 2026 16:42 (+01:00, an MHRA approval), oldest 22 September 2026; every entry links to www.gov.uk. Carries MHRA press releases and news stories, including enforcement releases (the 15 October 2026 counterfeit-pens seizure, mhra-2026-10-counterfeit-pens, was in it). Only 20 entries: a daily fetch is enough, a weekly fetch could miss items in a busy month."

