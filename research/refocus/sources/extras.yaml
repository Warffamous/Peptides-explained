ca-hc-feed-recalls-health-products-rss:
  type: regulator
  authors: "Health Canada"
  title: "Health and safety recalls and alerts: Health product (RSS feed)"
  container: "recalls-rappels.canada.ca"
  year: 2026
  url: https://recalls-rappels.canada.ca/en/feed/health-products-alerts-recalls
  accessed: 2026-10-24
  verified: url
  note: "Tested 23 October 2026 (curl three times, with and without ?page= and ?items_per_page=; WebFetch) and 24 October 2026 (WebFetch, Node fetch): HTTP 200, application/rss+xml, RSS 2.0, but ONLY 3 items, all medical-device recalls of 21 October 2026 (Azurion 7 Systems; i-STAT hs-TnI Cartridge; FP3D Resins). The drug recall published the same day (NID 82831) is missing from it, so the feed shows only the latest three health-product items. pubDate is ISO 8601 without a time zone (2026-10-21T12:00:00), not RFC 822; JavaScript's Date reads it as local time (on 24 October it parsed as 10:00 UTC on a machine set to Europe/Amsterdam, then UTC+2 (summer time until 25 October 2026); CORRECTED by the fact-checker, the draft said UTC+1; on a UTC runner it would be 12:00 UTC). factcheck (24 October 2026): re-fetched with the fetcher's user agent: 3 items, the same three device recalls; the open-data file confirms that the same day's drug recall (NID 82831, Femyso) has a lower NID than the three feed items (82839 to 82841), consistent with the feed showing only the three newest health-product postings. Not suitable as the only Canadian source: on a day with more than three health-product postings, items are lost even with a daily fetch. HOST NOT ALLOWLISTED."

ca-hc-recalls-open-data:
  type: dataset
  authors: "Health Canada"
  title: "Recalls and Safety Alerts (open data, JSON and CSV)"
  container: "Open Government Portal (open.canada.ca), dataset d38de914-c94c-429b-8ab1-8776c31643e3"
  year: 2026
  url: https://recalls-rappels.canada.ca/sites/default/files/opendata-donneesouvertes/HCRSAMOpenData.json
  accessed: 2026-10-24
  verified: url
  note: "Dataset record (CKAN API, re-read 24 October 2026): title 'Recalls and Safety Alerts', publisher Health Canada, frequency 'continual', four resources (English and French JSON and CSV). The English JSON was downloaded on 23 October 2026: 34,285 records with fields NID, Title, URL, Organization, Product, Issue, What you should do, Category, Recall class, Last updated, Archived; newest record dated 2026-10-22. A HEAD request on 24 October 2026 gave HTTP 200, application/json, 15,808,745 bytes, Last-Modified 23 October 2026 02:13:57 GMT (so it is regenerated about daily). It contains every peptide-related Health Canada advisory found by the canada-legal searches (for example NID 81874, 9 April 2026; NID 82047, 7 May 2026). A complete, machine-readable alternative to the three-item RSS feed; it needs a JSON reader in scripts/fetch-news.ts (filter on recent 'Last updated' dates, the health-product categories and the site's keywords). HOST NOT ALLOWLISTED. factcheck (24 October 2026): CKAN record re-read (title, publisher Health Canada, frequency 'continual', four resources: confirmed). The file was downloaded again: 34,287 records, newest 'Last updated' 2026-10-23, Last-Modified 24 October 2026 02:13:12 GMT (daily regeneration confirmed); NID 81874 (2026-04-09, Category 'Drugs') and NID 82047 (2026-05-07, 'Drugs', Type I) are present, as are the earlier peptide advisories 74731, 75741, 77218, 77275 and 77807. CORRECTION: there is no Category called 'Health products' in the file; health-product records carry Category values such as 'Drugs', 'Natural health products', 'Biologic or vaccine' and the medical-device categories, under Organization values 'Drugs and health products', 'Marketed health products', 'Medical devices' and 'Communications and Public Affairs Branch'. A filter on Category 'Health products' would keep nothing; filter on those Category values (or exclude the CFIA, TC and consumer-product records) instead."

