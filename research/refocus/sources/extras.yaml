ca-fca-2013-43-celgene:
  type: law
  authors: "Federal Court of Appeal (Canada); Gauthier J.A., Sharlow J.A. concurring, Nadon J.A. dissenting"
  title: "Canada (Minister of Health) v. Celgene Inc., 2013 FCA 43 (judgment of 15 February 2013, docket A-75-12)"
  container: "Federal Court of Appeal decisions (decisions.fca-caf.ca)"
  year: 2013
  url: https://decisions.fca-caf.ca/fca-caf/decisions/en/37704/1/document.do
  accessed: 2026-10-24
  verified: url
  note: "PDF downloaded with Node fetch on 24 October 2026 and read (pdftotext). Background paras. 3 to 12 (facts found by the Federal Court judge): in Canada, W.M.S. Merrell Company received approval for thalidomide as KEVADON on 22 November 1960, and Frank W. R. Homer Limited for TALIMOL on 11 October 1961 (para. 4); 'The Department of Health ordered the permanent withdrawal of thalidomide from the Canadian market on April 6, 1962' (para. 6); the tragedy 'prompted a complete revision of the Regulations', which 'marked the first appearance of the requirement for manufacturers to submit evidence of efficacy in seeking a Notice of Compliance' (para. 7, citing Health Canada, 'Brief History of Drug Regulations in Canada'); Bill C-3, enacted 20 December 1962, placed thalidomide (with LSD) on Schedule H to the Food and Drugs Act, absolutely prohibiting its sale (para. 8); later schedule changes in 1968, 1969, 1970 and 1984 (paras. 9 to 12). Para. 62 and the dissent at para. 95: the efficacy requirement was introduced in 1963 by SOR/63-386. The court did not decide the thalidomide history; these are background facts. HOST NOT ALLOWLISTED (decisions.fca-caf.ca)."

