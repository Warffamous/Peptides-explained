  url: https://www.tga.gov.au/resources/guidance/determining-if-your-content-advertising
  accessed: 2026-10-24
  verified: url
  note: "Published 21 June 2022, last updated 7 April 2026. Whether content is advertising is assessed case by case and 'is determined not by the actual intentions of the person', but by whether the content 'on its face appears to be designed or calculated to promote the supply or use'; 'content that describes the features or benefits of a therapeutic good is not necessarily advertising if it is clear on its face that it was not designed or calculated to promote'. Example of non-promotional material: a peer-reviewed article presenting positive and negative findings and limitations, avoiding persuasive language, with no references to commercial availability. Promotional indicators include calls to action, favourable impressions of specific goods, superlatives, emphasising benefits while downplaying risks, price and point-of-sale information, and dissemination by a party with a financial interest. (For the editor: it explains why this site must stay non-promotional for Australian readers.)"

