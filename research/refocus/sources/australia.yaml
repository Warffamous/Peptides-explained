  title: "TGA tests counterfeit retatrutide product following serious adverse event report (safety alert)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/safety/safety-monitoring-and-information/safety-alerts/tga-tests-counterfeit-retatrutide-product-following-serious-adverse-event-report
  accessed: 2026-10-24
  verified: url
  note: "Published 14 September 2026. After a report of uncontrollable vomiting with a torn oesophagus needing hospital treatment, TGA testing of the product in its unmarked vial found 'undeclared semaglutide and no retatrutide', at about 8 times the level in semaglutide products in the ARTG. 'Retatrutide is currently undergoing clinical trials in humans and has not been approved by the TGA or any comparable international regulator. Any retatrutide product accessed outside of clinical trials could be a counterfeit product.' Penalties under the Act include civil penalties 'of up to $1.82 million per breach for individuals or $18.2 million per breach for corporations, and criminal penalties of up to 7 years imprisonment'. (Phone number on page not recorded.)"

au-tga-2026-10-prescription-import-infringements:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "More than $126k in infringement notices for unlawful importation and advertising of prescription-only medicines (media release)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/news/media-releases/more-126k-infringement-notices-unlawful-importation-and-advertising-prescription-only-medicines
  accessed: 2026-10-24
  verified: url
  note: "Published 6 October 2026. 12 infringement notices totalling $126,720 to 2 companies and 5 individuals, paid July to September 2026. Relevant to personal importers: two Victorian individuals received 2 notices ($7,920) and 1 notice ($3,960) for 'Importation of Mounjaro pens', a NSW individual 1 notice ($3,960) for prescription-only erectile dysfunction medicines, a Victorian individual 1 notice for hyaluronic acid syringes; 'The products were not entered in the ARTG and did not have the required approval, authority or exemption to permit their advertising or importation.' The body of the release names two companies; cite only for the individual-importer facts and do not name them."

au-tga-2026-09-personal-import-packaging:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "New packaging rules for personal imports (media release)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/news/media-releases/new-packaging-rules-personal-imports
  accessed: 2026-10-24
  verified: url
  note: "Published 8 September 2026. The Government changed the Personal Importation Scheme 'to help authorities identify imported therapeutic goods and reduce the risk of unidentified, mislabelled or counterfeit products entering Australia'; medicines 'should remain in their original packaging where possible, including any dispensing labels or product information'; the changes also clarify the types of goods covered, who counts as immediate family, and 'evidence requirements for people travelling to Australia with prescription-only medicines'. If an import does not meet the conditions 'the goods may be seized and individuals may lose both the goods and the money they paid'."

au-tga-personal-importation-scheme:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Personal Importation Scheme"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/products/unapproved-therapeutic-goods/access-pathways/personal-importation-scheme
  accessed: 2026-10-24
  verified: url
  note: "Last updated 8 September 2026. Conditions: personal or immediate-family use only, 'they cannot be sold, supplied or given away to others'; 'If the medicine is prescription-only in Australia, you must hold a valid Australian prescription or written authority at the time of importation'; no more than 3 months' supply per import and 15 months in 12 months; original packaging or packaging that allows accurate identification ('if the labels are not intact, you will not receive the products'); the import must not include vaping products, 'contain a controlled substance' (link to the ODC list) or be prohibited under Customs or quarantine rules. A written authority must be from an Australian registered medical practitioner and contain listed details; eScripts are not accepted; a written authority obtained after the goods are held does not comply; counterfeit goods are prohibited in all cases. 'You may also face significant fines, or civil or criminal proceedings.' Worked example: a prescription-only medicine bought overseas without an Australian prescription is seized, 'No compensation is provided'."

au-tga-sas-individual-patients:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Access to unapproved therapeutic goods for individual patients (Special Access Scheme)"
  container: "tga.gov.au"
  year: 2025
  url: https://www.tga.gov.au/business-services/special-access-scheme-and-authorised-prescriber-online-system/access-unapproved-therapeutic-goods-individual-patients-special-access-scheme
  accessed: 2026-10-24
  verified: url
  note: "Last updated 3 December 2025. Category A: seriously ill patients (medical practitioners only), access immediately, notify within 28 days. Category C: goods on the 'established history of use' list, for listed practitioner types, notify within 28 days. Category B: apply and wait for approval; give a brief clinical justification, including why goods in the ARTG may not be appropriate and the expected benefits versus risks; usually processed in 2 to 5 days by a TGA officer who is a medical practitioner or pharmacist. 'As the prescriber, it is your responsibility to source the unapproved therapeutic good'; 'TGA approval does not override any State or Territory requirements'; 'Sponsors are under no obligation to supply'; the prescriber must report adverse events or defects within 15 days. Category A cannot be used for Schedule 9 drugs of abuse where state law prohibits them."

au-tga-authorised-prescriber:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Access to unapproved therapeutic goods for multiple patients (Authorised Prescriber)"
  container: "tga.gov.au"
  year: 2025
  url: https://www.tga.gov.au/business-services/special-access-scheme-and-authorised-prescriber-online-system/access-unapproved-therapeutic-goods-multiple-patients-authorised-prescriber
  accessed: 2026-10-24
  verified: url
  note: "Last updated 23 December 2025. A medical practitioner (general, specialist or limited registration) can become an Authorised Prescriber for a class of patients with the same condition; for goods not on the established history of use list, the 'standard pathway' needs approval from a human research ethics committee (HREC) or endorsement by a specialist college; the prescriber must report suspected adverse events and defects, and the number of patients treated every 6 months."

au-tga-access-unapproved-goods-practitioners:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Access an unapproved therapeutic good (health practitioners)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/health-professional-information-and-resources/access-unapproved-therapeutic-good-health-practitioners
  accessed: 2026-10-24
  verified: url
  note: "Last updated 7 October 2026. Individual patients: Special Access Scheme; multiple patients: Authorised Prescriber. Only AHPRA-registered practitioners can apply; patients, sponsors and non-practitioners cannot. Before applying, consider ARTG-included treatments, the risks (unapproved goods have not been evaluated for quality, safety, efficacy), obtain informed consent, follow good medical practice and check state and territory requirements. 'You can refuse to prescribe if you believe there is insufficient clinical justification or evidence'; 'You are responsible for the use of an unapproved therapeutic good and all outcomes'. Goods with Schedule 9 or 10 substances, and nicotine pouches, cannot be accessed through these pathways."

au-tga-compounded-medicines-guidance:
  type: guideline
  authors: "Therapeutic Goods Administration"
  title: "Manufacturing, supplying and advertising compounded medicines lawfully (guidance)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/guidance/manufacturing-supplying-and-advertising-compounded-medicines-lawfully
  accessed: 2026-10-24
  verified: url
  note: "Published 14 May 2026, last updated 8 September 2026 ('Updated to clarify that compounded medicines cannot be advertised to the public'). 'We do not evaluate the safety, quality or efficacy of compounded medicines before they are supplied'. Under the Act 'manufacture' includes compounding; licence exemptions are in Schedule 8 of the Regulations (pharmacists in a pharmacy open to the public, supplying from those premises; doctors for their own patients). The extemporaneous compounding exemption (Schedule 5 item 6) means that for a prescription-only medicine 'the pharmacist has a prescription or order, and the patient has requested supply ... before the pharmacist ... compounds the medicine'; it does not apply to gene therapy, medicinal cannabis or GLP-1 receptor agonist analogues. 'In all other circumstances, compounding in anticipation of demand is prohibited' (only hospital pharmacists may compound in anticipation, under item 6A); batch preparation only after prescriptions for the whole batch. 'From 1 October 2024, pharmacists must not compound medicines containing GLP-1 receptor agonist analogues.' 'Advertising unapproved therapeutic goods to the public, including compounded medicines, is prohibited under subsections 42DL(12) and 42DLB(9)'; a compounding service may be advertised if no specific product is referred to. Compounded prescription medicines carry the same prescribing, dispensing and supply restrictions as other prescription medicines."

au-tga-2024-03-south-yarra-pharmacy-warrant:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Search warrant executed on South Yarra pharmacy (media release)"
  container: "tga.gov.au"
  year: 2024
  url: https://www.tga.gov.au/news/media-releases/search-warrant-executed-south-yarra-pharmacy
  accessed: 2026-10-24
  verified: url
  note: "Published 1 March 2024. TGA officers, with the Victorian Department of Health and the Victorian Pharmacy Authority, executed a search warrant on a Melbourne pharmacy (not named) as part of an investigation into 'the alleged unlawful manufacture, supply and export of therapeutic goods including prescription only medication'; seized items included 'semaglutide, peptides, and human growth hormones, which the TGA will allege have been unlawfully manufactured'. The TGA head: pharmacists 'are most likely breaking the law if they are manufacturing or supplying medicines prior to receiving a prescription, except in very limited circumstances'; 'the safety of compounded medicines are not assessed by the TGA'."

au-tga-media-releases-peptide-log-2026-10-24:
  type: dataset
  authors: "Therapeutic Goods Administration"
  title: "TGA media releases on peptide advertising cases that name a company (log, read 24 October 2026)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/news/media-releases
  accessed: 2026-10-24
  verified: url
  note: "Log of TGA releases read on 24 October 2026 whose title or URL names a company (seller rule: not registered one by one; persons not named here). (1) Release of 28 September 2026 (linked from the TGA peptide products hub, 'Latest articles'): the TGA has commenced Federal Court proceedings against a former company (now in liquidation; leave of the Court needed) and its two former directors, alleging it 'unlawfully advertised peptides, such as BPC-157, CJC-1295 and GHRP-6, on its website and social media pages' between 6 June 2024 and 14 July 2025, including for cancer, HIV/AIDS and mental illness, described as restricted or prohibited representations; the directors allegedly aided, abetted, counselled or procured it; the TGA seeks declarations and pecuniary penalties. The TGA head: the TGA 'will take legal action against all entities unlawfully operating in the peptide industry. This includes health practitioners, compounding pharmacies, social media influencers and telehealth clinics'. (2) Release of 23 July 2019: the Federal Court ordered a peptide clinic company to pay $10 million for advertising breaches, including 'advertising Schedule 4 substances on the website and on social media channels, advertisements using the word \"peptides\"', and restricted and prohibited representations (uses listed included anti-ageing, body building, tanning and weight loss). The originating application and concise statement for (1) are linked from the release and were not opened."

au-tga-pieds-article:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Performance and image enhancing drugs (news article)"
  container: "tga.gov.au"
  year: 2019
  url: https://www.tga.gov.au/news/news-articles/performance-and-image-enhancing-drugs
  accessed: 2026-10-24
  verified: url
  note: "Published 31 July 2019 (page modified 12 August 2026; it notes ASADA became Sport Integrity Australia on 1 July 2020). PIEDs include 'peptide hormones, growth factors, and related peptide drugs' and tanning agents 'such as melanotan-I and melanotan-II'. 'Most performance and image enhancing drugs are illegal to supply to Australian consumers who do not have a prescription'; 'for research purposes only' labels do not change that. 'Depending on the drug and the state in which you live, possession of a performance and image enhancing drug without a prescription may also be illegal. You could face a fine or prison sentence for possession.' Needle and syringe programs provide sterile injecting equipment; the page links each state's program (NSW, Vic, Qld, WA, SA, Tas, NT health department pages); PIEDs can be disposed of at a pharmacy."

au-tga-advertising-determining-content:
  type: guideline
  authors: "Therapeutic Goods Administration"
  title: "Determining if your content is advertising (guidance)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/guidance/determining-if-your-content-advertising
  accessed: 2026-10-24
  verified: url
  note: "Published 21 June 2022, last updated 7 April 2026. Whether content is advertising is assessed case by case and 'is determined not by the actual intentions of the person', but by whether the content 'on its face appears to be designed or calculated to promote the supply or use'; 'content that describes the features or benefits of a therapeutic good is not necessarily advertising if it is clear on its face that it was not designed or calculated to promote'. Example of non-promotional material: a peer-reviewed article presenting positive and negative findings and limitations, avoiding persuasive language, with no references to commercial availability. Promotional indicators include calls to action, favourable impressions of specific goods, superlatives, emphasising benefits while downplaying risks, price and point-of-sale information, and dissemination by a party with a financial interest. (For the editor: it explains why this site must stay non-promotional for Australian readers.)"

# ================================================================ TGA: the ARTG

au-tga-about-artg:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "About the Australian Register of Therapeutic Goods (ARTG)"
  container: "tga.gov.au"
  year: 2024
  url: https://www.tga.gov.au/products/regulations-all-products/about-australian-register-therapeutic-goods-artg
  accessed: 2026-10-24
  verified: url
  note: "Last updated 28 November 2024. 'The ARTG is the public database of therapeutic goods that can be legally supplied in Australia.' It holds product name, formulation, sponsor and manufacturer details, and links Consumer Medicine Information and Product Information; access schemes for goods not in the ARTG (SAS, Authorised Prescriber, Personal Importation Scheme, clinical trials) 'cannot be used to facilitate the commercial supply of therapeutic goods'."

au-tga-listed-medicines:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Listed medicines"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/products/medicines/listed-medicines
  accessed: 2026-10-24
  verified: url
  note: "Read 24 October 2026. 'Listed medicines are low-risk, non-prescription products' such as vitamins, minerals, herbal substances and fish oil; they must be in the ARTG before supply; 'Listed medicines are not individually assessed by us before supply. They can only contain low-risk ingredients and only make low-level health claims'; the sponsor must 'self-certify' compliance."

au-tga-prescription-medicines-overview:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Prescription medicines overview"
  container: "tga.gov.au"
  year: 2019
  url: https://www.tga.gov.au/products/medicines/prescription-medicines/overview/prescription-medicines-overview
  accessed: 2026-10-24
  verified: url
  note: "Last updated 18 November 2019. A prescription medicine 'can only be made available to a patient on the written instruction of an authorised health professional'; 'All prescription medicines are registered medicines and can be identified by an AUST-R number on the label'; a company must provide 'comprehensive evidence of the medicine's quality, safety and efficacy', including clinical trials; standard evaluation can take up to 11 months; reasons a medicine is prescription-only include risk, route (for example if it is injected) and potential for misuse."

au-artg-search-australia-legal-2026-10-24:
  type: dataset
  authors: "Therapeutic Goods Administration"
  title: "Australian Register of Therapeutic Goods (ARTG) searches, 24 October 2026: compounds not covered by status batches b and c, with controls"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/artg?keywords=retatrutide
  accessed: 2026-10-24
  verified: url
  note: "Searched on 24 October 2026 (ARTG search by keyword; results show current entries; the engine splits and fuzzy-matches terms, so the first page of every split result was checked). 'There were no matching results' for: retatrutide, elamipretide, forzinity, thymalfasin, zadaxin, 'thymosin alpha', epitalon, epithalon, sermorelin, tesamorelin, bremelanotide, melanotan. Split or fuzzy results with no peptide on the first page: LY3437943 (146, dental implants), MTP-131 (2, technetium medronate kits), AOD9604 and \"AOD-9604\" (1,180, unrelated supplements and devices), \"MOTS-c\" (14, wrist implants and wheelchairs), \"semax\" (33, bone cement), \"selank\" (49, sealing devices). Controls: semaglutide 35 results (Ozempic, Wegovy and Wegovy FlexTouch, and another semaglutide brand), tirzepatide 18 (Mounjaro vials and KwikPens), somatropin 30, afamelanotide 1 (SCENESSE implant, ARTG 327947). Nicotinamide riboside returned 82 and nicotinamide mononucleotide 135 results, including listed products containing those ingredients. Entry pages show a 'Licence category': a nicotinamide riboside product (ARTG 450569) shows 'LI' (listed) and a Mounjaro KwikPen (ARTG 439430) shows 'RE' (registered). Products and sponsors of listed supplements are not named on the site."

