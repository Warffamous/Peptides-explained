  note: "Current as at 9 July 2026. Appendix D of the Poisons and Therapeutic Goods Regulation 2008 lists Schedule 4 substances 'liable to abuse, misuse and diversion, warranting more stringent controls on possession and supply' (S4D). 'Possession of a S4D medicine is prohibited unless authorised'; 'A person for whom the S4D medicine has been lawfully prescribed or supplied, or their carer, may also be in possession'. NSW Appendix D 'is not the same as' the national Appendix D: 'NSW does not automatically adopt the National Appendix D'; 'To date, NSW has included all entries in section 5 of the National Appendix D'; 'NSW adopts the Schedules of the National Poisons Standard'. The list on this page includes AOD-9604, CJC-1295, follistatin, the GHRH, GHRP and GHS group entries, GHRP-6, hexarelin, ibutamoren, insulin-like growth factors, ipamorelin, pralmorelin, somatropin, TB-500 and thymosin beta 4. It does NOT include BPC-157 (searched for 'BPC'), melanotan II, capromorelin, lonapegsomatropin, somapacitan or somatrogon, although BPC-157 has been in national Appendix D clause 5 since 1 June 2024. UNRESOLVED: whether the NSW Regulation's Appendix D itself names BPC-157 (official legislation site blocked); the page's statement that NSW includes all national clause 5 entries conflicts with its own list."

