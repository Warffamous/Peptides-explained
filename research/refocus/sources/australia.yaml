ngement notice, warrant, court case) about peptides was found. Most other results were collagen-peptide listed medicines, sponsor cancellations, haemostatic devices and unrelated guidance. 'ibutamoren': one safety alert (au-tga-2026-06-ibutamoren-capsules-alert) plus scheduling publications and advertising guidance."

