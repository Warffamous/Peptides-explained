  accessed: 2026-10-24
  verified: url
  note: "Last updated 2 September 2026. Separate reporting routes for consumers, health professionals and industry; reports can be searched in the Database of Adverse Event Notifications (DAEN). The consumer page is registered as au-tga-report-adverse-events-consumers (extras.yaml; re-read 24 October 2026): report a medicine adverse event online through the Adverse Event Management System (https://aems.tga.gov.au/), or ask a doctor, nurse practitioner, midwife or pharmacist to help; 'If you're not sure which applies to you, choose the best option and we will check the report'."

