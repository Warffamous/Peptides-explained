  note: "First published September 2026; read in a browser on 24 October 2026. Applies to all registered health practitioners authorised to prescribe scheduled medicines. 'Compounded medicines are unapproved medicines and have not been assessed by the TGA for safety, quality and efficacy prior to supply.' 'Only prescribe off-label, unapproved or compounded medicines when a medicine included on the ARTG is unavailable or inappropriate and there is adequate evidence available to support its use'; 'Patient demand alone is not a valid reason to prescribe a medicine'; 'A thorough assessment cannot be adequately completed in a brief, online consultation'; patients must be told that their medicine 'is not approved for the intended use or has not been assessed by the TGA for safety, efficacy and quality'; informed consent includes financial consent; conflicts of interest are inherent in organisations that prescribe and dispense a single medicine; side effects must be reported to the TGA through the Adverse Event Management System, including for unapproved or compounded medicines; Ahpra 'may investigate the practice of practitioners with high rates of prescribing or compounding of any scheduled medicine, even if we have not received a complaint'. The linked case studies page (https://www.ahpra.gov.au/Resources/Prescribing-off-label-unapproved-or-compounded-medicines/Case-studies.aspx) opens with a doctor who 'prescribed a range of unapproved peptides promoted for ‘anti-ageing’ and ‘faster muscle repair’ after several patients requested them' (FACT-CHECK: inner quotation marks restored as on the page) without assessing the evidence or explaining that they were unapproved; two patients had adverse reactions and stopped. HOST NOT ALLOWLISTED (www.ahpra.gov.au)."

