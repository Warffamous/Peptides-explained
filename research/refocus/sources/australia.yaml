au-tg-amendment-2024-measures-2-glp1:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Legislation Amendment (2024 Measures No. 2) Regulations 2024 (F2024L00686), Schedule 3, and its Explanatory Statement"
  container: "Federal Register of Legislation"
  year: 2024
  url: https://www.legislation.gov.au/F2024L00686/asmade/text
  accessed: 2026-10-24
  verified: url
  note: "Registered 14 June 2024; Schedule 3 ('Amendments commencing 1 October 2024') replaces Schedule 5 item 6 of the TG Regulations so that the compounding exemption no longer covers 'medicines that contain glucagon-like peptide-1 (GLP-1) receptor agonist analogues'. The Explanatory Statement (read from the official HTML) says the TGA was aware of 'online weight loss clinics with integrated pharmacy services' offering compounded GLP-1 RA medicines 'on a commercial-like scale' to 'at least 20,000 patients'; that these are sterile injectable medicines with high-risk active substances; that the TGA had no oversight of imported raw ingredients and may not receive adverse event reports; and that commencement was delayed to 1 October 2024 to give patients time to discuss alternatives. Targeted consultation ran February to March 2024. UNRESOLVED: neither the instrument nor the ES names tirzepatide or retatrutide; whether 'GLP-1 receptor agonist analogues' covers dual and triple agonists is not stated."

au-tg-amendment-2026-measures-1:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Legislation Amendment (2026 Measures No. 1) Regulations 2026 (F2026L01167) and its Explanatory Statement"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026L01167/asmade/text
  accessed: 2026-10-24
  verified: url
  note: "Made 3 September 2026, registered 7 September 2026; Schedule 1 Part 1 commenced 8 September 2026. Items 8, 9 and 29 to 31 amend the personal importation exemption (Schedule 5 item 1): wider definition of immediate family, a new definition of overseas medical practitioner, 'imported for therapeutic use', a new requirement that the medicine be 'in packaging that enables the medicine to be accurately identified', and a new paragraph (d). The Explanatory Statement: previously, a passenger carrying a Schedule 4 or 8 good did not need a written authority from a medical practitioner; new (d) removes that exception, so passengers need a written authority from a medical practitioner or an overseas medical practitioner who treated them; unlabelled goods may be impossible to identify, so may contain unlawful or unsafe substances or be counterfeit; the TGA consulted health provider groups and the Australian Border Force. Items 10 and 12 amend regulation 7 'to ensure and clarify that the advertising of therapeutic goods that are compounded for individual patients and that are not included in the Register is prohibited under subsections 42DL(12) and 42DLB(9)', 'regardless of their scheduling status'."

