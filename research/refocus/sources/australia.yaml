  accessed: 2026-10-24
  verified: url
  note: "Published 16 September 2026; read in a browser on 24 October 2026 (found through the Pharmacy Board of Australia site search for 'peptide'). Ahpra 'has been investigating unsafe prescribing practices, particularly in high-volume and single-treatment business models. This includes the provision of unapproved peptides, medicinal cannabis and GLP-1 weight-loss drugs'; regulatory action has been taken against practitioners; Ahpra and the National Boards published new guidance that day (au-ahpra-prescribing-unapproved-guidance). The Medical Board of Australia Chair: prescribers 'must comply with legal obligations under the Therapeutic Goods Act 1989, associated Therapeutic Goods Administration (TGA) requirements, and state and territory drugs and poisons laws', and 'Peptides are like other drugs: A patient may want peptides, but that doesn't mean they need peptides.' Ahpra's CEO: people 'should not be taking chances on black-market peptides or advice from online influencers'. Ahpra and the TGA work together where prescribing concerns also involve unlawful advertising, importation or supply. Anyone with concerns about a practitioner can contact Ahpra. HOST NOT ALLOWLISTED (www.ahpra.gov.au)."

au-ahpra-prescribing-unapproved-guidance:
  type: guideline
  authors: "Australian Health Practitioner Regulation Agency and the National Boards"
