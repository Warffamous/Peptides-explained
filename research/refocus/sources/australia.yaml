# ================================================================ Commonwealth: Therapeutic Goods Act 1989

au-tg-act-s3-definitions:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Act 1989, section 3 (definitions: therapeutic goods, therapeutic use, medicine, supply, advertise, sponsor) (Compilation No. 89, 5 September 2025)"
  container: "Federal Register of Legislation"
  year: 2025
  url: https://www.legislation.gov.au/C2004A03952/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Compilation No. 89 (compilation date 5 September 2025, includes Act No. 38, 2025), the latest on legislation.gov.au on 24 October 2026; read from the official HTML text (2 volumes). Section 3(1): 'therapeutic goods' means goods represented in any way to be, or likely to be taken to be, for therapeutic use (among other limbs); 'therapeutic use' includes '(a) preventing, diagnosing, curing or alleviating a disease, ailment, defect or injury in persons' and '(b) influencing, inhibiting or modifying a physiological process in persons'; 'medicine' means therapeutic goods (other than biologicals) represented to achieve, or likely to achieve, their principal intended action by pharmacological, chemical, immunological or metabolic means; 'supply' includes supply by sale, exchange, gift, lease, loan, by way of sample or advertisement, and by administration to a person; 'advertise' includes any statement, pictorial representation or design intended, directly or indirectly, to promote the use or supply of the goods, including on the label or package; 'sponsor' means a person who imports, exports or manufactures the goods (or arranges it), but not a person who does so on behalf of another person resident or carrying on business in Australia."

au-tg-act-artg-registration-listing:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Act 1989, sections 9A (the Australian Register of Therapeutic Goods), 25 (evaluation for registration) and 26A (listing of certain medicines) (Compilation No. 89)"
  container: "Federal Register of Legislation"
  year: 2025
  url: https://www.legislation.gov.au/C2004A03952/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Section 9A(1): the Secretary maintains the Australian Register of Therapeutic Goods 'for the purpose of compiling information in relation to, and providing for evaluation of, therapeutic goods for use in humans'; 9A(3): it has parts for registered goods, provisionally registered goods, listed goods, biologicals and medical devices. Section 25(1)(c): for registration the Secretary must evaluate 'whether the quality, safety and efficacy of the goods for the purposes for which they are to be used have been satisfactorily established' (plus presentation, standards, manufacturing, advertising compliance). Section 26A: a medicine is listed when the applicant certifies, among other things, that it is eligible for listing, safe for its purposes, and contains no ingredient not specified in a determination under s 26BB(1)(a) (permissible ingredients); s 26A(1A): the Secretary 'must list the medicine ... without inquiring into the correctness of the certificate'. So registered medicines are evaluated before supply; listed medicines are self-certified and limited to permitted ingredients."

au-tg-act-s19-access-approvals:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Act 1989, section 19 (approvals or authorities for certain uses: Special Access Scheme Category B, clinical trial approvals, Authorised Prescribers, Category C rules) (Compilation No. 89)"
  container: "Federal Register of Legislation"
  year: 2025
  url: https://www.legislation.gov.au/C2004A03952/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Section 19(1): the Secretary may grant an approval for the importation, exportation or supply of specified therapeutic goods that are not registered or listed '(a) for use in the treatment of another person; or (b) for use solely for experimental purposes in humans'; 19(1AA): an approval under (1)(a) may be granted only to a health practitioner (this is the Special Access Scheme Category B application pathway; (1)(b) is the clinical trial approval). Section 19(5): the Secretary may authorise a specified medical practitioner to supply specified unapproved goods to a class of recipients (the Authorised Prescriber scheme); 19(6)(aa): the practitioner generally needs ethics committee approval. Section 19(7A): the Minister may make rules authorising classes of health practitioners to supply specified goods in specified circumstances (the basis of SAS Category C); 19(7C): supply under those rules must be notified within 28 days."

au-tg-act-s19b-19d-offences:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Act 1989, sections 19B (criminal offences) and 19D (civil penalties) for importing, exporting, manufacturing or supplying goods not in the Register (Compilation No. 89)"
  container: "Federal Register of Legislation"
  year: 2025
  url: https://www.legislation.gov.au/C2004A03952/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Section 19B(1): offence to import, export, manufacture or supply in Australia therapeutic goods for use in humans unless they are registered or listed in relation to the person, exempt, exempt under s 18A, or covered by an approval or authority under s 19 or 19A, where use of the goods has resulted or is likely to result in harm or injury: 'Imprisonment for 5 years or 4,000 penalty units, or both'. 19B(4): the same without the harm element: 12 months or 1,000 penalty units, or both. 19B(4A)-(4B): a strict liability offence, 100 penalty units. 19B(5): it is a defence that the defendant was not the sponsor of the goods. 19B(7): if the Secretary so notifies the Comptroller-General of Customs, the Customs Act 1901 applies to an unlawful importation as if the goods were forfeited prohibited imports (s 229 of that Act). Section 19D(1): civil penalty for the same conduct, maximum 5,000 penalty units for an individual and 50,000 for a body corporate; 19D(2): exception if the person was not the sponsor. Section 18 lets the regulations exempt goods (see the Regulations entries). The Act regulates import, export, manufacture, supply and advertising; it creates no offence of simple personal possession (possession is a matter for state and territory law; see the state entries)."

au-tg-act-advertising:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Act 1989, Chapter 5 Part 5-1 (advertising): sections 42AA, 42BAA, 42DJ, 42DL and 42DLB (Compilation No. 89)"
  container: "Federal Register of Legislation"
  year: 2025
  url: https://www.legislation.gov.au/C2004A03952/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Section 42AA: Part 5-1 does not apply to advertisements directed exclusively to health practitioners and certain other professional or trade audiences. Section 42BAA: the Minister may make the Therapeutic Goods Advertising Code. Section 42DL(1)-(4): offences of advertising, or causing the advertising of, therapeutic goods where any of subsections (5) to (12) applies: 5 years or 4,000 penalty units if harm results or is likely; 12 months or 1,000 penalty units; and a strict liability offence of 100 penalty units. 42DL(10): an advertisement that 'refers to substances, or goods containing substances, included in Schedule 3, 4 or 8 to the current Poisons Standard but not in Appendix H', other than a reference authorised or required by an Australian government authority. 42DL(12): an advertisement that refers to therapeutic goods not entered in the Register and prescribed by the regulations (regulation 7). 42DL(5): prohibited representations without permission. 42DL(13)-(14): each day is a separate offence. Section 42DLB: civil penalty for the same advertisements (subsection (7) = the Schedule 3, 4 or 8 rule; (9) = unregistered prescribed goods), maximum 5,000 penalty units for an individual and 50,000 for a body corporate."

au-tg-act-s42yk-infringement-notices:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Act 1989, sections 42YK and 42YKA (infringement notices) (Compilation No. 89)"
  container: "Federal Register of Legislation"
  year: 2025
  url: https://www.legislation.gov.au/C2004A03952/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Section 42YK(1): if the Secretary reasonably believes a person has contravened a strict liability offence or a civil penalty provision, the Secretary may give the person an infringement notice, within 12 months of the alleged contravention (42YK(2)); one notice per contravention (42YK(3)). Section 42YKA(2): the amount for a single contravention is the lesser of one-fifth of the maximum court penalty and '12 penalty units where the person is an individual, or 60 penalty units where the person is a body corporate'. 42YKA(1): paying within 28 days avoids prosecution or civil proceedings for that contravention, and payment is not an admission of guilt. (With a penalty unit of $364 for conduct from 1 July 2026, 12 penalty units = $4,368; at the earlier $330, $3,960; at $313, $3,756, which matches the per-notice amounts in the TGA releases cited.)"

au-tg-act-s52d-poisons-standard:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Act 1989, Part 6-3: sections 52A (current Poisons Standard) and 52D (Poisons Standard) (Compilation No. 89)"
  container: "Federal Register of Legislation"
  year: 2025
  url: https://www.legislation.gov.au/C2004A03952/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Section 52D(2): the Secretary may amend the current Poisons Standard or prepare a document in substitution for it; 52D(4A): such an instrument is a legislative instrument not subject to disallowance. Section 52A: 'current Poisons Standard' is the document last prepared under s 52D(2)(b); the 'first Poisons Standard' was the Standard for the Uniform Scheduling of Drugs and Poisons published by the Australian Health Ministers' Advisory Council."

au-crimes-penalty-unit-2026:
  type: law
  authors: "Commonwealth of Australia (Attorney-General)"
  title: "Crimes (Amount of a Penalty Unit) Instrument 2026 (F2026N00424), with Crimes Act 1914 section 4AA"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026N00424/asmade/text
  accessed: 2026-10-24
  verified: url
  note: "Instrument dated 15 June 2026, registered 16 June 2026, commencing 1 July 2026, made under s 4AA(1A) of the Crimes Act 1914; read from the authorised PDF. Section 5: 'the amount of a penalty unit is $364'; note: it 'is the result of indexation under subsection 4AA(3)' and 'only applies to offences committed on or after 1 July 2026'. Crimes Act 1914 s 4AA(1) (Compilation No. 167, 27 August 2026, read from the official HTML at https://www.legislation.gov.au/C1914A00012/latest/text): 'penalty unit means the amount of $330 (subject to indexation under subsection (3))'; 4AA(3): indexation on 1 July 2026 and every third 1 July; 4AA(8): the increase applies only to offences committed on or after the indexation day. So 5,000 penalty units = $1.82 million and 50,000 = $18.2 million for conduct from 1 July 2026, matching the TGA's August and September 2026 releases."

# ================================================================ Commonwealth: Therapeutic Goods Regulations 1990

# Same id and URL as status-c.yaml; facts below re-read on 24 October 2026 and extended (8 September 2026 amendments).
au-tg-regulations-1990-sch-5-item-1:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, Schedule 5 item 1 (personal importation) (compilation F2026C01012, 5 October 2026)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Compilation No. 131, compilation date 5 October 2026 (includes F2026L01167), read from the official HTML on 24 October 2026. Regulation 12(1): goods in Schedule 5 are exempt from Part 3-2 of the Act (the requirement to be in the Register). Schedule 5 item 1: 'therapeutic goods that are imported for therapeutic use in the treatment of the importer or the importer's immediate family' where (a) the goods contain no substance whose importation is prohibited under the Customs Act 1901; (b) they are not vaping goods or nicotine pouches; (c) for other medicines, one importation is not more than 3 months' supply at the manufacturer's maximum dose, the total over 12 months does not exceed 15 months' supply, and '(iii) the medicine is in packaging that enables the medicine to be accurately identified'; and (d) 'in the case of goods that are subject to Schedule 4 or Schedule 8 to the current Poisons Standard—the goods are the subject of a written authority issued by' a medical practitioner, or, if carried by the importer as a passenger on a ship or aeroplane, a medical practitioner or an overseas medical practitioner treating the importer or family. Item 1 sets no rule against injectable products as such. Regulation 2 (as amended): 'immediate family' covers spouse, de facto partner, child, parent, grandparent, grandchild or sibling, and those relatives of a spouse or de facto partner. The words 'therapeutic use', the packaging condition (c)(iii), the new (d) and the new definition of immediate family were made by the Therapeutic Goods Legislation Amendment (2026 Measures No. 1) Regulations 2026, Schedule 1 Part 1, commencing 8 September 2026 (see au-tg-amendment-2026-measures-1)."

au-tg-regs-reg-7-advertising-prescribed-goods:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, regulation 7 (prescribed goods for the advertising offence and civil penalty) (Compilation No. 131, 5 October 2026)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Regulation 7 prescribes goods for ss 42DL(12) and 42DLB(9) of the Act (advertising goods not in the Register): (a) goods under a s 19 approval or authority (SAS, Authorised Prescriber), (c) goods used under the Category A exemption (reg 12A), (d) 'therapeutic goods specified in item 1 or 6 of Schedule 5' (personally imported and compounded goods), (e) goods in Schedule 5A, and '(i) therapeutic goods that are neither the subject of an exemption, approval or authority under the Act nor an exemption, approval or authority under regulations under the Act'. So advertising an unapproved peptide product to the public is an offence and a civil penalty contravention whether or not it is scheduled. The reference to item 6 (compounded medicines) was inserted, and former paragraph 7(j) repealed, by the 2026 Measures No. 1 Regulations from 8 September 2026."

au-tg-regs-reg-12a-sas-category-a:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, regulation 12A (unapproved medicines in life-threatening cases: Special Access Scheme Category A) (Compilation No. 131)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Regulation 12A(1): for s 18(1) of the Act, all medicines are exempt from Part 3-2 except medicines in Schedule 9 or 10 of the Poisons Standard and nicotine pouches, subject to 12A(2): the medicine is given to a 'Category A patient' who (or whose guardian) has given informed consent, a statement in the approved form is completed by the medical practitioner, and the medicine is dispensed on the prescription of a medical practitioner 'in accordance with good medical practice'; 12A(3): the statement must be sent to the Secretary within 28 days. 12A(5): 'Category A patient means a person who is seriously ill with a condition from which death is reasonably likely to occur within a matter of months, or from which premature death is reasonably likely to occur in the absence of early treatment.'"

au-tg-regs-reg-12b-authorised-prescriber:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, regulation 12B (Authorised Prescribers: prescribed class and ethics committee exceptions) (Compilation No. 131)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Regulation 12B(1): for s 19(6)(a), medical practitioners engaged in clinical practice in or outside a hospital are the prescribed class. 12B(1A): the ethics committee requirement does not apply to a practitioner outside a hospital who has shown no access to an ethics committee and has an endorsement from a relevant specialist college. 12B(1B): a table of specified medicines (active ingredient, dosage form, route and indication) that may be supplied without ethics committee approval (the 'established history of use' list). No peptide on this site is in that table (searched for each name, 24 October 2026). Regulation 12BB: the only circumstance in which a s 19(1)(a) approval or s 19(5) authority must not be given is nicotine pouches."

au-tg-regs-sch-5-item-6-compounding:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, Schedule 5 items 6 and 6A (dispensed and extemporaneously compounded medicines; hospital compounding) (Compilation No. 131)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Schedule 5 item 6 exempts from the Register 'medicines that are dispensed, or extemporaneously compounded, for a particular person for therapeutic application to that person, other than the following: (a) medicines that are used for gene therapy; (b) medicines that are medicinal cannabis products; (c) medicines that contain glucagon-like peptide-1 (GLP-1) receptor agonist analogues; (d) nicotine pouches'. Item 6A: medicines compounded in a hospital by a hospital pharmacist in anticipation of need for the hospital's patients, if the hospital's drug and therapeutics committee considers it appropriate. Item 9: starting materials (ingredients for manufacture) are exempt except when prepackaged for supply for other therapeutic purposes or 'formulated as a dosage form'. Exclusion (c) was inserted by the 2024 Measures No. 2 Regulations from 1 October 2024 (au-tg-amendment-2024-measures-2-glp1); (d) from 2026."

au-tg-regs-sch-8-manufacturing-exemptions:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, Schedule 8 (persons exempt from the manufacturing licence requirement in Part 3-3 of the Act) (Compilation No. 131)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Schedule 8 (regulation 18): item 1, medical practitioners, dentists and other registered health care workers, for 'the manufacture of a medicine by a medical practitioner or a dentist specifically for a patient under the medical practitioner's or dentist's care'; item 2, pharmacists, for the manufacture of goods that are not biologicals, produced in a pharmacy open to the public where the pharmacist practises (or a Friendly Society dispensary or private hospital), for supply (other than by wholesale) on or from those premises; item 3, pharmacists and others in public hospitals, for supply in hospitals in the same State or Territory."

au-tg-regs-sch-5a-item-3-clinical-trials:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, Schedule 5A item 3 (goods used in a clinical trial: the clinical trial notification exemption) (Compilation No. 131)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Schedule 5A item 3 exempts, subject to conditions, 'Therapeutic goods to be used in a clinical trial solely for experimental purposes in humans' where the sponsor notifies the Secretary that it intends to sponsor a clinical trial using specified goods (the clinical trial notification route); the alternative is an approval under s 19(1)(b) of the Act. Regulations 12AB to 12AD set conditions (ICH Good Clinical Practice, an ethics-committee-approved protocol, the NHMRC National Statement)."

au-tg-amendment-2024-measures-2-glp1:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Legislation Amendment (2024 Measures No. 2) Regulations 2024 (F2024L00686), Schedule 3, and its Explanatory Statement"
  container: "Federal Register of Legislation"
  year: 2024
  url: https://www.legislation.gov.au/F2024L00686/asmade/text
  accessed: 2026-10-24
  verified: url
  note: "Registered 14 June 2024; Schedule 3 ('Amendments commencing 1 October 2024') replaces Schedule 5 item 6 of the TG Regulations so that the compounding exemption no longer covers 'medicines that contain glucagon-like peptide-1 (GLP-1) receptor agonist analogues'. The Explanatory Statement (read from the official HTML) says the TGA was aware of 'online weight loss clinics with integrated pharmacy services' offering compounded GLP-1 RA medicines 'on a commercial-like scale' to 'at least 20,000 patients'; that these are sterile injectable medicines with high-risk active substances; that the TGA had no oversight of imported raw ingredients and may not receive adverse event reports; and that commencement was delayed to 1 October 2024 to give patients time to discuss alternatives. Targeted consultation ran February to March 2024. UNRESOLVED: neither the instrument nor the ES names tirzepatide or retatrutide; whether 'GLP-1 receptor agonist analogues' covers dual and triple agonists is not stated."

au-tg-amendment-2026-measures-1:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Legislation Amendment (2026 Measures No. 1) Regulations 2026 (F2026L01167) and its Explanatory Statement"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026L01167/asmade/text
  accessed: 2026-10-24
  verified: url
  note: "Made 3 September 2026, registered 7 September 2026; Schedule 1 Part 1 commenced 8 September 2026. Items 8, 9 and 29 to 31 amend the personal importation exemption (Schedule 5 item 1): wider definition of immediate family, a new definition of overseas medical practitioner, 'imported for therapeutic use', a new requirement that the medicine be 'in packaging that enables the medicine to be accurately identified', and a new paragraph (d). The Explanatory Statement: previously, a passenger carrying a Schedule 4 or 8 good did not need a written authority from a medical practitioner; new (d) removes that exception, so passengers need a written authority from a medical practitioner or an overseas medical practitioner who treated them; unlabelled goods may be impossible to identify, so may contain unlawful or unsafe substances or be counterfeit; the TGA consulted health provider groups and the Australian Border Force. Items 10 and 12 amend regulation 7 'to ensure and clarify that the advertising of therapeutic goods that are compounded for individual patients and that are not included in the Register is prohibited under subsections 42DL(12) and 42DLB(9)', 'regardless of their scheduling status'."

