# ================================================================ TGA: what the regulator says about peptides

au-tga-how-we-regulate-peptides:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "How we regulate therapeutic peptide products"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/products/medicines/monitoring-and-compliance/how-we-regulate-therapeutic-peptide-products
  accessed: 2026-10-24
  verified: url
  note: "Page modified 23 September 2026 (page metadata). Peptide products regulated as therapeutic goods 'must be included in the Australian Register of Therapeutic Goods (ARTG) before they can be imported, manufactured, supplied, exported or advertised', with limited exceptions; products not in the ARTG are 'unapproved'; 'research use only' or 'not for human use' disclaimers 'do not change whether a product is regulated as a therapeutic good'. Approved peptide-based medicines include insulin, GLP-1 receptor agonists such as semaglutide, oxytocin, desmopressin and octreotide; many are prescription-only and 'cannot generally be advertised to the public'. Unapproved products are sold as injectables, powders for injection, capsules, nasal sprays, creams and more. Individuals may import under the Personal Importation Scheme 'only if all conditions of the scheme are met'; 'We work with the Australian Border Force (ABF) to identify and stop unlawful imports'; goods 'may be seized and destroyed. You may lose the products and the money you paid.' Manufacturers need a licence. It is generally unlawful to advertise unapproved goods, and prescription-only medicines, to the public; influencers, affiliates and others 'may be held accountable'. Actions may include import interventions, seizures, infringement notices, civil and criminal penalties."

au-tga-peptides-health-practitioners:
