au-tga-compounded-medicines-guidance:
  type: guideline
  authors: "Therapeutic Goods Administration"
  title: "Manufacturing, supplying and advertising compounded medicines lawfully (guidance)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/guidance/manufacturing-supplying-and-advertising-compounded-medicines-lawfully
  accessed: 2026-10-24
  verified: url
  note: "Published 14 May 2026, last updated 8 September 2026 ('Updated to clarify that compounded medicines cannot be advertised to the public'). 'We do not evaluate the safety, quality or efficacy of compounded medicines before they are supplied'. Under the Act 'manufacture' includes compounding; licence exemptions are in Schedule 8 of the Regulations (pharmacists in a pharmacy open to the public, supplying from those premises; doctors for their own patients). The extemporaneous compounding exemption (Schedule 5 item 6) means that for a prescription-only medicine 'the pharmacist has a prescription or order, and the patient has requested supply ... before the pharmacist ... compounds the medicine'; it does not apply to gene therapy, medicinal cannabis or GLP-1 receptor agonist analogues. 'In all other circumstances, compounding in anticipation of demand is prohibited' (only hospital pharmacists may compound in anticipation, under item 6A); batch preparation only after prescriptions for the whole batch. 'From 1 October 2024, pharmacists must not compound medicines containing GLP-1 receptor agonist analogues.' 'Advertising unapproved therapeutic goods to the public, including compounded medicines, is prohibited under subsections 42DL(12) and 42DLB(9)'; a compounding service may be advertised if no specific product is referred to. Compounded prescription medicines carry the same prescribing, dispensing and supply restrictions as other prescription medicines."

