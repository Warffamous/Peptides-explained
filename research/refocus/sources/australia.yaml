# Same id and URL as status-b.yaml and status-c.yaml; facts below read again on 24 October 2026.
au-poisons-standard-2026-10:
  type: law
  authors: "Commonwealth of Australia (Department of Health, Disability and Ageing)"
  title: "Therapeutic Goods (Poisons Standard - October 2026) Instrument 2026 (F2026L01327)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026L01327/latest/text
  accessed: 2026-10-24
  verified: url
  note: "Dated 28 September 2026 (made by a delegate under s 52D(2)(b) of the Act). Read again from the official HTML on 24 October 2026 (non-breaking hyphens normalised before searching). Reader's guide (not part of the instrument, s 5): the Schedules are the Secretary's or delegates' decisions 'as recommendations to Australian States and Territories' and 'The scheduling of poisons is implemented through relevant State and Territory legislation'; Schedule 4 is 'Prescription only medicines and prescription animal remedies' (FACT-CHECK: heading given in full; the draft cut it after 'medicines'), for substances whose use or supply 'should be by or on the order of persons permitted by State or Territory legislation to prescribe'; inclusion in a Schedule does not 'indicate that the poison is available' or 'indicate that it is has been approved or is efficacious for any use' (sic). Section 7: a reference to a substance includes every salt, derivative, stereoisomer, recombinant form and any preparation containing it. Section 60(1): a Schedule 4 poison must not be supplied except by a medical practitioner, dentist or vet in lawful practice, or a pharmacist dispensing a legal prescription (or limited emergency supply). Section 64(4): a poison in the table in Appendix D clause 5 'must not be possessed by a person without authority under the law of the jurisdiction in which the possession occurs'. Appendix D clause 5 ('Poisons for which possession without authority is illegal', 'for example, possession other than in accordance with a legal prescription') lists, among others: item 3 AOD-9604 (CAS No. 221231-10-3), 5 BPC-157, 6 capromorelin, 7 CJC-1295 (CAS No. 863288-34-0), 16 follistatin, 18 growth hormone releasing hormones (GHRHs) 'including those separately specified in Schedule 4', 19 growth hormone releasing peptides (GHRPs) (same words), 20 GHRP-6, 21 growth hormone secretagogues (same words), 22 hexarelin, 23 ibutamoren, 24 insulin-like growth factors, 25 ipamorelin, 31 pralmorelin (GHRP-2), 33 SARMs, 36 somatropin, 38 TB-500, 39 thymosin beta 4. Schedule 4 entries marked # (in Appendix D): AOD-9604, BPC-157, capromorelin, CJC-1295, follistatin, the GHRH, GHRP and GHS group entries, GHRP-6, hexarelin, ibutamoren, ipamorelin, pralmorelin, somatropin, TB-500, thymosin beta 4 (CORRECTED in the second run: capromorelin and ibutamoren were missing from the first run's list). Schedule 4 entries without #: afamelanotide, melanotan II, semaglutide, sermorelin, tirzepatide. Our reading, not stated in the instrument: sermorelin (a GHRH analogue) and tesamorelin (not named) would fall under the group entries 'GROWTH HORMONE RELEASING HORMONES (GHRHs)' in Schedule 4 and Appendix D clause 5 item 18 ('including those separately specified in Schedule 4'); no official document applying the group entry to either by name was found. Not named anywhere (searched 24 October 2026): bremelanotide, PT-141, retatrutide, tesamorelin, elamipretide, SS-31, thymalfasin, thymosin alpha, MOTS-c, epitalon/epithalon, Semax, Selank, KPV, GHK, nicotinamide riboside, nicotinamide mononucleotide. (FACT-CHECK 24 October 2026: every Schedule 4 entry, # mark, Appendix D clause 5 item number (items 1-41), s 2 (commencement 1 October 2026), s 3 (made under s 52D(2)(b)), s 5, s 7, s 60 and s 64(4) re-read in the official HTML and confirmed; the not-named search repeated with the same terms plus somatorelin, LY3437943, bepecin, pentadecapeptide and 'modified GRF': no match (the index has cross-references 'MK-677' for ibutamoren and 'MELANOTAN I' for afamelanotide). Although retatrutide is not named, the TGA says GLP-1 receptor agonists 'are regulated as prescription-only medicines. This includes derivatives of semaglutide or dulaglutide such as retatrutide' (au-tga-advertising-glp1-prohibited, registered in status-a.yaml; re-read live by the fact-checker); that is the TGA's application of s 7 ('every ... derivative'), not a named entry.)"

