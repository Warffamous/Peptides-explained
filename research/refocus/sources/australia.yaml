  note: "Page modified 23 September 2026. There are access pathways for prescribers to lawfully access unapproved goods, 'including some peptide products', where clinically appropriate; 'the responsibility for determining the quality and safety of the product rests with the practitioner'. Before applying, consider approved products, risks and benefits, obtain informed consent, comply with state, territory and Commonwealth laws. 'Applications should be supported by human studies that are relevant to the specific peptide, dosage form, route of administration and indication.' Compounded peptide products may be therapeutic goods subject to manufacturing, supply, prescribing and advertising controls."

