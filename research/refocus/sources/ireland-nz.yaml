  note: "Read on 23 October 2026 in a normal browser (the URL now redirects to https://www.legislation.govt.nz/act/public/2023/37/en/latest/). Date of assent 26 July 2023. Status line: 'Therapeutic Products Act 2023: repealed, on 18 December 2024, by section 3 of the Therapeutic Products Act Repeal Act 2024 (2024 No 55).' s 2: the Act was to come into force on a date appointed by Order in Council, and in any case on 1 September 2026; only subpart 2 of Part 11 (contingent amendments to the Food Act 2014) came into force the day after assent; the site shows no Order in Council made under s 2. So the regulatory scheme never came into force. (s 398, never in force, would have revoked the Medicines Regulations 1984 and the Dietary Supplements Regulations 1985; that it was to replace the Medicines Act is from nz-moh-2024-tpa-repeal-bill-disclosure.) Supports: the TPA was repealed before its main provisions took effect. factcheck (24 October 2026): status line, assent date and s 2 re-read in Chrome and confirmed ('There is no secondary legislation made under this section currently on this website'). Now traced: the TPA did not repeal the Medicines Act 1981 outright; Part 11, subpart 4 ('Amendments to Medicines Act 1981', s 413 onwards) would have amended it, repealing most of its sections (for example ss 3 to 5A and 7 to 16). HOST NOT ALLOWLISTED (www.legislation.govt.nz)."

