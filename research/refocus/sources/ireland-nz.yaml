esamorelin, elamipretide, thymalfasin or retatrutide (the only 'BPC' and 'AOD' hits are the pharmacopoeia suffix 'BPC' in old product names and 'KAODENE'). Correction: the 34 semaglutide entries are Ozempic (5), Wegovy (15), Rybelsus (8), Kayshild (5) and Kyinsu (1: insulin icodec + semaglutide, EU/1/25/1992, authorised 24 November 2025); the note omitted Kyinsu. Also found: setmelanotide (Imcivree, EU/1/21/1564/001; a melanocortin-4 agonist, not a site compound). Kayshild checked against its EPAR (ema-epar-kayshild): semaglutide, Novo Nordisk, for MASH, EU authorisation 26 March 2026, so the name may be printed. HOST NOT ALLOWLISTED (hpra.ie, assets.hpra.ie)."

