  accessed: 2026-10-23
  verified: url
  note: "Published 21 May 2026. Medsafe is 'aware of increasing imports and sales of unapproved peptides and SARMs and continue[s] to seize these products'; 'Medsafe has NOT assessed these products for quality, safety or efficacy'. Products online sellers commonly advertise: 'BPC-157, CJC-1295, GHRP-6, Ipamorelin, Kisspeptin, KLOW, melanotan II, retatrutide, sealank, seamax, TB-500 and thymosin' (Medsafe's spelling, sic), 'not a complete list'. 'Under the Medicines Act 1981, many peptide products and SARMs are prescription medicines. It is unlawful to import, supply, possess or procure prescription medicines unless this is authorised.' 'For research purposes only' 'has no legal effect and does not permit sale, supply, or use in people'; Medsafe has approved no clinical trials in New Zealand for these products. Retatrutide 'has not been approved for use by any trusted medicines regulator, apart from use in overseas clinical trials'. If you have used an unapproved injectable and feel unwell, seek medical advice; dispose of products at a community pharmacy or drug-checking service; needles in an approved sharps container returned to a needle-exchange service or participating pharmacy; report adverse effects (links the CARM form). HOST NOT ALLOWLISTED."

