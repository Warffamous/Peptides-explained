  verified: url
  note: "Read on 23 October 2026 in a normal browser (redirects to https://www.legislation.govt.nz/act/public/1981/118/en/latest/; 'Version as at 10 July 2026'). s 20(2): no person shall sell, distribute or advertise the availability of a new medicine before the Minister's consent, consent by verification or provisional consent; s 20(3): consent does not warrant safety or efficacy; s 20(4): an individual who contravenes s 20(2) is liable to up to 6 months' imprisonment or a fine up to $20,000 (body corporate: up to $100,000). s 29 (replaced on 19 November 2025 by s 11 of the Medicines Amendment Act 2025, 2025 No 66): ss 20 and 24 do not prevent a person supplying to a 'specified practitioner' (medical practitioner, nurse practitioner or pharmacist prescriber), on their request, a medicine they require 'for the treatment of a patient currently under their care'. s 29A: funded alternative medicine in a shortage. s 29B (inserted 19 November 2025): the importer or manufacturer reports every month to the Director-General (trade and generic name, dose form, strength, pack size, month, quantity) and keeps the prescriber's and patient's names. s 43(1): 'No person shall, without reasonable excuse, import, procure, receive, store, use, or otherwise have in his possession, any prescription medicine'; s 43(2): reasonable excuse includes a person to whom the medicine was lawfully supplied as a patient of an authorised prescriber; s 43(4): not knowing it was a prescription medicine is not by itself a reasonable excuse; s 43(5): contravention is an offence. s 106(1): the Minister may by notice declare any medicine a prescription, restricted or pharmacy-only medicine; s 106(3): every such notice, 'unless sooner revoked by the Minister, remain[s] in force for a period of 6 months commencing with the date on which it comes into force, and shall then cease to have effect' (the Gazette shows Medsafe publishing a fresh consolidated classification notice from time to time; see nz-gazette-2026-sl4278-classification). factcheck (24 October 2026): ss 20(2)-(4), 29(1)-(2), 29A, 29B, 43(1)-(5) and 106(1)-(4) re-read in Chrome ('Latest version as at 10 July 2026') and confirmed word for word. Precision: s 20(2) prohibits selling, distributing 'by way of gift or loan or sample or in any other way' and advertising (the word 'supply' is the page's paraphrase); s 29(1) was replaced and s 29(3) repealed on 19 November 2025 by s 11(2) of the Medicines Amendment Act 2025, and s 29(2) defines 'specified practitioner'; s 106(4): a classification notice 'is secondary legislation', so the Legislation Act 2019 decides when it starts if it gives no date (nz-legislation-act-2019). HOST NOT ALLOWLISTED (www.legislation.govt.nz)."

