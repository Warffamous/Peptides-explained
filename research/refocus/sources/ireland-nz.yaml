  accessed: 2026-10-23
  verified: url
  note: "Dated 28 March 2024. 874,945 dosage units of falsified and other illegal medicines detained in 2023; 2,348 websites, e-commerce listings and/or social media pages amended or shut down; two prosecutions (anabolic steroids); 14 voluntary formal cautions. Table: Melanotan 2 units detained 6 (2020), 790 (2021), 950 (2022), 1,329 (2023); semaglutide 0, 0, 32, 286; liraglutide 0, 8, 8, 253. The release itself warns of 'a concerning upward trend in detentions of Melanotan 2, an unregulated substance promoted as a self-tanning aid', and says some such substances 'are not authorised for use by any regulator anywhere in the world'. factcheck (24 October 2026): figures confirmed; the Melanotan 2 warning sentence added (it is an HPRA warning naming a peptide, 28 March 2024). HOST NOT ALLOWLISTED."

