  accessed: 2026-10-23
  verified: url
  note: "Decision PDF read in full (pdftotext). A surf lifesaver and athlete bound by the Sports Anti-Doping Rules 2024; on 30 September 2024 the New Zealand Customs Service intercepted a parcel addressed to him containing ipamorelin, tesamorelin, a TB-500 and BPC-157 product and BPC-157 (vial contents not reproduced here); Customs referred the matter to the Sport Integrity Commission on 10 October 2024. Admitted violations of SADR r 2.6 (Possession) and 2.7 (Trafficking); four-year period of ineligibility for trafficking reduced by one year for early admission: three years from the provisional suspension of 22 December 2024. Supports: Customs passes intercepted peptide parcels to the anti-doping body, and possession alone can be a violation for an athlete. Do not name the athlete on the site. factcheck (24 October 2026): decision PDF (https://sportstribunal.org.nz/wp-content/uploads/2025/05/ST2024-Decision-FINAL.pdf) re-read; dates and rules confirmed. Precision for the page: the three-year ban rests on the trafficking violation (supplying another person, not named in the decision), which carries a minimum of four years, reduced by one year for early admission; possession alone was assessed at four years for each of ipamorelin, tesamorelin and TB-500 (non-specified substances) and two years for BPC-157 (a specified substance). HOST NOT ALLOWLISTED."

