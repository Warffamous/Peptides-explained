ie-hpra-2023-10-semaglutide-detentions:
  type: regulator
  authors: "Health Products Regulatory Authority (HPRA)"
  title: "HPRA reports increase in detentions of Semaglutide products sold illegally online"
  container: "hpra.ie, News"
  year: 2023
  url: https://www.hpra.ie/news-events/news/article/hpra-reports-increase-in-detentions-of-semaglutide-products-sold-illegally-online
  accessed: 2026-10-24
  verified: url
  note: "Dated 25 October 2023 (press release; the news API gives 2023-10-24T23:00Z). 254 units of products claiming to contain semaglutide detained January-September 2023, against 32 in all of 2022; products included vials of white powder or clear liquid labelled as semaglutide and boxed pens presented as a generic version. 'There is actually no authorised version of Semaglutide in powder form ... Likewise, there are no generic forms of Semaglutide'. Anyone using semaglutide bought online 'should stop using them immediately and contact a medical professional'. Notes to editors: EMA alert of 18 October 2023 on pens falsely labelled as Ozempic at wholesalers in Austria, Germany and the UK, not detected in Ireland. Supports: the HPRA warned about illegal semaglutide (a peptide medicine) in 2023. HOST NOT ALLOWLISTED."

ie-hpra-2024-03-enforcement-2023:
