# ---------------------------------------------------------------- Ireland: regulator

ie-hpra-what-we-regulate:
  type: regulator
  authors: "Health Products Regulatory Authority (HPRA)"
  title: "What and how we regulate medicines, medical devices and other health products"
  container: "hpra.ie"
  year: 2026
  url: https://www.hpra.ie/about-us/our-role/what-and-how-we-regulate
  accessed: 2026-10-23
  verified: url
  note: "HPRA's own description of its work: 'We grant licences to companies to make, distribute and market medicines after a review of their safety, quality and effectiveness'; 'We inspect companies and facilities which test, make or distribute health products'; 'We continuously monitor medicines, medical devices and other health products'. Remit also covers controlled substances and cosmetics. Supports: what the HPRA does (one sentence). HOST NOT ALLOWLISTED (hpra.ie)."

ie-hpra-licensing-procedures:
  type: regulator
  authors: "Health Products Regulatory Authority (HPRA)"
  title: "Procedures to obtain a licence (marketing authorisation) for a medicine"
  container: "hpra.ie"
  year: 2026
  url: https://www.hpra.ie/regulation/human-medicine/marketing-authorisation-holders/new-applications/licensing-procedures
  accessed: 2026-10-23
  verified: url
  note: "Centralised procedure: an application to the European Medicines Agency 'will result in a single marketing authorisation that is valid in all EU Member States plus Iceland, Liechtenstein, and Norway'; mandatory for certain medicines (e.g. new active substances for some diseases). National procedure: a company 'can apply for a marketing authorisation directly to the HPRA if the company wishes to market a medicine in Ireland only'. Also lists the decentralised and mutual-recognition procedures. Supports: EU-wide authorisations apply in Ireland. HOST NOT ALLOWLISTED."

# ---------------------------------------------------------------- Ireland: legislation (Irish Statute Book; Law Reform Commission revised Act)

ie-imb-act-1995:
  type: law
  authors: "Oireachtas (Ireland); revised text by the Law Reform Commission"
  title: "Irish Medicines Board Act 1995 (No. 29 of 1995), revised: updated to 30 June 2026"
  container: "Revised Acts, Law Reform Commission"
  year: 2026
  url: https://revisedacts.lawreform.ie/eli/1995/act/29/revised/en/html
  accessed: 2026-10-23
  verified: url
  note: "Administrative consolidation 'Updated to 30 June 2026' (the site notes changes as of 13 October 2026 not yet implemented). s. 1: 'medicinal product' has the meaning assigned to it by Directive 2001/83/EC, as amended. s. 3(4), inserted by s. 36 of the Health (Pricing and Supply of Medical Goods) Act 2013 and in force 1 July 2014 (S.I. No. 205 of 2014): the Irish Medicines Board is from then on 'known as the Health Products Regulatory Authority'. s. 4(1): principal functions include (a) 'the licensing of the manufacture, preparation, importation, distribution and sale of medicinal products' and (b) the powers of the competent authority under Directive 2001/83/EC. s. 32: the Minister makes the medicines regulations (the 2003 and 2007 Regulations below are made under it). s. 32(4), substituted by the 2006 Act, s. 16 (in force 1 May 2007): contravening a regulation under s. 32 is an offence; on summary conviction a fine 'not exceeding €2,000' (annotation: now a class C fine, not greater than €2,500, Fines Act 2010) or up to one year in prison or both; on conviction on indictment, first offence a fine up to €120,000 or up to 10 years or both, subsequent offence up to €300,000 or up to 10 years or both. s. 32(5): prosecution by the Minister, the Board (HPRA), the Pharmaceutical Society of Ireland or the health board. The section page https://revisedacts.lawreform.ie/eli/1995/act/29/section/32/revised/en/html was read too. HOST NOT ALLOWLISTED (revisedacts.lawreform.ie)."

ie-imb-misc-provisions-act-2006:
  type: law
  authors: "Oireachtas (Ireland)"
  title: "Irish Medicines Board (Miscellaneous Provisions) Act 2006 (No. 3 of 2006), as enacted"
  container: "Irish Statute Book (Office of the Attorney General)"
  year: 2006
  url: https://www.irishstatutebook.ie/eli/2006/act/3/enacted/en/print
  accessed: 2026-10-23
  verified: url
  note: "s. 1(3): the Irish Medicines Board Act 1995 and Part 3 of this Act (ss. 10-20) 'may be cited together as the Irish Medicines Board Acts 1995 and 2006 and shall be construed together as one'. The Law Reform Commission's revised 1995 Act (updated to 30 June 2026, ie-imb-act-1995) still gives this collective citation under 'Related legislation', so it is current. s. 16: amends s. 32 of the 1995 Act (new penalty subsection, see ie-imb-act-1995). s. 17: inserts ss. 32A-32F into the 1995 Act (authorised officers and their powers); s. 32A defines 'authorised officer' to include 'an officer of customs and excise'. factcheck (24 October 2026): the note said 'the 1995 Act and this Act'; s. 1(3) names Part 3 only. The added claim that the Irish Statute Book page of the 2013 Act uses the same collective citation was not borne out (that Act refers only to the 'Irish Medicines Board Act 1995') and is removed. HOST NOT ALLOWLISTED."

ie-health-pricing-supply-medical-goods-act-2013:
  type: law
  authors: "Oireachtas (Ireland)"
  title: "Health (Pricing and Supply of Medical Goods) Act 2013 (No. 14 of 2013), section 36"
  container: "Irish Statute Book (Office of the Attorney General)"
  year: 2013
  url: https://www.irishstatutebook.ie/eli/2013/act/14/enacted/en/print
  accessed: 2026-10-23
  verified: url
  note: "s. 36 inserts s. 3(4) into the Irish Medicines Board Act 1995: the body known as the Irish Medicines Board 'shall, from such commencement, cease to be known by that name and instead be known as the Health Products Regulatory Authority'. Commencement: 1 July 2014 (S.I. No. 205 of 2014), per the Law Reform Commission's annotation in ie-imb-act-1995. HOST NOT ALLOWLISTED."

ie-si-2007-540-placing-on-market:
  type: law
  authors: "Minister for Health and Children (Ireland)"
  title: "Medicinal Products (Control of Placing on the Market) Regulations 2007 (S.I. No. 540 of 2007), as made"
  container: "Irish Statute Book (Office of the Attorney General)"
  year: 2007
  url: https://www.irishstatutebook.ie/eli/2007/si/540/made/en/print
  accessed: 2026-10-23
  verified: url
  note: "Made under s. 32 of the Irish Medicines Board Act 1995. Reg. 4(2): in cases of doubt, where a product may fall within the definition of a medicinal product and of another product category, these Regulations apply. Reg. 6(1): a person shall not place a medicinal product on the market unless it is the subject of (a) a marketing authorisation, (b) a Community marketing authorisation (defined as one granted by the European Commission under Regulation (EEC) No 2309/93 or Regulation (EC) No 726/2004), (c) a certificate of registration or (d) a certificate of traditional-use registration. Reg. 6(2): a person shall not in the course of a business sell, supply, manufacture or possess a medicinal product unless they have reasonable cause to believe it was placed on the market in compliance with reg. 6(1) or in another EEA State under the Directive. Schedule 1, para. 1(c): reg. 6(1)-(2) do not apply to 'the importation of a medicinal product, from a country that is not an EEA State, by a person for his own personal use, not being an importation resulting directly from a mail order advertisement directed at members of the public'. Schedule 1, paras 2-3: supply to fulfil the special needs of a practitioner's individual patients, on a bona fide unsolicited order, with no advertising to the public. Read AS MADE: no consolidated text of this S.I. exists on the Irish Statute Book. Second run (23 October 2026): the amending S.I.s No. 3 of 2009, 553 of 2009, 287 of 2010, 272 of 2012, 151 of 2014 and 218 of 2019 were fetched from irishstatutebook.ie and searched; none uses the words 'personal use', and S.I. 3/2009 reg. 11 and S.I. 218/2019 reg. 2 change paragraphs 3 and 5 of Schedule 1 (special-needs supply and third-country imports by wholesalers), not paragraph 1(c). Amending S.I.s after 2019 were not searched (UNRESOLVED: so the personal-import exemption is cited as made, and the page relies on Revenue for current border practice). factcheck (24 October 2026): regs 4(2), 6(1)-(2), the definition of 'Community marketing authorisation' and Schedule 1 paras 1-3 re-read and confirmed. The six amending S.I.s were fetched again (none contains 'personal use'; S.I. 3/2009 reg. 11 amends paras 3 and 5, S.I. 218/2019 reg. 2 amends para 3), and four amending S.I.s the first runs did not list were read too: S.I. 722/2011, S.I. 162/2013, S.I. 529/2018 (its 'paragraph 1' change is to Schedule 1A, advanced therapy medicinal products) and S.I. 416/2022. None contains 'personal use' or changes Schedule 1 para. 1(c). Still not established that no later amendment exists (the Irish Statute Book has no consolidated text or amendment list for this S.I. that could be fetched). HOST NOT ALLOWLISTED."

ie-si-2003-540-prescription-supply:
  type: law
  authors: "Minister for Health and Children (Ireland)"
  title: "Medicinal Products (Prescription and Control of Supply) Regulations 2003 (S.I. No. 540 of 2003), as made"
  container: "Irish Statute Book (Office of the Attorney General)"
  year: 2003
  url: https://www.irishstatutebook.ie/eli/2003/si/540/made/en/print
  accessed: 2026-10-23
  verified: url
  note: "Reg. 5(1): a person shall not supply, except in accordance with a prescription, (a) a medicinal product containing a substance in the First Schedule, (b) 'any medicinal product which is intended for parenteral administration', (c) 'any medicinal product which is or which contains a new chemical molecule'. Reg. 19(1) as made: 'A person shall not supply by mail order any medicinal product'; reg. 2 defines supply by mail order as supply after solicitation without supplier and customer being present together. Reg. 19 has since been amended to allow registered online supply of non-prescription medicines (see ie-hpra-buying-prescription-medicines-online); the amending S.I. was not read (UNRESOLVED). Read AS MADE. HOST NOT ALLOWLISTED."

ie-si-2007-541-advertising:
  type: law
  authors: "Minister for Health and Children (Ireland)"
  title: "Medicinal Products (Control of Advertising) Regulations 2007 (S.I. No. 541 of 2007), as made"
  container: "Irish Statute Book (Office of the Attorney General)"
  year: 2007
  url: https://www.irishstatutebook.ie/eli/2007/si/541/made/en/print
  accessed: 2026-10-23
  verified: url
  note: "Reg. 6(1): 'A person shall not issue an advertisement in respect of a medicinal product unless such product is the subject of a marketing authorisation or certificate of traditional use registration'; reg. 2 defines marketing authorisation to include one granted by the Commission under Regulation (EC) No 726/2004. 'Advertising' includes any activity designed to promote the prescription, supply, sale or consumption of medicinal products. Implements Titles VIII and VIIIa of Directive 2001/83/EC. Read AS MADE. HOST NOT ALLOWLISTED."

ie-revenue-tdm-medicinal-products-2026:
  type: guideline
  authors: "Office of the Revenue Commissioners (Ireland)"
  title: "Tax and Duty Manual: Importation and exportation of medicinal products and unauthorised or falsified (counterfeit) medical preparations (document updated February 2026)"
  container: "revenue.ie"
  year: 2026
  url: https://www.revenue.ie/en/tax-professionals/tdm/investigations-prosecutions-enforcement/enforcement/medicinal-products-and-unauthorised-counterfeit-medical-preparations.pdf
  accessed: 2026-10-23
  verified: url
  note: "Section 2: a person travelling 'may carry on their person or in their baggage a reasonable amount of such medicines for personal use without an authorisation' (Schengen travellers need an Article 75 certificate for controlled drugs); 'This personal use exemption does not apply to products imported by other means, for example by post, by courier or in merchandise'. Section 3: the HPRA has responsibility for the control of medical products; Revenue's Customs Service, at postal depots and borders, implements import controls under a Memorandum of Understanding with the HPRA; products subject to restriction are prohibited on importation under s. 50 of the Customs Act 2015; customs officers are authorised officers under s. 32B of the Irish Medicines Board Act 1995. Section 3.2: 'Most medicinal products encountered by Revenue are of the nature of small quantities consigned to private individuals for their own personal use.' factcheck (24 October 2026): all quotes confirmed in the PDF ('Document updated February 2026'). Revenue's words are 'deemed to be an authorised officer under section 32B'; the definition itself is in s. 32A(b) (ie-imb-misc-provisions-act-2006). The traveller exemption carries an exception for travellers from the Schengen area, who need an Article 75 certificate for prescribed controlled drugs. HOST NOT ALLOWLISTED (revenue.ie)."

ie-hpra-buying-prescription-medicines-online:
  type: regulator
  authors: "Health Products Regulatory Authority (HPRA)"
  title: "Dangers of buying prescription medicines online"
  container: "hpra.ie"
  year: 2026
  url: https://www.hpra.ie/safety-information/how-we-monitor-safety/medicines/dangers-of-buying-prescription-medicines-online
  accessed: 2026-10-23
  verified: url
  note: "'It is illegal to sell prescription medicines online in Ireland'; 'it is against the law to supply prescription medicines online'. Non-prescription medicines may be sold online only by suppliers registered with the Pharmaceutical Society of Ireland (Internet Supply List) showing the EU common logo. Illegal prescription medicines found entering the country 'are detained (seized) by customs officials and may be destroyed'; the HPRA writes to the buyer and sends a leaflet; 'If your medicine has been detained, we cannot send it to you or return it to the supplier.' (online-medicine-safety.hpra.ie now redirects here.) HOST NOT ALLOWLISTED."

