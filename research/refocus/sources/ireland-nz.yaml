nz-medicines-act-1981:
  type: law
  authors: "New Zealand Parliament"
  title: "Medicines Act 1981 (1981 No 118); version as at 10 July 2026"
  container: "New Zealand Legislation (Parliamentary Counsel Office)"
  year: 2026
  url: https://www.legislation.govt.nz/act/public/1981/0118/latest/whole.html
