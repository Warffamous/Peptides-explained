# ---------------------------------------------------------------- New Zealand: classification of peptides as prescription medicines (2025)

nz-medsafe-2025-06-peptides-mcc-submission:
  type: report
  authors: "Medsafe (New Zealand Medicines and Medical Devices Safety Authority)"
  title: "Classification of Unscheduled Peptides: Submission to the Medicines Classification Committee (June 2025)"
  container: "Agenda for the 74th meeting of the Medicines Classification Committee, item 5.7"
  year: 2025
  url: https://www.medsafe.govt.nz/profs/class/Agendas/Agen74/5.7Peptides.pdf
  accessed: 2026-10-23
  verified: url
  note: "Read in full (pdftotext). From 1 April to 19 May 2025, 56 parcels containing peptides or SARMs were intercepted at the border. When a substance not scheduled as a prescription medicine is intercepted, 'the product is released to the individual with a high-risk medicine letter ... as Medsafe does not have the grounds, pursuant to the Medicines Act 1981, to seize them.' Sellers market them 'for research purposes only' to individuals who intend therapeutic use. BPC-157 was classified as a prescription medicine at the 70th MCC meeting (25 May 2023); derivatives (e.g. 'NL-BPC-157') were not captured. Thymosin beta-4 and TB-500 were already prescription medicines. Proposed ten group entries: thymic peptide hormones and analogues (named members include thymosin alpha-1/thymalfasin), BPC-157 and analogues, ACTH analogues (named: Semax, Adamax), pineal gland peptides (named: epitalon, epithalamin), antimicrobial peptides (LL-37), myostatin modulators, mitochondria-derived peptides (named: humanin, MOTS-c, SHLP 1-6), erythropoietin analogues (ARA-290), tuftsin and analogues (named: Selank), kisspeptins; plus six individual peptides (larazotide, PTD-DBM, AICAR, B7-33, PNC-27, SS-31). Conclusion: once classified, 'importation of these products into New Zealand without a prescription will not be permitted'. CAUTION: the paper says SS-31 'does not appear to have been studied in human clinical trials', which is wrong (see the site's ss-31 data); do not cite this paper for evidence about any compound, only for Medsafe's classification reasoning and border data. HOST NOT ALLOWLISTED."

nz-mcc-74-minutes-2025-07-23:
  type: regulator
  authors: "Medicines Classification Committee (New Zealand), Medsafe secretariat"
  title: "Minutes of the 74th meeting of the Medicines Classification Committee, 23 July 2025, item 5.7 Peptide Groups"
  container: "medsafe.govt.nz"
  year: 2025
  url: https://www.medsafe.govt.nz/profs/class/Minutes/2021-2025/74mccMin23July2025.htm
  accessed: 2026-10-23
  verified: url
  note: "Item 5.7: Medsafe proposed ten group entries and six individual peptides as prescription medicines. The committee noted products imported for personal use to treat serious conditions and that use 'without the input of a medical practitioner poses a risk of harm'; if there is legitimate use, patients can still obtain them on a prescription. Recommendation: 'The MCC is deferring the decision pending additional information' (possible cosmetic uses). Secretariat's note: the cosmetics industry raised no issues, so 'Medsafe therefore recommends the peptides outlined in this proposal are classified as prescription medicines.' HOST NOT ALLOWLISTED."

nz-gazette-2025-go7397-classification:
  type: law
  authors: "Chris James, Group Manager, Medsafe, Ministry of Health (acting under delegated authority)"
  title: "Classification of Medicines (New Zealand Gazette notice 2025-go7397)"
  container: "New Zealand Gazette"
  year: 2025
  url: https://gazette.govt.nz/notice/id/2025-go7397
  accessed: 2026-10-23
  verified: url
  note: "Signed 17 December 2025; published 19 December 2025. 'Pursuant to section 106(1) of the Medicines Act 1981 ... the medicines listed in Schedule 1 to this notice are classified as prescription medicines.' Every reference applies to synthetic or biological origin, salts and esters, and to injections in any concentration. Schedule 1 includes: Adrenocorticotropic hormone analogues; AICAR; Anti-microbial peptides and their precursors; B7-33; Body protective compound 157 and its analogues; Elamipretide; Erythropoietin and its analogues; Glucagon-like peptide-1 receptor agonists; Kisspeptins; Larazotide; Mitochondria-derived peptides and their analogues; Myostatin modulator peptides; Pineal gland peptides and their analogues; PNC-27; PTD-DBM; 'Retratrutide' (sic: the notice spells it so; the classification database lists 'Retatrutide'); Thymic peptide hormones and their analogues; Tirzepatide; Tuftsin and its analogues. The notice states no separate commencement date. LAPSED: under s 106(3) of the Medicines Act 1981 a classification notice lasts six months unless revoked sooner (nz-medicines-act-1981); the notice in force on 23 October 2026 is nz-gazette-2026-sl4278-classification. Cite this one for when the peptide groups were first listed. factcheck (24 October 2026): notice text re-read; signature date, publication date and every Schedule 1 entry listed above confirmed. The Gazette labels its notice type 'Departmental' (2026-sl4278 is labelled 'Secondary Legislation'), but s 106(4) makes every such notice secondary legislation. Commencement now RESOLVED: no date stated, so under Legislation Act 2019 s 26(2) it came into force the day after publication, 20 December 2025 (nz-legislation-act-2019), and under s 106(3) it ceased to have effect six months later, around 19-20 June 2026 (the exact last day depends on how the six months are counted, which was not checked). HOST NOT ALLOWLISTED (gazette.govt.nz)."

nz-gazette-2026-sl4278-classification:
  type: law
  authors: "Chris James, Group Manager, Medsafe, Ministry of Health (acting under delegated authority)"
  title: "Classification of Medicines (New Zealand Gazette notice 2026-sl4278)"
  container: "New Zealand Gazette"
  year: 2026
  url: https://gazette.govt.nz/notice/id/2026-sl4278
  accessed: 2026-10-23
  verified: url
  note: "Notice type 'Secondary Legislation'. Dated 29 July 2026; publication date 3 August 2026. 'Pursuant to section 106(1) of the Medicines Act 1981 ... The medicines listed in Schedule 1 to this notice are classified as prescription medicines.' Same general rules as 2025-go7397 (synthetic or biological origin, salts and esters, any concentration in an injection). Schedule 1 still lists: Adrenocorticotropic hormone analogues; AICAR; Anti-microbial peptides and their precursors; B7-33; 'Body protective compound 157 and its analogues'; Elamipretide; Erythropoietin and its analogues; Glucagon-like peptide-1 receptor agonists; Kisspeptins; Larazotide; Mitochondria-derived peptides and their analogues; Myostatin modulator peptides; Pineal gland peptides and their analogues; PNC-27; PTD-DBM; 'Retratrutide' (sic, as in 2025); Tirzepatide; Thymic peptide hormones and their analogues; Tuftsin and its analogues. No entry for TB-500 or melanotan (text search). Found with the Gazette search (exact phrases 'Thymic peptide hormones', 'Mitochondria-derived peptides', 'Kisspeptins': only 2025-go7397 and this notice, 1 January 2023 to 24 October 2026). Under s 106(3) it lasts six months from coming into force, i.e. into early 2027 unless replaced. Search note: the phrase 'Body protective compound' returns notices dated 31 August 2023 (2023-go4130), 30 October 2023 (2023-go5107), 16 April 2024 (2024-go1837), 23 September 2024 (2024-go4813), 17 December 2025 (2025-go7397) and this one; no notice naming it was found between September 2024 and December 2025 (see ireland-nz.md 4.3). factcheck (24 October 2026): notice text re-read; dates, notice type and the Schedule 1 entries confirmed (the 2026 notice prints some group names with a final full stop). In force from 4 August 2026, the day after publication (Legislation Act 2019 s 26(2), nz-legislation-act-2019), so under s 106(3) it lapses around 3-4 February 2027 unless replaced or revoked. Gazette searches repeated on 24 October 2026 (keyword, 1 January 2023 to 24 October 2026): 'Thymic peptide hormones' finds only 2025-go7397 and this notice; 'Body protective compound' finds the same six notices as above; 'Classification of Medicines' finds 26 notices. All 26 were opened: only six carry the running list of interim classifications (2023-go4130, 2023-go5107, 2024-go1837, 2024-go4813, 2025-go7397, 2026-sl4278; the 2024-go4813 Schedule 1 has about 100 entries, including 'Body Protective Compound –157' and tirzepatide); the other 20 (for example 2025-go2162, 2025-go3258, 2025-go4301, 2025-go4843, 2025-go4844, 2025-go5746, 2026-sl1183, 2026-sl3930 and 2026-sl4686 of 19 August 2026) are short notices that name neither BPC-157, tirzepatide nor the peptide groups. No notice names TB-500. So no notice naming BPC-157 was found in force from about early April 2025 (six months after 2024-go4813, published 7 October 2024) to 19 December 2025, and none naming the peptide groups from about 20 June 2026 to 3 August 2026. HOST NOT ALLOWLISTED (gazette.govt.nz)."

nz-medsafe-classification-database-2026-10-23:
  type: dataset
  authors: "Medsafe (New Zealand Medicines and Medical Devices Safety Authority)"
  title: "Database of Medicine Classifications (searched 23 October 2026)"
  container: "medsafe.govt.nz"
  year: 2026
  url: https://www.medsafe.govt.nz/profs/class/classintro.asp
  accessed: 2026-10-23
  verified: url
  note: "Ingredient-name search (substring), 'Any classification', 23 October 2026; the page says 'Database updated: 25 September 2026' (TB-500 re-checked in a browser in the second run: 'TB-500 ... Prescription'). Medsafe's own introduction: the data are 'compiled from entries in Schedule 1 of the Medicines Regulations 1984, the Schedules to the Misuse of Drugs Act 1975 and the Medsafe record of some general sales medicines. Refer to these legislative documents for an accurate record'; check 'the latest amendment of the Medicines Regulations 1984 and any subsequent notices published in the New Zealand Gazette'. So for the legal record cite nz-medicines-regulations-1984 and nz-gazette-2026-sl4278-classification next to this database. TB-500 is in the database but in neither of those (UNRESOLVED which instrument classifies it; possibly a group entry). PRESCRIPTION: 'Body protective compound 157 and its analogues'; TB-500; Thymosin beta-4; 'Thymic peptide hormones and their analogues'; Ipamorelin; Hexarelin; Tesamorelin; CJC-1295; AOD-9604; Sermorelin; Pralmorelin; 'Growth hormone releasing hormones'; 'Growth hormone releasing peptides'; 'Growth hormone releasing peptide-6'; 'Human growth hormone secretagogues'; Somatropin; Afamelanotide; 'Melanocyte stimulating compounds'; 'Mitochondria-derived peptides and their analogues'; Elamipretide; 'Pineal gland peptides and their analogues'; 'Adrenocorticotropic hormone analogues'; 'Tuftsin and its analogues'; Semaglutide; Tirzepatide; Retatrutide; 'Glucagon-like peptide-1 receptor agonists'; Kisspeptins; 'Myostatin modulator peptides'; 'Selective androgen receptor modulators'. NO INDIVIDUAL ENTRY for: BPC-157 (searched BPC, BPC-157, BPC 157, pentadecapeptide, bepecin, PL 14736, PL-10), TB500, Ac-LKKTETQ, thymalfasin, thymosin alpha, Ta1, Zadaxin, melanotan, Melanotan II, Melanotan-2, MT-II, MT2, bremelanotide, PT-141, PT 141, Vyleesi, examorelin, EP-23905, NNC 26-0161, GHRP, AOD9604, CJC1295, GHK, copper peptide, copper tripeptide, prezatide (Copper itself: general sale), KPV, Lys-Pro-Val, alpha-melanocyte, MSH, MOTS, MOTs, humanin, SS-31, MTP-131, Bendavia, Forzinity, epitalon, epithalon, Epithalone, epithalamin, AEDG, semax, MEHFPGP, selank, Selanc, TP-7, LY3437943, 'retratrutide', nicotinamide riboside, nicotinamide mononucleotide, NMN, nadide (nicotinamide: general sale). Brand names are not in this database (Ozempic, Wegovy, Mounjaro, Egrifta: no match). A group entry may cover a compound without naming it; which group covers which compound is Medsafe's call (see nz-medsafe-2025-06-peptides-mcc-submission). Prescription classification is NOT approval (consent). factcheck (24 October 2026): page header 'Database updated: 25 September 2026' confirmed; the search repeated (POST queries for 24 terms, then the full listing via the underscore wildcard: 3,741 rows, searched for 55 name fragments including thymalfasin, MT-II, MSH, humanin, tuftsin, pineal, mitochondria, secretagog, glucagon, NMN). Every finding above confirmed; no entry for melanotan, bremelanotide, PT-141, GHK, prezatide, KPV, BPC (only the group), TB500, SS-31, MTP-131, selank, semax, epitalon, MOTS or humanin. HOST NOT ALLOWLISTED."

