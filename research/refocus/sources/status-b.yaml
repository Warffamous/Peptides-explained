au-poisons-standard-2026-10:
  type: law
  authors: "Commonwealth of Australia (Department of Health, Disability and Ageing)"
  title: "Therapeutic Goods (Poisons Standard - October 2026) Instrument 2026 (F2026L01327)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026L01327/latest/text
  accessed: 2026-10-23
  verified: url
  note: "Made 28 September 2026, registered 30 September 2026; the TGA's Poisons Standard page (last updated 1 October 2026) says it is the current edition. Read from the authorised PDF (677 pages) on 23 October 2026. Schedule 4 (prescription only medicines; 'Note 2: Substances marked # are listed in Appendix D') contains '# CJC-1295 (CAS No. 863288-34-0).', '# GROWTH HORMONE RELEASING HORMONES* (GHRHs).', '# GROWTH HORMONE RELEASING PEPTIDES (GHRPs).', '# GROWTH HORMONE RELEASING PEPTIDE-6 (GHRP-6).', '# GROWTH HORMONE SECRETAGOGUES* (GHSs).', '# HEXARELIN.', '# IPAMORELIN.', PRALMORELIN and SERMORELIN (no #). Appendix D clause 5, 'Poisons for which possession without authority is illegal' ('possession other than in accordance with a legal prescription'), lists item 7 CJC-1295 (CAS No. 863288-34-0), item 18 GHRHs 'including those separately specified in Schedule 4', item 19 GHRPs, item 21 growth hormone secretagogues, item 22 hexarelin and item 25 ipamorelin; section 64(4): such a poison 'must not be possessed by a person without authority under the law of the jurisdiction'. Tesamorelin and examorelin are not named anywhere in the instrument. The Reader's guide says an entry includes all salts and derivatives unless stated otherwise, and that group terms are kept 'to deal with any members of the group or class that may have escaped attention'. The CAS number given for CJC-1295, 863288-34-0, is the one PubChem assigns to the 29-residue peptide without DAC (pubchem-cjc-1295-without-dac) and that the FDA calls a 'deleted CAS' (fda-pcac-2024-cjc1295-briefing); the DAC form (CAS 446262-90-4) is not named by its own number. State and territory laws give these schedules effect. factcheck (24 October 2026): authorised PDF downloaded again (677 pages; 'Dated 28 September 2026'; 'Authorised Version F2026L01327 registered 30/09/2026'; commencement 1 October 2026). Every Schedule 4 entry and Appendix D clause 5 item number above confirmed (items 3 AOD-9604, 7 CJC-1295, 18 GHRHs, 19 GHRPs, 20 GHRP-6, 21 GHSs, 22 hexarelin, 25 ipamorelin, 31 pralmorelin), as is the clause 5 heading and section 64(4); no tesamorelin or examorelin anywhere. The asterisk in 'HORMONES*' and 'SECRETAGOGUES*' only marks a trivial or unofficial name ('Trivial or unofficial names are marked *'). One Reader's guide sentence bears on the CJC-1295 and tesamorelin readings: 'a substance is only considered a derivative of a scheduled poison if it is not individually listed elsewhere in the Schedules, or captured by a more restrictive group or class entry'. Whether the DAC form of CJC-1295 is treated as a derivative of the named entry or falls under the GHRH group entry, the result is the same (Schedule 4 and Appendix D), but that remains a reading. PubChem confirms CAS 863288-34-0 maps to CID 56841945 (C152H252N44O42, no DAC) and CAS 446262-90-4 to CID 91971820 (the DAC form); the FDA briefing's table gives '863288-34-0 (deleted CAS)'."

