# Link allowlist: these hosts are used below and are NOT on config/link-allowlist.json today (we did not edit config/):
# health-products.canada.ca, dhpp.hpfb-dgpsa.ca, pdf.hres.ca (also the label_url of the proposed Canadian Egrifta
