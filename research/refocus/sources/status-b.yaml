  note: "Compilation in force on 13 July 2026, registered 4 August 2026, read from the PDF on 23 October 2026. Regulation 5G(1): 'The importation into Australia of a substance mentioned in Schedule 7A is prohibited unless' the importer holds a written permission from the Secretary (of the Department administering the Therapeutic Goods Act) or an authorised person, and produces it to a Collector; 5G(2) exempts medicine prescribed for a ship or aircraft passenger's treatment, but 5G(3) removes that exemption for athletes and their support persons. Schedule 7A item 4: 'Natural and manufactured growth hormones, including somatropin, somatrem, somatomedins and insulin-like growth factors (not insulins) and growth hormone releasing hormones (somatorelin and synthetic analogues)'. Ipamorelin, hexarelin and CJC-1295 are not named; GH secretagogues and GHRPs are not listed. Tesamorelin (modified human GHRH 1-44) and CJC-1295 (modified GHRH 1-29) are, chemically, synthetic analogues of somatorelin; no official document applying item 4 to either by name was found. factcheck (24 October 2026): compilation PDF downloaded again (Compilation No. 147, compilation date 13/07/2026, 'Authorised Version F2026C00751 registered 04/08/2026'); regulation 5G(1) to (3) and Schedule 7A item 4 confirmed word for word ('permission ... granted in writing by the Secretary or an authorised person' corrected above). The whole of Schedule 7A is: item 1 'Anabolic or androgenic substances', 2 erythropoietin, 3 gonadotrophins, 4 growth hormones and GHRHs, and darbepoetin alfa. Ipamorelin, hexarelin and CJC-1295 are not named; whether item 1 ('anabolic ... substances', not defined in the regulations) could reach a growth hormone secretagogue was not established, and no official source says so (the ODC's list of 5G/5H substances, searched 24 October 2026, has no entry for ipamorelin, hexarelin, CJC or tesamorelin: au-odc-growth-hormones-import-permit)."

