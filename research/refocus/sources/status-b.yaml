ca-food-and-drug-regulations:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations (C.R.C., c. 870), sections C.01.014, C.01.014.3, C.01.014.6 and C.08.002"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/FullText.html
  accessed: 2026-10-23
  verified: url
  note: "Current to 2026-09-30, last amended 2026-06-17. C.01.014(1): 'No manufacturer shall sell a drug in dosage form unless a drug identification number has been assigned for that drug and the assignment of the number has not been cancelled under section C.01.014.6.' C.01.014.3: the manufacturer reports the date of first sale within 30 days. C.01.014.6(1)(a): the Minister shall cancel a DIN if the manufacturer advises that they discontinued the sale of the drug (the route recorded for both Egrifta DINs); C.01.014.6(2) separately lets the Minister cancel a DIN on compliance or safety grounds (not the route used for Egrifta). C.08.002(1): 'No person shall sell or advertise a new drug unless' a satisfactory new drug submission has been filed, a notice of compliance issued and not suspended. Also read (second pass): C.01.014.91(1): a DIN holder that decides to discontinue the sale of a drug 'shall post' on the designated website, in English and French, among other things '(j) the date on which the manufacturer will discontinue the sale of the drug; and (k) the reason for the discontinuation of sale' (12 months ahead, or within five days of a decision taking effect in 12 months or less); C.01.014.8(2): the designated website is the one 'maintained under contract with His Majesty in right of Canada' when the Government of Canada website links to it (Drug Shortages Canada, ca-dsc-egrifta-discontinuation-170025); C.01.014.7(1): the manufacturer reports the date it discontinued the sale within 30 days."

