ctgov-search-status-b-2026-10-23:
  type: registry
  authors: "ClinicalTrials.gov (U.S. National Library of Medicine)"
  title: "ClinicalTrials.gov API v2 searches with site countries, 23 October 2026: tesamorelin, TH9507, Egrifta, CJC-1295, CJC 1295, CJC1295, DAC:GRF, ipamorelin, NNC 26-0161, hexarelin, examorelin, EP-23905, MF-6003"
