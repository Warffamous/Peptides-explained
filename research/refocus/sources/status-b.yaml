  url: https://www.tga.gov.au/news/media-releases/concerns-regarding-public-health-risks-associated-unapproved-peptide-products
  accessed: 2026-10-23
  verified: url
  note: "Published 19 June 2026. TGA reports and state and territory hospital data 'have identified serious adverse effects associated with the use of unapproved peptides', including liver damage, severe allergic reactions requiring hospitalisation, and inflammation; unapproved products 'can include products containing BPC-157, GHK-Cu, TB-500, retatrutide and CJC-1295'; many are supplied as powders or injections in poorly labelled or unmarked vials; unapproved peptide products 'have been added as a priority focus area for the TGA compliance'."

au-tga-2026-08-peptide-seizure:
