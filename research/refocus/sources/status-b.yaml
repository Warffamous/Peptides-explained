# the United Kingdom for hexarelin. Every entry was fetched or searched on 23 October 2026 (Montreal/Canberra
# databases read through their public APIs or in a browser; legislation read from the official PDF). A second pass
# late on 23 October 2026 (UTC) re-checked the key facts, closed the Canadian brand-name gap through Health Canada's
# official DPD data extract (the DPD API and web pages were down for maintenance), read the Egrifta discontinuation
# report, and re-ran the MHRA searches for tesamorelin, hexarelin and examorelin (same results).
#
# Reused from src/data/sources (not re-registered here): ctgov-nct01579695, ctgov-nct00267527,
# ctgov-ipamorelin-search-2026-10-22 (tesamorelin.yaml, cjc-1295.yaml, ipamorelin.yaml), mhra-products-search-tesamorelin,
# ema-egrifta-withdrawal (tesamorelin.yaml), uk-hmr-2012-reg-46 (bpc-157.yaml), uk-mda-1971-sch-2, uk-hmr-2012-reg-167
# (legal-b.yaml), fda-pcac-2024-cjc1295-briefing, pubchem-cjc-1295, pubchem-cjc-1295-without-dac (cjc-1295.yaml),
# fda-pcac-2024-ipamorelin-briefing (ipamorelin.yaml), fda-warning-letters-index (legal-b.yaml), fda-drugsatfda-egrifta
# (history.yaml). Reused from research/refocus/sources/ireland-nz.yaml: ie-hpra-licensing-procedures (the EU central
# procedure gives one authorisation valid in every member state).
#
# Shared ids: status-c.yaml registers nine of the documents below under the same id and URL (ca-pdl-human,
# ca-food-and-drug-regulations, ca-cdsa, ca-hc-2026-04-think-twice-peptides, au-poisons-standard-2026-10,
# au-customs-prohibited-imports-regs, au-tga-2026-04-peptide-responsibilities, au-tga-2026-06-cmo-peptide-statement,
# au-tga-2026-08-peptide-seizure). When the files are merged, keep one entry per id and join the notes. canada.yaml
# reuses this file's Canadian ids and adds search records for the other peptides on the site.
