au-tga-2026-04-peptide-responsibilities:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Understanding your responsibilities when importing, compounding and supplying unapproved peptide products (safety advisory)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/safety/safety-monitoring-and-information/safety-alerts/understanding-your-responsibilities-when-importing-compounding-and-supplying-unapproved-peptide-products
  accessed: 2026-10-23
  verified: url
  note: "Published 13 April 2026, read in full on 23 October 2026. 'Under the Therapeutic Goods Act 1989, peptide products are regulated as therapeutic goods in Australia'; 'Unapproved peptide products are goods which have not been included in the ARTG'; 'Examples of unapproved peptide products include those containing BPC-157, GHK-Cu, TB-500, retatrutide and CJC-1295, often supplied in injectable form.' Adverse events reported to the TGA include severe allergic reactions needing adrenaline and hospital care, systemic inflammatory response syndrome, and poor product quality. Compounding exemptions apply only when a good is dispensed or compounded for a particular person (or in a hospital); advertising prescription-only medicines to the public is prohibited. Personal Importation Scheme: products identified only by codes, or not stating active ingredient and strength, 'cannot be assessed for lawful importation ... and will not be considered for release'; an appropriate prescription is needed when required; 'research use only' disclaimers do not change a product's status, permit importation or remove obligations; 'State and territory laws may impose additional controls on the sale, supply and possession'."

au-tga-2026-06-cmo-peptide-statement:
