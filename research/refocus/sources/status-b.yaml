  note: "Made 28 September 2026, registered 30 September 2026; the TGA's Poisons Standard page (last updated 1 October 2026) says it is the current edition. Read from the authorised PDF (677 pages) on 23 October 2026. Schedule 4 (prescription only medicines; 'Note 2: Substances marked # are listed in Appendix D') contains '# CJC-1295 (CAS No. 863288-34-0).', '# GROWTH HORMONE RELEASING HORMONES* (GHRHs).', '# GROWTH HORMONE RELEASING PEPTIDES (GHRPs).', '# GROWTH HORMONE RELEASING PEPTIDE-6 (GHRP-6).', '# GROWTH HORMONE SECRETAGOGUES* (GHSs).', '# HEXARELIN.', '# IPAMORELIN.', PRALMORELIN and SERMORELIN (no #). Appendix D clause 5, 'Poisons for which possession without authority is illegal' ('possession other than in accordance with a legal prescription'), lists item 7 CJC-1295 (CAS No. 863288-34-0), item 18 GHRHs 'including those separately specified in Schedule 4', item 19 GHRPs, item 21 growth hormone secretagogues, item 22 hexarelin and item 25 ipamorelin; section 64(4): such a poison 'must not be possessed by a person without authority under the law of the jurisdiction'. Tesamorelin and examorelin are not named anywhere in the instrument. The Reader's guide says an entry includes all salts and derivatives unless stated otherwise, and that group terms are kept 'to deal with any members of the group or class that may have escaped attention'. The CAS number given for CJC-1295, 863288-34-0, is the one PubChem assigns to the 29-residue peptide without DAC (pubchem-cjc-1295-without-dac) and that the FDA calls a 'deleted CAS' (fda-pcac-2024-cjc1295-briefing); the DAC form (CAS 446262-90-4) is not named by its own number. State and territory laws give these schedules effect."

