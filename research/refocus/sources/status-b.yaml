  accessed: 2026-10-23
  verified: url
  note: "Published 17 August 2026. With NSW Police, the TGA seized more than $120,000 of peptide and anabolic steroid products from two residential premises (warrants executed 4 August 2026) allegedly linked to a social media influencer (not named) who imported, relabelled, advertised and sold them; 'The products include retatrutide, CJC-1295 and the Wolverine Stack (combination of BPC-157 and TB-500)'. 'It is unlawful to import, advertise, manufacture and supply unapproved peptide products in Australia.' Penalties under the Therapeutic Goods Act 1989 include civil penalties of up to $1.82 million per breach for individuals and $18.2 million for corporations, and up to 7 years' imprisonment."

