  accessed: 2026-10-23
  verified: registry
  note: "Term searches with location countries read for every record on 23 October 2026. Tesamorelin/TH9507/Egrifta: 25 records; records with Canadian sites, all finished: NCT00123253 (phase 3, Canada and US, completed), NCT00608023 (extension, Belgium, Canada, France, Spain, United Kingdom, US, completed), NCT02012556 (PK/PD, Canada, completed); no record has an Australian site; recruiting records are NCT06554717 and NCT03150511 (US) and NCT07481734 (China). CJC-1295 (all spellings): one record, NCT00267527 (terminated 2006, no sites listed); 'DAC:GRF' none. Ipamorelin: 3 records, all US sites (NCT00672074, NCT01280344 completed; NCT07717866 observational, active not recruiting); 'NNC 26-0161' none. Hexarelin, examorelin, EP-23905, MF-6003: no records. So none of the four peptides is in a registered, open trial in Canada, Australia or the UK. factcheck (24 October 2026): every search repeated through API v2 with the same results ('tesamorelin' 24, 'TH9507' 25, 'Egrifta' 24; 25 distinct records together). Dates of the three Canadian-site trials: NCT00123253 June 2005 to April 2007 (phase 3, 412); NCT00608023 August 2007 to October 2008 (phase 3 extension, 263, with a UK site); NCT02012556 May to July 2008 (phase 1, 18, Montreal). All three predate Health Canada's 2013 trial records, so they are consistent with ca-hc-ctdb-search-status-b-2026-10-23. Caveat: three tesamorelin records list no sites at all (NCT01264497, phase 2, 2002; NCT01388920, phase 2 COPD, terminated 2011; NCT02931474, withdrawn), so their countries are unknown; none is open. CJC-1295: NCT00267527 only (ConjuChem, phase 2, December 2005 to September 2006, 120, terminated, no sites); 'DAC GRF' also none. Ipamorelin: the same 3 records, all US sites only. Hexarelin names and EP23905: none. Confirmed."
