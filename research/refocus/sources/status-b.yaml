  note: "Searched in a browser on 23 October 2026 (the ARTG search on tga.gov.au searches product name, ID and sponsor; ARTG product names include the active ingredient). 'There were no matching results' for: tesamorelin, egrifta, theratechnologies (sponsor), ipamorelin, CJC1295, \"CJC-1295\", hexarelin, examorelin, \"NNC 26-0161\". Control: 'somatropin' returned 30 results (e.g. Omnitrope and Scitropin A entries). The codes TH9507, \"EP-23905\" and \"MF-6003\" returned 633, 601 and 9 unrelated results (vitamin D3 products, hip prostheses, bone cement), because the search splits codes into fragments; the first page of each was checked and none was a peptide. The public search may show only current ARTG entries; a cancelled historical entry could not be ruled out this way, but no other TGA source mentions one. Second pass (late on 23 October 2026, UTC): the search page describes itself as a search of 'medicines, medical devices and biologicals that can be supplied within Australia', and 'rofecoxib' (Vioxx, withdrawn worldwide in 2004) returned 'There were no matching results', which confirms that cancelled entries are not shown. The TGA's ARTG Search Visualisation Tool (compliance.health.gov.au/artg) likewise calls the ARTG 'a register of therapeutic goods that can be lawfully supplied in Australia' and notes that goods not found 'may be suspended or cancelled' (its embedded search box could not be operated in the browser). So these searches show that no product is on the ARTG today; they cannot show that none ever was (see au-tga-search-status-b-2026-10-23 for the registration records)."

