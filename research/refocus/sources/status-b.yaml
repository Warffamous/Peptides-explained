ca-pm-egrifta-2015:
  type: label
  authors: "Theratechnologies Inc. (approved by Health Canada)"
  title: "EGRIFTA (tesamorelin for injection) Product Monograph, 1 mg and 2 mg per vial, date of revision 26 March 2015 (control no. 177087)"
  container: "Drug Product Database"
  year: 2015
  url: https://pdf.hres.ca/dpd_pm/00029988.PDF
  accessed: 2026-10-23
  verified: url
  note: "The product monograph linked from both Egrifta DPD records, downloaded and read (pdftotext) on 23 October 2026, 48 pages. Indication: 'treatment of excess visceral adipose tissue (VAT), as assessed by waist circumference >= 95 cm for males and >= 94 cm for females, and confirmed by a VAT level > 130 cm2 by CT scan, in treatment-experienced adult HIV-infected patients with lipodystrophy'; limitations of use: not for weight loss (weight neutral effect), only for patients who failed to reduce excess VAT with diet and exercise, long-term cardiovascular safety and benefit not studied, no data on improved antiretroviral adherence; contraindicated under 18 years; discontinue in patients with IGF-1 SDS greater than 2 after 26 weeks; in trials 47.4% had IGF-1 above 2 SDS and 35.6% above 3 SDS after 26 weeks. Official Canadian product information for the cancelled product; cited as label_url for the CA product."

