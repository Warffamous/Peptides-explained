ca-sbd-egrifta:
  type: report
  authors: "Health Canada"
  title: "Summary Basis of Decision for Egrifta (SBD00185; issued 11 July 2014), with Post-Authorization Activity Table (updated 24 July 2023)"
  container: "Drug and Health Product Portal"
  year: 2023
  url: https://dhpp.hpfb-dgpsa.ca/review-documents/resource/SBD00185
  accessed: 2026-10-23
  verified: url
  note: "Read in full on 23 October 2026 (the old hpr-rps.hres.ca link SBD00185 redirects here; later the same evening the portal intermittently returned HTTP 522). PAAT: 'DIN 02423677 cancelled (pre market) ... Discontinuation date: 2023-07-13. The manufacturer notified Health Canada that sale of the drug has been discontinued pre market. Health Canada cancelled the DIN(s) pursuant to section C.01.014.6(1)(a)'; 'DIN 02438712 cancelled (post market) ... Discontinuation date: 2022-09-30' (same wording, post market); 'Date of first sale: 2015-06-23' for DIN 02438712 (C.01.014.3); SNDS 177087 filed 2014-08-11, NOC 2015-03-27, to add a 1 mg/vial strength to the approved 2 mg/vial; NDS 131836 filed 2011-06-17, NOC 2014-04-29. The PAAT gives no reason for either discontinuation. Review history: a Notice of Non-Compliance (NON) and then a Notice of Non-Compliance-Withdrawal (NON/W, 1 March 2013) were issued, with major objections on benefit-risk, the indication and elevated IGF-1; the sponsor requested reconsideration (filed 1 May 2013); a Reconsideration Panel of external Canadian experts met on 23 August 2013 and concluded that the potential risks 'should not preclude market authorization'; reconsideration decision 31 October 2013; NOC 29 April 2014 under restricted conditions: stop treatment if IGF-1 SDS is above 2 after 26 weeks (the US label uses 3), only for patients who failed to reduce VAT with diet and exercise, not for weight loss, no shown benefit on antiretroviral adherence. Authorised indication: excess visceral adipose tissue (waist >= 95 cm men, >= 94 cm women, VAT > 130 cm2 on CT) in treatment-experienced adults with HIV and lipodystrophy (one sentence of the SBD says '>30 cm2', a typo; section 1 and the product monograph say 130). The SBD says the sponsor committed to share the two US post-marketing studies, describing the 10-year cohort as 'intended to monitor cardiovascular safety' (the registry gives malignancy as its primary outcome: ctgov-nct01579695). factcheck (24 October 2026): page read again (HTTP 522 on the first try, then 200). Confirmed word for word: PAAT 'Updated: 2023-07-24'; both DIN cancellations with their dates and C.01.014.6(1)(a); 'Date of first sale: 2015-06-23' under C.01.014.3; SNDS 177087 (filed 2014-08-11, NOC 2015-03-27); NDS 131836 (filed 2011-06-17, NOC 2014-04-29); 'Date SBD issued: 2014-07-11'; NON/W 2013-03-01 'with three of the four major objections still remaining'; reconsideration request filed 2013-05-01; panel 23 August 2013 ('should not preclude market authorization'); reconsideration decision 2013-10-31; SDS > 2 at 26 weeks; the '>30 cm2' typo beside two '>130 cm2' passages. The SBD also lists a Scientific Advisory Panel meeting on 2012-03-20 (not used). The SBD calls both studies 'United States post-marketing safety studies' but does not say the FDA required them; that comes from fda-2010-egrifta-approval-letter (postmarketing requirement 1708-2)."

