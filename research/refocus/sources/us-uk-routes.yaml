nice-ta1026-tirzepatide:
  type: guideline
  authors: "National Institute for Health and Care Excellence"
  title: "Tirzepatide for managing overweight and obesity (technology appraisal guidance TA1026)"
  year: 2025
  url: https://www.nice.org.uk/guidance/ta1026
  accessed: 2026-10-23
  verified: url
  note: "Published 23 December 2024, last updated 1 September 2025. Rec. 1.1: recommended alongside a reduced-calorie diet and increased physical activity in adults only if they have an initial BMI of at least 35 kg/m2 and at least one weight-related comorbidity, and the company provides it under the commercial arrangement (lower BMI threshold, usually by 2.5 kg/m2, for some ethnic backgrounds). 'Tirzepatide must be funded in the NHS in England'. Chapter 4 (Implementation, re-read 24 October 2026, https://www.nice.org.uk/guidance/ta1026/chapter/4-Implementation): NICE accepted NHS England's funding variation (4.7); 4.8: NICE 'accepts that a maximum period of 12 years may be necessary' and specifies it, with an initial implementation period of not more than 3 years for a subset of the eligible population (NHS England proposed eligibility rising in stages to around 220,000 patients in those 3 years); 4.9: funding within 3 months for people already in specialist weight management services, and a phased introduction to eligible cohorts from 6 months, in line with NHS England's interim commissioning policy; 4.10: access prioritised by clinical need. 4.15: 'The Welsh ministers have issued directions to the NHS in Wales on implementing NICE technology appraisal guidance'; the All-Wales Weight Management Pathway means weight management medication is prescribed only within a specialist service, where clinically indicated, with a behavioural intervention. Supports: meeting the NICE criteria does not mean immediate NHS access in England. Scotland: see smc-2653-tirzepatide-mounjaro. Northern Ireland arrangements were not checked."

nice-ta875-semaglutide:
  type: guideline
  authors: "National Institute for Health and Care Excellence"
  title: "Semaglutide for managing overweight and obesity (technology appraisal guidance TA875)"
  year: 2023
  url: https://www.nice.org.uk/guidance/ta875
  accessed: 2026-10-23
  verified: url
  note: "Published 8 March 2023, last updated 4 September 2023. Rec. 1.1: recommended for weight management alongside diet and physical activity in adults only if used for a maximum of 2 years within a specialist weight management service, the person has at least one weight-related comorbidity and a BMI of at least 35.0 kg/m2 (or 30.0–34.9 kg/m2 and meets the criteria for referral to specialist services), and the company provides it under the commercial arrangement. Recommendations re-read on 24 October 2026 (unchanged). The NHS England commissioning duties apply to England; Scotland: see smc-2497-semaglutide-wegovy; Wales and Northern Ireland arrangements for semaglutide were not checked (TA1026 chapter 4.15 describes the Welsh position for tirzepatide)."

smc-2497-semaglutide-wegovy:
  type: guideline
  authors: "Scottish Medicines Consortium"
  title: "semaglutide (Wegovy) — SMC2497: advice following a full submission (weight management)"
  container: "Scottish Medicines Consortium"
  year: 2023
  url: https://scottishmedicines.org.uk/medicines-advice/semaglutide-wegovy-full-smc2497/
  accessed: 2026-10-24
  verified: url
  note: "HOST NOT ALLOWLISTED (scottishmedicines.org.uk; the SMC advises NHS Scotland health boards on newly licensed medicines). Date advice published 9 October 2023; status 'Restricted'. 'semaglutide (Wegovy®) is accepted for restricted use within NHSScotland' for weight management; SMC restriction: BMI of at least 30 kg/m2 (a lower cut-off may suit some minority ethnic groups) in the presence of at least one weight-related comorbidity; 'Patients should be treated in a specialist weight management service'; valid only under the NHS Scotland Patient Access Scheme or an equivalent or lower price. Supports the Scotland line in the UK prescription row."

smc-2653-tirzepatide-mounjaro:
  type: guideline
  authors: "Scottish Medicines Consortium"
  title: "tirzepatide (Mounjaro) — SMC2653: advice following a full submission (weight management)"
  container: "Scottish Medicines Consortium"
  year: 2024
  url: https://scottishmedicines.org.uk/medicines-advice/tirzepatide-mounjaro-obesity-full-smc2653/
  accessed: 2026-10-24
  verified: url
  note: "HOST NOT ALLOWLISTED (scottishmedicines.org.uk). Date advice published 10 June 2024; status 'Restricted'. 'tirzepatide (Mounjaro®) is accepted for restricted use within NHSScotland' for weight management; SMC restriction: adults with BMI of at least 30 kg/m2 (a lower cut-off may suit some minority ethnic groups) and at least one weight-related comorbidity; valid only if the company supplies it under the approved Patient Access Scheme. Unlike SMC2497, the advice text does not itself require a specialist weight management service. Supports the Scotland line in the UK prescription row."

smc-2988-semaglutide-wegovy-tablets:
  type: guideline
  authors: "Scottish Medicines Consortium"
  title: "semaglutide tablet (Wegovy) — SMC2988: advice in the absence of a submission (weight management)"
  container: "Scottish Medicines Consortium"
  year: 2026
  url: https://scottishmedicines.org.uk/medicines-advice/semaglutide-wegovy-nonsub-smc2988/
  accessed: 2026-10-24
  verified: url
  note: "HOST NOT ALLOWLISTED (scottishmedicines.org.uk). Date advice published 12 October 2026; status 'Not recommended'. Semaglutide tablets (Wegovy) are not recommended in NHS Scotland because 'The holder of the marketing authorisation has not made a submission to SMC regarding this product in this indication'; the company has said it plans to submit; the earlier acceptance of the Wegovy pen (SMC2497) 'remains valid'. The wording confirms that Wegovy tablets hold a UK marketing authorisation (also listed on emc, see uk-emc-search-2026-10-24); the MHRA Products entry itself was not read. A non-submission notice is about NHS funding in Scotland, not about whether a doctor may prescribe the medicine privately."

