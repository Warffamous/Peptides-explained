uk-ma-1968-s10:
  type: law
  authors: "UK Parliament"
  title: "Medicines Act 1968, section 10: Exemptions for pharmacists"
  container: "legislation.gov.uk"
  year: 1968
  url: https://www.legislation.gov.uk/ukpga/1968/67/section/10
  accessed: 2026-10-23
  verified: url
  note: "Up to date with all changes known to be in force on or before 23 October 2026. S. 10(1): the restrictions in regulations 17(1) and 46 of the 2012 Regulations 'do not apply to anything which is done in a registered pharmacy, a hospital, a care home service or a health centre and is done there by or under the supervision of a pharmacist and consists of (a) preparing or dispensing a medicinal product in accordance with a prescription given by an appropriate practitioner'. The UK counterpart to US pharmacy compounding. Fact-check (24 October 2026): s. 10 also exempts, in a registered pharmacy, preparation to a specification from the person it is for (s. 10(3)), preparation in the pharmacist's own judgement with the person present (s. 10(4)(a)) and preparation for retail sale at that pharmacy (s. 10(5)-(6)); these lift only regs 17(1) and/or 46, not the prescription-only rule in reg. 214. S.I. 2025/1249 (Human Medicines (Authorisation by Pharmacists and Supervision by Pharmacy Technicians) Order 2025) art. 4 will amend s. 10 to cover registered pharmacy technicians acting with a pharmacist's authorisation; art. 4 comes into force on a day appointed by the Privy Council, and legislation.gov.uk lists it under 'changes and effects yet to be applied' on 24 October 2026. Whether and how s. 10 is used for unlicensed peptides is not established (see research notes, UNRESOLVED)."

uk-hmr-2012-reg-167c:
