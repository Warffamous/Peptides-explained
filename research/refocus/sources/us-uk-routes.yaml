  accessed: 2026-10-23
  verified: url
  note: "Regs. 167C–167H inserted from 15 April 2022 by SI 2022/352; up to date with all changes known to be in force on or before 23 October 2026. 167C(1): the licensing authority must operate EAMS, whose purpose is 'to give patients with life threatening or seriously debilitating conditions access to medicinal products ... which are either not authorised or not authorised for that use'. 167C(2)(a): a Promising Innovative Medicine designation, issued to the person who is or may be responsible for placing the product on the market, requires a life-threatening or seriously debilitating condition with high unmet need, a likely major advantage over methods in use in the UK, and a reasonable expectation of a positive risk-benefit balance. 167C(2)(b): an EAMS scientific opinion also requires the holder to be able to supply the product and to manufacture it 'to a consistent quality standard and in compliance with good manufacturing practice'."

