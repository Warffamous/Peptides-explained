fda-503b-bulks-page:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Bulk Drug Substances Used in Compounding Under Section 503B of the FD&C Act"
  year: 2025
  url: https://www.fda.gov/drugs/human-drug-compounding/bulk-drug-substances-used-compounding-under-section-503b-fdc-act
  accessed: 2026-10-23
  verified: url
  note: "Content current as of 7 January 2025 (unchanged on 23 October 2026). Outsourcing facilities may compound from bulk substances on the 503B bulks list or for drugs on the shortage list; bulk substances need a valid certificate of analysis and a registered manufacturer. Interim categories 1–3 for 503B nominations (category 1: no-action policy if conditions are met; category 2: significant safety risks; category 3: insufficient support); FDA does not intend to categorise substances nominated on or after 7 January 2025. The linked categories PDF is the existing fda-503b-categories-2025-03 (still 'Updated March 21, 2025' on 23 and 24 October 2026: ipamorelin acetate, GHRP-6 and GHRP-2 'for injectable and nasal routes of administration' in 503B category 2, while 'GHRP-2 (except for injectable and nasal routes...)' is in 503B category 1; thymosin alpha-1 in 503B category 3; ibutamoren mesylate, not a peptide, also in category 2)."

fda-compounding-actions-index:
