# ---------------------------------------------------------------- United States: statute (Cornell LII, as the existing usc-21-* entries)

usc-21-353:
  type: law
  authors: "Legal Information Institute, Cornell Law School (text of the United States Code)"
  title: "21 U.S. Code § 353 – Exemptions and consideration for certain drugs, devices, and biological products (FD&C Act § 503)"
  container: "United States Code"
  year: 2026
  url: https://www.law.cornell.edu/uscode/text/21/353
  accessed: 2026-10-23
  verified: url
  note: "§ 353(b)(1): a drug that is not safe for use except under the supervision of a practitioner licensed by law, or that is limited to such use by its approved application, 'shall be dispensed only' on a written prescription of a licensed practitioner, on an oral prescription promptly reduced to writing by the pharmacist, or by an authorised refill; dispensing contrary to this paragraph makes the drug misbranded while held for sale. Supports: an approved prescription medicine reaches a patient through a licensed prescriber and a pharmacy."

usc-21-360bbb:
  type: law
  authors: "Legal Information Institute, Cornell Law School (text of the United States Code)"
  title: "21 U.S. Code § 360bbb – Expanded access to unapproved therapies and diagnostics (FD&C Act § 561)"
  container: "United States Code"
  year: 2026
  url: https://www.law.cornell.edu/uscode/text/21/360bbb
  accessed: 2026-10-23
  verified: url
  note: "§ 360bbb(b), individual patient access for a serious disease or condition: a person, acting through a physician licensed under State law, may request an investigational drug from a manufacturer or distributor, which 'may' provide it if (1) the physician determines there is no comparable or satisfactory alternative therapy and the probable risk from the drug is not greater than the probable risk from the disease; (2) FDA determines there is sufficient evidence of safety and effectiveness to support the use; (3) FDA determines it will not interfere with clinical investigations to support approval; (4) the sponsor or investigator submits a clinical protocol consistent with § 355(i). § 360bbb(c): treatment IND/protocol criteria (serious or immediately life-threatening condition, no comparable alternative, controlled trial under an IND or all trials completed, sponsor actively pursuing approval). § 360bbb(d): FDA may terminate expanded access if the requirements are no longer met."

usc-21-360bbb-0a:
  type: law
  authors: "Legal Information Institute, Cornell Law School (text of the United States Code)"
  title: "21 U.S. Code § 360bbb-0a – Investigational drugs for use by eligible patients (FD&C Act § 561B, the federal Right to Try Act)"
  container: "United States Code"
  year: 2026
  url: https://www.law.cornell.edu/uscode/text/21/360bbb-0a
  accessed: 2026-10-23
  verified: url
  note: "Added by Pub. L. 115-176, § 2(a), 30 May 2018. § 360bbb-0a(a)(1): an 'eligible patient' has been diagnosed with a life-threatening disease or condition (as defined in 21 CFR 312.81), has exhausted approved treatment options and is unable to participate in a clinical trial of the drug (certified by a physician in good standing who is not compensated directly by the manufacturer for certifying), and has given written informed consent. (a)(2): an 'eligible investigational drug' has completed a phase 1 trial, is not approved or licensed for any use, has an application filed or is in a clinical trial intended to form the primary basis of a claim of effectiveness under an active IND, and its active development or production is ongoing and not discontinued or on clinical hold. (b): such drugs are exempt from §§ 352(f), 353(b)(4), 355(a), 355(i) and 21 CFR parts 50, 56 and 312 (except 312.6, 312.7, 312.8(d)(1)). Pub. L. 115-176 § 2(b): no liability for a sponsor, manufacturer, prescriber or dispenser for a determination not to provide access."

usc-21-396:
  type: law
  authors: "Legal Information Institute, Cornell Law School (text of the United States Code)"
  title: "21 U.S. Code § 396 – Practice of medicine (FD&C Act § 1006)"
  container: "United States Code"
  year: 2026
  url: https://www.law.cornell.edu/uscode/text/21/396
  accessed: 2026-10-23
  verified: url
  note: "Recorded as a caution, not as support for off-label prescribing of drugs: the section says nothing in the chapter limits a practitioner's authority 'to prescribe or administer any legally marketed device' to a patient within a legitimate practitioner-patient relationship. It concerns devices only. For drugs, cite FDA's own statement (fda-off-label-use)."

# ---------------------------------------------------------------- United States: regulations (eCFR renderer API, 'current' text)

ecfr-21-312-subpart-i:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR part 312, subpart I – Expanded Access to Investigational Drugs for Treatment Use (§§ 312.300–312.320)"
  container: "eCFR"
  year: 2015
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-I
  accessed: 2026-10-23
  verified: url
  note: "Read through the eCFR renderer API (current text; versioner shows no change to §§ 312.300–312.320 in the eCFR record; source 74 FR 40942, 13 August 2009, § 312.310 as amended at 75 FR 32659, 9 June 2010, and 80 FR 18091, 3 April 2015; fact-check 24 October 2026: the 2010 amendment was missing from the first-pass note). § 312.300(b): definitions of 'immediately life-threatening' and 'serious disease or condition' (substantial impact on day-to-day functioning; short-lived and self-limiting morbidity usually not sufficient). § 312.305(a): FDA must determine a serious or immediately life-threatening condition with no comparable or satisfactory alternative, that potential benefit justifies potential risks, and no interference with trials. § 312.305(b)(2)(v)-(vii): the submission must include a description of the manufacturing facility, chemistry, manufacturing and controls information adequate to ensure identity, quality, purity and strength, and pharmacology and toxicology information adequate to conclude the drug is reasonably safe at the proposed dose and duration. § 312.305(c)(4): investigators must obtain informed consent (part 50) and IRB review (part 56). § 312.310: individual patients, including emergency use; the physician must judge that the probable risk from the drug is not greater than from the disease; FDA must find the patient cannot obtain the drug under another IND; treatment generally limited to a single course unless FDA authorises more; written summary of results to FDA at the end. § 312.315: intermediate-size populations (including where the drug is not being developed). § 312.320: treatment IND (drug in a controlled trial under an IND or all trials completed; sponsor actively pursuing approval). The regulation text contains FDA telephone numbers; none is recorded here."

ecfr-21-312-81:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR 312.81 – Scope (subpart E: drugs intended to treat life-threatening and severely-debilitating illnesses)"
  container: "eCFR"
  year: 1999
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-E/section-312.81
  accessed: 2026-10-23
  verified: url
  note: "The definition the Right to Try Act refers to: 'life-threatening' means (1) diseases or conditions where the likelihood of death is high unless the course of the disease is interrupted, and (2) diseases or conditions with potentially fatal outcomes, where the end point of clinical trial analysis is survival. [53 FR 41523, 21 October 1988, as amended at 64 FR 401, 5 January 1999]."

ecfr-21-312-20:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR 312.20 – Requirement for an IND"
  container: "eCFR"
  year: 1997
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-312/subpart-B/section-312.20
  accessed: 2026-10-23
  verified: url
  note: "(a) A sponsor shall submit an IND to FDA if it intends to conduct a clinical investigation with an investigational new drug subject to § 312.2(a); (b) a sponsor shall not begin such an investigation until an IND is in effect (§ 312.40). Supports: a US drug trial of an unapproved peptide runs under an FDA investigational new drug application."

ecfr-21-50-25:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR 50.25 – Elements of informed consent"
  container: "eCFR"
  year: 2011
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-50/subpart-B/section-50.25
  accessed: 2026-10-23
  verified: url
  note: "(a) Basic elements a trial participant must be told: that the study involves research, its purposes, duration and procedures, and which procedures are experimental (1); foreseeable risks (2); expected benefits (3); appropriate alternatives (4); confidentiality and that FDA may inspect records (5); for more-than-minimal-risk research, whether compensation and medical treatment are available if injury occurs (6); whom to contact (7); and (8) that participation is voluntary, refusal involves no penalty or loss of benefits, and the participant 'may discontinue participation at any time without penalty or loss of benefits'. (b)(3): additional costs to the participant, when appropriate. [46 FR 8951, 27 January 1981, as amended at 76 FR 270, 4 January 2011]."

ecfr-21-56-103:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR 56.103 – Circumstances in which IRB review is required"
  container: "eCFR"
  year: 1981
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-56/subpart-A/section-56.103
  accessed: 2026-10-23
  verified: url
  note: "(a) Except as provided in §§ 56.104 and 56.105, a clinical investigation that requires prior submission to FDA (parts 312, 812, 813) 'shall not be initiated unless that investigation has been reviewed and approved by, and remains subject to continuing review by, an IRB'."

# ---------------------------------------------------------------- United States: FDA pages

fda-expanded-access:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Expanded Access"
  year: 2026
  url: https://www.fda.gov/news-events/public-health-focus/expanded-access
  accessed: 2026-10-23
  verified: url
  note: "Content current as of 22 October 2026. Expanded access, 'sometimes called compassionate use', is 'a potential pathway for a patient with a serious or immediately life-threatening disease or condition to gain access to an investigational medical product ... for treatment outside of clinical trials when no comparable or satisfactory alternative therapy options are available'. May be appropriate when all apply: serious or immediately life-threatening condition; no comparable or satisfactory alternative; enrolment in a clinical trial is not possible; potential benefit justifies potential risks; no interference with trials that could support approval. Investigational products have not been found safe and effective by FDA and may cause unexpected serious side effects. The page lists FDA contact telephone numbers; none is recorded here."

fda-expanded-access-patients:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Expanded Access | Information for Patients"
  year: 2026
  url: https://www.fda.gov/news-events/expanded-access/expanded-access-information-patients
  accessed: 2026-10-23
  verified: url
  note: "Content current as of 22 October 2026. 'Whenever possible, an investigational medical product should be used as part of a clinical trial.' The licensed physician requests the product; the physician, the IRB and the company 'all need to agree'; 'It is important to remember that the company provides the investigational medical product. Without their cooperation, you will not be able to get expanded access'; 'There is no law or policy that requires a company to provide access to investigational medical products outside of the clinical trial.' Five key decisions: physician agrees to oversee and report; company agrees to provide; IRB reviews and approves (the patient may have to pay for the review); FDA reviews; patient gives informed consent and may stop at any time. 'On average, FDA determines that vast majority of all expanded access requests may proceed.' Costs are usually not covered by private insurance or Medicare; if a company charges, costs must be justified and limited to recovering manufacture, research, development and handling costs. FDA 'cannot compel a sponsor to continue providing access'."

fda-right-to-try:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Right to Try"
  year: 2024
  url: https://www.fda.gov/patients/learn-about-expanded-access-and-other-treatment-options/right-try
  accessed: 2026-10-23
  verified: url
  note: "Content current as of 12 December 2024. Right to Try is 'one way for patients who have been diagnosed with life-threatening diseases or conditions who have tried all approved treatment options and who are unable to participate in a clinical trial to access certain investigational treatment options'; FDA's role 'is limited to receiving and posting certain information'; FDA 'does not review or approve requests'; individual requests do not require IRB review; written informed consent is required; the Act 'does not require a sponsor to provide an eligible investigational drug'; a drug on clinical hold is not eligible. Lists the eligible-patient and eligible-drug criteria (phase 1 completed; not approved for any use; application filed or in an effectiveness trial under an active IND; development ongoing). The page lists FDA telephone numbers; none is recorded here."

fda-off-label-use:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Understanding Unapproved Use of Approved Drugs 'Off Label'"
  year: 2018
  url: https://www.fda.gov/patients/learn-about-expanded-access-and-other-treatment-options/understanding-unapproved-use-approved-drugs-label
  accessed: 2026-10-23
  verified: url
  note: "Content current as of 5 February 2018. 'From the FDA perspective, once the FDA approves a drug, healthcare providers generally may prescribe the drug for an unapproved use when they judge that it is medically appropriate for their patient.' Off-label means an approved drug used for an unapproved disease, given in a different way, or at a different dose; 'remember that FDA has not determined that the drug is safe and effective for the unapproved use'. Suggested questions for patients include insurance coverage and whether a clinical trial is available."

fda-rpm-ch9-personal-importations:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Regulatory Procedures Manual, Chapter 9: Import Operations and Actions (MAN-000012, version 05, March 2024), subchapter 9-2: Coverage of Personal Importations"
  year: 2024
  url: https://www.fda.gov/media/71776/download
  accessed: 2026-10-23
  verified: url
  note: "PDF linked from the RPM index (content current as of 1 February 2025; re-fetched 24 October 2026: still MAN-000012 version 05, March 2024, and the quotes below confirmed word for word). 9-2-3: FDA personnel do not examine personal baggage (a CBP task). 9-2-4: CBP sets aside mail parcels that appear to contain a drug; FDA audits them; final disposition is CBP's 'except in the case of drugs that are subject to administrative destruction (e.g., drugs that are valued at $2500 or less which have been refused admission, or have not met the Personal Importation Policy criteria ...)', which 'will be destroyed by FDA'. 9-2-5: FDA personnel 'may allow entry' when quantity and purpose are clearly personal and the product does not present an unreasonable risk, but 'this should not be interpreted as a license to individuals to bring in such shipments'; 'Commercial and promotional shipments are not subject to these procedures', and 'Commercial shipments generally include shipments other than those products that are personally carried, shipped by a personal non-commercial representative of a consignee, or shipped from a foreign medical facility where a person has undergone treatment' (added by the fact-checker, 24 October 2026); a supply exceeding what one person might take in approximately three months may indicate commercial distribution; drugs subject to import alerts 'are not amenable to these procedures'; the two situations for a more permissive decision (as on fda-personal-importation); FDA may 'Release with Comment' and advise that the drug appears unapproved, should be used under medical supervision, that future shipments may be detained, and that the patient's physician should consider an investigational study or an IND, compassionate IND or treatment IND."

fda-import-alert-66-41:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Import Alert 66-41: Detention Without Physical Examination of Unapproved New Drugs Promoted in the U.S."
  year: 2026
  url: https://www.accessdata.fda.gov/cms_ia/importalert_190.html
  accessed: 2026-10-23
  verified: url
  note: "Published date 22 October 2026 (revision of 19 May 2026 updates the guidance section). Reason for alert: unapproved new drugs 'have not been reviewed by FDA for safety or effectiveness'; new drugs may not be introduced into interstate commerce without an approved application (section 505(a)). The red list includes firm-level entries under product code 'Peptide N.E.C.' for products such as melanotan and PT-141 (checked 23 October 2026; re-checked 24 October 2026 by the fact-checker, published date still 22 October 2026). Guidance section: divisions 'should follow the guidance in the Regulatory Procedures Manual (RPM) Chapter 9-2 for Personal Importation shipments. Commercial or promotional shipments, and products subject to DWPE are generally not amenable to the use of enforcement discretion.' The alert names firms: cite it only for the general mechanism (detention without physical examination), never for a named firm."

fda-import-alert-66-80:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Import Alert 66-80: Detention Without Physical Examination of Glucagon-Like Peptide-1 (GLP-1) Receptor Agonist Bulk Drug Substances"
  year: 2026
  url: https://www.accessdata.fda.gov/cms_ia/importalert_1186.html
  accessed: 2026-10-23
  verified: url
  note: "Published date 9 October 2026 (major revision following a 19 March 2026 CDER memo; adds orforglipron API to the Green List). Foreign-sourced GLP-1 APIs 'should be considered for detention without physical examination (DWPE) based on the appearance of adulteration', except from firms on the Green List. FDA evaluated 48 GLP-1 API sites through inspections or records requests and found 21% non-compliant; 503A compounders are exempt from CGMP, so there is 'a heightened risk that any quality concerns associated with the bulk drug substance would not be adequately controlled'. FDA's GLP-1 concerns page (fda-unapproved-glp1-concerns) says the alert does not create new limits on legal compounding."

fda-2026-03-telehealth-warning-letters:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA Warns 30 Telehealth Companies Against Illegal Marketing of Compounded GLP-1s"
  year: 2026
  url: https://www.fda.gov/news-events/press-announcements/fda-warns-30-telehealth-companies-against-illegal-marketing-compounded-glp-1s
  accessed: 2026-10-23
  verified: url
  note: "Press release, 3 March 2026: 30 warning letters to telehealth companies for false or misleading claims about compounded GLP-1 products; 'the second group of warning letters sent to telehealth firms since the agency launched in September a crackdown on misleading direct-to-consumer pharmaceutical advertisements'; 'thousands of letters' to pharmaceutical and telehealth firms over six months to remove misleading ads (all products, not only compounded GLP-1s; clarified by the fact-checker). Primary violations: claims implying sameness with FDA-approved products, and branding with the telehealth firm's name implying it is the compounder. 'Compounded drugs are not FDA-approved ... also not the same as generic drugs'. The release lists media and consumer telephone numbers; none is recorded here."

fda-telehealth-promoting-compounded-drugs:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA to Telehealth Companies: What to Know When Promoting Compounded Drugs"
  year: 2026
  url: https://www.fda.gov/drugs/human-drug-compounding/fda-telehealth-companies-what-know-when-promoting-compounded-drugs
  accessed: 2026-10-23
  verified: url
  note: "Content current as of 15 June 2026. False or misleading claims by telehealth companies about compounded GLP-1s and other drugs 'violates federal law'. Reminders: do not use branding implying the telehealth company is the compounder; do not call a compounded drug a generic or the same as an FDA-approved drug; do not claim it is FDA-approved or evaluated for safety and effectiveness; do not call it clinically proven to produce the same result; do not claim it comes from an 'FDA-approved or FDA-licensed' pharmacy or outsourcing facility, because 'FDA does not approve or license any facility'. Letters can be found by searching 'telehealth' in the warning-letter database."

