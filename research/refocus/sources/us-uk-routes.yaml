gmc-2021-prescribing-unlicensed:
  type: guideline
  authors: "General Medical Council"
  title: "Good practice in proposing, prescribing, providing and managing medicines and devices: Prescribing unlicensed medicines (paragraphs 102–108)"
  year: 2024
  url: https://www.gmc-uk.org/professional-standards/the-professional-standards/good-practice-in-prescribing-and-managing-medicines-and-devices/prescribing-unlicensed-medicines
  accessed: 2026-10-23
  verified: url
  note: "HOST NOT ALLOWLISTED (www.gmc-uk.org, the UK statutory regulator of doctors; first read in the desktop browser on 23 October 2026 because plain curl and WebFetch got HTTP 403; re-read with curl and browser request headers on 24 October 2026, paragraphs 102-105 and the dates confirmed word for word). Guidance published 18 February 2021, in effect 5 April 2021, updated 15 March 2022 and 13 December 2024. Para 102: 'unlicensed medicine' covers medicines used outside the terms of their UK licence or with no UK licence. Para 103: 'You should usually propose, prescribe or provide licensed medicines in accordance with the terms of their licence'; unlicensed medicines may be appropriate where, on an assessment of the individual patient, the doctor concludes 'for medical reasons' that it is necessary to meet the patient's specific needs. Para 104: examples (no suitably licensed medicine meets the need; a suitable licensed medicine is not available, e.g. a shortage; part of a properly approved research project; MHRA temporary authorisation in a public-health emergency). Para 105: the doctor 'must be satisfied that there is sufficient evidence or experience of using the medicine to demonstrate its safety and efficacy', take responsibility for prescribing and for overseeing care, monitoring and follow-up, and keep a clear record of the reasons. Paras 106–108: give patients sufficient information to make an informed decision; answer questions fully and honestly; where not routine or licensed alternatives exist, explain this and the reasons."

gmc-2021-deciding-safe-to-prescribe:
  type: guideline
  authors: "General Medical Council"
  title: "Good practice in proposing, prescribing, providing and managing medicines and devices: Deciding if it is safe to prescribe (paragraphs 20-43)"
  year: 2024
  url: https://www.gmc-uk.org/professional-standards/the-professional-standards/good-practice-in-prescribing-and-managing-medicines-and-devices/deciding-if-it-is-safe-to-prescribe
  accessed: 2026-10-24
  verified: url
  note: "HOST NOT ALLOWLISTED (www.gmc-uk.org; read with curl and browser request headers). Same guidance and dates as gmc-2021-prescribing-unlicensed (published 18 February 2021, in effect 5 April 2021, updated 15 March 2022 and 13 December 2024). Para 20: patients may consult face to face or remotely (telephone, video, online). Para 21: a face-to-face consultation may be more appropriate when, among other things, the doctor needs to examine the patient, or is not the patient's usual doctor and the patient has not consented to sharing information with their regular prescriber, particularly where treatment needs follow-up or monitoring. Para 22: a doctor who is not the patient's regular doctor should give their name, role and, if online, their GMC registration number. Para 23: before prescribing, the doctor 'must be satisfied' that they can make an adequate assessment, establish a dialogue and obtain consent through the mode of consultation used. Para 26: 'You must only propose, prescribe or provide medicines, treatments or devices if it is safe to do so'; it is not safe without sufficient information about the patient's health or if the mode of consultation is unsuitable. Para 27: consider access to medical records and whether information can be verified by examination or testing. Paras 28-31: ask consent to contact and inform the GP; if failing to share information could pose a risk, explain that you cannot prescribe and signpost alternatives. Para 34: take an adequate history, including 'medicines purchased online or face to face'. Para 35: encourage patients to be open about medicines obtained online. Para 37: it may be appropriate to raise concerns if the system involves 'prescribing remotely on the basis of a questionnaire and there is no mechanism for two-way dialogue'. Para 25: injectable cosmetic medicines must not be prescribed remotely (not a peptide point). Supports: a UK online prescriber must be able to assess the patient safely; the patient should tell any prescriber what they already use."

