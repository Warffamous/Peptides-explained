# ================================================================ AUSTRALIA: listed medicines (NAD+ precursors)

au-permissible-ingredients-determination-2026-3:
  type: law
  authors: "Commonwealth of Australia (Department of Health, Disability and Ageing)"
  title: "Therapeutic Goods (Permissible Ingredients) Determination (No. 3) 2026 (F2026L01382)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026L01382/latest/text
  accessed: 2026-10-23
  verified: url
  note: "Made 12 October 2026 under s 26BB(1) of the Therapeutic Goods Act 1989; commenced 16 October 2026 and replaced Determination (No. 2) 2026 (TGA news item 'Update to listed medicine ingredients in October 2026', 16 October 2026). It lists the ingredients that medicines listed in the ARTG (AUST L and AUST L(A)) may contain; 'A' means permitted as an active ingredient, 'E' as an excipient. Read from the official HTML text, volumes 1 to 6 (epub document_1 to document_6), on 23 October 2026. Volume 4: item 3493 'NICOTINAMIDE MONONUCLEOTIDE', A: until 10 December 2027 only in a medicine whose sponsor is the named applicant company or a sponsor it has authorised (TGA notified); oral route only; a maximum recommended daily dose and a maximum duration of use of 12 weeks; adults only and not in pregnant or lactating women. Item 3494 'NICOTINAMIDE RIBOSIDE CHLORIDE', A: oral routes only; a maximum daily dose; label warnings 'Not to be taken by children under 12 years old' and, above a set daily dose, 'Not recommended for use during pregnancy or lactation'. Items 3491 NICOTINAMIDE and 3495 NICOTINIC ACID are also permitted. No entry in any volume for nadide, NAD, NAD+ or 'nicotinamide adenine dinucleotide'; the only related entry is item 1930 'DISODIUM NADH', E, 'Only for use in topical medicines for dermal application'. So NR chloride and NMN (oral, with conditions) can be active ingredients of listed medicines; NAD+ itself cannot. The site gives no doses: the dose caps are not to be reproduced."

au-tga-2025-04-nad-nmn-safety-alert:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "NAD, NAD+, NADH or NMN medicines sold in Australia (safety alert)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/safety/safety-monitoring-and-information/safety-alerts/nad-nad-nadh-or-nmn-medicines-sold-australia
  accessed: 2026-10-23
  verified: url
  note: "Published 7 April 2025, last updated 3 February 2026 ('This update reflects the inclusion of NMN in the Therapeutic Goods (Permissible Ingredients) Determination (No. 4) 2025 as of 10 December 2025'); read in a browser on 23 October 2026. For sponsors: 'NAD, NAD+, and NADH are currently not permitted ingredients' of listed medicines, and listed medicines that make claims about them through name, labelling or advertising 'are at risk of breaching the law'; NMN is permitted from 10 December 2025 under the conditions in the Determination. 'If you are advertising or supplying therapeutic goods that refer to NAD, NAD+, NADH, or NMN and these goods are not included in the ARTG nor exempted or otherwise authorised, you are likely breaching the law.' For consumers: listed medicines ('AUST L') 'can only make low-level health claims selected from a pre-approved list and can only use ingredients that the TGA has pre-assessed as safe and of low risk'; NAD, NAD+ and NADH 'are currently not approved for use as ingredients in listed medicines, while NMN can be used in listed medicines when in compliance with specific requirements'; products without an AUST number on the label 'may be unapproved goods or illegally supplied and could pose a risk to your health'."

au-tga-2026-08-nad-nmn-representations-guidance:
  type: guideline
  authors: "Therapeutic Goods Administration"
  title: "Making NAD, NAD+, NADH or NMN representations for listed medicines (guidance for sponsors)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/guidance/making-nad-nad-nadh-or-nmn-representations-listed-medicines
  accessed: 2026-10-23
  verified: url
  note: "Published 12 August 2026; read in a browser on 23 October 2026. Applies to medicines listed under s 26A of the Act, which 'are not evaluated by the Therapeutic Goods Administration (TGA) prior to entry on the ARTG. Instead, sponsors certify that their listed medicine meets requirements in relation to quality, safety and efficacy.' 'NAD, NAD+, and NADH are currently not permitted ingredients. NMN is a permitted ingredient, having been included in the Ingredients Determination on 10 December 2025.' Precursors such as nicotinamide, nicotinamide ascorbate, nicotinamide riboside chloride and nicotinic acid are also in the Determination. 'Currently, there are no permitted indications that reference NAD, NAD+, NADH, or NMN'; indications such as 'boost NAD+ levels' are not permitted. Unapproved goods referring to NAD/NMN that are not in the ARTG 'may be in breach of the Act'."

