  year: 2013
  url: https://www.medsafe.govt.nz/consultations/acc-pieds.pdf
  accessed: 2026-10-23
  verified: url
  note: "Published February 2013 ('Commonwealth of Australia 2013'), the public report of Project Aperio. Downloaded and read (pdftotext) on 23 October 2026 from the copy hosted on the New Zealand regulator's site; the Australian Criminal Intelligence Commission site (acic.gov.au) did not respond. On AOD-9604 the report says: it 'was identified in Project Aperio as being used by professional athletes'; 'AOD-9604 is not currently a WADA prohibited substance' and 'AOD9604 is not currently prohibited under category S2 of the WADA Prohibited List'; 'AOD-9604 is not approved for human use'; in the substance table, scheduling status (SUSMP) 'Unscheduled' and border status 'Schedule 7A Customs (Prohibited Imports) Regulations' (the ACC's 2013 view; the current Schedule 7A does not name AOD-9604: au-customs-prohibited-imports-regs); it repeats company statements that AOD-9604 was 'about to enter phase three clinical trials' and had effects on cartilage (cited to company stock-exchange announcements, spelt once 'Caldaza'). Cited for what the Australian government said in February 2013, not for the science."

au-fca-2014-1019-essendon-v-asada:
  type: law
  authors: "Federal Court of Australia (Middleton J)"
  title: "Essendon Football Club v Chief Executive Officer of the Australian Sports Anti-Doping Authority [2014] FCA 1019"
  container: "Federal Court of Australia, Digital Law Library"
  year: 2014
  url: https://www.judgments.fedcourt.gov.au/judgments/Judgments/fca/single/2014/2014fca1019
  accessed: 2026-10-23
  verified: url
  note: "Judgment of 19 September 2014 (VID 327 and 328 of 2014), read in a browser on 23 October 2026. [1]: in early February 2013 ASADA's CEO and the AFL agreed a 'joint investigation' into Essendon's 2011-2012 supplements program. [83]: the ACC's Project Aperio report 'Organised Crime and Drugs in Sport' was published in February 2013. [175]-[176]: notes of a meeting between ASADA's CEO and AFL executives record 'WADA say AOD9604 is banned' (paragraph 175 dates the meeting '4 June 2014', but it sits in the 2013 chronology between May and late June 2013 events, so the year may be a slip in the judgment; do not quote the date). [191]: on 2 July 2013 ASADA and the AFL agreed the interim report would include 'ASADA's position on whether it intends to prosecute any cases on AOD9604'. [206]: ASADA's covering letter of 2 August 2013 to the AFL said: 'In relation to the issue of AOD-9604, ASADA will make a public statement about its proposed approach in all sports to the enforcement of possible anti-doping rule violations involving this substance that occurred prior to the World Anti-Doping Agency's media release of 22 April 2013.' The same letter says ASADA did not then have enough evidence that specific players had been given thymosin beta-4. The court dismissed Essendon's and Hird's challenge to the investigation. The judgment does not quote the WADA release itself or ASADA's later public statement."

