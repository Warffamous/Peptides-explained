ca-hc-recalls-database:
  type: regulator
  authors: "Health Canada"
  title: "Recalls and safety alerts (searchable database)"
  container: "Recalls and safety alerts"
  year: 2026
  url: https://recalls-rappels.canada.ca/en
  accessed: 2026-10-23
  verified: url
  note: "Index entry for advisories that name a seller, clinic, shop or brand (seller rule). Searches run on 23 October 2026 by both runs of this assignment (site search, recalls-rappels.canada.ca/en/search/site?search_api_fulltext=<term>): 'peptide' 12 results, 'BPC-157' 6, 'retatrutide' 3, 'melanotan' 5, 'tirzepatide' 4, 'semaglutide' 9, 'GHK' 5, 'TB-500' 6 (plus unrelated hits), and, to look for older items, 'bodybuilding' 24, 'anti-aging' 31, 'SARMs' 16, 'growth hormone' 97 (scanned by title only). The earliest peptide-specific advisory found is RA-74731 (December 2023); none was found for 2020 to 2022 (the 2017 to 2020 lists titled 'Unauthorized products may pose serious health risks' were not opened). Each advisory is reachable by a neutral URL, recalls-rappels.canada.ca/en/node/<RA number>, which redirects to it (checked for 81518, 81874 and 77218). Peptide advisories found and read in full; those naming a seller, clinic, shop or brand are summarised here by number, without names (most also name the brands on the vials and print vial strengths: never copy either): RA-74731 (13 December 2023): injectable products 'promoted as peptides' sold online by a Quebec seller; 'Most synthetic injectable peptides are regulated as prescription drugs in Canada'; Health Canada 'has ordered' the seller to stop advertising and selling and works with the CBSA to prevent import. RA-75741 (26 June 2024, updated 19 July 2024): injectable peptides and bodybuilding drugs seized from a Quebec company selling on two websites; at Health Canada's request it stopped selling and took the websites down; the update added nootropic drops and RU-58841. RA-77218 (1 April 2025, corrected 2 April): 26 named injectable peptide products seized from a wellness clinic in Calgary (including BPC-157, CJC-1295, epitalon, GHK-Cu, ipamorelin, KPV, melanotan-2, MOTS-c, PT-141, selank, thymosin alpha-1, TB-500); 'most injectable peptides are regulated as prescription drugs in Canada'; people treated there are told to consult a health professional. RA-77275 (14 April 2025): injectable peptides and bodybuilding drugs seized from an online seller in Sherbrooke, Quebec; at Health Canada's request it stopped selling and took its website down; 'injectable peptides are regulated as prescription drugs in Canada'. RA-77807 (1 August 2025): 42 named injectable peptide products seized from and sold by an online seller (including AOD9604, bremelanotide, BPC-157, CJC-1295, epitalon, GHK-Cu, hexarelin, ipamorelin, LL-37, melanotan 1 and II, retatrutide, selank, semax, SS-31, tesamorelin, thymosin alpha, TB-500, tirzepatide); 'Injectable peptides are regulated as prescription drugs in Canada.' RA-81403 (24 December 2025): injectable peptides (including semaglutide, retatrutide, BPC-157, TB-500, GHK-Cu blends, MOTS-c, SS-31, tesamorelin, thymosin alpha-1, melanotan-2), somatropin and testosterone compounds seized from a fitness business in Vancouver and sold through a website; at Health Canada's request the company stopped advertising and selling; 'Many injectable peptides are regulated as prescription drugs in Canada.' RA-81404 (24 December 2025): injectable peptides (semaglutide, tirzepatide, products labelled 'Retra', BPC-157, TB-500, ipamorelin, melanotan), SARMs, anabolic steroids and testosterone compounds seized from two supplement shops in Maple Ridge, BC; 'Some of the seized product ... have been labelled with falsified Drug Identification Numbers (DINs).' RA-81792 (25 March 2026): counterfeit Mounjaro vials and pens (a pen's DIN and batch number are invalid) and unauthorised injectables seized at a Mississauga business. Common to these advisories: risks named are infection, allergic reactions, contaminants, wrong or missing ingredients and poor manufacture or storage; the advice is to see a health professional if worried, return products to a pharmacy or follow municipal hazardous-waste rules, check for a DIN (or NPN / DIN-HM) in the Drug Product Database or the Licensed Natural Health Products Database, and report side effects to Health Canada. Re-read in full by the second run: RA-74731, RA-75741, RA-77218, RA-77275, RA-77807, RA-81403, RA-81404, RA-81792 (dates and quotations above checked; corrections: RA-81403's business is a fitness business, not described as a gym; RA-81404's falsified DINs and SARMs added). Not peptide-related and not used: a cosmetic lash serum recall, a skincare ampoule recall, a laboratory assay recall, and RA-82484 (12 August 2026), a seizure of unauthorised and counterfeit cosmetic injectables (botulinum toxin, placenta product, dermal fillers) at a beauty business in Hamilton. Other generic-semaglutide quality recalls of 2026 are in ca-hc-2026-08-generic-semaglutide-recall."

