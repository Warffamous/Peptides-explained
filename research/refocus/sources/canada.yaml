# SHARED IDS (same convention as status-c.yaml): the entries below marked "Same id and URL as ..." describe a
# document that status-b or status-c also registered. They keep that id and URL and give the facts this page relies
# on. When the files are merged, keep one entry per id and join the notes. They are: ca-food-and-drugs-act
# (status-c; keep the general title used here, because section 2 has its own entry ca-fda-s2-definitions),
# ca-cdsa and ca-pdl-human (status-b and status-c), ca-hc-recalls-database (status-b), ca-hc-cosmetic-drug-interface-guidance,
# ca-hc-cosmetic-ingredient-hotlist and ca-hc-2026-05-ghk-cu-bpc-157-api-recall (status-c). The first run had
# registered the last three, and the CDSA, PDL and recalls searches, under ids of its own; the second run renamed
# them so that no document has two ids.
#
# Seller rule (CONTENT-GUIDE §1): Health Canada advisories that name a seller, clinic, shop or brand in the title
