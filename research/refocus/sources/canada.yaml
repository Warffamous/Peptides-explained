  note: "Ottawa, July 2023 (date modified 2023-07-11); every paragraph cited here re-read by the second run. Para. 2: the CBSA 'may detain goods under the authority of the Customs Act and refer them to Health Canada for an admissibility recommendation and disposition decision'. Paras. 7, 9-10: Health Canada inspectors may examine, test, seize and sample detained goods, recommend admissibility and order disposition. Para. 26: commercial importations include shipments over a 90-day supply, a pattern of repeat personal importations totalling more than a 90-day supply in 90 days, and shipments with advertising material. Paras. 35, 41: C.01.045 restricts import of prescription drugs to practitioners, manufacturers, wholesale druggists, pharmacists and visitors. Para. 42: Health Canada 'may exercise enforcement discretion' to let a Canadian returning from abroad bring, on their person, a single course of treatment or a 90-day supply (whichever is less) of a prescription drug dispensed before leaving or obtained abroad for care while abroad. Para. 45: 'Canadian residents may not import prescription drugs by mail or courier.' Paras. 46-47: visitors may hand-carry, or receive by mail, a 90-day supply. Para. 50: anyone may import up to a 90-day supply of non-prescription drugs and natural health products every 90 days, in pharmacy or retail packaging or with the original label 'and no indication of sale in Canada, subject to inspector discretion'."

# ================================================================ Health Canada policy and guidance

ca-hc-gui-0116-personal-import:
  type: guideline
  authors: "Health Canada, Regulatory Operations and Enforcement Branch"
  title: "Bringing health products into Canada for personal use (GUI-0116)"
  container: "Canada.ca"
  year: 2020
  url: https://www.canada.ca/en/health-canada/services/drugs-health-products/compliance-enforcement/importation-exportation/personal-use-health-products-guidance/document.html
  accessed: 2026-10-23
  verified: url
  note: "Published 21 December 2020 (summary page, personal-use-health-products-guidance.html); the full document's page details show 2026-07-13. Re-read by the second run (exact wording checked). Personal use: for your own use or a person or animal 'under your care' or 'with whom you are travelling'; 'no more than a 90-day supply or a single course of treatment, whichever is less, based on the product's directions for use'; bringing a product in to sell or give it to someone not in your care, to treat a patient, to advertise its sale or to export it makes you a commercial importer: 'Each of these activities is considered a sale of a health product, regardless of whether there is an exchange of money'; multiple shipments totalling more than a 90-day supply 'over a 90-day period' may make you a commercial importer. 'Residents of Canada and visitors are permitted to bring into Canada a personal use quantity (a 90-day supply or single course of treatment) of an OTC medication, NHP, VHP or a medical device for personal use without requiring specific licences for the import.' Prescription drugs: 'Generally, residents of Canada are not allowed to bring prescription drugs into Canada for people or animals. This includes whether you carry them across the border or have them delivered by mail or courier.' They are 'only permitted to be imported by a practitioner, a drug manufacturer, a wholesale druggist, a registered pharmacist, or a resident of a foreign country while a visitor in Canada'. Health Canada may permit a personal quantity for residents returning with drugs prescribed and filled in Canada, residents continuing treatment started abroad, participants in foreign-sponsored clinical trials, and recently landed immigrants or refugees. (Correction by the second run: the first run's quotation 'Canadian residents are generally not permitted to import prescription drugs by mail or courier' is not the page's wording; the CBSA memorandum's para. 45 says 'Canadian residents may not import prescription drugs by mail or courier', see ca-cbsa-d19-9-1.) 'Individuals are responsible for knowing if the products being imported contain a prescription drug or a controlled substance.' Border: Health Canada works with the CBSA; officers 'may detain any health product they suspect does not comply' (Customs Act s. 101); non-compliant products 'will be refused entry or seized'; 'The assessment may include taking samples of the product for laboratory analysis'; Health Canada 'will notify you and the CBSA in writing of the outcome of the inspection'; it may recover expenses of storage, transport or disposal of seized goods (Act s. 30.7(1)) and 'is not responsible for any consequences including financial loss'. SAP: Canadian doctors may obtain drugs not available for sale in Canada for a serious or life-threatening condition when conventional therapies have been ruled out, failed, are unsuitable or unavailable. 'Health products sold online may be cheaper and easily purchased but riskier because they may be counterfeit', may contain the wrong level of an active ingredient or toxic substances, or be past their expiry date. The guide does not say how unauthorised drugs that are not on the Prescription Drug List (such as BPC-157) are treated, and does not mention 'research use' labels."

