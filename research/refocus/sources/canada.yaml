  note: "Health Canada document dated 2 June 2025, sent to provincial and territorial partners; the copy read is hosted by the Ontario College of Pharmacists (the Alberta College of Pharmacy reprinted the same text on 10 June 2025). 'some compounding pharmacies continue to prepare and sell injectable GLP-1 products in the absence of a shortage, which is not permitted'; 'compounding of sterile preparations is a high-risk activity and should only be considered in exceptional circumstances'; Health Canada 'is not aware of any scientific evidence' supporting semaglutide with pyridoxine; no GLP-1 shortage at the time; 'To date, Health Canada has not authorized any products containing chemically synthesized versions of GLP-1, including semaglutide, nor is there any recognized pharmacopeial standard for GLP-1 antagonists [sic], including semaglutide. Therefore, any GLP-1 active ingredient used in compounded products must be the same as that which is used in an authorized product (biologically derived, as determined by Health Canada) or listed in a recognized Pharmacopoeia'; 'outside of unique case-by case patient specific scenarios, Health Canada considers this activity to be manufacturing'; Health Canada 'is taking compliance and enforcement action when practitioners and pharmacists are engaged in activities that it considers to be manufacturing'; it requested the recall of two semaglutide and pyridoxine products made with an active ingredient 'not the same as that from an approved semaglutide product' (recall RA-76830, 21 January 2025). PDF re-read in full by the second run (pdftotext). CAUTION: the statement about synthetic semaglutide dates from June 2025; generic semaglutide products have been authorised since (ca-dpd-search-canada-legal-2026-10-23, ca-hc-2026-08-generic-semaglutide-recall). Do not repeat it as current without re-checking."

