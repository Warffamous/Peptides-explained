ca-hc-sap-drugs:
  type: regulator
  authors: "Health Canada"
  title: "Request a drug through the Special Access Program"
  container: "Canada.ca"
  year: 2026
  url: https://www.canada.ca/en/health-canada/services/drugs-health-products/special-access/drugs.html
  accessed: 2026-10-23
  verified: url
  note: "Page details 2026-04-08 (re-read by the second run). A health or dental practitioner may request a drug 'unavailable for sale in Canada' for 'the treatment of a medical emergency, which Health Canada interprets as a serious or life-threatening condition where conventional treatments: have failed, are unsuitable or are unavailable in Canada' (serious: need for hospitalisation, risk of adverse pregnancy outcomes, risk of persistent or significant disability, overall prognosis). The practitioner must inform patients of risks, benefits and development status, report results and adverse reactions, keep records, and 'ensure that the decision to prescribe the drug is supported by credible evidence available in relevant medical literature or provided by the manufacturer'. 'Drugs accessed through SAP are supplied directly by manufacturers to practitioners'; the manufacturer sets the cost (some drugs are free; costs may fall on hospitals, insurers or, in some cases, patients); a request is cancelled when 'the manufacturer is unable to provide access to the drug through SAP', and manufacturers may set conditions on release. 'The SAP receives about 1000 requests each month.' Health Canada will 'consider expediting' review of a drug previously authorised through SAP for the same emergency, or one authorised by the EMA or the FDA for the same medical emergency. The route therefore needs a manufacturer willing to supply: for a peptide that no company makes to medicine standards there is, in practice, nothing to request (inference; Health Canada does not say this)."

ca-hc-pol-0051-compounding:
  type: guideline
  authors: "Health Canada, Health Products and Food Branch Inspectorate"
  title: "Policy on Manufacturing and Compounding Drug Products in Canada (POL-0051)"
  container: "Canada.ca"
  year: 2009
  url: https://www.canada.ca/en/health-canada/services/drugs-health-products/compliance-enforcement/good-manufacturing-practices/guidance-documents/policy-manufacturing-compounding-drug-products.html
  accessed: 2026-10-23
  verified: url
  note: "Issued and implemented 26 January 2009 (supersedes GUI-0030; page details 2020-10-26). Compounding 'is practised primarily by pharmacists ... and is regulated by the respective regulatory authorities in each province/territory'; manufacturing is federal (DIN and/or NOC, establishment licence, GMP). Principles: compounding 'must not be used as a means to bypass the federal drug review and approval system'. Factors for compounding: a demonstrated patient-healthcare professional relationship; 'only ... if there is a therapeutic need or lack of product availability'; must not duplicate an approved product except during a shortage; no third-party resale; 'Product should be produced from an authorized drug or Active Pharmaceutical Ingredient (API) used in an authorized drug for use in Canada or listed in a recognized Pharmacopoeia (USP, PhEur, PhF, PhI, BP, CF, NF, Codex - Schedule B Food and Drugs Act.)'; sterile compounding is 'only permitted in hospitals or other practice settings' where the relevant standards are in place. Appendix I asks eight questions; answers pointing to manufacturing include no demonstrated patient relationship, resale to third parties, no provincial regulation or inspection, output beyond the prescription history or regular in volume, an identical commercially available product, and advertising to the general public. Compounders must comply with Act 'sections 3 - Prohibited advertising; 8 - Prohibited sales of drugs; 9 - Deception regarding drugs; and 11 - Unsanitary manufacture of drug'. 'this policy does not apply to natural health products (NHP)'. Re-read by the second run."

