# ================================================================ Food and Drugs Act (R.S.C., 1985, c. F-27)

# Same id and URL as status-c.yaml (which titles it after section 2); keep this general title on merge.
ca-food-and-drugs-act:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act (R.S.C., 1985, c. F-27)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/
  accessed: 2026-10-23
  verified: url
  note: "The full consolidated text (FullText.html, linked from this page), 'Act current to 2026-09-30 and last amended on 2025-03-27', read in full on 23 October 2026 and again by the second run. The main federal law on drugs, cosmetics, devices and food. Section-level entries below (ca-fda-s...) cite the provisions one by one. Amendments not in force (end of the text): none of them touches the provisions cited here except a repeal of s. 21.8(2), not yet in force (2023, c. 26, s. 502(2))."

ca-fda-s2-definitions:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 2 (definitions: advertisement, cosmetic, drug, sell, therapeutic product)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-2.html
  accessed: 2026-10-23
  verified: url
  note: "Drug: 'includes any substance or mixture of substances manufactured, sold or represented for use in (a) the diagnosis, treatment, mitigation or prevention of a disease, disorder or abnormal physical state, or its symptoms, in human beings or animals, (b) restoring, correcting or modifying organic functions in human beings or animals, or (c) disinfection ...'. Sell: 'includes (a) offer for sale, expose for sale or have in possession for sale - or distribute to one or more persons, whether or not the distribution is made for consideration'. Advertisement: 'any representation by any means whatever for the purpose of promoting directly or indirectly the sale or disposal of any food, drug, cosmetic or device'. Cosmetic: for use in 'cleansing, improving or altering the complexion, skin, hair or teeth'. Therapeutic product: 'a drug or device or any combination of drugs and devices'."

ca-fda-s3-advertising:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 3 (prohibited advertising and sale: Schedule A.1 diseases)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-3.html
  accessed: 2026-10-23
  verified: url
  note: "s. 3(1): 'No person shall advertise any food, drug, cosmetic or device to the general public as a treatment, preventative or cure for any of the diseases, disorders or abnormal physical states referred to in Schedule A.1.' s. 3(2): no person shall sell such a product if it is represented by label, or advertised by that person to the general public, as a treatment, preventative or cure for a Schedule A.1 condition. s. 3(3): advertising of contraceptives to the general public only as authorised by regulation. Last amended 2019, c. 29, s. 165."

ca-fda-schedule-a1:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, Schedule A.1 (section 3)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/page-10.html#h-234755
  accessed: 2026-10-23
  verified: url
  note: "The list of 29 conditions for section 3 (counted in the full text by the second run), including: acute alcoholism, acute anxiety state, acute psychotic conditions, addiction (except nicotine addiction), arteriosclerosis, asthma, cancer, congestive heart failure, dementia, depression, diabetes, hepatitis, hypertension, obesity, sexually transmitted diseases, thrombotic and embolic disorders, thyroid disease, ulcer of the gastro-intestinal tract. History line: 'R.S., 1985, c. F-27, Sch. A ... 2019, c. 29, s. 177': this list was Schedule A until 2019, when it was renumbered Schedule A.1. The present Schedule A (added by 2019, c. 29, s. 178) is a different thing: the product-classification schedule under s. 2.4, in four parts (food, drug, cosmetic, device), with no entries. Older texts that say 's. 3 and Schedule A' mean today's Schedule A.1."

ca-fda-s8-prohibited-sales:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 8 (prohibited sales of drugs: unsanitary conditions, adulteration)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-8.html
  accessed: 2026-10-23
  verified: url
  note: "'No person shall sell any drug that (a) was manufactured, prepared, preserved, packaged or stored under unsanitary conditions; or (b) is adulterated.' s. 2 defines unsanitary conditions as conditions that 'might contaminate with dirt or filth, or render injurious to health'. s. 11 (same Act) separately forbids manufacturing, preparing, preserving, packaging or storing any drug for sale under unsanitary conditions."

ca-fda-s9-deception:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 9 (false, misleading or deceptive labelling, sale or advertising of drugs)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-9.html
  accessed: 2026-10-23
  verified: url
  note: "s. 9(1): 'No person shall label, package, treat, process, sell or advertise any drug in a manner that is false, misleading or deceptive or is likely to create an erroneous impression regarding its character, value, quantity, composition, merit or safety.' s. 9(2): a drug not labelled or packaged as the regulations require is deemed to breach subsection (1)."

ca-fda-s16-cosmetics:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 16 (prohibited sales of cosmetics)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-16.html
  accessed: 2026-10-23
  verified: url
  note: "No person shall sell a cosmetic that (a) has in or on it any substance that may cause injury to the health of the user when used according to the directions or as customary, (b) contains filthy or decomposed substance or foreign matter, or (c) was made or stored under unsanitary conditions. This is the general prohibition the Cosmetic Ingredient Hotlist interprets."

ca-fda-s21-3-recalls:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 21.3 (Minister's power to require a recall of a therapeutic product)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-21.3.html
  accessed: 2026-10-23
  verified: url
  note: "s. 21.3(1): if the Minister believes a therapeutic product 'presents a serious or imminent risk of injury to health', the Minister may order a person who sells it to recall it or send it to a specified place. s. 21.3(3): no person shall sell a product the Minister has ordered recalled. Added 2014, c. 24, s. 3. s. 21.4(2): orders under ss. 21.1-21.33 must be made publicly available."

ca-fda-s21-5-injunction:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 21.5 (injunction for therapeutic products)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-21.5.html
  accessed: 2026-10-23
  verified: url
  note: "s. 21.5(1): on the Minister's application, a court may issue an injunction ordering a person who 'has done, is about to do or is likely to do anything that constitutes or is directed toward the commission of an offence under this Act in respect of a therapeutic product' to refrain from it, or to do anything that may prevent it. s. 21.5(2): 48 hours' notice unless urgency makes notice contrary to the public interest."

ca-fda-s21-8-hospital-reporting:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 21.8 (health care institutions to report serious adverse drug reactions)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-21.8.html
  accessed: 2026-10-23
  verified: url
  note: "s. 21.8(1): a prescribed health care institution shall provide the Minister, within the prescribed time and manner, with prescribed information in its control about a serious adverse drug reaction or medical device incident involving a therapeutic product. s. 21.8(2): for this purpose 'therapeutic product' excludes natural health products. The prescribed institutions are hospitals (Food and Drug Regulations C.01.020.1: see ca-fdr-c01-020-1-hospital-reporting)."

ca-fda-s23-inspection-seizure:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 23 (powers of inspectors, including seizure and detention)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-23.html
  accessed: 2026-10-23
  verified: url
  note: "s. 23(1): an inspector may enter any place, including a conveyance, where they believe on reasonable grounds a regulated activity is conducted or a regulated article is located. s. 23(2): they may examine, open packages, copy records, test, take samples, photograph, and (l) 'seize and detain for the time that may be necessary any article that the inspector believes on reasonable grounds is an article by means of, or in relation to which, any provision of this Act or the regulations has been contravened'. s. 23(3): entering includes remote access by telecommunication."

ca-fda-s27-1-unlawful-imports:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 27.1 (unlawful imports: removal from Canada or forfeiture)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-27.1.html
  accessed: 2026-10-23
  verified: url
  note: "s. 27.1(1): an inspector with reasonable grounds to believe an imported drug 'does not meet the requirements of the regulations or was imported in contravention of a provision of this Act or the regulations' decides whether to give the owner, importer or person in possession the opportunity to take a measure; s. 27.1(2): considering, among other factors, 'whether the ... drug ... presents a risk of injury to health or safety'; s. 27.1(4): the measure is removal from Canada at their expense, consent to forfeiture, or either; s. 27.1(5): on consent, it is forfeited and disposed of at the person's expense. Added 2016, c. 9, s. 6."

ca-fda-s27-2-removal-destruction:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 27.2 (notice to remove or destroy unlawful imports)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-27.2.html
  accessed: 2026-10-23
  verified: url
  note: "s. 27.2(1): an inspector may, by notice, whether or not the drug is seized, order the owner, importer or person in possession 'to remove it from Canada at their expense or, if removal is not possible, to destroy it at their expense'. s. 27.2(3): if not removed or destroyed within the period in the notice (or 90 days), it is forfeited and may be disposed of at that person's expense. s. 27.2(4)-(5): the inspector may suspend or cancel the notice if the product presents no risk of injury to health, will not be sold, and the import will be made compliant."

ca-fda-s27-3-measures:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 27.3 (Minister's power to require preventive and remedial measures)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-27.3.html
  accessed: 2026-10-23
  verified: url
  note: "s. 27.3(1): 'If the Minister has reasonable grounds to believe that a person has contravened, or is likely to contravene, this Act or the regulations, the Minister may order the person to take any measures that the Minister considers necessary to remedy the contravention or prevent it.' s. 27.3(2): the person shall take them. Added 2019, c. 29, s. 171. (Health Canada's statements describe a 'Ministerial Order' to stop advertising and selling; they do not name the section.)"

ca-fda-s29-1-prescription-drug-list:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 29.1 (the Prescription Drug List)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-29.1.html
  accessed: 2026-10-23
  verified: url
  note: "s. 29.1(1): 'Subject to the regulations, the Minister may establish a list that sets out prescription drugs, classes of prescription drugs or both.' s. 29.1(2): the list is not a regulation within the meaning of the Statutory Instruments Act. Added 2012, c. 19, s. 413."

ca-fda-s30-7-cost-recovery:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 30.7 (recovery of costs)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-30.7.html
  accessed: 2026-10-23
  verified: url
  note: "s. 30.7(1): the Crown may recover, as a debt, costs incurred in relation to anything required or authorised under the Act, 'including the inspection of a place or the analysis, examination, storage, movement, seizure, detention, forfeiture, disposal or release of an article'. s. 30.7(2): proceedings within five years."

ca-fda-s31-general-penalty:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 31 (general offence and punishment)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-31.html
  accessed: 2026-10-23
  verified: url
  note: "Subject to ss. 31.1, 31.2 and 31.4, contravening the Act or regulations is an offence: on summary conviction, first offence up to $500 or three months or both, subsequent offence up to $1,000 or six months or both; on indictment up to $5,000 or three years or both. For therapeutic products (drugs and devices) s. 31.2 applies instead."

ca-fda-s31-2-therapeutic-products-penalty:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 31.2 (offences relating to therapeutic products)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-31.2.html
  accessed: 2026-10-23
  verified: url
  note: "s. 31.2(1): a person who contravenes the Act or regulations as they relate to a therapeutic product, or an order under ss. 21.1-21.32, is liable (a) on conviction by indictment to a fine not exceeding $5,000,000 or imprisonment not exceeding two years or both; (b) on summary conviction, first offence up to $250,000 or six months or both, subsequent offence up to $500,000 or 18 months or both. s. 31.2(2) confirms it covers s. 3 (advertising) and s. 27.3(2) (measures orders) where a therapeutic product is involved. s. 31.3: due diligence is a defence (except under s. 31.4). s. 31.6: if a company (a 'person other than an individual') commits an offence under s. 31.2, its directors, officers or agents who direct, authorise, assent to, acquiesce or participate in it are parties to the offence. s. 31.7: each day is a separate offence. These are maximums the law allows, not what courts usually impose."

ca-fda-s31-4-serious-risk-penalty:
  type: law
  authors: "Government of Canada"
  title: "Food and Drugs Act, section 31.4 (offences: false statements and knowingly or recklessly causing serious risk)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/acts/f-27/section-31.4.html
  accessed: 2026-10-23
  verified: url
  note: "s. 31.4(1): a person who contravenes s. 21.6 (false or misleading statements to the Minister), or 'who knowingly or recklessly causes a serious risk of injury to human health' in contravening the Act or regulations as they relate to a therapeutic product, is liable (a) on indictment to a fine at the discretion of the court or imprisonment up to five years or both; (b) on summary conviction, first offence up to $500,000 or 18 months or both, subsequent offence up to $1,000,000 or two years or both. s. 31.5: sentencing must consider the harm or risk and 'the vulnerability of consumers of the therapeutic product'."

# ================================================================ Food and Drug Regulations (C.R.C., c. 870)
# The whole Regulations and the C.01.014 / C.08.002 rules: reuse ca-food-and-drug-regulations (status-b.yaml).

ca-fdr-a01-010-definitions:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section A.01.010 (definitions: manufacturer or distributor, prescription drug, Prescription Drug List)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-A.01.010.html
  accessed: 2026-10-23
  verified: url
  note: "Regulations current to 2026-09-30, last amended 2026-06-17. 'manufacturer or distributor means a person, including an association or partnership, who under their own name, or under a trade-, design or word mark, trade name or other name, word or mark controlled by them, sells a food or drug'. 'prescription drug means a drug that is set out in the Prescription Drug List, as amended from time to time, or a drug that is part of a class of drugs that is set out in it'. 'Prescription Drug List means the list established by the Minister under section 29.1 of the Act'."

ca-fdr-a01-040-import-for-sale:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section A.01.040 (imports of foods or drugs that may not lawfully be sold in Canada)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-A.01.040.html
  accessed: 2026-10-23
  verified: url
  note: "'Subject to section A.01.044, no person shall import into Canada for sale a food or drug the sale of which in Canada would constitute a violation of the Act or these Regulations.' The rule covers import for sale; A.01.044 lets an importer bring in a product for relabelling or modification after notifying an inspector. A.01.041-A.01.043 (same Part, read in the full text): an inspector may examine and sample any drug sought to be imported and, if its sale would breach the Act or Regulations, notifies the collector of customs and the importer in writing."

ca-fdr-a01-067-advertising-preventative:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, sections A.01.066 to A.01.068 (exemptions from section 3 of the Act for preventive claims)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-A.01.067.html
  accessed: 2026-10-23
  verified: url
  note: "A.01.067: 'A drug is exempt from subsection 3(1) of the Act with respect to its advertisement to the general public as a preventative, but not as a treatment or cure, for any of the diseases, disorders or abnormal physical states referred to in Schedule A.1 to the Act.' A.01.068: the same exemption from s. 3(2) for sale. A.01.066 (read in the full text): neither exemption applies to a prescription drug or to a drug in Schedules I-V of the Controlled Drugs and Substances Act. Amended SOR/2021-46."

ca-fdr-c01-041-rx-sale:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section C.01.041 (sale of prescription drugs)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-C.01.041.html
  accessed: 2026-10-23
  verified: url
  note: "C.01.041(1): 'No person shall sell a prescription drug unless (a) they are entitled under the laws of a province to dispense a prescription drug and they sell it in that province under a verbal or written prescription that they received; or (b) they sell it under section C.01.043' (sales to manufacturers, practitioners, wholesale druggists, pharmacists or governments). Practitioner (C.01.001): a person entitled under provincial law to treat patients with a prescription drug and practising in that province."

ca-fdr-c01-044-rx-advertising:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section C.01.044 (advertising prescription drugs to the general public)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-C.01.044.html
  accessed: 2026-10-23
  verified: url
  note: "'If a person advertises a prescription drug to the general public, the person shall not make any representation other than with respect to the brand name, the proper name, the common name and the price and quantity of the drug.'"

ca-fdr-c01-045-rx-import:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section C.01.045 (who may import a prescription drug)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-C.01.045.html
  accessed: 2026-10-23
  verified: url
  note: "'No person, other than one of the following, shall import a prescription drug: (a) a practitioner; (b) a drug manufacturer; (c) a wholesale druggist; (d) a pharmacist; or (e) a resident of a foreign country while a visitor in Canada.' Amended SOR/2013-122. A Canadian resident is not on the list; Health Canada's guidance (ca-hc-gui-0116-personal-import) describes the cases in which it may permit residents to bring in a personal quantity."

ca-fdr-c01a-002-compounding-import:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section C.01A.002 (activities exempt from establishment licensing, including import and compounding by pharmacists and practitioners)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-C.01A.002.html
  accessed: 2026-10-23
  verified: url
  note: "C.01A.002(1): Division 1A (establishment licences) does not apply to '(b) ... importing or compounding, pursuant to a prescription, a drug that is not commercially available in Canada by one of the following persons: (i) a pharmacist, (ii) a practitioner, and (iii) a person who compounds a drug under the supervision of a practitioner', nor (c) to drugs used only in an authorised clinical trial."

ca-fdr-c01a-004-establishment-licence:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section C.01A.004 (establishment licence required)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-C.01A.004.html
