# Written on 23 October 2026 (first run, interrupted) and checked again by a second run late on 23 October 2026
# Eastern Time (just after midnight, 24 October, on this machine's clock). The second run re-read every law page,
# every Health Canada, CBSA, Sport Integrity Canada, regulator and help-service page it could reach, corrected what
# was wrong, and marks in the note anything it could not re-read (see research/refocus/canada-legal.md, section 16,
# "Verification log"). Health Canada's databases (Drug Product Database, Licensed Natural Health Products Database,
# Notice of Compliance, Clinical Trials Database) were under maintenance during the re-check (construction.hres.ca),
# so the database records below are the first run's and say so.
#
# Reused, not re-registered here:
# - from src/data/sources: wada-2026-list-en, wada-2027-list-en (bpc-157.yaml), wada-code-2021, wada-code-2027
#   (legal-b.yaml).
# - from research/refocus/sources/status-b.yaml: ca-food-and-drug-regulations (C.01.014 DIN rule, C.08.002
#   new-drug rule), ca-hc-2026-04-think-twice-peptides (advisory RA-81874, re-read in full), ca-noc-egrifta,
#   ca-sbd-egrifta, ca-dpd-egrifta-din-02438712, ca-dpd-egrifta-din-02423677 (tesamorelin in Canada),
#   ca-dpd-search-status-b-2026-10-23, ca-noc-search-status-b-2026-10-23, ca-hc-ctdb-search-status-b-2026-10-23.
# - from research/refocus/sources/status-c.yaml: ca-dpd-search-status-c-2026-10-23, ca-noc-search-status-c-2026-10-23,
#   ca-hc-ctdb-search-status-c-2026-10-23 (bremelanotide, melanotan, BPC-157, TB-500, KPV, GHK-Cu).
