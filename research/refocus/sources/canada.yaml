  note: "News item of 18 February 2025 from Alberta's pharmacy regulator (re-read by the second run). After the January 2025 recall of compounded semaglutide made with an imported unauthorised API, it reminds pharmacies that to import an API without a drug establishment licence it must be 'not commercially available' in Canada (FDR C.01A.002(b)); Health Canada interprets that phrase to include discontinued or suspended drugs, drugs in shortage or back order, dormant, or approved but not marketed; other criteria are in POL-0051; APIs 'must be sourced from reliable and recognized sources'."

ca-cpsa-2026-04-injectable-peptides:
  type: regulator
  authors: "College of Physicians & Surgeons of Alberta"
  title: "Unauthorized injectable peptides and their potential serious health risks"
  container: "cpsa.ca (Messenger, April 2026)"
  year: 2026
  url: https://cpsa.ca/news/unauthorized-injectable-peptides-and-their-potential-serious-health-risks/
  accessed: 2026-10-23
  verified: url
  note: "Posted 9 April 2026 by Alberta's physician regulator (April 2026 Messenger; re-read by the second run). 'Injectable peptides are regulated as prescription medications in Canada, and while some peptide-based medications are authorized for specific medical indications, many products marketed online are experimental and unauthorized for human use'; products labelled 'for research use only' or 'not for human consumption' are 'presented in formats intended for injection'; 'For many experimental peptides, there is limited or no high-quality human clinical evidence'. Asks physicians to ask patients about non-prescribed injectables, watch for complications, check the DPD and LNHPD, counsel patients, advise return of unused products to a pharmacy for disposal, and report adverse events to Health Canada. Repeats Health Canada's list of identified products."

# ================================================================ Reporting side effects and complaints

ca-hc-medeffect-reporting:
  type: regulator
  authors: "Health Canada (MedEffect Canada)"
  title: "Report a side effect of a health product, drug or medical device"
  container: "Canada.ca"
  year: 2023
  url: https://www.canada.ca/en/health-canada/services/drugs-health-products/medeffect-canada/adverse-reaction-reporting.html
  accessed: 2026-10-23
  verified: url
  note: "Page details 2023-09-08. 'Anyone can report a side effect to a health or cannabis product'; report 'as soon as possible ... even if you are not sure if a particular health or cannabis product was the cause'; separate routes for drugs, medical devices, vaccines, natural health products, cannabis and veterinary drugs. A report helps detect a 'signal', which 'is not proof the ... product caused the adverse reaction'. The consumer page for drugs (adverse-reaction-reporting/drug/consumer.html, title 'Report a side effect to a drug: consumers', page details 2019-12-30): 'Everyone who witnesses or experiences a side effect (adverse reaction) to a drug is strongly encouraged to report it'; online (form on hpr-rps.hres.ca), by mail to a Canada Vigilance Regional Office, or with a health care provider ('doctor, nurse, pharmacist'). Health Canada's peptide advisories tell readers to report side effects to Health Canada. Both pages re-read by the second run."

ca-hc-canada-vigilance:
  type: regulator
  authors: "Health Canada"
  title: "Canada Vigilance Program"
  container: "Canada.ca"
  year: 2022
  url: https://www.canada.ca/en/health-canada/services/drugs-health-products/medeffect-canada/canada-vigilance-program.html
  accessed: 2026-10-23
  verified: url
  note: "Page details 2022-06-15 (the first run gave the year as 2026; corrected). 'The Canada Vigilance Program is Health Canada's post-market surveillance program'; it collects and assesses reports of suspected side effects of health products marketed in Canada (drugs, natural health products, biologics and others); 'The Canada Vigilance Program has collected reports of suspected adverse reactions since 1965'; health professionals and consumers report voluntarily, either directly to Health Canada or through the company that holds the market authorisation; 'seven Canada Vigilance Regional Offices'; reporting online, by phone, or by fax or mail; reports are searchable in the Canada Vigilance Online Database. Re-read by the second run (through WebFetch, which gives short excerpts; quotations are limited to those)."

ca-hc-complaints:
  type: regulator
  authors: "Health Canada, Regulatory Operations and Enforcement Branch"
  title: "Reporting complaints about health products"
  container: "Canada.ca"
  year: 2022
  url: https://www.canada.ca/en/health-canada/services/drugs-health-products/compliance-enforcement/problem-reporting/health-product-complaint-process-summary.html
  accessed: 2026-10-23
  verified: url
  note: "Page details 2022-07-12 (re-read by the second run). Health Canada's Regulatory Operations and Enforcement Branch handles complaints 'on a priority basis according to the risk to people's health and safety'. Examples include counterfeit products, 'unauthorized sale of health products', contamination, labelling errors and 'false, misleading or deceptive advertising of health products'. Online form for drugs and natural health products; asks for the product name, where it was advertised or obtained, licence or lot numbers, photos of labels, receipts and website links."

# ================================================================ Anti-doping (Sport Integrity Canada, formerly CCES)

ca-sic-our-brand:
  type: web
  authors: "Sport Integrity Canada"
  title: "Our Brand"
  container: "sportintegrity.ca"
  year: 2026
  url: https://sportintegrity.ca/our-brand
  accessed: 2026-10-23
  verified: url
  note: "'In November 2025, we announced our new name: Sport Integrity Canada.' 'For over 20 years, we've served as the country's anti-doping agency'; since 2025 it also runs the national safe sport programme, and it works on competition manipulation. The boilerplate of its 2026 releases reads 'Sport Integrity Canada, formerly the Canadian Centre for Ethics in Sport (CCES)' (ca-sic-2026-04-peptides-reminder). cces.ca redirects (HTTP 301) to sportintegrity.ca. Re-read by the second run."

ca-sic-cadp:
  type: regulator
  authors: "Sport Integrity Canada"
  title: "Canadian Anti-Doping Program"
  container: "sportintegrity.ca"
  year: 2026
  url: https://sportintegrity.ca/canadian-anti-doping-program
  accessed: 2026-10-23
  verified: url
  note: "Sport Integrity Canada 'implements and administers the Canadian Anti-Doping Program (CADP) on behalf of the Canadian sport community'. National and multi-sport organisations adopt the CADP (more than 70 so far); athletes, support personnel and others in those organisations 'accept the rules as a condition of participation in sport'. The CADP complies with the World Anti-Doping Code and International Standards. 'The current version of the CADP came into force on January 1, 2021'; 'The 2027 CADP and World Anti-Doping Code will come into effect on January 1, 2027.' Re-read by the second run."

ca-sic-2027-cadp:
  type: regulator
  authors: "Sport Integrity Canada"
  title: "Available Now: 2027 Canadian Anti-Doping Program (advisory note, 15 October 2026)"
  container: "sportintegrity.ca"
  year: 2026
  url: https://sportintegrity.ca/news/available-now-2027-canadian-anti-doping-program
  accessed: 2026-10-23
  verified: url
  note: "Ottawa, 15 October 2026: the 2027 CADP 'will come into effect on January 1, 2027', keeping it compliant with the World Anti-Doping Code; national sport organisations must adopt it by 31 December 2026 as a condition of Sport Canada funding. Changes include new whereabouts deadlines, an end to the Medical Review process for student-athletes (they must apply for a retroactive TUE after a positive test), and more flexible sanctions for substances of abuse and for athletes who did not apply for a TUE in advance."

ca-sic-2026-04-peptides-reminder:
  type: regulator
  authors: "Sport Integrity Canada"
  title: "Reminder: Non-Approved Peptides Included on the Prohibited List (advisory note, 27 April 2026)"
  container: "sportintegrity.ca"
  year: 2026
  url: https://sportintegrity.ca/news/reminder-non-approved-peptides-included-prohibited-list
  accessed: 2026-10-23
  verified: url
  note: "Ottawa, 27 April 2026: 'BPC-157 and other non-approved peptides are listed as prohibited substances on the World Anti-Doping Agency's (WADA) 2026 Prohibited List'; 'BPC-157 and other peptides are classified as S0: Non-approved substances ... As a result, the use, administration, trafficking or possession of these substances could result in an anti-doping rule violation under the Canadian Anti-Doping Program (CADP).' Sport Integrity Canada 'does not comment on the use of peptides for the general population'. Athletes can submit substance inquiries or use Global DRO. Prompted by a webinar hosted by a corporate sponsor of the Canadian Academy of Sport and Exercise Medicine. Re-read by the second run."

ca-sic-2025-04-bpc157-tb500-sanction:
  type: regulator
  authors: "Canadian Centre for Ethics in Sport (now Sport Integrity Canada)"
  title: "U SPORTS Volleyball Athlete Suspended for the Use of BPC-157 and TB-500 (media release, 7 April 2025)"
  container: "sportintegrity.ca"
  year: 2025
  url: https://sportintegrity.ca/news/u-sports-volleyball-athlete-suspended-use-bpc-157-and-tb-500
  accessed: 2026-10-23
  verified: url
  note: "Ottawa, 7 April 2025: a U SPORTS (university) volleyball athlete received a four-year sanction after information showed use, in August-September 2024, of 'BPC-157, a non-approved substance, and TB-500, a growth factor'; the athlete did not dispute it in time, so it was confirmed 'by way of a deemed waiver'; because a provisional suspension was imposed, the sanction ends on 3 December 2028; during it the athlete is ineligible to participate 'in any capacity' with any CADP or Code signatory, 'including training with teammates'; 'Under the CADP rules, the CCES makes public every anti-doping rule violation.' The case was built on information submitted to the CCES, not on a positive test as far as the release says. The release names the athlete and her university: name neither on the page. Re-read by the second run."

ca-sic-prohibited-list:
  type: web
  authors: "Sport Integrity Canada"
  title: "The Prohibited List"
  container: "sportintegrity.ca"
  year: 2026
  url: https://sportintegrity.ca/prohibited-list
  accessed: 2026-10-23
  verified: url
  note: "Re-read by the second run. The Prohibited List is WADA's international standard, updated each year with effect from 1 January (revisions published in October); it says which substances are prohibited in and out of competition and in particular sports. A substance is added if it meets two of three criteria: performance enhancement, health risk, violation of the spirit of sport. Athletes should check medications (Global DRO)."

