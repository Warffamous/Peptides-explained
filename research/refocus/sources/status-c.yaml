  note: "MHRA Products lists medicines with a UK licence (PL, PLGB, PLNI) and searches the text of their SmPCs and leaflets. Substance index (all active substances of licensed products), read on 23 October 2026: the only copper entries are COPPER, COPPER (64CU) CHLORIDE, COPPER CHLORIDE, COPPER CHLORIDE DIHYDRATE, COPPER GLUCONATE, CUPRIC CHLORIDE and TETRAKIS COPPER TETRAFLUOROBORATE (a radiopharmaceutical kit ingredient); there is no PREZATIDE, GHK or glycyl-histidyl entry, no BREMELANOTIDE, no BPC entry (the only 'BPC' strings are old British Pharmaceutical Codex product names such as 'BPC 1959'), no THYMOSIN or TB-500 and no KPV or melanotan; control AFAMELANOTIDE (SCENESSE 16 mg implant) is present. Product search: the website's search box adds fuzzy matching to every word (one-letter differences are accepted), which is why 'GHK' and 'GHK-Cu' appear to return hundreds of unrelated matches there; the first run did not read those lists. In the second run the same search service was queried with exact terms (and prefixes) instead: 0 documents for bremelanotide, bremelanotid*, vyleesi, prezatide, prezatide*, 'copper tripeptide', GHK, GHK*, GHK-Cu, melanotan*, thymosin*, 'BPC 157', BPC157, 'TB 500', TB500 and KPV ('tripeptide*' matched 11 unrelated SmPCs, e.g. mifamurtide, argatroban); control afamelanotide: 2 documents (the SCENESSE SmPC and leaflet). No UK-licensed medicine contains, or mentions, GHK-Cu, and none contains any other compound of this batch."

