au-poisons-standard-2026-10:
  type: law
  authors: "Commonwealth of Australia (Department of Health, Disability and Ageing)"
  title: "Therapeutic Goods (Poisons Standard - October 2026) Instrument 2026 (F2026L01327)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026L01327/latest/text
  accessed: 2026-10-23
  verified: url
  note: "Dated 28 September 2026; 'The whole of this instrument' commences 1 October 2026 (section 2). Full official HTML text (epub document_1.html) read and searched on 23 October 2026. Schedule 4 ('Prescription only medicines and prescription animal remedies'; 'Note 2: Substances marked # are listed in Appendix D') contains '# BPC-157.', 'MELANOTAN II.' (no #), '# TB-500.', '# THYMOSIN BETA 4 (THYMOSIN β4).' and 'AFAMELANOTIDE.'; index: 'MELANOTAN II, cross reference: α-MELANOCYTE STIMULATING HORMONE' and 'AFAMELANOTIDE, cross reference: MELANOCYTE STIMULATING HORMONE, MELANOTAN I'. Appendix D clause 5, 'Poisons for which possession without authority is illegal' ('for example, possession other than in accordance with a legal prescription'), lists item 5 BPC-157, item 38 TB-500 and item 39 THYMOSIN BETA 4 (THYMOSIN β4); melanotan II is not in Appendix D. Section 64(4): a poison in that table 'must not be possessed by a person without authority under the law of the jurisdiction in which the possession occurs'. The TB-500 entry gives no sequence or CAS number, so the instrument does not say which molecule it means; full-length thymosin beta-4 has its own entry. Not named anywhere (text searched): bremelanotide, PT-141, KPV, Lys-Pro-Val, GHK, prezatide, tripeptide, copper peptide, melanocortin; there is no entry for alpha-MSH or its fragments as such (only the two cross-references above). Schedule 4 also has 'COPPER COMPOUNDS for human use except: (a) when separately specified in these Schedules; or (b) in preparations for human internal use containing 5 mg or less of copper per recommended daily dose; or (c) in other preparations containing 5% or less of copper compounds', and Schedule 6 a matching 'COPPER COMPOUNDS except' entry; 'internal use' is defined to include parenteral administration for a systemic effect. The instrument does not say whether a copper-peptide complex such as GHK-Cu is a 'copper compound' for these entries. Reader's guide: the schedules are decisions 'as recommendations to Australian States and Territories' and 'The scheduling of poisons is implemented through relevant State and Territory legislation.'"

