  note: "Dated 5 February 2018; read on 23 October 2026 from the Internet Archive capture of 7 August 2022 of this tga.gov.au URL (the live page is no longer at that address). An applicant had asked for melanotan II to be put in Schedule 10 (substances whose supply and use are prohibited), citing its use as an injected 'lifestyle drug' for sunless tanning, appetite suppression and sexual stimulation and reported toxicity. The Advisory Committee on Medicines Scheduling instead recommended a new Schedule 4 entry, with effect from 1 June 2018, and the delegate's interim decision was Schedule 4. Reasons given include: 'There is no body of evidence demonstrating therapeutic benefits of melanotan II'; products of unknown quality with contamination and stability concerns (multi-dose vials); toxicity largely from case reports and regulators' reports, including renal dysfunction, rhabdomyolysis, changes in moles with one report of melanoma, posterior reversible encephalopathy syndrome and refractory priapism; dosing errors and infection risks; and supplier claims that it protects skin from sun damage. At the time melanotan II was not in any ARTG medicine. (The page also states a supposed dose; not for print.)"

