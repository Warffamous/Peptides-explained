# ================================================================ AUSTRALIA: import, supply and the TGA's statements

au-tg-regulations-1990-sch-5-item-1:
  type: law
  authors: "Commonwealth of Australia"
  title: "Therapeutic Goods Regulations 1990, Schedule 5 item 1 (personal importation) (compilation no. 131, 5 October 2026)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F1996B00406/latest/text
  accessed: 2026-10-23
  verified: url
  note: "Compilation no. 131, compilation date 5 October 2026, read from the official HTML text on 23 October 2026. Schedule 5 item 1 exempts from ARTG inclusion 'therapeutic goods that are imported for therapeutic use in the treatment of the importer or the importer's immediate family' where (a) they contain no substance whose import is prohibited under the Customs Act 1901; (c) for medicines, one importation is not more than 3 months' supply, not more than 15 months' supply in 12 months, and 'the medicine is in packaging that enables the medicine to be accurately identified'; and (d) 'in the case of goods that are subject to Schedule 4 or Schedule 8 to the current Poisons Standard - the goods are the subject of a written authority' issued by a medical practitioner (an overseas medical practitioner if carried by a passenger). So a Schedule 4 peptide (BPC-157, TB-500, thymosin beta-4, melanotan II) falls within the exemption only with a doctor's written authority. Item 6: medicines dispensed or extemporaneously compounded for a particular person are also exempt, except gene therapy, medicinal cannabis, GLP-1 receptor agonist analogues and nicotine pouches."

