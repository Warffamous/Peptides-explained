uk-cosmetic-products-reg-gb-art-2:
  type: law
  authors: "UK Parliament (assimilated law)"
  title: "Regulation (EC) No 1223/2009 on cosmetic products, Article 2 (definitions), as it applies in Great Britain"
  container: "legislation.gov.uk"
  year: 2026
  url: https://www.legislation.gov.uk/eur/2009/1223/article/2
  accessed: 2026-10-23
  verified: url
  note: "Read on 23 October 2026 (both runs; legislation.gov.uk publishes the UK version, as amended by the Product Safety and Metrology etc. (Amendment etc.) (EU Exit) Regulations 2019, SI 2019/696, Schedule 34). Article 2(1)(a): 'cosmetic product' means any substance or mixture intended to be placed in contact with the external parts of the human body (epidermis, hair system, nails, lips and external genital organs) or with the teeth and the mucous membranes of the oral cavity, with a view exclusively or mainly to cleaning them, perfuming them, changing their appearance, protecting them, keeping them in good condition or correcting body odours. Article 2(2): 'a substance or mixture intended to be ingested, inhaled, injected or implanted into the human body shall not be considered to be a cosmetic product.' In Northern Ireland the EU Regulation applies (eu-regulation-1223-2009-cosmetics), with the same wording."

uk-cosmetic-products-reg-gb-annexes:
  type: law
  authors: "UK Parliament (assimilated law)"
  title: "Regulation (EC) No 1223/2009 on cosmetic products, Annexes II to VI (prohibited, restricted and permitted substances), as they apply in Great Britain"
  container: "legislation.gov.uk"
  year: 2026
  url: https://www.legislation.gov.uk/eur/2009/1223/annex/II
  accessed: 2026-10-23
  verified: url
  note: "Annexes II (prohibited), III (restricted), IV (colorants), V (preservatives) and VI (UV filters) fetched from legislation.gov.uk and searched on 23 October 2026 (both runs) for copper, cupr-, tripeptide, GHK, prezatide and peptide: the copper entries are dyes, pigments and refinery substances in Annexes II and IV (e.g. copper phthalocyanines, CI 77400 copper); Annex III's only 'cupr-' matches are Cupressus (cypress) extracts and its only 'peptide' match concerns hydrolysed wheat protein; no annex names copper tripeptide-1, GHK or prezatide. So in Great Britain GHK-Cu is neither banned nor restricted as a cosmetic ingredient; as in the EU (cosing-copper-tripeptide-1) it may be used only within the general safety-assessment rules, and only in a product applied to the outside of the body (uk-cosmetic-products-reg-gb-art-2)."
