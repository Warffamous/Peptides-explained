page_facts: |
  CANADA
  - Retatrutide is not authorised in Canada: Health Canada's drug database has no retatrutide product, and no
    retatrutide submission is listed as under review. [ca-dpd-extract-search-status-a-2026-10-24, ca-hc-sur-search-status-a-2026-10-24]
  - It is being tested in Canada in Eli Lilly's clinical trials authorised by Health Canada: ten trials have had
    Canadian sites; one large phase 3 trial (in fatty liver disease, with tirzepatide and retatrutide arms) is
    recruiting, and five more are under way but no longer recruiting. [ca-ctgov-retatrutide-ca-au-2026-10-24,
    ca-hc-ctsp-retatrutide-2026-10-24, ctgov-nct07165028, ctgov-nct06383390]
  - Health Canada lists retatrutide among the unauthorised injectable peptides it has seized from sellers, and warns
    against injecting peptides bought online. [ca-hc-2026-04-think-twice-peptides, ca-hc-recalls-database]
  AUSTRALIA
  - Retatrutide is not on the Australian Register of Therapeutic Goods, and the TGA has no registration, evaluation or
    public assessment report for it. [au-artg-search-status-a-2026-10-24, au-tga-pmr-search-status-a-2026-10-24]
  - The TGA says retatrutide 'has not been approved by the TGA or any comparable international regulator' and that any
    retatrutide product used outside clinical trials 'could be a counterfeit product'. In September 2026 a vial sold as
    retatrutide, linked to a hospitalisation with a torn oesophagus, contained semaglutide and no retatrutide.
    [au-tga-2026-09-retatrutide-counterfeit]
  - The TGA treats retatrutide as a prescription-only medicine, and because it is unapproved it may not be advertised.
    [au-tga-advertising-glp1-prohibited]
  - Australian sites took part in four completed phase 3 trials, and two Lilly trials with Australian sites are still
    under way (one recruiting). [ca-ctgov-retatrutide-ca-au-2026-10-24, ctgov-nct07165028, ctgov-nct06383390]
  - Enforcement: the TGA lists retatrutide among unapproved peptides it is concerned about and seized retatrutide products
    with NSW Police in August 2026. [au-tga-2026-04-peptide-responsibilities, au-tga-2026-06-cmo-peptide-statement,
    au-tga-2026-08-peptide-seizure]
  UNITED KINGDOM (supplements the existing row)
  - NICE began scoping an appraisal of retatrutide for obesity in October 2026, ahead of any UK licence.
    [nice-id6644-retatrutide]
  - The MHRA says retatrutide 'has not been authorised for use in the UK' and that products sold as retatrutide outside
    trials are supplied illegally; it seized more than 12,000 fake retatrutide and tirzepatide pens in October 2026.
    [mhra-2026-10-counterfeit-pens, mhra-2026-05-largest-seizure]
  UNITED STATES (supplements the existing row)
  - The FDA has sent warning letters to online sellers of products labelled retatrutide 'for research use only', treating
    them as unapproved new drugs. [fda-warning-letters-index]
  - Eli Lilly says it plans to apply to the FDA in the first quarter of 2027. [sec-lilly-2026-q2-results]
factcheck: |
  INDEPENDENT FACT-CHECK, 24 October 2026 (this machine's clock; workflow date 23 October 2026). Per-source details
  are in the 'factcheck' notes of research/refocus/sources/status-a.yaml.
  Every "not authorised" search repeated with retatrutide, LY3437943 (and LY-3437943 in the DPD), plus brand-free
  variants; all empty as recorded:
  - CANADA: DPD extract (5 October 2026, marketed/approved/cancelled/dormant files, unzipped by script): no product;
    DHPP review decisions 'retatrutide' and 'LY3437943': 'Sorry your search returned no results'; submissions under
    review (89 new and 71 supplemental rows): none; PDL (human-use list re-read): not named; Health Canada's Canadian
    Clinical Trial Search Portal (new for this check): 10 trials, all Lilly, the same ten as ClinicalTrials.gov.
  - AUSTRALIA: ARTG 'retatrutide': 'There were no matching results' ('LY3437943': unrelated fuzzy matches only);
    prescription medicines registrations, under evaluation, AusPAR and section 19A: no result; Poisons Standard October
    2026 official text: 'RETATRUTIDE' appears nowhere; TGA site search: the same five pages; ANZCTR 'retatrutide' 7
    records and 'LY3437943' 6, all ClinicalTrials.gov records, no ACTRN.
  - UK: emc 'retatrutide' and 'LY3437943': no results; MHRA Products 'No results for RETATRUTIDE' (R index: no entry);
    GOV.UK MHRA search: 5 items, all enforcement (24 October 2025 to 15 October 2026); MHRA granted-licence lists 2021
    to 2026: no retatrutide licence.
  - ClinicalTrials.gov API: Canada 10, Australia 6, Ireland 0 (New Zealand 2), statuses and site counts as recorded;
    NCT07165028 is 'A Master Protocol of Multiple Agents in Adults With Metabolic Dysfunction-Associated Steatotic Liver
    Disease (SYNERGY-Outcomes)' with tirzepatide and retatrutide arms; NCT07629401 (expanded access) 'AVAILABLE', no
    locations.
  - Statements: TGA advertising page ('This includes derivatives of semaglutide or dulaglutide such as retatrutide';
    'For retatrutide, because it is an unapproved therapeutic good') and MHRA release of 15 October 2026 ('Retatrutide
    has not been authorised for use in the UK'; 'over 12,000 fake retatrutide and tirzepatide pens') re-read word for
    word; NICE ID6644 ('Selected' 15 September 2025; scoping commenced 5 October 2026; provisional consultation 5 to 29
    October 2026; expected publication 'TBC').
  Changed: CA row and page fact now cite ca-hc-ctsp-retatrutide-2026-10-24 (the trials are Health Canada-authorised);
  the writer's UNRESOLVED point about Health Canada's trial database is resolved.
  Still UNRESOLVED: whether retatrutide is in law a Schedule 4 'derivative' in Australia (only the TGA's advertising
  page says so; legal review before the page states 'S4' as settled law: the AU schedule entry is proposed, not
  proven); whether the 2024 compounding ban covers it; Special Access Program use in Canada (not published).
