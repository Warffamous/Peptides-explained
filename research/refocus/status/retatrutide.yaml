    [ca-dpd-extract-search-status-a-2026-10-24; the day before, the live API also found none: ca-dpd-search-canada-legal-2026-10-23]
  - Drug and Health Product Portal review decisions: 'retatrutide' and 'LY3437943' give no result.
    [ca-dhpp-review-search-status-a-2026-10-24]
  - Submissions under review (new and supplemental): no retatrutide entry (orforglipron and cagrilintide + semaglutide are
    listed). Weak evidence on its own, because the lists do not show every submission. [ca-hc-sur-search-status-a-2026-10-24]
  - Not on the Prescription Drug List (searched 23 October 2026 by canada-legal). [ca-pdl-human]
  - Trials with Canadian sites (ClinicalTrials.gov, 24 October 2026): 10, all Eli Lilly. Open: NCT07165028 (phase 3
