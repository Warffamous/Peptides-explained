notes: |
  Keep category authorised-nationally and national_authorisations (IT, IN, HK) exactly as in the data file: none of
  Canada, Australia or the UK has authorised thymalfasin, so the tile's 'Not approved in the US, the UK, Canada or
  Australia' is correct once these rows are added. Names searched: thymalfasin, thymosin alpha 1 / alpha-1 / alpha,
  thymosin, Zadaxin (brand), SciClone (maker; ARTG only). The abbreviations Tα1 / Ta1 / TA1 were not searched (too
  short for these search engines to give a usable answer).

  CANADA (Health Canada). Health Canada's databases were down for maintenance (HTTP 503) throughout this run.
  - DPD (canada-legal run, same day): no product for thymalfasin or Zadaxin (active ingredient and brand, all statuses,
    including cancelled). The brand-name search for 'Thymosin alpha' could not be completed (API 503): UNRESOLVED, but
    the INN search covers any product containing it. [ca-dpd-search-canada-legal-2026-10-23]
  - Prescription Drug List: no thymalfasin or thymosin entry. Not in the CDSA. [ca-pdl-human,
    ca-cdsa]
  - Trials: no thymalfasin / thymosin alpha 1 / Zadaxin record on ClinicalTrials.gov has a Canadian site (68 records,
    nearly all in China). [ctgov-search-status-d-2026-10-23, ca-ctgov-canada-peptide-search-2026-10-23]
  - Health Canada has listed thymosin alpha-1 among unauthorised injectable peptides seized from sellers and a clinic:
    RA-77218 (1 April 2025, a Calgary wellness clinic: 'Thymosin-α1 (TA1)'), RA-77807 (1 August 2025: 'Thymosin alpha')
    and RA-81403 (24 December 2025: 'Thymosin Alpha-1'). [ca-hc-recalls-search-status-d-2026-10-23]
  - Not established: whether the NOC database ever held a thymalfasin submission (not searched: down). Nothing suggests
    one; the DPD, which keeps cancelled products, has none.

  AUSTRALIA (TGA), 23 October 2026.
  - ARTG: no result for thymalfasin, zadaxin or "thymosin alpha"; 'thymosin' returns one unrelated product (a tamoxifen
    tablet); 'sciclone' only an unrelated device. [au-artg-search-status-d-2026-10-23]
  - Poisons Standard: thymosin alpha-1 is not named; the only thymosin entry is THYMOSIN BETA 4 (Schedule 4, Appendix D).
    [au-poisons-standard-2026-10]
  - ANZCTR: 0 records for thymalfasin, "thymosin alpha" and zadaxin. [au-anzctr-search-status-d-2026-10-23]
  - TGA website: "thymosin alpha" finds one media release, 'SGC Products fined $63,000 for alleged unlawful advertising
    on "Dr. Ageless" website in relation to COVID-19' (title names a company). UNRESOLVED: the page would not load
    (ERR_HTTP2_PROTOCOL_ERROR in the browser on three tries, curl connection failure, web fetch timeout) while other TGA
    pages loaded. A search-engine summary says the TGA issued five infringement notices totalling $63,000 for
