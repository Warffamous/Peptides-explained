page_facts: |
  - Thymosin alpha-1 (thymalfasin, brand Zadaxin) is not approved in Canada, Australia or the United Kingdom: no product
    is on Canada's Drug Product Database, the Australian Register of Therapeutic Goods or the MHRA's list of licensed
    medicines. [ca-dpd-search-canada-legal-2026-10-23, au-artg-search-status-d-2026-10-23, mhra-products-search-status-d-2026-10-23]
  - No trial of it is open in Canada, Australia or the UK: no ClinicalTrials.gov or ANZCTR record has a site in these
    countries. (Health Canada authorised one sepsis trial of the brand-name product in 2014, but it lists no Canadian
    site and is still marked 'not yet recruiting'.) [ctgov-search-status-d-2026-10-23,
    au-anzctr-search-status-d-2026-10-23, ca-hc-ctdb-search-status-d-2026-10-24]
  - Health Canada has listed thymosin alpha-1 among unauthorised injectable peptides seized from a clinic and from
    sellers (2025). [ca-hc-recalls-search-status-d-2026-10-23]
  - In Australia it is not named in the Poisons Standard (unlike thymosin beta-4), but it is not on the register, so
    importing or supplying it as a medicine is unlawful unless an exemption applies. [au-poisons-standard-2026-10,
    au-tga-2026-04-peptide-responsibilities]
  - In 2020 the TGA fined a company that advertised thymosin alpha-1 and thymosin beta-4 as a way to prevent COVID-19;
    the TGA said neither product was on the Australian register. [au-tga-search-status-d-2026-10-23]
  - It is approved by national regulators elsewhere (Italy, India, Hong Kong; see the data file), and those approvals do
    not apply in the reader's countries.
factcheck: |
  INDEPENDENT FACT-CHECK, 24 October 2026. Checked against the primary sources: ARTG (thymalfasin, zadaxin,
  "thymosin alpha": no result; 'thymosin': one unrelated tamoxifen tablet, ARTG 43527), the Poisons Standard (only
  THYMOSIN BETA 4, Schedule 4 and Appendix D item 39), ANZCTR (0 each), the TGA site search and the 2020 media release
  (now read), MHRA Products, GOV.UK, the Misuse of Drugs Act Schedule 2 (no thymosin or thymalfasin), ClinicalTrials.gov
  (68 records for each name, none with a site in CA, UK, AU, NZ or IE), openFDA (no record), the Health Canada
  advisories RA-77218, RA-77807 and RA-81403 (product names as quoted), the PDL and CDSA, and the FDA 2024 briefing
  (approvals in Italy, India and Hong Kong; UK wellness clinics). The three rows stay not-authorised; keep category
  and national_authorisations as in the data file.
  UK row SETTLED: the data file says the MHRA search 'was not settled', and us-uk-routes' fact-checker left three
  'Zadaxin' hits unexplained. Re-tested: quoted "zadaxin", "thymalfasin", "thymosin" and "thymosin alpha" all return
  'There are no search results'; the unquoted hits are fuzzy (one-letter-tolerance) matches, shown by 'tirzepatida'
  returning all 106 tirzepatide documents. No MHRA document contains the word Zadaxin; thymalfasin has no UK licence.
  CHANGED: (1) Canada: a Health Canada-approved 2014 Zadaxin sepsis trial (control number 174544, 'not yet recruiting',
  no Canadian site) was found in Health Canada's trial portal; added to the notes, and the page fact 'No trial of it is
  registered with a site in Canada' rewritten so it stays true. Status unchanged (not open, no site: not
  investigational). (2) Australia: the 2020 TGA infringement-notice release, UNRESOLVED in the draft, was read; facts
  added to au-tga-search-status-d-2026-10-23 and a page fact added (company not named). (3) Submissions under review
  checked (no thymalfasin).
  STILL UNRESOLVED: DPD brand search 'Thymosin alpha' and NOC search (Health Canada DPD/NOC still down on
  24 October 2026); whether the 2014 sepsis trial ever enrolled anyone in Canada (the portal lists no site).
