notes: |
  Names searched: TB-500, TB500, TB 500, Ac-LKKTETQ, thymosin beta-4 fragment 17-23 (data file), and, because sellers
  and some regulators use the name for the full protein, thymosin beta-4, thymosin, timbetasin (INN of thymosin
  beta-4) and the RegeneRx codes RGN-259, RGN-137, RGN-352.

  CANADA (Health Canada), searched 23 October 2026.
  - DPD API by active ingredient (all statuses): thymosin, 'thymos', 'thymosin beta', timbetasin, 'timbeta', 'TB-500':
    no product. NOC database: THYMOSIN, TIMBETASIN (ingredient) and TB-500 (product name): 'No result found!'.
    Submissions under review: none. [ca-dpd-search-status-c-2026-10-23, ca-noc-search-status-c-2026-10-23,
    ca-hc-sur-search-status-c-2026-10-23]
  - FDA's 2026 evaluation states 'There are no approved products containing TB-500 in Canada, Australia, the United
    Kingdom' (and seven EU countries). [fda-pcac-2026-tb500-briefing]
  - Trials: no TB-500 or thymosin beta-4 trial with a Canadian site (Health Canada portal, ClinicalTrials.gov). Not
    'investigational'. [ca-hc-ctdb-search-status-c-2026-10-23, ctgov-search-status-c-2026-10-23]
  - Prescription Drug List: not listed; not in the CDSA. Same UNRESOLVED point as BPC-157 on Health Canada's statement
    that peptides are 'generally regulated as prescription drugs'. [ca-pdl-human, ca-cdsa, ca-hc-2026-04-think-twice-peptides]
  - Enforcement: TB-500 is named in RA-81874 (April 2026) and in seizure advisories RA-77218, RA-77807, RA-81403 and
    RA-81404 (2025). Health Canada's own lists write 'Thymosin-β4 (TB4 or TB-500)' (RA-77218, RA-77807), list
    'Frag 17-23 of Thymosin-β4' separately (RA-77218, which has no plain 'TB-500' entry; FACT-CHECK 24 October 2026:
    corrected, the draft said it sat next to one), and use a plain 'TB-500' elsewhere (RA-81874, RA-81403, RA-81404;
    in RA-81404 one seized product's label adds 'Ac-LKKTETQ'), so its notices do not consistently separate the
    fragment from the full protein.
    [ca-hc-2026-04-think-twice-peptides, ca-hc-recalls-search-status-c-2026-10-23]
  - Sport: April 2025 four-year sanction of a university athlete for BPC-157 and TB-500 (Sport Integrity Canada).
    [ca-sic-2025-04-bpc157-tb500-sanction]

  AUSTRALIA (TGA), searched 23 October 2026.
  - ARTG: timbetasin: no matching results (repeated in the second run); thymosin: one unrelated tamoxifen product
    (both runs); '"TB-500"' and TB500: only unrelated devices and disinfectants (engine splits the term).
    [au-artg-search-status-c-2026-10-23]
  - TB-500 is one of the TGA's named examples of unapproved peptide products (April and June 2026).
    [au-tga-2026-04-peptide-responsibilities, au-tga-2026-06-cmo-peptide-statement]
  - AusPAR / under evaluation: nothing. ANZCTR: 0 records for TB-500; 11 'thymosin' records. FACT-CHECK (24 October
    2026): the draft said none tests thymosin beta-4, but two involve it as part of a dental bone-graft device (a
    synthetic thymosin beta-4 peptide chemically bonded to a polymer): ACTRN12617001279314 (tooth extraction, 10
    participants, 2017 to 2018, completed) and ACTRN12618000323224 (jaw surgery, withdrawn before enrolment). Neither
    tests TB-500 or a thymosin beta-4 medicine and neither is open; the other nine are unrelated. ClinicalTrials.gov:
    no Australian site. Not 'investigational'. [au-tga-search-status-c-2026-10-23,
    au-anzctr-search-status-c-2026-10-23, ctgov-search-status-c-2026-10-23]
  - Poisons Standard: '# TB-500.' and '# THYMOSIN BETA 4 (THYMOSIN β4).' in Schedule 4; Appendix D clause 5 items 38
    and 39. Both first appear in the June 2016 edition (in force 1 June 2016), absent from March 2016; present in every
    edition checked since (March and June 2018, February and June 2024, October 2026). The entry gives no sequence or
    CAS number, so it does not say which molecule 'TB-500' means; because thymosin beta-4 is scheduled separately in
    the same way, either reading is caught. PARTLY RESOLVED (fact-check, 24 October 2026): the TGA's October 2015 scheduling
    consultation proposed the new Schedule 4 and Appendix D entries for thymosin beta-4 and TB-500 'to control the
    manner in which they are advertised, sold and accessed without legitimate purpose'. UNRESOLVED: the delegate's
    2016 decision reasons are still unread (the decision documents were not found). [au-poisons-standard-2026-10,
    au-poisons-standard-2016-06, au-poisons-standard-2016-03, au-tga-search-status-c-2026-10-23,
    au-tga-2015-10-tb500-scheduling-consultation]
  - Import: Schedule 4, so personal importation needs a doctor's written authority; not in the Customs (Prohibited
    Imports) Regulations. [au-tg-regulations-1990-sch-5-item-1, au-customs-prohibited-imports-regs]
  - Enforcement: the August 2026 NSW seizure included a combination product of BPC-157 and TB-500.
    [au-tga-2026-08-peptide-seizure]

  UNITED KINGDOM (re-check; existing row stands): MHRA substance index has no THYMOSIN or TB-500 entry; exact-term
  searches thymosin*, '"TB 500"' (as a phrase) and TB500: 0 documents (an unquoted TB-500 matches hundreds of
  unrelated documents containing 'TB' and '500', such as tuberculosis medicines in 500 mg strengths). FDA also states
  no approved TB-500 product in the UK.
  [uk-mhra-substance-index-status-c-2026-10-23, fda-pcac-2026-tb500-briefing]
  FACT-CHECK (24 October 2026): substance index re-read (no THYMOSIN, TB-500 or TIMBETASIN entry). The exact-term
  results above come from the second run's direct queries of the search service; through the public search box,
  timbetasin gives 'no search results', TB500 4 fuzzy matches and thymosin 1 hidden match (not identified: the site
  asks the reader to tick a disclaimer, which the fact-checker did not do). Addition: the Home Office forensic early
  warning system found 'Thymosin Beta 4' once in samples from the Border Force collection in 2017 to 2018 and classed
  it 'Not controlled' under the Misuse of Drugs Act 1971; its 2018-19 to 2021-22 reports do not name it.
  [uk-home-office-fews-2017-18]

  UNITED STATES: no new research in this batch.
  Ireland and New Zealand: not searched here, except ClinicalTrials.gov: no trial in either.
page_facts: |
  CANADA
  - No product containing TB-500 or thymosin beta-4 has ever been authorised in Canada. [ca-dpd-search-status-c-2026-10-23,
    ca-noc-search-status-c-2026-10-23, fda-pcac-2026-tb500-briefing]
  - Health Canada lists TB-500 among unauthorised injectable peptides it has seized; some of its notices write
    'Thymosin-β4 (TB4 or TB-500)', using TB-500 as another name for the full protein. [ca-hc-2026-04-think-twice-peptides,
    ca-hc-recalls-search-status-c-2026-10-23]
  AUSTRALIA
  - Not on the Australian Register of Therapeutic Goods. [au-artg-search-status-c-2026-10-23, fda-pcac-2026-tb500-briefing]
  - TB-500 and thymosin beta-4 have both been prescription-only medicines (Schedule 4) since 1 June 2016, and possessing
    either without authority, such as a prescription, is illegal (Appendix D, given effect by state and territory law).
    [au-poisons-standard-2026-10, au-poisons-standard-2016-06]
  - The TGA proposed these entries in October 2015 'to control the manner in which they are advertised, sold and
    accessed without legitimate purpose'. [au-tga-2015-10-tb500-scheduling-consultation]
  - The TGA names TB-500 as an example of unapproved peptide products, and a combination product of BPC-157 and TB-500
    was among products seized in New South Wales in August 2026. [au-tga-2026-04-peptide-responsibilities, au-tga-2026-08-peptide-seizure]
  UNITED KINGDOM
  - No product containing TB-500 or thymosin beta-4 has a UK licence. [uk-mhra-substance-index-status-c-2026-10-23, fda-pcac-2026-tb500-briefing]
  - Optional: a Home Office drug early-warning report found thymosin beta-4 once in UK Border Force samples in 2017 to
    2018 and classed it as not controlled under the Misuse of Drugs Act 1971. [uk-home-office-fews-2017-18]
factcheck: |
  INDEPENDENT FACT-CHECK, 24 October 2026.
  Method: every source cited in this file was reopened on 24 October 2026 and every not-found search repeated
  with the recorded terms plus synonyms (details and per-source corrections in the factcheck block and the
  FACT-CHECK notes of research/refocus/sources/status-c.yaml). Canada's DPD, NOC and LNHPD were still on the
  maintenance page, so the DPD was checked through Health Canada's DPD data extracts (marketed, approved, dormant and
  inactive files, page of 15 October 2026) instead; the NOC database could not be re-checked.
  Checked, no change needed: both rows; the AU schedule (TB-500 and thymosin beta-4 in Schedule 4 and Appendix D
  clause 5 items 38 and 39 of the October 2026 edition; both first in June 2016, absent from March 2016, present in
  March and June 2018 and February and June 2024); the FDA briefing quotation ('no approved products containing TB-500
  in Canada, Australia, the United Kingdom'); RA-81874; the TGA April and June 2026 notices and the August 2026 seizure
  release; PDL and CDSA. Not-found searches repeated with the same result: ARTG (timbetasin, "thymosin beta" (new):
  no matching results; thymosin: one tamoxifen product), ANZCTR (TB-500: 0), ClinicalTrials.gov (0 in all five
  countries; full-text "thymosin beta 4" also 0), Health Canada's trial portal (thymosin, TB-500, timbetasin: 0), DPD
  data extracts (no thymosin, timbetasin, TB-500 or LKKTETQ ingredient), MHRA substance index.
  Changed: (1) RA-77218 has no plain 'TB-500' entry (Canada notes); (2) two ANZCTR records do involve thymosin beta-4
  (a dental bone-graft device; completed or withdrawn, so the status is unchanged); (3) the October 2015 TGA
  consultation now gives the stated purpose of the 2016 scheduling (new source); (4) optional UK fact from the Home
  Office FEWS 2017-18 report (reused id from status-d.yaml).
  Still UNRESOLVED: the delegate's 2016 reasons; what the Poisons Standard's 'TB-500' entry means chemically.
