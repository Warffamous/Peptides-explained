notes: |
  Names searched: MOTS-c, MOTs-C, MOTS, 'mitochondrial open reading frame of the 12S rRNA-c' / '12S rRNA', and the
  company analogue CB4211 (a different molecule; searched only to rule out trials).

  CANADA (Health Canada). Health Canada's databases were down for maintenance (HTTP 503) throughout this run.
  - DPD (canada-legal run, same day): no product for 'MOTS' (active ingredient and brand, all statuses).
    [ca-dpd-search-canada-legal-2026-10-23]
  - Prescription Drug List: no entry ('MOTS'). Not in the CDSA. [ca-pdl-human,
    ca-cdsa]
  - Trials: no ClinicalTrials.gov record giving MOTS-c or CB4211 has a Canadian site (the one MOTS-c trial,
    NCT07505745, is in China; CB4211's NCT03998514 was in the US). [ctgov-search-status-d-2026-10-23,
    ca-ctgov-canada-peptide-search-2026-10-23, ctgov-nct07505745, ctgov-nct03998514]
  - Health Canada's Canadian Clinical Trial Search Portal (fact-checker, 24 October 2026): no trial for MOTS-c or
    CB4211 ('MOTS' finds one unrelated gastroparesis trial). [ca-hc-ctdb-search-status-d-2026-10-24]
  - Health Canada named MOTS-c in RA-77218 (1 April 2025, Calgary wellness clinic: 'Mots-C'), RA-81403 (24 December
    2025: 'MOTS-C') and the 'think twice' advisory RA-81874 (9 April 2026). [ca-hc-recalls-search-status-d-2026-10-23,
    ca-hc-2026-04-think-twice-peptides]

  AUSTRALIA (TGA), 23 October 2026.
  - ARTG: 'MOTS-c', '"MOTS-c"' and 'MOTS' return only unrelated fragment matches (wrist implants, wheelchairs,
    sunscreens); '"12S rRNA"': none. No entry. [au-artg-search-status-d-2026-10-23]
  - TGA website: no page names MOTS-c (23 unrelated fragment matches). [au-tga-search-status-d-2026-10-23]
  - Poisons Standard: not named (so not scheduled). [au-poisons-standard-2026-10]
  - ANZCTR: 0 records for MOTS-c and CB4211. [au-anzctr-search-status-d-2026-10-23]

  UNITED KINGDOM.
  - MHRA Products, 23 October 2026: "MOTS-c" (exact) no results; the M index has no MOTS-C entry. No UK licence.
    [mhra-products-search-status-d-2026-10-23]
  - GOV.UK: only unrelated results (MOT tests). Not a controlled drug (Misuse of Drugs Act; legal-b searched MOTS-c).
    No trial with a UK site. [uk-govuk-search-status-d-2026-10-23, uk-mda-1971-sch-2, ctgov-search-status-d-2026-10-23]

  IRELAND / NEW ZEALAND: no ClinicalTrials.gov record with a site in either; registers not searched.
page_facts: |
  - MOTS-c is not approved in Canada, Australia or the UK: no product is on Canada's Drug Product Database, the
    Australian Register of Therapeutic Goods or the MHRA's list of licensed medicines, and no trial of it is registered
    in these countries. [ca-dpd-search-canada-legal-2026-10-23, au-artg-search-status-d-2026-10-23,
    mhra-products-search-status-d-2026-10-23, ctgov-search-status-d-2026-10-23]
  - Health Canada has listed MOTS-c among unauthorised injectable peptides seized from a clinic and from sellers (2025),
    and named it in its April 2026 warning about peptides bought online. [ca-hc-recalls-search-status-d-2026-10-23,
    ca-hc-2026-04-think-twice-peptides]
  - In Australia MOTS-c is not named in the Poisons Standard, but it is not on the register, so importing, supplying or
    advertising it as a therapeutic product is unlawful unless an exemption applies; the TGA made unapproved peptides a
    compliance priority in June 2026. [au-poisons-standard-2026-10, au-tga-2026-04-peptide-responsibilities,
    au-tga-2026-06-peptide-compliance-priority]
