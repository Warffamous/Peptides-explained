  NCT01579695 (asked): the primary outcome is cancer, measured as time to event. Registry wording: 'Time to
  development of malignancies in HIV-infected subjects with abdominal lipohypertrophy exposed to EGRIFTA vs.
  concurrent, comparable control group not exposed to EGRIFTA', time frame 10 years. Secondary: time to development
  or worsening of type 2 diabetes, diabetic retinopathy, hypersensitivity, liver and kidney function, adverse events
  and MACE. Phase 4 observational cohort ('10-year Prospective Cohort Safety Study'), sponsor Theratechnologies,
  391 enrolled, started February 2013, primary completion May 2018, study completion August 2018, terminated, no
  reason given, no results posted, all 31 sites in the US (API v2, read twice on 23 October 2026). So 'cancer
  incidence' is close but not exact: write 'time to a cancer diagnosis' or 'how soon cancers appeared'. The existing
  ctgov-nct01579695 note ('primary outcome: time to malignancy') is correct. Note the mismatch: Health Canada's SBD
  describes this study as 'intended to monitor cardiovascular safety' (MACE is only secondary in the registry).
  [ctgov-nct01579695, ca-sbd-egrifta]

  Ireland and New Zealand: not searched (outside this batch).
page_facts: |
  CANADA
  - Health Canada approved Egrifta (tesamorelin) on 29 April 2014 (Notice of Compliance, 2 mg vial) and a 1 mg vial
    on 27 March 2015. [ca-noc-egrifta, ca-sbd-egrifta]
  - Approval came after an initial negative decision: Health Canada first issued a notice of non-compliance and then,
    on 1 March 2013, a notice of non-compliance-withdrawal (concerns about benefit-risk, the indication and raised
    IGF-1). At the company's request an external expert panel reconsidered the file on 23 August 2013. [ca-sbd-egrifta]
  - In Canada, doctors had to stop treatment if IGF-1 stayed above the normal range (SDS above 2) after 26 weeks, a
    stricter limit than the US label (above 3). [ca-sbd-egrifta, ca-pm-egrifta-2015]
  - Only the 1 mg vial was ever sold, from 23 June 2015. The company stopped selling it on 30 September 2022 for
    business reasons, and Health Canada cancelled its drug identification number (DIN); the never-sold 2 mg DIN was
    cancelled on 13 July 2023. Both cancellations followed the company's own notice that it had stopped selling, not
    a safety action. [ca-dsc-egrifta-discontinuation-170025, ca-sbd-egrifta, ca-dpd-egrifta-din-02438712,
    ca-dpd-egrifta-din-02423677, ca-food-and-drug-regulations]
  - Since 13 July 2023 no tesamorelin product has a DIN in Canada, so none may be sold there by a manufacturer.
    [ca-dpd-search-status-b-2026-10-23, ca-dpd-extract-search-status-b-2026-10-23, ca-food-and-drug-regulations]
  - Tesamorelin is on Canada's Prescription Drug List (since 25 April 2014). [ca-pdl-human]
  - Health Canada has listed products sold as 'tesamorelin' among unauthorised injectable peptides seized from
    sellers (advisories of 1 August 2025 and 24 December 2025). [ca-hc-recalls-database]
  - No tesamorelin trial has been authorised in Canada since April 2013 (Health Canada's clinical trial records,
    now the Canadian Clinical Trial Search Portal). [ca-hc-ctdb-search-status-b-2026-10-23]
  AUSTRALIA
  - No tesamorelin product is on the Australian Register of Therapeutic Goods, and the TGA's website records no
    Australian registration, evaluation or application (as of 23 October 2026). [au-artg-search-status-b-2026-10-23,
    au-tga-search-status-b-2026-10-23]
  - The Poisons Standard does not name tesamorelin. Its group entry for growth hormone releasing hormones is
    prescription only (Schedule 4), and possession without a prescription is illegal (Appendix D). Whether that entry
    covers tesamorelin is our reading, pending legal review. [au-poisons-standard-2026-10, au-tga-2014-09-scheduling-consultation]
  - Importing growth hormone releasing hormones and their synthetic analogues needs a permit from the Office of Drug
    Control (same caveat for tesamorelin). [au-customs-prohibited-imports-regs, au-odc-growth-hormones-import-permit]
  UNITED KINGDOM
  - No tesamorelin product has a UK licence (MHRA products database, 23 October 2026). [mhra-products-search-tesamorelin,
    mhra-products-search-cjc-1295-ipamorelin]
  - The application for an EU-wide licence, which would also have covered the UK (then an EU member), was withdrawn
    in June 2012; the EU's medicines committee's provisional view was that it could not be approved (doubts about a
    meaningful health benefit, raised IGF-1, no long-term safety data). [ema-egrifta-withdrawal,
    ie-hpra-licensing-procedures, uk-euwa-2018-s20-exit-day]
  UNITED STATES
  - On 24 August 2026 the FDA sent warning letters to five online sellers that listed products called 'tesamorelin'
    as unapproved new drugs, although Egrifta itself is approved. [fda-warning-letters-index]
  TRIAL NCT01579695
  - The FDA-required 10-year safety study measured how soon cancers appeared in people using Egrifta compared with
    similar people not using it; it enrolled 391 people, was stopped in 2018 with no reason given, and posted no
    results. [ctgov-nct01579695, fda-2010-egrifta-approval-letter]
factcheck: |
  INDEPENDENT FACT-CHECK, 24 October 2026 (this machine's clock; workflow date 23 October 2026).
  Checked against the primary sources (method and per-source results in the 'factcheck' notes of
  research/refocus/sources/status-b.yaml):
  - CANADA. DPD (via Health Canada's DPD extract dated 5 October 2026, because the API answers HTTP 503 and the
    pages redirect to a maintenance page), NOC (via the NOC extract dated 23 October 2026), SBD00185 with its PAAT,
    the 2015 product monograph, the archived Drug Shortages Canada report 170025, the Food and Drug Regulations
    (current to 2026-09-30), the PDL, the CDSA and the recall advisories: every date, DIN, NOC number, lot, expiry,
    section and quotation in the rows, product, notes and page facts holds. NOC 15555 (29 April 2014), NOC 16731
    (27 March 2015), first sale 23 June 2015, DIN 02438712 cancelled post-market 30 September 2022 (lot P012329,
    expiry 31 January 2023), DIN 02423677 cancelled pre-market 13 July 2023, both under C.01.014.6(1)(a);
    'Business reasons' in the company's report. The 'discontinued' row and the CA product are supported.
  - AUSTRALIA. ARTG, AusPAR, medicines under evaluation, registrations, site search, ANZCTR, the October 2026, June
    2015 and February 2015 Poisons Standards, Customs Schedule 7A and the ODC entry: all confirmed; 'somatoliberin'
    added to the ARTG search (none). The AU 'not-authorised' row holds.
  - UK. MHRA Products (tesamorelin, egrifta, TH9507, somatoliberin; T index), GOV.UK, the EMA withdrawal page, EUWA
    s. 20: confirmed. US: Drugs@FDA via openFDA (products 001 1 mg and 002 2 mg, both 'Prescription'; S-020 approved
    25 March 2025): confirmed. NCT01579695 (API v2): primary outcome 'Time to development of malignancies ...', 10
    years; 391 actual; February 2013 to May 2018 (primary completion) and August 2018; terminated, no reason; no
    results; 31 sites, all US. So the primary outcome is time to a cancer diagnosis, not cancer incidence as such.
  Changed:
  - Notes: C.01.014.6(2) described more exactly, adding (3); Customs reg. 5G permission is from 'the Secretary or an
    authorised person'; the trials note now says the Clinical Trials Database was replaced by the Canadian Clinical
    Trial Search Portal on 29 July 2026 (repeated there: no result) and gives the dates of the three Canadian-site
    trials (all before 2013).
  - FDA warning letters: a fifth letter of 24 August 2026 (733652) also names tesamorelin and a tesamorelin-ipamorelin
    blend; 'four online sellers' corrected to 'five' in the page fact.
  - UK: 'the only European application' and 'no UK application ... ever existed' were not supported by any source
    (the MHRA database lists licences, not applications); reworded to 'the application for an EU-wide licence'.
  - 'FDA-required' (NCT01579695 page fact) is not in the registry record; added fda-2010-egrifta-approval-letter
    (postmarketing requirement 1708-2, 'A long-term observational safety study of at least 10 years duration',
    checked in the letter PDF).
  - Page fact on Canadian trials: 'since 2013 (Health Canada's trial database)' changed to 'since April 2013 (...
    now the Canadian Clinical Trial Search Portal)'.
  Still UNRESOLVED:
  - The CA row's 'since' date. The writer used 13 July 2023 (last DIN cancelled); the product's marketed_until is
    30 September 2022, and the vocabulary comment in src/schemas/vocab.ts says 'tesamorelin in Canada: approved 2014,
    cancelled 2022'. Both dates are verified; an editor must choose one rule and apply it to every discontinued row.
  - AU schedule for tesamorelin (not named; GHRH group entry is our reading; legal review), as the writer said.
  - Whether Egrifta stock was dispensed after 30 September 2022, and Special Access Program use: not searchable.
  - The live Drug Shortages Canada page (bot check) and the Health Canada DPD/NOC links (maintenance) could not be
    opened on 24 October 2026; re-test before publishing.
