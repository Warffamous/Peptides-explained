  - Context the English site would otherwise lose when the EU row goes: the only European application, an EU-wide
    (central procedure) application by Ferrer Internacional S.A., was withdrawn on 21 June 2012
    after the EU medicines committee's provisional view that it could not be approved. The UK was an EU member then
