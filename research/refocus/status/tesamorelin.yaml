    Canadian patients through the Special Access Program was not searched.

  AUSTRALIA (TGA), searched 23 October 2026 in a browser.
  - ARTG: no result for 'tesamorelin', 'egrifta' or the sponsor 'theratechnologies'; 'TH9507' gave only unrelated
    fragment matches (vitamin D3 products, devices). Control 'somatropin': 30 results. The public ARTG search shows
    only goods that 'can be supplied' now: a test search for rofecoxib (withdrawn in 2004) also returns nothing. So
    the ARTG search proves 'not on the ARTG today', not 'never'. [au-artg-search-status-b-2026-10-23]
  - AusPAR: no 'tesamorelin' report. Prescription medicines under evaluation: none (control semaglutide: 1).
    Prescription medicines registrations database: none (control semaglutide: 8, earliest Ozempic 15 August 2019).
    Whole-site search 'tesamorelin': no result at all. So the TGA's website records no registration, evaluation or
    pending application; the page may say 'not approved in Australia, and the TGA has no record of an application',
    but should not say 'never'. [au-tga-search-status-b-2026-10-23]
  - ANZCTR: 0 records for tesamorelin or Egrifta; ClinicalTrials.gov: no tesamorelin record with an Australian site.
    [au-anzctr-search-status-b-2026-10-23, ctgov-search-status-b-2026-10-23]
  - Poisons Standard (October 2026 edition, F2026L01327, current): tesamorelin is NOT named. The group entry
    '# GROWTH HORMONE RELEASING HORMONES* (GHRHs)' is in Schedule 4 and in Appendix D clause 5 (item 18, 'including
    those separately specified in Schedule 4'): possession without authority is illegal. The 2014 proposal that
    created it was worded 'Growth Hormone Releasing Hormones and Analogues'. The Reader's guide says a poison not found
    under its own name 'may be shown under a group term', including 'a pharmacological group', and that an entry covers
    all salts and derivatives. Tesamorelin is human GHRH(1-44) with a hexenoyl group, so on our reading it falls under
    that entry, from 1 June 2015 (first edition with the entry).
    UNRESOLVED: no TGA document names tesamorelin, so 'S4' is our interpretation; a legal reviewer should confirm
    before the page states it as fact. For that reason no AU schedule field is proposed above.
    [au-poisons-standard-2026-10, au-poisons-standard-2015-06, au-tga-2014-09-scheduling-consultation]
  - Import: Customs (Prohibited Imports) Regulations 1956, reg 5G and Schedule 7A item 4: importing 'growth hormone
    releasing hormones (somatorelin and synthetic analogues)' needs a written permission from the Secretary of the
    Health Department or an authorised person, handled by the Office of Drug Control (ODC lists 'import permit
    required: yes'; its list has no entry under the name tesamorelin). Tesamorelin is a synthetic analogue of somatorelin, so this appears
    to apply; same caveat (no document names it). [au-customs-prohibited-imports-regs,
    au-odc-growth-hormones-import-permit]

