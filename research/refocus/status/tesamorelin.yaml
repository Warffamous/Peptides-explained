    Market' on 2022-09-30, first marketed 2015-06-23, last lot P012329 with expiry 2023-01-31. Both: kit + powder for
    solution, subcutaneous, schedule Prescription, ATC H01AC06, product monograph dated 2015-03-26, RMP submitted.
    By brand: 'egrifta' gives the same two; 'egrifta sv' and 'egrifta wr' give none (neither US product was ever
    filed or authorised in Canada as far as the DPD and NOC databases show). [ca-dpd-search-status-b-2026-10-23,
    ca-dpd-egrifta-din-02438712, ca-dpd-egrifta-din-02423677]
