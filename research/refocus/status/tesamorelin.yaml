  - { id: egrifta-ca, name: Egrifta, holder: Theratechnologies Inc., jurisdiction: CA, authorised: 2014-04-29, marketed_until: 2022-09-30, route: subcutaneous, label_url: "https://pdf.hres.ca/dpd_pm/00029988.PDF", label_source: ca-pm-egrifta-2015 }
notes: |
  Names searched (from the data file): tesamorelin (INN), TH9507, TH-9507, (3E)-hex-3-enoylsomatoliberin; brands
  Egrifta, Egrifta SV, Egrifta WR; holder Theratechnologies.

  CANADA (Health Canada), searched 23 October 2026.
  - Drug Product Database (DPD) API, by active ingredient (substring match, all statuses): 'tesamorelin' and 'tesamor'
    return exactly two products, both EGRIFTA (Theratechnologies Inc.): drug code 90838, DIN 02423677, 2 mg/vial,
    'Cancelled Pre Market' on 2023-07-13, never marketed; drug code 92311, DIN 02438712, 1 mg/vial, 'Cancelled Post
    Market' on 2022-09-30, first marketed 2015-06-23, last lot P012329 with expiry 2023-01-31. Both: kit + powder for
    solution, subcutaneous, schedule Prescription, ATC H01AC06, product monograph dated 2015-03-26, RMP submitted.
    By brand: 'egrifta' gives the same two; 'egrifta sv' and 'egrifta wr' give none (neither US product was ever
    filed or authorised in Canada as far as the DPD and NOC databases show). [ca-dpd-search-status-b-2026-10-23,
    ca-dpd-egrifta-din-02438712, ca-dpd-egrifta-din-02423677]
  - Second pass (late on 23 October 2026, UTC): the DPD API returned HTTP 503 and the DPD web pages a Health Canada
    maintenance page, so the result was re-checked in Health Canada's official DPD data extract (approved, marketed,
    cancelled and dormant products; files dated 5 October 2026): the same two EGRIFTA products and statuses, the same
    dates and lot, and no other product for any tesamorelin name, code or brand. [ca-dpd-extract-search-status-b-2026-10-23]
  - Notice of Compliance database: NOC 15555 of 29 April 2014 (NDS, New Active Substance, 2 mg/vial, DIN 02423677)
    and NOC 16731 of 27 March 2015 (SNDS, 'new strength 1 mg/vial', DIN 02438712). The whole medicinal-ingredient
    table (96,057 rows) has no other tesamorelin NOC. [ca-noc-egrifta, ca-noc-search-status-b-2026-10-23]
  - Summary Basis of Decision SBD00185 (issued 11 July 2014) and its Post-Authorization Activity Table (updated
    24 July 2023) confirm all of the lead: NOC 29 April 2014 (NDS 131836, filed 17 June 2011); 1 mg strength NOC
    27 March 2015 (SNDS 177087); first sale of DIN 02438712 on 23 June 2015; DIN 02438712 cancelled post-market
    (discontinuation date 30 September 2022) and DIN 02423677 cancelled pre-market (13 July 2023), both because
    'The manufacturer notified Health Canada that sale of the drug has been discontinued' and cancelled under
    C.01.014.6(1)(a) of the Food and Drug Regulations. Re-read on the portal in the second pass (same text). [ca-sbd-egrifta,
    ca-food-and-drug-regulations]
  - Why 'discontinued' (non-safety), now RESOLVED: (1) both DINs were cancelled at the manufacturer's notice under
    C.01.014.6(1)(a), not by the Minister under C.01.014.6(2) (the compliance/safety route); (2) the company's
    mandatory discontinuation report on Drug Shortages Canada (report 170025, DIN 02438712, last updated
    22 September 2022) gives 'Reason for discontinuation: Business reasons', anticipated discontinuation date and
    remaining supply date 30 September 2022, decision reversal 'No'; (3) there is no Health Canada recall or safety
    alert for Egrifta (Recalls and Safety Alerts search 'egrifta': none). The live report page sits behind a
    bot-verification screen (not bypassed); its text was read on the Internet Archive copy of the original address
    captured on 30 September 2022, which is how melanotan-ii.yaml handled a similar case (archive used for checking,
    not linked). A reason is a required field of the report (Food and Drug Regulations C.01.014.91(1)(k)).
    [ca-sbd-egrifta, ca-food-and-drug-regulations, ca-dsc-egrifta-discontinuation-170025, ca-hc-recalls-database]
  - The SBD records a hard review: a Notice of Non-Compliance, then a Notice of Non-Compliance-Withdrawal
    (1 March 2013) over benefit-risk, the indication and IGF-1; a Reconsideration Panel (23 August 2013); then
    approval with tighter conditions than in the US (stop if IGF-1 SDS > 2 after 26 weeks; US uses 3).
    [ca-sbd-egrifta, ca-pm-egrifta-2015]
  - Prescription Drug List (human): 'Tesamorelin or its salts or derivatives', effective 25 April 2014 (still listed,
    although no product is authorised). Not in the Controlled Drugs and Substances Act. [ca-pdl-human, ca-cdsa]
  - Trials: Health Canada's Clinical Trials Database (trials authorised since April 2013) has no tesamorelin protocol;
    ClinicalTrials.gov lists three finished Theratechnologies trials with Canadian sites (NCT00123253, NCT00608023,
    NCT02012556) and no open one. Not 'investigational'. [ca-hc-ctdb-search-status-b-2026-10-23,
    ctgov-search-status-b-2026-10-23]
  - Submissions under review (new and supplemental): no tesamorelin entry (weak evidence: these lists do not show
    every kind of submission). [ca-hc-sur-search-2026-10-23]
  - Not established: whether Egrifta stock was still dispensed in Canada after 30 September 2022 (the DPD footnote
    allows distributors and pharmacies to sell remaining stock until the lot expiry, here 31 January 2023, when the
    cancellation is not for safety reasons; the discontinuation report gives 30 September 2022 as the 'remaining
    supply date'). Do not write that it was or was not. Whether Egrifta has since been supplied to individual
    Canadian patients through the Special Access Program was not searched.

  AUSTRALIA (TGA), searched 23 October 2026 in a browser.
  - ARTG: no result for 'tesamorelin', 'egrifta' or the sponsor 'theratechnologies'; 'TH9507' gave only unrelated
    fragment matches (vitamin D3 products, devices). Control 'somatropin': 30 results. The public ARTG search shows
    only goods that 'can be supplied' now: a test search for rofecoxib (withdrawn in 2004) also returns nothing. So
    the ARTG search proves 'not on the ARTG today', not 'never'. [au-artg-search-status-b-2026-10-23]
  - AusPAR: no 'tesamorelin' report. Prescription medicines under evaluation: none (control semaglutide: 1).
    Prescription medicines registrations database: none (control semaglutide: 8, earliest Ozempic 15 August 2019).
    Whole-site search 'tesamorelin': no result at all. So the TGA's website records no registration, evaluation or
    pending application; the page may say 'not approved in Australia, and the TGA has no record of an application',
    but should not say 'never'. [au-tga-search-status-b-2026-10-23]
  - ANZCTR: 0 records for tesamorelin or Egrifta; ClinicalTrials.gov: no tesamorelin record with an Australian site.
    [au-anzctr-search-status-b-2026-10-23, ctgov-search-status-b-2026-10-23]
  - Poisons Standard (October 2026 edition, F2026L01327, current): tesamorelin is NOT named. The group entry
    '# GROWTH HORMONE RELEASING HORMONES* (GHRHs)' is in Schedule 4 and in Appendix D clause 5 (item 18, 'including
    those separately specified in Schedule 4'): possession without authority is illegal. The 2014 proposal that
    created it was worded 'Growth Hormone Releasing Hormones and Analogues'. The Reader's guide says a poison not found
    under its own name 'may be shown under a group term', including 'a pharmacological group', and that an entry covers
    all salts and derivatives. Tesamorelin is human GHRH(1-44) with a hexenoyl group, so on our reading it falls under
    that entry, from 1 June 2015 (first edition with the entry).
    UNRESOLVED: no TGA document names tesamorelin, so 'S4' is our interpretation; a legal reviewer should confirm
    before the page states it as fact. For that reason no AU schedule field is proposed above.
    [au-poisons-standard-2026-10, au-poisons-standard-2015-06, au-tga-2014-09-scheduling-consultation]
  - Import: Customs (Prohibited Imports) Regulations 1956, reg 5G and Schedule 7A item 4: importing 'growth hormone
    releasing hormones (somatorelin and synthetic analogues)' needs a written permit from the Office of Drug Control
    (ODC lists 'import permit required: yes'). Tesamorelin is a synthetic analogue of somatorelin, so this appears
    to apply; same caveat (no document names it). [au-customs-prohibited-imports-regs,
    au-odc-growth-hormones-import-permit]

