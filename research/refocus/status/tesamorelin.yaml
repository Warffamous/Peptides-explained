schedule:
  CA: { code: "Prescription Drug List", note: "'Tesamorelin or its salts or derivatives', effective 25 April 2014.", sources: [ca-pdl-human] }
  # AU: deliberately NOT proposed as a schedule field. The Poisons Standard does not name tesamorelin; on our reading
  # it falls under the Schedule 4 group entry '# GROWTH HORMONE RELEASING HORMONES* (GHRHs)', but no official
  # document says so (UNRESOLVED, see notes). A schedule field would print 'S4' as fact; if a legal reviewer confirms
  # the reading, add: AU: { code: "S4", note: "Not named; covered by the group entry 'GROWTH HORMONE RELEASING
  # HORMONES (GHRHs)' (Schedule 4; Appendix D clause 5).", sources: [au-poisons-standard-2026-10, au-tga-2014-09-scheduling-consultation] }
products:
  # 'authorised' is the first Canadian NOC (2 mg vial, never sold); the 1 mg vial that was actually marketed got its
