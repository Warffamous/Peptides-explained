  - Notice of Compliance database: NOC 15555 of 29 April 2014 (NDS, New Active Substance, 2 mg/vial, DIN 02423677)
    and NOC 16731 of 27 March 2015 (SNDS, 'new strength 1 mg/vial', DIN 02438712). The whole medicinal-ingredient
    table (96,057 rows) has no other tesamorelin NOC. [ca-noc-egrifta, ca-noc-search-status-b-2026-10-23]
  - Summary Basis of Decision SBD00185 (issued 11 July 2014) and its Post-Authorization Activity Table (updated
    24 July 2023) confirm all of the lead: NOC 29 April 2014 (NDS 131836, filed 17 June 2011); 1 mg strength NOC
    27 March 2015 (SNDS 177087); first sale of DIN 02438712 on 23 June 2015; DIN 02438712 cancelled post-market
    (discontinuation date 30 September 2022) and DIN 02423677 cancelled pre-market (13 July 2023), both because
    'The manufacturer notified Health Canada that sale of the drug has been discontinued' and cancelled under
    C.01.014.6(1)(a) of the Food and Drug Regulations. Re-read on the portal in the second pass (same text). [ca-sbd-egrifta,
    ca-food-and-drug-regulations]
  - Why 'discontinued' (non-safety), now RESOLVED: (1) both DINs were cancelled at the manufacturer's notice under
    C.01.014.6(1)(a), not by the Minister under C.01.014.6(2) or (3) (non-compliance, insufficient evidence, a
    suspended notice of compliance, or a failed benefit-risk assessment order); (2) the company's
    mandatory discontinuation report on Drug Shortages Canada (report 170025, DIN 02438712, last updated
    22 September 2022) gives 'Reason for discontinuation: Business reasons', anticipated discontinuation date and
    remaining supply date 30 September 2022, decision reversal 'No'; (3) there is no Health Canada recall or safety
    alert for Egrifta (Recalls and Safety Alerts search 'egrifta': none). The live report page sits behind a
    bot-verification screen (not bypassed); its text was read on the Internet Archive copy of the original address
    captured on 30 September 2022, which is how melanotan-ii.yaml handled a similar case (archive used for checking,
    not linked). A reason is a required field of the report (Food and Drug Regulations C.01.014.91(1)(k)).
    [ca-sbd-egrifta, ca-food-and-drug-regulations, ca-dsc-egrifta-discontinuation-170025, ca-hc-recalls-database]
  - The SBD records a hard review: a Notice of Non-Compliance, then a Notice of Non-Compliance-Withdrawal
    (1 March 2013) over benefit-risk, the indication and IGF-1; a Reconsideration Panel (23 August 2013); then
    approval with tighter conditions than in the US (stop if IGF-1 SDS > 2 after 26 weeks; US uses 3).
    [ca-sbd-egrifta, ca-pm-egrifta-2015]
  - Prescription Drug List (human): 'Tesamorelin or its salts or derivatives', effective 25 April 2014 (still listed,
    although no product is authorised). Not in the Controlled Drugs and Substances Act. [ca-pdl-human, ca-cdsa]
  - Trials: Health Canada's trial records (trials authorised since April 2013; the Clinical Trials Database was
    replaced by the Canadian Clinical Trial Search Portal on 29 July 2026, and the portal also returns no result) have
    no tesamorelin protocol; ClinicalTrials.gov lists three finished Theratechnologies trials with Canadian sites
    (NCT00123253, 2005-2007; NCT00608023, 2007-2008; NCT02012556, 2008), all before 2013, and no open one. Three older
    tesamorelin records list no sites at all. Not 'investigational'. [ca-hc-ctdb-search-status-b-2026-10-23,
    ctgov-search-status-b-2026-10-23]
  - Submissions under review (new and supplemental): no tesamorelin entry (weak evidence: these lists do not show
    every kind of submission). [ca-hc-sur-search-2026-10-23]
  - Not established: whether Egrifta stock was still dispensed in Canada after 30 September 2022 (the DPD footnote
    allows distributors and pharmacies to sell remaining stock until the lot expiry, here 31 January 2023, when the
    cancellation is not for safety reasons; the discontinuation report gives 30 September 2022 as the 'remaining
