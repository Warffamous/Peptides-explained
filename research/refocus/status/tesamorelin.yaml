slug: tesamorelin
rows:
  # Canada: authorised 29 April 2014 (NOC 15555, 2 mg/vial; never marketed) and 27 March 2015 (NOC 16731, 1 mg/vial);
  # the 1 mg vial was the only one ever sold (23 June 2015 to 30 September 2022, discontinued for 'business reasons'
  # according to the company's mandatory discontinuation report). 'since' is the day the LAST Egrifta DIN was cancelled
  # (13 July 2023): between 30 September 2022 and that day the 2 mg DIN still stood, so under the site's definitions
  # the status was still 'authorised' (an authorisation existed). Editors who prefer the end of marketing can use
  # 2022-09-30, which is the product's marketed_until below.
  - { jurisdiction: CA, status: discontinued, since: 2023-07-13, authorised_since: 2014-04-29, as_of: 2026-10-23, sources: [ca-noc-egrifta, ca-sbd-egrifta, ca-dpd-egrifta-din-02438712, ca-dpd-egrifta-din-02423677, ca-dpd-extract-search-status-b-2026-10-23, ca-dsc-egrifta-discontinuation-170025, ca-food-and-drug-regulations] }
  - { jurisdiction: AU, status: not-authorised, as_of: 2026-10-23, sources: [au-artg-search-status-b-2026-10-23, au-tga-search-status-b-2026-10-23] }
  # UK: the data file already has a UK row (not-authorised, mhra-products-search-tesamorelin); re-checked twice on
