notes: |
  Names searched: epitalon, epithalon, epithalone, Ala-Glu-Asp-Gly / AEDG, and epithalamin (the cattle pineal extract,
  a different product, searched only to rule out confusion).

  CANADA (Health Canada). Health Canada's databases were down for maintenance (HTTP 503) throughout this run.
  - DPD (canada-legal run, same day): no product for epitalon, epithalon or AEDG (active ingredient and brand, all
    statuses). The brand search for 'Epithalone' could not be completed (API 503): UNRESOLVED, covered by the INN and
    spelling searches. [ca-dpd-search-canada-legal-2026-10-23]
  - Prescription Drug List: no entry. Not in the CDSA. [ca-pdl-human,
    ca-cdsa]
  - The FDA's May 2026 evaluation states: 'There are no approved products containing epitalon in Canada, Australia, the
    United Kingdom' (and seven EU countries). [fda-pcac-2026-epitalon-briefing]
  - Trials: no ClinicalTrials.gov record with a Canadian site (the only record matching epitalon, NCT07888595, is a
    US-only 'geroprotective' study begun 21 October 2026 whose arms include a topical peptide serum).
    [ctgov-search-status-d-2026-10-23, ca-ctgov-canada-peptide-search-2026-10-23]
  - Health Canada named epitalon in RA-77218 (1 April 2025, Calgary clinic), RA-77807 (1 August 2025), RA-81403
    (24 December 2025, 'Epithalon') and the 'think twice' advisory RA-81874 (9 April 2026).
    [ca-hc-recalls-search-status-d-2026-10-23, ca-hc-2026-04-think-twice-peptides]

  AUSTRALIA (TGA), 23 October 2026.
  - ARTG: no result for epitalon, epithalon, epithalone or epithalamin; '"AEDG"' only unrelated fragment matches
    (dental wedges). [au-artg-search-status-d-2026-10-23]
  - TGA website: 'epitalon' no result. [au-tga-search-status-d-2026-10-23]
  - Poisons Standard: not named (so not scheduled). [au-poisons-standard-2026-10]
  - ANZCTR: 0 records for epitalon and epithalon. [au-anzctr-search-status-d-2026-10-23]

  UNITED KINGDOM (re-check only).
  - MHRA Products: no results for epitalon or "epithalon"; the E index has no EPITALON entry. GOV.UK: 0 results for
    epitalon and epithalon. No trial with a UK site. [mhra-products-search-status-d-2026-10-23,
    uk-govuk-search-status-d-2026-10-23, ctgov-search-status-d-2026-10-23]

  UNITED STATES (for the US editors, no row change): NCT07888595 (early phase 1, enrolling by invitation, US only,
  sponsor a private research institute) is the first ClinicalTrials.gov record matching epitalon; it does not change
  the 'experimental' category (no formal development programme), but the page's 'no trials' wording, if any, should be
  checked against it.

  IRELAND / NEW ZEALAND: the FDA briefing also found no approved product in Ireland; New Zealand not checked.
  [fda-pcac-2026-epitalon-briefing]
page_facts: |
  - Epitalon is not approved in Canada or Australia (no product on Canada's Drug Product Database or the Australian
    Register of Therapeutic Goods; the FDA found none in Canada, Australia or the UK in 2026). [ca-dpd-search-canada-legal-2026-10-23,
    au-artg-search-status-d-2026-10-23, fda-pcac-2026-epitalon-briefing]
  - Health Canada has listed epitalon among unauthorised injectable peptides seized from a clinic and from sellers
    (2025) and named it in its April 2026 warning about peptides bought online. [ca-hc-recalls-search-status-d-2026-10-23,
    ca-hc-2026-04-think-twice-peptides]
  - In Australia epitalon is not named in the Poisons Standard, but it is not on the register, so importing, supplying
    or advertising it as a therapeutic product is unlawful unless an exemption applies. [au-poisons-standard-2026-10,
    au-tga-2026-04-peptide-responsibilities]
