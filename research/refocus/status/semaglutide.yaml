notes: |
  Names searched (from the data file): semaglutide (INN), NN9535 (DPD extract); 'NNC 0113-0217' was not searched
  separately (a development code; every authorised product carries the INN); brands Ozempic, Wegovy, Rybelsus; plus Kayshild (the EU's MASH brand, ema-epar-kayshild),
  Plosbrio and Poviztra once they turned up. All searches 24 October 2026 (local clock; 23 October in North America).
  Health Canada's live DPD was still down at the end of the run (last check about 11:40 local time).

  UNITED STATES (products only; the data file's US row stands).
  - Drugs@FDA and openFDA (meta 2026-10-23): five NDAs, all Novo Nordisk Inc. (Drugs@FDA company 'NOVO'): 209637
    Ozempic injection (5 December 2017, new molecular entity); 213051 Rybelsus tablets (20 September 2019) and Ozempic
    tablets 1.5/4/9 mg; 213182 Rybelsus 3 and 7 mg (16 January 2020, consolidated into 213051); 215256 Wegovy
    injection (4 June 2021; presentations include FlexTouch and the 7.2 mg 'Wegovy HD' pen); 218316 Wegovy tablets
    (22 December 2025). [fda-drugsatfda-search-status-a-2026-10-24]
  - 'Ozempic tablets' are not a new medicine: they are the Rybelsus formulation 'R2' (1.5, 4 and 9 mg) approved on
    9 December 2024 and renamed by a supplement approved on 30 January 2026; the label says Rybelsus and Ozempic
    tablets 'are not substitutable on a mg-to-mg basis'. [fda-letter-213051-s020, fda-letter-213051-s030,
    fda-label-rybelsus-ozempic-tablets]
  - Wegovy 7.2 mg weekly dose approved 19 March 2026 (S-029). [fda-letter-215256-s029]
  - No generic is approved. Apotex holds a tentative approval (ANDA 220314, 7 April 2026) for three semaglutide
    injection strengths; a tentative approval does not permit marketing. [fda-drugsatfda-search-status-a-2026-10-24]
  - Products were folded at brand level (injection / tablets), as the data file does for the EU. If the editor wants
    'Ozempic tablets' merged into the Rybelsus entry, drop ozempic-tablets-us; the dates above then go into prose.
  - Label URLs: fda-label-ozempic (209637s038, 05/2026) is still a current Ozempic label (a newer one, S-044 of
    27 August 2026, is a carton-label change); fda-label-wegovy (218316s007, 06/2026) is the latest combined Wegovy
    label; the Rybelsus/Ozempic tablets label is S-030 (1/2026).

  UNITED KINGDOM (products only; the data file has a UK row).
  - emc lists 20 semaglutide SmPCs, all Novo Nordisk A/S: Ozempic (4 pens), Rybelsus (6 strengths), Wegovy FlexTouch
    (5), Wegovy 7.2 mg pen, Wegovy tablets (4). No generic, no other brand, no Kayshild. [uk-emc-search-status-a-2026-10-24]
  - MHRA Products substance index shows the same brands plus Wegovy single-dose pens; the search results and product
    pages are behind a disclaimer that was not accepted, so no licence was read there.
    [uk-mhra-substance-index-status-a-2026-10-24]
  - Dates: Ozempic PLGB 04668/0331 and Rybelsus PLGB 04668/0420, 'Date of first authorisation: 01 January 2021'
    (converted EU authorisations at EU exit); Ozempic 2 mg PLGB 04668/0435, 18 July 2022; Wegovy single-dose pens
    PLGB 04668/0429 to 0433, 24 September 2021 (MHRA list); Wegovy FlexTouch PLGB 04668/0436, 10 May 2022; Rybelsus
    1.5/4/9 mg PLGB 04668/0451 to 0453, 6 December 2024; Wegovy 7.2 mg pen PL 04668/0460, 13 April 2026; Wegovy tablets
    PL 04668/0466, 11 June 2026. [uk-emc-smpc-ozempic-0-25mg, uk-emc-smpc-rybelsus-3mg, uk-emc-smpc-wegovy-flextouch-0-25mg,
    uk-emc-smpc-wegovy-7-2mg, uk-emc-smpc-wegovy-tablets-1-5mg, uk-mhra-ma-granted-2021, uk-mhra-ma-granted-2022,
    uk-mhra-ma-granted-2024, uk-mhra-uk-wide-licensing]
    factcheck (24 October 2026): the MHRA's own 2026 lists confirm PL 04668/0460 (13 April 2026) and PL 04668/0466 to
    0469 (11 June 2026); the 2025 lists contain no semaglutide licence. [uk-mhra-ma-granted-2025, uk-mhra-ma-granted-2026]
  - Choice for the product 'authorised' field: the UK licence's own date. Ozempic and Rybelsus were in fact usable in
    the UK earlier under their EU authorisations (Ozempic 8 February 2018, while the UK was an EU member; Rybelsus
    3 April 2020, during the post-exit transition period). The transition-period point is not sourced here: say only
    'licensed in the UK since 2021, after EU-wide authorisation in 2018' for Ozempic, and give Rybelsus as 2021.
  - Wegovy tablets: the SMC page says the company has not applied to the SMC (smc-2988-semaglutide-wegovy-tablets);
    the MHRA licence is confirmed by the SmPC and the June 2026 release. [uk-mhra-2026-06-wegovy-tablets]
  - The emc host is not on the link allowlist; MHRA Products PDFs would be, but sit behind the disclaimer.

  CANADA (Health Canada), searched 24 October 2026.
  - DPD web pages and API down all day (maintenance); read from the official DPD extract (5 October 2026), which covers
    marketed, approved, cancelled and dormant products. 11 brands with semaglutide: Ozempic, Rybelsus, Wegovy,
    Plosbrio, Poviztra (all Novo Nordisk Canada Inc.); generic semaglutide from Dr. Reddy's (Semaglutide Injection),
    Apotex (Apo-Semaglutide Injection; Sevmia), Aspen (Aspen-Semaglutide; Semaglutide Injection) and Sandoz (Sandoz
    Semaglutide). None cancelled; one Ozempic DIN dormant since 24 July 2026. [ca-dpd-extract-search-status-a-2026-10-24]
  - Decision documents on the Drug and Health Product Portal: Ozempic NOC 4 January 2018 (SBD); Rybelsus 30 March 2020;
    Wegovy 23 November 2021; Rybelsus 1.5/4/9 mg 8 October 2024; Wegovy MASH (with conditions) 10 December 2025;
    Ozempic cardiovascular indication 25 February 2026 (after a 2020 attempt was cancelled by the company); generics:
    Dr. Reddy's 28 April 2026, Apo-Semaglutide 1 May 2026, Sevmia (generic of Wegovy) 25 June 2026. No decision document
    for Plosbrio, Poviztra, the two Aspen products or Sandoz; their dates are the DPD 'approved' dates.
    [ca-sbd-ozempic, ca-rds-rybelsus-2020, ca-rds-wegovy-2021, ca-rds-rybelsus-formulation-2024, ca-rds-wegovy-mash-2025,
    ca-rds-ozempic-mace-2026, ca-rds-semaglutide-injection-drreddys-2026, ca-rds-apo-semaglutide-2026, ca-rds-sevmia-2026,
    ca-dhpp-review-search-status-a-2026-10-24]
  - Marketed vs not: marketed (DPD status 'Marketed', 5 October 2026) are Ozempic, Rybelsus, Wegovy multidose pens,
    Dr. Reddy's and Apotex's Apo-Semaglutide; only 'approved' (authorised, not yet sold) are Wegovy single-dose pens,
    Plosbrio, Poviztra, Sevmia, both Aspen products and Sandoz. Wegovy was authorised in November 2021 but first sold on
    28 March 2024. [ca-dpd-extract-search-status-a-2026-10-24]
  - Chemically synthesised generics: Health Canada's decision summaries say the Dr. Reddy's, Apotex and Sevmia active
    ingredient 'is produced using solid phase chemical synthesis and not by recombinant DNA', while Ozempic and Wegovy
    are made by recombinant DNA technology in yeast. This RESOLVES the open point in canada.yaml
    (ca-hc-2026-08-generic-semaglutide-recall) and confirms that the June 2025 statement in
    ca-hc-2025-glp1-compounding-position ('not authorized any products containing chemically synthesized versions')
    is out of date. Whether the Aspen and Sandoz products are synthetic: not stated anywhere read (UNRESOLVED).
  - Plosbrio and Poviztra: same holder and strengths as Ozempic and Wegovy respectively; no decision document says
    why a second brand exists (UNRESOLVED; do not speculate on the page). They also exist in Australia.
  - Product monographs: Ozempic PM 00084255 (date of authorization 14 April 2026) found through an archived DPD page and
    read on pdf.hres.ca; for the other Canadian products the PM number could not be found (DPD down), so label_url is
    the DPD product page. Re-check when the DPD is back. [ca-pm-ozempic]
    factcheck (24 October 2026): three more found the same way and read on pdf.hres.ca: Wegovy 00082777 (10 December
    2025), Rybelsus 00082994 (revision 31 December 2025), Plosbrio 00082904 (22 December 2025; type 2 diabetes,
    the same pens and indications as Ozempic; the monograph gives no reason for the second brand). Their label_url
    now points to the monograph. Poviztra, Sevmia, both Aspen products, Sandoz and the Dr. Reddy's and Apotex
    generics: no archived DPD page found, so they keep the DPD page (UNRESOLVED). [ca-pm-wegovy, ca-pm-rybelsus,
    ca-pm-plosbrio]
  - Submissions under review: a cagrilintide + semaglutide new active substance (accepted 2026-03) and a semaglutide
    supplement (2026-01); indications not given. [ca-hc-sur-search-status-a-2026-10-24]

  AUSTRALIA (TGA), searched 24 October 2026 in the browser.
  - ARTG: 35 semaglutide entries, all Novo Nordisk Pharmaceuticals Pty Ltd: Ozempic (from 28 August 2019), Rybelsus
