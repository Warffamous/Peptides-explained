  - Rybelsus: registered, but not in the TGA's June 2025 list of GLP-1 medicines 'currently marketed in Australia'
    (inference that it is not marketed; do not state as fact). [au-artg-rybelsus-346198, au-tga-2025-06-glp1-aspiration-update]
  - Labels: the ARTG entry pages link the PI on www.ebs.tga.gov.au (Ozempic CP-2019-PI-01881-1, Wegovy
    CP-2022-PI-01930-1); PDFs not opened; label_url points to the ARTG entry instead (allowlisted host).
  - Poisons Standard: Schedule 4 'SEMAGLUTIDE' (not Appendix D). [au-poisons-standard-2026-10]

  PAYMENT (only what was clearly established; see page_facts).
  - US: Medicare Part D law excludes drugs 'when used for' weight loss; Medicare GLP-1 Bridge (1 July 2026 to
    31 December 2027, $50 a month) covers Wegovy injection and tablets for eligible people; BALANCE model for Medicaid;
    negotiated Medicare price for Ozempic/Rybelsus/Wegovy from 2027. Private insurance and employer plans were not
    researched (no single rule; leave out).
  - UK: NICE TA875 (Wegovy for obesity, specialist services, up to 2 years), TA1152 (Wegovy to reduce cardiovascular
    risk, May 2026), review of the 7.2 mg dose in progress; Scotland SMC2497 and SMC2988. Semaglutide for type 2
    diabetes is covered by NICE's diabetes guideline NG28, which was not read for this batch (do not state its
    recommendations from here).
  - Canada: pCPA letters of intent for Ozempic and Rybelsus (type 2 diabetes); Wegovy for weight management: negotiations
    not pursued (2022) and concluded without agreement (December 2025). CDA-AMC recommendation texts not readable (bot
    check): UNRESOLVED what they say. PMPRB (price ceilings for patented medicines) not researched.
    factcheck (24 October 2026): RESOLVED for Wegovy through the PubMed records of the recommendations: CADTH said
    Wegovy 'should not be reimbursed' for chronic weight management (October 2022); CDA-AMC then recommended
    reimbursement 'if certain conditions are met' only for adults with a BMI of 27 or more and pre-existing
    cardiovascular disease, with a price reduction (July 2025); the pCPA negotiation that followed ended without
    agreement (1 December 2025). [ca-cda-amc-2022-wegovy, ca-cda-amc-2025-wegovy, ca-pcpa-negotiations-2026-10-24]
    PMPRB still not researched.
  - Australia: PBS lists semaglutide only as Ozempic for type 2 diabetes (authority required); Wegovy and Rybelsus are
    not on the PBS. Date of first PBS listing UNRESOLVED.
    factcheck (24 October 2026): RESOLVED: Ozempic has been PBS-listed since 1 July 2020 [au-pbs-dusc-2024-06-semaglutide].
    PBAC history found: Wegovy 'Not Recommended' for obesity (March 2022) and severe obesity (November 2023);
    'Recommended' in November 2025 for established cardiovascular disease with obesity, but as of 1 October 2026 the
    company's documentation was 'Not Accepted' and Wegovy is not listed; in November 2025 the PBAC said it 'has not yet
    recommended any medicine be listed on the PBS for weight management or treatment of obesity'.
    [au-pbs-medicine-status-wegovy, au-pbac-2025-11-obesity-treatments-advice]

  Ireland and New Zealand: not searched (outside this batch).
page_facts: |
  UNITED STATES
  - The FDA approved Ozempic (injection) for type 2 diabetes on 5 December 2017, Rybelsus tablets on 20 September 2019,
    Wegovy injection for weight management on 4 June 2021 and Wegovy tablets on 22 December 2025, all from Novo Nordisk.
    [fda-drugsatfda-ozempic, fda-drugsatfda-rybelsus, fda-drugsatfda-wegovy, fda-drugsatfda-wegovy-tablets]
  - 'Ozempic tablets' (1.5, 4 and 9 mg) are a newer Rybelsus formulation, approved in December 2024 and renamed in
    January 2026; the two tablets are not interchangeable milligram for milligram. [fda-letter-213051-s020,
    fda-letter-213051-s030, fda-label-rybelsus-ozempic-tablets]
  - In March 2026 the FDA approved a higher weekly Wegovy dose of 7.2 mg for weight management. [fda-letter-215256-s029]
  - No generic semaglutide is approved in the US; one company holds only a tentative approval (April 2026), which does
    not allow sale. [fda-drugsatfda-search-status-a-2026-10-24]
  - Paying: by law, Medicare drug plans (Part D) may not pay for medicines 'when used for' weight loss, and state Medicaid
    programmes may choose not to. Part D plans can still cover semaglutide for its other approved uses, such as type 2
    diabetes. [us-usc-42-1395w-102-e, us-usc-42-1396r-8-d, us-medicare-gov-weight-loss-drugs]
  - From 1 July 2026 to 31 December 2027 a temporary Medicare programme, the Medicare GLP-1 Bridge, covers Wegovy
    (injection or tablets) for weight management for eligible people with Part D, with a $50 monthly copay and prior
    authorisation; eligibility depends on BMI and certain conditions, and people with type 2 diabetes, sleep apnoea or
    fatty liver disease are directed to their own Part D plan instead. [us-cms-medicare-glp1-bridge, us-medicare-gov-weight-loss-drugs]
  - Under CMS's voluntary BALANCE model, state Medicaid programmes may cover GLP-1 medicines including Ozempic, Rybelsus
    and Wegovy for weight management as early as May 2026; coverage depends on each state (and the manufacturer) taking
    part. [us-cms-balance-model]
  - Ozempic, Rybelsus and Wegovy were among the drugs in Medicare's second round of price negotiation: from 1 January
    2027 Medicare's negotiated price is $274 for a 30-day supply (the 2024 list price was $959). [us-cms-ipay2027-negotiated-prices]
    (factcheck: this source's URL contains a commerce token and fails the build if linked; see its note.)
  - Enforcement: the FDA warns about unapproved and compounded GLP-1 products, including fake Ozempic and products
    sold 'for research purposes'; the shortage that allowed compounded copies has ended. [fda-unapproved-glp1-concerns,
    fda-glp1-compounding-policy, fda-drug-shortages-2026-10-23, fda-import-alert-66-80, fda-warning-letters-index]
  UNITED KINGDOM
  - Ozempic has been authorised for the UK since February 2018, first through the EU-wide authorisation and, since
    1 January 2021, under its own Great Britain licence (Northern Ireland stayed under the EU authorisation until the
    end of 2024); Rybelsus has a Great Britain licence from the same date. [ema-epar-ozempic,
    uk-euwa-2018-s20-exit-day, uk-emc-smpc-ozempic-0-25mg, uk-emc-smpc-rybelsus-3mg, uk-mhra-uk-wide-licensing]
    (factcheck: 'UK licence' corrected to 'Great Britain licence': both are PLGB numbers.)
  - The MHRA licensed Wegovy injection in Great Britain in September 2021, the cardiovascular indication in July 2024, a 7.2 mg dose in
    January 2026 (single-dose pen April 2026), Wegovy tablets on 11 June 2026 and the liver indication (MASH) in July
    2026. [uk-mhra-ma-granted-2021, uk-mhra-2024-07-wegovy-cv, uk-mhra-2026-01-wegovy-7-2mg-dose,
    uk-mhra-2026-04-wegovy-7-2mg-pen, uk-mhra-2026-06-wegovy-tablets, uk-mhra-2026-07-wegovy-mash]
  - All semaglutide medicines are prescription-only; there is no UK generic. [mhra-glp1-what-you-need-to-know,
    uk-emc-search-status-a-2026-10-24, uk-mhra-substance-index-status-a-2026-10-24]
  - NHS (England): NICE recommends Wegovy for weight management only within specialist weight management services, for
    up to 2 years, for adults with at least one weight-related condition and a BMI of 35 or more (or 30 to 34.9 if they
    meet the criteria for specialist referral). [nice-ta875-semaglutide]
  - NICE also says semaglutide can be used on the NHS to reduce the risk of heart attack and stroke in adults with
    established cardiovascular disease and a BMI of at least 27 (May 2026); a review covering the 7.2 mg dose is under
    way. [nice-ta1152-semaglutide-mace, nice-id6699-semaglutide-obesity-review]
  - Scotland: the SMC accepted Wegovy pens for restricted use; Wegovy tablets are not recommended in NHS Scotland because
    the company has not applied. [smc-2497-semaglutide-wegovy, smc-2988-semaglutide-wegovy-tablets]
  - Enforcement: the MHRA has warned about fake Ozempic pens since 2023. [mhra-2023-fake-weight-loss-pens]
  CANADA
  - Health Canada authorised Ozempic on 4 January 2018 (sold from February 2018), Rybelsus on 30 March 2020 and Wegovy on
    23 November 2021 (first sold in March 2024). [ca-sbd-ozempic, ca-rds-rybelsus-2020, ca-rds-wegovy-2021,
    ca-dpd-extract-search-status-a-2026-10-24]
  - Canada is the first of these four countries with generic semaglutide: Health Canada authorised generic versions of
    Ozempic from April 2026 (two on sale since May 2026) and a generic of Wegovy (Sevmia) in June 2026. Their
    semaglutide is made by chemical synthesis, while Ozempic and Wegovy are made in yeast; Health Canada found them
    equivalent. [ca-rds-semaglutide-injection-drreddys-2026, ca-rds-apo-semaglutide-2026, ca-rds-sevmia-2026,
    ca-dpd-extract-search-status-a-2026-10-24]
  - Semaglutide is on Canada's Prescription Drug List (since March 2018). [ca-pdl-human]
  - Paying: public drug plans negotiate through the pCPA. The pCPA reached agreements (letters of intent) for Ozempic
    and Rybelsus for type 2 diabetes; for Wegovy for weight management it did not negotiate in 2022 and a second
    negotiation ended without agreement in December 2025. Each province or territory then decides what its plan
    covers. [ca-pcpa-negotiations-2026-10-24, ca-pcpa-role-system]
  - Canada's Drug Agency advised in 2022 that public plans should not pay for Wegovy for weight management; in July
    2025 it advised paying only for adults with a BMI of 27 or more who already have heart or blood-vessel disease, and
    only at a lower price. No price agreement followed. [ca-cda-amc-2022-wegovy, ca-cda-amc-2025-wegovy,
    ca-pcpa-negotiations-2026-10-24] (factcheck: added.)
  - Enforcement: Health Canada has warned about unauthorised and counterfeit GLP-1 products sold in stores and online
    (January 2026) and recalled a compounded semaglutide product made with an unauthorised ingredient (January 2025).
    [ca-hc-2026-01-glp1-advisory, ca-hc-2025-01-semaglutide-pyridoxine-recall]
  AUSTRALIA
  - The TGA registered Ozempic on 28 August 2019, Rybelsus on 7 February 2022 and Wegovy on 1 September 2022, all
    sponsored by Novo Nordisk; Wegovy tablets and generic semaglutide are not on the register. [au-artg-search-status-a-2026-10-24,
    au-tga-pmr-search-status-a-2026-10-24]
  - Semaglutide is a Schedule 4 (prescription-only) medicine. [au-poisons-standard-2026-10]
  - Since 1 October 2024 pharmacists may not compound medicines containing GLP-1 receptor agonists. [au-tg-amendment-2024-measures-2-glp1,
    au-tga-compounded-medicines-guidance, au-tga-2024-06-glp1-compounding-update]
  - Advertising Ozempic or Wegovy to the public is illegal, and advertising Ozempic for weight loss is illegal even to
    health professionals. [au-tga-advertising-glp1-prohibited]
  - Paying: the PBS subsidises semaglutide only as Ozempic for type 2 diabetes (authority required), since 1 July
    2020; Wegovy is not on the PBS, so it is paid privately. [au-pbs-semaglutide-2026-10-24,
    au-pbs-dusc-2024-06-semaglutide, au-tga-2025-06-glp1-aspiration-update]
  - The PBAC, which advises on PBS listings, turned down Wegovy for obesity in 2022 and 2023. In November 2025 it
    recommended Wegovy for people with obesity who already have heart or blood-vessel disease, but as of October 2026
    that listing has not been made. [au-pbs-medicine-status-wegovy, au-pbac-2025-11-obesity-treatments-advice]
    (factcheck: added.)
  - During shortages the TGA temporarily allowed overseas-registered Ozempic to be supplied (section 19A); all those
    approvals have lapsed. [au-tga-pmr-search-status-a-2026-10-24]
  - Enforcement: counterfeit Ozempic pens found at the border had been bought online from an overseas website and
    imported for personal use. Another counterfeit pen, bought overseas, caused a life-threatening reaction in
    Australia; testing found insulin in both (TGA, September 2024). [au-tga-2024-09-counterfeit-ozempic-pens]
    (factcheck: the writer's sentence merged the two cases.)
