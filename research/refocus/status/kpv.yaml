  UNITED STATES: no new research in this batch.
  Ireland and New Zealand: not searched here, except ClinicalTrials.gov: no trial in either.
page_facts: |
  CANADA
  - No product containing KPV has ever been authorised in Canada. [ca-dpd-search-status-c-2026-10-23, ca-noc-search-status-c-2026-10-23]
  - Health Canada names KPV among unauthorised injectable peptides it has seized (2025 and 2026 advisories).
    [ca-hc-2026-04-think-twice-peptides, ca-hc-recalls-search-status-c-2026-10-23]
  AUSTRALIA
  - Not on the Australian Register of Therapeutic Goods. [au-artg-search-status-c-2026-10-23]
  - KPV is not listed in the Poisons Standard, unlike BPC-157 or TB-500; but a peptide sold for a health purpose is
    still a therapeutic good, and the TGA says it is unlawful to import, advertise, manufacture and supply unapproved
    peptide products. [au-poisons-standard-2026-10, au-tga-peptide-products-hub, au-tga-2026-08-peptide-seizure,
    au-tga-how-we-regulate-peptides]
  UNITED KINGDOM
  - No product containing KPV has a UK licence. [uk-mhra-substance-index-status-c-2026-10-23]
factcheck: |
  INDEPENDENT FACT-CHECK, 24 October 2026.
  Method: every source cited in this file was reopened on 24 October 2026 and every not-found search repeated
  with the recorded terms plus synonyms (details and per-source corrections in the factcheck block and the
  FACT-CHECK notes of research/refocus/sources/status-c.yaml). Canada's DPD, NOC and LNHPD were still on the
  maintenance page, so the DPD was checked through Health Canada's DPD data extracts (marketed, approved, dormant and
  inactive files, page of 15 October 2026) instead; the NOC database could not be re-checked.
  Checked, no change needed: both rows (CA and AU not-authorised); 'no schedule' (the October 2026 Poisons Standard
  names neither KPV nor Lys-Pro-Val and has no alpha-MSH or fragment entry; the only melanocyte-stimulating-hormone
  text is the two cross-references); Schedule 5 item 1 of the Therapeutic Goods Regulations (doctor's authority only
  for Schedule 4 or 8 goods; packaging that 'enables the medicine to be accurately identified'); the TGA's May 2026
  import warning (read live); the FDA briefing (no human studies; EMA-only statement on authorisation); RA-81874.
  Not-found searches repeated with the same result: ARTG ("Lys-Pro-Val": no matching results), ANZCTR (KPV: 0),
  ClinicalTrials.gov (KPV OR "Lys-Pro-Val": 0 in all five countries), Health Canada's trial portal (0), Health Canada
  recalls site (3, same notices), DPD data extracts (no KPV, Lys-Pro-Val or lysyl-prolyl ingredient), PDL and CDSA.
  Changed: RA-81403 names KPV only within a blend product; the TGA's 'How we regulate therapeutic peptide products'
  page (au-tga-how-we-regulate-peptides, australia.yaml) added as a source for 'unscheduled is not lawful to sell'.
  Editor note: the import paragraph (unscheduled, so no doctor's authority needed) is accurate law, but keep it
  neutral and short so that it cannot read as a route (CONTENT-GUIDE section 1).
