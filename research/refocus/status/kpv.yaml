page_facts: |
  CANADA
  - No product containing KPV has ever been authorised in Canada. [ca-dpd-search-status-c-2026-10-23, ca-noc-search-status-c-2026-10-23]
  - Health Canada names KPV among unauthorised injectable peptides it has seized (2025 and 2026 advisories).
    [ca-hc-2026-04-think-twice-peptides, ca-hc-recalls-search-status-c-2026-10-23]
  AUSTRALIA
  - Not on the Australian Register of Therapeutic Goods. [au-artg-search-status-c-2026-10-23]
  - KPV is not listed in the Poisons Standard, unlike BPC-157 or TB-500; but a peptide sold for a health purpose is
    still a therapeutic good, and the TGA says it is unlawful to import, advertise, manufacture and supply unapproved
    peptide products. [au-poisons-standard-2026-10, au-tga-peptide-products-hub, au-tga-2026-08-peptide-seizure]
  UNITED KINGDOM
  - No product containing KPV has a UK licence. [uk-mhra-substance-index-status-c-2026-10-23]
