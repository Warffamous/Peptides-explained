notes: |
  Names searched: KPV, Lys-Pro-Val, H-Lys-Pro-Val-OH, lysyl-prolyl(-valine), alpha-MSH(11-13), ACTH(11-13). No INN,
  no brand. Because 'KPV' is a three-letter string, searches that cannot take exact phrases return noise; the
  results below rely on the exact searches.

  CANADA (Health Canada), searched 23 October 2026.
  - DPD API by active ingredient: KPV, 'lysyl-prolyl', 'alpha-MSH', 'melanocyte': no product of any status. NOC
    database, ingredient KPV: 'No result found!'. Submissions under review: none. [ca-dpd-search-status-c-2026-10-23,
    ca-noc-search-status-c-2026-10-23, ca-hc-sur-search-status-c-2026-10-23]
  - Trials: none in Canada (Health Canada portal; ClinicalTrials.gov 'KPV OR "Lys-Pro-Val"': 0). FDA found no studies of
    KPV in humans at all. Not 'investigational'. [ca-hc-ctdb-search-status-c-2026-10-23, ctgov-search-status-c-2026-10-23,
    fda-pcac-2026-kpv-briefing]
  - Prescription Drug List: not listed; not in the CDSA. [ca-pdl-human, ca-cdsa]
  - Enforcement: KPV is named in Health Canada's April 2026 advisory (RA-81874) and in seizure advisories RA-77218
    (1 April 2025) and RA-81403 (24 December 2025; there only as an ingredient of one blend product, FACT-CHECK
    24 October 2026). The recalls database 'KPV' search returns exactly these three.
    [ca-hc-2026-04-think-twice-peptides, ca-hc-recalls-search-status-c-2026-10-23]
  - The FDA briefing's statement that no product is authorised covers the EMA only (it checked the EMA and the
    European and Japanese pharmacopoeias), so it is not cited for Canada or Australia. [fda-pcac-2026-kpv-briefing]

  AUSTRALIA (TGA), searched 23 October 2026.
  - ARTG: '"Lys-Pro-Val"': no matching results (both runs); 'KPV' alone returns 280 unrelated goods (fragment
    matching). [au-artg-search-status-c-2026-10-23]
  - TGA site search 'KPV': only unrelated records; no TGA safety alert, media release or scheduling document names
    KPV. AusPAR / under evaluation: nothing. ANZCTR: 0. [au-tga-search-status-c-2026-10-23, au-anzctr-search-status-c-2026-10-23]
  - Poisons Standard (October 2026): KPV is not named, and there is no entry for alpha-MSH or its fragments (melanotan
    II and afamelanotide only carry cross-references to melanocyte-stimulating hormone). So KPV is UNSCHEDULED in
    Australia. That does not make it lawful to sell: a peptide product promoted or used for a therapeutic purpose is a
    therapeutic good, and 'It is unlawful to import, advertise, manufacture and supply unapproved peptide products in
    Australia' (TGA, August 2026). FACT-CHECK addition: the TGA's regulation page also says peptide products regulated
    as therapeutic goods 'must be included in the Australian Register of Therapeutic Goods (ARTG) before they can be
    imported, manufactured, supplied, exported or advertised', with limited exceptions; this is a better source for
    the page than the media release. [au-poisons-standard-2026-10, au-tga-peptide-products-hub, au-tga-2026-08-peptide-seizure,
    au-tga-how-we-regulate-peptides]
  - Import: because it is unscheduled, the doctor's-authority condition of the personal-importation exemption does
    not apply; the other conditions do (personal use, quantity limits, packaging that 'enables the medicine to be
    accurately identified'), and the TGA says code-labelled or unlabelled peptide vials will not be released and are
    seized and destroyed. Say this neutrally on the page, as the legal position, not as a route.
    [au-tg-regulations-1990-sch-5-item-1, au-tga-2026-05-peptide-import-warning, au-tga-2026-04-peptide-responsibilities]
  - KPV is not among the TGA's named examples of unapproved peptides (BPC-157, GHK-Cu, TB-500, retatrutide,
    CJC-1295). [au-tga-2026-04-peptide-responsibilities]

  UNITED KINGDOM (re-check; existing row stands): MHRA substance index letter K: no KPV; exact-term search 'KPV':
  0 documents. [uk-mhra-substance-index-status-c-2026-10-23]
  FACT-CHECK (24 October 2026): the K index re-read (no KPV or Lys-Pro entry). The exact-term result comes from the
  second run's direct queries of the search service; the public search box returns 1,237 fuzzy matches for 'KPV',
