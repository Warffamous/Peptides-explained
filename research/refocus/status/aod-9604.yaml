  IRELAND / NEW ZEALAND: not searched in this batch.
page_facts: |
  HISTORY (Australia)
  - AOD-9604 was developed in Australia by Metabolic Pharmaceuticals in the late 1990s as an anti-obesity drug. Its
    phase 2b trial in obese adults ran at sites across Australia (registered in 2005); in February 2007 the company said
    the results did not support the drug's commercial viability as an obesity treatment and stopped that development.
    [fda-pcac-2024-aod9604-briefing, anzctr-actrn12605000067673]
  - In February 2013 the Australian Crime Commission reported that professional athletes were using AOD-9604, and
    described it as not approved for human use and not then scheduled. [au-acc-2013-organised-crime-drugs-sport]
  - On 22 April 2013 WADA stated that AOD-9604, approved by no government health authority, fell under the 2013
    Prohibited List's S0 category (non-approved substances, banned at all times). [wada-2013-04-aod9604-statement]
  - In 2013, during the investigation of Essendon's 2011-2012 supplements program, the Australian anti-doping
    authority's notes recorded that WADA said AOD-9604 was banned, and the authority told the AFL it would set out
    separately how it would handle possible violations from before WADA's statement of 22 April 2013.
    [au-fca-2014-1019-essendon-v-asada, wada-2013-04-aod9604-statement]
  AUSTRALIA
  - AOD-9604 has never been on the Australian Register of Therapeutic Goods, so it is not an approved medicine in
    Australia. [au-artg-search-status-d-2026-10-23, au-tga-search-status-d-2026-10-23]
  - It was added to the Poisons Standard as a prescription-only (Schedule 4) substance from 1 June 2015 and is still
    there (October 2026 edition); possessing it without authority, for example without a prescription, is illegal
    (Appendix D). [au-poisons-standard-2026-10, au-poisons-standard-2015-06]
  - The TGA made unapproved peptide products a compliance priority in June 2026. [au-tga-2026-06-peptide-compliance-priority]
  CANADA
  - No AOD-9604 product is authorised in Canada (no DIN). Health Canada has listed AOD-9604 among unauthorised injectable
    peptides seized from sellers (advisories of 1 August 2025 and 24 December 2025). [ca-dpd-search-canada-legal-2026-10-23,
    ca-hc-recalls-search-status-d-2026-10-23]
  UNITED KINGDOM
  - No AOD-9604 product has a UK licence. It is not a controlled drug; Home Office testing found it once in Border Force
    seizures in 2017-18. [mhra-products-search-status-d-2026-10-23, uk-home-office-fews-2017-18]
  US (no change): the FDA's 2024 review found no approved product and no published efficacy trial. [fda-pcac-2024-aod9604-briefing]
factcheck: |
  INDEPENDENT FACT-CHECK, 24 October 2026. Checked against the primary sources (re-opened or re-run): the CA, AU and UK
  rows (all three stay not-authorised); the AU schedule entry (Schedule 4 '# AOD-9604 (CAS No. 221231-10-3)' and
  Appendix D clause 5 item 3 in F2026L01327; first in F2015L00749, in force 1 June 2015, whose own Appendix D list
  misspells it 'AOD-9694'; absent from F2015L00128); ARTG and TGA site searches (same counts; '9604' and "AOD 9604"
  find only the November 2014 consultation); Customs (Prohibited Imports) Regulations Schedule 7A (AOD-9604 not named;
  item 3 growth hormones, item 4 darbepoetin alfa); ANZCTR record ACTRN12605000067673 and searches; the Federal Court
  judgment ([1], [83], [175]-[176], [191], [206]); the ACC report (pdftotext); MHRA Products quoted searches; GOV.UK
  and the FEWS 2017-18 table; the Health Canada advisories RA-77807 and RA-81403; the PDL and CDSA; ClinicalTrials.gov.
  CHANGED: (1) schedule note: 'in every edition since' replaced by what was read (June 2015 and October 2026 editions;
  editions in between not read); same caution in the AU page fact. (2) ACC border status: the report contradicts
  itself (Appendix Two 'Schedule 7A', Appendix Three 'not a border controlled drug'); the note now says so. (3) Company
  history RESOLVED from ABN Lookup (renamed Calzada Limited 17 February 2010; renamed again 21 November 2014).
  (4) WADA's 22 April 2013 release RESOLVED from wada-ama.org (S0); new page fact added. (5) 'with the company' for
  the Monash animal studies removed (not in the PubMed affiliation). (6) Page facts: 'did not support it as an
  obesity treatment' replaced by the FDA-quoted 'commercial viability' wording; '2012 supplements program' corrected
  to 2011-2012 ([1] of the judgment); 'treated AOD-9604 as banned' replaced by what the judgment records.
  (7) Health Canada's trial portal searched (no AOD-9604 trial).
  STILL UNRESOLVED: NOC database (down); ASADA's later public statement on pre-22 April 2013 use; the TGA February
  2016 interim scheduling page cited by the FDA; Poisons Standard editions between June 2015 and October 2026 not read
  one by one. New sources used: wada-2013-04-aod9604-statement, au-abr-abn-96083866862,
  ca-hc-ctdb-search-status-d-2026-10-24 (research/refocus/sources/status-d.yaml).
