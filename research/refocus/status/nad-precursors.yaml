rows:
  # EDITORIAL DECISION NEEDED (see notes, 'Which status'). Proposed in the sense the existing US and EU rows use:
  # no product is authorised as a drug (no DIN, no NOC). Oral nicotinamide riboside is sold under a Health Canada
  # natural health product licence (and NMN can be, under an NHP monograph); injectable NAD+ cannot be a natural
  # health product and has no DIN.
  - { jurisdiction: CA, status: not-authorised, as_of: 2026-10-23, sources: [ca-dpd-search-canada-legal-2026-10-23, ca-lnhpd-nr-licence, ca-nhpid-nmn-monograph, ca-nhpr-schedule-2, ca-hc-recalls-search-status-d-2026-10-23] }
  # Same sense: no registered (AUST R) medicine. Oral NR chloride and NMN are permitted active ingredients of listed
  # (AUST L) medicines, which the TGA does not evaluate before listing; NAD+ itself is not a permitted ingredient and
  # every ARTG entry containing it is for export only.
  - { jurisdiction: AU, status: not-authorised, as_of: 2026-10-23, sources: [au-artg-search-status-d-2026-10-23, au-permissible-ingredients-determination-2026-3, au-tga-2025-04-nad-nmn-safety-alert, au-tga-2026-08-nad-nmn-representations-guidance] }
  # No UK medicine licence for NR, NMN or NAD+. NR chloride is an authorised novel food in Great Britain; NMN and
  # NAD+ are not on the GB novel-food register.
  - { jurisdiction: UK, status: not-authorised, as_of: 2026-10-23, sources: [mhra-products-search-status-d-2026-10-23, uk-fsa-gb-novel-96-nr-chloride, uk-fsa-novel-food-register-search-status-d-2026-10-23] }
