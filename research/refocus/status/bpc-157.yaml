  UNITED STATES: no new research in this batch; the US row and its sources (FDA PCAC July 2026) are unchanged.

  Ireland and New Zealand: not searched here (ireland-nz assignment), except ClinicalTrials.gov: no trial in either.
page_facts: |
  CANADA
  - No product containing BPC-157 has ever been authorised in Canada (Drug Product Database and Notice of Compliance
    database, 23 October 2026). [ca-dpd-search-status-c-2026-10-23, ca-noc-search-status-c-2026-10-23]
  - Health Canada lists BPC-157 among unauthorised injectable peptides it has seized, and says peptides are generally
    regulated as prescription drugs in Canada; selling unauthorised drugs is illegal. [ca-hc-2026-04-think-twice-peptides,
    ca-hc-recalls-search-status-c-2026-10-23]
  - In May 2026 Health Canada recalled BPC-157 powder that had been sold to compounding and community pharmacies as an
    unauthorised active pharmaceutical ingredient. [ca-hc-2026-05-ghk-cu-bpc-157-api-recall]
  - A Canadian university athlete received a four-year anti-doping sanction in 2025 for using BPC-157 and TB-500.
    [ca-sic-2025-04-bpc157-tb500-sanction]
  AUSTRALIA
  - Not on the Australian Register of Therapeutic Goods. [au-artg-search-status-c-2026-10-23]
  - BPC-157 has been a prescription-only medicine (Schedule 4) since 1 June 2024, and possessing it without authority,
    such as a prescription, is illegal (Appendix D, given effect by state and territory law). The TGA scheduled it
    after 48 import referrals from July 2022. [au-poisons-standard-2026-10, au-poisons-standard-2024-06,
    au-tga-2024-05-final-decisions-notice]
  - The TGA names BPC-157 as an example of unapproved peptide products, a group for which it has received reports of
    harms such as severe allergic reactions (the reports are not broken down by compound), and a combination product
    of BPC-157 and TB-500 was among products seized in New South Wales in August 2026. [au-tga-2026-04-peptide-responsibilities, au-tga-2026-06-cmo-peptide-statement, au-tga-2026-08-peptide-seizure]
  UNITED KINGDOM
  - No product containing BPC-157 has a UK licence. [uk-mhra-substance-index-status-c-2026-10-23]
