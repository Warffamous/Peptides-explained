notes: |
  Names searched: bremelanotide (INN), bremelanotide acetate, PT-141, PT 141, PT141, Vyleesi (US brand), and the
  truncations 'bremelano', 'bremel'. The developer (Palatin) and the US licensees never filed outside the US as far as
  any database shows.

  CANADA (Health Canada), searched 23 October 2026.
  - DPD API by active ingredient: bremelanotide, 'bremelano', 'bremel', 'PT-141': no product of any status (cancelled
    and dormant products included); by brand 'VYLEESI': none. NOC database: ingredient BREMELANOTIDE, BREMEL and product
    names VYLEESI, PT-141: 'No result found!'. New drug submissions under review and completed (current to
    2026-09-30): no bremelanotide entry and none in the sexual-dysfunction area. So Health Canada has never
    authorised bremelanotide, and no submission for it appears in the published lists (FACT-CHECK 24 October 2026:
    the completed list covers submissions accepted from April 2015 only, so 'never received' was too strong). [ca-dpd-search-status-c-2026-10-23,
    ca-noc-search-status-c-2026-10-23, ca-hc-sur-search-status-c-2026-10-23]
  - Trials: three completed developer trials had Canadian sites (ClinicalTrials.gov: NCT01382719, phase 2, 2011-2012;
    NCT02333071 and NCT02338960, the two phase 3 trials behind the US approval, December 2014 / January 2015 to June
    2017). None is open, and Health Canada's portal lists no bremelanotide trial. Not 'investigational'.
    [ctgov-search-status-c-2026-10-23, ca-hc-ctdb-search-status-c-2026-10-23]
  - Not on the Prescription Drug List; not in the CDSA. [ca-pdl-human, ca-cdsa]
  - Enforcement: bremelanotide / PT-141 appears in two Health Canada seizure advisories (RA-77218, 1 April 2025,
    'PT-141'; RA-77807, 1 August 2025, 'Bremelanotide'), each naming a seller, so cite the search record. It is not in
    the April 2026 list of examples (RA-81874). [ca-hc-recalls-search-status-c-2026-10-23]

  AUSTRALIA (TGA), searched 23 October 2026.
  - ARTG: bremelanotide, vyleesi, '"PT 141"': 'There were no matching results' (bremelanotide and vyleesi repeated in
    the second run); hyphenated 'PT-141' matches only unrelated devices. AusPAR 'bremelanotide': none (control
    afamelanotide: 1). Prescription medicines under evaluation: none (control semaglutide: 1). TGA whole-site search
    'bremelanotide': no result at all. [au-artg-search-status-c-2026-10-23, au-tga-search-status-c-2026-10-23]
  - Trials: two academic University of Sydney studies (registered October 2015) gave single injections of PT-141 to
    men to study social cognition: ACTRN12615001033538 (healthy men, completed, 61 participants, last data 2017) and
    ACTRN12615001059550 (males with autism; still marked 'Recruiting' but last updated November 2017, 17 of 60
    enrolled, planned end 2019). Neither makes bremelanotide 'investigational' today: one is finished and the other's
    record is years out of date. UNRESOLVED: what happened to ACTRN12615001059550 (FACT-CHECK: PubMed, 24 October
    2026, finds no results publication for either study). ClinicalTrials.gov: no Australian
    site. [au-anzctr-search-status-c-2026-10-23, anzctr-actrn12615001033538, anzctr-actrn12615001059550,
    ctgov-search-status-c-2026-10-23]
  - Poisons Standard (October 2026): bremelanotide / PT-141 is not named, and there is no group entry for melanocortin
    agonists; it is therefore UNSCHEDULED (unlike melanotan II, which is Schedule 4). As an unapproved therapeutic good
    it still may not be supplied or advertised. For the page: do not call it 'prescription-only' in Australia.
    [au-poisons-standard-2026-10, au-tga-peptide-products-hub, au-tga-2026-08-peptide-seizure, au-tga-how-we-regulate-peptides]
  - Import, UNRESOLVED (fact-check, 24 October 2026; legal reviewer): bremelanotide is not named in the Customs
    (Prohibited Imports) Regulations, but Schedule 8 item 4 prohibits importing without permission 'aphrodisiacs, that
    is to say, cantharides, cantharidin and yohimbine' and any substance producing effects 'substantially of the same
    character or nature as, or analogous to' theirs. Whether that catch-all can apply to bremelanotide, a medicine for
    low sexual desire, is not settled by any document found; the page should not say that no import control applies.
    [au-customs-prohibited-imports-regs]
  - No TGA safety alert or media release names bremelanotide or PT-141 (site search). [au-tga-search-status-c-2026-10-23]

  UNITED KINGDOM (re-check; existing row stands): MHRA substance index letter B: no BREMELANOTIDE; exact-term
  searches bremelanotide, bremelanotid*, vyleesi: 0 documents (control afamelanotide: 2); GOV.UK search
  'bremelanotide': 0 results. One completed UK academic study (NCT04179734, Imperial College Healthcare NHS Trust,
  October 2019 to October 2020: brain imaging in women with hypoactive sexual desire disorder) used it; no open UK
  trial. [uk-mhra-substance-index-status-c-2026-10-23, mhra-products-search-bremelanotide,
  uk-govuk-search-status-c-2026-10-23, ctgov-search-status-c-2026-10-23]

  UNITED STATES: no new research; the US row and the Vyleesi product are unchanged. Existing enforcement fact: FDA
  warning letters of 24 August 2026 to online sellers named PT-141 (bremelanotide) among unapproved new drugs
  (research/pt-141.md; cite fda-warning-letters-index, which does not name the sellers).
  Ireland and New Zealand: not searched here, except ClinicalTrials.gov: no trial in either.
page_facts: |
  CANADA
  - Bremelanotide has never been authorised in Canada, and no application is listed, although Canadian sites took part
    in the developer's phase 2 and phase 3 trials (2011-2017). [ca-dpd-search-status-c-2026-10-23,
    ca-noc-search-status-c-2026-10-23, ca-hc-sur-search-status-c-2026-10-23, ctgov-search-status-c-2026-10-23]
  - Health Canada has listed PT-141 / bremelanotide among unauthorised injectable peptides seized in 2025.
    [ca-hc-recalls-search-status-c-2026-10-23]
  AUSTRALIA
  - Bremelanotide is not on the Australian Register of Therapeutic Goods, and no application has been published.
    [au-artg-search-status-c-2026-10-23, au-tga-search-status-c-2026-10-23]
  - Unlike melanotan II, bremelanotide is not listed in the Poisons Standard. [au-poisons-standard-2026-10]
  - It was used in two University of Sydney research studies registered in 2015. [anzctr-actrn12615001033538, anzctr-actrn12615001059550]
  UNITED KINGDOM
  - Bremelanotide has no UK licence; it was used in one completed academic study in London (2019-2020).
    [mhra-products-search-bremelanotide, uk-mhra-substance-index-status-c-2026-10-23, ctgov-search-status-c-2026-10-23]
factcheck: |
  INDEPENDENT FACT-CHECK, 24 October 2026.
  Method: every source cited in this file was reopened on 24 October 2026 and every not-found search repeated
  with the recorded terms plus synonyms (details and per-source corrections in the factcheck block and the
  FACT-CHECK notes of research/refocus/sources/status-c.yaml). Canada's DPD, NOC and LNHPD were still on the
  maintenance page, so the DPD was checked through Health Canada's DPD data extracts (marketed, approved, dormant and
  inactive files, page of 15 October 2026) instead; the NOC database could not be re-checked.
  Checked, no change needed: both rows (CA and AU not-authorised) and 'no products'; 'unscheduled' in Australia (the
  October 2026 Poisons Standard names neither bremelanotide nor PT-141 and has no melanocortin group entry); the three
  Canadian-site developer trials (NCT01382719 phase 2, June 2011 to September 2012; NCT02333071 and NCT02338960 phase
  3, December 2014 / January 2015 to June 2017) and the London study NCT04179734 (registered as phase 4, 7 October 2019
  to 6 October 2020); both ANZCTR records (dates, accrual, status); RA-77218 ('PT-141') and RA-77807 ('Bremelanotide');
  its absence from RA-81874; the FDA warning-letter fact (fda-warning-letters-index). Not-found searches repeated with
  the same result: ARTG (bremelanotide, vyleesi, "PT 141"), AusPAR and prescription medicines under evaluation
  (bremelanotide: none; controls afamelanotide and semaglutide found), TGA site search (bremelanotide: no result),
  ClinicalTrials.gov (Australia, Ireland, New Zealand: 0), Health Canada's trial portal (bremelanotide, PT-141: 0),
  submissions lists (none), DPD data extracts (no bremelanotide ingredient, no VYLEESI brand, any status), MHRA
  substance index and public search box (bremelanotide, vyleesi: 'There are no search results'), GOV.UK
  (bremelanotide: 0).
  Changed: 'never received a published submission' narrowed to the lists' coverage (from April 2015); Customs
  Schedule 8 item 4 raised as UNRESOLVED; PubMed check of the Sydney studies recorded; au-tga-how-we-regulate-peptides
  (australia.yaml) added as a source.
