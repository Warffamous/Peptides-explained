# TB-500 / thymosin beta-4 — locale-independent facts. Every value below is sourced; see research/tb-500.md.
#
# WHICH MOLECULE THIS FILE DESCRIBES. "TB-500" is a trade name, not a nonproprietary name. The FDA's
# 2026 review, the doping-control literature and PubChem define it as the N-acetylated 7-residue
# fragment Ac-LKKTETQ (residues 17–23 of thymosin beta-4). The sequence, identifiers and evidence
# grades below therefore describe that fragment. Full-length thymosin beta-4 (43 residues, INN
# timbetasin, eye-drop code RGN-259) is a different molecule; its human trials are listed as
# structured studies because they are what TB-500 is usually marketed on, but they do not lift the
# fragment's grades. Products sold as "TB-500" may contain either molecule or something else.
slug: tb-500
tier: 1
status: complete
# experimental, not investigational: the fragment has never been in a formal clinical development
# programme. The only registry record for it (NCT07487363) describes itself as "fictional".
# Full-length Tβ4 is investigational (SEER-2, NCT05555589; NL005, NCT07586865) but is not what this
# slug's sequence describes. Revisit if a real trial of the fragment is registered.
category: experimental
