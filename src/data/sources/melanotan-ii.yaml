  doi: 10.1007/s40257-019-00444-8
  pmid: "31119650"
  verified: pubmed
  note: "Systematic search: 93 articles, 179 patients with eruptive naevi; suspected causes were skin and other diseases (50%), immunosuppressive drugs, chemotherapy or melanotan (41%) and other or unknown (9%); 16% had at least one dysplastic naevus; five melanomas; 'The nature of the data precluded assessment of risk of malignant transformation.' Cited for: how often eruptive moles are linked to melanotan and how little is known about cancer risk."

