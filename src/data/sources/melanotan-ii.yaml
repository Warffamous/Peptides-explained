# wada-2027-list-en, fda-category-2-safety-risks, fda-503a-categories-2026-05, fda-503a-bulks-page,
# fda-pcac-2026-questions, fda-pcac-2026-briefing-intro, fda-pcac-2026-presentations-day1 (bpc-157.yaml);
# fda-pcac-2027-early-announcement, wada-2027-list-explanatory-note, ukad-2027-list-summary, usc-21-353a
# (legal-b.yaml); ema-medicines-search, cbg-geneesmiddeleninformatiebank, nl-geneesmiddelenwet,
# be-medicines-law-1964, fda-pcac-2026-07-meeting, lareb-home (shared.yaml).

# ---------------------------------------------------------------- design, receptors, origin

al-obeidi-1989-cyclic-lactam:
  type: article
  authors: "Al-Obeidi F, Castrucci AM, Hadley ME, Hruby VJ"
  title: "Potent and prolonged acting cyclic lactam analogues of alpha-melanotropin: design based on molecular dynamics"
  container: "Journal of Medicinal Chemistry"
  year: 1989
  volume: "32"
  pages: "2555-2561"
  doi: 10.1021/jm00132a010
  pmid: "2555512"
  verified: pubmed
  note: "University of Arizona. Seven cyclic lactam fragments of alpha-MSH tested in frog and lizard skin bioassays; Ac-[Nle4,Asp5,D-Phe7,Lys10]-alpha-MSH(4-10)-NH2 (melanotan II) was about 90 times as potent as alpha-MSH in the lizard assay; 23-membered rings gave prolonged activity. Cited for: origin and design of the molecule."

hruby-1995-melanocortin-antagonists:
  type: article
  authors: "Hruby VJ, Lu D, Sharma SD, Castrucci AL, Kesterson RA, al-Obeidi FA, Hadley ME, Cone RD"
  title: "Cyclic lactam alpha-melanotropin analogues of Ac-Nle4-cyclo[Asp5, D-Phe7,Lys10] alpha-melanocyte-stimulating hormone-(4-10)-NH2 with bulky aromatic amino acids at position 7 show high antagonist potency and selectivity at specific melanocortin receptors"
  container: "Journal of Medicinal Chemistry"
  year: 1995
  volume: "38"
  pages: "3454-3461"
  doi: 10.1021/jm00018a005
  pmid: "7658432"
  verified: pubmed
  note: "Abstract: MC1, MC3, MC4 and MC5 receptors 'all recognize' alpha-MSH and potent agonists such as Ac-Nle4-c[Asp5,D-Phe7,Lys10]alpha-MSH-(4-10)-NH2 (melanotan II); MC2R recognises mainly ACTH; replacing D-Phe7 with D-Nal(2') gave the antagonist SHU9119. Cited for: melanotan II acts on four melanocortin receptors, not one."

haskell-luevano-1996-mc1r-dissociation:
  type: article
  authors: "Haskell-Luevano C, Miwa H, Dickinson C, Hadley ME, Hruby VJ, Yamada T, Gantz I"
  title: "Characterizations of the unusual dissociation properties of melanotropin peptides from the melanocortin receptor, hMC1R"
  container: "Journal of Medicinal Chemistry"
  year: 1996
  volume: "39"
  pages: "432-435"
  doi: 10.1021/jm950407s
  pmid: "8558511"
  verified: pubmed
  note: "Cells carrying the human MC1 receptor: six hours after the peptide was washed away, 86% of melanotan II was still bound, against 65% of MT-I ([Nle4,DPhe7]alpha-MSH) and 25% of alpha-MSH; MT-II dissociated about four times more slowly than alpha-MSH. Cited for: long-lasting receptor binding; MT-I = [Nle4,D-Phe7]alpha-MSH."

hadley-2005-discovery:
  type: review
  authors: "Hadley ME"
  title: "Discovery that a melanocortin regulates sexual functions in male and female humans"
  container: "Peptides"
  year: 2005
  volume: "26"
  pages: "1687-1689"
  doi: 10.1016/j.peptides.2005.01.023
  pmid: "15996790"
  verified: pubmed
  note: "Commentary by one of the developers: the effects of melanotan II on sexual function 'were discovered accidentally while studying the effects of the peptide ... on human skin pigmentation (tanning)'. Cited for: how the sexual effects were found. Its claims about women are not backed by a published trial (none found in PubMed, 22 October 2026)."

hadley-2006-melanocortin-therapeutics:
  type: review
  authors: "Hadley ME, Dorr RT"
  title: "Melanocortin peptide therapeutics: historical milestones, clinical studies and commercialization"
  container: "Peptides"
  year: 2006
  volume: "27"
  pages: "921-930"
  doi: 10.1016/j.peptides.2005.01.029
  pmid: "16412534"
  verified: pubmed
  note: "University of Arizona developers' history: melanotan I (linear) and melanotan II (cyclic, truncated) were patented and tested clinically, MT-I for tanning and MT-II for erectile dysfunction; PT-141 (Palatin Technologies) is described as 'a new MTII analog'. Cited for: history and the relationship between the three molecules."

# ---------------------------------------------------------------- pigment cells and the sun

abdel-malek-1995-melanocyte-mitogenic:
  type: article
  authors: "Abdel-Malek Z, Swope VB, Suzuki I, Akcali C, Harriger MD, Boyce ST, Urabe K, Hearing VJ"
  title: "Mitogenic and melanogenic stimulation of normal human melanocytes by melanotropic peptides"
  container: "Proceedings of the National Academy of Sciences of the United States of America"
  year: 1995
  volume: "92"
  pages: "1789-1793"
  doi: 10.1073/pnas.92.5.1789
  pmid: "7878059"
  pmcid: PMC42605
  verified: pubmed
  note: "Human melanocytes in culture: alpha-MSH and ACTH increased cell number (50-270% above control after 8 days, depending on the cell strain) and tyrosinase activity (70-450%), and raised tyrosinase, TRP-1 and TRP-2 protein. Natural hormone, not melanotan II. Cited for: MC1R stimulation makes pigment cells both darker and more numerous in a dish."

wolf-horrell-2016-mc1r:
  type: review
  authors: "Wolf Horrell EM, Boulanger MC, D'Orazio JA"
  title: "Melanocortin 1 Receptor: Structure, Function, and Regulation"
  container: "Frontiers in Genetics"
  year: 2016
  volume: "7"
  pages: "95"
  doi: 10.3389/fgene.2016.00095
  pmid: "27303435"
  pmcid: PMC4885833
  verified: pubmed
  note: "Abstract: MC1R is a Gs-coupled receptor on melanocytes; signalling through adenylyl cyclase and cAMP up-regulates melanin production and enhances nucleotide excision repair of UV damage; loss-of-function variants give a fair, UV-sensitive, melanoma-prone phenotype. Cited for: the MC1R-cAMP-melanin chain and its role in melanoma risk."

kadekaro-2005-msh-dna-repair:
  type: article
  authors: "Kadekaro AL, Kavanagh R, Kanto H, Terzieva S, Hauser J, Kobayashi N, Schwemberger S, Cornelius J, Babcock G, Shertzer HG, Scott G, Abdel-Malek ZA"
  title: "alpha-Melanocortin and endothelin-1 activate antiapoptotic pathways and reduce DNA damage in human melanocytes"
  container: "Cancer Research"
  year: 2005
  volume: "65"
  pages: "4292-4299"
  doi: 10.1158/0008-5472.CAN-04-4535
  pmid: "15899821"
  verified: pubmed
  note: "Cultured human melanocytes: alpha-MSH acting through MC1R reduced UV-induced cell death, DNA photoproducts and oxidative stress and enhanced repair of cyclobutane pyrimidine dimers. Cited for: the argument in the other direction (MC1R signalling can protect DNA)."

wu-2020-topical-mtii-melanoma:
  type: article
  authors: "Wu JC, Tsai HE, Hsiao YH, Wu JS, Wu CS, Tai MH"
  title: "Topical MTII Therapy Suppresses Melanoma Through PTEN Upregulation and Cyclooxygenase II Inhibition"
  container: "International Journal of Molecular Sciences"
  year: 2020
  volume: "21"
  pages: "681"
  doi: 10.3390/ijms21020681
  pmid: "31968661"
  pmcid: PMC7013727
  verified: pubmed
  note: "Added in the fact-check (22 October 2026). Kaohsiung, Taiwan. Mouse B16-F10 melanoma cells in a dish and mice with established implanted melanoma: MTII did not change cell proliferation but reduced migration, invasion and colony formation, and MTII put on the skin 'significantly attenuated the tumor progression'. Full text (PMC7013727, read 23 October 2026): tumour-bearing mice were randomly divided into control and MTII groups (n = 6 each); the MC1R antibody-neutralisation experiments were done in B16-F10 cells only, not in mice; funded by Taiwan's Ministry of Science and Technology and Kaohsiung Veterans General Hospital. Cited for: the argument in the other direction (in a mouse model of an existing melanoma, MTII slowed it), which says nothing about whether it starts or speeds melanoma in human moles."

ema-epar-imcivree:
  type: label
  authors: "European Medicines Agency"
  title: "Imcivree (setmelanotide): EPAR — medicine overview"
  year: 2026
  url: https://www.ema.europa.eu/en/medicines/human/EPAR/imcivree
  accessed: 2026-10-22
  verified: url
  note: "Added in the fact-check. 'The active substance in Imcivree, setmelanotide, attaches to and activates a receptor called melanocortin receptor 4'; used for obesity and hunger in acquired hypothalamic obesity, POMC, PCSK1 or LEPR deficiency and Bardet Biedl syndrome. Authorised 16 July 2021 (EMA medicines JSON). Cited for: setmelanotide is an authorised MC4 receptor agonist."

barnetson-2006-afamelanotide-photoprotection:
  type: article
  authors: "Barnetson RS, Ooi TK, Zhuang L, Halliday GM, Reid CM, Walker PC, Humphrey SM, Kleinig MJ"
  title: "[Nle4-D-Phe7]-alpha-melanocyte-stimulating hormone significantly increased pigmentation and decreased UV damage in fair-skinned Caucasian volunteers"
  container: "The Journal of Investigative Dermatology"
  year: 2006
  volume: "126"
  pages: "1869-1878"
  doi: 10.1038/sj.jid.5700317
  pmid: "16763547"
  verified: pubmed
  note: "Randomised controlled trial (PubMed publication type), 65 completers (MT-I, now afamelanotide, not melanotan II): melanin density rose in all treated subjects; in volunteers with a low minimal erythemal dose (people who burn easily), sunburn cells after 3 MED of UV fell by more than 50%; thymine dimers fell by 59% in the basal layer. Cited for: melanin made by an MC1R agonist can reduce UV damage, shown for a different molecule."

young-2020-pigmentation-sunscreens:
  type: article
  authors: "Young AR"
  title: "Comparison of Skin Photoprotection by Pigmentation and Sunscreens"
  container: "Journal of Cosmetic Science"
  year: 2020
  volume: "71"
  pages: "217-226"
  pmid: "33022206"
  verified: pubmed
  note: "St John's Institute of Dermatology, King's College London. PubMed has no DOI and lists the author's name in garbled form ('Antony R Y'); the affiliation line gives the initials A.R.Y. Abstract: 'Tanning in those with light skin offers relatively modest photoprotection'; deeply pigmented skin offers a high level. Cited for: a tan on light skin protects only modestly."

coelho-2015-uva-tan:
  type: article
  authors: "Coelho SG, Yin L, Smuda C, Mahns A, Kolbe L, Hearing VJ"
  title: "Photobiological implications of melanin photoprotection after UVB-induced tanning of human skin but not UVA-induced tanning"
  container: "Pigment Cell & Melanoma Research"
  year: 2015
  volume: "28"
  pages: "210-216"
  doi: 10.1111/pcmr.12331
  pmid: "25417821"
  pmcid: PMC4333058
  verified: pubmed
  note: "Full text (PMC): 12 volunteers (5 women, 7 men) given comparable tans on areas of the lower back with UVA, UVB or both over two weeks, then challenged with 1.5 MED of UVA+UVB one week later: 'The UVA-induced tans failed to even provide a minimal SPF of 1.5'; UVB-induced tans gave 'a very modest photoprotective benefit'. Cited for: how a tan is made matters; a tan is not the same as protection."

boniol-2012-sunbed-melanoma:
  type: meta-analysis
  authors: "Boniol M, Autier P, Boyle P, Gandini S"
  title: "Cutaneous melanoma attributable to sunbed use: systematic review and meta-analysis"
  container: "BMJ"
  year: 2012
  volume: "345"
  pages: "e4757"
  doi: 10.1136/bmj.e4757
  pmid: "22833605"
  pmcid: PMC3404185
  verified: pubmed
  note: "27 observational studies: ever use of sunbeds, summary relative risk of melanoma 1.20 (95% CI 1.08-1.34); first use before age 35, 1.87 (1.41-2.48); risk rises with the number of sessions. Cited for: sunbeds raise melanoma risk on their own, which confounds every melanotan case report."

# ---------------------------------------------------------------- brain, blood pressure

fan-1997-melanocortin-feeding:
  type: article
  authors: "Fan W, Boston BA, Kesterson RA, Hruby VJ, Cone RD"
  title: "Role of melanocortinergic neurons in feeding and the agouti obesity syndrome"
  container: "Nature"
  year: 1997
  volume: "385"
  pages: "165-168"
  doi: 10.1038/385165a0
  pmid: "8990120"
  verified: pubmed
  note: "Vollum Institute, Oregon (with the Arizona chemist who supplied the peptides). Melanotan II injected into the brain's ventricles inhibited feeding in four mouse models of overeating; the antagonist SHU9119 blocked this and increased feeding. Cited for: brain melanocortin receptors (MC3/MC4) curb eating."

trivedi-2003-mt2-anorectic-site:
  type: article
  authors: "Trivedi P, Jiang M, Tamvakopoulos CC, Shen X, Yu H, Mock S, Fenyk-Melody J, Van der Ploeg LH, Guan XM"
  title: "Exploring the site of anorectic action of peripherally administered synthetic melanocortin peptide MT-II in rats"
  container: "Brain Research"
  year: 2003
  volume: "977"
  pages: "221-230"
  doi: 10.1016/s0006-8993(03)02683-0
  pmid: "12834882"
  verified: pubmed
  note: "Merck Research Laboratories. Intravenous MT-II suppressed food intake in rats, but brain penetration was negligible: labelled MT-II reached only circumventricular organs outside the blood-brain barrier (subfornical organ, median eminence, area postrema, choroid plexus). Cited for: an independent animal replication, and where an injected dose acts."

benoit-2003-mt2-taste-aversion:
  type: article
  authors: "Benoit SC, Sheldon RJ, Air EL, Messerschmidt P, Wilmer KA, Hodge KM, Jones MB, Eckstein DM, McOsker CC, Woods SC, Seeley RJ"
  title: "Assessment of the aversive consequences of acute and chronic administration of the melanocortin agonist, MTII"
  container: "International Journal of Obesity and Related Metabolic Disorders"
  year: 2003
  volume: "27"
  pages: "550-556"
  doi: 10.1038/sj.ijo.0802280
  pmid: "12704398"
  verified: pubmed
  note: "University of Cincinnati. In rats, single and 7-day MTII produced a conditioned taste aversion, like lithium chloride, and the aversion was more resistant to extinction; 'The reduction in food intake caused by MTII is accompanied by aversive consequences regardless of route of administration.' Cited for: the animal counterpart of nausea."

wessells-2003-mt2-spinal-erection:
  type: article
  authors: "Wessells H, Hruby VJ, Hackett J, Han G, Balse-Srinivasan P, Vanderah TW"
  title: "Ac-Nle-c[Asp-His-DPhe-Arg-Trp-Lys]-NH2 induces penile erection via brain and spinal melanocortin receptors"
  container: "Neuroscience"
  year: 2003
  volume: "118"
  pages: "755-762"
  doi: 10.1016/s0306-4522(02)00866-7
  pmid: "12710982"
  verified: pubmed
  note: "Awake male rats: MT-II given into the brain, the spinal fluid or a vein caused erections in a dose-dependent way; SHU9119 blocked them; injected into the penis it did nothing. Cited for: erections start in the brain and lower spinal cord, not in the penis; the formula of melanotan II."

fugate-2015-pres:
  type: review
  authors: "Fugate JE, Rabinstein AA"
  title: "Posterior reversible encephalopathy syndrome: clinical and radiological manifestations, pathophysiology, and outstanding questions"
  container: "The Lancet Neurology"
  year: 2015
  volume: "14"
  pages: "914-925"
  doi: 10.1016/S1474-4422(15)00111-8
  pmid: "26184985"
  verified: pubmed
  note: "Mayo Clinic review: PRES should be considered with acute neurological symptoms in people with blood pressure fluctuations, among other settings; mild forms may cause only headache or a seizure; brain swelling usually resolves within days or weeks, but severe forms can cause bleeding and death. Cited for: what PRES is and how blood-pressure swings are linked to it."

# ---------------------------------------------------------------- trials in people

dorr-1996-mt2-phase-1:
  type: trial
  authors: "Dorr RT, Lines R, Levine N, Brooks C, Xiang L, Hruby VJ, Hadley ME"
  title: "Evaluation of melanotan-II, a superpotent cyclic melanotropic peptide in a pilot phase-I clinical study"
  container: "Life Sciences"
  year: 1996
  volume: "58"
  pages: "1777-1784"
  doi: 10.1016/0024-3205(96)00160-9
  pmid: "8637402"
  verified: pubmed
  note: "Single-blind, alternating-day, saline-controlled pilot in 3 healthy men, injections under the skin on weekdays for two weeks: two of three had darker skin on the face, upper body and buttock one week after the last dose; mild nausea at most dose levels; somnolence and fatigue in one of two men at the highest dose; a stretching and yawning complex with spontaneous erections for 1-5 hours. Cited for: the first human data on tanning and side effects."

wessells-1998-mt2-psychogenic-ed:
  type: trial
  authors: "Wessells H, Fuciarelli K, Hansen J, Hadley ME, Hruby VJ, Dorr R, Levine N"
  title: "Synthetic melanotropic peptide initiates erections in men with psychogenic erectile dysfunction: double-blind, placebo controlled crossover study"
  container: "The Journal of Urology"
  year: 1998
  volume: "160"
  pages: "389-393"
  pmid: "9679884"
  verified: pubmed
  note: "PubMed record has no DOI. Double-blind, placebo-controlled crossover in 10 men with erectile dysfunction of no known physical cause, RigiScan for 6 hours: erections in 8 of 10 with melanotan II; tip rigidity above 80% for a mean 38.0 minutes against 3.0 with placebo; nausea, stretching and yawning and less appetite more often than with placebo. Cited for: the first controlled trial."

wessells-2000-mt2-organic-ed:
  type: trial
  authors: "Wessells H, Gralnek D, Dorr R, Hruby VJ, Hadley ME, Levine N"
  title: "Effect of an alpha-melanocyte stimulating hormone analog on penile erection and sexual desire in men with organic erectile dysfunction"
  container: "Urology"
  year: 2000
  volume: "56"
  pages: "641-646"
  doi: 10.1016/s0090-4295(00)00680-4
  pmid: "11018622"
  verified: pubmed
  note: "Double-blind, placebo-controlled crossover in 10 men with erectile dysfunction and physical risk factors: erections after 12 of 19 melanotan II injections against 1 of 21 placebo doses; rigidity above 80% for 45.3 against 1.9 minutes; more sexual desire; severe nausea after 4 of 19 injections. Cited for: the second controlled trial."

wessells-2000-mt2-review-20-men:
  type: review
  authors: "Wessells H, Levine N, Hadley ME, Dorr R, Hruby V"
  title: "Melanocortin receptor agonists, penile erection, and sexual motivation: human studies with Melanotan II"
  container: "International Journal of Impotence Research"
  year: 2000
  volume: "12 Suppl 4"
  pages: "S74-S79"
  doi: 10.1038/sj.ijir.3900582
  pmid: "11035391"
  verified: pubmed
  note: "The investigators' pooled account of the two crossover trials (20 men): erections in 17 of 20 without sexual stimulation; more desire after 13 of 19 melanotan II doses against 4 of 21 placebo doses; nausea and yawning frequent, severe nausea in 12.9%. Cited for: the pooled numbers."

ctgov-nct07437560:
  type: registry
  authors: "ClinicalTrials.gov (U.S. National Library of Medicine)"
  title: "NCT07437560: A Randomized, Double-Blind, Placebo-Controlled Phase 2 Study of Melanotan II as an Adjunct to Narrowband UV-B Phototherapy in Adults With Stable Nonsegmental Vitiligo"
  year: 2026
  url: https://clinicaltrials.gov/study/NCT07437560
  accessed: 2026-10-22
  verified: registry
  note: "Read through the ClinicalTrials.gov API on 22 October 2026: recruiting, 60 participants, one site in Shenzhen, China, start 2 February 2026, primary completion 14 February 2027, no results. The brief summary calls itself 'This example interventional study record' and the description 'This example trial'. Same sponsor, site, contact and dates as the BPC-157 record NCT07437547. Cited for: the only registered trial, and why we treat it with caution."

# ---------------------------------------------------------------- case reports and reviews of harms

cousen-2009-eruptive-naevi:
  type: article
  authors: "Cousen P, Colver G, Helbling I"
  title: "Eruptive melanocytic naevi following melanotan injection"
  container: "The British Journal of Dermatology"
  year: 2009
  volume: "161"
  pages: "707-708"
  doi: 10.1111/j.1365-2133.2009.09362.x
  pmid: "19575725"
  verified: pubmed
  note: "Letter, case report; PubMed has no abstract (index terms: female, young adult, subcutaneous injections). Cited for: the title finding only."

paurobally-2011-melanotan-melanoma:
  type: article
  authors: "Paurobally D, Jason F, Dezfoulian B, Nikkels AF"
  title: "Melanotan-associated melanoma"
  container: "The British Journal of Dermatology"
  year: 2011
  volume: "164"
  pages: "1403-1405"
  doi: 10.1111/j.1365-2133.2011.10273.x
  pmid: "21564053"
  verified: pubmed
  note: "Letter, case report; PubMed has no abstract (index terms: female adult, melanoma, sunbathing, suntan). Cited for: the title finding only."

ong-2012-melanoma-in-situ:
  type: article
  authors: "Ong S, Bowling J"
  title: "Melanotan-associated melanoma in situ"
  container: "The Australasian Journal of Dermatology"
  year: 2012
  volume: "53"
  pages: "301-302"
  doi: 10.1111/j.1440-0960.2012.00915.x
  pmid: "22724573"
  verified: pubmed
  note: "Oxford, UK. Abstract: injectable melanotan is available online despite being unlicensed with an unproven safety record; 'We report a case of melanotan-associated melanoma in situ' (index terms: female, young adult). Cited for: a reported melanoma in situ."

hjuler-2014-melanotan-melanoma:
  type: article
  authors: "Hjuler KF, Lorentzen HF"
  title: "Melanoma associated with the use of melanotan-II"
  container: "Dermatology"
  year: 2014
  volume: "228"
  pages: "34-36"
  doi: 10.1159/000356389
  pmid: "24355990"
  verified: pubmed
  note: "Aarhus, Denmark. A 20-year-old woman with fair skin (Fitzpatrick type II) who self-injected melanotan II for 3-4 weeks to boost sunbed tanning had a melanoma on the buttock three months later. 'As the drug is unlicensed and incompletely tested, the extent and types of adverse effects are unknown.' Cited for: a melanoma case with sunbed use as a confounder."

schulze-2014-naevi-24-hours:
  type: article
  authors: "Schulze F, Erdmann H, Hardkop LH, Anemüller W, Rose C, Zillikens D, Fischer TW"
  title: "Eruptive naevi and darkening of pre-existing naevi 24 h after a single mono-dose injection of melanotan II"
  container: "European Journal of Dermatology"
  year: 2014
  volume: "24"
  pages: "107-109"
  doi: 10.1684/ejd.2013.2227
  pmid: "24334249"
  verified: pubmed
  note: "Lübeck, Germany. Letter; PubMed has no abstract (index terms: male, young adult). Cited for: the title finding only (new and darker moles within 24 hours of one injection)."

mang-2012-dermoscopy-changes:
  type: article
  authors: "Mang R, Krahl D, Assmann T"
  title: "[Dermoscopic changes in melanocytic nevi during use of melanotan II]"
  container: "Der Hautarzt"
  year: 2012
  volume: "63"
  pages: "880-884"
  doi: 10.1007/s00105-012-2420-1
  pmid: "23052015"
  lang: de
  verified: pubmed
  note: "Wuppertal, Germany. A 24-year-old man injected melanotan II bought online; his moles were followed with sequential videodermoscopy before and during use; 'The observed dermoscopic changes made it difficult to differentiate a nevus from a melanoma.' Cited for: why skin checks get harder."

vadner-2026-five-melanomas:
  type: article
  authors: "Vadner DJ, Smith S"
  title: "Five primary melanomas in situ in a patient with recent tanning bed use, melanotan exposure, and anabolic hormone use"
  container: "JAAD Case Reports"
  year: 2026
  volume: "73"
  pages: "111-114"
  doi: 10.1016/j.jdcr.2026.05.009
  pmid: "42328529"
  pmcid: PMC13279914
  verified: pubmed
  note: "Full text (Europe PMC; re-read 22 October 2026 in the fact-check): a 49-year-old man with fair skin, many moles and a grandmother with melanoma used sunbeds, melanotan II then melanotan I, and testosterone from an unregulated source; within about a week several existing moles 'turned black'; five biopsied lesions were melanoma in situ arising in severely dysplastic naevi. The authors write that causality cannot be established, that sunbed use is 'a major confounding variable', and that 'it is possible that these melanomas were preexisting and became clinically apparent due to pigmentary changes'. Cited for: the most recent case and its confounders. The doses in the report are not repeated on this site."

