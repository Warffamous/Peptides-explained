  note: "Sofia, Bulgaria. Full text: a 42-year-old man (a smoker who also used sunbeds, with slight brown gum pigment noted two years earlier) injected melanotan II and developed darker and wider brown patches on the gums and new patches on the inner cheeks; one month after stopping the cheek patches had nearly gone; at three months the gum pigment persisted, fainter. Some existing moles darkened. The author notes smoking and sunbeds as confounders. Cited for: pigment in the mouth, and how slowly it fades."

burian-2019-eruptive-naevi-review:
  type: review
  authors: "Burian EA, Jemec GBE"
  title: "Eruptive Melanocytic Nevi: A Review"
