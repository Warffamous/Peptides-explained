# Sources for compounds/melanotan-ii (group: melanotan-ii).
# Every scholarly entry was looked up in PubMed on 22 October 2026 (PubMed MCP tool and NCBI
# E-utilities); authors, title, journal, year (of the journal issue), volume, pages, DOI and PMID
# were copied from the PubMed record. Where the record has no DOI, none is given. Every regulator,
# law, registry and database URL was fetched on the accessed date and contains what it is cited for
# (research/melanotan-ii.md, "Verification log").
#
# Reused from other groups, not re-registered here: pubchem-melanotan-ii, king-2007-melanocortin-erection,
# mestria-2021-seized-melanotan-bremelanotide, greenfield-2009-mc4r-blood-pressure (pt-141.yaml); dailymed-vyleesi-label, dreyer-2019-melanotan-priapism,
# nelson-2012-melanotan-rhabdomyolysis, cardones-2009-eruptive-nevi, nhs-priapism, nhs-moles, nhs-headaches
