  pages: "806-808"
  doi: 10.1016/j.ijom.2025.03.014
  pmid: "40210573"
  verified: pubmed
  note: "UK. A 22-year-old woman who had used a melanotan II nasal spray for tanning developed a mucosal malignant melanoma in the upper jaw, treated with surgery and immunotherapy. Cited for: a reported melanoma inside the mouth after a nasal spray."

bonchev-2026-oral-pigmentation:
  type: article
  authors: "Bonchev A"
  title: "Changes in Oral Mucosa Associated with Melanotan II Injections: A Case Report"
