# ---------------------------------------------------------------- regulators

bfarm-2010-melanotan-warning:
  type: regulator
  authors: "Bundesinstitut für Arzneimittel und Medizinprodukte (BfArM)"
  title: "Bundesinstitut für Arzneimittel und Medizinprodukte (BfArM) warnt vor Anwendung melanotanhaltiger Produkte für kosmetische Zwecke (Pressemitteilung 14/10)"
  year: 2010
  url: https://www.bfarm.de/SharedDocs/Pressemitteilungen/DE/2010/pm14-2010.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "Press release of 28 October 2010: products with melanotan I or II offered online are not authorised as medicines; their quality, safety and efficacy have not been adequately studied; known risks concern the heart and circulation, the digestive tract and unintended changes in skin colour; self-injecting an implant carries a risk of infection; afamelanotide (melanotan I) was then in clinical trials and available in a compassionate-use programme for EPP."

fagg-melanotan-warning:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Nagemaakte en illegale geneesmiddelen: opgepast! (Melanotan)"
  year: 2013
  url: https://www.fagg-afmps.be/nl/news/news_melanotan
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Page last updated 29 January 2013: melanotan (also offered as MT2) is an experimental product not authorised as a medicine, so its distribution is illegal; the agency cannot guarantee quality, safety or efficacy; in its most recent investigation insulin was found in medicines sold as melanotan, and misuse of insulin can cause a coma or death; analyses of illegal medicines found missing, too little or too much active substance and toxic substances. Fact-check, 22 October 2026: the live page returned only a bot-verification screen (not bypassed), so the text was confirmed on the Internet Archive copy of this URL dated 10 July 2026 (web.archive.org, used for checking only, not linked)."

mhra-2024-foi-melanotan-ii:
  type: regulator
  authors: "Medicines and Healthcare products Regulatory Agency (MHRA)"
  title: "FOI 24/274: Side effects reports of melanotan II products"
  year: 2024
  url: https://assets.publishing.service.gov.uk/media/669fbd3aa3c2a28abb50d55a/Final_Redaction_FOI_24_274.pdf
  accessed: 2026-10-22
  verified: url
  note: "Letter of 17 April 2024: products containing melanotan II 'are classified as medicines if they are injectable or pens'; a nasal spray only if sold with medicinal claims; advice to users is 'to stop using them immediately' and report side effects through the Yellow Card scheme; sale, supply and advertising of unauthorised medicines is not permitted; 16 UK suspected adverse-reaction reports between 1 January 2012 and 31 December 2022; the MHRA has removed melanotan products from the market for over 10 years."

mhra-2021-foi-melanotan-ii:
  type: regulator
  authors: "Medicines and Healthcare products Regulatory Agency (MHRA)"
  title: "FOI 21/1237: Number of reports received via the Yellow Card scheme for melanotan II products including nasal sprays and injections between 2011-2021"
  year: 2021
  url: https://assets.publishing.service.gov.uk/media/67bc97a898ea2db44fadddb1/FOI_21-1237_.pdf
  accessed: 2026-10-22
  verified: url
  note: "Letter of 20 December 2021: whether a melanotan II product is a medicine is decided case by case, and 'injectable tanning products containing melanotan II are not automatically medicines'; 13 suspected adverse-reaction reports between 2011 and 2021. Cited for: the earlier, case-by-case position (superseded in wording by FOI 24/274)."

fr-2016-melanotan-debarment:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Debarment Order (FR Doc. 2016-27244), 14 November 2016"
  container: "Federal Register"
  year: 2016
  url: https://www.federalregister.gov/d/2016-27244
  accessed: 2026-10-23
  verified: url
  note: "Text read through the Federal Register API (re-read 23 October 2026): the FDA permanently debarred a man convicted of federal felonies for a company that sold melanotan II, 'an unapproved new drug', online as an injectable tanning product, some of it made in and imported from China while advertised as US-made. The official title names the person; the title here is descriptive and the URL is the Federal Register's own short link (it redirects to the full document), so the site does not name a seller. It is the only Federal Register document that mentions melanotan."
