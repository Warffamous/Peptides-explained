fr-2026-22192-hhs-peptide-enforcement-discretion:
  type: regulator
  authors: "U.S. Department of Health and Human Services"
  title: "Enforcement Discretion Policy Regarding 503A Compounding Using Certain Peptide Bulk Drug Substances; Notice of availability (FR Doc. 2026-22192, Docket No. HHS-OASH-2026-0496)"
  container: "Federal Register"
  year: 2026
  url: https://www.federalregister.gov/documents/2026/10/30/2026-22192/enforcement-discretion-policy-regarding-503a-compounding-using-certain-peptide-bulk-drug-substances
  accessed: 2026-11-03
  verified: url
  note: "Read 3 November 2026 (text of the public-inspection PDF and the govinfo PDF, 91 FR 68526; filed 28 October 2026, published 30 October 2026; signed by HHS Secretary Robert F. Kennedy, Jr.; RIN 0910-ZD94). Notice of availability of a draft policy: 'HHS does not intend to take enforcement action against a State-licensed pharmacy, Federal facility, or licensed physician compounding a drug product using a peptide bulk drug substance found in Appendix A' while the 503A bulks list 'is developed through rulemaking'; 'FDA's future rulemakings may propose adding some or all of these peptides to the 503A bulks list'. Based on 'the Pharmacy Compounding Advisory Committee meetings and data regarding utilization of peptides'. HHS may revisit the policy if 'a safety signal or product quality issue arises'; it is 'not binding on HHS or the public'. Comments until 2 weeks after publication. The notice gives no vote counts and does not reproduce Appendix A; the policy itself, with Appendix A, is hhs-2026-503a-peptide-policy. Comments on regulations.gov docket HHS-OASH-2026-0496 until 13 November 2026 (US Eastern time)."

hhs-2026-503a-peptide-policy:
  type: regulator
  authors: "U.S. Department of Health and Human Services"
  title: "Enforcement Discretion Policy Regarding 503A Compounding Using Certain Peptide Bulk Drug Substances (with Appendix A, the list of peptides, and Appendix B)"
  year: 2026
  url: https://www.hhs.gov/sites/default/files/hhs-503a-peptide-enforcement-discretion-policy-appendix-b.pdf
  accessed: 2026-11-03
  verified: url
  note: "The address the Federal Register notice gives for the policy (fr-2026-22192-hhs-peptide-enforcement-discretion). Read 3 November 2026 (the text of the PDF, 380 KB). Appendix A, 'List of Peptide Bulk Drug Substances Addressed by HHS Interim Enforcement Policy Regarding 503A Compounding': 1. BPC-157, 2. Epitalon, 3. KPV, 4. MOTS-c, 5. Semax, 6. TB-500. 'Until a peptide bulk drug substance is addressed in a final rule as being included or not included on the 503A bulks list, HHS does not intend to take action against a State-licensed pharmacy, Federal facility, or licensed physician' compounding with it when all of these are present: the peptide is in Appendix A; it has the identity and route limits of Appendix B (BPC-157 acetate: subcutaneous, intramuscular, oral and topical; TB-500 acetate: subcutaneous or intramuscular injection; Semax free base: intranasal); the bulk substance comes from an FDA-registered (section 510), CGMP-compliant manufacturer with a valid certificate of analysis; serious adverse events and quality problems are reported to FDA MedWatch and the States; the label says 'This is a compounded drug product. Not for resale.'; one active ingredient per product; documented oral bioavailability for oral forms; no device other than an FDA 510(k)-cleared syringe; and all other FD&C Act requirements, including a patient-specific prescription. Stated aim: to 'discourage the continued, widespread use of certain research-use-only peptides supplied by foreign manufacturers that pose a safety risk to US patients'. Appendix B summarises each peptide's record; for TB-500, epitalon, KPV and MOTS-c it says CDER (the FDA's drug centre) had recommended against listing them (the BPC-157 and Semax passages could not be read in full from the PDF's text, so nothing is recorded for them here; the July 2026 PCAC briefing, fda-pcac-2026-briefing-intro, proposed listing none of the 14 forms). Not binding; HHS may revisit it if a safety signal or product-quality issue arises."

