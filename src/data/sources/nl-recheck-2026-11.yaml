  year: 2026
  url: https://www.federalregister.gov/documents/search?conditions%5Bterm%5D=503A&conditions%5Bpublication_date%5D%5Bgte%5D=10%2F20%2F2026
  accessed: 2026-11-03
  verified: url
  note: "Run through the federalregister.gov documents API on 3 November 2026, all agencies, publication date from 20 October 2026: '503A' 1 result, 'bulk drug substances' 1 result, 'Pharmacy Compounding Advisory Committee' 1 result. In each case the result is the HHS notice of availability of 30 October 2026 (FR Doc. 2026-22192, fr-2026-22192-hhs-peptide-enforcement-discretion), which is not a proposed or final rule. No PCAC meeting notice. The public-inspection list of 3 November 2026 (documents for 4 November) had no document on compounding, 503A, bulk drug substances, peptides or an FDA advisory committee meeting. Follows federalregister-503a-search-2026-10-20."

