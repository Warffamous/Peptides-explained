# Sources for the History section: history/ (index), history/timeline (with src/data/timeline.yaml) and
# history/how-we-got-here. Group "history". Written 22 October 2026. Every entry re-checked by the independent
# fact-checker on 22 October 2026 (PubMed records, Crossref, and fresh fetches of every URL); us-fdc-act-1938 and
# nobel-1977-medicine-press were added by the fact-checker. See research/history.md, "Fact-check log".
#
# How each entry was checked (22 October 2026):
# - Scholarly entries: authors, title, journal, year, volume, pages, DOI, PMID and PMCID copied from the PubMed record
#   (PubMed tools). The two 1950s-60s chemistry papers in the Journal of the American Chemical Society are not in
#   PubMed: their metadata were copied from the Crossref record of the DOI (verified: doi).
# - Regulator, law and web entries: fetched with curl and read for the sentence each one supports (see the note).
#   EUR-Lex returns HTTP 202 with an empty body to scripts, so EU texts were read through the Publications Office
#   CELLAR resolver (publications.europa.eu/resource/celex/<CELEX>), which returns the same document; the url field
#   gives the allowlisted EUR-Lex address.
# - Drugs@FDA dates: the ORIG-1 approval date on the Drugs@FDA overview page, cross-checked against the openFDA
#   drugsfda API (api.fda.gov) on the same day.
#
# Reused from other files, not repeated here: eu-directive-2001-83, nl-geneesmiddelenwet, fda-pcac-2026-07-meeting,
# fda-pcac-2026-materials (shared.yaml); nobel-1958-sanger-speech, nobel-1984-merrifield-press,
