  note: "Assessment under the centralised procedure 'can take up to 210 days, not counting clock stops'; the CHMP 'can reduce the timeframe to 150 days' for products 'of major interest for public health and therapeutic innovation'."

ema-prime:
  type: regulator
  authors: "European Medicines Agency"
  title: "PRIME: priority medicines"
  year: 2026
  url: https://www.ema.europa.eu/en/human-regulatory-overview/research-development/prime-priority-medicines
  accessed: 2026-10-22
  verified: url
  note: "'PRIME is a scheme run by the European Medicines Agency (EMA) to enhance support for the development of medicines targeting unmet medical needs. It is based on early dialogue with companies to optimise development plans and speed up evaluation.' Medicines in PRIME can expect to be eligible for accelerated assessment. The reflection paper was adopted by the CHMP in February 2016; the applicant guidance and justification template were first published on 7 March 2016."

ema-compassionate-use:
  type: regulator
  authors: "European Medicines Agency"
  title: "Compassionate use"
  year: 2026
  url: https://www.ema.europa.eu/en/human-regulatory-overview/research-development/compassionate-use
  accessed: 2026-10-22
  verified: url
  note: "Compassionate use lets 'products in development' be made available to groups of patients with no satisfactory authorised therapy 'who cannot enter clinical trials'; programmes are run by Member States under their own rules (Art. 83 of Regulation 726/2004); EMA recommendations 'do not create a legal framework'. Not to be confused with 'named-patient basis' treatment, where a doctor obtains a medicine directly from the manufacturer for an individual patient on the doctor's own responsibility. Patients should first be considered for clinical trials."

