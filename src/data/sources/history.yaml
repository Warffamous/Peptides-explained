nl-wog-1958:
  type: law
  authors: "Koninkrijk der Nederlanden"
  title: "Wet van 28 juli 1958, houdende nieuwe regelen nopens de geneesmiddelenvoorziening en de uitoefening der artsenijbereidkunst (Wet op de geneesmiddelenvoorziening), Stb. 1958, 408"
  container: "Staatsblad van het Koninkrijk der Nederlanden"
  year: 1958
  url: https://repository.overheid.nl/frbr/officielepublicaties/stb/1958/stb-1958-408/1/pdf/stb-1958-408.pdf
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Read in full (pdftotext; identical to zoek.officielebekendmakingen.nl/stb-1958-408.pdf). Replaced the pharmacy law of 1 June 1865. Art. 3(1): the College ter beoordeling van verpakte geneesmiddelen keeps a register of packaged medicines that may be made and supplied, and enters those that 'naar redelijkerwijze mag worden aangenomen de aangeprezen werking bezitten, niet schadelijk zijn voor de gezondheid bij gebruik overeenkomstig het voorschrift'. Art. 3(3): making, selling, supplying or importing unregistered packaged medicines is prohibited; art. 3(4): exceptions for products still being tested. Art. 29: the College is set up for registration and withdrawal of registration. Art. 37 (re-read by the fact-checker, 22 October 2026): the act 'treedt in werking op een door Ons te bepalen tijdstip' and parts may come into force at different times. The date the registration articles came into force is not printed in the act and was not verified."

