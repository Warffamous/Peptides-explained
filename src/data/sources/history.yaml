# ---------------------------------------------------------------- thalidomide

vargesson-2015-thalidomide:
  type: review
  authors: "Vargesson N"
  title: "Thalidomide-induced teratogenesis: history and mechanisms"
  container: "Birth Defects Research. Part C, Embryo Today: Reviews"
  year: 2015
  volume: "105"
  pages: "140-156"
  doi: 10.1002/bdrc.21096
  pmid: "26043938"
  pmcid: PMC4737249
  verified: pubmed
  note: "University of Aberdeen. Read in PMC full text. Released in the late 1950s by Chemie Grünenthal as a sedative, then used for morning sickness; 'marketed and distributed in 46 countries'; 'advertised as completely safe' until banned in November 1961; Lenz (Germany) and McBride (Australia) confirmed the link in 1961; 'Between 1957 and 1962, thalidomide caused severe birth defects in over 10,000 children'; 'Infant mortality in babies born with severe thalidomide embryopathy is as high as 40%'; withdrawn in the UK in November 1961 and from most of the world by 1962; not licensed in the US because of Frances Kelsey; mice are less sensitive to thalidomide than primates and rabbits, so the disaster showed species differences in drug response and changed drug testing; the sensitive window is days 20-36 after fertilisation."

# ---------------------------------------------------------------- regulation: United States

fda-history-milestones:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Milestones in U.S. Food and Drug Law"
  year: 2023
  url: https://www.fda.gov/about-fda/fda-history/milestones-us-food-and-drug-law
  accessed: 2026-10-22
  verified: url
  note: "Content current as of 30 January 2023. 1937: Elixir of Sulfanilamide, containing diethylene glycol, 'kills 107 persons, many of whom are children'. 1938: the FD&C Act requires new drugs 'to be shown safe before marketing'. 1951: Durham-Humphrey Amendment (prescription-only drugs). 1962: thalidomide 'found to have caused birth defects in thousands of babies born in western Europe'; news of Frances Kelsey keeping it off the US market; Kefauver-Harris Drug Amendments: 'For the first time, drug manufacturers are required to prove to FDA the effectiveness of their products before marketing them.' 1966: FDA contracts the National Academy of Sciences to evaluate the effectiveness of 4,000 drugs approved on safety alone between 1938 and 1962. 1983: Orphan Drug Act. 1992: Prescription Drug User Fee Act."

fda-2006-promoting-safe-effective-drugs:
  type: web
  authors: "Meadows M (FDA Consumer magazine)"
  title: "Promoting Safe and Effective Drugs for 100 Years"
  container: "FDA Consumer magazine, Centennial Edition, January–February 2006 (fda.gov)"
  year: 2006
  url: https://www.fda.gov/about-fda/histories-product-regulation/promoting-safe-effective-drugs-100-years
  accessed: 2026-10-22
  verified: url
  note: "Content current as of 23 April 2019. 1906 Act: 'no requirement ... that any information be submitted to the FDA before marketing'. 1938 Act passed after 107 people died from Elixir Sulfanilamide (a 'chemical relative of antifreeze'); signed 25 June 1938; under it, an application 'automatically became approved' if the FDA did not act in time. October 1962 amendments: firms had to provide 'substantial evidence of effectiveness'; Temple: 'That evidence had to consist of adequate and well-controlled studies, a revolutionary requirement' and the FDA had to specifically approve an application before marketing; the Secretary was asked to set rules for investigations, 'including a requirement for the informed consent of study subjects'; the amendments formalised good manufacturing practices, required adverse-event reporting and moved prescription-drug advertising to the FDA. Treatment IND proposed 1982, final regulation 1987. Accelerated approval 'formalized in 1992', based on an effect such as tumour shrinkage, on condition the maker verifies clinical benefit. PDUFA 1992: user fees to speed reviews; Woodcock: the review process was criticised 'for being too slow'."

us-fdc-act-1938:
  type: law
  authors: "United States Congress"
  title: "Federal Food, Drug, and Cosmetic Act, Public No. 717 (75th Congress), chapter 675, 52 Stat. 1040, approved 25 June 1938"
  container: "United States Statutes at Large, volume 52"
  year: 1938
  url: https://www.govinfo.gov/content/pkg/STATUTE-52/pdf/STATUTE-52-Pg1040-2.pdf
  accessed: 2026-10-22
  verified: url
  note: "Added by the fact-checker, 22 October 2026. Read in full (pdftotext of the Statutes at Large PDF from govinfo.gov; the file opens with the end of chapter 653 and then 'June 25, 1938 [S.5] [Public, No. 717] [CHAPTER 675] AN ACT ... Federal Food, Drug, and Cosmetic Act'). Sec. 505(b): a new-drug application must contain full reports of the investigations made to show whether or not the drug is safe for use, its components and composition, and 'a full description of the methods used in, and the facilities and controls used for, the manufacture, processing, and packing of such drug'. Sec. 505(c): the application 'shall become effective on the sixtieth day after the filing thereof' unless the Secretary postpones it (to at most 180 days). Sec. 505(d): the Secretary refuses to let it become effective if the reports 'do not include adequate tests by all methods reasonably applicable to show whether or not such drug is safe', if the tests show it unsafe or do not show it safe, or if the manufacturing methods, facilities and controls 'are inadequate to preserve its identity, strength, quality, and purity'. No effectiveness requirement. Cited for: the 1938 safety and manufacturing requirements, and the 60-day default."

us-pl-87-781-drug-amendments-1962:
  type: law
  authors: "United States Congress"
  title: "Public Law 87-781 (Drug Amendments of 1962), 76 Stat. 780, approved 10 October 1962"
  container: "United States Statutes at Large, volume 76"
  year: 1962
  url: https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg780.pdf
  accessed: 2026-10-22
  verified: url
  note: "Read in full (pdftotext). Title: 'to assure the safety, effectiveness, and reliability of drugs'. Sec. 102: an application is refused if 'there is a lack of substantial evidence that the drug will have the effect it purports or is represented to have'; 'substantial evidence' means 'evidence consisting of adequate and well-controlled investigations, including clinical investigations, by experts qualified by scientific training and experience'. Sec. 103: investigators must inform people given investigational drugs (or their representatives) and 'obtain the consent of such human beings or their representatives, except where they deem it not feasible or, in their professional judgment, contrary to the best interests of such human beings'. Also manufacturing controls (Sec. 101), records and reports (Sec. 103) and prescription-drug advertisements (Sec. 131)."

junod-2008-fda-clinical-trials-history:
  type: report
  authors: "Junod SW (FDA History Office)"
  title: "FDA and Clinical Drug Trials: A Short History"
  container: "U.S. Food and Drug Administration; originally published in: A Quick Guide to Clinical Trials (Bioplan, 2008), pp. 25-55"
  year: 2008
  url: https://www.fda.gov/media/110437/download
  accessed: 2026-10-22
  verified: url
  note: "Read in full (pdftotext). The 1938 Act subjected new drugs to pre-market safety review. Thalidomide: never approved in the US because of Kelsey's concerns, but the sponsor sent samples to thousands of US doctors, whose patients became 'unwitting subjects'; 'more than a dozen thalidomide babies' are believed born in the US as a result; countries around the world updated their drug laws. 1970 'evidence rules': 'uncontrolled studies are not acceptable evidence to support claims of effectiveness'. Treatment IND (1987); parallel track (1990-1992); in 1992 accelerated-approval regulations gave explicit authority to rely on a surrogate marker; FDA usually requires post-market study to verify benefit."

ecfr-21-314-126:
  type: law
  authors: "U.S. Food and Drug Administration (Code of Federal Regulations)"
  title: "21 CFR 314.126 Adequate and well-controlled studies"
  container: "Electronic Code of Federal Regulations"
  year: 2002
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-314/subpart-D/section-314.126
  accessed: 2026-10-22
  verified: url
  note: "Text read through the eCFR versioner API (version of 1 October 2026; last amended 2002). (a): 'The purpose of conducting clinical investigations of a drug is to distinguish the effect of a drug from other influences, such as spontaneous change in the course of the disease, placebo effect, or biased observation.' (b): a valid comparison with a control (placebo, dose-comparison, no-treatment, active or historical), assignment that minimises bias (ordinarily randomisation), measures to minimise bias such as blinding, well-defined and reliable assessment. (d): the test drug must be 'standardized as to identity, strength, quality, purity, and dosage form to give significance to the results'. (e): 'Uncontrolled studies or partially controlled studies are not acceptable as the sole basis for the approval of claims of effectiveness.'"

# ---------------------------------------------------------------- regulation: Europe and the Netherlands

eu-directive-65-65:
  type: law
  authors: "Council of the European Economic Community"
  title: "Council Directive 65/65/EEC of 26 January 1965 on the approximation of provisions laid down by law, regulation or administrative action relating to proprietary medicinal products"
  container: "Official Journal of the European Communities, 022, 9 February 1965, pp. 369-373"
  year: 1965
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:31965L0065
  accessed: 2026-10-22
  verified: url
  note: "Read through CELLAR. Recitals: 'the primary purpose of any rules concerning the production and distribution of proprietary medicinal products must be to safeguard public health', but by 'means which will not hinder the development of the pharmaceutical industry or trade'. Art. 3: no proprietary medicinal product may be placed on the market in a Member State without an authorisation. Art. 4(8): the application includes results of physico-chemical, biological or microbiological tests, pharmacological and toxicological tests and clinical trials. Art. 5: refused if harmful in normal use, if 'its therapeutic efficacy is lacking or is insufficiently substantiated by the applicant', or if its composition is not as declared. Art. 7: decision within 120 days (plus 90 in exceptional cases). Art. 10: valid five years, renewable. Repealed and replaced by Directive 2001/83/EC (art. 128)."

eu-directive-2001-83-original:
  type: law
  authors: "European Parliament and Council of the European Union"
  title: "Directive 2001/83/EC of 6 November 2001 on the Community code relating to medicinal products for human use (text as adopted)"
  container: "Official Journal of the European Communities, L 311, 28 November 2001, pp. 67-128"
  year: 2001
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32001L0083
  accessed: 2026-10-22
  verified: url
  note: "Original text, read through CELLAR (the consolidated text is eu-directive-2001-83). Art. 5: a Member State may exclude medicines supplied 'in response to a bona fide unsolicited order, formulated in accordance with the specifications of an authorized health care professional and for use by his individual patients on his direct personal responsibility'. Art. 6(1): no medicine on the market without a marketing authorisation (national, or under Regulation 2309/93). Art. 22: in exceptional circumstances an authorisation may be granted subject to specific obligations (further studies, reporting of adverse reactions). Art. 26: refusal grounds as in Directive 65/65 (harmful; efficacy lacking or insufficiently substantiated; composition not as declared). Art. 128: repeals Directive 65/65/EEC and ten later directives."

eu-regulation-2309-93:
  type: law
  authors: "Council of the European Communities"
  title: "Council Regulation (EEC) No 2309/93 of 22 July 1993 laying down Community procedures for the authorization and supervision of medicinal products for human and veterinary use and establishing a European Agency for the Evaluation of Medicinal Products"
  container: "Official Journal of the European Communities, L 214, 24 August 1993, pp. 1-21"
  year: 1993
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:31993R2309
  accessed: 2026-10-22
  verified: url
  note: "Read through CELLAR. Establishes the European Agency for the Evaluation of Medicinal Products (today's EMA) and the Community (centralised) authorisation procedure. Art. 74: Titles I, II, III and V enter into force on 1 January 1995. Replaced by Regulation 726/2004."

ema-history:
  type: regulator
  authors: "European Medicines Agency"
  title: "History of EMA"
  year: 2026
  url: https://www.ema.europa.eu/en/about-us/history-ema
  accessed: 2026-10-22
  verified: url
  note: "'Founded in 1995'; 'EMA was set up in 1995 to harmonise the work of existing national medicine regulatory bodies'; London 1995-2019, then Amsterdam; responsibilities for rare-disease medicines since 2000, children's medicines since 2006, advanced therapies since 2007; PRAC created 2012. '2015 marked the 50th anniversary of the introduction of the first EU legislation on human medicines. On 26 January 1965, the Council Directive 65/65 ... was adopted.'"

ec-legal-framework-medicines:
  type: regulator
  authors: "European Commission, Directorate-General for Health and Food Safety"
  title: "Legal framework governing medicinal products for human use in the EU"
  year: 2026
  url: https://health.ec.europa.eu/medicinal-products/legal-framework-governing-medicinal-products-human-use-eu_en
  accessed: 2026-10-22
  verified: url
  note: "Section '50 years of pharmaceutical legislation': 'Much of the impetus behind the adoption of the legal framework stemmed from the determination to prevent a recurrence of the thalidomide disaster of the late 1950s'; it 'made it clear that to safeguard public health, no medicinal product must ever again be marketed without prior authorisation'. Requirements now primarily in Directive 2001/83/EC and Regulation 726/2004; authorisation centrally (Commission, EMA assessment) or nationally."

ema-accelerated-assessment:
  type: regulator
  authors: "European Medicines Agency"
  title: "Accelerated assessment"
