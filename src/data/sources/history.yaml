# fda-drugsatfda-wegovy, ema-epar-wegovy, ema-2023-falsified-ozempic, igj-2023-falsified-ozempic,
# mhra-2023-fake-weight-loss-pens, bfarm-ozempic-falsification, who-2024-falsified-semaglutide,
# fda-glp1-compounding-policy, fda-2024-compounded-semaglutide-dosing-errors (semaglutide.yaml); eng-1992-exendin-4
# (media.yaml); fda-drugsatfda-mounjaro, ema-epar-mounjaro, fda-drugsatfda-zepbound, belcourt-2025-research-purposes
# (tirzepatide.yaml); wada-2022-list-modifications, wada-2026-list-en, fda-category-2-safety-risks,
# fda-pcac-2026-bpc157-briefing, fda-pcac-2026-briefing-intro, fda-pcac-2026-questions (bpc-157.yaml);
# wada-2018-list-modifications (tb-500.yaml); fda-pcac-2026-semax-briefing, mhra-2026-01-seizures-2025,
