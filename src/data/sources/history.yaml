# ---------------------------------------------------------------- the costs and the debate

andersson-1992-drug-lag:
  type: review
  authors: "Andersson F"
  title: "The drug lag issue: the debate seen from an international perspective"
  container: "International Journal of Health Services"
  year: 1992
  volume: "22"
  pages: "53-72"
  doi: 10.2190/9Y32-X86Y-M3F0-JQFC
  pmid: "1735628"
  verified: pubmed
  note: "Literature review (MEDTAP Europe, Battelle Institute, London). Abstract: 'drug lag' is whether important new drugs are introduced relatively late, or at all, in a country; most studies found the United States, Sweden and Norway to have a long delay, the United Kingdom and West Germany in general the shortest; the US and Norway introduced 'far fewer new drugs than any other industrialized country'; one study linked regulatory processing time to delay, another found an increasing influence of regulatory stringency on the number of new drugs."

downing-2012-regulatory-review:
  type: article
  authors: "Downing NS, Aminawung JA, Shah ND, Braunstein JB, Krumholz HM, Ross JS"
  title: "Regulatory review of novel therapeutics--comparison of three regulatory agencies"
  container: "New England Journal of Medicine"
  year: 2012
  volume: "366"
  pages: "2284-2293"
  doi: 10.1056/NEJMsa1200223
  pmid: "22591257"
  pmcid: PMC3504361
  verified: pubmed
  note: "Yale; funded by the Pew Charitable Trusts. 510 applications for novel therapeutics approved 2001-2010 (225 FDA, 186 EMA, 99 Health Canada). Median time to complete the first review: 303 days FDA, 366 days EMA, 352 days Health Canada. Of 190 agents approved in both the US and Europe, 121 (63.7%) were first approved in the US."

darrow-2020-fda-approval-history:
  type: article
  authors: "Darrow JJ, Avorn J, Kesselheim AS"
  title: "FDA Approval and Regulation of Pharmaceuticals, 1983-2018"
  container: "JAMA"
  year: 2020
  volume: "323"
  pages: "164-176"
  doi: 10.1001/jama.2019.20288
  pmid: "31935033"
  verified: pubmed
  note: "PORTAL, Brigham and Women's Hospital and Harvard Medical School. Abstract: FDA review times fell 'from more than 3 years in 1983 to less than 1 year in 2017, but total time from the authorization of clinical testing to approval has remained at approximately 8 years'; 81% (48/59) of new drugs in 2018 used at least one expedited programme; the share of approvals supported by at least 2 pivotal trials fell from 80.6% (1995-1997) to 52.8% (2015-2017); user fees paid about 80% of new-drug review staff salaries in 2018; 'The FDA has increasingly accepted less data and more surrogate measures, and has shortened its review times.'"

dimasi-2016-rd-costs:
  type: article
  authors: "DiMasi JA, Grabowski HG, Hansen RW"
  title: "Innovation in the pharmaceutical industry: New estimates of R&D costs"
  container: "Journal of Health Economics"
  year: 2016
  volume: "47"
  pages: "20-33"
  doi: 10.1016/j.jhealeco.2016.01.012
  pmid: "26928437"
  verified: pubmed
  note: "Tufts Center for the Study of Drug Development. Abstract: R&D costs of 106 randomly selected new drugs from a survey of 10 pharmaceutical firms; average out-of-pocket cost per approved new compound $1,395 million; capitalised at 10.5% a year, total pre-approval cost $2,558 million (2013 dollars), including the costs of abandoned compounds. The underlying company data are confidential, which is one reason the estimate is disputed (compare wouters-2020-rd-investment, from public data)."

gyawali-2019-accelerated-approval:
  type: article
  authors: "Gyawali B, Hey SP, Kesselheim AS"
  title: "Assessment of the Clinical Benefit of Cancer Drugs Receiving Accelerated Approval"
  container: "JAMA Internal Medicine"
  year: 2019
  volume: "179"
  pages: "906-913"
  doi: 10.1001/jamainternmed.2019.0462
  pmid: "31135808"
  pmcid: PMC6547118
  verified: pubmed
  note: "PORTAL, Harvard. Of 93 cancer-drug indications given FDA accelerated approval from 11 December 1992 to 31 May 2017, confirmatory trials showed improved overall survival for 19 (20%); 19 (20%) confirmed only the same surrogate and 20 (21%) a different surrogate; others were delayed, pending or ongoing. The FDA's own 2018 review had called the pathway successful because 5 of 93 had been withdrawn."

verbaanderd-2021-repurposing-funding:
  type: article
  authors: "Verbaanderd C, Rooman I, Huys I"
  title: "Exploring new uses for existing drugs: innovative mechanisms to fund independent clinical research"
  container: "Trials"
  year: 2021
  volume: "22"
  pages: "322"
  doi: 10.1186/s13063-021-05273-x
  pmid: "33947441"
  pmcid: PMC8093905
  verified: pubmed
  note: "KU Leuven and the Anticancer Fund. Abstract: 'due to a lack of economic incentives, pharmaceutical developers are rarely interested to invest in research with approved medicines, especially when they are out of basic patent or regulatory protection'; new uses are then studied mainly in independent trials, and phase III trials need additional funding. Based on a literature search and interviews with 16 European stakeholders."

