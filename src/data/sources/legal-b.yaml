# ---------------------------------------------------------------- Germany: Arzneimittelgesetz (AMG)

de-amg-2:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 2 Arzneimittelbegriff"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__2.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "§ 2(1): medicines are substances presented for treating or preventing disease (Nr. 1), or that 'can be' applied to or given to a person to restore, correct or influence physiological functions by a pharmacological, immunological or metabolic action (Nr. 2a). § 2(3a): a product that meets the medicine definition and could also fall in another category (food, cosmetic) is a medicine."

de-amg-4:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 4 Sonstige Begriffsbestimmungen"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__4.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "§ 4(1): definition of Fertigarzneimittel (made in advance and placed on the market in a package intended for the consumer, or made by an industrial process). § 4(17): 'Inverkehrbringen ist das Vorrätighalten zum Verkauf oder zu sonstiger Abgabe, das Feilhalten, das Feilbieten und die Abgabe an andere.'"

de-amg-5:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 5 Verbot bedenklicher Arzneimittel"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__5.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "Bans placing on the market, or using on another person, a medicine with a reasoned suspicion of harmful effects beyond what medical science finds acceptable."

de-amg-8:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 8 Verbote zum Schutz vor Täuschung"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__8.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "Bans making or placing on the market medicines of significantly reduced quality, with misleading labels, or falsified medicines (§ 8(1) and (2))."

de-amg-73:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 73 Verbringungsverbot"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__73.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "§ 73(1): medicines needing authorisation may be brought into Germany only if authorised there and the recipient is a pharmacy, wholesaler etc., or (Nr. 1a) sent by a licensed EU/EEA mail-order pharmacy. § 73(1b): bringing in falsified medicines is prohibited. § 73(2) Nr. 6: amounts matching usual personal need brought in on entry; Nr. 6a: medicines that may be marketed in the country of origin, obtained without commercial or professional brokerage, in amounts matching usual personal need, from an EU/EEA state. § 73(3): pharmacy import of unauthorised medicines on individual order."

de-amg-95:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 95 Strafvorschriften"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__95.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "Up to three years' imprisonment or a fine, e.g. for placing a 'bedenkliches' medicine on the market (§ 5) or trading in falsified or quality-reduced medicines (§ 8); attempt punishable; one to ten years in especially serious cases (e.g. endangering the health of many people)."

de-amg-96:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 96 Strafvorschriften"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__96.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "Up to one year's imprisonment or a fine, e.g. Nr. 4 (manufacturing or importing without a licence under § 13 or § 72), Nr. 5 (placing an unauthorised Fertigarzneimittel on the market contrary to § 21), Nr. 18e (bringing falsified medicines into Germany)."

de-amg-97:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 97 Bußgeldvorschriften"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__97.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "§ 97(2) Nr. 8: bringing medicines into Germany contrary to § 73(1) is an administrative offence (Ordnungswidrigkeit); § 97(3): fine up to EUR 25,000."

