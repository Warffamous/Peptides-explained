# ---------------------------------------------------------------- Germany: Arzneimittelgesetz (AMG)
# The AMG was last amended by Art. 2 Abs. 4 of the law of 12 May 2026 (BGBl. 2026 I Nr. 143), according to the
# "Stand" line of gesetze-im-internet.de on 22 October 2026. The sections below were read in that version.

de-amg-2:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 2 Arzneimittelbegriff"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__2.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 2(1) Nr. 1: substances intended for use in or on the human body and presented as having properties for healing, relieving or preventing human disease; Nr. 2a: substances that can be used in or on the body, or given to a person, to restore, correct or influence physiological functions by a pharmacological, immunological or metabolic action. § 2(3a): a product that meets a medicine definition and may also fall under another product category (food, cosmetic and so on) is a medicine."

de-amg-4:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 4 Sonstige Begriffsbestimmungen"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__4.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 4(1): Fertigarzneimittel = medicines made in advance and placed on the market in a package intended for the consumer (or made by an industrial process). § 4(17): 'Inverkehrbringen ist das Vorrätighalten zum Verkauf oder zu sonstiger Abgabe, das Feilhalten, das Feilbieten und die Abgabe an andere.'"

de-amg-5:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 5 Verbot bedenklicher Arzneimittel"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__5.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 5(1): it is forbidden to place 'bedenkliche' medicines on the market or to use them on another person. § 5(2): 'bedenklich' = a reasoned suspicion, by the current state of science, that normal use causes harmful effects beyond what medical science finds acceptable."

de-amg-8:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 8 Verbote zum Schutz vor Täuschung"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__8.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 8(1): ban on making or placing on the market medicines or active substances of significantly reduced quality, or with misleading names, information or presentation (including claims of effects they do not have). § 8(2): ban on making, placing on the market or otherwise trading in falsified medicines or active substances."

de-amg-73:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 73 Verbringungsverbot"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__73.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 73(1): medicines that need an authorisation may be brought into Germany only if they are authorised (or exempt) for Germany and the recipient is a pharmaceutical company, wholesaler, pharmacy and so on (Nr. 1), or, for mail order to the end user, they are sent by an EU/EEA pharmacy allowed to do mail order (Nr. 1a). § 73(1b): bringing falsified medicines or active substances into Germany is forbidden. § 73(2): § 73(1) sentence 1 does not apply, among others, to medicines brought in on entry in an amount matching usual personal need (Nr. 6), and to medicines that may be marketed in the country of origin and are obtained from an EU/EEA state without commercial or professional brokerage in an amount matching usual personal need (Nr. 6a). § 73(3): pharmacies may bring in unauthorised finished medicines in small amounts on the order of individual persons, if they may be lawfully marketed in the country they come from and no identical medicine is available in Germany; a prescription is required when they come from outside the EU/EEA. § 73(4): for Nr. 6 and 6a, the AMG does not apply except §§ 5, 8, 13–20a, 52a, 64–69 and 78."

de-amg-95:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 95 Strafvorschriften"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__95.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 95(1): up to three years' imprisonment or a fine, e.g. Nr. 1 (placing a 'bedenkliches' medicine on the market or using it on others, § 5) and Nr. 3a (making or trading in quality-reduced or falsified medicines, § 8(1) Nr. 1 or (2)). § 95(2): attempt is punishable. § 95(3): one to ten years in especially serious cases, e.g. endangering the health of a large number of people. § 95(4): negligence up to one year or a fine."

de-amg-96:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 96 Strafvorschriften"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__96.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "Up to one year's imprisonment or a fine, e.g. Nr. 3 (misleading presentation, § 8(1) Nr. 2), Nr. 4 (making or importing without a licence under § 13 or § 72), Nr. 5 (placing a Fertigarzneimittel on the market contrary to § 21(1)), Nr. 18e (bringing a falsified medicine into Germany contrary to § 73(1b))."

de-amg-97:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Arzneimittelgesetz (AMG), § 97 Bußgeldvorschriften"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/amg_1976/__97.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 97(2) Nr. 8: bringing medicines into Germany contrary to § 73(1), on purpose or by negligence, is an administrative offence (Ordnungswidrigkeit). § 97(3): fine up to EUR 25,000."

# ---------------------------------------------------------------- Germany: advertising (HWG)

de-hwg-3a:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Heilmittelwerbegesetz (HWG), § 3a"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/heilmwerbg/__3a.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "'Unzulässig ist eine Werbung für Arzneimittel, die der Pflicht zur Zulassung unterliegen und die nicht nach den arzneimittelrechtlichen Vorschriften zugelassen sind oder als zugelassen gelten.' Also applies to uses or forms not covered by the authorisation. HWG last amended by Art. 5 of the law of 26 June 2026 (BGBl. 2026 I Nr. 195), per the full-citation line on 22 October 2026."

de-hwg-10:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Heilmittelwerbegesetz (HWG), § 10"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/heilmwerbg/__10.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 10(1): prescription-only medicines may be advertised only to doctors, dentists, vets, pharmacists and people lawfully trading in them."

de-hwg-15:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Heilmittelwerbegesetz (HWG), § 15 (Ordnungswidrigkeiten)"
  container: "gesetze-im-internet.de"
