# Re-verified on 22 October 2026 (group legal-b, third run). Two earlier runs were interrupted; this run treated
# every entry as unverified, fetched every URL again with curl (HTTP 200 for all) and read each page or PDF as text
# against what it is cited for (research/legal-b.md, "Verification log"). Law pages: gesetze-im-internet.de,
# recht.bund.de (BGBl PDF), legislation.gov.uk, law.cornell.edu. eCFR text through the eCFR versioner API (the HTML
