# ---------------------------------------------------------------- World Anti-Doping Code and standards

wada-code-2021:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "World Anti-Doping Code 2021"
  year: 2021
  url: https://www.wada-ama.org/sites/default/files/resources/files/2021_wada_code.pdf
  accessed: 2026-10-22
  verified: url
  note: "In force until 31 December 2026. Art. 2.1.1: 'It is the Athletes' personal duty to ensure that no Prohibited Substance enters their bodies ... it is not necessary that intent, Fault, Negligence or knowing Use on the Athlete's part be demonstrated'; comment: referred to in CAS decisions as 'Strict Liability'. Art. 10.2.1: four years for a non-Specified Substance unless the athlete shows it was not intentional; for a Specified Substance, four years only if the anti-doping organisation shows it was intentional, otherwise two years (10.2.2). Art. 10.6.1.2: Contaminated Products, reduction only with No Significant Fault; comment: 'rarely applied ... unless the Athlete has exercised a high level of caution'. Definition: Contaminated Product = 'A product that contains a Prohibited Substance that is not disclosed on the product label or in information available in a reasonable Internet search.' Definition of Recreational Athlete (set by each national anti-doping organisation)."

wada-code-2027:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "World Anti-Doping Code 2027 (version 1.0)"
  year: 2026
  url: https://www.wada-ama.org/sites/default/files/2026-10/2027_world_anti-doping_code_code_october_final.pdf
  accessed: 2026-10-22
  verified: url
  note: "URL corrected on 22 October 2026 (second run): the June 2026 PDF this entry first pointed to returned 404; WADA's 2027 Code and International Standards page (wada-2027-code-standards-page) links this October 2026 file, fetched again (HTTP 200) on 22 October 2026. 'The revised 2027 World Anti-Doping Code is effective as of 1 January 2027.' Art. 2.1.1 keeps the strict-liability wording. Art. 10.2.1: four years for a non-Specified Substance, reduced to two only where the athlete shows how the substance entered their system and that it was not intentional (10.2.1.1), or three where the context was unrelated to sport performance (10.2.1.2). Art. 10.2.2: two years for a Specified Substance, four if the anti-doping organisation shows intent (three if unrelated to sport performance). Art. 10.6.1.2 (Contaminated Source): a reprimand to two years only where the athlete shows both No Significant Fault or Negligence and that the substance came from a Contaminated Source (defined as including a medication or supplement with a Prohibited Substance not disclosed on its label or in information found by a reasonable search); comment: the reduction 'has rarely been applied in nutritional supplement cases unless the Athlete has exercised a high level of caution'. Comment to Art. 10.5: No Fault or Negligence does not apply to 'a positive test resulting from a mislabeled or contaminated vitamin or nutritional supplement'. Art. 10.6.1.3: Recreational Athletes who show No Significant Fault: from a reprimand to two years. Definition of Recreational Athlete: set by each national anti-doping organisation, excluding anyone who, in the same sport and in the previous five years, was an international- or national-level athlete, took part professionally, competed in an international or national event, or was in a testing pool."

wada-2027-code-standards-page:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "2027 Code and International Standards"
  year: 2026
  url: https://www.wada-ama.org/en/what-we-do/world-anti-doping-code/2027-code-and-international-standards
  accessed: 2026-10-22
  verified: url
  note: "'The 2027 World Anti-Doping Code (Code) and International Standards (Standards) were approved on 5 December by the Agency's Foundation Board and Executive Committee respectively, at WADA's sixth World Conference on Doping in Sport in Busan, Republic of Korea. The 2027 Code and Standards ... will come into force on 1 January 2027.' The page belongs to the 2025 World Conference, so the approval date is 5 December 2025 (also stated in the 2027 ISTUE). Links the final 2027 Code PDF (wada-code-2027) and the 2027 ISTUE PDF (wada-istue-2027)."

wada-istue-2023:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "International Standard for Therapeutic Use Exemptions (ISTUE) 2023"
  year: 2022
  url: https://www.wada-ama.org/sites/default/files/2022-09/international_standard_for_therapeutic_use_exemptions_istue_2023.pdf
  accessed: 2026-10-22
  verified: url
  note: "In force until 31 December 2026. Art. 4.2: a TUE may be granted 'if (and only if)' (a) the substance is needed to treat a diagnosed medical condition supported by relevant clinical evidence; (b) it will not enhance performance beyond a return to normal health; (c) it is 'an indicated treatment for the medical condition, and there is no reasonable permitted Therapeutic alternative'; (d) the need is not a consequence of prior prohibited use. Comment: the decision does not consider 'whether its Use is legal in all jurisdictions'. The ISTUE does not mention S0 by name."

wada-istue-2027:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "International Standard for Therapeutic Use Exemptions (ISTUE) 2027"
  year: 2025
  url: https://www.wada-ama.org/sites/default/files/2025-12/2027_international_standard_for_therapeutic_use_exemptions_istue.pdf
  accessed: 2026-10-22
  verified: url
  note: "Linked from WADA's 2027 Code and International Standards page. 'This revised version was approved by the WADA Executive Committee on 5 December 2025 and is effective as of 1 January 2027.' Art. 4.2 keeps four criteria ('if (and only if)' each is met), re-ordered: (a) a diagnosed medical condition supported by relevant clinical evidence; (b) an indicated treatment with no reasonable permitted therapeutic alternative (comment: based on factors such as evidence-based guidelines); (c) no additional performance enhancement; (d) not a consequence of prior prohibited use. Comment: a TUE decision does not consider whether use 'is legal in all jurisdictions'."

wada-2027-list-explanatory-note:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "Summary of Major Modifications and Explanatory Notes, 2027 Prohibited List"
  year: 2026
  url: https://www.wada-ama.org/sites/default/files/2026-09/2027_list_explanatory_note_en_final_17_august_2026_1.pdf
  accessed: 2026-10-22
  verified: url
  note: "S0: 'Many peptides, not approved for human use by regulatory authorities, fulfill the criteria of the World Anti-Doping Code for inclusion on the Prohibited List and fall under the S0 (Non-Approved Substances) class, or other classes (such as S2 or S4). Even if a peptide is not specifically named on the List, utmost caution should be taken as it may still be prohibited and may be harmful to health. In this regard, for clarity, peptides are now named as examples in this section.' Other changes: S4 examples (imlunestrant, seladelpar, SLU-PP-332, SLU-PP-915), S5 examples (eplerenone, finerenone), S8 and S9 clarifications; codeine, dermorphin, hydrocodone and out-of-competition fentanyl and tramadol removed from the Monitoring Program."

