krug-2014-black-market-germany:
  type: article
  authors: "Krug O, Thomas A, Walpurgis K, Piper T, Sigmund G, Schänzer W, Laussmann T, Thevis M"
  title: "Identification of black market products and potential doping agents in Germany 2010-2013"
  container: "European Journal of Clinical Pharmacology"
  year: 2014
  volume: "70"
  pages: "1303-1311"
  doi: 10.1007/s00228-014-1743-5
  pmid: "25168622"
  verified: pubmed
  note: "Cologne anti-doping laboratory analysed 337 black-market products (2010–2013); 12.8% contained peptide hormones and growth factors; findings included thymosin beta-4; the authors note several substances of 'fake/non-approved nature'."

# ---------------------------------------------------------------- United Kingdom: Human Medicines Regulations 2012

uk-hmr-2012-reg-2:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 2: Medicinal products"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/2
  accessed: 2026-10-20
  verified: url
  note: "'Medicinal product' means any substance presented as having properties of preventing or treating disease, or any substance that may be used by or administered to human beings to restore, correct or modify a physiological function by a pharmacological, immunological or metabolic action, or to make a diagnosis."

uk-hmr-2012-reg-47:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 47: Offences in connection with authorisation"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/47
  accessed: 2026-10-20
  verified: url
  note: "Breach of regulation 46 is an offence: on indictment, a fine, imprisonment up to two years, or both."

uk-hmr-2012-reg-167:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 167: Supply to fulfil special patient needs"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/167
  accessed: 2026-10-20
  verified: url
  note: "The 'specials' exemption: an unlicensed product supplied in response to an unsolicited order, made to the specification of a doctor or other listed prescriber, for a patient under their direct care, with no advertisement, and made or imported by a licence holder."

uk-hmr-2012-reg-214:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 214: Sale or supply of prescription only medicines"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/214
  accessed: 2026-10-20
  verified: url
  note: "A prescription only medicine may be sold or supplied only under a prescription from an appropriate practitioner; parenteral administration to others only by or on the directions of an appropriate practitioner."

uk-hmr-2012-reg-255:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 255: Offences under Part 12"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/255
  accessed: 2026-10-20
  verified: url
  note: "Breach of regulation 214, and possession of a prescription only medicine with intent to supply it without a prescription, are offences: on indictment up to two years' imprisonment, a fine, or both."

uk-hmr-2012-reg-279:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 279: Requirement for authorisation (advertising)"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/279
  accessed: 2026-10-20
  verified: url
  note: "A person may not publish an advertisement for a medicinal product in Great Britain (or Northern Ireland) unless a UK marketing authorisation, certificate of registration or traditional herbal registration is in force for it."

