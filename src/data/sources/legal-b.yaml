# ---------------------------------------------------------------- Germany: Anti-Doping-Gesetz (AntiDopG)
# The AntiDopG was last amended by Art. 1 of the regulation of 10 March 2023 (BGBl. 2023 I Nr. 67), per the
# "Stand" line on 22 October 2026. § 2 and the Anlage are in tb-500.yaml (de-antidopg-2, de-antidopg-anlage).

de-antidopg-3:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Anti-Doping-Gesetz (AntiDopG), § 3 Selbstdoping"
  container: "gesetze-im-internet.de"
  year: 2023
  url: https://www.gesetze-im-internet.de/antidopg/__3.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 3(1): ban on using a doping substance listed in Annex I of the UNESCO convention (not only banned in certain sports), without medical indication, intending to gain an advantage in a competition of organised sport. § 3(3): defines a competition of organised sport (organised or recognised by a sports organisation, with binding rules). § 3(4): ban on acquiring or possessing such a substance for that purpose."

de-antidopg-4:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Anti-Doping-Gesetz (AntiDopG), § 4 Strafvorschriften"
  container: "gesetze-im-internet.de"
  year: 2023
  url: https://www.gesetze-im-internet.de/antidopg/__4.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 4(1): up to three years or a fine for, among others, trading or supplying (§ 2(1)), using on another person (§ 2(2)), and acquiring, possessing or bringing in a 'nicht geringe Menge' (§ 2(3)), and for self-doping (§ 3(1), (2)). § 4(2): up to two years for acquiring or possessing for self-doping (§ 3(4)). § 4(3): attempt punishable in § 4(1) cases. § 4(4): one to ten years, e.g. supply to a person under 18, or acting commercially or as a gang. § 4(6): negligence in § 4(1) Nr. 1–3 cases up to one year. § 4(7): self-doping offences (§ 4(1) Nr. 4, 5 and § 4(2)) apply only to elite athletes in a testing pool or people with substantial income from sport. § 4(8): no penalty under § 4(2) for someone who voluntarily gives up the substance before using it."

de-antidopg-6:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Anti-Doping-Gesetz (AntiDopG), § 6 Verordnungsermächtigungen"
  container: "gesetze-im-internet.de"
  year: 2015
  url: https://www.gesetze-im-internet.de/antidopg/__6.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "§ 6(1): the Federal Ministry of Health, by regulation with the consent of the Bundesrat and after hearing experts, sets the 'nicht geringe Menge' of the substances in the Anlage and may add further substances to the Anlage (or remove them)."

de-dmmv-2023:
  type: law
  authors: "Bundesministerium für Gesundheit"
  title: "Verordnung zur Festlegung der nicht geringen Menge von Dopingmitteln (Dopingmittel-Mengen-Verordnung – DmMV) vom 10. März 2023"
  container: "gesetze-im-internet.de (BGBl. 2023 I Nr. 67, S. 5)"
  year: 2023
  url: https://www.gesetze-im-internet.de/dmmv_2023/BJNR0430B0023.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "In force since 16 March 2023; replaces the DmMV 2020. The Anlage sets a 'nicht geringe Menge' (stated for the free compound) for every substance or group in the AntiDopG Anlage, including growth-hormone fragments (examples AOD-9604, hGH fragment 176-191), GHRH and analogues (examples sermorelin, somatorelin, tesamorelin, mod-GRF, CJC-1295), GH secretagogues (example ipamorelin), GHRPs (example hexarelin) and thymosin-beta-4 and its derivatives (example TB-500). The site prints none of the amounts (no amounts of any kind, CONTENT-GUIDE §1); the legal reviewer can read them in the Anlage, sections II.2.3 to II.3. The amounts are stated for the free compound."

de-bgbl-2025-ii-312:
  type: law
  authors: "Bundeskanzleramt"
  title: "Bekanntmachung der Neufassung der Anlage I zu dem Internationalen Übereinkommen vom 19. Oktober 2005 gegen Doping im Sport / des Anhangs zu dem Übereinkommen vom 16. November 1989 gegen Doping, vom 18. Dezember 2025"
  container: "Bundesgesetzblatt 2025 Teil II Nr. 312 (23 December 2025)"
  year: 2025
  url: https://www.recht.bund.de/bgbl/2/2025/312/VO.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "Publishes the WADA Prohibited List 2026 as the new Annex I of the UNESCO convention, in force 1 January 2026, with an official German translation. S0 ('Nicht zugelassene Stoffe') names BPC-157 as an example. States that it follows the announcement of 13 December 2024 (BGBl. 2024 II Nr. 503). This Annex I is the list that AntiDopG § 2(1), (2) and § 3 refer to. Read in the PDF (regelungstext.pdf) linked from this page."

# ---------------------------------------------------------------- Germany: BfArM

bfarm-risiken-melden:
  type: regulator
  authors: "Bundesinstitut für Arzneimittel und Medizinprodukte (BfArM)"
  title: "Nebenwirkungen und weitere Arzneimittelrisiken melden"
  year: 2026
  url: https://www.bfarm.de/DE/Arzneimittel/Pharmakovigilanz/Risiken-melden/_node.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "A joint web portal of BfArM and the Paul-Ehrlich-Institut (www.nebenwirkungen.bund.de) takes reports of suspected side effects; a paper form can be sent instead. Reports by health professionals and by patients ('Patientinnen und Patienten') complete the safety profile of medicines. The page also reports a portal fault from 7 to 9 October 2026 and asks people who reported online then to report again. (Corrected 22 October 2026: an earlier note said patients are asked to report together with a doctor; the page does not say that.)"

bfarm-arzneimittelfaelschungen:
  type: regulator
  authors: "Bundesinstitut für Arzneimittel und Medizinprodukte (BfArM)"
  title: "Arzneimittelfälschungen"
  year: 2026
  url: https://www.bfarm.de/DE/Arzneimittel/Arzneimittelinformationen/Rapid-Alert-System/Arzneimittelfaelschungen/_node.html
  accessed: 2026-10-22
  lang: de
  verified: url
  note: "BfArM deals only with falsifications in the legal supply chain and informs the public about them; supervising the trade in medicines, seizing and testing products is the task of the Länder authorities; police, customs and public prosecutors investigate and prosecute crimes. BfArM keeps the German register of mail-order pharmacies; registered pharmacies must show the EU safety logo (harmonised at the end of June 2015). Distinguishes the legal supply chain from illegal sources 'wie z.B. über nicht autorisierte Internethändler'."

krug-2014-black-market-germany:
  type: article
  authors: "Krug O, Thomas A, Walpurgis K, Piper T, Sigmund G, Schänzer W, Laussmann T, Thevis M"
  title: "Identification of black market products and potential doping agents in Germany 2010-2013"
  container: "European Journal of Clinical Pharmacology"
  year: 2014
  volume: "70"
  pages: "1303-1311"
  doi: 10.1007/s00228-014-1743-5
  pmid: "25168622"
  verified: pubmed
  note: "The Cologne anti-doping laboratory analysed 337 black-market products (2010–2013) in cooperation with German customs; 67 active ingredients, 49 classed as doping agents by WADA; of the findings, 12.8% 'accounted for' peptide hormones and growth factors (mostly hGH and GHRPs; the abstract does not state the base of the percentages, so the site says 'of what it found', not 'of products'); findings included thymosin beta-4; 'Several substances are of fake/non-approved nature'."

# ---------------------------------------------------------------- United Kingdom: Human Medicines Regulations 2012
# Read on legislation.gov.uk ("latest available (revised)") on 22 October 2026.

uk-hmr-2012-reg-2:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 2: Medicinal products"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/2
  accessed: 2026-10-22
  verified: url
  note: "'Medicinal product' means (a) any substance presented as having properties of preventing or treating disease in human beings, or (b) any substance that may be used by or administered to human beings with a view to restoring, correcting or modifying a physiological function by a pharmacological, immunological or metabolic action, or making a medical diagnosis."

uk-hmr-2012-reg-17:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 17: Manufacturing of medicinal products"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/17
  accessed: 2026-10-22
  verified: url
  note: "Reg. 17(1): a manufacturer's licence is needed to manufacture, assemble or import a medicinal product into Great Britain from a country other than Northern Ireland or an approved country for import (17(1)(c)), or to import one into Northern Ireland from a country other than an EEA State (17(1)(d); added after a re-read through the legislation.gov.uk XML on 26 October 2026, which gives the extent as E+W+S+N.I.). Reg. 17(6): 'Paragraph (1) does not apply to a person who imports a medicinal product for administration to himself or herself or to any other person who is a member of that person's household.'"

uk-hmr-2012-reg-47:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 47: Offences in connection with authorisation"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/47
  accessed: 2026-10-22
  verified: url
  note: "Breach of regulation 46 is an offence: on summary conviction a fine up to the statutory maximum; on indictment a fine, imprisonment up to two years, or both."

uk-hmr-2012-reg-167:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 167: Supply to fulfil special patient needs"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/167
  accessed: 2026-10-22
  verified: url
  note: "The 'specials' exemption from regulation 46: supplied in response to an unsolicited order, made to the specification of a doctor or other listed prescriber, for a patient under their direct care, to meet special needs; no advertisement (condition B); made or imported by a licence holder (conditions E–G)."

uk-hmr-2012-reg-214:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 214: Sale or supply of prescription only medicines"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/214
  accessed: 2026-10-22
  verified: url
  note: "Reg. 214(1): a prescription only medicine may be sold or supplied only in accordance with a prescription from an appropriate practitioner. Reg. 214(2): a person may not parenterally administer (otherwise than to himself or herself) a prescription only medicine unless an appropriate practitioner or acting on their directions."

uk-hmr-2012-reg-255:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 255: Offences under Part 12"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/255
  accessed: 2026-10-22
  verified: url
  note: "Breach of regulation 214(1) or (2), and possessing a prescription only medicine with intent to supply it other than on prescription (255(4)), are offences: on indictment up to two years' imprisonment, a fine, or both (255(5))."

uk-hmr-2012-reg-279:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 279: Requirement for authorisation (advertising)"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/279
  accessed: 2026-10-22
  verified: url
  note: "A person may not publish an advertisement for a medicinal product in Great Britain (or Northern Ireland, or the whole UK) unless a UK marketing authorisation, certificate of registration or traditional herbal registration (or a temporary authorisation under regulation 174) is in force for it."

