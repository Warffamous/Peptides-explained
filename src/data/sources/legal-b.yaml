# ---------------------------------------------------------------- product analyses (contamination and mislabelling)

weber-2017-swiss-border:
  type: article
  authors: "Weber C, Krug O, Kamber M, Thevis M"
  title: "Qualitative and Semiquantitative Analysis of Doping Products Seized at the Swiss Border"
  container: "Substance Use & Misuse"
  year: 2017
  volume: "52"
  pages: "742-753"
  doi: 10.1080/10826084.2016.1263665
  pmid: "28156209"
  verified: pubmed
  note: "1,190 seized products; 146 (12%) labelled as peptide hormones or growth factors; non-approved substances detected and fewer than 20% of products contained the claimed substance in the claimed amount."

reichel-2019-follistatin:
  type: article
  authors: "Reichel C, Gmeiner G, Thevis M"
  title: "Detection of black market follistatin 344"
  container: "Drug Testing and Analysis"
  year: 2019
  volume: "11"
  pages: "1675-1697"
  doi: 10.1002/dta.2741
  pmid: "31758732"
  verified: pubmed
  note: "Only 9 of 17 black-market products sold as follistatin contained follistatin; some of the others contained other growth-promoting peptides (e.g. MGF, GHRP-2)."

