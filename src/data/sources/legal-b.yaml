# wada-2026-monitoring-program, fda-glp1-compounding-policy, fda-unapproved-glp1-concerns,
# fda-2026-503b-glp1-exclusion-proposal, fr-2026-12937-503b-comment-extension, mhra-glp1-what-you-need-to-know
