# ---------------------------------------------------------------- World Anti-Doping Code and standards

wada-code-2021:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "World Anti-Doping Code 2021"
  year: 2021
  url: https://www.wada-ama.org/sites/default/files/resources/files/2021_wada_code.pdf
  accessed: 2026-10-20
  verified: url
  note: "In force until 31 December 2026. Art. 2.1.1 (presence; 'it is not necessary that intent, Fault, Negligence or knowing Use ... be demonstrated', referred to by CAS as strict liability); Art. 10.2.1 (four years for non-Specified Substances unless not intentional); Art. 10.6.1.2 and definition of Contaminated Product ('a Prohibited Substance that is not disclosed on the product label or in information available in a reasonable Internet search'); comment: reduction 'rarely applied' unless a high level of caution; definition of Recreational Athlete."

wada-code-2027:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "World Anti-Doping Code 2027 (final, June 2026)"
  year: 2026
  url: https://www.wada-ama.org/sites/default/files/2026-07/2027_world_anti-doping_code_code_june_final.pdf
  accessed: 2026-10-20
  verified: url
  note: "Approved 5 December 2025 at the World Conference on Doping in Sport in Busan; in force 1 January 2027 (WADA 2027 Code and International Standards page). Art. 2.1.1 keeps the same strict-liability wording."

wada-istue-2023:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "International Standard for Therapeutic Use Exemptions (ISTUE) 2023"
  year: 2022
  url: https://www.wada-ama.org/sites/default/files/2022-09/international_standard_for_therapeutic_use_exemptions_istue_2023.pdf
  accessed: 2026-10-20
  verified: url
  note: "In force until 31 December 2026. Art. 4.2: a TUE may be granted 'if (and only if)' (a) the substance is needed to treat a diagnosed medical condition supported by relevant clinical evidence; (b) no additional enhancement beyond a return to normal health; (c) it is 'an indicated treatment for the medical condition, and there is no reasonable permitted Therapeutic alternative'; (d) the need is not a consequence of prior prohibited use. The ISTUE does not mention S0 by name."

wada-istue-2027:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "International Standard for Therapeutic Use Exemptions (ISTUE) 2027"
  year: 2025
  url: https://www.wada-ama.org/sites/default/files/2025-12/2027_international_standard_for_therapeutic_use_exemptions_istue.pdf
  accessed: 2026-10-20
  verified: url
  note: "In force 1 January 2027. Art. 4.2 keeps the four criteria (re-ordered: diagnosed condition; indicated treatment with no reasonable permitted alternative; no additional enhancement; not caused by prior prohibited use); comment: a TUE decision does not consider whether use 'is legal in all jurisdictions'."

wada-2027-list-explanatory-note:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "Summary of Major Modifications and Explanatory Notes, 2027 Prohibited List"
  year: 2026
  url: https://www.wada-ama.org/sites/default/files/2026-09/2027_list_explanatory_note_en_final_17_august_2026_1.pdf
  accessed: 2026-10-20
  verified: url
  note: "S0: 'Many peptides, not approved for human use by regulatory authorities, fulfill the criteria ... and fall under the S0 ... class, or other classes (such as S2 or S4). Even if a peptide is not specifically named on the List, utmost caution should be taken ... for clarity, peptides are now named as examples in this section.' Also lists S4 and S5 example additions and Monitoring Program removals."

