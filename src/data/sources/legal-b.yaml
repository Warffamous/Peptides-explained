# ---------------------------------------------------------------- Germany: Anti-Doping-Gesetz and quantities

de-antidopg-3:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Anti-Doping-Gesetz (AntiDopG), § 3 Selbstdoping"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/antidopg/__3.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "Self-doping ban: using a doping substance without medical indication with the intention of gaining an advantage in a competition of organised sport; § 3(3) defines such a competition; § 3(4) bans acquiring or possessing for that purpose."

de-antidopg-4:
  type: law
  authors: "Bundesministerium der Justiz"
  title: "Anti-Doping-Gesetz (AntiDopG), § 4 Strafvorschriften"
  container: "gesetze-im-internet.de"
  year: 2026
  url: https://www.gesetze-im-internet.de/antidopg/__4.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "§ 4(1): up to three years or a fine (incl. Nr. 3: acquiring, possessing or bringing in a 'nicht geringe Menge' contrary to § 2(3)); § 4(2): up to two years for § 3(4); § 4(4): one to ten years e.g. for supply to a person under 18 or acting commercially or as a gang; § 4(6): negligence up to one year; § 4(7): self-doping offences apply only to elite athletes in a testing pool or those with substantial income from sport; § 4(8): no penalty under § 4(2) for voluntarily giving up the substance before use."

de-dmmv-2023:
  type: law
  authors: "Bundesministerium für Gesundheit"
  title: "Verordnung zur Festlegung der nicht geringen Menge von Dopingmitteln (Dopingmittel-Mengen-Verordnung – DmMV) vom 10. März 2023"
  container: "gesetze-im-internet.de (BGBl. 2023 I Nr. 67, S. 5)"
  year: 2023
  url: https://www.gesetze-im-internet.de/dmmv_2023/BJNR0430B0023.html
  accessed: 2026-10-20
  lang: de
  verified: url
  note: "In force since 16 March 2023. The Anlage sets a 'nicht geringe Menge' for each listed substance or group, including growth-hormone fragments (e.g. AOD-9604), GHRH and analogues (e.g. tesamorelin, CJC-1295), GH secretagogues (e.g. ipamorelin), GHRPs (e.g. hexarelin) and thymosin-beta-4 and its derivatives (e.g. TB-500). The amounts themselves are deliberately not reproduced on the site; they are recorded in research/legal-b.md for the legal reviewer."

