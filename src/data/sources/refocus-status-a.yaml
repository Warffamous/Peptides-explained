# - src/data/sources/retatrutide.yaml: ctgov-nct06383390, ctgov-nct07165028, ctgov-nct06260722, ctgov-nct05929066,
#   ctgov-nct05882045, ctgov-nct05931367, ctgov-nct07629401, sec-lilly-2026-q2-results, mhra-2025-retatrutide-seizure.
# - src/data/sources/legal-b.yaml: fda-warning-letters-index, mhra-2026-10-counterfeit-pens,
