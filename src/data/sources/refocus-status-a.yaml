# Sources for the refocus status batch a (semaglutide, tirzepatide, retatrutide): Canada, Australia, the products
# authorised in the United States, the United Kingdom, Canada and Australia that the compound data files do not list
# yet, and how the medicines are paid for in each country.
#
# Run: 24 October 2026 between about 10:00 and 11:30 on this machine's clock (Western Europe), which is still
# 23 October in the Americas and early on 24 October in Australia. No earlier draft of this batch existed (the
# interrupted run had written nothing under research/refocus/). Rows use as_of 2026-10-23 as the brief asks; every
# entry below carries the real accessed date.
#
# How things were read:
# - FDA: Drugs@FDA overview pages (curl) and the openFDA drugsfda endpoint; approval letters and labels as PDFs with
#   curl + pdftotext (never in the browser).
# - Health Canada: the Drug Product Database (DPD) web pages and API, the NOC database API and the Clinical Trials
#   Database API all redirected to Health Canada's maintenance page (construction.hres.ca) or returned HTTP 503 during
#   the whole run. The DPD was therefore read from Health Canada's official data extract (files dated 5 October 2026),
#   unzipped inside the browser page on canada.ca (canada.ca refused command-line requests). Review decisions were
#   read on the Drug and Health Product Portal (dhpp.hpfb-dgpsa.ca, curl). Product monographs were fetched from
#   pdf.hres.ca with curl; their numbers came from Internet Archive copies of DPD product pages (archive used only to
#   find the link; the PDF itself was read on the Health Canada host). canada.ca pages were read in the browser.
# - CDA-AMC (cda-amc.ca) and NCBI Bookshelf answered with bot-verification pages; nothing was done to get round them.
#   CDA-AMC recommendation titles were taken from NCBI E-utilities (esummary, db=books) only.
# - TGA: tga.gov.au refused command-line requests; ARTG entries, the prescription medicines registrations and
#   under-evaluation databases, AusPAR search, section 19A database and the site search were read in the browser
#   (fetch from the page itself). PI and CMI PDFs on www.ebs.tga.gov.au were not opened (PDF rule; the host also
#   refuses curl); their identifiers are recorded from the ARTG entry pages.
# - PBS (pbs.gov.au) and ANZCTR (needs JavaScript) in the browser.
# - MHRA: GOV.UK content and search APIs (curl); the MHRA Products substance index in the browser. MHRA Products
#   search results and product pages sit behind a disclaimer ('I have read and understand the disclaimer. Agree');
#   it was NOT accepted, so licence numbers and dates come from the SmPCs on emc (medicines.org.uk, curl) and from the
#   MHRA's published lists of granted marketing authorisations (PDF attachments on assets.publishing.service.gov.uk,
#   curl + pdftotext).
# - NICE, CMS, medicare.gov, Cornell LII, pCPA, ClinicalTrials.gov API v2: curl.
#
# REUSED, not re-registered here (ids exist):
# - src/data/sources/semaglutide.yaml: fda-drugsatfda-ozempic, fda-drugsatfda-rybelsus, fda-drugsatfda-wegovy,
#   fda-drugsatfda-wegovy-tablets, fda-label-ozempic, fda-label-wegovy, ema-epar-ozempic, ema-epar-rybelsus,
