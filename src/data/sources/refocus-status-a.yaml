# ================================================================ UNITED STATES: products (FDA)

fda-drugsatfda-search-status-a-2026-10-24:
  type: dataset
  authors: "U.S. Food and Drug Administration"
  title: "Drugs@FDA and openFDA drugsfda searches, 24 October 2026: semaglutide, tirzepatide, retatrutide"
  container: "Drugs@FDA / openFDA"
  year: 2026
  url: https://api.fda.gov/drug/drugsfda.json?search=openfda.generic_name:%22semaglutide%22+OR+products.active_ingredients.name:%22semaglutide%22&limit=100
  accessed: 2026-10-24
  verified: url
  note: "openFDA drugsfda (meta last_updated 2026-10-23), queried by generic name and active ingredient for semaglutide, tirzepatide and retatrutide, and the Drugs@FDA overview pages of every application found, read the same day. SEMAGLUTIDE (6 applications): NDA 209637 OZEMPIC injection (NOVO; ORIG-1 approved 2017-12-05, Type 1 New Molecular Entity; seven pen presentations, one of them, 2 mg/1.5 mL, 'Discontinued'); NDA 213051 RYBELSUS tablets 3, 7, 14 mg and OZEMPIC tablets 1.5, 4, 9 mg (ORIG-1 2019-09-20, Type 3 New Dosage Form); NDA 213182 RYBELSUS 3 and 7 mg (approved 2020-01-16 as a new indication submitted as a distinct NDA and consolidated with NDA 213051 after approval); NDA 215256 WEGOVY injection (ORIG-1 2021-06-04; presentations include single-dose pens, 'WEGOVY HD' 7.2 mg/0.75 mL and 'WEGOVY FLEXTOUCH' 9.6 mg/3 mL); NDA 218316 WEGOVY tablets 1.5, 4, 9, 25 mg (ORIG-1 2025-12-22, Type 3); ANDA 220314 semaglutide injection (APOTEX INC), 'Tentative Approval' on 2026-04-07 for three strengths: a tentative approval is not an approval and does not allow marketing. TIRZEPATIDE (2 applications): NDA 215866 MOUNJARO (ELI LILLY AND CO; ORIG-1 2022-05-13, Type 1) and NDA 217806 ZEPBOUND (ORIG-1 2023-11-08), each with single-dose pens ('autoinjector'), single-dose vials, multiple-dose vials and KWIKPEN presentations. RETATRUTIDE: 'No matches found' (also no application under LY3437943). No other company holds an approved application for either medicine. factcheck (24 October 2026): openFDA queried again (meta last_updated 2026-10-23): every application, sponsor, ORIG approval date, product and the Apotex tentative approval (ANDA 220314, 'TA' 2026-04-07) confirmed; brand-name queries (Ozempic, Wegovy, Rybelsus, Mounjaro, Zepbound) return only the seven Novo Nordisk and Lilly NDAs; 'LY3437943' and 'retatrutide' 'No matches found'. Added: single-dose manual prefilled syringes of Ozempic (0.25, 0.5 and 1 mg; NDA 209637/S-039) and of Wegovy injection (0.25 to 2.4 mg; NDA 215256/S-031 with 218316/S-003) were approved on 5 May 2026 (letters read: 'addition of a new presentation ... in a single dose manual prefilled syringe (mPFS)'); they are the 0.25/0.5/1 mg per 0.5 mL presentations in the list above."

