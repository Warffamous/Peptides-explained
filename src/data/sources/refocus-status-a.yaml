# Seller rule: authorised medicines and their marketing-authorisation holders are named for identification only.
# Regulator notices that name a seller, clinic or private person are cited only through existing index entries.
# No phone number is recorded anywhere below (several pages read list one).
#
# factcheck: INDEPENDENT FACT-CHECK, 24 October 2026 (this machine's clock; workflow date 23 October 2026).
# Method: every entry's document opened again. FDA: openFDA re-queried, all approval letters and the three labels
# re-downloaded (curl with a browser user agent; plain curl now gets an 'excessive requests' page) and read with
# pdftotext. CMS, medicare.gov, Cornell LII, NICE, SMC, GOV.UK (content and search APIs), emc and pdf.hres.ca with
# curl; all 118 MHRA granted-licence lists for 2021 to 2026 downloaded and searched. MHRA Products, TGA (ARTG,
# registrations, under evaluation, AusPAR, section 19A, site search, the three TGA pages), PBS, ANZCTR and the
# canada.ca pages (submissions under review; the DPD extract, unzipped by script inside the page) in the built-in
# browser. Health Canada decision documents on dhpp.hpfb-dgpsa.ca by curl. ClinicalTrials.gov API v2. pCPA JSON export
# downloaded again. NCBI Bookshelf still shows a reCAPTCHA check (not bypassed); the CDA-AMC recommendation summaries
# were read as PubMed abstracts instead (E-utilities efetch). Every "not authorised / not found" search was repeated
# with the recorded terms plus brands and codes (Kayshild, orforglipron, 'semaglutide tablet', LY3298176, NN9535,
# CAGRILINT, Sevmia, Sandoz, Aspen): all came back as recorded.
# Results: almost everything held. Corrections and additions are marked 'factcheck (24 October 2026)' in the notes:
# - us-cms-ipay2027-negotiated-prices: list price is the CY 2024 list price; the third 'commonly treated condition'
#   (cardiovascular disease and obesity/overweight) was missing; the URL token makes this entry fail the build as it
#   stands (SourceRef always links the url, and check-no-commerce scans every URL in src/data): UNRESOLVED.
# - ca-pm-mounjaro now points to the newer monograph 00084159 (2 April 2026); 00077180 (2024) is superseded.
# - au-tga-2024-09-counterfeit-ozempic-pens: the 'bought online, imported under personal importation' sentence is
#   about the pens found at the border, not the pen that caused the adverse event.
# - au-tga-pmr-search-status-a-2026-10-24: under-evaluation dates are publication dates, not acceptance dates.
# - fda-drugsatfda-search-status-a-2026-10-24: Ozempic and Wegovy single-dose syringes (5 May 2026) added.
# New entries (14): uk-mhra-ma-granted-2025, uk-mhra-ma-granted-2026, ca-pm-wegovy, ca-pm-rybelsus, ca-pm-plosbrio,
# ca-hc-ctsp-retatrutide-2026-10-24, ca-cda-amc-2022-wegovy, ca-cda-amc-2025-wegovy, ca-cda-amc-2026-mounjaro,
# ca-cda-amc-2026-zepbound, au-pbs-dusc-2024-06-semaglutide, au-pbs-medicine-status-wegovy,
# au-pbs-medicine-status-tirzepatide, au-pbac-2025-11-obesity-treatments-advice. They RESOLVE five of the writer's
# UNRESOLVED points (CDA-AMC content; Health Canada's trial database; Ozempic's first PBS listing date; PBAC history of
# Wegovy and tirzepatide; three Canadian monograph numbers).
# Not changed but noted for the merge: (1) scripts/check-no-commerce.ts scans every URL written anywhere in a src/data
# file, notes included, so the non-allowlisted URLs inside notes (emc, dhpp, pdf.hres.ca, ebs.tga.gov.au, pbs.gov.au,
