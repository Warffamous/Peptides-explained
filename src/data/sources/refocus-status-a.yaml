# ================================================================ UNITED STATES: how the medicines are paid for

us-usc-42-1395w-102-e:
  type: law
  authors: "Legal Information Institute, Cornell Law School (text of the United States Code)"
  title: "42 U.S. Code § 1395w-102 – Prescription drug benefits (Social Security Act § 1860D-2), subsection (e)"
  container: "United States Code"
  year: 2026
  url: https://www.law.cornell.edu/uscode/text/42/1395w-102
  accessed: 2026-10-24
  verified: url
  note: "Subsection (e)(2) 'Exclusions', (A): a 'covered part D drug' does not include drugs or classes of drugs, or their medical uses, 'which may be excluded from coverage or otherwise restricted under section 1396r–8(d)(2)' (with exceptions for smoking cessation agents, certain barbiturates and benzodiazepines, none relevant here). Read with us-usc-42-1396r-8-d, this is the statutory bar on Medicare Part D paying for a drug 'when used for' weight loss."

us-usc-42-1396r-8-d:
  type: law
  authors: "Legal Information Institute, Cornell Law School (text of the United States Code)"
  title: "42 U.S. Code § 1396r-8 – Payment for covered outpatient drugs (Social Security Act § 1927), subsection (d)"
  container: "United States Code"
  year: 2026
  url: https://www.law.cornell.edu/uscode/text/42/1396r-8
  accessed: 2026-10-24
  verified: url
  note: "Subsection (d)(1)(B): 'A State may exclude or otherwise restrict coverage of a covered outpatient drug if' it is on the list in (d)(2); (d)(2) 'List of drugs subject to restriction', (A): 'Agents when used for anorexia, weight loss, or weight gain.' Supports: state Medicaid programmes may choose not to cover medicines used for weight loss; Medicare Part D excludes them by reference (us-usc-42-1395w-102-e)."

us-cms-balance-model:
  type: regulator
  authors: "Centers for Medicare & Medicaid Services, Innovation Center"
  title: "BALANCE (Better Approaches to Lifestyle and Nutrition for Comprehensive hEalth) Model"
  container: "CMS.gov"
  year: 2026
  url: https://www.cms.gov/priorities/innovation/innovation-models/balance
  accessed: 2026-10-24
  verified: url
  note: "Page last modified 29 September 2026. Voluntary model under section 1115A of the Social Security Act: 'CMS will negotiate drug pricing and coverage terms with manufacturers of GLP-1 medications on behalf of state Medicaid agencies and Medicare Part D plan sponsors'; 'currently Medicare and Medicaid generally do not cover these drugs for the weight loss indication'. State Medicaid agencies can join from May 2026 through 1 January 2027; coverage in Medicaid 'will depend on participation by drug manufacturers and states' and 'will not guarantee coverage for any individual'. Drugs in the model: 'All formulations of Mounjaro, Ozempic, Rybelsus, and Wegovy, the KwikPen formulation of Zepbound, and Foundayo'. FAQ: the BALANCE Model is not launching in Medicare in 2027; the Medicare GLP-1 Bridge 'has been extended through December 31, 2027'."

us-cms-medicare-glp1-bridge:
  type: regulator
  authors: "Centers for Medicare & Medicaid Services"
  title: "Medicare GLP-1 Bridge (information for Part D plans and FAQs)"
  container: "CMS.gov"
  year: 2026
  url: https://www.cms.gov/medicare/coverage/prescription-drug-coverage/medicare-glp-1-bridge
  accessed: 2026-10-24
  verified: url
  note: "Page last modified 13 July 2026. 'Starting July 1, 2026, Medicare will begin a short-term demonstration, called the Medicare GLP-1 Bridge, that will provide eligible Medicare Part D beneficiaries with access to certain GLP-1 drugs' between 1 July 2026 and 31 December 2027; it 'will operate outside of the Medicare Part D benefit's coverage and payment flow' (central processor for prior authorisation and claims); authority: section 402(a)(1)(A) of the Social Security Amendments of 1967 as applied to Part D by section 1860D-42(b). 'Eligible beneficiaries will have a $50 copay'; the Part D deductible does not apply, the copay does not count towards out-of-pocket (TrOOP) costs, and there is no low-income subsidy. The page gives a telephone number, not recorded here."

us-medicare-gov-weight-loss-drugs:
  type: regulator
  authors: "Centers for Medicare & Medicaid Services"
  title: "Weight loss drugs (Medicare coverage)"
  container: "Medicare.gov"
  year: 2026
