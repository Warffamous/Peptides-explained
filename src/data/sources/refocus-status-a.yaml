  note: "Published 25 October 2023, last updated 1 September 2025 (last reviewed 11 May 2026). Rec. 1.1: recommended for type 2 diabetes in adults, with diet and exercise, only if triple therapy with metformin and two other oral antidiabetic drugs is ineffective, not tolerated or contraindicated, and the person has a BMI of 35 or more with specific psychological or other medical problems associated with obesity, or a BMI under 35 where insulin would have significant occupational implications or weight loss would benefit other significant obesity-related complications (lower thresholds, usually by 2.5, for some ethnic backgrounds); only under the commercial arrangement. NICE notes work to align TA924 with the updated guideline NG28."

