au-tga-advertising-glp1-prohibited:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Advertising Ozempic and GLP-1 receptor agonists is prohibited"
  container: "tga.gov.au"
  year: 2025
  url: https://www.tga.gov.au/products/regulations-all-products/advertising/specialised-advertising-issues-and-topics/advertising-ozempic-and-glp-1-receptor-agonists-prohibited
  accessed: 2026-10-24
  verified: url
  note: "Page first published 30 November 2022; 'Last updated 11 March 2025' (page metadata modified 23 April 2026; factcheck (24 October 2026): re-read in the browser, published 30 November 2022, both quotations below confirmed word for word, including the page's own grammatical slip). 'Ozempic and Wegovy (semaglutide), Mounjaro (tirzepatide) and Trulicity (dulaglutide) are GLP-1 receptor agonists are regulated as prescription-only medicines. This includes derivatives of semaglutide or dulaglutide such as retatrutide.' It is illegal to advertise them because prescription medicines cannot be advertised to the public, and 'For retatrutide, because it is an unapproved therapeutic good'. Off-label advertising (e.g. Ozempic for weight loss) is illegal 'even to health professionals'. This is the only TGA statement found that places retatrutide in the prescription-only class; the Poisons Standard does not name retatrutide (au-poisons-standard-2026-10) and does cover derivatives of a listed substance (its section 7). Whether retatrutide is in law a 'derivative' of semaglutide or dulaglutide is the TGA's view, not something this site can confirm: a legal reviewer should check before the page states 'Schedule 4' as settled law."

