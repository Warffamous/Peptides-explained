d 14 July 2025, including claims about cancer, HIV/AIDS and mental illness. Not read: a 20 July 2026 media release on peptide promoters (its URL contains a commerce word), and the hub's pages for consumers and health practitioners (the browser could not open them in the second run). FACT-CHECK: the health-practitioner page, the 'How we regulate' page and the 20 July 2026 release were read and registered by australia.yaml (au-tga-peptides-health-practitioners, au-tga-how-we-regulate-peptides, au-tga-2026-07-peptide-promoters-notice, the last marked DO NOT LINK); '\"thymosin beta 4\"' (quoted) also returns the October 2015 scheduling consultation, now registered as au-tga-2015-10-tb500-scheduling-consultation; the Federal Court release's date, dates of conduct, examples and claims were re-read and match. AusPAR 'bremelanotide': no result (control 'afamelanotide': 1). Prescription medicines under evaluation 'bremelanotide': no result (control 'semaglutide': 1). No application for any of the six compounds is public."

