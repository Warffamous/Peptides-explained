  year: 2026
  url: https://www.legislation.gov.uk/eur/2009/1223/article/2
  accessed: 2026-10-23
  verified: url
  note: "Read on 23 October 2026 (both runs; legislation.gov.uk publishes the UK version, as amended by the Product Safety and Metrology etc. (Amendment etc.) (EU Exit) Regulations 2019, SI 2019/696, Schedule 34). Article 2(1)(a): 'cosmetic product' means any substance or mixture intended to be placed in contact with the external parts of the human body (epidermis, hair system, nails, lips and external genital organs) or with the teeth and the mucous membranes of the oral cavity, with a view exclusively or mainly to cleaning them, perfuming them, changing their appearance, protecting them, keeping them in good condition or correcting body odours. Article 2(2): 'a substance or mixture intended to be ingested, inhaled, injected or implanted into the human body shall not be considered to be a cosmetic product.' In Northern Ireland the EU Regulation applies (eu-regulation-1223-2009-cosmetics), with the same wording."

