  year: 2025
  url: https://www.tga.gov.au/news/blog/dont-risk-using-tanning-products-containing-melanotan
  accessed: 2026-10-23
  verified: url
  note: "Published 24 January 2025; read in a browser on 23 October 2026 and checked against the Internet Archive capture of 9 July 2026. Melanotan nasal sprays and injectable and ingestible tanning products 'are being illegally promoted and sold online'; 'the most common side effects include headache, nausea, vomiting, loss of appetite, and facial redness, the most concerning one is the risk of serious skin cancers. With melanotan-II, there have been reports of increased moles and freckles, kidney dysfunction and swelling of the brain.' 'Melanotan is not approved for sale or use as a tanning agent in Australia.' 'It is illegal to supply tanning products containing melanotan without a doctor's prescription', whatever the form (spray, tablet, injection, cream), and illegal to advertise melanotan to the Australian public, including promotion by social media influencers. A tan 'will not protect against UV exposure the way a suitable sunscreen will'."

