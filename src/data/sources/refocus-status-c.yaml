au-tga-2018-02-melanotan-ii-interim-decision:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Scheduling delegates' interim decisions and invitation for further comment: ACCS/ACMS, November 2017 (section 1.7, Melanotan II)"
  container: "tga.gov.au"
  year: 2018
  url: https://www.tga.gov.au/resources/publication/scheduling-decisions-interim/scheduling-delegates-interim-decisions-and-invitation-further-comment-accsacms-november-2017
  accessed: 2026-10-24
  verified: url
  note: "FACT-CHECK (24 October 2026): the URL first recorded (tga.gov.au/book-page/17-melanotan-ii) and the section's later address (.../accsacms-november-2017/17-melanotan-ii) both redirect to this live publication page (published 5 February 2018; consultation closed 5 March 2018), which lists '1.7 Melanotan II' and links the full text as a PDF (not opened). The fact-checker re-read the section from the Internet Archive capture of 16 March 2023 of its former page: every point below holds. Entry wording: the applicant proposed a Schedule 10 entry 'MELANOTAN II for cosmetic or therapeutic use'; the ACMS recommended a plain 'MELANOTAN II.' in Schedule 4 with an index cross-reference to alpha-melanocyte stimulating hormone; the delegate's interim entry read 'MELANOTAN II for cosmetic or therapeutic use' (the Poisons Standard from June 2018 has 'MELANOTAN II.'). The page also says melanotan II 'is not an excipient or active in any medicines on the ARTG' and is not in the Permissible Ingredients Determination. First run: dated 5 February 2018; read on 23 October 2026 from the Internet Archive capture of 7 August 2022 of the former URL. An applicant had asked for melanotan II to be put in Schedule 10 (substances whose supply and use are prohibited), citing its use as an injected 'lifestyle drug' for sunless tanning, appetite suppression and sexual stimulation and reported toxicity. The Advisory Committee on Medicines Scheduling instead recommended a new Schedule 4 entry, with effect from 1 June 2018, and the delegate's interim decision was Schedule 4. Reasons given include: 'There is no body of evidence demonstrating therapeutic benefits of melanotan II'; products of unknown quality with contamination and stability concerns (multi-dose vials); toxicity largely from case reports and regulators' reports, including renal dysfunction, rhabdomyolysis, changes in moles with one report of melanoma, posterior reversible encephalopathy syndrome and refractory priapism; dosing errors and infection risks; and supplier claims that it protects skin from sun damage. At the time melanotan II was not in any ARTG medicine. (The page also states a supposed dose; not for print.)"

