  note: "Searched in a browser on 23 October 2026 (the search also shows ClinicalTrials.gov records). 'bremelanotide': 2 records, both University of Sydney trials registered in October 2015 (anzctr-actrn12615001033538, completed; anzctr-actrn12615001059550, still shown as recruiting but last updated 17 November 2017). 'melanotan': 1 record, ACTRN12605000370606 (2005), which tests 'EPT 1647', the afamelanotide (melanotan I) implant, not melanotan II. 'BPC-157', 'TB-500', 'KPV', 'GHK': 0 records. 'thymosin': 11 records. FACT-CHECK (24 October 2026): the second run said none tests thymosin beta-4, but two do involve it: Australian device studies of an injectable dental bone-graft biomaterial in which a synthetic thymosin beta-4 peptide ('Thymosin B4') is chemically bonded to a polymer: ACTRN12617001279314 (tooth extraction; registered retrospectively; 10 participants, April 2017 to April 2018; completed) and ACTRN12618000323224 (jaw surgery; withdrawn before enrolment for 'Lack of funding/staff/facilities'). Both are commercially sponsored (product and sponsor names not for print). Neither tests TB-500 or a thymosin beta-4 medicine, and neither is open, so they do not make thymosin beta-4 'investigational' in Australia. The other nine are ClinicalTrials.gov oncology and hepatitis B records whose interventions (checked) are other drugs. 'copper peptide': 1 record, a copper-64 imaging agent (NCT05613842), not GHK-Cu. FACT-CHECK (24 October 2026): all searches repeated in the browser with the same results; 'PT-141' (new) returns the same two University of Sydney records."

