au-tga-2026-08-melanotan-ii-safety-alert:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Melanotan II tanning peptide products found to be inconsistently dosed (safety advisory)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/safety/safety-monitoring-and-information/safety-alerts/melanotan-ii-tanning-peptide-products-found-be-inconsistently-dosed
  accessed: 2026-10-23
  verified: url
  note: "Published 17 August 2026; read in a browser on 23 October 2026 and checked against the Internet Archive capture of 11 October 2026. 'Melanotan II is a prescription-only medicine in Australia and is not approved for use as a tanning agent. There are currently no products containing Melanotan II included in the Australian Register of Therapeutic Goods (ARTG) or approved for supply in Australia.' TGA laboratory testing of five seized nasal spray bottles, all labelled with the same strength (30 mg), confirmed melanotan II and estimated contents of 22 mg to 54 mg per bottle (our arithmetic: about 73% to 180% of the label; the page gives the milligrams, not percentages); 'The inconsistent dosage across the bottles further increases the chance of adverse events'. The products were those supplied by the individual in au-tga-2026-05-melanotan-ii-infringement-notices. Consumers are told to stop using melanotan II tanning products and take remaining product to a pharmacy for disposal. (The page prints the product's brand name and a TGA phone number; neither is for print.)"

