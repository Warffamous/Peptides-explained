si, timbetasin, \"copper tripeptide\" and BPC157; fuzzy matches only for GHK-Cu (810), KPV (1,237) and TB500 (4); one result each for melanotan and thymosin, hidden behind a disclaimer box that the fact-checker did not tick, so those two hits were not identified (UNRESOLVED, minor: neither can be a licensed product containing melanotan or thymosin, since the substance index lists neither as an active substance, but whether some SmPC or leaflet mentions either word was not established); control afamelanotide: 2. The GHK-Cu UK row therefore stands on the substance index plus the search-box zeros for prezatide and \"copper tripeptide\"."

