  accessed: 2026-10-23
  verified: url
  note: "Last updated 23 September 2026; read in a browser on 23 October 2026 (both runs). 'While some peptide products are approved for use in Australia, many products promoted online are unapproved therapeutic goods and may be unlawful to import, supply or advertise.' 'Not all products containing peptides are regulated by us. How a peptide product is regulated depends on what it contains, how it is promoted and what it is intended to do'; a peptide product is a therapeutic good if, for example, it is promoted, supplied or generally used to prevent or treat disease or to 'influence, inhibit or modify a physiological process in the body'; 'Some peptide products may be regulated as cosmetics rather than a therapeutic good if their ingredients, claims, presentation and intended use are limited to cosmetic purposes.' Lists au-tga-2026-05-peptide-import-warning, au-tga-2026-08-melanotan-ii-safety-alert, au-tga-2026-08-peptide-seizure, a 14 September 2026 retatrutide alert, a 20 July 2026 media release and the 28 September 2026 Federal Court release summarised in au-tga-search-status-c-2026-10-23. FACT-CHECK (24 October 2026): live page re-read, quotations match. Its sub-pages 'How we regulate therapeutic peptide products' and 'Peptide product information for health practitioners' are registered in australia.yaml (au-tga-how-we-regulate-peptides, au-tga-peptides-health-practitioners); the consumer sub-page's URL contains the commerce token 'buying' and is not registered."

au-tga-2025-01-melanotan-blog:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Don't risk using tanning products containing melanotan (blog)"
