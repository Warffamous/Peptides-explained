# Sources added by group melanotan-ii (Dutch site, 27 October 2026) for /nl/compounds/melanotan-ii/.
# Both documents below were fetched with curl on 27 October 2026 from the EMA (HTTP 200) and converted with
# pdftotext; the quoted wording was found in the text, and the dates come from the documents and from the EMA's
# EPAR pages ("Product information ... Last updated"). Every other id on the page is reused from the existing
# registry (melanotan-ii.yaml, history.yaml, safety-a.yaml, safety-b.yaml, guides.yaml, legal-a.yaml, shared.yaml,
# nl-research-*.yaml, nl-safety-c.yaml and others; research/nl-notes/melanotan-ii.md lists them).

ema-pi-scenesse-nl:
  type: label
  authors: "European Medicines Agency"
  title: "Scenesse — Bijlage I: Samenvatting van de productkenmerken (EPAR-productinformatie, Nederlands)"
  year: 2026
  url: https://www.ema.europa.eu/nl/documents/product-information/scenesse-epar-product-information_nl.pdf
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 (the EPAR page gives the English product information as last updated 07/10/2026). Afamelanotide, not melanotan II. First line: 'Dit geneesmiddel is onderworpen aan aanvullende monitoring.' Section 1: 'SCENESSE 16 mg implantaat'. 4.1: 'SCENESSE is geïndiceerd voor de preventie van fototoxiciteit bij volwassen patiënten met erytropoëtische protoporfyrie (EPP).' 4.2: 'SCENESSE mag alleen worden voorgeschreven door specialisten in erkende porfyriecentra'. 4.3: hypersensitivity; 'Aanwezigheid van ernstige leverziekte'; 'Leverfunctiestoornis'; 'Nierfunctiestoornis'. 4.4: anaphylaxis has been reported; patients keep their usual sun protection; 'Afamelanotide kan door zijn farmacologische effect donkere verkleuring van reeds bestaande pigmentaire laesies teweegbrengen. Er wordt aangeraden regelmatig (elke 6 maanden) een huidonderzoek van het hele lichaam uit te voeren'; long-term safety data are limited (no trials longer than 2 years). 4.6: not to be used in pregnancy or while breastfeeding. 4.8 (425 patients): 'misselijkheid, ondervonden door ongeveer 19% ... hoofdpijn (20%) en reacties op de implantatieplaats (21%...)'; hypersensitivity including anaphylaxis 'soms'. 5.1: 'Afamelanotide is een synthetisch tridecapeptide en een structurele analoog van α-melanocyt-stimulerend hormoon'; binds mainly to MC1R; increases eumelanin, which contributes to protection against light. 'Dit geneesmiddel is geregistreerd onder ‘uitzonderlijke voorwaarden’'. Section 8: EU/1/14/969/001. Section 9: 'Datum van eerste verlening van de vergunning: 22 december 2014'. Cited for: the EU indication, prescribing restriction, main side effects, contraindications and skin-check advice of afamelanotide, a different medicine from melanotan II."

ema-pi-imcivree-nl:
  type: label
  authors: "European Medicines Agency"
  title: "Imcivree — Bijlage I: Samenvatting van de productkenmerken (EPAR-productinformatie, Nederlands)"
  year: 2026
  url: https://www.ema.europa.eu/nl/documents/product-information/imcivree-epar-product-information_nl.pdf
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 (the EPAR page gives the product information as last updated 27/05/2026). Setmelanotide, not melanotan II. 4.1: obesity and control of hunger in adults and children from 4 years with acquired hypothalamic obesity 'als gevolg van beschadiging of stoornis van de hypothalamus'; in genetically confirmed Bardet-Biedl syndrome (from 2 years); and in genetically confirmed biallelic POMC deficiency (including PCSK1 deficiency) or biallelic LEPR deficiency (from 2 years). 4.3: hypersensitivity only. 4.4: 'Het farmacologische effect van setmelanotide kan leiden tot gegeneraliseerde toegenomen huidpigmentatie en donkere verkleuring van reeds bestaande naevi ... Vóór en tijdens de behandeling met setmelanotide moet jaarlijks een huidonderzoek van het hele lichaam worden uitgevoerd'; heart rate and blood pressure checked at each visit; spontaneous erections, and an erection lasting longer than 4 hours needs urgent care for possible priapism; depression. 4.8: 'De meest voorkomende bijwerkingen zijn hyperpigmentatiestoornissen (66%), reacties op de injectieplaats (45%), nausea (36%) en hoofdpijn (19%)'; melanocytic naevus 'zeer vaak'. Section 8: EU/1/21/1564. Section 9: 'Datum van eerste verlening van de vergunning: 16 juli 2021'. Cited for: setmelanotide's EU indications, main side effects and skin-check warning."
