# ------------------------------------------------------------------ Netherlands

fk-tirzepatide:
  type: regulator
  authors: "Zorginstituut Nederland"
  title: "Tirzepatide — Farmacotherapeutisch Kompas (preparaattekst)"
  container: "Farmacotherapeutisch Kompas"
  year: 2026
  url: https://www.farmacotherapeutischkompas.nl/bladeren/preparaatteksten/t/tirzepatide
  accessed: 2026-10-20
  lang: nl
  verified: url
  note: "Mounjaro: Bijlage 2 (conditional reimbursement) and additional monitoring; single-dose vials and KwikPen listed. Advies: NHG-Standaard Diabetes mellitus type 2 (2024) advises against tirzepatide in type 2 diabetes without very high cardiovascular risk (little experience, very high costs); NHG-Standaard Obesitas (2025) advises against it for obesity in primary care; in secondary care obesity medicines can be considered from a moderately raised weight-related health risk. Interactions: narrow-therapeutic-index oral drugs (vitamin K antagonists, digoxin), sulfonylurea/insulin, reports of lithium toxicity. Pregnancy: adequate contraception; stop at least 1 month before a planned pregnancy."

fk-regeling-zorgverzekering-bijlage-2-tirzepatide:
  type: law
  authors: "Zorginstituut Nederland"
  title: "Regeling zorgverzekering, bijlage 2 (as reproduced in the Farmacotherapeutisch Kompas) — item 194: tirzepatide"
  container: "Farmacotherapeutisch Kompas"
  year: 2026
  url: https://www.farmacotherapeutischkompas.nl/algemeen/regeling-zorgverzekering
  accessed: 2026-10-20
  lang: nl
  verified: url
  note: "Item 194, only for insured persons aged 18 or over with type 2 diabetes: BMI of 30 or more and not controlled on metformin plus a sulfonylurea at maximum tolerated doses and not using insulin; or added to metformin and basal insulin (BMI of 30 or more) after 3 months of optimised basal insulin; or, with very high cardiovascular risk (proven cardiovascular disease and/or chronic kidney damage), added to an SGLT2 inhibitor and metformin (or when an SGLT2 inhibitor is contraindicated)."

zin-tirzepatide-obesity-assessment:
  type: regulator
  authors: "Zorginstituut Nederland"
  title: "Advies — wel of niet vergoeden tirzepatide (Mounjaro®) voor de behandeling van obesitas (werkagenda)"
  year: 2026
  url: https://www.zorginstituutnederland.nl/werkagenda/stofwisseling-en-hormoonhuishouding/gvs-advies-tirzepatide-mounjaro-voor-de-behandeling-van-obesitas
  accessed: 2026-10-20
  lang: nl
  verified: url
  note: "Only reimbursed from basic insurance if included in the GVS. Staged approach: first BMI of 30 or more with related disease, and BMI of 35 or more. Dossier complete March 2026; first Scientific Advisory Council (WAR) discussion 5 October 2026; technical consultation expected early November 2026 (was 12-18 October 2026); second WAR discussion, ACP discussion and publication 'nog niet bekend'."

