  pmid: "32730231"
  pmcid: PMC7526454
  verified: pubmed
  note: "Lilly authors with Duke University co-authors (NIDDK grants). Predicted receptor occupancy favours GIPR; at GLP-1R biased towards cAMP over β-arrestin, weaker receptor internalisation; mouse islet experiments."

