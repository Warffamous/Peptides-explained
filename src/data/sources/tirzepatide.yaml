# ------------------------------------------------------------------ discovery and mechanism

coskun-2018-ly3298176:
  type: article
  authors: "Coskun T, Sloop KW, Loghin C, Alsina-Fernandez J, Urva S, Bokvist KB, et al."
  title: "LY3298176, a novel dual GIP and GLP-1 receptor agonist for the treatment of type 2 diabetes mellitus: From discovery to clinical proof of concept"
  container: "Molecular Metabolism"
  year: 2018
  volume: "18"
  pages: "3-14"
  doi: 10.1016/j.molmet.2018.09.009
  pmid: "30473097"
  pmcid: PMC6308032
  verified: pubmed
  note: "Checked in the PMC full text: 39 amino acids, Aib at 2 and 13, C20 fatty diacid via a linker on Lys20, amidated C-terminus; GIPR Ki 0.135 nM (comparable to native GIP), GLP-1R Ki 4.23 nM (about 5-fold weaker than native GLP-1); minimal glucagon-receptor activity; human half-life about 5 days (116.7 h); 142 people dosed (NCT02759107). Introduction: GIP is secreted from K cells in the upper small intestine in response to food (cited for the page-photo caption)."

willard-2020-imbalanced-biased:
  type: article
  authors: "Willard FS, Douros JD, Gabe MB, Showalter AD, Wainscott DB, Suter TM, et al."
  title: "Tirzepatide is an imbalanced and biased dual GIP and GLP-1 receptor agonist"
  container: "JCI Insight"
  year: 2020
  volume: "5"
  pages: "e140532"
  doi: 10.1172/jci.insight.140532
  pmid: "32730231"
  pmcid: PMC7526454
  verified: pubmed
  note: "Lilly-led, with Duke and Copenhagen co-authors; Europe PMC full text lists NIDDK/NIH and ADA support for academic authors. Predicted receptor occupancy favours GIPR; at GLP-1R biased towards cAMP over beta-arrestin recruitment, with weaker receptor internalisation; mouse islet experiments."

samms-2021-gipr-insulin-sensitivity:
  type: article
  authors: "Samms RJ, Christe ME, Collins KA, Pirro V, Droz BA, Holland AK, et al."
