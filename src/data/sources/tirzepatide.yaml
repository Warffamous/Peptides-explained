fda-label-mounjaro:
  type: label
  authors: "U.S. Food and Drug Administration / Eli Lilly and Company"
  title: "MOUNJARO (tirzepatide) injection — prescribing information (revised 08/2026)"
  year: 2026
  url: https://www.accessdata.fda.gov/drugsatfda_docs/label/2026/215866s044s045lbl.pdf
  accessed: 2026-10-20
  verified: url
  note: "Boxed warning (rat thyroid C-cell tumours); indications: glycaemic control in adults and children from 10 years, and reduction of major adverse cardiovascular events in adults with type 2 diabetes at high risk; contraindications MTC/MEN 2 and serious hypersensitivity; 6.2 postmarketing (haemorrhagic and necrotising pancreatitis sometimes fatal, ileus, acute renal failure); 8.3 oral hormonal contraceptives: switch to a non-oral method or add a barrier method for 4 weeks after starting and after each dose increase; 11 (based on the GIP sequence, Aib at 2 and 13, C-terminal amide, Lys20 attached to 1,20-eicosanedioic acid via a linker; 4813.53 Da; C225H348N48O68); 12.6 (anti-drug antibodies 51%; more hypersensitivity and injection-site reactions in antibody-positive patients); 13.1; 14.6 SURPASS-CVOT incl. all-cause death 8.5% vs 10.1% (not controlled for type I error). Re-read 26 October 2026 (research/refocus-notes/finish.md): 12.1 insulin secretion and glucagon 'both in a glucose-dependent manner'; Table 2 monotherapy glucose <54 mg/dL in 0-1%; 5.3 increased risk of hypoglycaemia, including severe, with an insulin secretagogue or insulin, 'may be lowered by a reduction in the dose of sulfonylurea … or insulin'; 7.1 'consider reducing the dose'; 17 educate patients on the signs and symptoms; 8.1 rat and rabbit embryo-fetal effects with lower maternal weight and food intake, 'should be used during pregnancy only if the potential benefit justifies the potential risk to the fetus'."

