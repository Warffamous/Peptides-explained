  accessed: 2026-10-20
  verified: url
  note: "Indications: weight reduction and long-term maintenance in adults with obesity or overweight with a weight-related condition; moderate to severe OSA in adults with obesity. Recent Major Changes: 'Suicidal Behavior and Ideation (Removed) 02/2026'. 5.4: cholecystitis 0.7% vs 0.2% in two pooled weight-reduction trials."

