  pmid: "34003802"
  pmcid: PMC8203452
  verified: pubmed
  note: "PubMed conflict-of-interest statement: all authors are current or past employees of Eli Lilly and Company."

killion-2018-gipr-antagonist:
  type: article
  authors: "Killion EA, Wang J, Yie J, Shi SD, Bates D, Min X, et al."
  title: "Anti-obesity effects of GIPR antagonists alone and in combination with GLP-1R agonists in preclinical models"
