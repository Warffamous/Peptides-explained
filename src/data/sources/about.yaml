nl-telecommunicatiewet-art-11-7a:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Telecommunicatiewet, artikel 11.7a (opslaan van of toegang tot informatie in de randapparatuur van een gebruiker)"
  container: "wetten.overheid.nl (BWBR0009950), version in force from 15 August 2026"
  year: 1998
  url: https://wetten.overheid.nl/BWBR0009950/2026-08-15/#Hoofdstuk11_Paragraaf11.1_Artikel11.7a
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Lid 1: storing or reading information on a user's device is only allowed after clear and complete information and the user's consent. Lid 3: this does not apply when the storage or access is solely to carry out the communication, or is strictly necessary to provide the information-society service the user has asked for (or, with no or minor privacy impact, to measure the quality or effectiveness of the service). The Dutch implementation of the ePrivacy Directive's cookie rule."

