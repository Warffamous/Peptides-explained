uk-emc-smpc-mounjaro-kwikpen-2-5mg:
  type: label
  authors: "Eli Lilly Nederland B.V. (SmPC as published on emc)"
  title: "Mounjaro KwikPen 2.5 mg solution for injection in pre-filled pen — Summary of Product Characteristics"
  container: "emc (medicines.org.uk)"
  year: 2026
  url: https://www.medicines.org.uk/emc/product/15481/smpc
  accessed: 2026-10-27
  verified: url
  note: "Re-read 27 October 2026; last updated on emc 8 September 2026. Section 7 'Eli Lilly Nederland B.V., Orteliuslaan 1000, 3528 BD Utrecht, The Netherlands'; section 8 'PLGB 14895/0340' to '/0345' (the six KwikPen strengths); section 9 'Date of first authorisation: 25 January 2024'; section 10 'Date of revision of the text 29 August 2026'; subject to additional monitoring. Section 4.1: type 2 diabetes in 'adults, adolescents and children aged 10 years and above' when not well controlled, as an adjunct to diet and exercise (monotherapy when metformin is inappropriate, or with other diabetes medicines); weight management, including weight loss and weight maintenance, in adults with an initial BMI of 30 or more, or 27 to under 30 with at least one weight-related comorbid condition; obstructive sleep apnoea and heart failure results are referred to section 5.1. When the children's indication was added in the UK is not stated (a GOV.UK search on 27 October 2026 found no MHRA notice). Section 4.3, the only contraindication: 'Hypersensitivity to the active substance or to any of the excipients listed in section 6.1.' Section 5.3: in a 2-year rat study tirzepatide 'caused an increase in thyroid C-cell tumours (adenomas and carcinomas) at all doses compared to controls. The human relevance of these findings is unknown'; a 6-month study in rasH2 transgenic mice found no increase. No medullary thyroid carcinoma or MEN 2 warning (neither term appears). Section 4.6: stop at least 1 month before a planned pregnancy. The KwikPen was not the first UK Mounjaro licence: single-dose pens PLGB 14895/0317, 0318 and 0320 to 0323 were granted on 26 September 2022 (uk-mhra-ma-granted-2022) and vials PLGB 14895/0331 to 0336 on 1 September 2023 (uk-mhra-ma-granted-2023); neither SmPC is on emc. Cited for: the label link and indications of the UK Mounjaro row (children from 10 with type 2 diabetes by October 2026), the KwikPen licence, and how the UK product information treats the rat thyroid finding."

uk-emc-search-2026-10-24:
  type: dataset
  authors: "Datapharm (electronic medicines compendium, emc)"
  title: "emc searches, 24 and 27 October 2026: elamipretide and thymalfasin (UK product information)"
  container: "emc (medicines.org.uk)"
  year: 2026
  url: https://www.medicines.org.uk/emc/search?q=elamipretide
  accessed: 2026-10-27
  verified: url
  note: "Searched by the research and its fact-check on 24 October 2026 (research/refocus/sources/us-uk-routes.yaml) and again on 27 October 2026 (server-rendered results pages): 'No search results for' elamipretide, Forzinity, SS-31, MTP-131, Bendavia, 'elamipretide hydrochloride', Szeto-Schiller, thymalfasin, Zadaxin, thymosin and 'thymosin alpha 1'. Control: 'wegovy' '10 results found', Wegovy pens and Wegovy tablets. LIMIT: emc is not the licensing register and does not list every UK-licensed product, so this supports, but does not prove, that neither elamipretide nor thymalfasin has a UK licence. The MHRA Products database found no elamipretide product, but three 'Zadaxin' documents behind its disclaimer remain unread (mhra-products-search-elamipretide-thymalfasin), so this entry does not support 'thymalfasin is not licensed in the UK'. Not cited on a page (27 October 2026). Supports: no UK product information for elamipretide or thymalfasin on emc."
