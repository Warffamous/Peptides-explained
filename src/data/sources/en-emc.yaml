  accessed: 2026-10-27
  verified: url
  note: "New entry, 27 October 2026 (the research named this page in the Rybelsus 3 mg note). Last updated on emc 7 April 2026; not marked 'Discontinued' (nor are the 4 and 9 mg tablets). Section 7 holder Novo Nordisk A/S (Bagsværd, Denmark); section 8 'PLGB 04668/0451'; section 9 'Date of first authorisation: 06 December 2024'; revision 03/2026. Section 4.1: adults with insufficiently controlled type 2 diabetes as an adjunct to diet and exercise, 'as monotherapy when metformin is considered inappropriate due to intolerance or contraindications' or 'in combination with other medicinal products for the treatment of diabetes'. Section 4.3 hypersensitivity only; 5.3 the rodent thyroid C-cell wording of the other semaglutide SmPCs ('The relevance for humans is considered to be low, but cannot be completely excluded'). Cited for: the label link and indication of the UK Rybelsus row in the products table (the current tablet; the row's date, 1 January 2021, is the original tablets' licence, uk-emc-smpc-rybelsus-3mg)."

uk-emc-smpc-wegovy-flextouch-0-25mg:
  type: label
  authors: "Novo Nordisk A/S (SmPC as published on emc)"
  title: "Wegovy 0.25 mg FlexTouch solution for injection in pre-filled pen — Summary of Product Characteristics"
  container: "emc (medicines.org.uk)"
  year: 2026
  url: https://www.medicines.org.uk/emc/product/13799/smpc
  accessed: 2026-10-27
  verified: url
  note: "Re-read 27 October 2026; last updated on emc 22 September 2026. Holder Novo Nordisk A/S; 'PLGB 04668/0436'; 'Date of first authorisation: 10 May 2022'; revision 09/2026; subject to additional monitoring. Section 4.1: weight management with a reduced-calorie diet and increased physical activity in adults with an initial BMI of 30 kg/m2 or more, or 27 to under 30 with at least one weight-related comorbidity; in adolescents aged 12 and above with obesity and body weight above 60 kg; reducing the risk of major adverse cardiovascular events in adults with established cardiovascular disease and obesity or overweight (BMI 27 or more); non-cirrhotic MASH with moderate to advanced fibrosis (F2 to F3), for which section 5.1 says the authorisation 'has been changed to conditional marketing authorisation' pending further evidence. Section 4.3 hypersensitivity only; 5.3 the rodent thyroid C-cell wording ('The relevance for humans is considered to be low, but cannot be completely excluded'); no medullary thyroid carcinoma or MEN 2 warning. The FlexTouch pens were not the first UK Wegovy licences: single-dose pens PLGB 04668/0429 to 0433 were granted on 24 September 2021 (uk-mhra-ma-granted-2021); their SmPC is not on emc. Cited for: the label link and indications of the UK Wegovy injection row, and how the UK product information treats the rodent thyroid finding."

