gesund-bund-notfallnummern:
  type: regulator
  authors: "Bundesministerium für Gesundheit (gesund.bund.de)"
  title: "Numbers to call in the event of an emergency"
  year: 2022
  url: https://gesund.bund.de/en/notfallnummern
  accessed: 2026-10-22
  verified: url
  note: "As at 8 June 2022. 116 117 helps people with urgent medical problems outside practice hours that are not life-threatening, at night, at weekends and on public holidays; poison control centres are run by the federal states, give emergency advice by phone on human poisoning and can be reached 24 hours a day."
