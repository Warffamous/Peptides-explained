  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "The NVIC 'informeert artsen, apothekers en andere professionele hulpverleners' about poisonings; members of the public who suspect a poisoning should contact their GP, or the huisartsenpost outside office hours ('Neem dan contact op met uw huisarts (of buiten kantooruren met de huisartsenpost)'); the doctor can reach the NVIC day and night."

lareb-2021-illegal-medicines:
  type: web
  authors: "Bijwerkingencentrum Lareb"
  title: "Risico's illegale geneesmiddelen (Medicijnjournaal december 2021)"
  year: 2021
