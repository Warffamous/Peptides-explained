# Source of review answer O15 (docs/REVIEW-2026-10-27-dutch-site.md section 1.1, owner approved, 4 November 2026):
# the Dutch source for the product check's "keep" item (src/data/product-check.yaml, local_sources.NL), cited on
# Dutch pages in place of nhs-poisoning. Host www.apotheek.nl is already on config/link-allowlist.json ("KNMP public
# medicines information (non-commercial)"). The page was read on 4 November 2026 on apotheek.nl itself; the note
# says what it showed.

apotheek-vergiftiging:
  type: web
  authors: "Apotheek.nl (KNMP, Royal Dutch Pharmacists Association)"
  title: "Vergiftiging"
  year: 2021
  url: https://www.apotheek.nl/klachten-ziektes/vergiftiging
  accessed: 2026-11-04
  lang: nl
  verified: url
  note: "Read 4 November 2026. 'Laatst bijgewerkt KNMP: 16-06-2021' (also 'Laatst bijgewerkt NHG: 29-04-2014'); text by the KNMP's Geneesmiddel Informatie Centrum. Under 'Wat kunt u doen als er sprake is van een vergiftiging?': 'Bewaar zo mogelijk restanten van het middel of de verpakking waar het in zat.' and 'Zoek medische hulp bij uw huisarts, de huisartsenpost, de spoedhulp van een ziekenhuis of bel 112.' The same paragraph says not to make someone vomit when you do not know what they took, and to watch their breathing, pulse and temperature. Cited for: in a possible poisoning, keep what is left of the product and the packaging it came in, and get medical help. The page says nothing about lab tests (that part rests on antonacci-2026-falsified-semaglutide-coma)."
