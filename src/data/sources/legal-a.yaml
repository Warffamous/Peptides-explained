  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Everyone has the right to bring, or to have sent, from another Member State a reasonable quantity of medicines lawfully obtained in that Member State, for own use (inserted by the law of 17 July 2015, in force 27 August 2015)."

be-medicines-law-1964-art-16:
  type: law
  authors: "Belgische Staat / État belge"
  title: "Wet van 25 maart 1964 op de geneesmiddelen voor menselijk gebruik, artikel 16 (straffen)"
  container: "ejustice.just.fgov.be (Justel; text updated to 4 June 2026)"
