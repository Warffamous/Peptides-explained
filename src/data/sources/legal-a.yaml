  note: "Page 'Last updated on 13/11/2023'. Read in the Internet Archive snapshot of 18 June 2026 (CAPTCHA on the live site, see famhp-postal-seizure-qa). Any suspected adverse reaction can be reported at www.famhp.be/en/side_effect; anyone who experiences one can report it, as can family or friends and health professionals; required fields are the person, a description, the suspected medicine and the course of the reaction; reports are assessed and entered into international pharmacovigilance databases under the GDPR."

famhp-compassionate-use-medical-need:
