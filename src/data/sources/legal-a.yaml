# ---------------------------------------------------------------- Netherlands: Geneesmiddelenwet (version in force from 9 September 2025)

nl-gnw-art-1-reclame:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 1, eerste lid, onder hh, xx en ijij (invoeren, reclame, publieksreclame)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#HoofdstukI_Artikel1
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Art. 1(1)(hh): 'invoeren' is bringing medicines into the Netherlands from a third country (outside the EU/EEA). Art. 1(1)(xx): 'reclame' is 'elke vorm van beïnvloeding met het kennelijke doel het voorschrijven, ter hand stellen of gebruiken van een geneesmiddel te bevorderen'. Art. 1(1)(ijij): 'publieksreclame' is advertising that is evidently also aimed at people other than health professionals."

nl-gnw-art-18-licence:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 18 (vergunning voor bereiden, invoeren en groothandel)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk3_Paragraaf1_Artikel18
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Lid 1: without a licence from the Minister it is forbidden to prepare (make), import, hold in stock, offer for sale, supply or export medicines, or to run a wholesale business; and forbidden to run a wholesale business in medicines that have no marketing authorisation. Lid 5: small-scale preparation in a pharmacy by or for a pharmacist (or dispensing GP) is exempt. Lid 6(a): the licence rule does not apply to importing or bringing in medicines 'die kennelijk zijn bestemd voor eigen gebruik door de persoon die de desbetreffende geneesmiddelen vervoert' (clearly for the own use of the person carrying them)."

nl-gnw-art-67a-distance-selling:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 67a (verkoop op afstand)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk6_Artikel67a
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Lid 1: without prejudice to arts. 61, 62 and 67, it is forbidden to offer for sale, sell or hand over medicines at a distance other than under the ministerial rules that implement Directive 2001/83."

nl-gnw-art-84-85-advertising:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikelen 84 en 85 (reclame; publieksreclame)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk9_Paragraaf1_Artikel84
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Art. 84(1): 'Reclame voor dan wel gunstbetoon met betrekking tot een geneesmiddel waarvoor geen handelsvergunning is verleend, is verboden.' Art. 84(3)-(4): advertising that does not promote rational use, or that is misleading, is forbidden. Art. 85: public advertising is forbidden for medicines that may only be supplied on prescription (a), and for non-prescription medicines containing Opium Act list I or II substances (b)."

nl-gnw-art-100-supervision:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 100 (toezicht: IGJ en NVWA)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk11_Artikel100
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Lid 1: officials of the Inspectie gezondheidszorg en jeugd and of the Nederlandse Voedsel- en Warenautoriteit supervise compliance with the Act (apart from chapter 2 and tasks given only to the CBG)."

nl-gnw-art-101-fines:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 101 (bestuurlijke boete)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk11_Artikel101
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Lid 1: the Minister can impose an administrative fine of at most the amount of the sixth category of art. 23(4) of the Criminal Code for breaches of, among others, arts. 18(1), 40(1), (2), (4) and (7), 61, 67, 67a, 68, 84 and 85. Lid 2-4: conduct that is not an economic offence becomes a criminal offence after two fines for the same conduct within 24 months."

nl-gnw-art-115-seizure:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Geneesmiddelenwet, artikel 115 (inbeslagname en bevelen)"
  container: "wetten.overheid.nl (BWBR0021505), version in force from 9 September 2025"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0021505/2025-09-09/#Hoofdstuk11_Artikel115
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Lid 1: to prevent harm to public health, IGJ and NVWA officials may at any time seize medicines, active substances and substances clearly meant for making medicines, and order a stop to their preparation, supply, trade, import, export or handing over, or their withdrawal from the market."

nl-wed-art-1-2-6:
  type: law
  authors: "Staten-Generaal / Koninkrijk der Nederlanden"
  title: "Wet op de economische delicten, artikelen 1, 2 en 6"
  container: "wetten.overheid.nl (BWBR0002063), version in force from 22 September 2026"
  year: 1950
  url: https://wetten.overheid.nl/BWBR0002063/2026-09-22/#TiteldeelI_Artikel1
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Art. 1 under 1°: breaches of Geneesmiddelenwet arts. 18(1), 28(1), 34, 37(3), 38(1), 39(1), 40(1) and (2), 61(1), 62(1) and (3), 67 and 67a(1) are economic offences. Art. 2(1): they are crimes (misdrijven) when committed intentionally, otherwise minor offences (overtredingen). Art. 6(1): a crime of this kind is punishable by up to six years in prison, community service or a fine of the fifth category; a minor offence by up to one year's detention, community service or a fine of the fourth category. Art. 6(1), last sentence (re-read by the fact-checker 22 October 2026): if the goods involved are worth more than a quarter of the maximum fine, a fine of the next higher category can be imposed."

rijksoverheid-fine-categories-2026:
  type: regulator
  authors: "Rijksoverheid (Dutch central government)"
  title: "Hoe hoog zijn de boetes in Nederland?"
  year: 2026
  url: https://www.rijksoverheid.nl/documenten/vraag-en-antwoord/straffen-en-maatregelen/hoe-hoog-zijn-de-boetes-in-nederland
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Maximum fines since 1 January 2026: 4th category EUR 27,500; 5th category EUR 110,000; 6th category EUR 1,100,000 (before: 25,750; 103,000; 1,030,000). Matches the editorial note on art. 23(4) of the Wetboek van Strafrecht on wetten.overheid.nl (version in force from 1 July 2026)."

nl-regeling-gnw-art-3-17:
  type: law
  authors: "Minister van Volksgezondheid, Welzijn en Sport"
  title: "Regeling Geneesmiddelenwet, artikelen 3.17, 3.17a en 3.18 (ontheffing op artsenverklaring; vrijstelling bij tekort; gebruik in schrijnende gevallen)"
  container: "wetten.overheid.nl (BWBR0022160), version in force from 1 January 2026"
  year: 2007
  url: https://wetten.overheid.nl/BWBR0022160/2026-01-01/#Hoofdstuk3_Paragraaf5_Artikel3.17
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Art. 3.17(1): the IGJ can grant a manufacturer, wholesaler or dispensing pharmacy an exemption under Gnw art. 40(3)(c) for a medicine without marketing authorisation if (a) the doctor considers it necessary that a patient in their practice is treated with it, (b) no adequate medicinal alternative is on the market or otherwise available in the Netherlands, (c) the doctor has asked in writing on the IGJ's model form, (d) that request has been sent to the IGJ, (e) the IGJ has set the quantity and period, and (f) the supplier keeps records of quantity, doctor, number of patients and side effects. Art. 3.17a: a temporary general exemption during shortages, only for medicines authorised in another EU state, the UK or an MRA country. Art. 3.18: a compassionate-use programme needs CBG approval, on request of the party making the medicine available."

# ---------------------------------------------------------------- Netherlands: regulators and official pages

igj-toezicht-online-medicijnen:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Toezicht op online medicijnen"
  year: 2023
  url: https://www.igj.nl/onderwerpen/medicijnen/online-medicijnen/toezicht-op-online-medicijnen
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Published 8 September 2023 (page metadata). The IGJ inspects online sellers of medicines; if a website offers illegal medicines or advertises them it can act, for example with a warning or a fine. When a seller's website targets Dutch consumers, Dutch law including the Geneesmiddelenwet applies. Focus on prescription-only and unregistered medicines, because the risk of harm is greatest. The IGJ supervises the EU logo: a first breach brings a warning, a repeat breach can bring an administrative fine."

igj-2025-online-nepapotheken:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Inspectie maakt zich zorgen over toename van online-nepapotheken"
  year: 2025
  url: https://www.igj.nl/actueel/nieuws/2025/10/30/inspectie-maakt-zich-zorgen-over-toename-van-online-nepapotheken
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "News, 30 October 2025. Reports to the IGJ about webshops selling prescription medicines without a prescription: 114 in 2024, and 187 from January to early October 2025. The IGJ investigated 150 of these sites; almost all sold prescription medicines (ADHD medicines, opiates, painkillers, sleeping pills) without asking for a prescription. Dozens of sites removed, often hosted abroad; one report to the Public Prosecution Service. Not about peptides specifically."

igj-2025-shield-seizures:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Operatie SHIELD: IGJ en Douane nemen 60.000 pillen in beslag"
  year: 2025
  url: https://www.igj.nl/actueel/nieuws/2025/02/28/operatie-shield-igj-en-douane-nemen-60.000-pillen-in-beslag
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "News, 28 February 2025. In October 2024 Customs and the IGJ checked extra on postal parcels from abroad (operation SHIELD V, coordinated by Europol): 329 shipments intercepted, with 60,000 pills, ampoules, tubes and sprays; more than 80 of the 329 parcels held over 100 pills, most held smaller amounts; everything was seized and destroyed. Erection medicines most common; also antibiotics and substances on the doping list."

igj-illegale-handel:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Illegale handel in geneesmiddelen"
  year: 2025
  url: https://www.igj.nl/zorgsectoren/geneesmiddelen/illegale-geneesmiddelen
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Page metadata: published 18 March 2025, modified 11 November 2025 (fact-checker, 22 October 2026). The IGJ acts against illegal supply and trade in medicines, using reports from citizens and businesses, data analysis and finds by Customs or the police. Customs looks at import and export, the NVWA at veterinary medicines, and the Public Prosecution Service tackles illegal trade under criminal law."

igj-qa-zonder-handelsvergunning:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Vragen over afleveren geneesmiddelen zonder handelsvergunning"
  year: 2026
  url: https://www.igj.nl/documenten/vraag-en-antwoord/vragen-over-afleveren-geneesmiddelen-zonder-handelsvergunning
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Page metadata: issued 11 August 2026, modified 20 August 2026 (the date 22-03-2022 on the page belongs to a form, not to the page; corrected by the fact-checker, 22 October 2026). Only a manufacturer, wholesaler, (hospital) pharmacist or dispensing GP established in the Netherlands may apply; applications by intermediaries or consultancies are not accepted. The doctor's declaration must be signed by a BIG-registered doctor, carries a patient code (no name), is valid for 1 year, and lists the treatments tried or considered and why Dutch-authorised medicines cannot be used; non-medical reasons (money, adherence, convenience, another form or strength) are not accepted. Documents needed: the SmPC or leaflet from the country of origin, or, if the medicine has no authorisation there, the Investigator's Brochure (IB) or IMPD; a valid GMP certificate when the medicine comes from outside the EEA, MRA countries and the UK, or comes from there without an authorisation. The route is 'bedoeld voor individuele behandeling in uiterste gevallen'; the IGJ is 'terughoudend' and the route is 'uitdrukkelijk niet bedoeld om de verplichting van de handelsvergunning te omzeilen'. The exemption is usually per patient and valid 1 year; the supplier must record side effects and report them to Lareb."

igj-2026-off-label-standpunt:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Standpunt IGJ over off-label voorschrijven (geactualiseerd februari 2026, aangepast mei 2026)"
  year: 2026
  url: https://www.igj.nl/documenten/2026/02/03/standpunt-igj-off-label-voorschrijven
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Published 3 February 2026, amended 8 May 2026. Starting point: medicines are prescribed on-label; off-label prescribing is allowed only under the conditions of Gnw art. 68, as clarified by Council of State and disciplinary rulings. Four situations: a professional standard or protocol allows it (possible, following the standard); a standard advises against it (not allowed); a standard is in development (doctor and pharmacist must consult; restraint advised; due-care requirements apply); no standard and none in development (off-label prescribing 'in principe niet mogelijk'). Due-care requirements include weighing benefit and side effects on current science, checking the up-to-date medication history, a heavier duty to inform with explicit consent recorded in the file, and extra monitoring for side effects. Fact-checker, 22 October 2026: the linked PDF ('Geactualiseerd standpunt IGJ off-label voorschrijven, mei 2026') was read; it says 'De patiënt dient extra gemonitord te worden op bijwerkingen' (unexpected or worsening side effects reported to Lareb), and that in the no-standard situation an exception is possible only 'in uitzonderlijke individuele situaties': one patient with no medicinal alternative, the need documented in the file, only after consultation with the pharmacist, with the due-care requirements, and never where a standard advises against it."

igj-eigen-bereidingen-apotheek:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "Eigen bereidingen apotheek"
  year: 2025
  url: https://www.igj.nl/zorgsectoren/geneesmiddelen/beschikbaarheid-van-geneesmiddelen/eigen-bereidingen-apotheek
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Page dated 8 July 2025 (metadata). Pharmacies may make a medicine themselves on a small scale for an individual patient (pharmacy or magistral preparation); these must meet legal quality requirements, supervised by the IGJ. Raw materials must meet the European Pharmacopoeia (or, if absent there, the pharmacopoeia of a member state, the US or Japan, if current and officially in use). 'Een grondstof die niet in een in gebruik zijnde farmacopee staat, kan daarom niet zomaar worden gebruikt.' No independent registration authority is involved, so the pharmacist must judge the raw material's drug master file; preparation is not a good choice when there is not enough certainty about origin, raw-material quality, process and final checks."

rijksoverheid-online-aanbieder-controleren:
  type: regulator
  authors: "Rijksoverheid (Ministerie van Volksgezondheid, Welzijn en Sport)"
  title: "Hoe controleer ik of een online aanbieder van medicijnen betrouwbaar is?"
  year: 2025
  url: https://www.rijksoverheid.nl/documenten/vraag-en-antwoord/geneesmiddelen/controleren-betrouwbaarheid-online-aanbieder-van-medicijnen
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Page metadata: published 7 April 2016, modified 30 September 2025. Online sellers of medicines must show the European logo; it is genuine if clicking it leads to the government's list of registered sellers, which also shows which medicines each may sell. Only (online) pharmacies may sell prescription medicines, always against a prescription; sellers that sell prescription medicines without one are not reliable. Prescription medicines may not be advertised."

dopingautoriteit-doping-en-de-wet:
  type: web
  authors: "Dopingautoriteit (Doping Authority Netherlands)"
  title: "Doping en de wet"
  year: 2026
  url: https://www.dopingautoriteit.nl/juridisch/doping-en-de-wet
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "No date on the page (year = year accessed). The Wet uitvoering antidopingbeleid (in force 1 January 2019) is the legal basis for the Dopingautoriteit; the National Doping Regulations (NDR) in the rules of the sports federations govern anti-doping in practice; the government makes no doping rules itself. 'Je kunt in Nederland niet strafrechtelijk vervolgd worden voor een positieve test of het gebruik van doping.' 'De Nederlandse overheid gedoogt het bezit van doping voor eigen gebruik, maar heeft de handel in dopingmiddelen verboden.' Many doping substances are medicines, so the Geneesmiddelenwet applies; trade in doping substances has been punishable under the Wet op de economische delicten since 1999."

ccmo-achtergrond-meedoen:
  type: regulator
  authors: "Centrale Commissie Mensgebonden Onderzoek (CCMO)"
  title: "Achtergrondinformatie over meedoen aan onderzoek"
  year: 2026
  url: https://www.ccmo.nl/onderzoeksdeelnemers/achtergrondinformatie-over-meedoen-aan-onderzoek
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Modified July 2026 (metadata). Taking part is always voluntary; participants can be patients or healthy volunteers. Phase descriptions; healthy volunteers usually in phase 1; phase 1 and 2 studies usually bring the patient no improvement. Studies under the WMO are reviewed by a medical ethics committee (METC). Patients usually get only travel costs; they do not pay for the study medicine. To find a study: ask your GP or specialist, patient organisations, or search the register Onderzoekmetmensen.nl; the CCMO does not match participants with researchers. Serious problems can be reported to the IGJ."

ccmo-ivo-meedoen:
  type: regulator
  authors: "Centrale Commissie Mensgebonden Onderzoek (CCMO)"
  title: "Algemene informatie over meedoen aan onderzoek (IVO)"
  year: 2026
  url: https://www.ccmo.nl/onderzoeksdeelnemers/algemene-informatie-over-meedoen-aan-onderzoek-ivo
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "Modified May 2026 (metadata). Plain-language information that forms part of the consent form: research needs approval from a medical ethics committee (METC) first; you take part only if you want to; you get written information (the IVO letter) and time to decide; you sign a consent form; there is often a screening first; 'Stoppen mag altijd. Je hoeft niet te zeggen waarom' (but talk to the researcher, because some medicines must be reduced step by step); researchers must take out insurance for harm caused by the research, with limits (harm must be reported within four years; harm you were told about in advance is usually not covered)."

ctgov-nl-be-peptide-search-2026-10-22:
  type: registry
  authors: "U.S. National Library of Medicine, ClinicalTrials.gov"
  title: "ClinicalTrials.gov API v2 searches: trials of BPC-157 and other peptides on this site with a site in the Netherlands or Belgium"
  year: 2026
  url: https://clinicaltrials.gov/api/v2/studies?query.intr=BPC-157&query.locn=Netherlands&countTotal=true
  accessed: 2026-10-22
  verified: registry
  note: "Run on 22 October 2026, once with query.locn=Netherlands and once with query.locn=Belgium. BPC-157 (and BPC 157): 0 trials in either country. Thymosin beta 4: 0. One query for TB-500, thymosin, tesamorelin, ipamorelin, CJC-1295, Semax, Selank, epitalon, KPV, MOTS-c, melanotan and bremelanotide: 0 in the Netherlands; 1 in Belgium (NCT00608023, a tesamorelin extension study in HIV-associated lipodystrophy, completed in October 2008). Retatrutide: 2 in each country (NCT06383390, active not recruiting; NCT07165028, recruiting). Re-run by the fact-checker on 22 October 2026, one query per name, adding GHK-Cu, AOD-9604, hexarelin, thymalfasin and elamipretide (SS-31): all 0 in both countries except elamipretide, which had 3 trials with a Dutch site (NCT02914665 and NCT02788747, phase 2 in heart failure, completed 2017; NCT05162768, phase 3 in primary mitochondrial disease, completed December 2024) and 1 with a Belgian site (NCT02914665). None of these is running."

# ---------------------------------------------------------------- EU law (texts read via the CELEX number; see header)

eu-regulation-726-2004:
  type: law
  authors: "European Parliament and Council of the European Union"
  title: "Regulation (EC) No 726/2004 laying down Union procedures for the authorisation and supervision of medicinal products for human use and establishing a European Medicines Agency (consolidated text of 28 January 2022)"
  container: "Official Journal of the European Union, L 136"
  year: 2004
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02004R0726-20220128
  accessed: 2026-10-22
  verified: url
  note: "Art. 3(1) and Annex I: medicines made by biotechnology (recombinant DNA and similar), advanced-therapy medicines, medicines with a new active substance for AIDS, cancer, neurodegenerative disorders, diabetes, auto-immune diseases and viral diseases, and orphan medicines may only be placed on the EU market with an authorisation granted by the Union. Art. 3(2): other medicines may use the Union route if they contain a new active substance or are a significant innovation. Art. 83: Member States may make a medicine in those categories available for compassionate use to a group of patients with a chronically or seriously debilitating or life-threatening disease who cannot be treated satisfactorily with an authorised medicine; the medicine must be the subject of an EU marketing application or be undergoing clinical trials. Art. 84: Member States set the penalties."

eu-regulation-536-2014:
  type: law
  authors: "European Parliament and Council of the European Union"
  title: "Regulation (EU) No 536/2014 on clinical trials on medicinal products for human use"
  container: "Official Journal of the European Union, L 158"
  year: 2014
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014R0536
  accessed: 2026-10-22
  verified: url
  note: "Art. 28(1): a trial may run only if, among other things, the expected benefits justify the risks, participants have been informed and have given informed consent, the trial is designed to involve as little pain, discomfort and risk as possible, a qualified doctor is responsible for medical care, and no undue influence, including financial, is used. Art. 28(3): a participant may withdraw at any time, without any resulting detriment and without having to give a reason. Art. 29: consent is written, dated and signed after an interview, with adequate time to decide; the information must be understandable to a layperson."

eu-directive-2011-62:
