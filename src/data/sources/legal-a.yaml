# ---------------------------------------------------------------- CJEU judgments (texts read via the CELEX number; see header)

cjeu-1983-van-bennekom:
  type: law
  authors: "Court of Justice of the European Communities (Fifth Chamber)"
  title: "Judgment of 30 November 1983, Criminal proceedings against Leendert van Bennekom, Case 227/82"
  container: "EUR-Lex (CELEX 61982CJ0227)"
  year: 1983
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:61982CJ0227
  accessed: 2026-10-22
  verified: url
  note: "Reference from the Arrondissementsrechtbank Amsterdam (vitamin preparations). Para. 17: the 'presentation' criterion covers products that are not effective or not as effective as consumers would expect, so 'presentation' must be broadly construed. Para. 18: a product is presented for treating or preventing disease not only when expressly indicated or recommended as such, 'possibly by means of labels, leaflets or oral representation', but whenever an averagely well-informed consumer gains the impression, which may result from implication if it is definite, that it should have such an effect. Para. 19: the external form (tablet, pill, capsule) can be strong evidence of the seller's intention, but not the sole or conclusive evidence. Para. 22: a product with such properties that is not presented as such falls in principle under the second (functional) definition."

cjeu-2009-hecht-pharma:
  type: law
  authors: "Court of Justice of the European Communities (First Chamber)"
  title: "Judgment of 15 January 2009, Hecht-Pharma GmbH v Staatliches Gewerbeaufsichtsamt Lüneburg, Case C-140/07"
  container: "EUR-Lex (CELEX 62007CJ0140)"
  year: 2009
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62007CJ0140
  accessed: 2026-10-22
  verified: url
  note: "Operative part 1 (para. 29): the doubt rule of Directive 2001/83 art. 2(2) does not apply to a product whose status as a medicine by function has not been scientifically established. Operative part 2: the manner of use, extent of distribution, familiarity to consumers and risks of use remain relevant. Operative part 3 (paras. 41, 45): a product is not a medicine by function if, given its composition and content of active substances and if used as intended, it is incapable of appreciably restoring, correcting or modifying physiological functions by a pharmacological, immunological or metabolic action."

cjeu-2014-d-and-g:
  type: law
  authors: "Court of Justice of the European Union (Fourth Chamber)"
  title: "Judgment of 10 July 2014, Criminal proceedings against Markus D. and G., Joined Cases C-358/13 and C-181/14"
  container: "EUR-Lex (CELEX 62013CJ0358)"
  year: 2014
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62013CJ0358
  accessed: 2026-10-22
  verified: url
  note: "Herbal mixtures with synthetic cannabinoids. Para. 42: whether a product is a medicine is decided case by case by national authorities under the courts' supervision, taking account of all its characteristics, in particular its composition, its pharmacological, immunological or metabolic properties as far as these can be established in the present state of scientific knowledge, the manner of use, extent of distribution, familiarity to consumers and the risks of use. Paras. 33-38 and ruling: the functional definition of art. 1(2)(b) covers substances capable of a beneficial effect on human health; it does not cover substances that merely modify physiological functions without any beneficial effect, consumed solely to induce intoxication and harmful as such."

cjeu-2009-damgaard:
  type: law
  authors: "Court of Justice of the European Communities (Second Chamber)"
  title: "Judgment of 2 April 2009, Criminal proceedings against Frede Damgaard, Case C-421/07"
  container: "EUR-Lex (CELEX 62007CJ0421)"
  year: 2009
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62007CJ0421
  accessed: 2026-10-22
  verified: url
  note: "Paras. 10-12: Hyben Total (rosehip powder) had been refused a Danish marketing authorisation in 1999; Mr Damgaard had earlier prepared its information material; in 2003 he wrote on his website that it relieved pain from gout or arthrosis and was on sale in Sweden and Norway, and was prosecuted in Denmark for advertising. He argued that he was not employed by the maker and had no interest in it or its sales, and he received no payment from the maker for the information (corrected by the fact-checker, 22 October 2026: the court did not find that he had 'no link' with the maker; the ruling is framed as 'even though the third party ... is acting on his own initiative and completely independently'). Ruling: dissemination by a third party of information about a medicine, including its therapeutic or prophylactic properties, may be advertising under Directive 2001/83 art. 86 even if the third party acts on his own initiative and completely independently of the maker and seller; the national court decides whether it was designed to promote prescription, supply, sale or consumption. Paras. 20-24: the definition emphasises the purpose of the message; it need not be commercial; the author's relationship with the company is one factor, weighed with the nature of the activity and the content of the message."

cjeu-2012-commission-v-poland:
  type: law
  authors: "Court of Justice of the European Union (Third Chamber)"
  title: "Judgment of 29 March 2012, European Commission v Republic of Poland, Case C-185/10"
  container: "EUR-Lex (CELEX 62010CJ0185)"
  year: 2012
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62010CJ0185
  accessed: 2026-10-22
  verified: url
  note: "On Directive 2001/83 art. 5(1). Para. 31: exceptions are interpreted strictly. Para. 32 (citing C-143/06 Ludwigs-Apotheke): importing non-approved medicines must remain exceptional to preserve the marketing authorisation procedure. Para. 34: 'special needs' covers only individual situations justified by medical considerations. Para. 35: a 'bona fide unsolicited order' means the doctor prescribed after actually examining the patient, on purely therapeutic grounds. Para. 36: only where no authorised equivalent is on the national market or it is unavailable. Para. 38: financial considerations cannot in themselves establish special needs."

cjeu-2015-abcur:
  type: law
  authors: "Court of Justice of the European Union (Third Chamber)"
  title: "Judgment of 16 July 2015, Abcur AB v Apoteket Farmaci AB and Apoteket AB, Joined Cases C-544/13 and C-545/13"
  container: "EUR-Lex (CELEX 62013CJ0544)"
  year: 2015
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62013CJ0544
  accessed: 2026-10-22
  verified: url
  note: "Ruling 1: prescription medicines without marketing authorisation that are prepared industrially fall within Directive 2001/83. They are covered by the magistral-formula exception (art. 3(1)) only if prepared under a medical prescription issued before preparation, specifically for a previously identified patient; by the officinal-formula exception (art. 3(2)) only if delivered directly to the patients supplied by the pharmacy that prepared them."

# ---------------------------------------------------------------- Belgium

be-medicines-law-1964-art-1:
  type: law
  authors: "Belgische Staat / État belge"
  title: "Wet van 25 maart 1964 op de geneesmiddelen voor menselijk gebruik, artikel 1, § 1, 1) (definitie van geneesmiddel)"
  container: "ejustice.just.fgov.be (Justel; text updated to 4 June 2026)"
  year: 1964
  url: https://www.ejustice.just.fgov.be/cgi_loi/change_lg.pl?language=nl&la=N&cn=1964032530&table_name=wet
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "A medicine is any substance presented as having therapeutic or prophylactic properties for human diseases, or any substance that can be used in or given to people to restore, improve or modify physiological functions by a pharmacological, immunological or metabolic effect, or to make a medical diagnosis."

be-medicines-law-1964-art-6quater:
  type: law
  authors: "Belgische Staat / État belge"
  title: "Wet van 25 maart 1964 op de geneesmiddelen voor menselijk gebruik, artikel 6quater (uitzonderingen op de VHB-plicht)"
  container: "ejustice.just.fgov.be (Justel; text updated to 4 June 2026)"
  year: 1964
  url: https://www.ejustice.just.fgov.be/cgi_loi/change_lg.pl?language=nl&la=N&cn=1964032530&table_name=wet
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "§ 1: medicines without a Belgian authorisation may be made available to patients (1°) for special needs, when the patient cannot be adequately treated with medicines authorised and available in Belgium, on a bona fide order at a prescriber's initiative, under conditions set by the King; (2°) for compassionate use, for a group of patients with a chronic, seriously debilitating or life-threatening disease, when an EU marketing application has been filed or trials are ongoing; (3°) in medical need programmes, for an authorised medicine in an indication not yet authorised or not yet marketed; (4°) by import by a person authorised to supply medicines to the public, of a medicine authorised or registered in its country of origin, on a prescription and a prescriber's declaration that the patient cannot be adequately treated with a medicine on the Belgian market. § 3: no authorisation is needed for magistral preparations (made in a pharmacy on a prescription for a particular patient), officinal preparations, and investigational medicines under the law of 7 May 2017 on clinical trials."

be-medicines-law-1964-art-9:
  type: law
  authors: "Belgische Staat / État belge"
  title: "Wet van 25 maart 1964 op de geneesmiddelen voor menselijk gebruik, artikel 9 (reclame)"
  container: "ejustice.just.fgov.be (Justel; text updated to 4 June 2026)"
  year: 1964
  url: https://www.ejustice.just.fgov.be/cgi_loi/change_lg.pl?language=nl&la=N&cn=1964032530&table_name=wet
  accessed: 2026-10-22
  lang: nl
  verified: url
  note: "§ 1: any advertising for a medicine without a marketing authorisation is forbidden; advertising to the public is forbidden for medicines supplied only on prescription. 'Reclame voor geneesmiddelen' covers all forms of canvassing, market research or inducement intended to promote prescription, supply, sale or consumption of medicines; not covered are the leaflet and labelling, answers to a specific question, factual announcements without product claims, and information on health or disease with no reference, even indirect, to a medicine."

be-medicines-law-1964-art-12quater:
  type: law
  authors: "Belgische Staat / État belge"
  title: "Wet van 25 maart 1964 op de geneesmiddelen voor menselijk gebruik, artikel 12quater (geneesmiddelen voor eigen gebruik uit een andere lidstaat)"
  container: "ejustice.just.fgov.be (Justel; text updated to 4 June 2026)"
