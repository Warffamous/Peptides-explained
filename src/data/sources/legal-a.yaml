# ---------------------------------------------------------------- United States (research-use-only labels)

ecfr-21-201-128:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR 201.128 – Meaning of 'intended uses'"
  container: "eCFR"
  year: 2026
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-C/part-201/subpart-D/section-201.128
  accessed: 2026-10-22
  verified: url
  note: "Text as of 1 October 2026 (eCFR versioner API; as amended 86 FR 41401, 2 August 2021): intended uses refer to 'the objective intent of the persons legally responsible for the labeling of an article'; intent may be shown by their expressions, the design or composition of the article, or the circumstances of its distribution, for example labelling claims, advertising, or oral or written statements, and by circumstances in which the article is, with their knowledge, offered or used for a purpose for which it is neither labelled nor advertised."

ecfr-21-809-10:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR 809.10 – Labeling for in vitro diagnostic products"
  container: "eCFR"
  year: 2026
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-H/part-809/subpart-B/section-809.10
  accessed: 2026-10-22
  verified: url
  note: "Text as of 1 October 2026 (eCFR versioner API). (c)(2)(i): for an in vitro diagnostic product 'in the laboratory research phase of development, and not represented as an effective in vitro diagnostic product', all labelling bears the statement 'For Research Use Only. Not for use in diagnostic procedures.' This is where the 'research use only' wording comes from in US rules: lab test products, not medicines."
