famhp-postal-seizure-qa:
  type: regulator
  authors: "Federal Agency for Medicines and Health Products (FAMHP / FAGG / AFMPS)"
  title: "Questions and answers on seizure of postal packages due to illegal importation of medicinal products or importation of non-compliant medical devices"
  year: 2024
  url: https://www.famhp.be/en/human_use/medicines/medicines/proper_use_of_medicines/questions_and_answers_on_seizure_of_postal
  accessed: 2026-10-22
  verified: url
  note: "Page 'Last updated on 23/07/2024'. Read in the Internet Archive snapshot of 8 May 2026 (the live site serves a CAPTCHA to automated requests; the 17 October 2026 snapshot captured only that CAPTCHA). First seizure: a warning only, case closed. A second violation: an out-of-court settlement of at least EUR 400 is proposed; in exceptional cases the file goes to the public prosecutor. Antibiotics: zero tolerance, a fine is possible from the first offence. Under Belgian law a product is a medicine if it contains a pharmacologically active substance or is presented as a medicine; being sold elsewhere as a supplement or cosmetic is 'not a valid argument'. Only medicines licensed in another country may be imported for a patient, always through a Belgian pharmacist with a doctor's prescription and physician's statement; 'you can never import medicinal products yourself'. Shipment of medicines from outside the EEA to Belgium is never permitted; within the EU only if the medicine is authorised in a Member State and lawfully obtained in the legal supply chain."

famhp-adverse-reaction-qa:
