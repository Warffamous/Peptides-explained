nhs-high-blood-sugar:
  type: web
  authors: "NHS"
  title: "High blood sugar (hyperglycaemia)"
  year: 2026
  url: https://www.nhs.uk/conditions/high-blood-sugar-hyperglycaemia/
  accessed: 2026-10-22
  verified: url
  note: "Page last reviewed 17 March 2026. Symptoms usually come on gradually: feeling very thirsty, peeing a lot, feeling weak or tired, blurred vision, losing weight. Urgent help with nausea, vomiting or stomach pain, fast breathing or racing heartbeat, drowsiness, fruity-smelling breath or confusion."

nhs-oedema:
  type: web
  authors: "NHS"
  title: "Oedema (swelling)"
  year: 2026
  url: https://www.nhs.uk/conditions/oedema/
  accessed: 2026-10-22
  verified: url
  note: "Page last reviewed 26 February 2026. Oedema is a build-up of fluid, usually in the ankles, feet or legs. Urgent help for swelling in one leg with no known cause; emergency help for swelling with shortness of breath, chest tightness or pain, coughing up blood or noticeable palpitations."
