  note: "Question 3 (vote on both forms as a group): Yes 12, No 1, so separate votes were taken. 3b ipamorelin (free base): Yes 0, No 12, Abstain 1; 3c ipamorelin acetate: Yes 0, No 12, Abstain 1. Members voting no 'agreed that there was a lack of information supporting safety and efficacy' for GHD and postoperative ileus; one noted that frequent prescribing 'does not necessarily mean the drug is safe and effective'."

