ed words exactly. Unquoted 'zadaxin' returns 3 documents and unquoted 'thymosin' 1, but their quoted forms return none: these are fuzzy matches to other words, and no MHRA document contains 'Zadaxin' or 'thymosin'. Substance index letters A, N and S re-read: no AOD, NADIDE, NICOTINAMIDE RIBOSIDE/MONONUCLEOTIDE, SELANK or SEMAX entry (A runs ANTI-INHIBITOR ... APADAMTASE ALFA; N lists NICOTINAMIDE, 78 files, and NICOTINIC ACID, 2 files; S runs SEMAGLUTIDE, 226 files, then SEMECARPUS)."

