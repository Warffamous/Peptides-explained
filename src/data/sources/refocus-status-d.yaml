# ================================================================ AUSTRALIA: AOD-9604 history (government sources)

au-acc-2013-organised-crime-drugs-sport:
  type: report
  authors: "Australian Crime Commission"
  title: "Organised Crime and Drugs in Sport: New Generation Performance and Image Enhancing Drugs and Organised Criminal Involvement in their use in Professional Sport"
  container: "Australian Crime Commission (copy hosted by Medsafe, New Zealand)"
  year: 2013
  url: https://www.medsafe.govt.nz/consultations/acc-pieds.pdf
  accessed: 2026-10-23
  verified: url
  note: "Published February 2013 ('Commonwealth of Australia 2013'), the public report of Project Aperio. Downloaded and read (pdftotext) on 23 October 2026 from the copy hosted on the New Zealand regulator's site; the Australian Criminal Intelligence Commission site (acic.gov.au) did not respond. On AOD-9604 the report says: it 'was identified in Project Aperio as being used by professional athletes'; 'AOD-9604 is not currently a WADA prohibited substance' and 'AOD9604 is not currently prohibited under category S2 of the WADA Prohibited List'; 'AOD-9604 is not approved for human use'; in the Appendix Two table ('Summary of legal status and status in sport of peptides and hormones', page 40) its row reads sport status 'Not currently prohibited', scheduling status (SUSMP) 'Unscheduled' and, as the table is laid out, border status 'Schedule 7A Customs (Prohibited Imports) Regulations'; BUT the Appendix Three summary (page 41, 'Growth Hormone Variants: AOD-9604') gives 'Scheduling Status (SUSMP): Not yet approved for human use, about to enter the final phase of clinical human trials', 'Border Status: not a border controlled drug' and 'World Anti Doping Agency Status: not currently prohibited'. So the report contradicts itself on the border status; the Appendix Three wording agrees with the current Schedule 7A, which does not name AOD-9604 (au-customs-prohibited-imports-regs). Do not cite this report for AOD-9604's border status. (Factcheck 24 October 2026: the writer's note gave only the Appendix Two reading; corrected after reading both appendices with pdftotext -layout.) It repeats company statements that AOD-9604 was 'about to enter phase three clinical trials' and had effects on cartilage (cited to company stock-exchange announcements, spelt once 'Caldaza'). Cited for what the Australian government said in February 2013, not for the science."

au-fca-2014-1019-essendon-v-asada:
  type: law
  authors: "Federal Court of Australia (Middleton J)"
  title: "Essendon Football Club v Chief Executive Officer of the Australian Sports Anti-Doping Authority [2014] FCA 1019"
  container: "Federal Court of Australia, Digital Law Library"
  year: 2014
  url: https://www.judgments.fedcourt.gov.au/judgments/Judgments/fca/single/2014/2014fca1019
  accessed: 2026-10-23
  verified: url
  note: "Judgment of 19 September 2014 (VID 327 and 328 of 2014), read in a browser on 23 October 2026. [1]: in early February 2013 ASADA's CEO and the AFL agreed a 'joint investigation' into Essendon's 2011-2012 supplements program. [83]: the ACC's Project Aperio report 'Organised Crime and Drugs in Sport' was published in February 2013. [175]-[176]: notes of a meeting between ASADA's CEO and AFL executives (the words 'WADA say ‘AOD9604 is banned’' are in the second note-taker's record quoted at [176]) record 'WADA say AOD9604 is banned' (paragraph 175 dates the meeting '4 June 2014', but it sits in the 2013 chronology between May and late June 2013 events, so the year may be a slip in the judgment; do not quote the date). [191]: on 2 July 2013 ASADA and the AFL agreed the interim report would include 'ASADA's position on whether it intends to prosecute any cases on AOD9604'. [206]: ASADA's covering letter of 2 August 2013 to the AFL said: 'In relation to the issue of AOD-9604, ASADA will make a public statement about its proposed approach in all sports to the enforcement of possible anti-doping rule violations involving this substance that occurred prior to the World Anti-Doping Agency's media release of 22 April 2013.' The same letter says ASADA did not then have enough evidence that specific players had been given thymosin beta-4. The court dismissed Essendon's and Hird's challenge to the investigation. The judgment does not quote the WADA release itself or ASADA's later public statement. Factcheck (24 October 2026): judgment downloaded again (HTTP 200) and every quotation and paragraph number above matched; file numbers VID 327 and 328 of 2014, two orders blocks, each 'The application is dismissed'. WADA's 22 April 2013 release is now registered from WADA's own site (wada-2013-04-aod9604-statement)."

# Added by the independent fact-checker (24 October 2026).
wada-2013-04-aod9604-statement:
  type: regulator
  authors: "World Anti-Doping Agency"
  title: "WADA statement on substance AOD-9604"
  container: "wada-ama.org"
  year: 2013
  url: https://www.wada-ama.org/en/news/wada-statement-substance-aod-9604
  accessed: 2026-10-24
  verified: url
  note: "WADA release dated 22 April 2013, read in the browser pane on 24 October 2026 (WADA's site search does not surface it; the page is at the URL above). 'Following a number of inquiries regarding the substance AOD-9604 available on the Internet ‘black market’ and possibly elsewhere': 'AOD-9604 is a substance still under pre-clinical and clinical development and has not been approved for therapeutic use by any government health authority in the world. Therefore, under the 2013 Prohibited Substances and Methods List, the substance falls into the S.0 category' (S0, non-approved substances, quoted in full: any pharmacological substance not addressed by the other sections and with no current governmental approval for human therapeutic use 'is prohibited at all times'). This is the 'World Anti-Doping Agency's media release of 22 April 2013' named in ASADA's letter of 2 August 2013 (au-fca-2014-1019-essendon-v-asada [206]). Supports: in April 2013 WADA stated that AOD-9604 was prohibited at all times under S0. Today it is named in S2 (data file WADA row)."

