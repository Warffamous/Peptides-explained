ca-hc-recalls-search-status-d-2026-10-23:
  type: dataset
  authors: "Health Canada"
  title: "Recalls and safety alerts database: searches for NAD, nicotinamide, Semax, Selank, MOTS-c, epitalon, thymosin, AOD, SS-31 and elamipretide, 23 October 2026"
  container: "Recalls and safety alerts"
  year: 2026
  url: https://recalls-rappels.canada.ca/en/search/site?search_api_fulltext=NAD
  accessed: 2026-10-23
  verified: url
  note: "Searched on 23 October 2026 (site full-text search; each advisory found was downloaded and its product list read). Records are summarised by number because their titles or texts name a seller, clinic, gym or laboratory. RA-77218 (published 1 April 2025, updated 2 April 2025): unauthorized injectable peptide drugs seized from a wellness clinic in Calgary; the list includes epitalon, 'Mots-C', Selank and 'Thymosin-α1 (TA1)'; 'most injectable peptides are regulated as prescription drugs in Canada'; 'Health Canada has not authorized any of the products seized'. RA-77807 (1 August 2025): 42 named injectable peptide drugs seized from and sold by an online seller, including AOD9604, epitalon, Selank, Semax, SS-31 and 'Thymosin alpha'; 'Injectable peptides are regulated as prescription drugs in Canada.' RA-78029 (4 September 2025): health product recall, Type III, depth 'Health Care Establishments', of products from an Ontario compounding laboratory sold 'without market authorization (DINs) in Canada', including an 'NAD+ IV Drip solution' and an NAD+ 50 mg/mL solution (with glutathione, vitamin and other drips). RA-81403 (24 December 2025): unauthorized health products seized at a Vancouver gym and sold online, including MOTS-C, SS-31, AOD-9604, Epithalon and Thymosin Alpha-1. RA-81874 (9 April 2026; ca-hc-2026-04-think-twice-peptides): 'think twice' advisory whose list of seized unauthorized injectable peptide drugs includes epitalon, MOTS-C, NAD+ and SS-31. 'elamipretide': no result. Other hits were unrelated (laboratory reagents, food recalls, a prenatal vitamin and a supplement company's metal-fibre recall). RA-77218, RA-77807, RA-81403 and RA-81874 were also read by the canada-legal and status-b runs (summarised in ca-hc-recalls-database); RA-78029 was not. Factcheck (24 October 2026): the five advisories downloaded again; RA numbers, original published dates (2025-04-01, 2025-08-01, 2025-09-04, 2025-12-24, 2026-04-09), the product lists and the quoted sentences all held. RA-78029 is a 'Health product recall' published by Health Canada (Type III, depth 'Health Care Establishments'); its two NAD+ items are an 'NAD+ IV Drip solution' (NAD+ 250 mg) and a 'solution' of NAD+ 50 mg/mL (the record does not say it is for injection). RA-81874's list is introduced as 'examples of unauthorized injectable peptide drugs seized by Health Canada'. Recalls-site searches repeated: 'NAD' 4 items (the two above plus two laboratory reagents), 'elamipretide' none, 'SS-31' 12 items (RA-77807, RA-81403, RA-81874, the rest unrelated), 'semax' 1 (RA-77807)."

