# ================================================================ AUSTRALIA: listed medicines (NAD+ precursors)

au-permissible-ingredients-determination-2026-3:
  type: law
  authors: "Commonwealth of Australia (Department of Health, Disability and Ageing)"
  title: "Therapeutic Goods (Permissible Ingredients) Determination (No. 3) 2026 (F2026L01382)"
  container: "Federal Register of Legislation"
  year: 2026
  url: https://www.legislation.gov.au/F2026L01382/latest/text
  accessed: 2026-10-23
  verified: url
  note: "Made 12 October 2026 under s 26BB(1) of the Therapeutic Goods Act 1989; commenced 16 October 2026 and replaced Determination (No. 2) 2026 (TGA news item 'Update to listed medicine ingredients in October 2026', 16 October 2026). It lists the ingredients that medicines listed in the ARTG (AUST L and AUST L(A)) may contain; 'A' means permitted as an active ingredient, 'E' as an excipient. Read from the official HTML text, volumes 1 to 6 (epub document_1 to document_6), on 23 October 2026. Volume 4: item 3493 'NICOTINAMIDE MONONUCLEOTIDE', A: until 10 December 2027 only in a medicine whose sponsor is the named applicant company or a sponsor it has authorised (TGA notified); oral route only; a maximum recommended daily dose and a maximum duration of use of 12 weeks; adults only and not in pregnant or lactating women. Item 3494 'NICOTINAMIDE RIBOSIDE CHLORIDE', A: oral routes only; a maximum daily dose; label warnings 'Not to be taken by children under 12 years old' and, above a set daily dose, 'Not recommended for use during pregnancy or lactation'. Items 3491 NICOTINAMIDE and 3495 NICOTINIC ACID are also permitted. No entry in any volume for nadide, NAD, NAD+ or 'nicotinamide adenine dinucleotide'; the only related entry is item 1930 'DISODIUM NADH', E, 'Only for use in topical medicines for dermal application'. So NR chloride and NMN (oral, with conditions) can be active ingredients of listed medicines; NAD+ itself cannot. The site gives no doses: the dose caps are not to be reproduced."

au-tga-2025-04-nad-nmn-safety-alert:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "NAD, NAD+, NADH or NMN medicines sold in Australia (safety alert)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/safety/safety-monitoring-and-information/safety-alerts/nad-nad-nadh-or-nmn-medicines-sold-australia
  accessed: 2026-10-23
  verified: url
  note: "Published 7 April 2025, last updated 3 February 2026 ('This update reflects the inclusion of NMN in the Therapeutic Goods (Permissible Ingredients) Determination (No. 4) 2025 as of 10 December 2025'); read in a browser on 23 October 2026. For sponsors: 'NAD, NAD+, and NADH are currently not permitted ingredients' of listed medicines, and listed medicines that make claims about them through name, labelling or advertising 'are at risk of breaching the law'; NMN is permitted from 10 December 2025 under the conditions in the Determination. 'If you are advertising or supplying therapeutic goods that refer to NAD, NAD+, NADH, or NMN and these goods are not included in the ARTG nor exempted or otherwise authorised, you are likely breaching the law.' For consumers: listed medicines ('AUST L') 'can only make low-level health claims selected from a pre-approved list and can only use ingredients that the TGA has pre-assessed as safe and of low risk'; NAD, NAD+ and NADH 'are currently not approved for use as ingredients in listed medicines, while NMN can be used in listed medicines when in compliance with specific requirements'; products without an AUST number on the label 'may be unapproved goods or illegally supplied and could pose a risk to your health'."

au-tga-2026-08-nad-nmn-representations-guidance:
  type: guideline
  authors: "Therapeutic Goods Administration"
  title: "Making NAD, NAD+, NADH or NMN representations for listed medicines (guidance for sponsors)"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/guidance/making-nad-nad-nadh-or-nmn-representations-listed-medicines
  accessed: 2026-10-23
  verified: url
  note: "Published 12 August 2026; read in a browser on 23 October 2026. Applies to medicines listed under s 26A of the Act, which 'are not evaluated by the Therapeutic Goods Administration (TGA) prior to entry on the ARTG. Instead, sponsors certify that their listed medicine meets requirements in relation to quality, safety and efficacy.' 'NAD, NAD+, and NADH are currently not permitted ingredients. NMN is a permitted ingredient, having been included in the Ingredients Determination on 10 December 2025.' Precursors such as nicotinamide, nicotinamide ascorbate, nicotinamide riboside chloride and nicotinic acid are also in the Determination. 'Currently, there are no permitted indications that reference NAD, NAD+, NADH, or NMN'; indications such as 'boost NAD+ levels' are not permitted. Unapproved goods referring to NAD/NMN that are not in the ARTG 'may be in breach of the Act'."

au-artg-search-status-d-2026-10-23:
  type: dataset
  authors: "Therapeutic Goods Administration"
  title: "Australian Register of Therapeutic Goods (ARTG) searches, 23 October 2026: AOD-9604, MOTS-c, epitalon, Semax, Selank, thymosin alpha-1, elamipretide and NAD+ precursors"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/resources/artg?keywords=elamipretide
  accessed: 2026-10-23
  verified: url
  note: "Searched in a browser on 23 October 2026 (the ARTG search indexes product names, sponsors and ingredient lists; hyphenated or coded terms are split into fragments). 'No matching results' for: epitalon, epithalon, epithalone, epithalamin, thymalfasin, zadaxin, \"thymosin alpha\", elamipretide, forzinity, bendavia, \"AOD 9604\", 9604, \"metabolic pharmaceuticals\", \"stealth biotherapeutics\", \"12S rRNA\", \"MEHFPGP\", \"tuftsin\". Unrelated fragment matches only (first page checked each time): \"AOD9604\" and \"AOD-9604\" (1,180: first aid kits, walking aids), MOTS-c and \"MOTS-c\" (14: wrist implants, wheelchairs), MOTS (985), semax (33: bone cements), selank and selanc (49: sealing devices; three 'Selancy' herbal supplements), thymosin (1: a tamoxifen tablet, ARTG 43527), MTP-131 (2: technetium kits), \"AEDG\" (126: dental wedges), \"TP-7\" (77), sciclone (1: a nasal irrigation device), calzada (1: an unrelated injection). Control: somatropin, 30 results. NAD+ precursors: \"nicotinamide riboside\" 82 results, \"nicotinamide mononucleotide\" 135, \"NMN\" 736, \"NAD+\" 148, nadide 13, \"nicotinamide adenine dinucleotide\" 1. Factcheck (24 October 2026): every count above repeated with the same result; also \"SS-31\" and SS-31 (210 results, first page only unrelated fragment matches: knee prostheses, defibrillators, supplements; the writer could not run this search). Records opened (ARTG pages and the TGA public-summary PDFs): ARTG 450569 (ARTG date 3 June 2024) and 419551 (23 August 2023), sole ingredient nicotinamide riboside chloride, licence category LI, 'Medicine Listed', approval area 'Listed Medicines', with permitted indications and the label warnings set by the Determination; ARTG 532534 (19 October 2026), nicotinamide mononucleotide with theanine, LI, 'Medicine Listed'; ARTG 531441 (18 September 2026), NMN with NR chloride, LI; ARTG 528217 (26 June 2026), a product named 'NAD+' whose ingredients include nicotinamide riboside chloride but no nadide, LI. All 13 nadide results (ARTG 366430, 371660, 372512, 378148, 409090, 451685, 451945, 459386, 469505, 480825, 495365, 495386, 511845; ARTG dates May 2021 to September 2025) are licence category LIE; the public summary of 469505 reads 'Medicine Listed (Export Only)', approval area 'Export only Medicines', and 'This product must not be supplied for sale in Australia, including supply via duty free outlets.' So oral NR and NMN products are listed medicines that may be sold in Australia; every ARTG entry containing NAD+ itself is for export only. Product and sponsor names are deliberately not recorded here (seller rule). The public search may show only current entries."

au-tga-search-status-d-2026-10-23:
  type: dataset
  authors: "Therapeutic Goods Administration"
  title: "TGA website searches, 23 October 2026: AOD-9604, MOTS-c, epitalon, Semax, Selank, thymosin alpha, elamipretide, NAD+ and NMN"
  container: "tga.gov.au"
  year: 2026
  url: https://www.tga.gov.au/search?keywords=9604
  accessed: 2026-10-23
  verified: url
  note: "Whole-site searches in a browser on 23 October 2026. '9604' and \"AOD 9604\": 1 result, the November 2014 scheduling consultation (au-tga-2014-09-scheduling-consultation); hyphenated AOD-9604 and AOD9604 are split into fragments (2,499 unrelated results). epitalon, thymalfasin, elamipretide, \"hGH 176-191\", \"growth hormone fragment\", \"Metabolic Pharmaceuticals\": no result. MOTS-c (23), semax (54), selank (104), \"SS-31\" (993): only unrelated fragment matches (first page checked). \"thymosin alpha\": 1 result, a TGA media release of 31 July 2020 (its title names a company and a website; seller rule: do not repeat them). The writer could not open it; the fact-checker read it in the browser pane on 24 October 2026 (tga.gov.au/news/media-releases/, slug beginning 'sgc-products-fined-63000'): the TGA 'issued five infringement notices totalling $63,000' to a Victoria-based company for alleged unlawful advertising; the website advertised 'Thymosin Alpha-1 and Thymosin Beta-4 peptides' as a 'breakthrough preventative treatment for coronavirus (COVID-19)' and as effective against 'cancerous cells' (a prohibited representation); the company 'allegedly advertised therapeutic goods (two peptide medicines) not included in the Australian Register of Therapeutic Goods (ARTG)', neither exempt nor excluded; and promoted a prescription-only medicine (the thymosin beta-4 product, Schedule 4). The release does not say thymosin alpha-1 is scheduled. \"nicotinamide mononucleotide\" (150) and \"nicotinamide riboside\" (90): compositional guidelines for both ingredients ('permitted for use in listed medicines'; the NR chloride guideline last updated 28 February 2022), ARTG entries and sponsor cancellations; \"NAD+\" (331): au-tga-2025-04-nad-nmn-safety-alert, au-tga-2026-08-nad-nmn-representations-guidance, cancellations and one listed-medicine compliance report; \"NAD+ infusion\", \"intravenous NAD\", \"NAD+ injection\", \"IV NAD\": no result. No TGA page about AOD-9604 other than the 2014 consultation, and none naming MOTS-c, epitalon, Semax, Selank or elamipretide, was found. The February 2016 scheduling page cited by the FDA for AOD-9604 (scheduling delegate's interim decisions, ACCS/ACMS February 2016, item 2.7 performance and image enhancing drugs) also failed to load (same error) and was not read. Factcheck (24 October 2026): all counts above repeated with the same result (9604 and \"AOD 9604\": 1, the November 2014 consultation; AOD-9604: 2,499 fragments; MOTS-c 23; semax 54; selank 104; no result for epitalon, epithalon, thymalfasin, zadaxin, elamipretide, \"hGH 176-191\", \"growth hormone fragment\", \"Metabolic Pharmaceuticals\", \"NAD+ infusion\", \"intravenous NAD\", \"NAD+ injection\", \"IV NAD\"). Searches for the February 2016 interim decisions ('interim decisions February 2016', '\"performance and image enhancing drugs\" 2016', 'AOD-9604 scheduling') did not surface the page: still UNRESOLVED."

