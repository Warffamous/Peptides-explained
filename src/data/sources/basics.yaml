davenport-2020-peptide-gpcr:
  type: review
  authors: "Davenport AP, Scully CCG, de Graaf C, Brown AJH, Maguire JJ"
  title: "Advances in therapeutic peptides targeting G protein-coupled receptors"
  container: "Nature Reviews Drug Discovery"
