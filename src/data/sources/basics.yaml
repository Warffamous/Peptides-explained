  note: "Indication: weight reduction and maintenance in adults with obesity or overweight with a weight-related condition (not type 2 diabetes in this label; openFDA shows no later approval than the labelling supplement of 4 August 2026). Taken once daily with or without food; geometric mean absolute bioavailability 77% after a single low dose (section 12.3); no clinically relevant food effect; elimination half-life about 29–49 hours; metabolised mainly by the liver enzyme CYP3A4; steady state after about 1 week; not pharmacologically active in rats or mice; boxed warning on thyroid C-cell tumours."

