  accessed: 2026-10-22
  verified: url
  note: "Added by the fact-check (22 October 2026), page fetched and read. Definition: an amino acid is the building block for proteins; 'There are 20 different amino acids'; a protein consists of one or more chains of amino acids (polypeptides) 'whose sequence is encoded in a gene'. Page last updated 22 October 2026."

zhu-2021-oral-delivery:
  type: review
  authors: "Zhu Q, Chen Z, Paul PK, Lu Y, Wu W, Qi J"
  title: "Oral delivery of proteins and peptides: Challenges, status quo and future perspectives"
  container: "Acta Pharmaceutica Sinica B"
  year: 2021
  volume: "11"
  pages: "2416-2448"
  doi: 10.1016/j.apsb.2021.04.001
  pmid: "34522593"
  pmcid: PMC8424290
  verified: pubmed
  note: "Full text read (Europe PMC). Cited for: 2–50 amino acids usually called peptides, longer chains proteins, with 'controversy' (insulin, 51 amino acids, called either; some count peptides up to 9000 Da); pepsin most active at pH 2–3 and inactive above pH 5; pH-induced unfolding in gastric fluid; pancreatic trypsin, chymotrypsin, carboxypeptidase and elastase; brush-border aminopeptidases and dipeptidases cut proteins to di- and tripeptides and amino acids; no insulin detected after 30 min in simulated gastric fluid (in vitro); tight junctions make the intestinal epithelium a gatekeeper to large molecules; poor permeability from large size and high hydrophilicity; a section on 'tremendous inter-individual variability' as a barrier; cyclosporin A is a cyclic peptide of MW 1202. The review gives no cleavage sites for trypsin or chymotrypsin. ERROR IN THE REVIEW, not used: it says Sandimmune (1990) was the first oral cyclosporin formulation approved by the FDA; Drugs@FDA shows the oral solution approved on 14 November 1983 and the capsules on 2 March 1990 (see fda-drugsatfda-sandimmune-oral)."

fda-drugsatfda-sandimmune-oral:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Drugs@FDA: NDA 050574 (Sandimmune cyclosporine oral solution)"
  year: 2026
  url: https://www.accessdata.fda.gov/scripts/cder/daf/index.cfm?event=overview.process&ApplNo=050574
  accessed: 2026-10-22
  verified: url
  note: "Added by the fact-check (22 October 2026), page fetched and read: Sandimmune (cyclosporine) 100 mg/mL solution, oral; original approval 14 November 1983 (ORIG-1). openFDA lists the Sandimmune oral capsules (NDA 050625) as first approved on 2 March 1990."

wang-2022-therapeutic-peptides:
  type: review
  authors: "Wang L, Wang N, Zhang W, Cheng X, Yan Z, Shao G, Wang X, Wang R, Fu C"
  title: "Therapeutic peptides: current applications and future directions"
  container: "Signal Transduction and Targeted Therapy"
  year: 2022
  volume: "7"
  pages: "48"
  doi: 10.1038/s41392-022-00904-4
  pmid: "35165272"
  pmcid: PMC8844085
  verified: pubmed
  note: "Full text read (Europe PMC). Cited for: therapeutic peptides usually 500–5000 Da; insulin described as a peptide of 51 amino acids; amide bonds easily hydrolysed by enzymes, so short half-life without protection; solid-phase peptide synthesis (Merrifield 1963) and its impurities from incomplete or side reactions; synthesis of peptides under 50 residues routine, longer ones challenging; recombinant crude product carries biological contaminants (enzymes, DNA and RNA fragments, unrelated proteins); recombinant DNA used for long peptides with several disulfide bonds (insulin, growth hormone); D-amino acids extend plasma half-life but peptides so modified 'rarely exhibit effective biological activity'; cyclisation increases proteolytic stability and cell permeability and stabilises secondary structure; fatty-acid chains (liraglutide, semaglutide, insulin degludec) and albumin or immunoglobulin fusion (albiglutide, dulaglutide) push molecules above the glomerular filtration cut-off; PEGylation reduces kidney filtration and shields from proteases; GLP-1 receptors in pancreatic beta cells, nervous system, heart and vessels, kidneys, lungs and gut lining; exenatide 'optimized from Gila monster venom'; therapeutic peptides show less immunogenicity than biologics (therapeutic proteins and antibodies)."

ecfr-21-600-3-protein:
