  volume: "19"
  pages: "389-413"
  doi: 10.1038/s41573-020-0062-z
  pmid: "32494050"
  verified: pubmed
  note: "Abstract: many endogenous peptides activate GPCRs; nearly 50 GPCR peptide drugs have been approved; most existing peptide therapeutics are agonists made by modifying the natural peptide sequence; half-life-extending modifications have been revolutionary. Three of five authors at Sosei Heptares."

santiago-2021-core-concepts:
  type: article
  authors: "Santiago M, Davis EA, Hinton T, Angelo TA, Shield A, Babey AM, et al."
  title: "Defining and unpacking the core concepts of pharmacology education"
  container: "Pharmacology Research & Perspectives"
  year: 2021
  volume: "9"
  pages: "e00894"
  doi: 10.1002/prp2.894
  pmid: "34817122"
  pmcid: PMC8611774
  verified: pubmed
  note: "Full text read (Europe PMC). Consensus definitions by pharmacology educators in Australia and New Zealand: absorption, distribution (including plasma-protein binding), metabolism (including hydrolysis), excretion and elimination; clearance; steady state when elimination equals administration; elimination half-life; bioavailability; first-pass metabolism; affinity; efficacy; full and partial agonists; antagonists (zero efficacy); inverse agonists; selectivity is concentration dependent and 'decreases with increasing drug concentration'; potency; tolerance with up- or down-regulation of targets."

berg-2018-inverse-agonism:
  type: review
  authors: "Berg KA, Clarke WP"
  title: "Making Sense of Pharmacology: Inverse Agonism and Functional Selectivity"
  container: "International Journal of Neuropsychopharmacology"
  year: 2018
  volume: "21"
  pages: "962-977"
  doi: 10.1093/ijnp/pyy071
  pmid: "30085126"
  pmcid: PMC6165953
  verified: pubmed
  note: "Full text read (Europe PMC). Affinity is a drug's ability to bind a receptor; intrinsic efficacy is its ability to change receptor activity; agonists have both, antagonists have affinity but zero efficacy; a full agonist gives the maximal response a system can give, a partial agonist a submaximal one; a maximal response may need only part of the receptors to be occupied."

paramonov-2015-camp:
  type: review
  authors: "Paramonov VM, Mamaeva V, Sahlgren C, Rivero-Müller A"
  title: "Genetically-encoded tools for cAMP probing and modulation in living systems"
  container: "Frontiers in Pharmacology"
  year: 2015
  volume: "6"
  pages: "196"
  doi: 10.3389/fphar.2015.00196
  pmid: "26441653"
  pmcid: PMC4569861
  verified: pubmed
  note: "Abstract and full text: cAMP is one of the principal second messengers downstream of GPCRs; amplification of the signal on its way from the membrane to the nucleus is a well-known phenomenon, and PKA amplifies the incoming cAMP signal."

rajagopal-2018-gpcr-desensitisation:
  type: review
  authors: "Rajagopal S, Shenoy SK"
  title: "GPCR desensitization: Acute and prolonged phases"
  container: "Cellular Signalling"
  year: 2018
  volume: "41"
  pages: "9-16"
  doi: 10.1016/j.cellsig.2017.01.024
  pmid: "28137506"
  pmcid: PMC5533627
  verified: pubmed
  note: "Abstract: desensitisation is a decrease in response to repeated or continuous stimulation; short-term over minutes (beta-arrestins block G-protein coupling), longer-term over hours to days (receptor internalisation, lysosomal degradation, less receptor mRNA); overstimulation can cause cellular toxicity or uncontrolled growth. Published online January 2017."

desousa-2025-gh-feedback:
  type: review
  authors: "de Sousa LMM, Vicente VAN, Donato J"
  title: "Negative Feedback Loops and Hormonal Factors that Regulate GH Secretion"
  container: "Endocrinology"
  year: 2025
  volume: "166"
  pages: "bqaf139"
  doi: 10.1210/endocr/bqaf139
  pmid: "40908533"
  verified: pubmed
  note: "Abstract: GH is made in the anterior pituitary and secreted in pulses, mainly controlled by hypothalamic factors; GH release is regulated by multiple negative feedback mechanisms that detect circulating GH or IGF-1, at both pituitary and hypothalamic levels."

veldhuis-2001-gh-pulsatility:
  type: review
  authors: "Veldhuis JD, Anderson SM, Shah N, Bray M, Vick T, Gentili A, et al."
  title: "Neurophysiological regulation and target-tissue impact of the pulsatile mode of growth hormone secretion in the human"
  container: "Growth Hormone & IGF Research"
  year: 2001
  volume: "11 Suppl A"
  pages: "S25-S37"
  doi: 10.1016/s1096-6374(01)80005-8
  pmid: "11527085"
  verified: pubmed
  note: "Abstract: GH pulses are driven by GHRH and GHRP and restrained by somatostatin; a GH burst feeds back on the brain to activate somatostatin and subdue GHRH; IGF-I gives slower negative feedback; GH signals in target tissues through STAT 5b."

renehan-2004-igf1-cancer:
  type: meta-analysis
  authors: "Renehan AG, Zwahlen M, Minder C, O'Dwyer ST, Shalet SM, Egger M"
  title: "Insulin-like growth factor (IGF)-I, IGF binding protein-3, and cancer risk: systematic review and meta-regression analysis"
  container: "The Lancet"
  year: 2004
  volume: "363"
  pages: "1346-1353"
  doi: 10.1016/S0140-6736(04)16044-3
  pmid: "15110491"
  verified: pubmed
  note: "21 case-control studies (26 datasets; 3609 cases, 7137 controls): higher IGF-I associated with more prostate cancer (OR 1.49, 75th vs 25th percentile) and premenopausal breast cancer (OR 1.65); associations modest and varying by site; observational."

