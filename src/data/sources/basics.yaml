# ------------------------------------------------------------------ why not a pill

drucker-2020-oral-peptides:
  type: review
  authors: "Drucker DJ"
  title: "Advances in oral peptide therapeutics"
  container: "Nature Reviews Drug Discovery"
  year: 2020
  volume: "19"
  pages: "277-289"
  doi: 10.1038/s41573-019-0053-0
  pmid: "31848464"
  verified: pubmed
  note: "Abstract: protein and peptide therapeutics require parenteral administration; oral delivery faces substantial barriers from the structure and function of the gastrointestinal tract; strategies include permeation enhancers and enzyme inhibitors; oral formulations of insulin, calcitonin, parathyroid hormone and vasopressin reached trials; oral semaglutide approved for type 2 diabetes."

brayden-2020-oral-peptides:
  type: review
  authors: "Brayden DJ, Hill TA, Fairlie DP, Maher S, Mrsny RJ"
  title: "Systemic delivery of peptides by the oral route: Formulation and medicinal chemistry approaches"
  container: "Advanced Drug Delivery Reviews"
