belchetz-1978-gnrh-pulses:
  type: article
  authors: "Belchetz PE, Plant TM, Nakai Y, Keogh EJ, Knobil E"
  title: "Hypophysial responses to continuous and intermittent delivery of hypopthalamic gonadotropin-releasing hormone"
  container: "Science"
  year: 1978
  volume: "202"
  pages: "631-633"
  doi: 10.1126/science.100883
  pmid: "100883"
  verified: pubmed
  note: "In rhesus monkeys with hypothalamic lesions (number not given in the abstract), a constant infusion of GnRH (a synthetic decapeptide) failed to restore gonadotropin secretion, while hourly pulses, the physiological frequency, restored it; switching from pulses to continuous infusion 'can result in a desensitization or down regulation' of gonadotropin release. The effect depended on the pattern of delivery, not the amount."
