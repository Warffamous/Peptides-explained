# pharmacokinetics, and why peptides are not pills. Every entry was looked up on the date given:
# scholarly metadata copied from the PubMed record (or Europe PMC full text), regulator and label
# pages fetched and read for the point cited. Notes say what each source is cited for.

# ------------------------------------------------------------------ what a peptide is

nhgri-glossary-peptide:
  type: web
  authors: "National Human Genome Research Institute (NIH)"
  title: "Peptide — Talking Glossary of Genomic and Genetic Terms"
  year: 2026
  url: https://www.genome.gov/genetics-glossary/Peptide
  accessed: 2026-10-22
  verified: url
  note: "Definition: a peptide is a short chain of amino acids (typically 2 to 50) linked by peptide bonds; a longer chain (51 or more) is a polypeptide; proteins are made from one or more polypeptides. Page last updated 22 October 2026. The page does NOT mention the number of amino acids or genes; those points are cited to nhgri-glossary-amino-acids (fact-check, 22 October 2026)."

nhgri-glossary-amino-acids:
  type: web
