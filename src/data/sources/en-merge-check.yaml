au-artg-public-summaries-semaglutide-tirzepatide-2026-10-24:
  type: dataset
  authors: "Therapeutic Goods Administration"
  title: "ARTG public summaries for ARTG 308324 (Ozempic), 346198 (Rybelsus), 356286 (Wegovy), 523180 (Plosbrio), 523110 (Poviztra) and 439430 (Mounjaro KwikPen), produced 25 October 2026 (AEDT)"
  container: "Australian Register of Therapeutic Goods"
  year: 2026
  url: https://www.tga.gov.au/resources/artg
  accessed: 2026-10-24
  verified: url
  note: "Each ARTG entry page (www.tga.gov.au/resources/artg/<id>) links a 'Summary' PDF (www.ebs.tga.gov.au, PrintDetailsPublic), downloaded and read with pdftotext on 24 October 2026 (Amsterdam time). 'Specific Indications': PLOSBRIO 523180 (ARTG start 23/04/2026): adults with insufficiently controlled type 2 diabetes as an adjunct to diet and exercise, as monotherapy when metformin is not tolerated or contraindicated or in addition to other medicines for type 2 diabetes; and 'to reduce the risk of sustained decline of kidney function and to reduce the risk of cardiovascular death in adults with type 2 diabetes and chronic kidney disease' (the same text as Ozempic 308324). POVIZTRA 523110 (ARTG start 23/04/2026): chronic weight management in adults with a BMI of 30 or more, or 27 to under 30 with at least one weight-related comorbidity; adolescents aged 12 and above with obesity and body weight above 60 kg; and reduction of the risk of major adverse cardiovascular events in adults with established cardiovascular disease, a BMI of 27 or more and without established type 1 or type 2 diabetes (the same text as Wegovy 356286 apart from Wegovy's provisionally registered MASH indication, approved by letter of 13 March 2026). RYBELSUS 346198: type 2 diabetes (monotherapy or combination). MOUNJARO KwikPen 439430 (record effective 7/10/2026): type 2 diabetes in adults, and 'in adolescents and children aged 10 years and above weighing 50 kg or more with insufficiently controlled type 2 diabetes mellitus'; chronic weight management in adults (BMI 30 or more, or 27 to under 30 with a weight-related comorbid condition); moderate to severe obstructive sleep apnoea in adults with obesity. Neither Plosbrio nor Poviztra links a product information document, and no summary says why the second brands exist."

# Current monographs of the Canadian brand products. The DHPP product pages (read 24 October 2026) link newer
# monographs than the ones the research found through Internet Archive copies of DPD pages while the DPD was down
# (ca-pm-ozempic 00084255, ca-pm-rybelsus 00082994, ca-pm-wegovy 00082777, ca-pm-plosbrio 00082904, ca-pm-mounjaro
# 00084159, ca-pm-zepbound 00080496). Each newer monograph lists '1 Indications' among its recent major label changes.
ca-pm-ozempic-2026-07-13:
  type: label
  authors: "Novo Nordisk Canada Inc. (product monograph filed with Health Canada)"
  title: "Ozempic (semaglutide injection) — Product Monograph including Patient Medication Information (date of authorization 13 July 2026)"
  container: "Health Canada Drug Product Database"
  year: 2026
  url: https://pdf.hres.ca/dpd_pm/00085314.PDF
  accessed: 2026-10-24
  verified: url
  note: "Linked from the DHPP product page for DPD code 96058 (OZEMPIC, DIN 02471469, Marketed since 2018-02-22), read 24 October 2026. Read with pdftotext: 'Produced by recombinant DNA technology in Saccharomyces cerevisiae'; pens of 2, 4 and 8 mg; submission control no. 305296; 'Date of Authorization: 2026-07-13'. Section 1: type 2 diabetes in adults (once weekly; with diet and exercise when metformin is inappropriate, or with metformin, a sulfonylurea, an SGLT2 inhibitor or basal insulin); 'to reduce the risk of major adverse cardiovascular events (cardiovascular death, non-fatal myocardial infarction, or non-fatal stroke) in adults with type 2 diabetes and established cardiovascular disease and/or chronic kidney disease'; and 'to reduce the risk of sustained eGFR decline, end-stage kidney disease, and cardiovascular death in adults with type 2 diabetes and chronic kidney disease'."

