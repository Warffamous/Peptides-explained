# product pages are mirrored on the Drug and Health Product Portal (dhpp.hpfb-dgpsa.ca/dhpp/resource/<DPD drug code>),
# which links each product's monograph on pdf.hres.ca. Every monograph below was downloaded and read (pdftotext) on
# 24 October 2026: title page, holder, 'Date of Authorization' and section 1 (Indications).

