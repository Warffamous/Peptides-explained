# Sources added by the English refocus, group safety-en-a (24 October 2026): safety/if-something-goes-wrong,
# safety/warning-signs, safety/index and safety/sharps-disposal. Every page below was read on 24 October 2026
# (curl or the GOV.UK content API where a site answers scripts; the built-in browser, in our own tab, where a site
# renders its text with scripts or refuses scripts). No phone numbers are recorded. Notes say what each source is
# cited for. Research notes: research/refocus-notes/safety-en-a.md.

au-healthdirect-needlestick:
  type: web
  authors: "Healthdirect Australia"
  title: "Needlestick injuries"
  container: "healthdirect.gov.au"
  year: 2026
  url: https://www.healthdirect.gov.au/accidents-and-injuries/needlestick-injuries
  accessed: 2026-10-24
  verified: url
  note: "Last reviewed March 2026 (read in the built-in browser; the page text is rendered by scripts). 'If you have a needlestick injury, wash the wound with soap and water for at least 30 seconds, then go straight to your doctor or the nearest hospital emergency department.' Steps: wash the area with plenty of water ('If you aren't near a tap, you can use bottled water'); cover the wound with a clean dressing or adhesive plaster; 'Do not squeeze or rub the area around the injury'; get medical advice immediately. The risk of a blood-borne virus (hepatitis B, hepatitis C, HIV) from an accidental needlestick injury is very low; it is higher if the needle was used by someone known to be infected or with a history of injecting drugs. If you use needles at home, there is a higher chance that someone in your home will have a needlestick injury; people who work in waste management or cleaning services have a higher chance too. The doctor may recommend a blood test and can prescribe post-exposure prophylaxis. People who self-inject at home: sharps container or hard-walled plastic container (no glass), out of reach of children, seal at three-quarters full, dispose of the container in a special sharps disposal bin; prevention list: 'never disposing of a needle in a regular rubbish bin'. 'All states and territories offer a needle and syringe program (NSP).' Re-read by the second run of this group on 24 October 2026 (built-in browser): all of the above confirmed, 'Last reviewed: March 2026'. Cited for: needle-stick first aid and where to go; the general risk; who is at risk from a loose needle; no glass containers; that every Australian state and territory has an NSP."

au-healthdirect-cellulitis:
  type: web
  authors: "Healthdirect Australia"
  title: "Cellulitis"
  container: "healthdirect.gov.au"
  year: 2024
  url: https://www.healthdirect.gov.au/conditions/skin-conditions/cellulitis
  accessed: 2026-10-24
  verified: url
  note: "Last reviewed December 2024 (read in the built-in browser; healthdirect.gov.au/cellulitis redirects here). 'If you think you have cellulitis, see a doctor promptly'; under 'When to seek urgent care': 'It's important to get urgent medical help if' the redness is spreading quickly or is very painful, or 'you have a fever'; untreated, bacteria can spread into the bloodstream and lead to sepsis; these complications need urgent hospital treatment. Cited for: a skin infection with fever needs urgent medical help (Australian guidance), the level the warning-signs list gives a fever after an injection."

cdc-hiv-pep:
  type: web
  authors: "U.S. Centers for Disease Control and Prevention"
  title: "Preventing HIV with PEP"
  container: "cdc.gov"
  year: 2024
  url: https://www.cdc.gov/hiv/prevention/pep.html
  accessed: 2026-10-24
  verified: url
  note: "Dated 2 December 2024 (curl gets HTTP 403; read in the built-in browser). 'PEP must be started within 72 hours (3 days) after a recent possible exposure to HIV'; 'the sooner you start PEP, the better. Every hour counts'; taken daily for 28 days; talk right away to 'your health care provider, an emergency room doctor, or an urgent care provider' after a possible exposure, including 'through sharing needles, syringes, or other equipment to inject drugs'. Cited for: PEP timing, length and where to ask for it."

nhs-hiv-and-aids:
  type: web
  authors: "NHS (England)"
  title: "HIV and AIDS"
  container: "nhs.uk"
  year: 2025
  url: https://www.nhs.uk/conditions/hiv-and-aids/
  accessed: 2026-10-24
  verified: url
  note: "Page last reviewed 9 July 2025. Go to a sexual health clinic if you think you have been exposed to HIV in the last 72 hours, for example by sharing needles; staff can offer emergency HIV medicine; it is also available from A&E; 'take medicine called post-exposure prophylaxis (PEP) if you think you've been exposed to HIV in the last 72 hours'. Cited for: in the UK, emergency HIV medicine within 72 hours from sexual health clinics and emergency departments."

mhra-2026-02-semaglutide-naion:
  type: regulator
  authors: "Medicines and Healthcare products Regulatory Agency"
  title: "Semaglutide (Wegovy, Ozempic and Rybelsus): risk of Non-arteritic Anterior Ischemic Optic Neuropathy (NAION)"
  container: "Drug Safety Update (GOV.UK)"
  year: 2026
  url: https://www.gov.uk/drug-safety-update/semaglutide-wegovy-ozempic-and-rybelsus-risk-of-non-arteritic-anterior-ischemic-optic-neuropathy-naion
  accessed: 2026-10-24
  verified: url
  note: "Published 5 February 2026 (read through the GOV.UK content API). Semaglutide 'may be very rarely associated with NAION, a condition which can cause vision loss, typically in one eye'; NAION typically causes sudden, painless vision loss in one eye; patients who notice sudden blindness or eyesight that gets worse very quickly should urgently attend eye casualty or the emergency department; report suspected reactions on a Yellow Card. Cited for: sudden loss of sight as a warning sign with semaglutide (replaces the EMA safety committee's June 2025 conclusion on English pages)."

hhs-hipaa-your-rights:
  type: regulator
  authors: "U.S. Department of Health and Human Services, Office for Civil Rights"
  title: "Your Rights Under HIPAA"
  container: "hhs.gov"
  year: 2025
  url: https://www.hhs.gov/hipaa/for-individuals/guidance-materials-for-consumers/index.html
  accessed: 2026-10-24
  verified: url
  note: "Content last reviewed 30 May 2025 (curl gets HTTP 403; read in the built-in browser). 'The Privacy Rule, a Federal law, gives you rights over your health information and sets rules and limits on who can look at and receive your health information'; covered entities include 'most doctors, clinics, hospitals, psychologists, chiropractors, nursing homes, pharmacies, and dentists'; most law enforcement agencies are not themselves covered. Cited for: in the US, a federal law limits who can see what you tell your doctor."

gmc-confidentiality-duties:
  type: regulator
  authors: "General Medical Council"
  title: "Confidentiality: good practice in handling patient information. Ethical and legal duties of confidentiality (paragraphs 1-7)"
  container: "gmc-uk.org"
  year: 2024
  url: https://www.gmc-uk.org/professional-standards/the-professional-standards/confidentiality/ethical-and-legal-duties-of-confidentiality
  accessed: 2026-10-24
  verified: url
  note: "Guidance in effect from 25 April 2017, updated 25 May 2018 and 13 December 2024 (overview page; curl gets HTTP 403, read in the built-in browser without accepting cookies). Paragraph 1: 'Trust is an essential part of the relationship between patients and medical professionals and confidentiality is central to this. Patients may avoid seeking medical help, or may under-report symptoms, if they think their personal information will be disclosed'. Paragraph 2: 'Medical professionals are under both ethical and legal duties to protect patients' personal information from improper disclosure.' Re-read by the second run of this group on 24 October 2026 (built-in browser): paragraphs 1 and 2 confirmed word for word; paragraph 5: the law 'varies across the four countries of the UK'. The exceptions are on the next page of the guidance (gmc-confidentiality-framework), not on this one. Cited for: UK doctors' ethical and legal duty of confidentiality, and why it matters."

opc-privacy-laws-summary:
  type: regulator
  authors: "Office of the Privacy Commissioner of Canada"
  title: "Summary of privacy laws in Canada"
  container: "priv.gc.ca"
  year: 2018
  url: https://www.priv.gc.ca/en/privacy-topics/privacy-laws-in-canada/02_05_d_15/
  accessed: 2026-10-24
  verified: url
  note: "Date modified 2018-01-31. Ontario, New Brunswick, Newfoundland and Labrador and Nova Scotia have health-related privacy laws declared substantially similar to the federal law for health information; 'other provinces and territories have also passed their own health privacy laws'; 'There are many provincial laws that contain confidentiality provisions concerning personal information collected by professionals.' Cited for: in Canada, provincial and territorial laws protect health information."

oaic-health-information:
