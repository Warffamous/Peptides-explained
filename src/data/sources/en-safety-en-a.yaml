fda-report-a-problem:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "Report a Problem to the FDA"
  container: "fda.gov"
  year: 2026
  url: https://www.fda.gov/safety/report-problem-fda
  accessed: 2026-10-24
  verified: url
  note: "Content current as of 05/11/2026. Lists the online reporting form for health professionals, patients and consumers and Form FDA 3500B for consumers. The FDA's former page on reporting unlawful sales of medical products on the internet now redirects to the FDA's single online 'Report a problem to the FDA' form (contact.fda.gov/report-problem, read in the built-in browser on 24 October 2026; 'web experience updated on 3/14/2026'), whose most common option, 'Personal experience', covers injury or harm from FDA-regulated products and 'Product quality or mislabeling issues'. Cited for: in the US, a product you think is fake or mislabelled is reported to the FDA through its report-a-problem form."

gmc-confidentiality-framework:
  type: regulator
  authors: "General Medical Council"
  title: "Confidentiality: good practice in handling patient information. Disclosing patients' personal information: a framework (paragraphs 9-25)"
  container: "gmc-uk.org"
  year: 2024
  url: https://www.gmc-uk.org/professional-standards/the-professional-standards/confidentiality/disclosing-patients-personal-information-a-framework
  accessed: 2026-10-24
  verified: url
  note: "Same guidance and dates as gmc-confidentiality-duties (read in the built-in browser on 24 October 2026; curl gets HTTP 403). Paragraph 9: 'Confidentiality is an important ethical and legal duty but it is not absolute'; a doctor may disclose personal information when the patient consents, when disclosure benefits a patient who lacks capacity (under the capacity legislation), when it 'is required by law' or permitted or approved under a statutory process, or when it 'can be justified in the public interest'. Paragraph 22: 'Confidential medical care is recognised in law as being in the public interest. The fact that people are encouraged to seek advice and treatment benefits society as a whole as well as the individual'; disclosure 'may be justified to protect individuals or society from risks of serious harm, such as from serious communicable diseases or serious crime'. Cited for: the exceptions to UK doctors' confidentiality (consent, law, public interest such as protecting someone from serious harm) and why confidential care is in the public interest."

uk-wales-wedinos-about:
  type: web
  authors: "WEDINOS (Welsh Emerging Drugs and Identification of Novel Substances Project), Public Health Wales"
  title: "About us"
  container: "wedinos.wales"
  year: 2026
  url: https://wedinos.wales/about-us/
  accessed: 2026-10-24
  verified: url
  note: "HTTP 200 with curl on 24 October 2026 (www.wedinos.org redirects to wedinos.wales). 'WEDINOS provides a robust mechanism for the collection and testing of unknown / unidentified or new psychoactive substances and combinations of substances, and the production and dissemination of pragmatic harm reduction advice. Samples may now be submitted by anyone in Wales.' History: started in 2009; from 2013 'Public Health Wales, with the support of Welsh Government, took the early work forward' and expanded it to a national framework; the team lists Public Health Wales, Cardiff University and Cardiff and Vale University Health Board staff. The home page calls it 'a harm reduction project, providing an anonymous service'. No phone number recorded. Cited for: an official drug-checking service in Wales (for people in Wales), set up for unknown drugs and new psychoactive substances."
