ema-prac-2026-01-minutes:
  type: regulator
  authors: "European Medicines Agency, PRAC"
  title: "Minutes of the PRAC meeting on 12-15 January 2026 (EMA/PRAC/46601/2026)"
  year: 2026
  url: https://www.ema.europa.eu/en/documents/minutes/minutes-prac-meeting-12-15-january-2026_en.pdf
  accessed: 2026-10-27
  verified: url
  note: "PSUSA/00010671/202505 (Ozempic, Rybelsus, Wegovy): 'the benefit-risk balance of Ozempic, Rybelsus and Wegovy ... in the approved indication(s) remains unchanged'; 'The current terms of the marketing authorisation(s) should be maintained'; in the next PSUR the holder 'should continue to closely monitor medication errors and to discuss information from literature related among others to semaglutide-induced Wernicke encephalopathy, liver damage, chronic cough, and ophthalmic issues'; a pooled analysis of all CVOTs requested within 2 months; PSUR frequency changed from yearly to two-yearly."

ema-prac-2026-04-minutes:
  type: regulator
  authors: "European Medicines Agency, PRAC"
  title: "Minutes of the PRAC meeting on 7-10 April 2026 (EMA/PRAC/117688/2026)"
  year: 2026
  url: https://www.ema.europa.eu/en/documents/minutes/minutes-prac-meeting-7-10-april-2026_en.pdf
  accessed: 2026-10-27
  verified: url
  note: "Signal EPITT 20198 (tirzepatide; Mounjaro, Mounjaro KwikPen): drug interaction with warfarin and other coumarins leading to INR decreased. PRAC 'concluded that the current evidence is insufficient to establish a causal relationship between tirzepatide and drug interaction with warfarin and acenocoumarol leading to INR decreased to further warrant an update to the product information (PI) and/or risk management plan (RMP)'; to be monitored in the next PSUR; warfarin and acenocoumarol holders to review all cases with all GLP-1 RAs."

ema-prac-2026-05-minutes:
  type: regulator
  authors: "European Medicines Agency, PRAC"
  title: "Minutes of the PRAC meeting on 4-7 May 2026 (EMA/PRAC/128532/2026)"
  year: 2026
  url: https://www.ema.europa.eu/en/documents/minutes/minutes-prac-meeting-4-7-may-2026_en.pdf
  accessed: 2026-10-27
  verified: url
  note: "New signals: EPITT 20270, peripheral neuropathies (exenatide; semaglutide: Kayshild, Ozempic, Rybelsus, Wegovy, Kyinsu), from 18 literature cases with dulaglutide, tirzepatide and semaglutide; 'PRAC agreed that further evaluation on the signal is warranted'; the holder to review the semaglutide RCTs (SUSTAIN 6, PIONEER 6, SELECT, SOUL, FLOW, STRIDE) and observational studies; 90-day timetable. EPITT 20260, gastrointestinal volvulus (semaglutide products), new signal. The signal recommendations of this meeting (EMA/PRAC/98634/2026, 22 June 2026) asked Novo Nordisk for supplementary information on neuropathies by 22 July 2026 and on volvulus by 29 July 2026. Fact-check (27 October 2026): the volvulus signal was concluded at the PRAC of 28 September-1 October 2026 ('Reassess in the next PSUR', see ema-prac-signals-2026-09-28); no outcome on peripheral neuropathies was found in the June, July or August-September minutes, the September-October and October agendas, or the signal recommendations published up to 26 October 2026."

