# ---------------------------------------------------------------- EMA: products, product information (Dutch)

ema-epar-kyinsu:
  type: label
  authors: "European Medicines Agency"
  title: "Kyinsu (insulin icodec / semaglutide): EPAR — overview and product information"
  year: 2026
  url: https://www.ema.europa.eu/en/medicines/human/EPAR/kyinsu
  accessed: 2026-10-27
  verified: url
  note: "Status 'Authorised'. 'Kyinsu is a medicine used for the treatment of type 2 diabetes. It is used in adults whose diabetes is not sufficiently controlled with basal insulin (a slow-acting type of insulin) or a GLP-1 receptor agonist ... Kyinsu contains the active substances insulin icodec and semaglutide.' EMA product number EMEA/H/C/006279; marketing authorisation holder Novo Nordisk A/S; opinion adopted 18/09/2025; marketing authorisation issued 24/11/2025; under additional monitoring. Product information first published 12/02/2026. The CHMP meeting highlights of 16 October 2026 list Kyinsu among five medicines recommended for an extension of indication ('Kyinsu: pending EC decision')."

ema-pi-ozempic-nl:
  type: label
  authors: "European Medicines Agency"
  title: "Ozempic — Bijlage I: Samenvatting van de productkenmerken (EPAR-productinformatie, Nederlands)"
  year: 2026
  url: https://www.ema.europa.eu/nl/documents/product-information/ozempic-epar-product-information_nl.pdf
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Downloaded and read with pdftotext on 27 October 2026 (English version last updated 25/08/2026 on the EPAR page). 4.1: 'Ozempic is geïndiceerd voor de behandeling van volwassenen met onvoldoende gereguleerde diabetes mellitus type 2 als toevoeging aan dieet en lichaamsbeweging • als monotherapie wanneer metformine ongeschikt wordt geacht als gevolg van intolerantie of contra-indicaties • in aanvulling op andere geneesmiddelen voor de behandeling van diabetes'; 5.1 cross-reference names 'cardiovasculaire ziekte en renale events'. 4.4 has 'Aspiratie in verband met algemene anesthesie of diepe sedatie' and 'Niet-arteritische anterieure ischemische opticusneuropathie (NAION)'. Fact-check (27 October 2026): 4.4 also has 'Patiënten met gastroparese': 'semaglutide wordt niet aanbevolen bij ernstige gastroparese' (worksharing EMA/VR/0000249026 for Ozempic and Rybelsus, outcome 23 October 2025; Ozempic procedural steps and Union Register). Section 9: 'Datum van eerste verlening van de vergunning: 08 februari 2018; Datum van laatste verlenging: 21 september 2022'. 'Aan medisch voorschrift onderworpen geneesmiddel.'"

ema-pi-rybelsus-nl:
  type: label
  authors: "European Medicines Agency"
  title: "Rybelsus — Bijlage I: Samenvatting van de productkenmerken (EPAR-productinformatie, Nederlands)"
  year: 2026
  url: https://www.ema.europa.eu/nl/documents/product-information/rybelsus-epar-product-information_nl.pdf
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 (English version last updated 22/04/2026). 4.1: 'Rybelsus is geïndiceerd voor de behandeling van volwassenen met onvoldoende gereguleerde diabetes mellitus type 2 om glykemische controle te verbeteren als toevoeging aan dieet en lichaamsbeweging • als monotherapie wanneer metformine ongeschikt wordt geacht • in combinatie met andere geneesmiddelen voor de behandeling van diabetes.' 4.4: aspiration and NAION wording as for Ozempic; fact-check (27 October 2026): also the gastroparesis warning ('semaglutide wordt niet aanbevolen bij ernstige gastroparese'). Section 9: first authorisation 03 april 2020, last renewal 22 november 2024."

ema-pi-wegovy-nl:
  type: label
  authors: "European Medicines Agency"
  title: "Wegovy — Bijlage I: Samenvatting van de productkenmerken (EPAR-productinformatie, Nederlands)"
  year: 2026
  url: https://www.ema.europa.eu/nl/documents/product-information/wegovy-epar-product-information_nl.pdf
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 (the EPAR page gives the English product information as last updated 26/10/2026). Section 1 lists single-dose pens 0,25 to 2,4 mg and a 7,2 mg pen, FlexTouch pens 0,25 to 2,4 mg, prefilled syringes ('voorgevulde injectiespuit') 0,25 to 2,4 mg, and a separate SmPC for 'Wegovy 1,5 mg / 4 mg / 9 mg / 25 mg tabletten'. 4.1 (injection): adults with BMI ≥ 30 kg/m2, or 27 to < 30 kg/m2 with at least one weight-related comorbidity; adolescents from 12 years with obesity and body weight above 60 kg; 'Voor onderzoeksresultaten met betrekking tot cardiovasculaire risicoreductie, aan obesitas gerelateerd hartfalen en de onderzochte populatie, zie rubriek 5.1.' 4.1 (tablets): adults only, same BMI criteria. 4.4: aspiration; 'Patiënten met gastroparese die worden behandeld met semaglutide kunnen ernstigere of hevigere ...', 'semaglutide wordt niet aanbevolen bij ernstige gastroparese'; NAION: 'Gegevens uit epidemiologische studies laten een verhoogd risico zien op niet-arteritische anterieure ischemische opticusneuropathie (NAION) tijdens de behandeling met semaglutide ... Bij plotseling verlies van het gezichtsvermogen moet een oftalmologisch onderzoek worden uitgevoerd en moet de behandeling met semaglutide worden gestaakt indien NAION wordt bevestigd'; about a two-fold relative risk, about 1 extra case per 10.000 patiëntjaren (type 2 diabetes). Section 9 (pens and tablets): 'Datum van eerste verlening van de vergunning: 06 januari 2022; Datum van laatste verlenging: 21 september 2026'. Final sweep (re-read 28 October 2026, pdftotext; added because the Dutch pages cite this id for it): 4.2 'Het wordt subcutaan geïnjecteerd in de buik, in de dij of in de bovenarm. De injectieplaats kan worden afgewisseld. Het mag niet intraveneus of intramusculair worden toegediend.' 4.4 'Terugvinden herkomst': 'de naam en het batchnummer van het toegediende product goed geregistreerd worden'. 4.6: stop 'ten minste 2 maanden voor een geplande zwangerschap'. 4.8 'Verhoogde hartslag': 'een gemiddelde stijging van 3 slagen per minuut (bpm) ten opzichte van een uitgangswaarde van 72 bpm'. 5.2: 'Vergelijkbare blootstelling werd bereikt met subcutane toediening van semaglutide in de buik, dij of bovenarm. De absolute biologische beschikbaarheid van semaglutide bedroeg 89%.'; 'in grote mate gebonden aan plasma-albumine (> 99%)'; 'Ongeveer 3% van de geabsorbeerde dosis werd in de urine als intacte semaglutide uitgescheiden'; 'nog ongeveer 7 weken na de laatste dosis van 2,4 mg in de circulatie aanwezig'; tablets: absolute bioavailability after oral use 'ongeveer 1-2%'. 6.4: 'Bewaren in de koelkast (2°C – 8°C). Uit de buurt houden van het koelelement. Niet in de vriezer bewaren.'; single-dose pen and syringe 'in de oorspronkelijke verpakking ter bescherming tegen licht', FlexTouch 'met de pendop erop ter bescherming tegen licht'. 6.6: not to be used 'als de oplossing niet helder en kleurloos of nagenoeg kleurloos is', nor after freezing. Bijsluiter, rubriek 5 (single-dose pen): fridge, not in the freezer, away from the cooling element, protected from light; 'Wegovy kan ongekoeld worden bewaard gedurende maximaal 28 dagen bij een temperatuur beneden 30°C' (FlexTouch in use: 6 weeks below 30 °C or in the fridge). The sunlight sentence is not in rubriek 5 but in the FlexTouch instructions for use ('Uw pen onderhouden'): 'Wegovy dat aan direct zonlicht is blootgesteld mag u niet injecteren.'"

ema-pi-mounjaro-nl:
  type: label
  authors: "European Medicines Agency"
  title: "Mounjaro — Bijlage I: Samenvatting van de productkenmerken (EPAR-productinformatie, Nederlands)"
  year: 2026
  url: https://www.ema.europa.eu/nl/documents/product-information/mounjaro-epar-product-information_nl.pdf
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read 27 October 2026 (English product information last updated 21/09/2026). First line: 'Dit geneesmiddel is onderworpen aan aanvullende monitoring.' Section 1: single-dose prefilled pens 2,5 to 15 mg, single-dose vials ('injectieflacon') 2,5 to 15 mg and 'Mounjaro 2,5 mg/dosis KwikPen' to 15 mg/dosis (multi-dose pens). 4.1: type 2 diabetes in 'volwassenen, adolescenten en kinderen van 10 jaar en ouder'; 'Gewichtsbeheersing' in adults with BMI ≥ 30 kg/m2, or ≥ 27 to < 30 kg/m2 with at least one weight-related comorbid condition; 5.1 has OSA and HFpEF results. 4.4: aspiration; caution in gastroparesis. No NAION section. Section 9: 'Datum van eerste verlening van de vergunning: 15 september 2022'. 'Aan medisch voorschrift onderworpen geneesmiddel.' Final sweep (re-read 28 October 2026, pdftotext; added because the Dutch pages cite this id for it): 4.5 'Orale anticonceptiva': with a single 5 mg dose of tirzepatide the Cmax of ethinylestradiol fell by 59%, of norelgestromin by 55% and of norgestimaat by 66%; 'Deze verminderde blootstelling na een enkele dosis tirzepatide wordt niet als klinisch relevant beschouwd. Er is geen dosisaanpassing van orale anticonceptiva nodig.' 4.6: 'Vrouwen in de vruchtbare leeftijd wordt aangeraden anticonceptie te gebruiken wanneer ze worden behandeld met tirzepatide'; not recommended during pregnancy; stop 'ten minste één maand voor een geplande zwangerschap'; during breastfeeding use 'kan ... worden overwogen'. 4.8 'Hartslag': in pooled placebo-controlled phase 3 type 2 diabetes studies 'een maximaal gemiddelde verhoging van de hartslag van 3 tot 5 slagen per minuut (spm)', against 1 with placebo. 6.6: 'gooi de pen weg wanneer er deeltjes of een verkleuring zichtbaar zijn'; 'Mounjaro mag niet worden gebruikt als het bevroren is geweest'; single-dose pen and vial 'alleen voor eenmalig gebruik'. Section 4.4 of this SmPC has no traceability paragraph: 'Terugvinden herkomst' (name and batch number recorded) is in the Wegovy SmPC (ema-pi-wegovy-nl)."

