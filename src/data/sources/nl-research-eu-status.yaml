# ---------------------------------------------------------------- EU pharmaceutical package (Council documents)

council-st-7105-2026-rev2:
  type: report
  authors: "Council of the European Union"
  title: "Position of the Council at first reading with a view to the adoption of a Regulation laying down Union procedures for the authorisation and supervision of medicinal products for human use and establishing rules governing the European Medicines Agency, amending Regulations (EC) No 1394/2007 and (EU) No 536/2014 and repealing Regulations (EC) No 141/2000, (EC) No 726/2004 and (EC) No 1901/2006 (7105/2/26 REV 2)"
  year: 2026
  url: https://data.consilium.europa.eu/doc/document/ST-7105-2026-REV-2/en/pdf
  accessed: 2026-10-27
  verified: url
  note: "Dated Brussels, 28 September 2026; 'Adopted by the Council on 28 September 2026'. Footnote 2: 'position of the Council at first reading of 28 September 2026 (not yet published in the Official Journal). Position of the European Parliament of ... (not yet published in the Official Journal).' Art. 185: Regulations 141/2000, 726/2004 and 1901/2006 are repealed. Art. 187: 'This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union. It shall apply from ... [24 months from the date of entry into force of this Regulation ...]', with exceptions (Articles 41-45, 116-119, 133-140, 147 and 161(5) from entry into force; Articles 120-132 from six months after entry into force; Article 69 six months after the date of application). Art. 27(2): compassionate use means making such a medicine available 'to a single patient or group of patients with a chronically or seriously debilitating disease, or whose disease is considered to be life-threatening, or is impacting their mental health ...' who cannot be treated satisfactorily by an authorised medicine. Annex I point 3: the central (EU) route is required for medicines 'containing a new active substance which on ... [date of application of this Regulation] was not authorised in the Union', excluding allergen and herbal medicines."

council-st-7106-2026-rev2:
  type: report
  authors: "Council of the European Union"
  title: "Position of the Council at first reading with a view to the adoption of a Directive on the Union code relating to medicinal products for human use, and repealing Directives 2001/83/EC and 2009/35/EC (7106/2/26 REV 2)"
  year: 2026
  url: https://data.consilium.europa.eu/doc/document/ST-7106-2026-REV-2/en/pdf
  accessed: 2026-10-27
  verified: url
  note: "'Adopted by the Council on 28 September 2026'. Art. 220(1): 'Directive 2001/83/EC is repealed with effect from ... [24 months from the date of entry into force of this Directive].' Art. 222(1): Member States bring the national measures into force by, and apply them from, 24 months after entry into force. Art. 223: entry into force on the twentieth day after publication in the Official Journal. Art. 5(1)(1): the two-limb definition of a medicinal product (presented as treating or preventing disease; or able to restore, correct or modify physiological functions by a pharmacological, immunological or metabolic action, or to make a diagnosis), unchanged in substance from Directive 2001/83 art. 1(2). Art. 1(4): where a product is also covered by another Union act and the rules conflict, 'the rules set out in this Directive shall prevail'. Art. 1(5): magistral and officinal formulas are outside the Directive, but 'shall not include medicinal products listed in points 1 and 2 of Annex I to Regulation (EU) 2026/...' (biotechnology products and advanced therapies). Art. 2(2): magistral formulas may be prepared in advance for up to seven days, or three weeks when justified. Art. 4(1): the named-patient ('special needs') exemption, as old art. 5(1), with a duty to encourage safety reporting. Art. 6(1): a medicine may be placed on the market of a Member State only with a national or a centralised marketing authorisation. Art. 175-177: sale at a distance and the common logo (old art. 85c-85d), including (c) 'the medicinal products comply with the national legislation of the Member State of destination'. Art. 179(1): 'Member States shall prohibit any advertising of a medicinal product in respect of which a marketing authorisation has not been granted.' Art. 180(1)(a): ban on advertising prescription medicines to the general public. Art. 83: eight years of regulatory data protection plus one year of market protection, extendable under Art. 84. Annex VIII: correlation table with Directive 2001/83."

