thuisarts-hoge-bloeddruk:
  type: web
  authors: "Thuisarts.nl (Nederlands Huisartsen Genootschap)"
  title: "Mijn bloeddruk is te hoog"
  year: 2026
  url: https://www.thuisarts.nl/hoge-bloeddruk/mijn-bloeddruk-is-te-hoog
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatst gewijzigd: 8 jul 2026' (dateModified 2026-07-08). 'Je hebt een hoge bloeddruk als je bovendruk 140 of hoger is.' 'Ben je ouder dan 70 jaar? Dan heb je een hoge bloeddruk als je bovendruk vaak 150 of hoger is.' 'Je merkt meestal niets van een hoge bloeddruk. Het geeft meestal geen klachten. Alleen bij een heel hoge bloeddruk kun je duizelig zijn, wazig zien, hoofdpijn hebben of overgeven.' 'Je huisarts of de praktijkondersteuner meet je bloeddruk een paar keer achter elkaar.' 'Een hoge bloeddruk maakt je risico op een ziekte van hart en bloedvaten groter.' Cited for: high blood pressure has no symptoms, the Dutch GP threshold, who measures it, and that very high blood pressure can give headache and blurred vision."

thuisarts-bloeddruk-thuis-meten:
  type: web
  authors: "Thuisarts.nl (Nederlands Huisartsen Genootschap)"
  title: "Ik ga zelf thuis mijn bloeddruk meten, hoe gaat dat?"
  year: 2026
  url: https://www.thuisarts.nl/hoge-bloeddruk/ik-ga-zelf-thuis-mijn-bloeddruk-meten
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatst gewijzigd: 7 sep 2026' (dateModified 2026-09-07). Under 'Goede bloeddruk bij thuismeting': 'Je gemiddelde bovendruk is lager dan 135.' (70 years or older: lower than 145). 'Een goede bloeddruk-meter heeft een band om je bovenarm.' The page explains how to measure at home and when to call the GP ('Is je gemiddelde bovendruk 135 of hoger? En ben je jonger dan 70 jaar? Bel dan je huisarts'). Cited for: the home-measurement threshold."
