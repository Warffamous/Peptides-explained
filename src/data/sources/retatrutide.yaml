  year: 2025
  volume: "27"
  pages: "6988-6998"
  doi: 10.1111/dom.70097
  pmid: "40916752"
  pmcid: PMC12587234
  verified: pubmed
  note: "Prespecified exploratory questionnaire analyses in 275 adults from NCT04867785; most authors Eli Lilly employees."

heerspink-2025-retatrutide-kidney:
  type: article
  authors: "Heerspink HJL, Lu Z, Du Y, Duffin KL, Coskun T, Haupt A, et al."
