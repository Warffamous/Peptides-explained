# ------------------------------------------------------------------ phase 2 and secondary analyses (developer)

jastreboff-2023-retatrutide-phase-2:
  type: trial
  authors: "Jastreboff AM, Kaplan LM, Frías JP, Wu Q, Du Y, Gurbuz S, et al."
  title: "Triple-Hormone-Receptor Agonist Retatrutide for Obesity - A Phase 2 Trial"
  container: "New England Journal of Medicine"
  year: 2023
  volume: "389"
  pages: "514-526"
  doi: 10.1056/NEJMoa2301972
  pmid: "37366315"
  verified: pubmed
  note: "NCT04881760. 338 adults, 48 weeks; weight change -24.2% at the highest dose vs -2.1% placebo; gastrointestinal events dose-related, partly mitigated by a lower starting dose; dose-dependent heart-rate increases peaked at 24 weeks and declined thereafter. Funded by Eli Lilly."

ctgov-nct04881760:
  type: registry
  authors: "ClinicalTrials.gov"
  title: "NCT04881760 — A Phase 2 Study of Once-Weekly LY3437943 Compared With Placebo in Participants Who Have Obesity or Are Overweight With Weight-Related Comorbidities (results)"
  year: 2026
  url: https://clinicaltrials.gov/study/NCT04881760
  accessed: 2026-10-20
  verified: registry
  note: "Results first posted 13 September 2023 (adverse-event threshold 5%). Allodynia 4/62 in the highest-dose group, 0 in all other groups including placebo (0/70); hyperaesthesia and sensitive skin in single participants across groups; serious: one acute pancreatitis (highest dose), one acute cholecystitis, one cardiac failure."

rosenstock-2023-retatrutide-t2d-phase-2:
  type: trial
  authors: "Rosenstock J, Frias J, Jastreboff AM, Du Y, Lou J, Gurbuz S, et al."
  title: "Retatrutide, a GIP, GLP-1 and glucagon receptor agonist, for people with type 2 diabetes: a randomised, double-blind, placebo and active-controlled, parallel-group, phase 2 trial conducted in the USA"
  container: "The Lancet"
  year: 2023
  volume: "402"
  pages: "529-544"
  doi: 10.1016/S0140-6736(23)01053-X
  pmid: "37385280"
  verified: pubmed
  note: "NCT04867785. 281 adults at 42 US centres, 36 weeks; placebo and dulaglutide comparators; no severe hypoglycaemia, no deaths. Funded by Eli Lilly."

ctgov-nct04867785:
  type: registry
  authors: "ClinicalTrials.gov"
  title: "NCT04867785 — A Phase 2 Study of Once-Weekly LY3437943 Compared With Placebo and Dulaglutide in Participants With Type 2 Diabetes (results)"
  year: 2026
  url: https://clinicaltrials.gov/study/NCT04867785
  accessed: 2026-10-20
  verified: registry
  note: "Results first posted 3 July 2023. Serious adverse events: one atrial fibrillation (a higher-dose slow-escalation arm, 1/26), two acute pancreatitis (1/47 lowest dose, 1/26), two congestive heart failure, one chronic cholecystitis; none of these in the placebo arm (0/45)."

sanyal-2024-retatrutide-masld:
  type: trial
  authors: "Sanyal AJ, Kaplan LM, Frias JP, Brouwers B, Wu Q, Thomas MK, et al."
  title: "Triple hormone receptor agonist retatrutide for metabolic dysfunction-associated steatotic liver disease: a randomized phase 2a trial"
  container: "Nature Medicine"
  year: 2024
  volume: "30"
  pages: "2037-2048"
  doi: 10.1038/s41591-024-03018-2
  pmid: "38858523"
  pmcid: PMC11271400
  verified: pubmed
  note: "Substudy of NCT04881760, 98 participants with at least 10% liver fat. Checked in PMC full text: in cell studies retatrutide is 0.3 and 0.4 times as active as the native ligands at the human glucagon and GLP-1 receptors and 8.9 times as active at the GIP receptor; half-life about 6 days; beta-hydroxybutyrate rose two- to threefold without ketoacidosis; no hepatotoxicity signal; no multiplicity control; 48-week MRI missing for 56.1%."

coskun-2025-retatrutide-body-composition:
  type: trial
  authors: "Coskun T, Wu Q, Schloot NC, Haupt A, Milicevic Z, Khouli C, et al."
