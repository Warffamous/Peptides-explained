# ------------------------------------------------------------------ identity and structure

pubchem-retatrutide:
  type: dataset
  authors: "National Center for Biotechnology Information"
  title: "PubChem Compound Summary for CID 171390338 (compound title 'Triple G'; deposited substances named retatrutide map here)"
  container: "PubChem"
  year: 2026
  url: https://pubchem.ncbi.nlm.nih.gov/compound/171390338
  accessed: 2026-10-20
  verified: registry
  note: "PUG REST: formula C221H342N46O68, computed molecular weight 4731, exact mass 4730.4784689. The compound name 'retatrutide' does not resolve to a CID, but the substance records deposited under that name (30 SIDs checked) map to this CID. This record leaves two stereocentres undefined."

pubchem-retatrutide-cid-171934787:
  type: dataset
  authors: "National Center for Biotechnology Information"
  title: "PubChem Compound Summary for CID 171934787 (record titled 'Retatrutide (sodium salt)')"
  container: "PubChem"
  year: 2026
  url: https://pubchem.ncbi.nlm.nih.gov/compound/171934787
  accessed: 2026-10-20
  verified: registry
  note: "Used only for the isomeric SMILES. Same connectivity SMILES as CID 171390338 (compared character by character), same neutral formula C221H342N46O68 and weight 4731, with every stereocentre defined. Despite its title, the structure contains no sodium."

gsrs-retatrutide:
  type: dataset
  authors: "U.S. Food and Drug Administration / NCATS"
