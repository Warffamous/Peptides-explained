wen-2025-retatrutide-angptl38:
  type: article
  authors: "Wen Y, Lemen D, Lin Y, Chen YQ, Regmi A, Roell WC, et al."
  title: "Decreases in circulating ANGPTL3/8 concentrations following retatrutide treatment parallel reductions in serum lipids"
  container: "Diabetes, Obesity and Metabolism"
  year: 2025
  volume: "27"
  pages: "5985-5995"
  doi: 10.1111/dom.16661
  pmid: "40726454"
  pmcid: PMC12409240
  verified: pubmed
  note: "All authors Eli Lilly. Post hoc analyses of both phase 2 trials, plus primary human hepatocytes in which glucagon and retatrutide lowered ANGPTL3/8 secretion and a glucagon-receptor antagonist antibody blocked this."

pasqualotto-2024-retatrutide-meta-analysis:
  type: meta-analysis
  authors: "Pasqualotto E, Ferreira ROM, Chavez MP, Hohl A, Ronsoni MF, Pasqualotto T, et al."
  title: "Effects of once-weekly subcutaneous retatrutide on weight and metabolic markers: A systematic review and meta-analysis of randomized controlled trials"
  container: "Metabolism Open"
  year: 2024
  volume: "24"
  pages: "100321"
  doi: 10.1016/j.metop.2024.100321
  pmid: "39318607"
  pmcid: PMC11420505
  verified: pubmed
  note: "Three RCTs, 640 patients. Checked in PMC full text: hypersensitivity RR 3.79 (95% CI 1.20-11.96); cardiac arrhythmias RR 3.41 (0.86-13.55, p = 0.08). The pooled pulse-rate result is printed with exactly the same numbers as the LDL result, so it is not used on our page. No funding statement found."

