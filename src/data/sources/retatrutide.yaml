  volume: "34"
  pages: "1234-1247.e9"
  doi: 10.1016/j.cmet.2022.07.013
  pmid: "35985340"
  verified: pubmed
  note: "Eli Lilly authors. Abstract only (no PMC full text): in vitro balanced GCGR and GLP-1R activity, more GIPR activity; in obese mice GCGR-mediated energy expenditure added to intake reduction; single-ascending-dose phase 1 with weight reduction persisting to day 43 after one dose."

