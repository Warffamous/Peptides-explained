  pmid: "40609566"
  verified: pubmed
  note: "Substudy of NCT04867785: 189 enrolled, 155 with a baseline DXA scan, 103 with scans at baseline and week 36. All authors Eli Lilly employees; funded by Eli Lilly."

kanu-2025-retatrutide-appetite:
