  doi: 10.1111/j.1749-6632.2010.05471.x
  pmid: "20536469"
  verified: pubmed
  note: "Nine compassionate-use patients aged 37–84; six with geographic defects healed; three with punctate defects did not change; stromal thinning in one."

sosne-2015-cae-dry-eye:
  type: trial
  authors: "Sosne G, Ousler GW"
