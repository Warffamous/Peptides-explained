  verified: url
  note: "Evaluation dated 15 May 2026. Defines TB-500 as Ac-Leu-Lys-Lys-Thr-Glu-Thr-Gln-OH (C38H68N10O14, 889.01 g/mol, UNII QHK6Z47GTG, CAS 885340-08-9); 'thymosin beta-4 and TB-500 are not the same substance'; no human data found; no acute, repeat-dose, genotoxicity, reproductive or carcinogenicity studies identified; FAERS search to 26 March 2025 retrieved no reports; WADA 'S2.3'; no approved product in the EU, UK, Belgium, Germany and other listed countries; FDA proposes NOT adding either form."

