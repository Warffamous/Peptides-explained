  type: trial
  authors: "Ruff D, Crockford D, Girardi G, Zhang Y"
  title: "A randomized, placebo-controlled, single and multiple dose study of intravenous thymosin beta4 in healthy volunteers"
  container: "Annals of the New York Academy of Sciences"
  year: 2010
  volume: "1194"
  pages: "223-229"
  doi: 10.1111/j.1749-6632.2010.05474.x
  pmid: "20536472"
  verified: pubmed
  note: "Four cohorts of 10 healthy people; single and then 14 daily intravenous doses of synthetic Tβ4 or placebo; adverse events infrequent, mild or moderate; no dose-limiting toxicity or serious adverse events. First author at a contract research organisation; co-author D. Crockford is the RegeneRx author of crockford-2007-regenerx. Blinding is not stated in the abstract (full text paywalled). Registry NCT00743769 (RegeneRx, same four doses, 'double-blind') is listed as 'Withdrawn: Study never initiated due to contract manufacturing issues', so its link to this paper is unclear."

guarnera-2010-venous-ulcers:
  type: trial
  authors: "Guarnera G, DeRosa A, Camerini R; 8 European sites"
  title: "The effect of thymosin treatment of venous ulcers"
