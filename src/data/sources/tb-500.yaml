  pages: "554"
  doi: 10.3390/ijms24010554
  pmid: "36613994"
  pmcid: PMC9820614
  verified: pubmed
  note: "Complete healing at 4 weeks in 6 of 10 (RGN-259) vs 1 of 8 (placebo), p = 0.0656. Conflict statement: two authors employed by ReGenTree, one by its parent company; study designed by ReGenTree employees; a contract research organisation ran and analysed it."

wang-2021-rhtb4-phase1:
  type: trial
  authors: "Wang X, Liu L, Qi L, Lei C, Li P, et al."
  title: "A first-in-human, randomized, double-blind, single- and multiple-dose, phase I study of recombinant human thymosin β4 in healthy Chinese volunteers"
  container: "Journal of Cellular and Molecular Medicine"
  year: 2021
  volume: "25"
  pages: "8222-8228"
  doi: 10.1111/jcmm.16693
  pmid: "34346165"
  pmcid: PMC8419156
  verified: pubmed
  note: "PMC full text: NL005 is a 44-residue recombinant Tβ4 (Beijing Northland Biotech, three authors employed by the sponsor); 54 single-dose and 30 multiple-dose volunteers; no serious adverse events; adverse-event rates similar to placebo; anti-drug antibodies in 1 of 108 single-dose samples and in 1 of 28 multiple-dose subjects, all negative at follow-up; transient small rises in the tumour marker SCC in both drug and placebo groups."

zhang-2025-stemi:
  type: trial
  authors: "Zhang Y, Dong Q, Bian X, Qiao Z, Cui C, et al."
