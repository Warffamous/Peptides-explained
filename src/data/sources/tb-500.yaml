# ---------------------------------------------------------------- United States (FDA)

fda-pcac-2026-tb500-briefing:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA Briefing Document for TB-500-Related Bulk Drug Substances (TB-500 (free base) and TB-500 acetate), Pharmacy Compounding Advisory Committee meeting, 23–24 July 2026"
  year: 2026
  url: https://www.fda.gov/media/193349/download
  accessed: 2026-10-20
  verified: url
  note: "Evaluation dated 15 May 2026. TB-500 (free base) is 'understood today' to be Ac-Leu-Lys-Lys-Thr-Glu-Thr-Gln-OH (C38H68N10O14, 889.01 g/mol, UNII QHK6Z47GTG, CAS 885340-08-9); 'TB-500 is a common name'; multiple salts and derivatives, including different active moieties, are sold under the same name; 'thymosin beta-4 and TB-500 are not the same substance'. Nomination package inconsistent (free base nominated, acetate CoA, formula matching neither). Representative CoA does not test assay, impurities, endotoxin or aggregates. Non-acetylated LKKTETQ data cannot be extrapolated to TB-500; TB-500 did not close fibroblast scratch wounds in vitro. No acute, repeat-dose, genotoxicity, reproductive or carcinogenicity studies; no human data; FAERS search to 26 March 2025 retrieved no reports; HFCS retrieved two reports on blended TB-500 and BPC-157 without safety assessments. First synthesised 2003 (Philp); a veterinary preparation appeared in 2011 for horse and greyhound sports. Listed under WADA S2.3. Not recognised in European or Japanese pharmacopoeias; no approved product in Canada, Australia, the UK, Belgium, Ireland, France, Norway, Germany, Spain or Italy, nor authorised by EMA. FDA proposes not adding either form to the 503A list."

