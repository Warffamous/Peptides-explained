  volume: "1194"
  pages: "207-212"
  doi: 10.1111/j.1749-6632.2010.05490.x
  pmid: "20536470"
  verified: pubmed
  note: "Double-blind, placebo-controlled, dose-escalation phase 2 at eight sites in Italy and Poland; 73 randomised; safety comparable to placebo; authors suggest the 0.03% dose 'may have the potential' to accelerate healing."

treadwell-2012-dermal-review:
  type: review
  authors: "Treadwell T, Kleinman HK, Crockford D, Hardy MA, Guarnera GT, et al."
  title: "The regenerative peptide thymosin β4 accelerates the rate of dermal healing in preclinical animal models and in patients"
  container: "Annals of the New York Academy of Sciences"
  year: 2012
  volume: "1270"
  pages: "37-44"
  doi: 10.1111/j.1749-6632.2012.06717.x
  pmid: "23050815"
  verified: pubmed
  note: "Review by investigators and developers (Kleinman, Goldstein, Crockford among the authors): Tβ4 'is released by platelets at the site of injury and initiates the repair cascade'; in two phase 2 trials (stasis and pressure ulcers) it was found 'to accelerate healing by almost a month in those patients that did heal'."

dunn-2010-neurotrophic-cases:
