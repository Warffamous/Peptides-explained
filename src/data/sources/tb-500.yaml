# ---------------------------------------------------------------- what TB-500 is: doping laboratories and product analyses

esposito-2012-tb500-identity:
  type: article
  authors: "Esposito S, Deventer K, Goeman J, Van der Eycken J, Van Eenoo P"
  title: "Synthesis and characterization of the N-terminal acetylated 17-23 fragment of thymosin beta 4 identified in TB-500, a product suspected to possess doping potential"
  container: "Drug Testing and Analysis"
  year: 2012
  volume: "4"
  pages: "733-738"
  doi: 10.1002/dta.1402
  pmid: "22962027"
  verified: pubmed
  note: "Ghent University doping control laboratory identified Ac-LKKTETQ in a product called TB-500 and synthesised it as a reference."

ho-2012-equine-tb500:
  type: article
  authors: "Ho EN, Kwok WH, Lau MY, Wong AS, Wan TS, et al."
  title: "Doping control analysis of TB-500, a synthetic version of an active region of thymosin β₄, in equine urine and plasma by liquid chromatography-mass spectrometry"
  container: "Journal of Chromatography A"
  year: 2012
  volume: "1265"
  pages: "57-69"
  doi: 10.1016/j.chroma.2012.09.043
  pmid: "23084823"
  verified: pubmed
  note: "Hong Kong Jockey Club racing laboratory: 'a veterinary preparation known as TB-500'; 'the key ingredient of TB-500 is the peptide LKKTETQ with artificial acetylation of the N-terminus'. Parent and C-terminally shortened metabolites detected in horse plasma and urine after one subcutaneous dose."

kwok-2013-horse-peptides:
  type: article
  authors: "Kwok WH, Ho EN, Lau MY, Leung GN, Wong AS, et al."
  title: "Doping control analysis of seven bioactive peptides in horse plasma by liquid chromatography-mass spectrometry"
  container: "Analytical and Bioanalytical Chemistry"
  year: 2013
  volume: "405"
  pages: "2595-2606"
  doi: 10.1007/s00216-012-6697-9
  pmid: "23318763"
  verified: pubmed
  note: "N-acetylated LKKTETQ described as the 'active ingredient of TB-500'; it and its metabolite N-acetylated LK were detected in plasma of two thoroughbred geldings after a subcutaneous dose."

esposito-2015-in-vitro-metabolism:
  type: article
  authors: "Esposito S, Deventer K, Geldof L, Van Eenoo P"
  title: "In vitro models for metabolic studies of small peptide hormones in sport drug testing"
  container: "Journal of Peptide Science"
  year: 2015
  volume: "21"
  pages: "1-9"
  doi: 10.1002/psc.2710
  pmid: "25469748"
  verified: pubmed
  note: "TB-500 among seven peptides incubated with human liver microsomes, S9 fraction and serum; several metabolites detected for each."

zvereva-2016-peptide-metabolism:
  type: article
  authors: "Zvereva I, Semenistaya E, Krotov G, Rodchenkov G"
  title: "Comparison of various in vitro model systems of the metabolism of synthetic doping peptides: Proteolytic enzymes, human blood serum, liver and kidney microsomes and liver S9 fraction"
  container: "Journal of Proteomics"
  year: 2016
  volume: "149"
  pages: "85-97"
  doi: 10.1016/j.jprot.2016.08.016
  pmid: "27569051"
  verified: pubmed
  note: "TB-500 was metabolised actively by human kidney microsomes and liver S9 fraction; peptides were degraded through cleavage of all bonds."

rahaman-2024-tb500-metabolites:
  type: article
  authors: "Rahaman KA, Muresan AR, Min H, Son J, Han HS, et al."
  title: "Simultaneous quantification of TB-500 and its metabolites in in-vitro experiments and rats by UHPLC-Q-Exactive orbitrap MS/MS and their screening by wound healing activities in-vitro"
  container: "Journal of Chromatography B, Analytical Technologies in the Biomedical and Life Sciences"
  year: 2024
  volume: "1235"
  pages: "124033"
  doi: 10.1016/j.jchromb.2024.124033
  pmid: "38382158"
  verified: pubmed
  note: "Korea Institute of Science and Technology doping control centre. Ac-LK was the main early metabolite in rat urine and Ac-LKK was detectable up to 72 h; no cytotoxicity; in fibroblast scratch assays only the metabolite Ac-LKKTE closed the 'wound' significantly. Authors declare no competing interests; funding not stated in the PubMed record."

delcourt-2023-misbranded:
  type: article
  authors: "Delcourt V, Garcia P, Chabot B, Barnabé A, Bouscarel M, et al."
  title: "TB500/TB1000 and SGF1000: A scientific approach for a better understanding of misbranded and adulterated drugs"
  container: "Drug Testing and Analysis"
  year: 2023
  volume: "15"
  pages: "458-464"
  doi: 10.1002/dta.3421
  pmid: "36482504"
  verified: pubmed
  note: "French horse-racing laboratory (GIE LCH); grant from the Institut français du cheval et de l'équitation in the PubMed record. Abstract: the content of TB500/TB1000 products sold online 'is not systematically consistent' with former descriptions. Only the abstract was read (publisher full text not accessible)."

delcourt-2025-equine-tb4:
  type: article
  authors: "Delcourt V, Garcia P, Chabot B, Aber N, Pescher M, et al."
  title: "Equine Doping Controls of Thymosin β 4: A Population Study and Strategy for Misuse Detection"
  container: "Drug Testing and Analysis"
  year: 2025
  volume: "17"
  pages: "1071-1077"
  doi: 10.1002/dta.3806
  pmid: "39314109"
  verified: pubmed
  note: "Abstract: numerous products online claim 'to contain a synthetic acetylated fragment of TB4 or TB4 itself'; Tβ4 is forbidden by the IFHA, the FEI and WADA; a non-natural synthesis impurity was detectable in horse plasma after one dose of a Tβ4-containing product."

# ---------------------------------------------------------------- preclinical: the TB-500 fragment and its LKKTETQ core

philp-2003-lkktetq-wounds:
  type: article
  authors: "Philp D, Badamchian M, Scheremeta B, Nguyen M, Goldstein AL, et al."
  title: "Thymosin beta 4 and a synthetic peptide containing its actin-binding domain promote dermal wound repair in db/db diabetic mice and in aged mice"
  container: "Wound Repair and Regeneration"
  year: 2003
  volume: "11"
  pages: "19-24"
  doi: 10.1046/j.1524-475x.2003.11105.x
  pmid: "12581423"
  verified: pubmed
  note: "NIDCR (NIH) with George Washington University. The seven-amino-acid peptide LKKTETQ (not acetylated, per the FDA 2026 review) promoted repair in aged mice comparably to Tβ4. Animal numbers not in the abstract."

wyczolkowska-2007-mast-cells:
  type: article
  authors: "Wyczółkowska J, Walczak-Drzewiecka A, Wagner W, Dastych J"
  title: "Thymosin beta4 and thymosin beta4-derived peptides induce mast cell exocytosis"
  container: "Peptides"
  year: 2007
  volume: "28"
  pages: "752-759"
  doi: 10.1016/j.peptides.2007.01.004
  pmid: "17289217"
  verified: pubmed
  note: "Mouse peritoneal and human HMC-1 mast cells: Tβ4 (0.2–2000 nM) released mediators (up to 23%); peptides for Tβ4 16–38 and 17–23 did so at least as strongly as native Tβ4."

shah-2018-stellate-cells:
  type: article
  authors: "Shah R, Reyes-Gordillo K, Rojkind M"
  title: "Thymosin β4 inhibits PDGF-BB induced activation, proliferation, and migration of human hepatic stellate cells via its actin-binding domain"
  container: "Expert Opinion on Biological Therapy"
  year: 2018
  volume: "18"
  pages: "177-184"
  doi: 10.1080/14712598.2018.1478961
  pmid: "30063851"
  pmcid: PMC6748868
  verified: pubmed
  note: "Human hepatic stellate cells in culture: the 17–23 (LKKTETQ) peptide, but not the 1–15 peptide, blocked PDGF-BB-driven activation, Akt phosphorylation, proliferation and migration. NIH (NIAAA) extramural funding in the PubMed record. PMC full text (fact-check, 20 October 2026): the Tβ4 peptides 'were a kind gift courtesy of RegeneRx' (made by Bachem); the authors thank Allan L. Goldstein; published in the supplement of the 5th International Symposium on Thymosins in Health and Disease. Hence coded group: mixed."

yoon-2021-ovarian-cancer:
  type: article
  authors: "Yoon HJ, Oh YL, Ko EJ, Kang A, Eo WK, et al."
  title: "Effects of thymosin β4-derived peptides on migration and invasion of ovarian cancer cells"
  container: "Genes & Genomics"
  year: 2021
  volume: "43"
  pages: "987-993"
  doi: 10.1007/s13258-021-01127-7
  pmid: "34170491"
  verified: pubmed
  note: "SKOV3 ovarian cancer cells: Tβ4 and three Tβ4 fragments (1–15, 12–26, and from 23 on), including fragments without the actin-binding site, increased migration, invasion and proliferation. Senior author Hee-Jae Cha (Kosin University) is the first author of cha-2003-metastasis (Kleinman's NIDCR group) and co-authored Tβ4 papers with Kleinman from Kosin in 2007–2011 (PubMed 17947589, 20013654, 20691219, 20975530). Hence coded group: mixed."

ou-2026-alzheimer-mice:
  type: article
  authors: "Ou H, Chen R, Zhou L, Zhang Y, Zhao S, Yang Z"
  title: "Thymosin β4-derived peptides alleviate neuroinflammation and neurite atrophy in both in vitro models and in vivo 5 × FAD mice: A potential therapy for memory improvement in Alzheimer's disease"
  container: "International Immunopharmacology"
  year: 2026
  volume: "170"
  pages: "116097"
  doi: 10.1016/j.intimp.2025.116097
  pmid: "41443105"
  verified: pubmed
  note: "Cell models and 5×FAD mice: 'TB500' and Ac-SDKP reduced markers of neuroinflammation and improved maze and object-recognition tests; hippocampal amyloid burden unchanged. Animal numbers and the exact peptide structure are not given in the abstract."

# ---------------------------------------------------------------- preclinical: full-length thymosin beta-4

malinda-1999-wound-healing:
  type: article
  authors: "Malinda KM, Sidhu GS, Mani H, Banaudha K, Maheshwari RK, et al."
