# Sources for the KPV compound page.
# Every scholarly entry was looked up in PubMed on 20 October 2026 (PubMed MCP tool and
# NCBI E-utilities) and authors/title/journal/year/DOI/PMID were copied from the PubMed record.
# Every regulator, law and registry URL was fetched on 20 October 2026 and contains what it is
# cited for (see research/kpv.md, "Verification log"). Shared regulatory sources (the PCAC
# meeting page, intro, questions and day-1 slides, the WADA lists, the EMA and NL/DE/UK records)
# are defined in shared.yaml and bpc-157.yaml and are reused by id, not re-registered here.

# ---------------------------------------------------------------- identity, chemistry, databases

kpv-pubchem:
  type: dataset
  authors: "National Center for Biotechnology Information"
  title: "PubChem Compound Summary for CID 125672, Lys-Pro-Val (alpha-MSH (11-13))"
  container: "PubChem"
  year: 2026
  url: https://pubchem.ncbi.nlm.nih.gov/compound/125672
  accessed: 2026-10-20
  verified: url
  note: "Free base/free acid H-Lys-Pro-Val-OH. Molecular formula C16H30N4O4, molecular weight 342.43, isomeric SMILES (PUG REST), CAS 67727-97-3; synonyms include Lys-Pro-Val, alpha-MSH(11-13), MSH (11-13), ACTH-(11-13), L-lysyl-L-prolyl-L-valine."

kpv-gsrs-unii:
  type: dataset
  authors: "U.S. Food and Drug Administration, Global Substance Registration System"
  title: "GSRS substance record: L-lysyl-L-prolyl-L-valine, UNII 7V6LGD8S5R"
  container: "FDA Global Substance Registration System"
  year: 2026
  url: https://gsrs.ncats.nih.gov/ginas/app/beta/substances/7V6LGD8S5R
  accessed: 2026-10-20
  verified: url
