  note: "Letter signed by Donald Prater, digitally dated 29 September 2025 (the letterhead date reads 'September 29, 2029', a typo). 'we now conclude that NMN is not excluded from the dietary supplement definition under section 201(ff)(3)(B)' because FDA is aware of evidence that NMN was marketed as a dietary supplement in the US 'as early as 2017', before it was authorised for investigation as a new drug (MIB-626, same chemical structure). Footnote 44: FDA disagrees that NMN 'should be categorically treated as a dietary supplement'; it remains a new dietary ingredient subject to premarket notification. Regulations.gov lists later FDA 'reinstatement' letters for individual NMN NDI notifications (December 2025, February 2026)."

