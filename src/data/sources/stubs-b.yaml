  doi: 10.1016/j.cmet.2022.02.001
  pmid: "35235774"
  verified: pubmed
  note: "30 newly diagnosed, untreated people with Parkinson's disease received NR or placebo for 30 days; NR raised brain NAD levels and was associated with mild clinical improvement (phase 1, small, short)."

brakedal-2026-nopark:
  type: trial
  authors: "Brakedal B, Skeie GO, Derad C, Alstadhaug KB, Anundskås I, Berven H, et al."
  title: "Nicotinamide Riboside for Patients With Early-Stage Parkinson Disease: The NOPARK Randomized Clinical Trial"
  container: "JAMA"
  year: 2026
  doi: 10.1001/jama.2026.18828
  pmid: "42848371"
  pmcid: PMC13650695
  verified: pubmed
  note: "Published online 8 October 2026. Randomised, double-blind, placebo-controlled phase 3 at 11 Norwegian centres: 410 people with early Parkinson disease randomised, 393 in the primary analysis, 52 weeks. MDS-UPDRS total score rose 2.45 points with NR and fell 0.27 with placebo (adjusted difference 2.72, 95% CI 0.47-4.98, P = .02, favouring placebo; the trial's own thresholds for a clinically important worsening and improvement were 5.2 and 6.7 points); non-motor symptoms worsened more with NR (difference 4.22, P = .009); serious adverse events 8.3% (17 of 205) with NR vs 14.1% (29 of 205) with placebo. Funded by the Research Council of Norway and other public bodies; ChromaDex supplied NR and placebo and had no role in design or analysis; two authors hold patents on NR for Parkinson disease licensed to Niagen Bioscience."

