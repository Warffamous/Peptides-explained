  verified: pubmed
  note: "Acute GHRP injections raise ACTH, cortisol and prolactin; after 16 weeks of hexarelin the cortisol response to an injection was lower, recovering 4 weeks after stopping; no change in 24-hour urinary cortisol or prolactin response."

bisi-1999-hexarelin-heart:
