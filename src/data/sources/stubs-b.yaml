# ---------------------------------------------------------------- AOD-9604

fda-pcac-2024-aod9604-briefing:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA Briefing Document: Evaluation of AOD-9604-Related Bulk Drug Substances (AOD-9604 (free base) and AOD-9604 acetate) for Inclusion on the 503A Bulk Drug Substances List, Pharmacy Compounding Advisory Committee, 4 December 2024"
  year: 2024
  url: https://www.fda.gov/media/183584/download
  accessed: 2026-10-23
  verified: url
  note: "Memo dated 5 November 2024, read in full (pdftotext). 'a hexadecapeptide that is a synthetic fragment of human growth hormone (hGH) (15 amino acids: 177-191) with an additional tyrosine at the N-terminal end' (one later sentence says C-terminal, which contradicts its own sequence table; the chemical name given starts L-tyrosyl-L-leucyl...); disulfide bond between Cys 7 and Cys 14; C78H123N23O23S2, 1,815.09 g/mol; UNII 7UP768IP4M, CAS 221231-10-3 (CAS 386264-39-7 also seen); developed and patented by Metabolic Pharmaceuticals in the late 1990s; not a component of an FDA-approved drug; not physically and chemically well characterised (no public impurity, aggregate, microbial or endotoxin tests); no USP/NF, European, Chinese, Indian or Japanese pharmacopoeia monograph and none found in national medicine registries or at EMA; Australia added AOD-9604 to its poisons standard as a performance and image enhancing drug. Effectiveness: Wilding 2004 (23 and 16 people, IV and oral, no significant weight loss vs placebo; 36 men one week); Herd 2005 abstract (300 people, 12 weeks, small differences); OPTIONS (536 enrolled, 502 randomised, BMI 30-45, oral, 24 weeks, dietitian-supervised diet and exercise): no significant difference in the primary endpoint (weight loss at 12 weeks); 21 February 2007 company announcement that results 'do not support the commercial viability of the drug as a treatment for obesity. Development of the drug for this condition is terminated'; 'It does not appear that this study was published'. No human data for injection or skin routes; no human PK. Nonclinical: rodent lipolysis studies; molecular target 'remain[s] unknown'; does not bind GH receptors in Ba/F3 cells; pig PK half-life about 3 minutes IV; rapid breakdown in rat blood in vitro; 26-week rat study dose-dependent osteocalcin changes; 9-month monkey study minimal-slight periportal hepatocyte vacuolation; genotoxicity equivocal. Human safety (Stier 2013, six company trials): IV - headache, fatigue, dizziness; one severe 'feeling of chest tightness' possibly related; euphoria 5 vs 0; oral - headache, diarrhoea, flatulence; in the 12-week 300-person trial serious adverse events included basal cell carcinoma, squamous cell carcinoma, breast cancer and malignant melanoma, judged unrelated by the investigator, FDA: 'information is insufficient'. FAERS search to 7 January 2024 and CAERS search: no reports. Immunogenicity concern for injections. Recommendation: not to list either form."

