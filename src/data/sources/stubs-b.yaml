fda-label-forzinity-2025:
  type: label
  authors: "U.S. Food and Drug Administration; Stealth BioTherapeutics Inc."
  title: "FORZINITY (elamipretide) injection, for subcutaneous use: Prescribing Information (revised 9/2025)"
  year: 2025
  url: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/215244s000lbl.pdf
  accessed: 2026-10-23
  verified: url
  note: "Read in full. Indication: improve muscle strength in adult and paediatric patients with Barth syndrome weighing at least 30 kg; accelerated approval based on knee extensor strength. Contraindication: serious hypersensitivity. Warnings: benzyl alcohol toxicity in neonates (not approved in neonates); hypersensitivity, including serious reactions needing emergency treatment, skin (rash, papules, eczema-like) and respiratory (cough) symptoms, 'within minutes to months'. Trial: 12 males aged 12-35 in a 12-week crossover (TAZPOWER); injection-site reactions 12/12 vs 8/12 on placebo (erythema 100% vs 25%, induration 67% vs 17%, itching 67% vs 17%, pain 75% vs 42%); eosinophil counts rose frequently, peaking around day 90, without symptoms. Section 14: elamipretide 'was not superior to placebo' on the primary endpoints (6-minute walk, fatigue score); knee strength did not rise in the randomised part but rose in the open-label extension (median +63 N at week 168 in 8 patients, from a median baseline of 124 N). Section 11: D-Arg-2,6-dimethyl-Tyr-Lys-Phe-NH2; elamipretide hydrochloride C32H49N9O5·3HCl, 749.2. Section 12: localises to the inner mitochondrial membrane (cardiolipin binder); excreted in urine; exposure higher in kidney impairment; no CYP inhibition. Carcinogenicity studies not done. Storage refrigerated; discard opened vials after 8 days. DailyMed SPL version 10 (12 December 2025) has the same text in the sections checked."

fda-crdac-2024-10-elamipretide-minutes:
