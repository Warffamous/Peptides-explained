stier-2013-aod9604-safety:
  type: article
  authors: "Stier H, Vos E, Kenley D"
  title: "Safety and Tolerability of the Hexadecapeptide AOD9604 in Humans"
  container: "Journal of Endocrinology and Metabolism"
  year: 2013
  volume: "3"
  pages: "7-15"
  doi: 10.4021/jem157w
  verified: doi
  note: "Not indexed in PubMed; metadata from Crossref and the DOI landing page (jofem.org; the DOI resolves there, re-checked 23 October 2026; citation meta: Heike Stier (analyze and realize ag, Berlin), Evert Vos and David Kenley (Metabolic Pharmaceuticals Pty Ltd), vol 3, issue 1-2, pp 7-15, published 23 April 2013). Summary of safety data from six randomised, double-blind, placebo-controlled trials of AOD-9604 (IV and oral); reports no effect on IGF-1 or glucose tolerance and no anti-AOD-9604 antibodies in the patients tested. The FDA notes the authors were employees or consultants of Metabolic Pharmaceuticals, which funded the trials; efficacy results are not reported."

