  volume: "4"
  pages: "185-191"
  doi: 10.1016/s1388-9842(01)00223-9
  pmid: "11959048"
  verified: pubmed
  note: "13 patients with severe heart failure (8 dilated, 5 ischaemic cardiomyopathy), single IV dose: ejection fraction rose in the ischaemic group (peak 26.2% from 22.6%) but not in the dilated group; GH rose similarly in both."

bodart-2002-hexarelin-cd36:
  type: article
  authors: "Bodart V, Febbraio M, Demers A, McNicoll N, Pohankova P, Perreault A, Sejlitz T, Escher E, Silverstein RL, Lamontagne D, Ong H"
  title: "CD36 mediates the cardiovascular action of growth hormone-releasing peptides in the heart"
  container: "Circulation Research"
  year: 2002
  volume: "90"
  pages: "844-849"
  doi: 10.1161/01.res.0000016164.02525.b4
  pmid: "11988484"
  verified: pubmed
  note: "In rat heart membranes a hexarelin-binding protein was identified as CD36; in perfused hearts hexarelin raised coronary perfusion pressure (narrowing of the heart's arteries) dose-dependently, an effect absent in hearts of CD36-null mice and CD36-deficient rats; the authors suggest CD36 may mediate coronary vasospasm. Funding: NIH (NHLBI) grants per the PubMed/Europe PMC grant list."

tivesten-2000-hexarelin-rat-mi:
  type: article
  authors: "Tivesten A, Bollano E, Caidahl K, Kujacic V, Sun XY, Hedner T, Hjalmarson A, Bengtsson BA, Isgaard J"
