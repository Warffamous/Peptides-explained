  year: 1999
  volume: "22"
  pages: "266-272"
  doi: 10.1007/BF03343555
  pmid: "10342360"
  verified: pubmed
  note: "7 male volunteers: an IV dose of hexarelin raised left ventricular ejection fraction (70.7% vs 64.0%) for up to 60 minutes, while recombinant GH giving similar GH levels did not; hexarelin also raised cortisol; blood pressure and heart rate unchanged."

imazio-2002-hexarelin-cardiomyopathy:
  type: article
  authors: "Imazio M, Bobbio M, Broglio F, Benso A, Podio V, Valetto MR, Bisi G, Ghigo E, Trevi GP"
