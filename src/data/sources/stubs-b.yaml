  year: 2000
  volume: "141"
  pages: "60-66"
  doi: 10.1210/endo.141.1.7249
  pmid: "10614623"
  verified: pubmed
  note: "Rats 4 weeks after a tied-off coronary artery, treated for 2 weeks: the higher hexarelin dose increased stroke volume and cardiac output and lowered peripheral resistance, similar to growth hormone; mechanism unclear. Gothenburg group, independent of Turin."

mao-2014-hexarelin-cardiovascular-review:
  type: review
  authors: "Mao Y, Tokudome T, Kishimoto I"
  title: "The cardiovascular action of hexarelin"
  container: "Journal of Geriatric Cardiology"
  year: 2014
  volume: "11"
  pages: "253-258"
  doi: 10.11909/j.issn.1671-5411.2014.03.007
  pmid: "25278975"
  pmcid: PMC4178518
  verified: pubmed
  note: "Narrative review: hexarelin binds and activates the growth hormone secretagogue (ghrelin) receptor like ghrelin; CD36 has been shown to be a cardiac receptor for hexarelin that mediates its cardioprotective effects in animal studies; hexarelin is chemically more stable than ghrelin."

