# ---------------------------------------------------------------- developer studies (ConjuChem and collaborators)

alba-2006-cjc1295-ghrh-knockout:
  type: article
  authors: "Alba M, Fintini D, Sagazio A, Lawrence B, Castaigne JP, Frohman LA, Salvatori R"
  title: "Once-daily administration of CJC-1295, a long-acting growth hormone-releasing hormone (GHRH) analog, normalizes growth in the GHRH knockout mouse"
  container: "American Journal of Physiology. Endocrinology and Metabolism"
  year: 2006
  volume: "291"
  pages: "E1290-E1294"
  doi: 10.1152/ajpendo.00201.2006
  pmid: "16822960"
  verified: pubmed
  note: "Johns Hopkins with two ConjuChem authors (Lawrence B, Castaigne JP) and Frohman LA. One-week-old GHRH-knockout mice treated for 5 weeks every 24, 48 or 72 hours; daily treatment gave normal body weight and length; increased pituitary GH mRNA and somatotroph proliferation. The abstract gives no animal numbers. Funding not stated in the PubMed record."

ionescu-2006-cjc1295-pulsatility:
  type: trial
  authors: "Ionescu M, Frohman LA"
  title: "Pulsatile secretion of growth hormone (GH) persists during continuous stimulation by CJC-1295, a long-acting GH-releasing hormone analog"
  container: "The Journal of Clinical Endocrinology and Metabolism"
  year: 2006
  volume: "91"
  pages: "4792-4797"
  doi: 10.1210/jc.2006-1702
  pmid: "17018654"
  verified: pubmed
  note: "University of Illinois at Chicago. Healthy men aged 20-40; overnight GH sampling every 20 minutes before and one week after a single injection (the FDA briefing gives 12 men, 4 and 8 at two doses). Pulse frequency and size unchanged; trough GH up 7.5-fold (P < 0.0001), mean GH up 46%, IGF-1 up 45%; no difference between the two doses. PubMed publication types: Clinical Trial; Research Support, N.I.H., Extramural; Research Support, Non-U.S. Gov't. The drug came from ConjuChem (stated in Sackmann-Sala 2009, which used samples from these men)."

sackmann-sala-2009-cjc1295-proteome:
  type: article
  authors: "Sackmann-Sala L, Ding J, Frohman LA, Kopchick JJ"
  title: "Activation of the GH/IGF-1 axis by CJC-1295, a long-acting GHRH analog, results in serum protein profile changes in normal adult subjects"
  container: "Growth Hormone & IGF Research"
  year: 2009
  volume: "19"
  pages: "471-477"
  doi: 10.1016/j.ghir.2009.03.001
  pmid: "19386527"
  pmcid: PMC2787983
  verified: pubmed
  note: "Sera from 11 healthy young men before and one week after a single injection of CJC-1295 (ConjuChem Inc., Montreal), sampled as in Ionescu 2006; five serum protein spots changed (two down, three up). Full text (PMC): supported in part by the State of Ohio, WADA, Ohio University and ConjuChem Inc.; one author also NIH-funded. Adverse events not reported."

# ---------------------------------------------------------------- independent laboratory studies

gautam-2009-m3-cjc1295:
  type: article
  authors: "Gautam D, Jeon J, Starost MF, Han SJ, Hamdan FF, Cui Y, Parlow AF, Gavrilova O, Szalayova I, Mezey E, Wess J"
  title: "Neuronal M3 muscarinic acetylcholine receptors are essential for somatotroph proliferation and normal somatic growth"
  container: "Proceedings of the National Academy of Sciences of the United States of America"
  year: 2009
  volume: "106"
  pages: "6398-6403"
  doi: 10.1073/pnas.0900977106
  pmid: "19332789"
  pmcid: PMC2662962
  verified: pubmed
  note: "NIH intramural (NIDDK, NIDCR). Dwarf mice lacking brain M3 receptors given CJC-1295 under the skin daily for 8 weeks from age 1 week (n = 5-8 per group): normal growth, pituitary size, serum GH and IGF-1 restored; CJC-1295 also raised body weight in control mice. Full text: 'CJC-1295 was a gift from ConjuChem (Montreal)'; no ConjuChem authors; authors declare no conflict of interest."

ben-shlomo-2020-cjc1295-pituitary:
  type: article
  authors: "Ben-Shlomo A, Deng N, Ding E, Yamamoto M, Mamelak A, Chesnokova V, Labadzhyan A, Melmed S"
  title: "DNA damage and growth hormone hypersecretion in pituitary somatotroph adenomas"
  container: "The Journal of Clinical Investigation"
  year: 2020
  volume: "130"
  pages: "5738-5755"
  doi: 10.1172/JCI138540
  pmid: "32673291"
  pmcid: PMC7598090
  verified: pubmed
  note: "Cedars-Sinai. Full text (PMC): CJC-1295 'synthesized by ANASpec on the basis of the published molecular structure' (the DAC version, t1/2 8 days cited). In primary mouse pituitary cultures it raised cAMP and GH, and CJC-1295 alone (and more so with rolipram) raised DNA-damage markers (comet assay, gammaH2AX). In vivo: 4-month-old male mice given PBS (n = 15) or CJC-1295 (n = 16) under the skin three times a week for 8 weeks: pituitaries 47% heavier (P <= 0.001; weighed in 9 PBS and 10 CJC-1295 mice), serum IGF-1 higher (P <= 0.05; 15 vs 16), serum GH not different, body weight and length similar, more pituitary DNA damage (comet assay in 3 + 3 mice, scored by a blinded observer; gammaH2AX by Western blot in 5 + 8). Re-read in PMC by the fact-checker on 22 October 2026. 'No side effects were observed.' Results text: 'GH is the dominant facilitator of liver IGF1 production', and IGF-1 'has a longer circulating half-life and a more stable secretory pattern than does GH'. Funding: NIH grant DK113998 and the Doris Factor Molecular Endocrinology Laboratory; no conflicts declared."

