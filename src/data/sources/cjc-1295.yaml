# ---------------------------------------------------------------- growth hormone biology and the risks of excess

mayo-2000-ghrh-receptor:
  type: review
  authors: "Mayo KE, Miller T, DeAlmeida V, Godfrey P, Zheng J, Cunha SR"
  title: "Regulation of the pituitary somatotroph cell by GHRH and its receptor"
  container: "Recent Progress in Hormone Research"
  year: 2000
  volume: "55"
  pages: "237-266"
  pmid: "11036940"
  verified: pubmed
  note: "Abstract: GHRH acts on pituitary somatotroph cells to stimulate their proliferation and their GH production and secretion, through a G protein-coupled receptor expressed mainly in the pituitary; the receptor 'signals predominantly through cAMP-dependent pathways'; transgenic mice overexpressing GHRH show somatotroph hyperplasia. No DOI in PubMed."

mayo-1988-ghrf-transgenic-hyperplasia:
  type: article
  authors: "Mayo KE, Hammer RE, Swanson LW, Brinster RL, Rosenfeld MG, Evans RM"
  title: "Dramatic pituitary hyperplasia in transgenic mice expressing a human growth hormone-releasing factor gene"
  container: "Molecular Endocrinology"
  year: 1988
  volume: "2"
  pages: "606-612"
  doi: 10.1210/mend-2-7-606
  pmid: "3137455"
  verified: pubmed
  note: "Mice making human GRF (GHRH) chronically grew abnormally large through GH hypersecretion and developed 'enormous pituitary glands', largely from selective proliferation (hyperplasia) of the GH-producing somatotrophs."

thorner-1982-ghrf-tumour-acromegaly:
  type: article
  authors: "Thorner MO, Perryman RL, Cronin MJ, Rogol AD, Draznin M, Johanson A, Vale W, Horvath E, Kovacs K"
  title: "Somatotroph hyperplasia. Successful treatment of acromegaly by removal of a pancreatic islet tumor secreting a growth hormone-releasing factor"
  container: "The Journal of Clinical Investigation"
  year: 1982
  volume: "70"
  pages: "965-977"
  doi: 10.1172/jci110708
  pmid: "6290540"
  pmcid: PMC370309
  verified: pubmed
  note: "Case report: a 21-year-old woman with acromegaly had somatotroph hyperplasia, not an adenoma, caused by a pancreatic tumour secreting a GH-releasing factor; after the tumour was removed, serum GH fell from 70 to 3 ng/ml within 2 hours and somatomedin C (IGF-1) became normal by 6 weeks. Human evidence that chronic GHRH excess enlarges the pituitary and causes acromegaly."

moller-2009-gh-metabolism:
  type: review
  authors: "Møller N, Jørgensen JO"
  title: "Effects of growth hormone on glucose, lipid, and protein metabolism in human subjects"
  container: "Endocrine Reviews"
  year: 2009
  volume: "30"
  pages: "152-177"
  doi: 10.1210/er.2008-0027
  pmid: "19240267"
  verified: pubmed
  note: "Abstract (PubMed, 22 October 2026): the most prominent metabolic effect of GH is a marked increase in lipolysis and free fatty acid levels; GH 'antagonizes the hepatic and peripheral effects of insulin on glucose metabolism via mechanisms involving the concomitant increase in FFA flux and uptake'; patients with acromegaly are consistently insulin resistant and become more sensitive after treatment."

