# ---------------------------------------------------------------- regulators: United States

fda-pcac-2024-cjc1295-briefing:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA Briefing Document for CJC-1295-Related Bulk Drug Substances (CJC-1295 (free base), CJC-1295 acetate, CJC-1295 with drug affinity complex (DAC) (free base), CJC-1295 DAC acetate and CJC-1295 DAC trifluoroacetate), Pharmacy Compounding Advisory Committee meeting, 4 December 2024"
  year: 2024
  url: https://www.fda.gov/media/183819/download
  accessed: 2026-10-22
  verified: url
  note: "Evaluation memo dated 15 November 2024, read in full (pdftotext). Two active moieties and five substances, 'at least nine different names'; inconsistent naming 'represents a safety risk for patients as they may be dosed with a different BDS than the physician ordered'. CJC-1295 (free base) = the 29-residue Tyr-D-Ala-...-Arg-NH2 (C152H252N44O42, 3367.95 g/mol); CJC-1295 DAC = the same with an MPA-Lys unit at the C terminus (C165H269N47O46). Both withdrawn nominations were inconsistent; CoAs found gave purity only, no aggregates or endotoxin. Pharmacology studies found only for the DAC version; none, and no PK, toxicity or human data, for the free base. Albumin-bound CJC-1295 DAC 90.3% intact after DPP-IV, GHRH(1-29) none; FDA notes the substitutions (D-Ala2, Gln8, Leu27) may also add stability and that direct evidence that DAC extends the half-life is lacking; DAC 'could also favor the interaction ... with thiol groups in cysteine residues of proteins other than albumin'. Developer toxicology known only from abstracts: injection-site haemorrhage, inflammation and necrosis in rats and dogs; 5-16% lower red-cell values; higher cholesterol; vomiting in dogs; a rat developmental study without malformations; a 6-month monkey immunotoxicity abstract judged vague. Ben-Shlomo 2020 genotoxic signals in mouse pituitary. No carcinogenicity studies; GHRH-transgenic mice develop pituitary hyperplasia and tumours. 'ConjuChem Biotechnology withdrew CJC-1295 DAC from clinical trials in 2006 after the death of a subject involved in a phase 2 trial'; from 'anecdotal reports' (aidsmap, NATAP): 192 enrolled; two hours after an 11th weekly dose one subject had chest discomfort, an ECG confirmed acute myocardial infarction and he died about an hour later; the attending physician's 'most likely explanation' was asymptomatic coronary artery disease with plaque rupture; data never published. Human studies: 63 healthy adults in three studies (87% men; 73% one injection). Teichman study 1: adverse events in 33 of 35 on CJC-1295 vs 2 of 7 on placebo; injection-site reactions about 70%; transient urticarial rashes almost 30%; headache 63% vs 14%; diarrhoea 43% (active only); systemic vasodilatory reactions (flushing, warmth, transient hypotension) 30% (active only); IGF-1 above the age- and sex-adjusted range only at the highest single dose. Study 2: 24 subjects (one placebo per group of six); flushing 40-100%; one subject transient involuntary leg contractions and loss of coordination; two transient dizziness and hypotension; half-life 5.4-9.2 days. Ionescu 2006: 12 men; dose-dependent increase in heart rate; IGF-1 above normal in none. Antibodies: 'no significant antibody formation' per the authors, assay not described; 86% homology with endogenous GHRH raises cross-reactivity concern. FAERS to 10 June 2024: two reports, none assessable. Risks in all rhGH labels: neoplasm, glucose intolerance and diabetes, intracranial hypertension, fluid retention, hypoadrenalism, hypothyroidism, pancreatitis, and in children slipped capital femoral epiphysis and scoliosis. No approved product containing any form in Australia, Belgium, Canada, Denmark, France, Germany, Ireland, Italy, Japan, Norway, Spain or the UK, none authorised by EMA, not in the European or Japanese pharmacopoeias. Marketed online for research use as powders and as blends with ipamorelin, GHRP-2, GHRP-6, hexarelin, tesamorelin and fragment 176-191, mostly without saying which form. No effectiveness data for growth hormone deficiency. Proposal: none of the five on the 503A list."

