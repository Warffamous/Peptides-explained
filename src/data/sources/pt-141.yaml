  accessed: 2026-10-22
  verified: url
  note: "Read through PUG REST on 22 October 2026: molecular formula C50H68N14O10, molecular weight 1025.2; isomeric SMILES with an N-acetyl norleucine start, a ring closed between the aspartic-acid side chain and the lysine side chain, and a free carboxylic acid (C(=O)O) at the end. Synonyms include PT-141, PT 141, CAS 189691-06-3, UNII 6Y24O4F92S, 'Bremelanotide [USAN:INN]', Vyleesi and '…L-lysine-(2->7)-lactam'. Cited for: formula, mass, structure, identifiers."

