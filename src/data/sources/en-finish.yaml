  note: "Read 26 October 2026. FAQ: 'Is USADA responsible for testing American collegiate NCAA athletes or professional sport leagues like the NFL, NHL, MLB, or NBA? Generally not. Most professional sports leagues and the NCAA are not WADA Code signatories, and they conduct their own anti-doping programs in-house. Professional and collegiate athletes who also participate in Olympic sports (e.g. basketball, hockey), however, are subject to USADA testing in the lead up to the Games or World Championship.' Cited for: US college sport and most professional leagues run their own drug-testing programmes outside the World Anti-Doping Code."
