# ------------------------------------------------------------------ NHS 111 (England), without a number in the title
# They replace nhs-111 ("When to use NHS 111 online or call 111") on the English pages: that title prints a
# phone number, and the English site never does (CONTENT-GUIDE §1). "NHS 111" is the service's name, which may be
# printed. nhs-111 stays in refocus-us-uk-routes.yaml (the UK contact card's help link still points to its page).

uk-nhs-111-online:
  type: web
  authors: "NHS England"
  title: "Get help for your symptoms"
  container: "NHS 111 online"
  year: 2026
  url: https://111.nhs.uk/
  accessed: 2026-10-26
  verified: url
  note: "Read 26 October 2026. Heading '111 online: Get help for your symptoms'; 'If you think you need medical help right now, 111 online can tell you what to do next'; it helps you find the best place to get help for your symptoms and does not give a diagnosis; also dental, mental health, sexual health and prescription questions; 'NHS 111 online is available in England only.' Cited for: NHS 111 in England is an online (and phone) service that tells you how urgent a problem is and where to go."

uk-nhs-what-happens-when-you-call-111:
  type: web
  authors: "NHS (England)"
  title: "What happens when you call NHS 111"
  container: "nhs.uk"
  year: 2022
  url: https://www.nhs.uk/nhs-services/urgent-and-emergency-care-services/when-to-use-111/what-happens-when-you-call-nhs-111/
  accessed: 2026-10-26
  verified: url
  note: "Read 26 October 2026; page last reviewed 14 November 2022 (next review due 14 November 2025, overdue). A health adviser asks who you are, where you are calling from and why; based on your answers the adviser may send an ambulance, refer you to an urgent care service or another professional such as a GP or dentist, arrange an out-of-hours visit or a nurse call-back, or give self-care advice. Cited for: the phone service tells you where to go or what to do; a nurse may call you back."

