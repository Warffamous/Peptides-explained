  note: "Read in the built-in browser on 26 October 2026 (the page needs JavaScript; nothing was entered or submitted). 'Report a problem to the FDA … The report should take 5-10 minutes.' 'What type of information do you have?' Most common: 'Personal experience, for me or someone else: Injury, illness, or potential harm from infant formula, food, drugs, or other FDA-regulated products' and 'Product quality or mislabeling issues'; also clinical trial issues and insider information. 'This web experience was updated on 3/14/2026, including MedWatch Online for drugs, biologics, medical devices, and cosmetics.' The first page does not say whether reports about an online seller are taken. The FDA's former page on reporting unlawful internet sales (fda.gov/safety/report-problem-fda/reporting-unlawful-sales-medical-products-internet) answered HTTP 302 to this form on 26 October 2026. fda-report-a-problem (the overview page at fda.gov/safety/report-problem-fda) links to it. Cited for: the FDA's online form takes reports of side effects and of product quality or mislabelling problems."

