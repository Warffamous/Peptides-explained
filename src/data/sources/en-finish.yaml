# ------------------------------------------------------------------ US: receiving a drug in trade between states

usc-21-331:
  type: law
  authors: "Legal Information Institute, Cornell Law School (text of the United States Code)"
  title: "21 U.S. Code § 331 – Prohibited acts (FD&C Act § 301)"
  container: "United States Code"
  year: 2026
  url: https://www.law.cornell.edu/uscode/text/21/331
  accessed: 2026-10-26
  verified: url
  note: "Read 26 October 2026. 'The following acts and the causing thereof are prohibited: (a) The introduction or delivery for introduction into interstate commerce of any food, drug, device, tobacco product, or cosmetic that is adulterated or misbranded. … (c) The receipt in interstate commerce of any food, drug, device, tobacco product, or cosmetic that is adulterated or misbranded, and the delivery or proffered delivery thereof for pay or otherwise. (d) The introduction or delivery for introduction into interstate commerce of any article in violation of section … 355 …'. Cited for: the list of prohibited acts includes receiving an adulterated or misbranded drug in interstate commerce. Whether this reaches a person who receives a peptide only for their own use was not researched (a question for the legal reviewer); state law was not researched (research/refocus/us-uk-routes.md, 'Federal law only')."

