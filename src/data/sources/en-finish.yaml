  accessed: 2026-10-26
  verified: url
  note: "The 'Summary' PDF linked from the ARTG entry page (www.ebs.tga.gov.au, PrintDetailsPublic, docid 439430), downloaded and read with pdftotext on 26 October 2026 ('Produced at 27.10.2026 at 01:10:30 AEDT'; the entry page itself timed out from here). Medicine registered; sponsor Eli Lilly Australia Pty Ltd; ARTG start date 19/06/2024; product 'Effective Date 7/10/2026'. Specific Indications: type 2 diabetes in adults; 'MOUNJARO is indicated for the treatment of adolescents and children aged 10 years and above weighing 50 kg or more with insufficiently controlled type 2 diabetes mellitus as an adjunct to diet and exercise' (monotherapy when metformin is not tolerated or contraindicated, or with other medicines for type 2 diabetes); chronic weight management in adults. The TGA's list of prescription medicines under evaluation (last updated 21 September 2026, au-tga-pmr-search-status-a-2026-10-24) still showed 'type 2 diabetes from age 10' as under evaluation, and its registrations page (last updated 25 September 2026) did not list it: the register entry is the later and legal record, so the indication was on the register by 7 October 2026; the decision date itself was not found."

# ------------------------------------------------------------------ Health Canada natural health products: NR and NMN

ca-lnhpd-api-nr-nmn-2026-10-26:
  type: dataset
  authors: "Health Canada"
  title: "Licensed Natural Health Products Database (LNHPD), searched through its API on 26 October 2026 for nicotinamide riboside, nicotinamide mononucleotide and NAD+"
  container: "Licensed Natural Health Products Database"
  year: 2026
  url: https://health-products.canada.ca/lnhpd-bdpsnh/
  accessed: 2026-10-26
  verified: registry
  note: "URL changed on 26 October 2026 (second finishing pass) from the API documentation page, which shows no licences, to the public search page, which answered again that evening ('Search licensed natural health products'); it is a form, so a reader repeats the search there (medicinal ingredient 'nicotinamide mononucleotide' or 'nicotinamide riboside'); the counts below come from the API. Earlier on 26 October 2026 the LNHPD web search still redirected to construction.hres.ca; the official API answered. All 831,532 medicinal-ingredient records (8,316 pages, none failed) were read and matched on the ingredient name, then joined to the full product-licence list (307,842 records; latest licence date 23 October 2026) and, for active products, the route endpoint. Nicotinamide mononucleotide: 182 products, 173 with an active licence (product status flag 1; licence dates 16 September 2021 to 22 August 2025); nicotinamide riboside: 35 products, 31 active (licence dates 12 June 2017 to 22 July 2024); every active one by the oral route (capsules, tablets, powders, liquids). Nicotinamide adenine dinucleotide (NAD+): one ingredient record, no product licence; NADH (1,4-dihydronicotinamide adenine dinucleotide): 43 active products, oral. Products are counted, never named. Cited for: oral NR and NMN products hold Canadian natural health product licences."

