  container: "legislation.gov.uk"
  year: 2004
  url: https://www.legislation.gov.uk/uksi/2004/1031/regulation/43
  accessed: 2026-10-26
  verified: url
  note: "Read through the legislation.gov.uk XML on 26 October 2026 (extent E+W+S+N.I.). Part 6, Manufacture and importation of investigational medicinal products. Reg 36(1): no person shall manufacture, assemble or import an investigational medicinal product except in accordance with a manufacturing authorisation. Reg 43(1)-(2): the holder must have a qualified person, who is responsible for ensuring that each production batch 'has been manufactured and checked in compliance with … the principles and guidelines of good manufacturing practice' (for Great Britain as modified by Schedule 2A to the 2012 Regulations), the product specification and the trial's documents. Cited for: in the UK, each batch of a trial medicine must be made and checked under good manufacturing practice."

ca-fdr-c05-010:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section C.05.010 (sponsor's obligations in a clinical trial)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-C.05.010.html
  accessed: 2026-10-26
  verified: url
  note: "Read 26 October 2026. 'Every sponsor shall ensure that a clinical trial is conducted in accordance with good clinical practices and … shall ensure that … (d) for each clinical trial site, the approval of a research ethics board is obtained before the clinical trial begins at the site; … (h) written informed consent … is obtained … after that person has been informed of (i) the risks and anticipated benefits to his or her health arising from participation in the clinical trial …; and (j) the drug is manufactured, handled and stored in accordance with the applicable good manufacturing practices referred to in Divisions 2 to 4 except sections C.02.019, C.02.025 and C.02.026.' Cited for: in Canada, a trial drug must be made under good manufacturing practice."

ecfr-21-56-111:
  type: law
  authors: "U.S. Food and Drug Administration (Electronic Code of Federal Regulations)"
  title: "21 CFR 56.111 – Criteria for IRB approval of research"
  container: "Code of Federal Regulations, Title 21, Part 56 (Institutional Review Boards)"
  year: 2026
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-A/part-56/subpart-C/section-56.111
  accessed: 2026-10-26
  verified: url
  note: "Read through the eCFR versioner API on 26 October 2026 (text as of 15 October 2026). (a): 'In order to approve research covered by these regulations the IRB shall determine that all of the following requirements are satisfied: (1) Risks to subjects are minimized … (2) Risks to subjects are reasonable in relation to anticipated benefits, if any, to subjects, and the importance of the knowledge that may be expected to result.' Cited for: in the US, an ethics board may approve a trial only if its risks are reasonable in relation to the expected benefits."

