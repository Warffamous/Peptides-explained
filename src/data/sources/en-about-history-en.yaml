mhra-2026-08-orforglipron-authorised:
  type: regulator
  authors: "Medicines and Healthcare products Regulatory Agency"
  title: "UK first in Europe to authorise orforglipron for weight management and type 2 diabetes"
  container: "GOV.UK"
  year: 2026
  url: https://www.gov.uk/government/news/uk-first-in-europe-to-authorise-orforglipron-for-weight-management-and-type-2-diabetes
  accessed: 2026-10-24
  verified: url
  note: "Press release, first published 10 August 2026 (read through the GOV.UK content API on 24 October 2026). 'The Medicines and Healthcare products Regulatory Agency (MHRA) has today (10, August, 2026) authorised orforglipron (Foundayo)', for weight loss and weight maintenance in adults with a BMI of 30 or above, or 27 to 30 with at least one weight-related comorbidity, and for glycaemic control in insufficiently controlled type 2 diabetes; 'can be taken at any time of day with no food or water restrictions'; a prescription-only medicine; not currently available through the NHS (NICE evaluation to follow); 'Authorisation ... was granted on 10 August, 2026 to Eli Lilly.' The page also gives the dose steps (not used on this site) and a press-office telephone number (not recorded)."

fda-accelerated-approval-program:
  type: regulator
  authors: "U.S. Food and Drug Administration, Center for Drug Evaluation and Research"
  title: "Accelerated Approval Program"
  year: 2026
  url: https://www.fda.gov/drugs/nda-and-bla-approvals/accelerated-approval-program
  accessed: 2026-10-24
  verified: url
  note: "Page modified 25 August 2026 (read 24 October 2026). 'The FDA instituted its Accelerated Approval Program to allow for earlier approval of drugs that treat serious conditions, and fill an unmet medical need based on a surrogate endpoint'; a surrogate endpoint is a marker 'thought to predict clinical benefit but is not itself a measure of clinical benefit'; 'Drug companies are still required to conduct studies to confirm the anticipated clinical benefit.' Supports: accelerated approval is for serious conditions, rests on a surrogate marker, and needs confirmatory studies."

uk-hmr-2012-reg-58:
  type: law
  authors: "UK Parliament"
  title: "The Human Medicines Regulations 2012 (SI 2012/1916), regulation 58: Consideration of application"
  container: "legislation.gov.uk"
  year: 2012
  url: https://www.legislation.gov.uk/uksi/2012/1916/regulation/58
  accessed: 2026-10-24
  verified: url
  note: "Read 24 October 2026 (text up to date with all changes known to be in force on or before 24 October 2026). Reg. 58(4): 'The licensing authority may grant the application only if, having considered the application and the accompanying material, the authority thinks that— (a) the applicant has established the therapeutic efficacy of the product ...; (b) the positive therapeutic effects of the product outweigh the risks to the health of patients or of the public ...; (c) the application and the accompanying material complies with regulations 49 to 55; and (d) the product's qualitative and quantitative composition is as described in the application'. Reg. 58(1): a decision within 210 days. Supports: a UK marketing authorisation needs shown efficacy, a favourable balance of benefit and risk, and the declared composition (quality)."
