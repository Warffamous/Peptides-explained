# ---------------------------------------------------------------- United States: consent, privacy, records

medlineplus-informed-consent-adults:
  type: web
  authors: "MedlinePlus, U.S. National Library of Medicine"
  title: "Informed consent - adults (Medical Encyclopedia)"
  container: "medlineplus.gov"
  year: 2025
  url: https://medlineplus.gov/ency/patientinstructions/000445.htm
  accessed: 2026-10-24
  verified: url
  note: "Review date 19 October 2025 (A.D.A.M. content, reviewed by the MedlinePlus editors). 'You have the right to help decide what medical care you want to receive. By law, your health care providers must explain your health condition and treatment choices to you. This is called informed consent.' The provider must explain, among other things, the risks of the treatment, how likely it is to work and 'Other options for treating your health problem'; 'You have the right to refuse treatment' if you understand your condition and the options; providers 'should not try to force you to have a treatment you do not want to have'; informed consent is not needed in an emergency when delay would be dangerous. Cited for: in the US, doctors must explain the risks and the other options so that you can decide."

ecfr-45-164-506:
  type: law
  authors: "U.S. Department of Health and Human Services"
  title: "45 CFR 164.506 – Uses and disclosures to carry out treatment, payment, or health care operations (HIPAA Privacy Rule)"
  container: "eCFR"
  year: 2016
  url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-E/section-164.506
  accessed: 2026-10-24
  verified: url
  note: "Read through the eCFR versioner API (text as of 15 October 2026; last substantive version 30 December 2016). (a): a covered entity may use or disclose protected health information for treatment, payment or health care operations, as set out in paragraph (c). Cited for: under the HIPAA Privacy Rule, information may be shared for your care without a separate written permission."

ecfr-45-164-508:
  type: law
  authors: "U.S. Department of Health and Human Services"
  title: "45 CFR 164.508 – Uses and disclosures for which an authorization is required (HIPAA Privacy Rule)"
  container: "eCFR"
  year: 2016
  url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-E/section-164.508
  accessed: 2026-10-24
  verified: url
  note: "Read through the eCFR versioner API (text as of 15 October 2026; last substantive version 30 December 2016). (a)(1) 'Authorization required: General rule. Except as otherwise permitted or required by this subchapter, a covered entity may not use or disclose protected health information without an authorization that is valid under this section.' Cited for: in the US, outside your care and the cases the rule lists, a doctor needs your written permission (an authorisation) to share your health information."

ecfr-45-164-512:
  type: law
  authors: "U.S. Department of Health and Human Services"
  title: "45 CFR 164.512 – Uses and disclosures for which an authorization or opportunity to agree or object is not required (HIPAA Privacy Rule)"
  container: "eCFR"
  year: 2024
  url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-E/section-164.512
  accessed: 2026-10-24
  verified: url
  note: "Read through the eCFR versioner API (text as of 15 October 2026; substantive versions 30 December 2016, 26 April 2024 and 25 June 2024). Lists the situations in which a covered entity may use or disclose protected health information without the individual's written authorisation, including (a) uses and disclosures required by law; (f) 'Disclosures for law enforcement purposes' to a law enforcement official 'if the conditions in paragraphs (f)(1) through (f)(6) of this section are met', among them (f)(1)(ii)(A) 'A court order or court-ordered warrant, or a subpoena or summons issued by a judicial officer'; (j) 'Uses and disclosures to avert a serious threat to health or safety', where the covered entity in good faith believes the disclosure 'Is necessary to prevent or lessen a serious and imminent threat to the health or safety of a person or the public'. Re-read through the versioner API (text as of 15 October 2026) on 26 October 2026: (f)(1)(ii)(A) and (j)(1)(i)(A) confirmed word for word. Cited for: the exceptions to US health privacy (required by law; police only under set conditions, for example a court order; a serious threat to someone's health or safety)."

ecfr-45-164-524:
  type: law
  authors: "U.S. Department of Health and Human Services"
  title: "45 CFR 164.524 – Access of individuals to protected health information (HIPAA Privacy Rule)"
  container: "eCFR"
  year: 2016
  url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-E/section-164.524
  accessed: 2026-10-24
  verified: url
  note: "Read through the eCFR versioner API (text as of 15 October 2026; last substantive version 30 December 2016). (a)(1): 'an individual has a right of access to inspect and obtain a copy of protected health information about the individual in a designated record set', except psychotherapy notes and information compiled for legal proceedings; (a)(2)-(3): limited grounds for denial, some reviewable; (b)(2)(i): the covered entity 'must act on a request for access no later than 30 days after receipt of the request', with one extension of no more than 30 days if it gives written reasons. Cited for: in the US, you can see your medical record and get a copy, usually within 30 days."

ecfr-45-164-510:
  type: law
  authors: "U.S. Department of Health and Human Services"
  title: "45 CFR 164.510 – Uses and disclosures requiring an opportunity for the individual to agree or to object (HIPAA Privacy Rule)"
  container: "eCFR"
  year: 2016
  url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-E/section-164.510
  accessed: 2026-10-26
  verified: url
  note: "Read through the eCFR versioner API on 26 October 2026 (text as of 15 October 2026; last substantive version 30 December 2016). (b)(1)(i): a covered entity may disclose 'to a family member, other relative, or a close personal friend of the individual, or any other person identified by the individual, the protected health information directly relevant to such person's involvement with the individual's health care or payment related to the individual's health care'. (b)(2): if the individual is present and has capacity, the covered entity may do so if it '(i) Obtains the individual's agreement; (ii) Provides the individual with the opportunity to object to the disclosure, and the individual does not express an objection; or (iii)' reasonably infers from the circumstances that the individual does not object. Cited for: in the US, a doctor may tell a family member or friend who helps with your care what they need to know for that, unless you object."

# ---------------------------------------------------------------- United Kingdom: consent, NHS rights

gmc-2020-consent-seven-principles:
  type: regulator
  authors: "General Medical Council"
  title: "Decision making and consent: the seven principles of decision making and consent"
  container: "gmc-uk.org"
  year: 2026
  url: https://www.gmc-uk.org/professional-standards/the-professional-standards/decision-making-and-consent/the-seven-principles-of-decision-making-and-consent
  accessed: 2026-10-24
  verified: url
  note: "Read with curl and browser request headers on 24 October 2026. The guidance 'came into effect on 9 November 2020' and was updated on 13 December 2024 and on 3 August 2026 (guidance home page). Principle one: 'All patients have the right to be involved in decisions about their treatment and care and be supported to make informed decisions if they are able.' Principle three: 'All patients have the right to be listened to, and to be given the information they need to make a decision and the time and support they need to understand it.' Principle four: 'Medical professionals must try to find out what matters to patients so they can share relevant information about the benefits and harms of proposed options and reasonable alternatives, including the option to take no action.' Cited for: UK doctors must explain the benefits and harms of the options, including doing nothing, and you have the right to take part in the decision."

gmc-2020-consent-paras-48-49:
  type: regulator
  authors: "General Medical Council"
  title: "Decision making and consent: the dialogue leading to a decision (part 4 of 4), paragraphs 48-49 (If you disagree with a patient's choice of option)"
  container: "gmc-uk.org"
  year: 2026
  url: https://www.gmc-uk.org/professional-standards/the-professional-standards/decision-making-and-consent/the-dialogue-leading-to-a-decision-continued-3
  accessed: 2026-10-24
  verified: url
  note: "Same guidance and dates as gmc-2020-consent-seven-principles. Para 48: 'You must respect your patient's right to decide', and 'you must not assume a patient lacks capacity simply because they make a decision that you consider unwise.' Para 49: 'If a patient asks for treatment or care that you don't think would be in their clinical interests, you should explore their reasons for requesting it'; if after discussion the doctor still considers that it would not serve the patient's needs, 'then you should not provide it. But, you should explain your reasons to the patient and explore other options that might be available, including their right to seek a second opinion.' Cited for: a UK doctor does not have to provide a treatment they think would not serve you, but should explain why, look at other options and mention your right to a second opinion."

nhs-constitution-england:
  type: web
  authors: "Department of Health and Social Care"
  title: "The NHS Constitution for England"
  container: "GOV.UK"
  year: 2023
  url: https://www.gov.uk/government/publications/the-nhs-constitution-for-england/the-nhs-constitution-for-england
  accessed: 2026-10-24
  verified: url
  note: "Read through the GOV.UK content API on 24 October 2026 (first published 8 August 2016, updated 17 August 2023). Under respect, consent and confidentiality: 'You have the right to accept or refuse treatment that is offered to you, and not to be given any physical examination or treatment unless you have given valid consent'; 'You have the right to be given information about the test and treatment options available to you, what they involve and their risks and benefits'; 'You have the right of access to your own health records and to have any factual inaccuracies corrected'; 'You have the right to privacy and confidentiality and to expect the NHS to keep your confidential information safe and secure.' England only. Cited for: NHS patients in England have a right to see their health records, to information about options, and to confidentiality."

# ---------------------------------------------------------------- Canada: the CMA Code, as adopted by a provincial college

cpsa-cma-code-of-ethics:
  type: guideline
  authors: "Canadian Medical Association (adopted as a standard of practice by the College of Physicians & Surgeons of Alberta)"
  title: "CMA Code of Ethics and Professionalism (2018)"
  container: "cpsa.ca"
  year: 2018
  url: https://cpsa.ca/wp-content/uploads/2026/09/CMAs-Code-of-Ethics-and-Professionalism-2018.pdf
  accessed: 2026-10-24
  verified: url
  note: "PDF downloaded with curl and read with pdftotext on 24 October 2026 ('Approved by the CMA Board of Directors Dec 2018'). Linked from CPSA's standard of practice 'Code of Ethics & Professionalism' (https://cpsa.ca/physicians/standards-of-practice/code-of-ethics/, reissued by Council 1 July 2019): 'A regulated member must comply with the CMA Code of Ethics & Professionalism adopted by the College'; the page also says 'The Canadian Medical Association released an updated Code of Ethics and Professionalism on Sept. 18, 2026. CPSA is reviewing the Code ... Until further notice, the 2018 version of CMA's Code of Ethics and Professionalism remains in effect in Alberta.' Para 11: 'Empower the patient to make informed decisions regarding their health' by helping them 'navigate reasonable therapeutic options' and 'assess material risks and benefits before consenting to any treatment or intervention'. Para 12: respect the decisions of the competent patient to accept or reject any recommended assessment, treatment or plan of care. Para 17: 'Respect the patient's reasonable request for a second opinion from a recognized medical expert.' Para 18: 'Fulfill your duty of confidentiality to the patient by keeping identifiable patient information confidential'; 'Exceptions include situations where the informed consent of the patient has been obtained for disclosure or as provided for by law.' Para 19: 'Provide the patient or a third party with a copy of their medical record upon the patient's request, unless there is a compelling reason to believe that information contained in the record will result in substantial harm to the patient or others.' The other provinces' colleges were not checked; cited as the code Canadian doctors' own association wrote, binding in Alberta."

# ---------------------------------------------------------------- Australia: privacy law, the Medical Board's code

oaic-handling-health-information:
  type: regulator
  authors: "Office of the Australian Information Commissioner"
  title: "Handling health information"
  container: "oaic.gov.au"
  year: 2023
  url: https://www.oaic.gov.au/privacy/your-privacy-rights/health-information/handling-health-information
  accessed: 2026-10-24
  verified: url
  note: "Published 10 March 2023 (page metadata). 'A health service provider needs to handle your health information to carry out their work. But Australian privacy law has strict rules about how they collect it, and what they must tell you.' A provider 'can disclose your health information to others in certain situations, such as': for the same purpose they collected it; if directly related to a purpose you would reasonably expect; 'if it's required by law'; 'if it's necessary to prevent a serious threat to life, health or safety and it's not practical to get your consent'; or 'if you agree to it'. Cited for: the exceptions to Australian health privacy (your agreement, the law, a serious threat to someone's life, health or safety)."

oaic-access-health-information:
  type: regulator
  authors: "Office of the Australian Information Commissioner"
  title: "Access your health information"
  container: "oaic.gov.au"
  year: 2026
  url: https://www.oaic.gov.au/privacy/your-privacy-rights/health-information/access-your-health-information
  accessed: 2026-10-24
  verified: url
  note: "Published 10 March 2023, modified 3 September 2026 (page metadata). 'Australian privacy law gives you a general right to request access to the health information a health service provider holds about you'; 'State or territory laws cover health information a public hospital holds about you'; the OAIC 'generally think[s] 30 days is a reasonable period' to respond; access can be refused in some situations (for example if it may threaten someone's life, health or safety), with a written notice of the reasons; a fee may be charged but 'can't be excessive'. Cited for: in Australia, you can ask to see the health information your doctor holds about you."

mba-good-medical-practice-2020:
  type: regulator
  authors: "Medical Board of Australia"
  title: "Good medical practice: a code of conduct for doctors in Australia (October 2020)"
  container: "medicalboard.gov.au"
  year: 2020
  url: https://www.medicalboard.gov.au/codes-guidelines-policies/code-of-conduct.aspx
  accessed: 2026-10-24
  verified: url
  note: "The Board's code page (curl gets a bot check; read through WebFetch on 24 October 2026) links the code as a PDF on ahpra.gov.au, saved through WebFetch and read with pdftotext ('October 2020' on the cover and in every footer). 3.2.6 'Providing treatment options based on the best available information.' 3.2.10 'Supporting the patient's right to seek a second opinion.' 4.4: 'Patients have a right to expect that doctors and their staff will hold information about them in confidence, unless release of information is required or permitted by law.' 4.4.2 'Appropriately sharing information about patients for their healthcare, consistent with privacy laws and professional guidelines about confidentiality.' (4.4.2 added by the fact-check, read on the code page in the built-in browser on 26 October 2026; it supports 'other health workers who treat you' on talking-to-your-doctor.) 4.5: 'Informed consent is a person's voluntary decision about medical care that is made with knowledge and understanding of the benefits and risks involved'; 4.5.1 'Providing information to patients in a way they can understand before asking for their consent.' 4.5.2: obtaining informed consent 'before you undertake any examination, investigation or provide treatment (except in an emergency)'. 10.5.7 'Recognising patients' right to access information contained in their medical records and facilitating that access.' Re-checked on 26 October 2026 (code page through WebFetch; the PDF saved through WebFetch and read with pdftotext: 'October 2020' on the cover; 3.2.6, 3.2.10, 4.4, 4.5, 4.5.1, 4.5.2 and 10.5.7 confirmed). Cited for: Australian doctors' duties of confidentiality and informed consent (apart from emergencies), options, second opinions and access to records."

# ---------------------------------------------------------------- preparing for an appointment

au-healthdirect-questions-to-ask-your-doctor:
  type: web
  authors: "Healthdirect Australia"
  title: "Questions to ask your doctor"
  container: "healthdirect.gov.au"
  year: 2024
  url: https://www.healthdirect.gov.au/healthcare-and-services/general-health/questions-to-ask-your-doctor
  accessed: 2026-10-24
  verified: url
  note: "Last reviewed December 2024 (the page text is rendered by scripts; read in the built-in browser, in our own tab, on 24 October 2026). 'Write down or print your questions and bring them to your doctor's appointment.' 'It's a good idea to take a written list of all medicines with you to your appointments. This should include over-the-counter medicines and health supplements like vitamins'; 'You can ask a friend or relative to come to your appointments to help you remember the information.' Suggested questions include 'Are there other ways to treat my condition?', 'Is there a clinical trial that I can join?' and 'Is it OK if I take some time to decide?'. Cited for: how to prepare for an appointment (written questions, a list of all medicines and supplements, someone to come with you) and questions to ask, including about other treatments and time to decide."

# ---------------------------------------------------------------- the-case-for-reform: examples from the four countries

recovery-2021-dexamethasone:
  type: trial
  authors: "RECOVERY Collaborative Group; Horby P, Lim WS, Emberson JR, et al."
  title: "Dexamethasone in Hospitalized Patients with Covid-19"
  container: "The New England Journal of Medicine"
  year: 2021
  volume: "384"
  pages: "693-704"
  doi: 10.1056/NEJMoa2021436
  pmid: "32678530"
  pmcid: PMC7383595
  verified: pubmed
  note: "Published online 17 July 2020. Controlled, open-label platform trial in UK hospitals (RECOVERY; NCT04381936, ISRCTN50189673; the acknowledgements in the PMC full text thank staff 'at 176 NHS hospital organizations across the United Kingdom'): 2,104 patients randomly assigned to dexamethasone and 4,321 to usual care; 28-day mortality 22.9% vs 25.7% (age-adjusted rate ratio 0.83); benefit in patients on invasive ventilation or oxygen, not in those without respiratory support. Funded by the Medical Research Council and the National Institute for Health Research, among others. Cited for: a publicly funded UK trial showed that an old, cheap medicine saves lives in one group of patients."

recovery-2020-hydroxychloroquine:
  type: trial
  authors: "RECOVERY Collaborative Group; Horby P, Mafham M, Linsell L, et al."
  title: "Effect of Hydroxychloroquine in Hospitalized Patients with Covid-19"
  container: "The New England Journal of Medicine"
  year: 2020
  volume: "383"
  pages: "2030-2040"
  doi: 10.1056/NEJMoa2022926
  pmid: "33031652"
  pmcid: PMC7556338
  verified: pubmed
  note: "Published online 8 October 2020. Randomised, controlled, open-label platform trial (RECOVERY): 1,561 patients assigned to hydroxychloroquine and 3,155 to usual care; enrolment to hydroxychloroquine closed on 5 June 2020 after an interim analysis showed a lack of efficacy; 28-day mortality 27.0% vs 25.0% (rate ratio 1.09; 95% CI 0.97 to 1.23). Funded by UK Research and Innovation and the National Institute for Health Research, among others (acknowledgements: '176 NHS hospital organizations across the whole of the UK'). The medicine had been proposed 'on the basis of in vitro activity and data from uncontrolled studies and small, randomized trials' (abstract; fact-check 26 October 2026: 'and small, randomized trials' added, the draft had left it out). Cited for: the same public trial gave a clear negative answer for a widely promoted medicine."

au-act-drug-checking:
  type: web
  authors: "ACT Government (ACT Health)"
  title: "Drug checking"
  container: "act.gov.au"
  year: 2026
  url: https://www.act.gov.au/health/drugs-alcohol-smoking-and-vaping/drug-checking
  accessed: 2026-10-24
  verified: url
  note: "Last updated 14 July 2026 (read with curl). 'Drug checking does not make drugs safe and using drugs may still harm your health even if you have had them checked.' 'Australia's first fixed-site health and drug checking service opened in Canberra in July 2022. The service is funded to run until June 2027.' The service is free and confidential; it 'publish[es] community notices on their social media about any particularly dangerous substances they find'; the pilot was independently evaluated (interim report December 2022, final report April 2023). The page names the non-profit operator and partners; the site does not repeat them. Fact-check (26 October 2026, re-read with curl): the quotations confirmed; the page says the service 'is funded' but not by whom, so the pages now say 'government-backed' (an ACT Government page describing the service, whose pilot was independently evaluated), not 'publicly funded'; the 'drug checking does not make drugs safe' sentence is the ACT Government's, not the service's. Cited for: a government-backed drug-checking service in Australia that warns about dangerous findings, and the ACT Government's statement that checking does not make a drug safe."

ecfr-21-314-108:
  type: law
  authors: "U.S. Food and Drug Administration"
  title: "21 CFR 314.108 – New drug product exclusivity"
  container: "eCFR"
  year: 2016
  url: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-D/part-314/subpart-D/section-314.108
  accessed: 2026-10-24
  verified: url
  note: "Read through the eCFR versioner API (text as of 15 October 2026; last substantive version 23 December 2016). (b)(2): if a drug product that contains a new chemical entity was approved after 24 September 1984, 'no person may submit a 505(b)(2) application or ANDA ... for a drug product that contains the same active moiety ... for a period of 5 years from the date of approval of the first approved NDA', or after 4 years with a certification of patent invalidity or non-infringement. Cited for: in the US, a medicine with a new active ingredient is protected from copies that rely on its approval for about five years, whether or not it has a patent."

ca-fdr-c08-004-1-data-protection:
  type: law
  authors: "Government of Canada"
  title: "Food and Drug Regulations, section C.08.004.1 (data protection for innovative drugs)"
  container: "Justice Laws Website"
  year: 2026
  url: https://laws-lois.justice.gc.ca/eng/regulations/C.R.C.,_c._870/section-C.08.004.1.html
  accessed: 2026-10-24
  verified: url
  note: "Regulations current to 30 September 2026, last amended 17 June 2026. Innovative drug: 'a drug that contains a medicinal ingredient not previously approved in a drug by the Minister and that is not a variation of a previously approved medicinal ingredient'. (3): a manufacturer seeking approval on the basis of a comparison with an innovative drug may not file before six years, and the Minister 'shall not ... issue a notice of compliance in respect of the new drug before the end of a period of eight years after the day on which the first notice of compliance was issued to the innovator'; (4): eight years and six months with qualifying paediatric trials; (5): not if the innovative drug is not marketed in Canada. Cited for: in Canada, copies that rely on a new medicine's approval cannot be approved for eight years."

# ---------------------------------------------------------------- the-case-for-reform: conditional routes in the UK, Canada and Australia
# (the US route is fda-accelerated-approval-program, en-about-history-en.yaml)

mhra-conditional-marketing-authorisation:
  type: regulator
  authors: "Medicines and Healthcare products Regulatory Agency"
  title: "Conditional marketing authorisations, exceptional circumstances marketing authorisations and national scientific advice"
  container: "GOV.UK"
  year: 2025
  url: https://www.gov.uk/guidance/conditional-marketing-authorisations-exceptional-circumstances-marketing-authorisations-and-national-scientific-advice
  accessed: 2026-10-26
  verified: url
  note: "Read through the GOV.UK content API on 26 October 2026 (first published 31 December 2020, updated 11 March 2025). 'The MHRA offers a national conditional marketing authorisation (CMA) scheme for new medicinal products. This is available in specific circumstances where comprehensive clinical data are not yet complete but it is judged that such data will become available soon.' The scheme 'is aimed at products that fulfil an unmet medical need: for the treatment, prevention or diagnosis of seriously debilitating or life-threatening diseases' or for emergency use; criteria include a positive benefit-risk balance and that 'the benefit of the medicine's immediate availability to patients is greater than the risk inherent in the fact that additional data are still required'; the holder 'must fulfil specific obligations within defined timelines', such as completing studies; 'CMAs will be valid for one year and will be renewable annually'; from 1 January 2025 the MHRA grants UK-wide CMAs under regulation 50I of the Human Medicines Regulations 2012. Cited for: the UK's conditional route is for an unmet need with incomplete data, lasts a year at a time and carries obligations to complete the data."

ca-hc-noc-c-fact-sheet:
  type: regulator
  authors: "Health Canada"
  title: "Notice of Compliance with Conditions - NOC/c (Therapeutic Products) (fact sheet)"
  container: "canada.ca"
  year: 2017
  url: https://www.canada.ca/en/health-canada/services/drugs-health-products/drug-products/fact-sheets/notice-compliance-conditions-therapeutics-products.html
  accessed: 2026-10-26
  verified: url
  note: "canada.ca did not answer curl from this machine on 26 October 2026; read in the built-in browser (own tab) and through WebFetch the same day (page details 2017-05-04). 'An NOC/c is authorization to market a drug that is issued under the Notice of Compliance with Conditions Policy. This indicates that the sponsor has agreed to undertake additional studies to confirm the clinical benefit of the product.' Eligibility 'is restricted to promising new drug therapies intended for the treatment, prevention or diagnosis of serious, life-threatening or severely debilitating diseases or conditions' with no alternative on the Canadian market or a significant improvement in benefit/risk; sponsors 'must agree to carry out additional clinical trials to verify the clinical benefit of the drug'; conditions are removed once the sponsor provides 'satisfactory evidence of the drug's clinical effectiveness'. Cited for: Canada's conditional route requires the sponsor to run more trials to confirm the benefit."

au-tga-provisional-registration:
  type: regulator
  authors: "Therapeutic Goods Administration"
  title: "Apply for a prescription medicine via the provisional registration pathway"
  container: "tga.gov.au"
  year: 2025
  url: https://www.tga.gov.au/products/medicines/prescription-medicines/application-and-market-authorisation/supply-prescription-medicine/application-process-prescription-medicines/apply-prescription-medicine-provisional-registration-pathway
  accessed: 2026-10-26
  verified: url
  note: "Read in the built-in browser (own tab) on 26 October 2026, reached from the TGA's fast-track hub address (redirects here); last updated 1 May 2025. 'The provisional registration pathway expedites early access to promising new medicines. This is for a limited time while you conduct clinical studies to confirm the medicine's benefit.' It 'is for prescription medicines that treat serious and life-threatening conditions'; 'we provisionally register them based on preliminary clinical data'; 'Provisional registration is limited to 2 years while you conduct the studies outlined in your clinical study plan. You can apply for 2 extensions up to a maximum of 6 years'; it lapses if not transitioned to full registration within the 6 years. Cited for: Australia's provisional registration lasts two years at a time, at most six, while the sponsor collects the missing data."
