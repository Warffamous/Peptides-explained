eu-directive-2001-83:
  type: law
  authors: "European Parliament and Council of the European Union"
  title: "Directive 2001/83/EC on the Community code relating to medicinal products for human use (consolidated text)"
  container: "Official Journal of the European Communities, L 311"
  year: 2001
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02001L0083-20250101
  accessed: 2026-10-27
  verified: url
  note: "Consolidated text of 1 January 2025 (no 2026 consolidation: CELLAR 404 on 27 October 2026), read through publications.europa.eu/resource/celex/02001L0083-20250101 (English and Dutch). Arts. 10, 86, 87 and 88, which the English pages cite, read the same as in the 1 January 2022 consolidation. Cited for: art. 1(2) (a medicinal product is a substance presented as treating or preventing disease in humans, or used to restore, correct or modify physiological functions by a pharmacological, immunological or metabolic action); art. 2(2) (in case of doubt, the Directive applies); art. 3(1) (it does not apply to a medicine prepared in a pharmacy on a prescription for an individual patient, the magistral formula); art. 5(1) (a Member State may, in accordance with its law and to fulfil special needs, exclude a medicine supplied on a bona fide unsolicited order of an authorised health-care professional, for an individual patient under his direct personal responsibility); art. 6(1) (no medicinal product may be placed on the market of a Member State without a marketing authorisation from that Member State or under Regulation 726/2004); art. 8(3)(j) and 59 (a summary of product characteristics and a package leaflet); art. 10(1) (a generic may rely on a reference medicine authorised for at least 8 years and may be marketed only after 10 years, up to 11 with a significant new indication); art. 40(1) (manufacture needs a manufacturing authorisation); art. 46(f) (the manufacturer follows good manufacturing practice and uses only active substances made under GMP); art. 48(1) and 51 (at least one qualified person, who secures that each batch has been manufactured and checked in compliance with the law and the marketing authorisation, 51(1)(a), and certifies each production batch in a register, 51(3)); art. 54 (the outer packaging shows among other things the name, the expiry date, the authorisation number and the batch number, (a), (h), (l), (m), and the safety features, (o): a unique identifier and a device showing whether the pack has been tampered with) and 54a(1) (prescription medicines carry them); art. 55(3) (small immediate packagings show at least the name, the method of administration, the expiry date, the batch number and the contents); art. 85c(1) and (3) (online sale to the public: the seller is authorised under the law of its Member State and notified there, the medicines comply with the law of the Member State of destination, and the common logo, recognisable throughout the Union, is on every page and links to the national list); art. 86(1) (what advertising includes); art. 86(2) (excluded from the advertising rules; the English text adds to 'information relating to human health or diseases' the condition 'provided that there is no reference, even indirect, to medicinal products', which the Dutch text lacks); art. 87(1)-(3) (Member States prohibit advertising of a medicine without a marketing authorisation; advertising must comply with the SmPC, present the medicine objectively without exaggerating its properties and not be misleading); art. 88(1) (no advertising to the public of prescription-only medicines); art. 104(1) (the marketing-authorisation holder operates a pharmacovigilance system); art. 107a(1) (each Member State records the suspected adverse reactions reported by healthcare professionals and patients); art. 111(1) (the competent authority checks by inspections that the legal requirements are complied with)."

