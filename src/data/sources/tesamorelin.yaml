  note: "Approval of the 1 mg/vial product for reduction of excess abdominal fat in HIV-infected patients with lipodystrophy (NDA received 29 May 2009). Postmarketing requirements under 505(o): the FDA found spontaneous reports insufficient to identify serious risks of 'microbial contamination possibly resulting in soft tissue infections which can occur during product reconstitution', malignancies or diabetic retinopathy related to elevated IGF-1, and glucose intolerance/diabetes and hypersensitivity; it required (1708-1) a single-vial 2 mg product, (1708-2) a long-term observational safety study 'of at least 10 years duration' (completion December 2024, final report August 2025), and (1708-3) a randomised placebo-controlled trial of at least three years on diabetic retinopathy progression, with long-term glucose and blinded MACE adjudication (completion May 2016)."

fda-2010-egrifta-summary-review:
  type: regulator
  authors: "Parks MH (U.S. Food and Drug Administration, Center for Drug Evaluation and Research)"
  title: "Division Director Summary Review, NDA 22-505 (Egrifta, tesamorelin acetate)"
  year: 2010
  url: https://www.accessdata.fda.gov/drugsatfda_docs/nda/2010/022505Orig1s000SumR.pdf
  accessed: 2026-10-22
  verified: url
  note: "Dated 5 November 2010. The FDA did not require evidence of cardiovascular risk reduction; the VAT reductions 'were not accompanied by robust or consistent changes' in body-image or lipid measures; the drug showed 'similar side-effects (albeit attenuated)' to growth hormone (fluid retention, glucose impairment/diabetes risk, IGF-1 increases). At the Endocrinologic and Metabolic Drugs Advisory Committee on 27 May 2010 all 16 voting members voted yes on benefit-risk; several cited patient testimonials and the lack of an approved therapy. 'Data are absent on the long-term clinical benefits of Egrifta on CV risk reduction, compliance to HAART and the long-term risks of elevated IGF-1 levels.'"

