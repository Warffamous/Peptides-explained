# ---------------------------------------------------------------- Europe and the United Kingdom

ema-egrifta-withdrawal:
  type: regulator
  authors: "European Medicines Agency"
  title: "Egrifta: withdrawal of the marketing authorisation application (EMEA/H/C/002427), with questions and answers (EMA/CHMP/475021/2012)"
  year: 2012
  url: https://www.ema.europa.eu/en/medicines/human/EPAR/egrifta
  accessed: 2026-10-22
  verified: url
  note: "On 21 June 2012 the applicant, Ferrer Internacional S.A., withdrew its application for Egrifta (tesamorelin) for excess abdominal fat in HIV patients with lipodystrophy, after the CHMP's last round of questions. The CHMP's provisional opinion was that it could not have been approved: difficulty telling lipodystrophy fat from obesity fat in practice; the proposed 130 cm2 cut-off insufficiently supported; the reduction in abdominal fat 'has not been shown to be clinically meaningful in terms of actual health benefits'; trial patients not representative of European HIV patients (lower BMI, less abdominal fat); IGF-1 increase in a considerable number of patients a 'major safety concern' (possible cancer risk and worsening of diabetic eye disease); 'no long-term safety data'. Two main studies with 816 patients. EMA medicines data: status 'Application withdrawn', first published 18 July 2012."

