# ---------------------------------------------------------------- United States: FDA advisory committee documents

fda-pcac-2026-mots-c-briefing:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA Briefing Document for MOTS-c-Related Bulk Drug Substances (MOTS-c (free base) and MOTS-c acetate), Pharmacy Compounding Advisory Committee meeting, 23–24 July 2026"
  year: 2026
  url: https://www.fda.gov/media/193347/download
  accessed: 2026-10-22
  verified: url
  note: "Evaluation dated 11 May 2026, read in full (pdftotext). Sequence H-Met-Arg-Trp-Gln-Glu-Met-Gly-Tyr-Ile-Phe-Tyr-Pro-Arg-Lys-Leu-Arg-OH, C101H152N28O22S2, 2174.6 g/mol; 'first discovered by Lee et al. in 2015'; not well characterised (naming, impurities, aggregates, endotoxin, bioburden); immunogenicity risk by injection cannot be ruled out; EMA lists no authorised product; no monograph in the European or Japanese pharmacopoeia; nonclinical work 'limited to in-vitro and in-vivo rodent models', no dose-response assessments, molecular target(s) unknown; no in-vivo PK, acute, repeat-dose, genotoxicity, reproductive or carcinogenicity studies; in human blood in a dish MOTS-c was quickly cut into shorter peptides (Knoop 2019); lifespan data from Reynolds 2021 (median 912 vs 970 days); FAERS searched to 9 March 2025, no reports; 'did not identify ... any clinical studies or human exposure data for MOTS-c via any route'; uses reviewed: obesity and osteoporosis; MOTS-c listed as prohibited in Global DRO (2024 WADA List)."

fda-pcac-2026-epitalon-briefing:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA Briefing Document for Epitalon-Related Bulk Drug Substances (Epitalon (free base) and Epitalon acetate), Pharmacy Compounding Advisory Committee meeting, 23–24 July 2026"
  year: 2026
  url: https://www.fda.gov/media/193345/download
  accessed: 2026-10-22
  verified: url
  note: "Evaluation dated 12 May 2026, read in full (pdftotext). Synthetic tetrapeptide Ala-Glu-Asp-Gly, C14H22N4O9, 390.35 g/mol; first synthesised in the late 1980s under Prof. Vladimir Khavinson, St Petersburg; 'may be identified as the putative active component of a bovine pineal gland extract known as epithalamin'; 'Most pharmacological studies of epitalon have been conducted and published by Dr. Khavinson's research group in Russia'; three human studies found (two sublingual in night-shift workers: Khavinson 2021, Ivko 2021; one parabulbar injection in retinitis pigmentosa: Khavinson 2002b); Ivko: randomised, placebo-controlled, 75 women aged 40–50 (40 randomised), 20 days, outcome urinary 6-sulfatoxymelatonin, blinding not specified, no sleep outcomes, no safety data; US orphan designation for retinitis pigmentosa 2 September 2010, withdrawn/revoked 6 January 2016; no approved products in Canada, Australia, UK, Belgium, Ireland, France, Norway, Germany, Spain, Italy, none authorised by EMA; old monkeys: evening melatonin up more than 4-fold (Goncharova 2001); rat pineal glands in a dish: no increase in melatonin release (Djeridane 2003); no acute, repeat-dose or reproductive toxicity studies; genotoxicity and tumour studies all from one group, fixed dose, female mice only, exposure at most about 5.5 months; 'epitalon has the potential to be carcinogenic' because telomerase activation and long telomeres are associated with cancer risk; no 2-year carcinogenicity study; no PK data in humans; FAERS to 8 December 2025 and HFCS to 5 December 2025: no reports; immunogenicity concern for injection; use reviewed: insomnia."

fda-pcac-2024-thymosin-alpha-1-briefing:
  type: regulator
  authors: "U.S. Food and Drug Administration"
  title: "FDA Briefing Document for Thymosin Alpha-1 Related Bulk Drug Substances (Thymosin alpha-1 (free base) and Thymosin alpha-1 acetate), Pharmacy Compounding Advisory Committee meeting, 4 December 2024"
  year: 2024
  url: https://www.fda.gov/media/183820/download
  accessed: 2026-10-22
  verified: url
  note: "Evaluation dated 15 November 2024, read in the relevant sections (pdftotext; re-read by the fact-checker 23 October 2026). N-terminally acetylated 28-amino-acid peptide (Ac-Ser-Asp-Ala-Ala-Val-Asp-Thr-Ser-Ser-Glu-Ile-Thr-Thr-Lys-Asp-Leu-Lys-Glu-Lys-Lys-Glu-Val-Val-Glu-Glu-Ala-Glu-Asn-OH), C129H215N33O55, 3108.3 g/mol, first isolated from calf thymus fraction 5 in 1977, made by solid-phase synthesis as thymalfasin; four US orphan designations; EMA orphan designation for hepatocellular carcinoma; according to SciClone's 2014 annual report approved in countries of the Asia-Pacific region, Latin America, Eastern Europe and the Middle East, mainly for hepatitis B and as a vaccine adjuvant ('FDA is unable to independently verify these claims of approval'); 'approved in Italy as an adjuvant to the influenza vaccine in immunocompromised subjects' (AIFA database, accessed June 2024), also India and Hong Kong (official databases cited), registered in Indonesia; Italian label: not in children, contraindicated in pregnancy and lactation, caution in atopic or allergic people, case-by-case in autoimmune disease, caution with other immunomodulators, occasional modest transient injection-site pain; Indonesian label: transient ALT flares, contraindicated in deliberately immunosuppressed patients such as transplant recipients; immunomodulatory action via TLRs on dendritic cells; a company book chapter reports over 4,400 trial subjects and over 17 million doses post-marketing; in most studies well tolerated, local injection-site reactions most common; insufficient evidence of effectiveness for hepatitis B and the other reviewed uses; not in AASLD, EASL or WHO hepatitis B guidelines or sepsis guidelines."

