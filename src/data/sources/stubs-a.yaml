# ---------------------------------------------------------------- Europe

ema-orphan-thymalfasin-eu-3-02-110:
  type: regulator
  authors: "European Medicines Agency"
  title: "EU/3/02/110 – orphan designation for treatment of hepatocellular carcinoma (thymalfasin)"
  year: 2003
  url: https://www.ema.europa.eu/en/medicines/human/orphan-designations/eu-3-02-110
  accessed: 2026-10-22
  verified: url
  note: "Orphan designation granted by the European Commission on 30 July 2002 to SciClone Pharmaceuticals Italy S.r.l. for thymalfasin in hepatocellular carcinoma. 'In the European Union thymalfasin is authorised in Italy, where it is used to enhance the immune response stimulated by the influenza virus vaccine.' That sentence comes from the designation summary (first published 8 January 2003), so it describes the situation then; that the Italian authorisation still stands rests on the FDA's 2024 briefing (AIFA database accessed June 2024) and on the AIFA check described in research/stubs-a.md. EMA's orphan-designation JSON (downloaded 22 October 2026, 3,310 records) lists the designation as positive, last updated 8 January 2003. An orphan designation is not a marketing authorisation. EMA's medicines JSON (2,754 records, 22 October 2026) has no record for thymalfasin, thymosin, MOTS-c, epitalon, Semax or Selank."

