# ---------------------------------------------------------------- Belgian law

be-law-2026-05-30-geneesmiddelen:
  type: law
  authors: "Belgische Staat"
  title: "Wet van 30 mei 2026 houdende diverse bepalingen inzake geneesmiddelen en gezondheidsproducten"
  container: "Belgisch Staatsblad, 4 juni 2026, p. 30299 (Justel, dossiernummer 2026-05-30/03)"
  year: 2026
  url: https://www.ejustice.just.fgov.be/cgi_loi/change_lg.pl?language=nl&la=N&cn=2026053003&table_name=wet
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "In force 14 June 2026 ('Inwerkingtreding : 14 juni 2026'; art. 61: arts. 2, 3, 4, 6, 3°, 10, 11, 18, 19, 40, 42, 43 and 46 enter into force on a date set by the King, at the latest 1 January 2030; Chapter 12 on 30 May 2026). The art. 6quater sentences cited here (art. 6, 1° and 2° of this law) are in force since 14 June 2026 (Justel note 11 on art. 6quater). Chapter 2 (arts. 2-11) amends the law of 25 March 1964 (arts. 2, 3, 6, 6quater, 12bis, 12ter, 12septies, 13, 15). It is the latest amendment Justel lists for the 1964 law ('Wet van 30-05-2026 gepubliceerd op 04-06-2026'). In art. 6quater § 1 it adds that the King may make the special-needs route (1°) subject to prior approval of the Minister, and the wholesale of pharmacist-imported medicines (4°) subject to prior authorisation. Cite only for 'the law as last amended on 30 May 2026'."

be-kb-1995-04-07-reclame:
  type: law
  authors: "Belgische Staat"
  title: "Koninklijk besluit van 7 april 1995 betreffende de voorlichting en de reclame inzake geneesmiddelen voor menselijk gebruik, artikelen 6 en 7 (publieksreclame)"
  container: "ejustice.just.fgov.be (Justel; tekstbijwerking tot 07-12-2023)"
  year: 1995
  url: https://www.ejustice.just.fgov.be/cgi_loi/change_lg.pl?language=nl&la=N&cn=1995040761&table_name=wet
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Published in the Belgisch Staatsblad of 12 May 1995. Art. 6: 'Publieksreclame mag worden gemaakt voor geneesmiddelen die qua samenstelling en doel zijn bedoeld en ontwikkeld om zonodig met het advies van de apotheker maar zonder diagnose, voorschrift of toezicht van een arts te worden gebruikt.' Art. 7 lists elements that make public advertising forbidden (e.g. suggesting the effect is assured or has no side effects, that normal good health is improved by the medicine, a recommendation by scientists, health professionals or famous people). The FAGG names this decree, the 1964 law and Directive 2001/83 as the basis of the advertising rules (fagg-reclame-geneesmiddelen)."

be-kb-1974-04-12-hormonale-stoffen:
  type: law
  authors: "Belgische Staat"
  title: "Koninklijk besluit van 12 april 1974 betreffende sommige verrichtingen in verband met stoffen met hormonale, antihormonale, anabole, beta-adrenergische, anti-infectieuze, antiparasitaire en anti-inflammatoire werking, artikelen 1 en 8"
  container: "ejustice.just.fgov.be (Justel; Belgisch Staatsblad 7 mei 1974; tekstbijwerking tot 23-12-2008)"
  year: 1974
  url: https://www.ejustice.just.fgov.be/cgi_loi/change_lg.pl?language=nl&la=N&cn=1974041230&table_name=wet
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Added by the fact-checker on 27 October 2026 (curl, HTTP 200, ISO-8859-1; 'Publicatie: 7 mei 1974', 'Inwerkingtreding : 1 augustus 1974'; title as amended by the KB of 12 August 2000). Art. 1 § 1: 'Een algemene vergunning is vereist voor de invoer, de uitvoer, de fabricage, het vervoer, de verkoop, het te koop aanbieden, het bezit, de aflevering, het verkrijgen tegen betaling of kosteloos van stoffen met hormonale, anti-hormonale, anabole, (beta-adrenergische,) anti-infectieuze, anti-parasitaire en anti-inflammatoire werking als dusdanig of vermengd.' Art. 1 § 2, 1°: the decree does not apply to 'het bezit van de in § 1 van dit artikel genoemde stoffen, indien zij in de vorm van geneesmiddelen, overeenkomstig de ter zake geldende reglementering, verkregen werden bij personen die gemachtigd zijn die geneesmiddelen af te leveren'; § 2, 3°: operations in a pharmacy by a pharmacist. Art. 7: veterinarians with a medicines depot (except import and export). Art. 8: 'Inbreuken op de bepalingen van dit besluit worden gestraft met de straffen bepaald in de wet van 24 februari 1921 betreffende het verhandelen van giftstoffen, slaapmiddelen en verdovende middelen, ontsmettingsstoffen en antiseptica, inzonderheid in artikel 2, 2°.' The decree has no list of substances (see fagg-hormonale-stoffen-vergunning). Cite for the licence-for-possession rule and its pharmacy exemption only; quote no penalty amounts; whether a given peptide is covered is not stated."

# ---------------------------------------------------------------- FAGG (Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten)

fagg-2026-glp1-misuse-warning:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "GLP-1-analogen en gecombineerde GIP/GLP-1-analogen: risico’s door verkeerd gebruik en gebruik buiten indicatie voor gewichtsverlies"
  year: 2026
  url: https://www.fagg-afmps.be/nl/news/glp_1_analogen_en_gecombineerde_gipglp_1_analogen_risicos_door_verkeerd_gebruik_en_gebruik
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "News of 19 October 2026 ('Laatste update op 19/10/2026'). Only Saxenda, Wegovy and Mounjaro have the weight-management indication in Belgium (BMI >= 30, or >= 27 with a weight-related comorbidity); the others (e.g. Ozempic) only type 2 diabetes; situation on 19-10-2026. These medicines are prescription-only and can only be supplied in a pharmacy: 'Online verkoop is in België dan ook niet toegestaan.' Advice: use only on medical advice and if prescribed for you; never collect leftover medicine from pens for an extra dose ('golden dosing'); 'Koop deze geneesmiddelen niet via internet of op de zwarte markt: het gaat vaak om namaak of om vervalste producten'. 'LET OP! Er worden al zogenaamde ‘drievoudige agonisten’, zoals retatrutide, op internet en op de zwarte markt aangeboden, terwijl die producten momenteel nog in onderzoek zijn.' Side effects: contact your doctor, nurse or pharmacist; if urgent, call the Antigifcentrum (070/245.245); report via the national system. Lists the GLP-1 products available in Belgium (Trulicity, Saxenda, Victoza, Xultophy, Wegovy, Ozempic, Rybelsus; GIP/GLP-1: Mounjaro). Also read on www.fagg.be (same page)."

fagg-2025-illegale-verkoop-actie:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Illegale verkoop van geneesmiddelen: gezamenlijke actie van FOD Economie en FAGG legt grootschalige oplichting bloot"
  year: 2025
  url: https://www.fagg-afmps.be/nl/news/illegale_verkoop_van_geneesmiddelen_gezamenlijke_actie_van_fod_economie_en_fagg_legt
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "News of 15 April 2025. A joint check by the Economic Inspection (FOD Economie) and the FAGG's Speciale Onderzoekseenheid (May 2024 to March 2025) of 55 targets, 46 of them websites; almost 45% sold priority-1 medicines (among them sleeping and psychotropic medicines, 'anabolen en hormonale middelen'); 25 illegal websites closed and 11 redirected to a warning page. Only licensed pharmacies may sell medicines online in Belgium; prescription medicines cannot be sold online. FAGG administrator-general: 'Wie deze illegale producten bestelt, pleegt ook een inbreuk op de wetgeving en kan zelfs een boete krijgen.' Names no seller."

fagg-postal-seizure-qa-nl:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Vragen en antwoorden over inbeslagname van postpakketten door de illegale invoer van geneesmiddelen of de invoer van niet-conforme medische hulpmiddelen"
  year: 2024
  url: https://www.fagg-afmps.be/nl/menselijk_gebruik/geneesmiddelen/geneesmiddelen/goed_gebruik_van_geneesmiddelen/vragen_en
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Dutch version of famhp-postal-seizure-qa ('Laatste update op 23/07/2024'), read live. First seizure: 'U krijgt geen boete' ... 'dan krijgt u mogelijk een waarschuwing en wordt uw dossier afgesloten zonder verder gevolg'. Second infringement after a warning: 'een minnelijke schikking ... die minimum 400 euro bedraagt'; exceptionally the file goes to the parket. This does not cover every product: 'De hierboven vermelde informatie is dus niet van toepassing op alle geneesmiddelen. Bepaalde geneesmiddelen worden anders behandeld, zoals speciaal gereglementeerde stoffen, verdovende en psychotrope middelen en antibiotica.' Narcotics, psychotropics 'en andere speciaal gereglementeerde stoffen' may never be posted to you. Antibiotics: 'strikt nultolerantiebeleid'. A product is a medicine if it 'een farmacologisch actieve substantie bevat' or 'wordt voorgesteld als een geneesmiddel'; sale elsewhere as a supplement or cosmetic 'is geen geldig argument'. Only medicines licensed in another country may be imported, always by your pharmacist, on a prescription with an artsenverklaring: 'U kunt dus nooit zelf geneesmiddelen invoeren'. Sending medicines from third countries (outside the EEA) to Belgium 'is nooit toegelaten'; within the EU only medicines authorised in a member state and lawfully obtained. Prescription medicines are handed over in person in a pharmacy only; non-prescription medicines may be sold online by pharmacies on websites notified to the FAGG and the Orde der Apothekers, whose list the FAGG publishes. The common European logo links to the competent authority's list (for Belgian sites, the FAGG page). The FAGG can only close '.be' websites. Objection to a seizure: registered letter within 14 calendar days."

fagg-melden-bijwerking-patient:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Melden van een bijwerking als patiënt"
  year: 2026
  url: https://www.fagg-afmps.be/nl/melden_van_een_bijwerking_als_patient
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatste update op 14/10/2026'. Online reporting with or without eID ('Aanmelden met uw elektronische identiteitskaart (eID) is aangeraden, maar niet verplicht'); a paper form, or one requested by e-mail, if the application does not work. You can report for yourself or for someone you know, or ask your doctor or pharmacist to report. Reports to make include side effects after misuse or wrong use and after off-label use. 'we uw melding anoniem behandelen en uw e-mailadres niet opnemen in de Europese databank. We geven uw e-mailadres ook niet door aan de firma'. Urgent question after a side effect: the Antigifcentrum, a doctor or pharmacist answers 24/7, '+ 32 70 245 245 is gratis voor oproepen vanuit België'. The forms themselves are on another host (famhp-vons.prd.pub.vascloud.be): link this page."

fagg-adverse-reaction-qa-nl:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Vragen en antwoorden over de melding van bijwerkingen"
  year: 2023
  url: https://www.fagg-afmps.be/nl/menselijk_gebruik/geneesmiddelen/geneesmiddelen/geneesmiddelen_bewaking/vragen_en_antwoorden_over
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Dutch version of famhp-adverse-reaction-qa ('Laatste update op 13/11/2023'). 'Iedereen die een bijwerking krijgt, kan die melden. Een familielid of naaste kan dat ook doen'. Mandatory (starred) fields on this Dutch page: the person who had the reaction, a description, the name of the suspected medicine; also asked: dose and frequency, the batch number if possible, dates, other medicines, other health problems and the course ('de evolutie', starred only in the English version). 'Je melding wordt enkel gebruikt voor de wetenschappelijke beoordeling van het geneesmiddel.' Misuse: 'Een misbruik of verkeerd gebruik van een geneesmiddel moet niet gemeld worden om de persoon in kwestie te kunnen sanctioneren maar wel om te voorkomen dat zo'n geval zich nog eens voordoet.' The page still points to www.eenbijwerkingmelden.be, which on 27 October 2026 ended on a 'Pagina niet gevonden' page: do not link that address."

fagg-2026-bijwerkingen-vragen-antwoorden:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Bijwerkingen van geneesmiddelen melden: vragen en antwoorden"
  year: 2026
  url: https://www.fagg-afmps.be/nl/bijwerkingen_van_geneesmiddelen_melden_vragen_en_antwoorden
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatste update op 02/10/2026'. Side effects also include those after wrong use ('verkeerd gebruik'), misuse and medication errors. 'In België is dat het Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG).' A team of FAGG experts analyses every report. 'Het FAGG stuurt alle gemelde bijwerkingen anoniem (dus zonder uw persoonsgegevens) door naar EudraVigilance'; pharmaceutical companies can consult the reports for their medicines there."

fagg-vergund-geneesmiddel-herkennen:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Hoe kan u een vergund geneesmiddel herkennen ?"
  year: 2021
  url: https://www.fagg-afmps.be/nl/public_information/medicament_autorise
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatste update op 21/05/2021'. In Belgium an authorised medicine is sold by a pharmacist ('als enige toegestaan om dit te doen') and has a VHB or registration number. The authorisation is granted either by the minister after advice of the committee at the FAGG, or by the European Commission after the CHMP at the EMA; numbers 'EU/1/xx/xxx/xxx (geneesmiddel vergund door de Europese Commissie)'. Pharmacy preparations (magistrale and officinale bereidingen) have a number given by the pharmacist; all raw materials 'moeten voldoen aan strenge kwaliteitscriteria'. Points to the FAGG medicines database (geneesmiddelendatabank.fagg-afmps.be)."

fagg-reclame-geneesmiddelen:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Reclame, voordelen en monsters"
  year: 2026
  url: https://www.fagg-afmps.be/nl/MENSELIJK_gebruik/geneesmiddelen/geneesmiddelen/goed_gebruik_geneesmiddel/reclame
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatste update op 21/10/2026'. The rules on advertising for medicines rest on Directive 2001/83/EC, the law of 25 March 1964 and the royal decree of 7 April 1995. 'Enkel voor geneesmiddelen die een in ons land geldige vergunning hebben voor het in de handel brengen, mag reclame worden gemaakt.' 'Alleen voor geneesmiddelen waarvoor geen voorschrift vereist is, kan er reclame worden gemaakt bij het publiek'; radio and TV advertising needs a prior visa, other media a notification at least 30 days before. A meldpunt (DG Inspectie) receives written information about breaches."

fagg-hormonale-stoffen-vergunning:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Vergunning"
  container: "FAGG, Speciaal gereglementeerde stoffen > Stoffen met hormonale werking en anderen"
  year: 2026
  url: https://www.fagg-afmps.be/nl/MENSELIJK_gebruik/bijzondere_producten/speciaal_gereglementeerde_stoffen/stoffen_hormonale_werking_anderen/vergunning
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatste update op 30/09/2026'. 'Art. 1§1 van het koninklijk besluit van 12.04.1974 bepaalt dat een vergunning is vereist voor de invoer, de uitvoer, de fabricage, het vervoer, de verkoop, het te koop aanbieden, het bezit, de aflevering, het verkrijgen tegen betaling of kosteloos, van stoffen met de volgende werking: hormonale, beta-adrenergische, antiparasitaire, antihormonale, anti-infectieuse, anti-inflammatoire, anabole.' The decree targets substances, pure or mixed, by their action; there is no list. Exemptions (art. 1 § 2 and 7) for pharmacists and for activities with medicines already allowed under other legislation. The licence is normally granted to a firm or institution established in Belgium; 'In het uitzonderlijk geval waar de aanvrager een natuurlijk persoon zou zijn' there is a form. 'Bij twijfel gelieve een e-mail te sturen met de naam van de stof en het CAS-nummer naar substances_HAA@fagg.be.' The page sits under 'Speciaal gereglementeerde stoffen' (see the URL). The royal decree itself: be-kb-1974-04-12-hormonale-stoffen (found on Justel by the fact-checker on 27 October 2026)."

fagg-schrijnende-gevallen-medische-noodprogrammas:
  type: regulator
  authors: "Federaal Agentschap voor Geneesmiddelen en Gezondheidsproducten (FAGG)"
  title: "Gebruik in schrijnende gevallen - medische noodprogramma's"
  year: 2026
  url: https://www.fagg-afmps.be/nl/MENSELIJK_gebruik/geneesmiddelen/geneesmiddelen/onderzoek_ontwikkeling/gebruik_in_schrijnende_gevallen_medische_noodprogrammas
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Dutch version of famhp-compassionate-use-medical-need ('Laatste update op 21/10/2026'). Programmes follow the royal decree of 25 April 2014 amending the royal decree of 14 December 2006 (Belgisch Staatsblad 12 June 2014, applicable from 1 July 2014); the company files the programme. This Dutch page (table 'Goedgekeurde programma's') and the English page of the same date both list the approved programmes: none of the 21 compounds on this site appears (checked by name on 27 October 2026, also by the fact-checker on the Dutch table; pasireotide is listed but is not on this site)."

# ---------------------------------------------------------------- Help services (Flanders and federal)

be-112-andere-noodnummers:
  type: web
  authors: "FOD Binnenlandse Zaken (112.be)"
  title: "Andere noodnummers"
  year: 2026
  url: https://112.be/nl/andere-noodnummers
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "112.be: 'sos112 is een initiatief van de Federale Overheidsdienst Binnenlandse Zaken'. Home page: 'Bel 112 voor ziekenwagen & brandweer in België', 'Bel 101 voor dringende politiehulp in België', 'Bel 1733 voor de dokter van wacht'. This page lists: ambulance and fire 112 (gratis, 24u/24); police 101; 1733 dokter van wacht ('Bel enkel naar 1733 voor medische problemen die niet kunnen wachten tot het spreekuur van je eigen dokter', zonal rate); Antigifcentrum 070 245 245 (gratis, 24u/24); Tele-onthaal 106; Zelfmoordlijn 1813 (gratis, 24u/24, anoniem). The number 100 is not listed."

be-fod-1733-dokter-van-wacht:
  type: web
  authors: "FOD Volksgezondheid, Veiligheid van de Voedselketen en Leefmilieu"
  title: "Dokter van wacht"
  year: 2026
  url: https://www.health.belgium.be/nl/themas/gezondheid/dringende-geneeskundige-hulpverlening/actoren-dringende-geneeskundige-hulpverlening/dokter-wacht
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatst bijgewerkt op 02/04/2026' (www.1733.be forwards here). Call 1733 when you need medical help outside your huisarts's hours (week nights, weekends, holidays) and the complaint is not life-threatening but cannot wait, or when you doubt whether to go to the emergency department. 'Het om een levensbedreigende situatie gaat. Bel dan 112.' 'In een groot deel van België kan je al 1733 bellen'; some regions still use the local wachtpost's own number; 'Op termijn zal 1733 overal in België beschikbaar zijn.' Zonal rate, no extra cost. The call can lead to the wachtpost, a home visit, advice to wait for your own doctor, or an ambulance."

be-antigifcentrum-wanneer-bellen:
  type: web
  authors: "Antigifcentrum"
  title: "Wanneer bel je het Antigifcentrum?"
  year: 2026
  url: https://www.antigifcentrum.be/wanneer-bellen/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Het Antigifcentrum geeft telefonisch advies bij een mogelijke vergiftiging of accidentele blootstelling aan een product of stof.' Look up the product on the website first; call 070 245 245 when the page says so or product, amount or circumstances are unclear; 'Bel onmiddellijk 112 bij een mogelijk levensbedreigende situatie, bijvoorbeeld bij ernstige ademhalingsproblemen, bewusteloosheid, stuipen of snelle ernstige achteruitgang.' Normal medicine use: the leaflet, your doctor or pharmacist; 'Bij een foutieve inname, overdosering of accidentele blootstelling kan je wel contact opnemen met het Antigifcentrum.' Non-urgent medical problems out of hours: 1733. General questions about drugs: De Druglijn."

be-antigifcentrum-over-ons:
