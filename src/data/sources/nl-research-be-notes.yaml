# ---------------------------------------------------------------- Sport (Flemish Community)

be-nado-vlaanderen-over:
  type: web
  authors: "NADO Vlaanderen"
  title: "Over NADO Vlaanderen"
  year: 2026
  url: https://www.dopingvrij.vlaanderen/over-nado/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'NADO Vlaanderen staat in voor de uitvoering van het antidopingbeleid in Vlaanderen.' Since 1 January 2016 administratively under the agency Sport Vlaanderen, with operational autonomy. 'Op nationaal vlak maakt NADO Vlaanderen deel uit van de Coördinatieraad. Daarin zitten we samen met de NADO's van de Franse Gemeenschap, de Duitstalige gemeenschap en de regio Brussel-Hoofdstad.' NADO Vlaanderen has signed the WADA Code. Its links page (dopingvrij.vlaanderen/links/) lists the NADO of the French Community (dopage.cfwb.be) and of the German-speaking Community (nado-ostbelgien.be) and the Gemeenschappelijke Gemeenschapscommissie. NADO Vlaanderen's current site; www.dopinglijn.be is its old site (news up to 2020)."

be-nado-vlaanderen-jaarverslag-2025:
  type: report
  authors: "NADO Vlaanderen"
  title: "Jaarverslag 2025"
  container: "NADO Vlaanderen, nieuws, 11 augustus 2026"
  year: 2026
  url: https://www.dopingvrij.vlaanderen/nieuws/2026/jaarverslag-2025/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Added by the fact-checker on 27 October 2026 (curl, HTTP 200). News item of 11 August 2026 summarising the 2025 annual report on the anti-doping policy of the Flemish Community: 1979 samples from competitive athletes, 19 positive (0,96%). 'De resultaten van controles in fitness-centra vallen buiten het reguliere programma dat onderworpen is aan het WADA. Van in totaal 13 gerichte monsternemingen bij krachtsporters in fitnesscentra, werden 3 afwijkende resultaten gerapporteerd.' 'Daarnaast werd ook één sporter vervolgd voor het weigeren van een dopingcontrole.' Related NADO Vlaanderen pages read the same day: FAQ (dopingvrij.vlaanderen/faq/): 'Volgens de Vlaamse dopingregels kan iedereen die in georganiseerd verband aan sport doet, op doping getest worden'; Dopingovertredingen (dopingvrij.vlaanderen/wat-mag-niet/dopingovertredingen/): 'Volgens de dopingregels wordt ook de aankoop van een verboden stof als bezit beschouwd'. Cite for: NADO Vlaanderen tests strength athletes in fitness centres. It does not say on which legal basis or whether every gym user is covered."

be-flemish-antidoping-decree-consolidated:
  type: law
  authors: "Vlaamse Gemeenschap"
  title: "Decreet betreffende de preventie en bestrijding van doping in de sport (citeeropschrift: \"het Antidopingdecreet van 25 mei 2012\"), geconsolideerde versie"
  container: "Vlaamse Codex (codex.vlaanderen.be), current version as served on 27 October 2026 (latest article versions in force 13 September 2021 and 1 January 2022)"
  year: 2012
  url: https://codex.vlaanderen.be/Zoeken/Document.aspx?DID=1021920&param=inhoud
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Read in the print version of the same document (PrintDocument.ashx?id=1021920). Art. 1: 'Dit decreet regelt een gemeenschapsaangelegenheid.' Art. 2, 55°: sportactiviteit is 'elke voorbereiding op of initiatief tot sportbeoefening met recreatieve, competitieve of demonstratieve doeleinden in georganiseerd verband'; 56°: sporter is 'elke persoon die een sportactiviteit beoefent, ongeacht het niveau'. Title 6/1 (inserted by the decree of 18 June 2021, in force 13 September 2021), art. 42/6 § 1: recreational athletes who are not members of an affiliated federation, or not competitive, 'dienen zich te allen tijde te onthouden' of use or possession of a substance or method prohibited at all times, of evading or refusing sample collection, and of tampering; § 2: no violation for a normal medical treatment that meets three criteria. Art. 42/7: NADO Vlaanderen may take samples from them. Art. 42/10: the disciplinary commission decides on exclusion from organised sport in the Dutch language area and may impose an administrative fine on an adult athlete of at most EUR 25,000; § 2: no sanction excludes individual sport 'voor louter recreatieve doeleinden' outside an organised setting. Art. 42/11 § 1: use or possession, from a reprimand to two years' exclusion; evading or refusing a test or tampering, six months to two years."

# ---------------------------------------------------------------- Reimbursement (federal)

riziv-2025-glp1-terugbetaling:
  type: regulator
  authors: "RIZIV"
  title: "Antidiabetica: een gewijzigde terugbetaling voor Ozempic en de andere GLP-1-analogen"
  year: 2025
  url: https://www.riziv.fgov.be/nl/pers/antidiabetica-een-gewijzigde-terugbetaling-voor-ozempic-en-de-andere-glp-1-analogen
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Press release of 9 September 2025 (still online; the FAGG news of 19 October 2026 links it). From 1 February 2026 a prior authorisation by the adviserend arts of the ziekenfonds is needed for reimbursement of Ozempic, Rybelsus, Trulicity, Victoza and Xultophy, also for patients in a zorgtraject diabetes; 'Mounjaro® wordt al terugbetaald op basis van een voorafgaande machtiging van het ziekenfonds'. The measure targets 'de onterechte terugbetaling van deze geneesmiddelen gebruikt als eetlustremmer door mensen die geen diabetes hebben'. Concerns type 2 diabetes only."

be-minister-2026-wegovy-geen-terugbetaling:
  type: regulator
  authors: "Frank Vandenbroucke, Minister van Sociale Zaken en Volksgezondheid"
  title: "Obesitas vraagt sterk beleid, geen terugbetaling van Wegovy"
  year: 2026
  url: https://vandenbroucke.belgium.be/nl/nieuws/obesitas-vraagt-sterk-beleid-geen-terugbetaling-van-wegovy
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Dated 3 June 2026 (read in the built-in browser; the site answers scripts with HTTP 403). The Commissie Tegemoetkoming Geneesmiddelen (CTG) of the RIZIV gave a negative advice on reimbursing Wegovy for obesity with lifestyle interventions; 'Minister van Sociale Zaken en Volksgezondheid Frank Vandenbroucke volgt dat advies.' Talks on a specialised care pathway (RIZIV, FOD Volksgezondheid, the cabinet, the Belgian Association for the Study of Obesity) are ongoing. No later change was found on 27 October 2026."

bcfi-2026-tirzepatide-pennen:
  type: guideline
  authors: "Belgisch Centrum voor Farmacotherapeutische Informatie (BCFI)"
  title: "Verkeerd gebruik van tirzepatide-pennen bij obesitas"
  container: "Folia Pharmacotherapeutica, mei 2026"
  year: 2026
  url: https://www.bcfi.be/nl/articles/4846?folia=4848
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "The FAGG received reports of wrong use of tirzepatide pens in obesity, including recovering leftover liquid as an 'extra' dose; one explanation is saving costs, '(tirzepatide wordt niet terugbetaald in de indicatie obesitas)'; the FAGG 'raadt deze praktijken uitdrukkelijk af' (dose accuracy, infection risk). The BCFI is a non-profit led by members of all universities, scientific associations and the FAGG, 'uitsluitend gefinancierd door overheidsmiddelen' (bcfi.be/nl/about, which now forwards to bcfi.be/nl/over-ons/onze-missie/: 'een vereniging zonder winstoogmerk opgericht in 1971'). The article also describes how pens are split: do not repeat those details on the site (CONTENT-GUIDE §1)."
