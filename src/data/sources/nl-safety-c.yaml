igj-gmp-inspecties-certificaten:
  type: regulator
  authors: "Inspectie Gezondheidszorg en Jeugd (IGJ)"
  title: "GMP-inspecties en GMP-certificaat"
  year: 2026
  url: https://www.igj.nl/zorgsectoren/geneesmiddelen/productie-gmp/toezicht-op-gmp/gmp-inspecties-en-certificaten
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Page metadata: issued 11 July 2025, modified 13 October 2026. 'De ‘Good Manufacturing Practice’ (GMP) is een kwaliteitsnorm voor het maken van geneesmiddelen.' 'De principes van GMP staan in de wet. De principes worden omschreven in Europese Richtlijn 2017/1572/EU en de Gedelegeerde Verordening (EU) 2017/1569. De Inspectie Gezondheidszorg en Jeugd (IGJ) voert periodiek inspecties uit bij alle fabrikanten van geneesmiddelen in Nederland. Dat doen we bij zowel geregistreerde als niet-geregistreerde geneesmiddelen (zoals geneesmiddelen voor onderzoek en geneesmiddelen zonder handelsvergunning).' The IGJ also checks, with the other EU member states, manufacturers outside Europe. Cited for: GMP is the quality standard for making medicines, set in EU law; the IGJ inspects every medicine manufacturer in the Netherlands periodically."

rva-over-ons:
  type: web
  authors: "Raad voor Accreditatie (RvA)"
  title: "Over de RvA"
  year: 2026
  url: https://www.rva.nl/over-ons/
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "Page modified 4 June 2026 (article:modified_time). 'Bijna ieder land binnen Europa heeft een nationale accreditatie-instantie. In Nederland is dat de RvA. Onze primaire taak bestaat uit het accrediteren en geaccrediteerd houden van conformiteitbeoordelende organisaties: laboratoria, inspectie-instellingen, certificatie-instellingen en verificatie-instellingen.' The RvA checks whether these organisations meet the European (EN) and international (ISO or ISO/IEC) standards: 'Accreditatie is dus een controle van de controle.' 'In 2010 heeft de Nederlandse overheid de RvA aangewezen als nationale accreditatie-instantie, op basis van de Europese Verordening 765/2008.' 'De RvA is een zelfstandig bestuursorgaan'. Cited for: in the Netherlands the RvA, designated by the government, is the body that accredits laboratories (the Dutch counterpart of the US NVLAP on the English page). The site links no register of accredited labs and names no lab."

thuisarts-moedervlek-niet-vertrouwen:
  type: web
  authors: "Nederlands Huisartsen Genootschap (NHG), Thuisarts.nl"
  title: "Ik heb een moedervlek die ik niet vertrouw"
  year: 2025
  url: https://www.thuisarts.nl/moedervlekken/ik-heb-moedervlek-die-ik-niet-vertrouw
  accessed: 2026-10-27
  lang: nl
  verified: url
  note: "'Laatst gewijzigd: 2 dec 2025'. In het kort: 'Bel je huisarts als 1 of meer van deze dingen voor je kloppen: ... Je moedervlek heeft meerdere kleuren. Je moedervlek is 6 millimeter of groter. Je moedervlek wordt groter of verandert van vorm of kleur. Je moedervlek jeukt of bloedt.' 'Heel soms is of wordt een moedervlek huidkanker.' Cited for: call your huisarts about a mole that grows, changes shape or colour, itches or bleeds (replaces the NHS moles page on the Dutch monitoring page)."
