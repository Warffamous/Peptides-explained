glp1-body-map:
  file: glp1-body-map.png
  kind: infographic-art
  origin: ai-generated
  license: CC-BY-4.0
  license_url: https://creativecommons.org/licenses/by/4.0/
  author: AI-generated with gpt-image-2.5-sunburst-2026-09-08 for Peptides Explained
  focal: 50% 40%
  sources: []
  ai:
    model: gpt-image-2.5-sunburst-2026-09-08
    prompt: "Front (anterior) view of an adult human head, neck and torso only, ending just below the hips, with the arms cut off at the shoulders, drawn as a soft, semi-transparent, gender-neutral body outline with no facial features, no nipples and no genitals. Inside it draw only three organs, anatomically correct in size, shape and position as seen from the front: (1) the brain inside the skull in true anterior view, showing the two frontal lobes with the temporal lobes at the sides; the cerebellum lies behind and is not visible; (2) the stomach, J-shaped, its rounded fundus tucked up under the left dome of the diaphragm behind the lower left ribs (the body's left is the viewer's right), the oesophagus entering it from above and the pylorus near the midline; (3) the pancreas, a slender lobulated gland lying across the spine at the level of the first lumbar vertebra, partly behind the lower edge of the stomach, its head on the body's right (viewer's left) cradled in the C-shaped curve of the duodenum and its tail reaching toward the body's left (viewer's right). Draw nothing else next to the stomach: no spleen, no liver, no membranes. Soft natural colours: brain pale pink-grey, stomach muted rose, pancreas pale yellow-ochre; only a very faint ribcage and spine. Centred composition with generous empty space around the brain, the stomach and the pancreas, on a plain very light warm-grey background."
    preamble: v1
    generated: 2026-10-20
    review: ok
    reviewed_by: editorial-board
    review_note: "Pre-check by the media build agent on 20 October 2026; the owner still has to check it. Generation 1 (discarded): no text-like marks, but the brain was drawn as if seen from behind (cerebellum visible below the hemispheres in a front view), an unexplained pink crescent sat beside the stomach fundus, and arms, hands and thighs were included. Generation 2 (this file, corrected prompt): no letters, numbers, labels, logos or text-like marks found when inspected at full size; brain in front view with frontal and temporal lobes; oesophagus enters a J-shaped stomach on the body's left; the duodenal C-loop holds the head of the pancreas on the body's right, tail toward the left. Simplifications to judge: the pancreas is drawn below and in front of the stomach rather than mostly behind it; the duodenum ends as a cut tube; the stomach sits slightly low under the ribs. No facial features, nipples or genitals. Second check by the integration/QA agent on 20 October 2026 (full image plus head, upper-abdomen and pelvis crops at 2x): no letters, digits, labels, logos, watermarks or text-like texture anywhere, including inside the gyri and the pancreatic lobules. Confirmed: anterior brain with frontal and temporal lobes, no cerebellum; oesophagus descends left of midline into the cardia; J-shaped stomach on the body's left with the pylorus right of midline; duodenal C-loop around the pancreatic head on the body's right; pancreatic body across the spine at about T12-L1 with the tail rising toward the left; the lower edge of the stomach overlaps the upper edge of the pancreas, so the depth order is right (the pancreas is not drawn in front of the stomach, as the first pre-check put it; it is drawn mostly below it). Further simplifications for the owner to judge: the gastric fundus barely rises above the cardia (it normally domes up under the left diaphragm); the diaphragm, liver and spleen are omitted by design; the duodenum stops as a cut tube before crossing the midline; much more of the pancreas shows below the stomach than in a real front view; the figure continues to the upper thighs (smooth groin, no genital detail) although the prompt asked to end at the hips; faint fibrous strands sit between the temporal lobes where the brainstem would be. None of these changes what the three markers point at. Marker positions checked against the art: 1 on the brain midline, 2 on the body of the stomach, 3 on the pancreatic head/neck. Approved by the site owner on 20 October 2026, with these simplifications accepted for a teaching drawing."
