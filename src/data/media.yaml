ated, pale yellow-ochre gland lying across the spine at the level of the first and second lumbar vertebrae, mostly BEHIND the stomach: its head sits inside the C-loop of the duodenum on the body's right (viewer's left), clearly visible below the pylorus; its neck and body pass behind the lower part of the stomach, seen faintly through it; its tail reaches toward the body's left (viewer's right). Nothing else: no diaphragm, no membranes, no liver, no spleen, no gallbladder, no intestines, no kidneys, no heart, no lungs, no blood vessels, no muscles. Soft natural colours: brain pale pink-grey, oesophagus, stomach and duodenum muted rose, pancreas pale yellow-ochre; body outline and skeleton a very faint warm grey. Portrait composition, the head near the top with a small margin; generous clear space around the brain, the stomach and the head of the pancreas so that a numbered marker can sit on each. Plain, uniform very light warm-grey background, no cast shadow, no vignette, no frame."
