    - ada-2026-hypoglycaemia # symptoms (shakiness, sweating, confusion); glucose for the conscious person; emergency help if the person cannot take carbohydrate
  steps:
    - levels: [human] # glucose-dependent action; little hypoglycaemia on its own (Mounjaro SmPC 4.8, 5.1; Ozempic SmPC 5.1)
    - levels: [human] # insulin, and sulfonylurea-driven insulin release, act regardless of glucose (Sola 2015)
    - levels: [human] # increased risk of hypoglycaemia in combination (SmPC 4.4, 4.8)
    - levels: [human] # the prescriber may reduce the insulin or sulfonylurea dose (SmPC 4.2, 4.4): advice to prescribers, no amounts
