  review:
    status: pending
    note: "Medicine-neutral copy of insulin-glp1-hypo (2026-10-21) for pages about the GLP-1 class. The drawing is the same component (src/components/explainers/glp1-class-hypo.astro renders insulin-glp1-hypo.astro with this explainer's words), so the charts, marks and timing are identical and already reader-tested. Changed: the words only. The panels and captions say 'a GLP-1-type medicine'; semaglutide and tirzepatide are named once, as examples, in the title and summary (in step 1 they pushed reading ease below 60). Dose advice is addressed to the prescriber and names whose dose: 'the prescriber may lower the insulin or tablet dose'. Step 5 says 'call your local emergency number' (never a number, CONTENT-GUIDE section 1). Checked against the Mounjaro and Ozempic EU product information PDFs (fetched 2026-10-21): SmPC 4.2 dose-reduction wording ('may be considered' / 'should be considered'), 4.4, 4.8 frequencies, 5.1 glucose-dependent insulin secretion and glucagon lowering. Integrator reader test, 21 October 2026 (still pending for the medical reviewer): final still and a still 2.5 s into every scene, light and dark, 360 and 1280 px, on the placed page; keyboard Play/Pause/Continue/Replay, reduced motion, no JavaScript and pseudo-RTL checked; no layout shift, no overflow at 360 px, overlay words 14 px or more. The five scene messages are those of insulin-glp1-hypo, with 'a GLP-1-type medicine' in place of semaglutide; the longer panel titles wrap to two lines and still share a row. Placed on safety/before-you-consider (replacing insulin-glp1-hypo) and in a 'Low blood sugar, with a short animation' fold on compounds/tirzepatide, as on the semaglutide page."

bpc-157-proposed-chain:
  duration: 30 # six scenes of 5 s
  mirror: false # a schematic whose words sit beside their drawings: kept LTR
  pages: [compounds/bpc-157]
  sources:
    - fda-pcac-2026-bpc157-briefing # molecular targets 'have not been identified'
    - zhang-2026-fbxo22 # the one proposed partner (FBXO22), one laboratory, cells, not repeated
    - hsieh-2017-vegfr2 # VEGFR2 up and activated in human endothelial cells (Chang Gung, Taiwan); more vessels in ischaemic rat muscle
    - hsieh-2020-src-cav1-enos # nitric-oxide pathway in rat aorta, same laboratory
    - yildirim-2026-mammary-artery # pieces of human internal mammary artery in an organ bath relaxed, mostly through the lining and nitric oxide (Ankara)
    - chang-2011-tendon-fibroblasts # rat tendon fibroblasts: FAK and paxillin, migration, survival under oxidative stress; no faster proliferation
    - brcic-2009-angiogenesis # more vessels in healing rat muscle and tendon (Zagreb)
    - staresinic-2003-achilles # faster healing of the cut rat Achilles tendon (Zagreb)
    - bicer-2026-achilles # the one independent tendon test: load to failure not significantly better (n = 4 per group per test)
    - poolton-2026-human-sr # human evidence: no controlled trial published in full
  steps:
    - levels: [hypothesis] # no target established; FBXO22 proposed by one laboratory in cells
    - levels: [in-vitro] # VEGFR2 / nitric-oxide signals in vessel cells and artery pieces, in a dish
    - levels: [in-vitro] # tendon cells migrate and survive stress, do not divide faster
    - levels: [animal] # more small vessels in injured rat tissue
    - levels: [animal] # faster healing in rats; the independent test found no significant strength gain
    - levels: [hypothesis] # in people: not shown
  review:
    status: pending
    note: "Drawn 2026-10-21 (builder B) from the writer's outline for the mechanism section and the page's own proposed chain (Compare table and 'Step by step'), with the sources the page cites for each step. Two panels (side by side on a wide screen, stacked on a phone, so the drawing and its caption fit one screen): 'The unknown start, then cells in a dish' (steps 1-3) and 'Then rats, and people' (steps 4-6). Each panel is a ladder with the drawings on the left and every word on the right; the line into each rung carries that step's evidence level, and the left panel's last line runs on into the right panel's first. The chain ends in a broken amber line before the person ('Not shown in people'). Checked on a scratch page 2026-10-21: light and dark at 360 and 1280 px, pseudo-RTL (stays LTR), a still 2.5 s into every scene (one strong part each, its word visible) and the final still. The '?' is an overlay word on an empty, dashed receptor outline (no text in the SVG). For the reviewer: the steps are drawn one after another, as the proposed chain is described; the vessel and tendon findings come from different cell types and laboratories, and no study measured the early steps and healing in the same animals (the page's 'three weak links'). Carried by the captions only: 'mostly in one lab' (2), 'did not divide faster' (3), 'mostly one Zagreb group' (4). Integrator reader test, 21 October 2026 (still pending for the medical reviewer): final still and a still 2.5 s into every scene, light and dark, 360 and 1280 px, on the placed page; keyboard Play/Pause/Continue/Replay, reduced motion, no JavaScript and pseudo-RTL checked; no layout shift, no overflow at 360 px, overlay words 14 px or more. Per scene: 1 'BPC-157's receptor is unknown'; 2 'in a dish, vessel cells: more VEGFR2, nitric oxide'; 3 'tendon cells move more, survive stress'; 4 'injured rat tissue: more small vessels'; 5 'rat tendon healed faster; another lab: no clear strength gain'; 6 'not shown in people'. No change needed. At 360 px the stacked drawing (about 660 px) plus caption is close to a phone screen's height; the engine scrolls it into view on Play. Placed as the mechanism figure of compounds/bpc-157; the Compare table of the same chain moved into a fold (it keeps the labs, the human artery result and the collagen measure)."

angiogenesis-double-edge:
  duration: 25 # five scenes of 5 s
  mirror: false # two side-by-side tissue pictures, not a time axis
  pages: [compounds/bpc-157, compounds/tb-500]
  sources:
    - hsieh-2017-vegfr2 # BPC-157: VEGFR2 signalling up in human endothelial cells; more vessel growth in ischaemic rat muscle
    - freeman-2011-atp-synthase # thymosin beta-4: human endothelial cells migrate more (ATP synthase, P2X4 signalling)
    - brcic-2009-angiogenesis # BPC-157: more vessels in healing rat muscle and tendon
    - malinda-1999-wound-healing # thymosin beta-4: rat wounds closed faster, with more new vessels
    - staresinic-2003-achilles # BPC-157: cut rat Achilles tendon healed faster (Zagreb)
    - hanahan-2011-hallmarks # inducing angiogenesis is a hallmark of cancer
    - carmeliet-2011-angiogenesis # tumours recruit vessels through VEGF / VEGFR2; blocking it slows some cancers
    - fda-pcac-2026-bpc157-briefing # no carcinogenicity studies of BPC-157
    - fda-pcac-2026-tb500-briefing # no carcinogenicity study of TB-500; no human data
  steps:
    - levels: [in-vitro, animal] # signals in cells (Hsieh 2017, Freeman 2011) and rats (Hsieh 2017)
    - levels: [animal] # new vessels in injured rat tissue (Brcic 2009, Hsieh 2017, Malinda 1999)
    - levels: [animal] # faster healing in those rat models (Staresinic 2003, Malinda 1999)
    - levels: [human] # tumour angiogenesis: established cancer biology (Hanahan 2011, Carmeliet 2011)
    - levels: [hypothesis] # whether these peptides could feed a hidden tumour in people: untested (FDA 2026 briefings)
  review:
    status: pending
    note: "Drawn 2026-10-21 (builder B) for the risk sections of BPC-157 and TB-500, from the pages' own 'Why an effect on cancer is theorised' reasoning and its sources. Two panels with one motif (a blood vessel below, small vessels sprouting up into the tissue): left 'A wound, in rats' (signals, sprouts, the wound fills in), right 'A hidden tumour' (a tumour also calls in vessels and grows; the peptide and its signals beside it, ringed in amber: never tested). It never says the peptides cause cancer: the peptide's part in the right panel is drawn and worded as an untested question. For the reviewer: for TB-500 the cell and rat vessel findings come from the whole protein, thymosin beta-4, not from TB-500 itself (the TB-500 page says so); the captions name 'the protein TB-500 comes from'. The tumour panel's established biology (step 4) is drawn without a line of its own; the level badge carries it. Checked on a scratch page 2026-10-21: light and dark at 360 and 1280 px, pseudo-RTL (stays LTR), a still 2.5 s into every scene and the final still. Integrator reader test, 21 October 2026 (still pending for the medical reviewer): final still and a still 2.5 s into every scene, light and dark, 360 and 1280 px, on the placed page; keyboard Play/Pause/Continue/Replay, reduced motion, no JavaScript and pseudo-RTL checked; no layout shift, no overflow at 360 px, overlay words 14 px or more. Per scene: 1 'the peptide raises growth signals'; 2 'new small vessels grow'; 3 'the wound heals faster'; 4 'a tumour needs new vessels too'; 5 'could the peptide feed it? never tested in people'. Fixed: step 1 read as a garden-path sentence ('the protein TB-500 comes from raised signals'); now 'In cells and rats, BPC-157 raised signals for new vessels. So did thymosin beta-4, which TB-500 comes from.' (18 words, reading ease 66). Placed at the top of the 'Why an effect on cancer is theorised' fold on compounds/bpc-157 and compounds/tb-500."

kpv-pept1-nfkb:
  duration: 30 # six scenes of 5 s
  mirror: false # a schematic cell whose words sit beside their parts: kept LTR
  pages: [compounds/kpv]
  sources:
    - cody-1984-c-terminal-tripeptide # Lys-Pro-Val is the C-terminal tripeptide (residues 11-13) of alpha-MSH
    - fda-pcac-2026-kpv-briefing # no studies of KPV in humans; target unknown; NF-kappaB and PepT1 proposed
    - dalmasso-2008-pept1 # PepT1 carries KPV into gut epithelial and T cells; NF-kappaB down; oral KPV reduced mouse colitis (Merlin group)
    - mandrika-2001-nfkb-no # macrophages: NF-kappaB kept out of the nucleus, less nitric oxide (independent group)
    - land-2012-bronchial # airway cells: KPV blocks nuclear import of p65; fewer inflammatory signals
    - kannengiesser-2008-colitis # mouse colitis: less damage, faster recovery (Münster group)
    - viennois-2016-cac # PepT1-knockout mice: KPV no longer clearly reduced colitis-associated tumours (Merlin group)
  steps:
    - levels: [in-vitro] # KPV = alpha-MSH 11-13, studied in cells (Cody 1984; FDA 2026)
    - levels: [in-vitro, animal] # PepT1 uptake in cells; PepT1 rises in inflamed gut (Dalmasso 2008)
    - levels: [in-vitro] # NF-kappaB kept out of the nucleus (Mandrika 2001, Land 2012, Dalmasso 2008)
    - levels: [in-vitro] # fewer inflammatory signals (Mandrika 2001, Land 2012, Dalmasso 2008)
    - levels: [animal] # mouse colitis recovered faster; without PepT1, no clear tumour reduction (Kannengiesser 2008, Dalmasso 2008, Viennois 2016)
    - levels: [hypothesis] # in people: never tested (FDA 2026)
  review:
    status: pending
    note: "Drawn 2026-10-21 (builder B) from the writer's outline for the mechanism section and the page's own chain, worded as the page reads after its fact-check: in mice without PepT1, KPV 'no longer clearly' reduced bowel tumours (a non-significant trend remained), so KPV acts at least in part through PepT1. Two panels (side by side on a wide screen, stacked on a phone): 'KPV, and what it does in cells in a dish' shows the hormone alpha-MSH as 13 beads with the last three (KPV) coloured, then a schematic cell with the PepT1 doorway in its surface (more doorways appear for 'inflamed gut'), the NF-kappaB switch held outside the nucleus by a stop bar, and four inflammation signals of which three fade (fewer); 'Then mice, and people' shows a mouse and, behind a broken amber line, a person. Checked on a scratch page 2026-10-21: light and dark at 360 and 1280 px, pseudo-RTL (stays LTR), a still 2.5 s into every scene and the final still. For the reviewer: the cell is drawn as one generic gut-lining or immune cell; the NF-kappaB findings come from several cell types (gut, T cells, macrophages, airway cells). The PepT1-knockout result is carried by the caption only. Integrator reader test, 21 October 2026 (still pending for the medical reviewer): final still and a still 2.5 s into every scene, light and dark, 360 and 1280 px, on the placed page; keyboard Play/Pause/Continue/Replay, reduced motion, no JavaScript and pseudo-RTL checked; no layout shift, no overflow at 360 px, overlay words 14 px or more. Per scene: 1 'KPV is the last three links of the hormone alpha-MSH'; 2 'PepT1 doorways carry it into the cell; more of them in an inflamed gut'; 3 'NF-kB is kept out of the nucleus'; 4 'fewer inflammation signals' (one strong dot and three faded ones: readable, but subtle); 5 'mice with an inflamed gut recovered faster'; 6 'never tested in people'. For the reviewer: step 2's second level is 'animal', but PepT1's rise in inflamed human colon comes from human biopsies (Viennois 2016 abstract), so it is drawn conservatively. Placed as the mechanism figure of compounds/kpv; the Compare table moved into a fold (it keeps the melanocortin-1 binding result and the rabbit cornea study)."

contamination-infection:
  duration: 25 # five scenes of 5 s
  mirror: false # a skin cross-section: anatomy never mirrors
  # Picture under the overlay: text-free AI art of healthy skin, fat and muscle (no needle, no germs, no wound).
  art: contamination-infection-art
  art_dark: contamination-infection-art-dark
  pages: [safety/sterile-technique, safety/injection-safety]
  sources:
    - who-2010-injection-toolkit # wipe the vial's rubber top, never touch it again; a new sterile needle every time; contaminated equipment carries infection
    - cdc-2024-preventing-unsafe-injection # contaminated vials and reused needles: outbreaks of bacterial infections; preservatives do not fully protect
    - cdc-2024-safe-injection-practices # aseptic technique; sterile single-use needles and syringes
    - smith-2013-fungal-methylprednisolone # germs already inside unopened vials (summary: "or the liquid")
    - nhs-skin-abscess # abscess: a painful lump of pus, usually from bacteria entering the skin
    - nhs-cellulitis # cellulitis: hot, swollen, spreading redness; untreated it can spread to the blood
    - medlineplus-lymphangitis # red streaks along the lymph vessels from the infected area; bacteria can reach the blood
    - nhs-sepsis # skin infections can lead to sepsis; emergency signs (fast breathing, confusion, blotchy skin)
  steps:
    - levels: [human] # germs on the skin and on the vial's rubber top (WHO 2010; CDC 2024)
    - levels: [human] # the needle carries them under the skin (WHO 2010; CDC 2024)
    - levels: [human] # abscess or cellulitis (NHS skin abscess; NHS cellulitis)
    - levels: [human] # spread along a lymph vessel, seen as red lines (MedlinePlus lymphangitis)
    - levels: [human] # germs in the blood: sepsis; warning signs, get help now (NHS sepsis; NHS cellulitis)
  review:
    status: pending
    note: "Drawn 2026-10-21 (builder A) from the 'How germs get under the skin' diagram of safety/sterile-technique and the 'What is normal, and what is not' table of safety/injection-safety, with their sources. Picture: text-free AI art of healthy skin (contamination-infection-art, light, and -dark; both ai.review pending): skin surface, dermis, the fat layer under the skin with one lymph vessel and one blood vessel, muscle below. The overlay draws everything that happens: germs (small dots) on the skin and on a vial's rubber top (an abstract grey block, no vial body, no label); the needle only as its path (a line, never a needle in skin); germs multiplying in the fat layer, walled off by a ring (abscess) under a band of spreading redness (cellulitis); germs gliding along the lymph vessel with red lines drawn on the skin above it; germs gliding in the blood vessel, 'Germs in the blood: sepsis' and 'Get help now'. The alert colour is used only for the warning icon of 'Get help now' (stop-now content); the redness and the red lines are drawn in the coral residue hue (they show what the skin looks like). The valves of the lymph vessel in the picture point to the viewer's left, so germs travel to the left along it, and in the blood vessel too. For the reviewer: the abscess is drawn in the fat layer under the needle tip; a real abscess may also form higher in the skin. Germs reach the blood both through the lymph and directly from the infected tissue; the drawing shows the direct route (a short line from the abscess to the blood vessel). Integrator reader test, 21 October 2026 (still pending for the medical reviewer): final still and a still 2.5 s into every scene, light and dark, 360 and 1280 px, on the placed page; keyboard Play/Pause/Continue/Replay, reduced motion, no JavaScript and pseudo-RTL checked; no layout shift, no overflow at 360 px, overlay words 14 px or more. Per scene the reader takes: 1 'germs sit on the vial top and on the skin'; 2 'the needle carries them into the fat'; 3 'they grow: a pocket of pus, and redness spreads'; 4 'they travel along a lymph vessel; red lines show on the skin'; 5 'in the blood they cause sepsis: get help now'. The final still tells the whole chain. Fixed: in dark the 'Redness spreads' ellipse nearly vanished on the pink skin and the pus was a dark hole (now a halo, a stronger fill and pale pus); 'Fat layer' and 'Lymph vessel' almost touched at 360 px (moved apart). Placed on safety/sterile-technique (main flow; the earlier contamination-to-infection list moved into a fold, because it names hands, tables, liquid, heat, swelling and 'can kill', which the step list does not) and safety/injection-safety (in a fold, since that section already has its table)."

