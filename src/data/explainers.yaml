# Animated explainers: the locale-independent half. See docs/EXPLAINERS.md.
# Captions live in src/i18n/<locale>/explainers.json; artwork in src/components/explainers/<id>.astro.
# levels: evidence for the link(s) drawn in that step — human (solid), animal / in-vitro (long dashes),
# hypothesis (short dashes). pictogram: design C only, a name from src/components/ui/pictograms.ts.

glp1-action:
  duration: 15 # five scenes of 3 s (reader test 2026-10-20: at 2.4 s a scene's word and its 17–19-word caption came too late and went too fast)
  mirror: false # anatomy: never mirrored
  # Picture under the overlay (text-free AI art, src/data/media.yaml); the dark scheme shows art_dark.
  art: glp1-action-art
  art_dark: glp1-action-art-dark
  pages: [compounds/semaglutide]
  sources:
    - ema-epar-ozempic # SmPC 5.1 mechanism (glucose-dependent insulin, glucagon, early gastric emptying); 5.2 albumin >99%, half-life ~1 week
    - ema-epar-wegovy # SmPC 4.5: no clinically relevant gastric-emptying effect at 2.4 mg, probably tolerance
    - kapitza-2017-beta-cell # insulin up, glucagon down in people with type 2 diabetes
    - gabery-2020-semaglutide-brain # brain sites: rodents
    - friedrichsen-2021-appetite # less hunger, lower energy intake: people
  steps:
    - levels: [human] # albumin binding and ~1 week half-life measured in people (SmPC 5.2)
      pictogram: body-cardiovascular
    - levels: [human] # glucose-dependent insulin secretion (SmPC 5.1; Kapitza 2017)
      pictogram: body-endocrine
    - levels: [human] # lower glucagon when glucose is high (SmPC 5.1; Kapitza 2017)
      pictogram: body-endocrine
    - levels: [human] # minor early postprandial delay; fades (tolerance) at 2.4 mg
      pictogram: body-gastrointestinal
    - levels: [animal, human] # brain sites from rodents (Gabery 2020); eating less measured in people (Friedrichsen 2021)
      pictogram: body-nervous
  review:
    status: pending
    note: "Artwork and captions drafted 2026-10-20 from the Ozempic and Wegovy EU product information (fetched 2026-10-20) and the three cited trials/studies. Needs a medical reviewer to check the anatomy and the evidence levels. 2026-10-20: words added beside the inset, insulin, glucagon and the plate (clarity rule 8a); arrows replaced by those words; drawing unchanged otherwise. 2026-10-20 (owner's decision): the hand-drawn line art is replaced by a text-free AI picture (glp1-action-art, light, and glp1-action-art-dark, dark; both ai.review pending) with the animation as an overlay: molecules glide along the vessel, a ring and a veil put one organ forward per scene, and every mark has its word. Changed on the drawing: the zoomed albumin inset and the step pins are gone (the label and the large step caption carry them); the unlabelled glucose squares are gone; the stomach and the hunger ring got words ('May empty more slowly', 'Hunger areas'); the hunger ring is dashed like its link (animal evidence). For the reviewer: the brain is a side view, and the ring marks the base of the brain and the brainstem only roughly (the hypothalamus and area postrema lie deep inside); the organs are separate specimens, not in their body positions. Reader test 2026-10-20 (independent reviewer, A light and dark, 360 and 1280 px, a still taken at two moments in every scene): the final still reads as 'semaglutide in the blood reaches the pancreas (more insulin, less glucagon), the stomach (may empty more slowly) and the brain's hunger areas (smaller meals)', which matches the still caption. Three scenes failed mid-scene and were fixed in the overlay timing only (no change to words, levels or sources): the word came 1.2-1.8 s after its scene began, so 'More insulin', 'Less glucagon' and 'Smaller meals' were missing for most of their scene ('Smaller meals' only reached full strength after the run had ended); three unlabelled glucagon diamonds were visible during the insulin scene; and 2.4 s per scene was too short for a 17-19-word caption. Now 3 s per scene (duration 15), each word arrives in the first second with its ring or line, and the glucagon marks appear only in their own scene. Per scene the reader now takes: 1 'the medicine rides in the blood on albumin'; 2 'in the pancreas: more insulin'; 3 'less glucagon from the pancreas'; 4 'the stomach may empty more slowly'; 5 'brain hunger areas lead to smaller meals'. Carried by the caption only, not by the drawing: 'keeps working for days' (1), 'mainly when blood sugar is high' (2, 3) and 'this small effect seems to fade' (4). Reader re-test 21 October 2026 (the independent reviewer again; A light and dark at 360 and 1280 px, B and C at 360 and 1280 px for scenes 2 and 3; stills at rest and 0.6 s and 2.6 s into every scene): the final still and the five scene messages above hold. Precision: each scene's word starts in its first second and is fully visible 1.2-2 s into the scene ('Smaller meals' at 2 s). Fixed in the overlay only (no change to words, levels or sources): at 360 px, where the words are larger on the canvas, the middle glucagon mark sat under 'Less glucagon' and an insulin mark touched 'More insulin'; the three glucagon marks now stand in one column between the line and the words, the insulin marks moved 4 units left, and 'Smaller meals' is centred 6 units left of the plate so C's bold words stay inside the drawing at 360 px. Open for the owner: a scene lasts 3 s but its large caption has 17-19 words, which most adults read in 4-5 s and a slow reader in 7 s or more. The drawing and its word carry each scene and the reader can pause, but either the 15-second cap (src/schemas/explainers.ts) goes up to about 25 s or the live caption becomes a short scene title."

insulin-glp1-hypo:
  duration: 15 # five scenes of 3 s: one message each
  mirror: true # glucose-over-time charts: the time axis may run right-to-left in RTL
  pages: [compounds/semaglutide]
  sources:
    - ema-epar-ozempic # SmPC 4.2 (with a sulfonylurea or insulin "a reduction in the dose … should be considered"), 4.4, 4.8 (no severe hypoglycaemia on monotherapy), 5.1 (glucose-dependent); package leaflet warning signs
    - sola-2015-sulfonylureas # sulfonylurea insulin release is independent of glucose levels
    - ada-2026-hypoglycaemia # glucose for the conscious person; call emergency services if unalert or unable to take carbohydrate; symptoms
  steps:
    - levels: [human] # glucose-dependent action, no severe hypoglycaemia on monotherapy (SmPC 5.1, 4.8)
      pictogram: body-endocrine
    - levels: [human] # insulin, and sulfonylurea-driven insulin release, act regardless of glucose (Sola 2015)
      pictogram: risk-interaction
    - levels: [human] # increased risk of hypoglycaemia in combination (SmPC 4.4, 4.8)
      pictogram: callout-warning
    - levels: [human] # dose reduction should be considered (SmPC 4.2, 4.4; package leaflet)
      pictogram: status-investigational
    - levels: [human] # signs (package leaflet; ADA), glucose if conscious, emergency services if not (ADA 2026, section 6)
      pictogram: action-urgent
  review:
    status: pending
    note: "Redrawn 2026-10-20 as two labelled charts (semaglutide alone / with insulin or a sulfonylurea), one message per scene. Interaction and dose advice from Ozempic SmPC 4.2/4.4/4.8 (advice to prescribers, no amounts; re-read 2026-10-20); warning signs from the Ozempic package leaflet and ADA; treatment and when to call emergency services from ADA Standards of Care 2026, section 6. First-reader test 2026-10-20: the dose labels now name the medicine (\"Usual / Smaller insulin or tablet dose\") so they cannot be read as a semaglutide dose change (SmPC 4.2: reduce the sulfonylurea or insulin dose)."
