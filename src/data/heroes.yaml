# Page heroes: route key (no locale, no slashes at the ends; "" = landing page) -> media id from
# src/data/media.yaml. Rendered by DocLayout directly under the page header, before the summary.
# Pages without an entry show no hero. Locale-independent: alt text and captions are translated
# in src/i18n/<locale>/media.json. See docs/MEDIA-GUIDE.md §4.
# Every compound page needs one (content guide §5: title and badge -> page photo -> At a glance).
# An image used as a page's hero should not also appear in that page's body.
# Landing page: insulin crystals under a microscope (NASA, public domain). A peptide medicine as a
# physical substance, with no product, vial, pen or needle in view.
"": insulin-crystals
compounds/semaglutide: gila-monster
compounds/kpv: lab-mouse
# TB-500: a fragment of thymosin beta-4, the protein that holds single actin units inside cells.
compounds/tb-500: fibroblast-actin
# BPC-157: most of its research comes from one group in Zagreb (see history/the-croatian-lab).
compounds/bpc-157: zagreb-medical-school
history/the-croatian-lab: zagreb-medical-school
# Tirzepatide: built on GIP, a hormone released by cells in the lining of the upper small intestine.
compounds/tirzepatide: duodenum-villi
# Retatrutide: also switches on the glucagon receptor; glucagon is made by cells in the pancreatic islets.
compounds/retatrutide: human-pancreatic-islet
# Safety (group safety-a): clean hands, an ambulance (112), a doctor's stethoscope, bacteria on lab dishes,
# a skin bacterium under the microscope, and a sharps container. No needles, vials or skin punctures.
safety: cdc-hand-washing
safety/warning-signs: ambulance-den-haag
safety/before-you-consider: stethoscope-grey
safety/sterile-technique: bacillus-cereus-plates
safety/injection-safety: staph-aureus-usda-sem
safety/sharps-disposal: sharps-bin-yellow
# Safety (group safety-b): a mass spectrometer at the FDA (the kind of test that shows what is really in a
# sample), a blood sample in a lab analyser (monitoring), and the entrance of a Dutch huisartsenpost (where
# to go when something goes wrong). No needles, vials or products.
safety/product-risk: mass-spectrometer-fda
safety/monitoring: blood-sample-analyser
safety/if-something-goes-wrong: huisartsenpost-oss
# Entry pages (group guides): a signpost at a crossroads (a decision point), a closed consulting-room door
# (the conversation with a doctor), and amino-acid crystals (the building blocks of every compound listed).
start-here: signpost-crossroads
talking-to-your-doctor: consulting-room-door
compounds: amino-acid-crystals
# Legal pages (group legal-a): law books on a library shelf (the section), the Ridderzaal in The Hague (Dutch
# law), the Belgian federal parliament (Belgian law), the EMA building in Amsterdam (EU law), a lab plate being
# filled with a multichannel pipette (what "research use" really means) and a pharmacy mortar (legal routes,
# including pharmacy preparation). No products, vials, needles or people.
legal: law-library-shelf
legal/nl: ridderzaal-binnenhof
legal/be: belgian-federal-parliament
legal/eu: ema-building-amsterdam
legal/research-use-only: lab-96-well-plate
legal-routes: pharmacy-mortar
# Legal pages (group legal-b): the Reichstag in Berlin (German law), the Palace of Westminster (UK law), an FDA
# laboratory building at White Oak (US law), the start lanes of an athletics track (sport and doping) and national
# flags in front of the European Parliament in Strasbourg (what's changing: rules still being decided).
# No products, vials, needles or identifiable people.
legal/de: reichstag-berlin-west
legal/uk: palace-of-westminster-dusk
legal/us: fda-white-oak-building
legal/sport-and-doping: athletics-track-lanes
legal/whats-changing: flags-european-parliament-strasbourg
# Basics (group basics): a computer model of a protein (the section), a ball-and-stick molecule model (what a
# peptide is), cells under a fluorescence microscope (signalling happens in cells), an hourglass (half-life) and
# the stomach lining under a microscope (why peptides are not swallowed). No products, vials, needles or people.
basics: protein-model-csiro
basics/what-is-a-peptide: ball-and-stick-model
basics/how-signalling-works: endothelial-cells-fluorescent
basics/pharmacokinetics: wooden-hourglass
basics/why-not-a-pill: gastric-mucosa-he
# History (group history): Banting and Best in about 1924 (the section: the story starts with insulin), an FDA
# laboratory in the 1960s testing for impurities (the timeline: from discovery to checked medicines), and President
# Kennedy signing the 1962 drug amendments (how we got here). All public domain; identifiable people are historical
# public figures or an unnamed FDA scientist at work, never a patient context. No products, vials or needles.
history: banting-best-1924
history/timeline: fda-lab-1960s
history/how-we-got-here: kennedy-1962-drug-amendments
# About pages and the reform opinion (group about): the reading room of the US National Library of Medicine (where
# the site's sources live), an old book with a magnifying glass (checking claims), an empty two-pan balance (no one
# on either scale: funding and independence), a 1793 errata page (corrections), and the empty debating chamber of
# the Dutch House of Representatives (reform: rules are changed by lawmakers). The reform page shows Frances Kelsey
# of the FDA with President Kennedy in 1962 in its body (<Photo id="kelsey-kennedy-1962" />, the precautionary case),
# not as its hero, because history/how-we-got-here already uses a photo of the same 1962 signing as its hero.
about: nlm-main-reading-room
about/editorial-policy: book-and-magnifier
about/funding: pharmacy-balance
about/corrections: errata-1793
the-case-for-reform: tweede-kamer-plenary-hall
# Evidence (group evidence): a wooden ladder (the evidence ladder), a coin toss (chance in small studies), a hooded
# laboratory rat (the translation gap), three rulers with different scales (four grades, never one score) and a
# drawn handshake (who paid). No products, vials, needles or identifiable people.
evidence: wooden-ladder
evidence/how-to-read-a-study: coin-toss
evidence/the-translation-gap: hooded-lab-rat
evidence/evidence-grading: three-measuring-scales
evidence/conflicts-of-interest: handshake-drawing
