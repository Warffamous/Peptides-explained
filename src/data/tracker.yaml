# The regulatory tracker rendered by <ChangeTracker /> on /legal/whats-changing/ (schema: trackerItemSchema in
# src/schemas/index.ts). Words in src/i18n/<locale>/tracker.json, keyed by id.
#
# Written by group legal-b on 22 October 2026; every item was checked against its sources on that day.
# English refocus (group legal-en-b, 24 October 2026): the US items re-checked against the Federal Register search of
# 23 October 2026 (re-run on 24 October: no new relevant document); new UK, CA and AU items from the fact-checked
# research (research/refocus/feeds-help-extras.md section 4), each source re-read on 23 or 24 October 2026
# (research/refocus-notes/legal-en-b.md). The EU, DE and NL items stay in the data with their jurisdiction tags: English
# hides them; their text stays in src/i18n/en/tracker.json because a published locale needs text for every item.
# `updated` is the date of the last verified development in the item (not the date we checked: that is
# 23 or 24 October 2026, and the page says so). `next_milestone` only where an official source gives a
# date. `compounds` lists only compounds that have a page on this site; other substances are named in the text.
# Statements reported in the press but not published by the regulator are not tracked until an official
# document appears (research/legal-b.md, "Tracker").
# A locale shows the items of its own jurisdictions and WADA (config/locales.json). A national body's source on a
# WADA item goes in `local_sources` under its jurisdiction, so it is shown only where that jurisdiction is; the
# words that cite it belong in that locale's text (24 October 2026, research/for-nl-site/MANIFEST-data.md).

