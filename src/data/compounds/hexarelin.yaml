# Hexarelin (INN examorelin): locale-independent facts. Every value below is sourced; see research/stubs-b.md.
slug: hexarelin
tier: 2
status: stub
# experimental: studied in people in the 1990s and early 2000s, mostly by university groups; no product was
# ever authorised (EMA, CBG and openFDA searched 23 October 2026); no registered trial on ClinicalTrials.gov.
category: experimental
class: gh-axis
body_systems: [endocrine, cardiovascular]
names:
  common: Hexarelin
  full: "His-D-2-methyl-Trp-Ala-Trp-D-Phe-Lys-NH2"
  inn: examorelin
  other: [EP-23905, MF-6003]
  brands: []
identifiers:
  pubchem_cid: 6918297
  chembl: CHEMBL108335
  cas: 140703-51-1
  unii: 09QF37C617
molecular:
  formula: C47H58N12O6
  mass_da: 887.0
  smiles: "CC1=C(C2=CC=CC=C2N1)C[C@H](C(=O)N[C@@H](C)C(=O)N[C@@H](CC3=CNC4=CC=CC=C43)C(=O)N[C@H](CC5=CC=CC=C5)C(=O)N[C@@H](CCCCN)C(=O)N)NC(=O)[C@H](CC6=CN=CN6)N"
  smiles_source: pubchem-hexarelin
# Position 2 is 2-methyl-D-tryptophan. The residue vocabulary (src/schemas/vocab.ts) has no code for it, so it is
# entered as D-Trp with the methyl group described in a modification (flagged in research/stubs-b.md).
sequence:
  display: "His-D-2-Me-Trp-Ala-Trp-D-Phe-Lys-NH2"
  residues: [His, D-Trp, Ala, Trp, D-Phe, Lys]
  n_terminus: H
  c_terminus: NH2
  modifications:
    - { position: 2, label: "2-methyl-D-tryptophan: a mirror-image tryptophan with an extra methyl group on its ring" }
    - { position: 5, label: "D-Phe: the mirror-image form of phenylalanine" }
  bridges: []
  source: pubchem-hexarelin
evidence:
  # Small studies in patients: short children treated for up to 8 months (8), healthy elderly people for 16
  # weeks (12), single doses in heart-failure patients (13). No large trial.
  human_clinical: phase-2
  # 279 non-review records; 137 mention rats, mice, dogs or pigs.
  preclinical_volume: extensive
  # Turin and partners about 40% of records (111 of 279); Milan 41 and Montreal 16 more, so the three groups about 60%.
  independence: few-groups
  # Short, small studies; no systematic long-term safety data.
  safety: partial
