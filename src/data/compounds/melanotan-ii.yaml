# Melanotan II — locale-independent facts. Every value below is sourced; see research/melanotan-ii.md.
slug: melanotan-ii
tier: 1
status: complete
# experimental, not investigational: the University of Arizona trials ended in 2000 and development moved
# to its free-acid form, bremelanotide (PT-141), now Vyleesi in the US. The one registered trial
# (NCT07437560, vitiligo, China, 'recruiting') describes itself as an 'example' record and shares sponsor,
# site and dates with a BPC-157 record; it is not treated as a development programme. Revisit if it
# reports or a regulator receives an application.
category: experimental
class: melanocortin
body_systems: [skin, sexual, nervous, cardiovascular]
names:
  common: Melanotan II
  full: "Melanotan II (Ac-[Nle4, Asp5, D-Phe7, Lys10]-cyclo-alpha-MSH(4-10)-NH2, a cyclic lactam analogue of alpha-MSH)"
  other: [MT-II, MTII, MT2, Melanotan-2]
  brands: []
identifiers:
  pubchem_cid: 92432
  chembl: CHEMBL430239
  cas: 121062-08-6
  unii: UPF5CJ93X7
molecular:
  formula: C50H69N15O9
  mass_da: 1024.2
  smiles: "CCCC[C@@H](C(=O)N[C@H]1CC(=O)NCCCC[C@H](NC(=O)[C@@H](NC(=O)[C@@H](NC(=O)[C@H](NC(=O)[C@@H](NC1=O)CC2=CN=CN2)CC3=CC=CC=C3)CCCN=C(N)N)CC4=CNC5=CC=CC=C54)C(=O)N)NC(=O)C"
  smiles_source: pubchem-melanotan-ii
# Sequence: PubChem synonym 'Ac-Nle-Cyclo[Asp-His-D-Phe-Arg-Trp-Lys]-NH2' and 'L-lysinamide, N-acetyl-L-norleucyl-
# L-alpha-aspartyl-L-histidyl-D-phenylalanyl-L-arginyl-L-tryptophyl-, cyclic (2-7)-peptide'; ChEMBL HELM
# PEPTIDE1{[ac].[Nle].D.H.[dF].R.W.K.[am]} with a side-chain bond between Asp and Lys; Dorr 1996 and Wessells 2003
# give the same structure. The ring is a lactam between the side chains of Asp (2) and Lys (7). Bremelanotide
# (PT-141) has the same SMILES with a free acid instead of the C-terminal amide (pt-141.yaml).
sequence:
  display: "Ac-Nle-cyclo[Asp-His-D-Phe-Arg-Trp-Lys]-NH2"
  residues: [Nle, Asp, His, D-Phe, Arg, Trp, Lys]
  n_terminus: Ac
  c_terminus: NH2
  modifications:
    - { position: 1, label: "Nle (norleucine), a straight-chain building block not used in human proteins, carries an acetyl group at the start of the chain" }
    - { position: 4, label: "D-Phe: the mirror-image form of phenylalanine" }
  bridges:
    - { from: 2, to: 7, kind: lactam }
  source: pubchem-melanotan-ii
evidence:
  human_clinical: phase-2
  preclinical_volume: extensive
  independence: broadly-replicated
  safety: partial
