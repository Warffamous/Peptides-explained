  # (ARTG) or approved for supply in Australia' (May and August 2026).
  - jurisdiction: AU
    status: not-authorised
    as_of: 2026-10-23
    sources: [au-tga-2026-08-melanotan-ii-safety-alert, au-tga-2026-05-melanotan-ii-infringement-notices, au-artg-search-status-c-2026-10-23]
