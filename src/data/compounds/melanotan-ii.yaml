    schedule: { code: "S4", note: "Prescription only medicine from 1 June 2018 (not in Appendix D).", sources: [au-poisons-standard-2026-10, au-poisons-standard-2018-06, au-poisons-standard-2018-03, au-tga-2018-02-melanotan-ii-interim-decision, au-tga-2018-04-scheduling-final-decisions] }
  # Not named on the 2026 or 2027 Prohibited List (PDFs searched for melanotan, melanocortin, bremelanotide and
  # afamelanotide on 22 October 2026). S0 covers any pharmacological substance not addressed elsewhere on the List
  # 'with no current approval by any governmental regulatory health authority for human therapeutic use'; melanotan II
  # has none. WADA and UKAD state that not every prohibited experimental peptide is named. Same reading as KPV and
  # retatrutide. No WADA or national anti-doping statement naming melanotan II was verified (Sport Integrity
