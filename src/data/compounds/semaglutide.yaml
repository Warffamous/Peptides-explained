sequence:
  display: "His-Aib-Glu-Gly-Thr-Phe-Thr-Ser-Asp-Val-Ser-Ser-Tyr-Leu-Glu-Gly-Gln-Ala-Ala-Lys*-Glu-Phe-Ile-Ala-Trp-Leu-Val-Arg-Gly-Arg-Gly (*side chain on Lys)"
