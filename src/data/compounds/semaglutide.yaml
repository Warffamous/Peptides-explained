# Sequence: 31 residues. `position` below is the 1-based index into `residues` (what the
# sequence figure needs). Each label also gives the position in the GLP-1(7–37) numbering used
# by the FDA label, Lau et al. 2015 and the literature (index + 6 = GLP-1 position).
sequence:
  display: "His-Aib-Glu-Gly-Thr-Phe-Thr-Ser-Asp-Val-Ser-Ser-Tyr-Leu-Glu-Gly-Gln-Ala-Ala-Lys*-Glu-Phe-Ile-Ala-Trp-Leu-Val-Arg-Gly-Arg-Gly (*side chain on Lys)"
  residues: [His, Aib, Glu, Gly, Thr, Phe, Thr, Ser, Asp, Val, Ser, Ser, Tyr, Leu, Glu, Gly, Gln, Ala, Ala, Lys, Glu, Phe, Ile, Ala, Trp, Leu, Val, Arg, Gly, Arg, Gly]
  n_terminus: H
  c_terminus: OH
  modifications:
    - { position: 2, label: "Aib (GLP-1 position 8): replaces Ala of human GLP-1; stabilises the peptide against DPP-4 cleavage" }
    - { position: 20, label: "Lys (GLP-1 position 26): ε-amine carries 2×OEG (8-amino-3,6-dioxaoctanoyl) – γGlu – 17-carboxyheptadecanoyl (C18 fatty diacid); drives albumin binding" }
    - { position: 28, label: "Arg (GLP-1 position 34): replaces Lys of human GLP-1 so only one lysine is left for the fatty-acid side chain" }
  bridges: []
  source: pubchem-semaglutide
evidence:
