# TB-500 / thymosin beta-4: locale-independent facts. Every value is sourced; see research/tb-500.md.
#
# WHICH MOLECULE THIS FILE DESCRIBES. "TB-500" is a common name, not a nonproprietary name. The FDA's
# 2026 review, the doping-control literature and PubChem define it as the N-acetylated 7-residue
# fragment Ac-LKKTETQ (residues 17–23 of thymosin beta-4). The sequence, identifiers and evidence grades
# below describe that fragment. Full-length thymosin beta-4 (43 residues; INN timbetasin; trial codes
# RGN-259, RGN-137, RGN-352; recombinant NL005) is a different molecule. Its human trials are listed as
# structured studies because TB-500 is usually marketed on them, but they do not lift the fragment's
# grades. Products sold as "TB-500" may contain either molecule or something else.
slug: tb-500
tier: 1
status: complete
# experimental, not investigational: the fragment has never been in formal clinical development.
# The only registry record that names it (NCT07487363) calls itself "fictional". Full-length Tβ4 is
# investigational (SEER-2, NCT05555589; NL005, NCT07586865) but is not what this slug's sequence is.
category: experimental
class: tissue-repair
body_systems: [musculoskeletal, skin, cardiovascular]
