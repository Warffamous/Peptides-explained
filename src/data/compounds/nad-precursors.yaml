# NAD+ precursors (nicotinamide riboside, nicotinamide mononucleotide, NAD+ itself): locale-independent facts.
# Not peptides: no amino acids, no peptide bonds. On this site because they are sold and promoted alongside
# peptides (for example nominated for US pharmacy compounding next to GHK-Cu; offered in IV "longevity" drips).
# Every value below is sourced; see research/stubs-b.md.
slug: nad-precursors
tier: 2
status: stub
category: not-a-peptide
class: non-peptide
body_systems: [metabolic, cellular, nervous]
names:
  common: NAD+ precursors
  full: "Nicotinamide riboside (NR), nicotinamide mononucleotide (NMN) and NAD+ (nicotinamide adenine dinucleotide)"
  other: [NR, NMN, NAD+, NAD, nicotinamide riboside chloride, beta-NMN, nadide]
  brands: []
# Three different molecules; identifiers and formulas are given per molecule in the page text and in the
# source pubchem-nad (CID 5892 NAD+, 439924 NR, 14180 NMN).
identifiers: {}
molecular: {}
sequence: null
evidence:
  # NOPARK (JAMA, October 2026): randomised, placebo-controlled phase 3, 410 people with early Parkinson
  # disease, oral NR for 52 weeks - no benefit, slightly worse than placebo. Highest published human evidence.
  human_clinical: phase-3
  preclinical_volume: extensive
  # Many independent academic groups in Europe, the US and Asia; some trials use product supplied by makers.
  independence: broadly-replicated
  # Oral NR and NMN: short trials (weeks to one year) and EFSA safety assessments; IV NAD+: tiny studies.
  safety: partial
regulatory:
  # Status as a MEDICINE (the vocabulary's sense). As food: NR chloride is an authorised novel food in the EU
  # (Implementing Regulation 2020/16); NMN is not on the Union list (consolidated 10 August 2026) despite a
  # positive EFSA opinion (May 2026).
  - { jurisdiction: EU, status: not-authorised, as_of: 2026-10-23, sources: [ema-medicines-json, eu-regulation-2020-16-nr, efsa-2026-nmn-novel-food, eu-union-list-novel-foods-2026-08-10] }
  - { jurisdiction: NL, status: not-authorised, as_of: 2026-10-23, sources: [cbg-geneesmiddeleninformatiebank, nl-gmw-art-40-handelsvergunning] }
  # Not an FDA-approved drug. NMN: not excluded from the dietary-supplement definition (FDA, 29 September 2025);
  # NR chloride: GRAS notice 635 for food use (cited through the neutral GRAS inventory search, because the GRN 635
  # record names the notifier company: seller rule, compounds-e 26 October 2026); NAD+: 503A category 1 (pharmacy
  # compounding tolerated under the interim policy while FDA evaluates).
  - { jurisdiction: US, status: not-authorised, as_of: 2026-10-23, sources: [openfda-drugsfda-search-stubs-b-2026-10-23, fda-2025-nmn-petition-response, fda-gras-inventory-search-2026-10-23, fda-503a-categories-2026-05] }
  # UK, CA, AU: merged from research/refocus/status/nad-precursors.yaml (fact-checked 24 October 2026), in the same
  # sense as the US and EU rows: not authorised as a MEDICINE in the drug sense (lead's decision, 24 October 2026).
  # Canada: no NR, NMN or NAD+ product has a DIN; oral NR can hold a natural health product licence and an NMN
  # monograph exists (NHP licences are not drug authorisations); injected or infused products cannot be natural health
  # products. The CA row's DPD search of 23 October 2026 was confirmed in Health Canada's DPD data extract on
  # 24 October 2026; the LNHPD (natural health product licences) and NOC could not be re-checked (re-check before publishing). Australia: no registered (AUST R) medicine; oral NR and NMN are permitted ingredients of listed (AUST L)
  # medicines, which the TGA does not evaluate before listing; NAD+ is not a permitted ingredient. UK: no medicine
  # licence; NR chloride is an authorised novel food in Great Britain, NMN and NAD+ are not.
  - { jurisdiction: UK, status: not-authorised, as_of: 2026-10-23, sources: [mhra-products-search-status-d-2026-10-23, uk-fsa-gb-novel-96-nr-chloride, uk-fsa-novel-food-register-search-status-d-2026-10-23] }
  - { jurisdiction: CA, status: not-authorised, as_of: 2026-10-23, sources: [ca-dpd-search-canada-legal-2026-10-23, ca-dpd-extract-search-merge-2026-10-24, ca-nhpid-nmn-monograph, ca-nhpr-schedule-2, ca-hc-recalls-search-status-d-2026-10-23] }
  - { jurisdiction: AU, status: not-authorised, as_of: 2026-10-23, sources: [au-artg-search-status-d-2026-10-23, au-permissible-ingredients-determination-2026-3, au-tga-2025-04-nad-nmn-safety-alert, au-tga-2026-08-nad-nmn-representations-guidance] }
