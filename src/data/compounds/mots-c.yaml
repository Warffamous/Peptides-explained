# experimental, not investigational: no published study has given MOTS-c itself to people. A company
# analogue (CB4211) went through one phase 1a/1b study (2018–2021) whose results were only released by
# the company, and that company dissolved in 2023. One phase 2a trial of MOTS-c itself is recruiting in
# China (NCT07505745). Same logic as BPC-157: revisit if that trial reports.
