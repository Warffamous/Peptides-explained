# GHK-Cu: locale-independent facts. Every value below is sourced; see research/stubs-b.md.
slug: ghk-cu
tier: 2
status: stub
# experimental: no medicine containing GHK-Cu is authorised by EMA, the CBG or the FDA (searched 23 October
# 2026). It is a permitted cosmetic ingredient in the EU (CosIng: COPPER TRIPEPTIDE-1), which is a different
# legal category: an injected product cannot be a cosmetic (Regulation 1223/2009, art. 2(2)). A GHK-Cu wound
# gel was cleared in the US in 1996 as a medical device (510(k) K953853), not approved as a drug.
category: experimental
class: dermal
body_systems: [skin]
names:
  common: GHK-Cu
  full: Glycyl-L-histidyl-L-lysine copper(II) complex
  other: [copper peptide, copper tripeptide-1, prezatide copper, GHK copper]
  brands: []
identifiers:
  pubchem_cid: 71587328
  cas: 89030-95-5
  unii: 6BJQ43T1I9
# PubChem gives the 1:1 copper complex as C14H23CuN6O4+ (402.92 g/mol). The site's formula renderer accepts
# only neutral formulas, so formula, mass and SMILES are left out here and given in the page text instead.
molecular: {}
sequence:
  display: "Gly-His-Lys · Cu(II)"
  residues: [Gly, His, Lys]
  n_terminus: H
  c_terminus: OH
  modifications:
    - { position: 2, label: "The histidine helps hold one copper(II) ion" }
  bridges: []
  source: pubchem-ghk-cu
evidence:
  # Small controlled trials of creams and gels on skin and ulcers (Mulder 1994, Bishop 1992, Miller 2006).
  # No published study of injected GHK-Cu in people.
  human_clinical: phase-2
  # 171 non-review PubMed records on GHK-Cu; 64 mention animals; well over 50 primary cell and animal studies.
  preclinical_volume: extensive
  # Pickart (discoverer) and Maquart (Reims) are authors on 6 records each; the rest come from many groups.
  independence: broadly-replicated
  safety: uncharacterised
regulatory:
  - { jurisdiction: EU, status: not-authorised, as_of: 2026-10-23, sources: [ema-medicines-json, ema-medicines-search, cosing-copper-tripeptide-1, eu-regulation-1223-2009-cosmetics] }
  - { jurisdiction: NL, status: not-authorised, as_of: 2026-10-23, sources: [cbg-geneesmiddeleninformatiebank, nl-gmw-art-40-handelsvergunning] }
  - { jurisdiction: US, status: not-authorised, as_of: 2026-10-23, sources: [openfda-drugsfda-search-stubs-b-2026-10-23, fda-503a-categories-2026-05, fda-category-2-safety-risks, fda-pcac-2027-early-announcement] }
  # UK, CA, AU: merged from research/refocus/status/ghk-cu.yaml (fact-checked 24 October 2026). Status as a MEDICINE;
  # copper tripeptide-1 as a cosmetic ingredient is a different legal category (described on the page). The UK row
  # cites the cosmetics regulation because UK law excludes injected products from being cosmetics. No AU schedule
  # field: GHK-Cu is not named in the Poisons Standard, and whether the 'COPPER COMPOUNDS' entries cover it is a
  # legal-review question (research/refocus-notes/merge.md).
  - { jurisdiction: UK, status: not-authorised, as_of: 2026-10-23, sources: [uk-mhra-substance-index-status-c-2026-10-23, uk-hmr-2012-reg-46, uk-hmr-2012-reg-2, uk-cosmetic-products-reg-gb-art-2, uk-cosmetic-products-reg-gb-annexes] }
  - { jurisdiction: CA, status: not-authorised, as_of: 2026-10-23, sources: [ca-dpd-search-status-c-2026-10-23, ca-noc-search-status-c-2026-10-23, ca-hc-2026-04-think-twice-peptides, ca-hc-recalls-database] }
  - { jurisdiction: AU, status: not-authorised, as_of: 2026-10-23, sources: [au-artg-search-status-c-2026-10-23, au-tga-2026-04-peptide-responsibilities, au-tga-2026-06-cmo-peptide-statement] }
  # unclear (CONTENT-GUIDE §5.1): not named on the 2026 or 2027 List. S0 bans substances with no current approval by
  # any government health authority for human therapeutic use, and the 2027 explanatory note says unnamed peptides
  # may fall under S0, S2 or S4. No medicine approval was found, but a GHK-Cu wound gel was cleared as a medical
  # device in the US (1996) and GHK-Cu is a permitted cosmetic ingredient; no anti-doping body has ruled.
  # (Fact-checker, 23 October 2026: was 'not-authorised', which the guide forbids as a stand-in.)
  - { jurisdiction: WADA, status: unclear, as_of: 2026-10-23, sources: [wada-2026-list-en, wada-2027-list-en, wada-2027-list-explanatory-note, fda-510k-k953853-iamin] }
