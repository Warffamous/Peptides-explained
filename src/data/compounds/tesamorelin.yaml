# Sequence: the 44 amino acids of human GHRH(1-44)-NH2 (Guillemin et al. 1982), unchanged; the only
# modification is a trans-3-hexenoyl group on the N-terminal tyrosine (US label section 11; Ferdinandi 2007).
# Checked three ways on 22 October 2026: the Guillemin abstract, the ChEMBL biotherapeutic sequence (stored
# C- to N-terminus, reversed here) and the PubChem SMILES (hexenoyl start, Leu-NH2 end).
sequence:
  display: "(trans-3-hexenoyl)-Tyr-Ala-Asp-Ala-Ile-Phe-Thr-Asn-Ser-Tyr-Arg-Lys-Val-Leu-Gly-Gln-Leu-Ser-Ala-Arg-Lys-Leu-Leu-Gln-Asp-Ile-Met-Ser-Arg-Gln-Gln-Gly-Glu-Ser-Asn-Gln-Glu-Arg-Gly-Ala-Arg-Ala-Arg-Leu-NH2"
  residues: [Tyr, Ala, Asp, Ala, Ile, Phe, Thr, Asn, Ser, Tyr, Arg, Lys, Val, Leu, Gly, Gln, Leu, Ser, Ala, Arg, Lys, Leu, Leu, Gln, Asp, Ile, Met, Ser, Arg, Gln, Gln, Gly, Glu, Ser, Asn, Gln, Glu, Arg, Gly, Ala, Arg, Ala, Arg, Leu]
  n_terminus: Hexenoyl
  c_terminus: NH2
  modifications:
    - { position: 1, label: "Tyr1 carries a trans-3-hexenoyl group (a six-carbon chain with one double bond); it slows breakdown by the enzyme DPP-4. The 44 amino acids are otherwise those of human GHRH" }
  bridges: []
  source: guillemin-1982-ghrh-tumour
evidence:
  human_clinical: authorised
  preclinical_volume: minimal
  independence: few-groups
  safety: partial
