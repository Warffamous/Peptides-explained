# Structured studies. "originating" = the developer, Theratechnologies (sponsor of the phase 3 programme and
# the diabetes trial, and author of the non-clinical work). The Massachusetts General Hospital (MGH) studies
# were NIH-funded and investigator-led, but their senior author was senior author of the phase 3 reports and
# has been a consultant to (and, per the 2019 paper, a scientific advisory board member of) the developer, and
# every MGH trial got its drug from the developer (donated, or at reduced cost in 2019; the 2012 obesity trial
# also had partial funding from it), so they are marked "mixed" (research/tesamorelin.md, fact-check log).
