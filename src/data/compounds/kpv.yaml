# KPV — locale-independent facts. Every value below is sourced; see research/kpv.md.
slug: kpv
tier: 1
status: complete
# experimental, not investigational: there is no registered clinical trial of KPV and no human
# exposure data of any kind (FDA found none). All evidence is in cells and animals. Revisit if a
# trial is registered or a regulator receives an application.
category: experimental
class: immunomodulatory
body_systems: [immune, gastrointestinal, skin]
names:
  common: KPV
  full: Lysine-Proline-Valine
  other: [Lys-Pro-Val, "alpha-MSH(11-13)", "α-MSH(11-13)", "ACTH(11-13)", H-Lys-Pro-Val-OH]
  brands: []
identifiers:
  pubchem_cid: 125672
  cas: 67727-97-3             # same CAS cited for free base and acetate in most public references
  unii: 7V6LGD8S5R            # free base; FDA GSRS record created 11 Aug 2026 (after the May 2026 FDA briefing, which recorded no UNII)
molecular:
  formula: C16H30N4O4         # free base; the acetate salt is C16H30N4O4·CH3COOH, 402.5 g/mol
  mass_da: 342.43
  smiles: "CC(C)[C@@H](C(=O)O)NC(=O)[C@@H]1CCCN1C(=O)[C@H](CCCCN)N"
  smiles_source: kpv-pubchem
# KPV is the C-terminal tripeptide (residues 11-13) of alpha-MSH, whose sequence is
# Ac-Ser-Tyr-Ser-Met-Glu-His-Phe-Arg-Trp-Gly-Lys-Pro-Val-NH2 (positions 1-13). The free-base KPV
# that the FDA assessed and that PubChem CID 125672 describes is the free acid, H-Lys-Pro-Val-OH.
# In the native hormone the valine is C-terminally amidated; many studies use Ac-KPV-NH2 instead.
sequence:
  display: "Lys-Pro-Val"
  residues: [Lys, Pro, Val]
  n_terminus: H
  c_terminus: OH
  modifications: []
  bridges: []
  source: kpv-pubchem
evidence:
  human_clinical: none
  preclinical_volume: moderate
  independence: few-groups
  safety: uncharacterised
