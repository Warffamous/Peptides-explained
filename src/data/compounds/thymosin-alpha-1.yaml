# Thymosin alpha-1 (thymalfasin) — locale-independent facts. Every value is sourced; see research/stubs-a.md.
slug: thymosin-alpha-1
tier: 2
status: stub
# investigational, with an explanation (research/stubs-a.md, contract issues). It IS authorised in some
# countries: nationally in Italy (Zadaxin, since 1996: EMA orphan page, FDA 2024 briefing; AIFA's own
# database checked 22 October 2026 but aifa.gov.it is not on the allowlist) and in countries in Asia,
# Latin America, Eastern Europe and the Middle East (FDA 2024 briefing). It is not authorised centrally
# in the EU, or in the Netherlands, the UK or the US. 'authorised' would put an EU-approval tile on a
# page read in the Netherlands, and 'authorised-elsewhere' needs an official label from an allowlisted
# regulator in the EU, US or UK, which does not exist. Many trials are still running (19 active or
# recruiting on ClinicalTrials.gov, 22 October 2026), so 'investigational' is the closest category.
category: investigational
class: immunomodulatory
body_systems: [immune]
