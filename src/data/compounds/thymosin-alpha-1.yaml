regulatory:
  # 'authorised' because thymalfasin is authorised in one EU member state (Italy); the note says it is
  # national, with no EU-wide authorisation and none in the Netherlands. Not "Italy only": the maker
  # reports approvals in "Eastern Europe", which the FDA could not verify, so other EU states are
  # possible but unchecked (fact-check 23 Oct 2026).
  - { jurisdiction: EU, status: authorised, as_of: 2026-10-22, sources: [ema-orphan-thymalfasin-eu-3-02-110, fda-pcac-2024-thymosin-alpha-1-briefing, ema-medicines-json] }
