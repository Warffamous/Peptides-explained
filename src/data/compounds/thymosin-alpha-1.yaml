# Thymosin alpha-1 (thymalfasin) — locale-independent facts. Every value is sourced; see research/stubs-a.md.
slug: thymosin-alpha-1
tier: 2
status: stub
# authorised-nationally (23 October 2026; was 'investigational', which says "no authorisation" and gave
# the tile "Not approved. It is still being tested in trials."). It is authorised by national
# regulators: in Italy (Zadaxin, since 1996: EMA orphan page, FDA 2024 briefing; AIFA's own database
# checked 22 October 2026 but aifa.gov.it is not on the allowlist), India and Hong Kong (FDA 2024
# briefing, citing CDSCO and the Hong Kong Drug Office); the maker reports more countries, which the FDA
# could not verify. It is not authorised centrally in the EU (EMA medicines data), in the Netherlands
# (CBG) or in the US (openFDA). No UK row: the MHRA products search was not settled (research/stubs-a.md).
# 'authorised' needs an official label from a regulator the site tracks (a row authorised or
# discontinued, and a product), which does not exist: Italy, India and Hong Kong are not tracked
# jurisdictions, so they are named in national_authorisations.
category: authorised-nationally
class: immunomodulatory
body_systems: [immune]
