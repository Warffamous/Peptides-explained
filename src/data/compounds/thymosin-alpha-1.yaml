authorised_products: []
# The countries the "approved?" tile names. Only those an official source supports: the FDA's 2024
# briefing (re-read 23 October 2026) says "approved in Italy as an adjuvant to the influenza vaccine in
# immunocompromised subjects" (AIFA database), "approved in India" for chronic hepatitis B (CDSCO) and
# "also approved in Hong Kong" (Drug Office), each checked by the FDA in June 2024; the EMA orphan page
# says it is authorised in Italy. The briefing also says it is "registered" in Indonesia (BPOM label);
# the page names Italy, India and Hong Kong, so add Indonesia to the page and here together, or not at
# all. The maker's wider list is unverified (the FDA says so) and is never named in the tile.
national_authorisations:
  - { country: IT, as_of: 2026-10-22, sources: [ema-orphan-thymalfasin-eu-3-02-110, fda-pcac-2024-thymosin-alpha-1-briefing] }
