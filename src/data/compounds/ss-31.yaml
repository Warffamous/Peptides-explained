# authorised (was authorised-elsewhere until 23 October 2026): FDA accelerated approval of Forzinity (elamipretide) on 19 September 2025 for Barth
# syndrome in patients weighing at least 30 kg (NDA 215244). No EU, UK or Dutch authorisation; EU orphan
# designations only (EU/3/21/2430, EU/3/22/2614); no application in the October 2026 CHMP list.
