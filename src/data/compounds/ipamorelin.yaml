# Ipamorelin — locale-independent facts. Every value below is sourced; see research/ipamorelin.md.
slug: ipamorelin
tier: 1
status: complete
# experimental, not investigational. Ipamorelin did have a formal clinical programme: a phase 1
# PK/PD study (1999) and two phase 2 trials after bowel surgery run by Helsinn (NCT00672074,
# published as Beck 2014 with a negative result; NCT01280344, 320 patients, completed 2014, never
# published). The FDA reports that development was discontinued, and ClinicalTrials.gov lists no
# running or planned trial (22 October 2026). "investigational" would render "It is still being
# tested in trials", which is false. The vocabulary has no value for "development stopped"; see
# contract_issues in the group summary. Revisit if a new trial is registered.
