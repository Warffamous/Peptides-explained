  smiles_source: pubchem-cjc-1295
# 30 residues: human GHRH(1-29) with four substitutions (positions 2, 8, 15, 27) plus Lys30 carrying
# the DAC. Native residues at those positions (L-Ala, L-Asn, Gly, L-Met) from the FDA briefing.
sequence:
  display: "Tyr-D-Ala-Asp-Ala-Ile-Phe-Thr-Gln-Ser-Tyr-Arg-Lys-Val-Leu-Ala-Gln-Leu-Ser-Ala-Arg-Lys-Leu-Leu-Gln-Asp-Ile-Leu-Ser-Arg-Lys*-NH2 (*maleimidopropionyl on Lys30: the DAC)"
  residues: [Tyr, D-Ala, Asp, Ala, Ile, Phe, Thr, Gln, Ser, Tyr, Arg, Lys, Val, Leu, Ala, Gln, Leu, Ser, Ala, Arg, Lys, Leu, Leu, Gln, Asp, Ile, Leu, Ser, Arg, Lys]
  n_terminus: H
  c_terminus: NH2
  modifications:
    - { position: 2, label: "D-Ala: replaces L-Ala of human GHRH; D-alanine at this position resists cleavage by DPP-4" }
    - { position: 8, label: "Gln: replaces Asn of human GHRH, to avoid asparagine rearrangement or conversion to aspartic acid" }
    - { position: 15, label: "Ala: replaces Gly of human GHRH" }
    - { position: 27, label: "Leu: replaces Met of human GHRH, to prevent methionine oxidation" }
    - { position: 30, label: "Lys (added): its side-chain nitrogen carries a 3-maleimidopropionyl group, the drug affinity complex (DAC), which bonds covalently to a free thiol on albumin (Cys34) and other plasma proteins" }
  bridges: []
  source: gsrs-cjc-1295
