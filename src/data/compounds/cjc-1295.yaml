# CJC-1295: locale-independent facts. Every value below is sourced; see research/cjc-1295.md.
#
# Which molecule this page grades. "CJC-1295" was the developer's (ConjuChem, Montreal) name for the
# tetrasubstituted GHRH(1-29) with an extra C-terminal lysine carrying a maleimidopropionyl group
# (the "drug affinity complex", DAC). That is the molecule in PubChem CID 91971820, in the GSRS record
# (UNII 62RC32V9N7), in every human study and in the WADA List. The 29-residue peptide without the
# DAC lysine (sold as "CJC-1295 without DAC", "Mod GRF (1-29)", and called "CJC-1295 (free base)" by
# the FDA in 2024) is a different active moiety with no published pharmacology, PK or human data
# (fda-pcac-2024-cjc1295-briefing). It is described in the prose, not graded here, and deliberately
# not listed in names.other.
slug: cjc-1295
tier: 1
status: complete
# experimental, not investigational: the only clinical programme (ConjuChem, phase 1 2004-2005,
# phase 2 2005-2006) was stopped in 2006 and nothing has been registered since (ClinicalTrials.gov,
# 22 October 2026: one record, NCT00267527, terminated). Same reasoning as bpc-157.
category: experimental
