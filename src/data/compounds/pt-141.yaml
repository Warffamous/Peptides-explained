# Sequence: US label section 11 gives "Ac-Nle-cyclo-(Asp-His-D-Phe-Arg-Trp-Lys-OH)": a cyclic heptapeptide with
# an acetylated N-terminus and a free acid at the C-terminus. The ring is a lactam (amide) bond between the side
# chain of Asp (position 2) and the side chain of Lys (position 7); PubChem names it "(2->7)-lactam". Checked three
# ways on 22 October 2026: the label, the PubChem isomeric SMILES and the ChEMBL HELM notation. Melanotan II
# (PubChem CID 92432) has the same SMILES except for a C-terminal amide (-NH2) instead of the free acid.
sequence:
  display: "Ac-Nle-cyclo[Asp-His-D-Phe-Arg-Trp-Lys]-OH"
  residues: [Nle, Asp, His, D-Phe, Arg, Trp, Lys]
  n_terminus: Ac
  c_terminus: OH
  modifications:
    - { position: 1, label: "Nle (norleucine), a straight-chain building block not used in human proteins, carries an acetyl group at the start of the chain" }
    - { position: 4, label: "D-Phe: the mirror-image form of phenylalanine" }
  bridges:
    - { from: 2, to: 7, kind: lactam }
  source: fda-label-vyleesi-2020
