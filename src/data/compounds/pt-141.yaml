# Structured studies. "originating" = the developer, Palatin Technologies, and its licensee AMAG Pharmaceuticals
# (authors employed by them or funding stated by them). Funding is "industry" where the paper states it or every
# author worked for the developer; where developer and academic authors wrote it together and no funding statement
# could be read, it is "undisclosed".
# Every published human study we found is listed except later analyses of the same trials (White 2017 is the
# blood-pressure report of the Clayton 2016 trial; Althof 2019, Koochaki 2021, Simon 2022 and Clayton 2022 are
# further analyses of the phase 2b and phase 3 trials) and one retracted study (Safarinejad 2008, women).
