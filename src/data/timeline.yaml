# The history timeline (rendered by <Timeline /> on /history/timeline). Locale-independent facts only:
# id, year, optional exact date, category, the compounds on this site it concerns, where it happened (jurisdictions:
# a Dutch law [NL], an EU directive or the EMA [EU], an FDA action [US], WADA [WADA]; [] = global science or history,
# shown everywhere; a locale shows the rest only when one of them is its own, config/locales.json), and the sources
# that support it. An event is one jurisdiction's action, so that its words never name a jurisdiction the locale does
# not show: the FDA approval and the EU authorisation of a medicine are two events (<id> and <id>-eu or <id>-us; split
# on 24 October 2026, research/for-nl-site/MANIFEST-data.md). Several tags only when one text fits them all (the European
# falsified-Ozempic alerts).
# Titles and text are in src/i18n/<locale>/timeline.json. Every date was checked on 22 October 2026 against the
# source listed (Drugs@FDA ORIG-1 dates, EMA EPAR authorisation dates, the act itself for laws); see
# research/history.md. An event without `date` is known to the year only. Re-checked by the independent fact-checker
# on 22 October 2026 (openFDA ORIG-1 dates, the EMA medicines JSON, the acts); see research/history.md, "Fact-check log".
# `compounds` may only name compounds that have a data file in src/data/compounds/ (21 on 24 October 2026, including
# pt-141 and tesamorelin; afamelanotide has none).
# English refocus (24 October 2026, group about-history-en; research/refocus/feeds-help-extras.md section 3, fact-checked):
# UK, Canadian and Australian events added so the English timeline (US, UK, CA, AU and global events) is balanced.
# The EU and NL events stay for the Dutch site (hidden on English). Canadian events do not cite the Federal Court of
# Appeal decision (its title names a company; content brief), so the 1962 sale ban and the 1963 efficacy rule are not
# events; the Canadian thalidomide dates conflict between official records, so only the year is given.

