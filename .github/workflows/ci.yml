name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Content schemas, editorial guardrails, RTL stylelint, then all four builds (root, /a, /b, /c)
      - run: npm run build:all
      # The load-bearing wall: zero commercial outbound links, anywhere
      - run: npm run check:commerce
      # One h1, heading order, landmarks, unique ids, internal links, JS budget (≤ 40 KB gz)
      - run: npm run check:html
      - name: Lighthouse (mobile, all three design systems)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
